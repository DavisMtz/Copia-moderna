<!DOCTYPE html>
<!--
  =====================================================================
   Ventel · Visor avanzado de artículos
   Muestra todo lo que la página de Liverpool guarda sobre cada artículo,
   incluido lo que no se ve a simple vista.
   Hecho por su gran amigo David Martínez "El escritor" · v1.3 · 01/08/2026
  =====================================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ventel · Visor de artículos</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="cabecera">
    <div class="contenedor cabecera-fila">
      <div class="marca">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        <div>
          <h1>Visor avanzado de artículos</h1>
          <p class="origen" id="origen">Cargando…</p>
        </div>
      </div>
      <div class="cabecera-acciones">
        <button id="btnActualizar" class="btn btn-sec" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          Actualizar
        </button>
        <button id="btnJson" class="btn btn-sec" type="button">Exportar JSON</button>
        <button id="btnCsv" class="btn btn-sec" type="button">Exportar CSV</button>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <section class="tarjetas-resumen" id="resumen" aria-label="Resumen de la extracción"></section>

    <div class="barra-herramientas">
      <div class="campo-busqueda">
        <label class="etiqueta-oculta" for="buscar">Buscar artículo</label>
        <svg class="icono-busqueda" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="buscar" type="search" placeholder="SKU, nombre, marca, color, proveedor…" autocomplete="off">
      </div>
      <div class="filtros" role="group" aria-label="Filtros">
        <button class="chip activo" data-filtro="todos" type="button">Todos</button>
        <button class="chip" data-filtro="descuento" type="button">Con descuento</button>
        <button class="chip" data-filtro="msi" type="button">Con MSI</button>
        <button class="chip" data-filtro="marketplace" type="button">Marketplace</button>
      </div>
      <label class="campo-orden">
        <span class="etiqueta-oculta">Ordenar por</span>
        <select id="orden">
          <option value="orden">Orden de la página</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="descuento">Mayor descuento</option>
          <option value="nombre">Nombre (A-Z)</option>
        </select>
      </label>
    </div>

    <p class="conteo" id="conteo" aria-live="polite"></p>

    <section class="rejilla" id="rejilla" aria-label="Artículos encontrados"></section>

    <div class="vacio" id="vacio" hidden>
      <h2>Sin artículos que mostrar</h2>
      <p id="vacioTexto">Abre la bolsa de compras o la ficha de un producto de Liverpool y pulsa <strong>Abrir visor avanzado</strong> desde la extensión.</p>
    </div>

    <details class="bloque-diagnostico" id="diagnostico">
      <summary>Fuentes de datos detectadas en la página</summary>
      <div id="diagnosticoCuerpo"></div>
    </details>
  </main>

  <!-- Panel de detalle -->
  <div class="velo" id="velo" hidden></div>
  <aside class="panel" id="panel" aria-labelledby="panelTitulo" role="dialog" aria-modal="true" hidden>
    <header class="panel-cabecera">
      <div>
        <p class="panel-sobretitulo" id="panelMarca"></p>
        <h2 id="panelTitulo"></h2>
      </div>
      <button id="btnCerrar" class="btn-icono" type="button" aria-label="Cerrar detalle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </header>
    <div class="panel-cuerpo" id="panelCuerpo"></div>
    <footer class="panel-pie">
      <button id="btnCopiarFicha" class="btn btn-sec" type="button">Copiar ficha (JSON)</button>
      <a id="btnAbrirFicha" class="btn btn-pri" target="_blank" rel="noopener">Abrir en Liverpool</a>
    </footer>
  </aside>

  <div class="aviso-flotante" id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="deep-extractor.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
