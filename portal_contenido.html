<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido del Portal - Sistema Ventel</title>
    <!-- Preferencias de vista (tema · densidad · texto · contraste) ANTES del tema,
         igual que el resto de pantallas: sin esto la vista ignora el tema del usuario. -->
    <?!= include('ViewPrefsPartial'); ?>
    <?!= include('app_theme'); ?>
    <style>
      /* ═══ Contenido del Portal ═══════════════════════════════════════════════
         QUIÉN LA USA: un supervisor con prisa que viene a arreglar UNA cosa —un
         enlace roto, una plantilla nueva, la vigencia de una promo— y volver a lo
         suyo. Es herramienta interna: densidad alta, mucha fila visible, nada de
         aire decorativo.

         ACCIÓN PRINCIPAL: guardar una entrada. Solo hay una primaria en pantalla.
         Duplicar, mover y borrar son secundarias o terciarias, siempre.

         Consume los tokens de app_theme y NO redefine colores. Lo único propio es
         la escala de espaciado/tipografía y los componentes de esta pantalla. */
      .pc-wrap{
        --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
        --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.875rem; --fs-lg:1.0625rem;
        color:var(--ink); font-family:var(--f-ui); font-size:var(--fs-md); line-height:1.5;
      }
      .pc-wrap *{box-sizing:border-box}
      /* La utilidad `max-w-[1180px]` del marcado NO existe en app_tailwind (el CSS
         compilado no trae ninguna clase max-w-[...]), así que el ancho máximo y el
         centrado se declaran aquí, que es donde sí se aplican. */
      #main-content{max-width:1180px;margin-inline:auto;min-width:0}
      .pc-wrap,.pc-card{max-width:100%}
      .pc-wrap .ic{display:inline-block;width:1em;height:1em;vertical-align:-.15em;flex:none}
      .pc-hidden{display:none !important}
      /* Texto solo para lectores de pantalla. app_tailwind no compila `sr-only`, así
         que la etiqueta del buscador se habría quedado visible encima del campo. */
      .pc-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
        clip:rect(0 0 0 0);white-space:nowrap;border:0}

      .pc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);
        box-shadow:var(--sh-sm)}

      /* ── Conmutador de secciones ───────────────────────────────────────────
         Es el eje de la pantalla: decide QUÉ se está publicando. Por eso va
         arriba del todo, siempre visible, y no escondido en un <select>. */
      .pc-secs{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s5)}
      .pc-sec{display:inline-flex;align-items:center;gap:var(--s2);border:1.5px solid var(--line);
        background:var(--surface);border-radius:999px;padding:var(--s2) var(--s4);font:inherit;
        font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);cursor:pointer;transition:var(--tr)}
      .pc-sec:hover{border-color:var(--brand-soft);color:var(--ink)}
      .pc-sec:focus-visible{outline:none;box-shadow:var(--ring)}
      .pc-sec[aria-selected="true"]{border-color:var(--brand);background:var(--brand-tint);
        color:var(--brand-deep);font-weight:700}
      .pc-sec .n{font-size:var(--fs-xs);font-weight:700;background:var(--surface-2);color:var(--ink-faint);
        border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
      .pc-sec[aria-selected="true"] .n{background:var(--surface);color:var(--brand-deep)}
      /* Anuncios no se edita aquí: se va al constructor que ya existe. El estilo
         punteado dice "esto te saca de esta pantalla" antes de pulsarlo. */
      .pc-sec.pc-sec-ext{border-style:dashed}

      /* ── Cabecera de la sección abierta ── */
      .pc-head{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap;
        padding:var(--s5);border-bottom:1px solid var(--line-soft)}
      .pc-head-t{flex:1 1 320px;min-width:0;overflow-wrap:anywhere}
      .pc-head h2{font-size:var(--fs-lg);font-weight:800;color:var(--ink);margin:0 0 2px;letter-spacing:-.01em}
      .pc-head p{font-size:var(--fs-sm);color:var(--ink-soft);margin:0;max-width:62ch}
      .pc-donde{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s2);
        font-size:var(--fs-xs);font-weight:600;color:var(--ink-faint)}
      .pc-donde .ic{width:13px;height:13px}
      .pc-head-a{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}

      /* ── Barra de búsqueda ── */
      .pc-tools{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;
        padding:var(--s3) var(--s5);border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
      .pc-search{position:relative;flex:1 1 260px;min-width:0}
      .pc-search .ic{position:absolute;left:var(--s3);top:50%;transform:translateY(-50%);
        width:15px;height:15px;color:var(--ink-faint);pointer-events:none}
      .pc-search input{padding-left:34px}
      .pc-count{font-size:var(--fs-xs);font-weight:600;color:var(--ink-faint);
        font-variant-numeric:tabular-nums;white-space:nowrap}

      /* ── Lista de filas ───────────────────────────────────────────────────
         Filas, no tabla: el número de columnas cambia con cada sección y una
         tabla de 6 columnas de texto largo no se lee ni cabe en un portátil. */
      .pc-list{padding:var(--s2) 0}
      /* GRID y no flex, por una razón concreta: `minmax(0,1fr)` es la única forma que
         GARANTIZA que la columna de texto puede encogerse hasta cero. En flex, ni
         `min-width:0` ni `flex-basis:0` ni `overflow:hidden` impiden que un título con
         white-space:nowrap imponga su ancho como mínimo de toda la fila — y ese era el
         motivo de que la página se fuera 150 px a la derecha entre 680 y 1100 px. */
      .pc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
        gap:var(--s3);padding:var(--s3) var(--s5);
        border-bottom:1px solid var(--line-soft);transition:background .12s}
      .pc-row:last-child{border-bottom:0}
      .pc-row:hover{background:var(--surface-2)}
      /* Marca de aviso + acciones: van juntas en la columna que NO se encoge. */
      .pc-row-r{display:flex;align-items:center;gap:var(--s3);justify-content:flex-end}
      .pc-row-t{min-width:0;overflow:hidden}
      .pc-row-n{font-size:var(--fs-md);font-weight:600;color:var(--ink);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .pc-row-s{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:1px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .pc-row-a{display:flex;gap:var(--s1);align-items:center;flex:none}

      /* Botón de acción de fila: cuadrado, solo icono, con nombre accesible. */
      .pc-ia{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
        border:1px solid transparent;background:none;border-radius:var(--rad-sm);color:var(--ink-faint);
        cursor:pointer;transition:var(--tr)}
      .pc-ia .ic{width:16px;height:16px}
      .pc-ia:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
      .pc-ia:focus-visible{outline:none;box-shadow:var(--ring)}
      .pc-ia:disabled{opacity:.3;cursor:not-allowed}
      .pc-ia.danger:hover{color:var(--alert);border-color:var(--alert);background:var(--alert-bg)}

      /* Señal de enlace que no va a abrir. Color + icono + texto: el color solo
         no informa a todo el mundo. */
      .pc-flag{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:700;
        color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:2px 8px;flex:none}
      .pc-flag .ic{width:12px;height:12px}

      /* ── Estados: vacío, sin resultados, error, carga ── */
      .pc-estado{padding:var(--s6) var(--s5);text-align:center;max-width:46ch;margin:0 auto}
      .pc-estado .big{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;
        border-radius:var(--rad);background:var(--surface-2);color:var(--ink-faint);margin-bottom:var(--s3)}
      .pc-estado .big .ic{width:22px;height:22px}
      .pc-estado h3{font-size:var(--fs-md);font-weight:700;color:var(--ink);margin:0 0 var(--s1)}
      .pc-estado p{font-size:var(--fs-sm);color:var(--ink-soft);margin:0 0 var(--s4);line-height:1.55}
      .pc-sk{height:52px;border-bottom:1px solid var(--line-soft);
        background:linear-gradient(90deg,var(--surface-2) 25%,var(--line-soft) 50%,var(--surface-2) 75%);
        background-size:200% 100%;animation:pcSk 1.4s linear infinite}
      @keyframes pcSk{0%{background-position:200% 0}100%{background-position:-200% 0}}

      /* Aviso de columna ausente: si un campo del formulario no tiene columna en la
         hoja, lo que se escriba ahí no llega a ninguna parte. Hay que decirlo. */
      .pc-aviso{display:flex;gap:var(--s2);align-items:flex-start;margin:var(--s4) var(--s5) 0;
        padding:var(--s3);border-radius:var(--rad-sm);background:var(--warn-bg);color:var(--warn);
        font-size:var(--fs-sm);font-weight:600;line-height:1.45}
      .pc-aviso .ic{width:16px;height:16px;flex:none;margin-top:1px}

      /* ── Editor lateral ───────────────────────────────────────────────────
         Panel y no modal: el supervisor necesita seguir viendo la lista mientras
         edita, para comparar con las entradas que ya existen. */
      .pc-scrim{position:fixed;inset:0;background:rgba(27,35,48,.44);backdrop-filter:blur(2px);
        z-index:300;opacity:0;pointer-events:none}
      .pc-scrim.on{opacity:1;pointer-events:auto}
      .pc-drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:301;
        background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh-lg);
        display:flex;flex-direction:column;transform:translateX(100%)}
      /* `display:flex` de la regla de arriba GANA al display:none que el navegador
         aplica por el atributo [hidden] (una clase pesa más que un estilo de agente
         de usuario). Sin esta línea el panel se ve siempre. */
      .pc-drawer[hidden]{display:none}
      .pc-drawer.on{transform:none}
      .pc-dr-hd{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s5);
        border-bottom:1px solid var(--line-soft);flex:none}
      .pc-dr-hd h2{font-size:var(--fs-lg);font-weight:800;color:var(--ink);margin:0;letter-spacing:-.01em}
      .pc-dr-hd p{font-size:var(--fs-sm);color:var(--ink-soft);margin:2px 0 0}
      .pc-dr-body{flex:1 1 auto;overflow-y:auto;padding:var(--s5)}
      .pc-dr-foot{flex:none;display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);
        border-top:1px solid var(--line-soft);background:var(--surface-2)}
      .pc-dr-foot .v-btn-primary{flex:1}
      @media(max-width:640px){
        .pc-drawer{width:100%;top:auto;height:92vh;border-left:0;border-top-left-radius:var(--rad-lg);
          border-top-right-radius:var(--rad-lg);transform:translateY(100%)}
        .pc-drawer.on{transform:none}
      }

      /* ── Modo rápido (importación) ─────────────────────────────────────────
         Va en el mismo panel lateral, pero más ancho: aquí hay que leer una tabla
         de previsualización y en 520 px no se lee nada. */
      .pc-drawer.ancho{width:min(820px,100%)}

      .pc-tabs{display:flex;gap:var(--s1);background:var(--surface-2);border:1px solid var(--line);
        border-radius:var(--rad-sm);padding:3px;margin-bottom:var(--s5)}
      .pc-tab{flex:1;border:0;background:none;border-radius:6px;padding:var(--s2) var(--s3);
        font:inherit;font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);cursor:pointer;
        transition:var(--tr)}
      .pc-tab:hover{color:var(--ink)}
      .pc-tab[aria-selected="true"]{background:var(--surface);color:var(--brand-deep);box-shadow:var(--sh-xs)}
      .pc-tab:focus-visible{outline:none;box-shadow:var(--ring)}

      .pc-paso{margin-bottom:var(--s5)}
      .pc-paso>h3{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;
        color:var(--ink-faint);margin:0 0 var(--s2)}
      .pc-wrap textarea.pc-pegar{min-height:130px;font-family:var(--f-mono,ui-monospace,SFMono-Regular,Menlo,monospace);
        font-size:var(--fs-xs);line-height:1.5;white-space:pre;overflow-wrap:normal;overflow-x:auto}

      /* Tabla de previsualización: el scroll horizontal vive AQUÍ dentro, nunca en la
         página. Una tabla ancha no puede arrastrar consigo a toda la pantalla. */
      .pc-tabla-caja{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad-sm);max-width:100%}
      .pc-tabla{border-collapse:collapse;font-size:var(--fs-xs);white-space:nowrap;min-width:100%}
      .pc-tabla th,.pc-tabla td{padding:6px var(--s2);border-bottom:1px solid var(--line-soft);text-align:left;
        max-width:230px;overflow:hidden;text-overflow:ellipsis}
      .pc-tabla thead th{background:var(--surface-2);position:sticky;top:0;font-weight:700;color:var(--ink-soft)}
      .pc-tabla tbody tr:last-child td{border-bottom:0}
      .pc-tabla select{width:100%;font:inherit;font-size:var(--fs-xs);padding:2px 4px;
        border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}

      /* Resumen del análisis: números grandes, uno por desenlace posible. */
      .pc-resumen{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
      .pc-chip{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:var(--rad-sm);
        padding:var(--s2) var(--s3);min-width:88px;background:var(--surface)}
      .pc-chip b{font-size:1.15rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
      .pc-chip span{font-size:var(--fs-xs);font-weight:600;color:var(--ink-faint)}
      .pc-chip.nueva{border-color:var(--ok);background:var(--ok-bg)} .pc-chip.nueva b{color:var(--ok)}
      .pc-chip.actualiza{border-color:var(--info);background:var(--info-bg)} .pc-chip.actualiza b{color:var(--info)}
      .pc-chip.igual b{color:var(--ink-faint)}
      .pc-chip.duplicada{border-color:var(--warn);background:var(--warn-bg)} .pc-chip.duplicada b{color:var(--warn)}
      .pc-chip.error{border-color:var(--alert);background:var(--alert-bg)} .pc-chip.error b{color:var(--alert)}

      .pc-plan{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--rad-sm)}
      .pc-plan-i{display:flex;align-items:baseline;gap:var(--s2);padding:6px var(--s3);
        border-bottom:1px solid var(--line-soft);font-size:var(--fs-xs)}
      .pc-plan-i:last-child{border-bottom:0}
      .pc-plan-i .et{flex:none;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
        font-size:.6875rem;min-width:74px}
      .pc-plan-i .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
        font-weight:600;color:var(--ink)}
      .pc-plan-i .de{flex:none;color:var(--ink-faint);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .pc-plan-i[data-a=nueva] .et{color:var(--ok)}
      .pc-plan-i[data-a=actualiza] .et{color:var(--info)}
      .pc-plan-i[data-a=igual] .et{color:var(--ink-faint)}
      .pc-plan-i[data-a=duplicada] .et{color:var(--warn)}
      .pc-plan-i[data-a=error] .et{color:var(--alert)}

      .pc-nota{display:flex;gap:var(--s2);align-items:flex-start;border-radius:var(--rad-sm);
        padding:var(--s3);font-size:var(--fs-sm);line-height:1.45;background:var(--info-bg);color:var(--info);
        font-weight:600;margin-bottom:var(--s3)}
      .pc-nota.warn{background:var(--warn-bg);color:var(--warn)}
      .pc-nota .ic{width:16px;height:16px;flex:none;margin-top:1px}

      .pc-hojas{display:flex;flex-direction:column;gap:var(--s1);max-height:230px;overflow-y:auto;
        border:1px solid var(--line);border-radius:var(--rad-sm);padding:var(--s1)}
      .pc-hoja{display:flex;align-items:center;gap:var(--s2);border:0;background:none;border-radius:6px;
        padding:var(--s2) var(--s3);font:inherit;font-size:var(--fs-sm);color:var(--ink);cursor:pointer;
        text-align:left;width:100%;transition:var(--tr)}
      .pc-hoja:hover{background:var(--surface-2)}
      .pc-hoja[aria-pressed="true"]{background:var(--brand-tint);color:var(--brand-deep);font-weight:700}
      .pc-hoja:focus-visible{outline:none;box-shadow:var(--ring)}
      .pc-hoja .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .pc-hoja .pe{flex:none;font-size:var(--fs-xs);color:var(--ink-faint);font-variant-numeric:tabular-nums}
      .pc-hoy{flex:none;font-size:.625rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
        background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:2px 7px}

      /* ── Campos ── */
      .pc-field+.pc-field{margin-top:var(--s4)}
      .pc-lbl{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);
        font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);margin-bottom:var(--s1)}
      .pc-req{color:var(--brand);font-weight:800}
      .pc-help{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:var(--s1);line-height:1.45}
      .pc-wrap textarea.v-textarea{min-height:84px;resize:vertical}
      .pc-cc{font-size:var(--fs-xs);font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums}
      .pc-cc.warn{color:var(--warn)} .pc-cc.over{color:var(--alert)}
      .pc-err{display:none;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;
        color:var(--alert);margin-top:var(--s1)}
      .pc-err.on{display:flex}
      .pc-err .ic{width:13px;height:13px;flex:none}
      /* Aviso (no error): el valor se puede guardar, pero no va a funcionar. */
      .pc-warn{display:flex;align-items:flex-start;gap:6px;font-size:var(--fs-xs);font-weight:600;
        color:var(--warn);margin-top:var(--s1);line-height:1.45}
      .pc-warn .ic{width:13px;height:13px;flex:none;margin-top:2px}
      .pc-wrap [aria-invalid="true"]{border-color:var(--alert)}
      .pc-wrap [aria-invalid="true"]:focus{box-shadow:0 0 0 4px var(--alert-bg)}
      /* Campo que no tiene columna en la hoja: se enseña deshabilitado y explicado,
         no se esconde. Esconderlo dejaría al supervisor buscando un campo que la
         documentación dice que existe. */
      .pc-field.sin-col .v-input,.pc-field.sin-col .v-textarea{opacity:.55;pointer-events:none}

      /* ── Móvil: la fila deja de ser una fila ──────────────────────────────
         En un teléfono no caben el título, la marca de enlace roto y seis
         acciones en la misma línea (a 360 px sobran unos 20). En vez de dejar
         que la tabla se salga en horizontal —que es como se pierde el botón de
         borrar sin enterarse— cada parte baja a su propia línea. */
      @media(max-width:680px){
        .pc-head,.pc-tools,.pc-row{padding-left:var(--s4);padding-right:var(--s4)}
        /* Una sola columna: título arriba, marca y acciones debajo. */
        .pc-row{grid-template-columns:minmax(0,1fr);gap:var(--s2)}
        /* Ya no compite por el ancho: el texto puede ocupar dos líneas. */
        .pc-row-n,.pc-row-s{white-space:normal}
        .pc-row-r{flex-wrap:wrap;justify-content:space-between}
        .pc-ia{width:36px;height:36px}   /* objetivo táctil, ya hay sitio */
      }

      @media (prefers-reduced-motion:reduce){
        .pc-sk{animation:none}
      }
    </style>
<?!= include('app_tailwind'); ?>
</head>
<body class="h-full text-slate-800">
    <div class="app-aurora"></div>

    <main id="main-content" class="max-w-[1180px] mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-6" data-animate>
            <h1 class="text-3xl font-bold tracking-tight" style="color:var(--ink)">Contenido del Portal</h1>
            <p class="mt-1" style="color:var(--ink-soft)">
              Todo lo que el equipo ve en el Portal —herramientas, plantillas, formatos, promociones— se
              edita desde aquí. Se guarda en la hoja del Portal y el cambio aparece al recargar.
            </p>
        </header>

        <div class="pc-wrap" data-animate>
          <div class="pc-secs" id="secciones" role="tablist" aria-label="Secciones del Portal"></div>

          <div class="pc-card" id="panel">
            <div class="pc-head">
              <div class="pc-head-t">
                <h2 id="secNombre">Cargando…</h2>
                <p id="secResumen"></p>
                <span class="pc-donde" id="secDonde"></span>
              </div>
              <div class="pc-head-a">
                <button class="v-btn v-btn-ghost pc-hidden" id="btnRapido" type="button">Modo rápido</button>
                <button class="v-btn v-btn-primary pc-hidden" id="btnNuevo" type="button">Nueva entrada</button>
              </div>
            </div>

            <div id="avisoCols" class="pc-aviso pc-hidden" role="status"></div>

            <div class="pc-tools" id="tools">
              <label class="pc-search">
                <span class="ic" aria-hidden="true"></span>
                <span class="pc-sr">Buscar en esta sección</span>
                <input class="v-input" type="search" id="buscar" placeholder="Buscar en esta sección…" autocomplete="off">
              </label>
