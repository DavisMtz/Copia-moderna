  <style>
  /**
   * =====================================================================================
   * ESTADO DE OPERACIÓN · tablero público
   * =====================================================================================
   * Es la ÚNICA pantalla del sistema que se puede abrir sin sesión, y por eso lo que enseña
   * está partido en dos:
   *
   *   · SIN sesión → qué sistema falla, con qué gravedad, desde cuándo y el último
   *     comunicado que supervisión decidió publicar. Ni un nombre, ni un correo, ni una
   *     captura. Eso lo garantiza el servidor (opEstadoPublico), no un filtro de aquí.
   *
   *   · CON sesión → además, los reportes del equipo con sus notas y sus evidencias, y la
   *     bitácora completa de actualizaciones.
   *
   * ── LA PREGUNTA QUE CONTESTA LA PANTALLA ─────────────────────────────────────────────
   *
   * Quien llega aquí llega con UNA pregunta: "¿está caído o soy yo?". Todo el diseño está
   * ordenado para contestarla antes de leer nada:
   *
   *   1. TITULAR (lo primero y lo más grande) — la respuesta en tres palabras.
   *   2. ANILLO — cuántos sistemas de cuántos están bien. La proporción se ve, no se cuenta.
   *   3. TARJETAS — cuál falla, con qué gravedad y desde cuándo.
   *   4. INCIDENCIAS — el detalle, para quien lo necesite.
   *
   * El movimiento sigue ese mismo orden: la entrada no adorna, ENSEÑA A LEER la pantalla.
   * Se hace con GSAP (timeline + SplitText + ScrollTrigger) y se apaga entero con
   * prefers-reduced-motion, donde todo aparece ya colocado.
   *
   * ── SISTEMA VISUAL ───────────────────────────────────────────────────────────────────
   *
   * Una sola familia (Inter, la del sistema), una escala de espacio de 4 px, un radio por
   * tamaño de pieza y UN mecanismo de separación por capa: el fondo separa con luz, las
   * tarjetas con borde, y la sombra queda reservada a lo que de verdad flota (barra
   * superior y hoja lateral). Nada lleva borde + sombra + fondo distinto a la vez.
   *
   * El color de estado NUNCA viaja solo: siempre va con icono y con palabra.
   */

  /* ═══════════════════════════════════════════════════════════════════════════
     TOKENS LOCALES
     ═══════════════════════════════════════════════════════════════════════════
     --e-ok/--e-warn/--e-alert/--e-info: los tokens globales están elegidos para fondo
     CLARO y app_theme no los aclara en carbón: sobre #0E1014 caen a ~2,5:1. Se corrigen
     UNA vez aquí y lo heredan punto, barra, insignia, anillo y línea de tiempo. El token
     global no se toca: en otras pantallas se usa como fondo de hovers.

     El resto son medidas de esta pantalla, declaradas una vez para no repartir números
     sueltos por el archivo. */
  body {
    --e-ok: var(--ok); --e-warn: var(--warn); --e-alert: var(--alert); --e-info: var(--info);
    --e-ok-soft: rgba(14,122,79,.12);
    --e-warn-soft: rgba(180,83,9,.12);
    --e-alert-soft: rgba(200,30,60,.12);
    --e-info-soft: rgba(29,78,216,.12);

    --e-s1: 4px;  --e-s2: 8px;  --e-s3: 12px; --e-s4: 16px;
    --e-s5: 24px; --e-s6: 32px; --e-s7: 48px; --e-s8: 72px;

    --e-rad-sm: 10px; --e-rad: 16px; --e-rad-lg: 22px; --e-rad-xl: 28px;

    --e-lift: 0 1px 2px rgba(16,24,40,.05), 0 18px 44px -22px rgba(16,24,40,.30);
    --e-lift-alta: 0 2px 6px rgba(16,24,40,.07), 0 30px 64px -26px rgba(16,24,40,.38);
    --e-filo: inset 0 1px 0 rgba(255,255,255,.7);

    --e-ease: cubic-bezier(.2,.8,.2,1);
  }
  [data-theme="carbon"] body {
    --e-ok: #4ADE80; --e-warn: #F2B65A; --e-alert: #FCA5A5; --e-info: #93B4FF;
    --e-ok-soft: rgba(74,222,128,.14);
    --e-warn-soft: rgba(242,182,90,.14);
    --e-alert-soft: rgba(252,165,165,.14);
    --e-info-soft: rgba(147,180,255,.14);

    --e-lift: 0 1px 2px rgba(0,0,0,.45), 0 20px 48px -24px rgba(0,0,0,.75);
    --e-lift-alta: 0 2px 6px rgba(0,0,0,.5), 0 34px 70px -28px rgba(0,0,0,.82);
    --e-filo: inset 0 1px 0 rgba(255,255,255,.07);
  }

  /* Cada pieza toma su color del tono con UNA variable, así ninguna regla tiene que
     repetirse cuatro veces. --e-tono lo pone la clase .tono-* del contenedor. */
  .tono-ok    { --e-tono: var(--e-ok);    --e-tono-bg: var(--e-ok-soft); }
  .tono-warn  { --e-tono: var(--e-warn);  --e-tono-bg: var(--e-warn-soft); }
  .tono-alert { --e-tono: var(--e-alert); --e-tono-bg: var(--e-alert-soft); }
  .tono-info  { --e-tono: var(--e-info);  --e-tono-bg: var(--e-info-soft); }
  .tono-neutro{ --e-tono: var(--ink-faint); --e-tono-bg: var(--surface-2); }

  /* ═══════════════════════════════════════════════════════════════════════════
     FONDO CINEMATOGRÁFICO
     ═══════════════════════════════════════════════════════════════════════════
     Dos halos muy difusos y una retícula casi invisible. El halo grande se tiñe con el
     TONO GLOBAL: cuando algo falla, la pantalla entera cambia de temperatura antes de
     que nadie haya leído una palabra. Es la señal más rápida que hay en la página, y por
     eso es tan tenue: informa de reojo, no compite con el titular.
     Van en un elemento fijo y detrás de todo; se mueven con parallax por transform, que
     no repinta el documento. */
  .est-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .est-bg span { position: absolute; display: block; border-radius: 50%; filter: blur(60px); }
  .est-bg .est-halo-1 {
    width: 70vw; height: 70vw; max-width: 900px; max-height: 900px;
    top: -28vw; right: -14vw;
    background: radial-gradient(circle, var(--e-tono-glow, rgba(225,0,152,.16)), transparent 68%);
    opacity: .9;
  }
  .est-bg .est-halo-2 {
    width: 52vw; height: 52vw; max-width: 640px; max-height: 640px;
    bottom: -22vw; left: -16vw;
    background: radial-gradient(circle, rgba(109,40,217,.10), transparent 70%);
  }
  .est-bg .est-malla {
    inset: 0; width: 100%; height: 100%; border-radius: 0; filter: none;
    background-image:
      linear-gradient(to right, currentColor 1px, transparent 1px),
      linear-gradient(to bottom, currentColor 1px, transparent 1px);
    background-size: 64px 64px;
    color: var(--ink);
    opacity: .028;
    mask-image: radial-gradient(70% 55% at 50% 0%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(70% 55% at 50% 0%, #000 0%, transparent 78%);
  }
  body.tono-warn  { --e-tono-glow: rgba(180,83,9,.20); }
  body.tono-alert { --e-tono-glow: rgba(200,30,60,.22); }
  [data-theme="carbon"] body.tono-warn  { --e-tono-glow: rgba(242,182,90,.16); }
  [data-theme="carbon"] body.tono-alert { --e-tono-glow: rgba(252,165,165,.18); }

  /* ═══════════════════════════════════════════════════════════════════════════
     BARRA SUPERIOR
     ═══════════════════════════════════════════════════════════════════════════
     Se queda pegada arriba porque las acciones —ir al portal, reportar— tienen que estar
     a mano después de haber bajado a leer una incidencia larga. */
  .est-bar {
    position: sticky; top: 0; z-index: 60;
    background: color-mix(in srgb, var(--app-bg) 78%, transparent);
    -webkit-backdrop-filter: blur(16px) saturate(1.6);
    backdrop-filter: blur(16px) saturate(1.6);
    border-bottom: 1px solid transparent;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  @supports not (background: color-mix(in srgb, red 50%, transparent)) {
    .est-bar { background: var(--app-bg); }
  }
  .est-bar.est-pegada { border-bottom-color: var(--line); box-shadow: 0 10px 30px -24px rgba(16,24,40,.5); }
  .est-bar-in {
    max-width: 1080px; margin: 0 auto;
    padding: var(--e-s3) var(--e-s5);
    display: flex; align-items: center; gap: var(--e-s3); flex-wrap: wrap;
  }
  /* El SVG del logo es BLANCO: está hecho para la cabecera oscura del sitio y sobre el
     fondo claro de esta página se veía como una mancha gris. En los temas claros se
     invierte a tinta; en carbón se deja tal cual, que ahí sí es el color correcto. */
  .est-logo { height: 24px; width: auto; filter: brightness(0) opacity(.82); }
  [data-theme="carbon"] .est-logo { filter: none; }
  .est-bar-sep { width: 1px; height: 22px; background: var(--line); }
  .est-bar-tit {
    font-family: var(--f-display); font-size: .95rem; font-weight: 700;
    letter-spacing: -.01em; color: var(--ink); line-height: 1.2;
  }
  .est-bar-tit em {
    display: block; font-style: normal; font-size: .68rem; font-weight: 650;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
  }
  .est-bar-acc { margin-left: auto; display: flex; align-items: center; gap: var(--e-s2); flex-wrap: wrap; }
  .est-bar-acc .v-btn { white-space: nowrap; }

  /* ═══════════════════════════════════════════════════════════════════════════
     ESTRUCTURA
     ═══════════════════════════════════════════════════════════════════════════ */
  .est-wrap { max-width: 1080px; margin: 0 auto; padding: var(--e-s7) var(--e-s5) var(--e-s8); }
  .est-seccion { margin-top: var(--e-s8); }

  /* Rótulo de sección: la línea llega hasta el borde y el contador va al final, así la
     vista sabe dónde empieza y dónde acaba cada bloque sin necesidad de más margen. */
  .est-rot {
    display: flex; align-items: center; gap: var(--e-s3); margin: 0 0 var(--e-s5);
    font-family: var(--f-display); font-size: .72rem; font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint);
  }
  .est-rot::after { content: ''; flex: 1; height: 1px;
    background: linear-gradient(to right, var(--line), transparent); }
  .est-rot b {
    font-size: .72rem; font-weight: 800; color: var(--ink-soft);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 9px; letter-spacing: .04em;
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     PORTADA · titular + anillo
     ═══════════════════════════════════════════════════════════════════════════ */
  .est-hero {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    align-items: center; gap: var(--e-s7);
    padding: var(--e-s7) var(--e-s7) var(--e-s6);
    border-radius: var(--e-rad-xl);
    border: 1px solid var(--line);
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--e-tono) 6%, var(--surface)), var(--surface) 62%);
    box-shadow: var(--e-filo), var(--e-lift);
  }
  @supports not (background: color-mix(in srgb, red 50%, transparent)) {
    .est-hero { background: var(--surface); }
  }
  /* Filo superior en el color del estado. Es la única pieza de color pleno de la portada:
     el resto del bloque se mantiene neutro para que el titular no pelee con el fondo. */
  .est-hero::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--e-tono), transparent);
    opacity: .9;
  }
  .est-hero-tx { min-width: 0; }

  .est-eyebrow {
    display: inline-flex; align-items: center; gap: var(--e-s2);
    margin-bottom: var(--e-s4);
    font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    color: var(--e-tono);
  }
  /* Punto "en vivo": anillo que se expande y se desvanece. Late SOLO este punto en toda
     la portada; si latieran varias cosas, ninguna significaría nada. */
  .est-vivo { position: relative; width: 8px; height: 8px; border-radius: 50%;
    background: var(--e-tono); flex: none; }
  .est-vivo::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid var(--e-tono);
    animation: est-pulso 2.6s cubic-bezier(.22,.8,.3,1) infinite;
  }
  @keyframes est-pulso {
    0%   { transform: scale(.7); opacity: .75; }
    70%  { transform: scale(2.4); opacity: 0; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .est-titulo {
    margin: 0 0 var(--e-s4);
    font-family: var(--f-display);
    font-size: clamp(2.1rem, 5.4vw, 3.4rem);
    font-weight: 800; letter-spacing: -.035em; line-height: 1.06;
    color: var(--ink);
    /* SplitText envuelve cada letra en su propia caja. NO se recorta con overflow:hidden:
       a esta interlínea, la caja de la letra no incluye el trazo bajo de la "y" de "Hay"
       y el recorte se la comía. Las letras entran desde abajo con opacidad, que da el
       mismo efecto de "asomarse" sin arriesgar el texto. */
  }
  .est-lead {
    margin: 0; max-width: 46ch;
    font-size: 1.02rem; line-height: 1.6; color: var(--ink-soft);
  }

  .est-meta {
    display: flex; align-items: center; gap: var(--e-s3); flex-wrap: wrap;
    margin-top: var(--e-s5); padding-top: var(--e-s4);
    border-top: 1px solid var(--line-soft);
    font-size: .78rem; font-weight: 650; color: var(--ink-faint);
  }
  .est-meta-sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5; }
  .est-meta-i { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  /* Cuenta atrás al siguiente refresco: contesta "¿esto que estoy mirando es de ahora?"
     sin obligar a nadie a pulsar recargar. */
  .est-tick { width: 14px; height: 14px; flex: none; transform: rotate(-90deg); }
  .est-tick circle { fill: none; stroke-width: 2.5; }
  .est-tick .est-tick-tr { stroke: var(--line); }
  .est-tick .est-tick-ar { stroke: var(--e-tono); stroke-linecap: round;
    stroke-dasharray: 34.56; stroke-dashoffset: 0; }

  /* ── Anillo ── */
  .est-anillo { position: relative; width: 190px; height: 190px; flex: none; }
  .est-anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .est-anillo circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .est-anillo .est-anillo-tr { stroke: var(--line); }
  .est-anillo .est-anillo-ar { stroke: var(--e-tono); stroke-dasharray: 471.24; stroke-dashoffset: 471.24; }
  .est-anillo-luz {
    position: absolute; inset: 14px; border-radius: 50%;
    background: radial-gradient(circle, var(--e-tono-bg), transparent 66%);
    opacity: .9; pointer-events: none;
  }
  .est-anillo-mid {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 2px;
  }
  .est-anillo-mid b {
    font-family: var(--f-display); font-size: 2.5rem; font-weight: 800;
    letter-spacing: -.04em; line-height: 1; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .est-anillo-mid small {
    font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); max-width: 11ch; line-height: 1.35;
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     TARJETAS DE SISTEMA
     ═══════════════════════════════════════════════════════════════════════════ */
  .est-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--e-s4); }
  .est-grid-min { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--e-s3); }

  .est-card {
    position: relative; overflow: hidden;
    padding: var(--e-s5); border-radius: var(--e-rad-lg);
    border: 1px solid var(--line); background: var(--surface);
    transition: border-color .25s ease, transform .25s var(--e-ease), box-shadow .25s ease;
  }
  /* Foco de luz que sigue al puntero. Es lo único que reacciona al ratón en la rejilla:
     da la sensación de superficie física sin mover la tarjeta de sitio ni un píxel. */
  .est-card::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(220px circle at var(--e-mx, 50%) var(--e-my, 0%),
                                var(--e-tono-bg), transparent 62%);
    opacity: 0; transition: opacity .3s ease;
  }
  .est-card:hover { border-color: color-mix(in srgb, var(--e-tono) 40%, var(--line)); }
  .est-card:hover::after { opacity: 1; }
  @supports not (background: color-mix(in srgb, red 50%, transparent)) {
    .est-card:hover { border-color: var(--e-tono); }
  }

  .est-card-top { display: flex; align-items: center; gap: var(--e-s3); margin-bottom: var(--e-s3); }
  .est-card-top h3 {
    margin: 0; font-family: var(--f-display); font-size: 1.05rem; font-weight: 700;
    letter-spacing: -.015em; color: var(--ink); min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .est-card-nota { margin: 0; font-size: .88rem; line-height: 1.6; color: var(--ink-soft); }
  .est-card-pie {
    display: flex; align-items: center; gap: var(--e-s2); margin-top: var(--e-s4);
    padding-top: var(--e-s3); border-top: 1px solid var(--line-soft);
    font-size: .75rem; font-weight: 650; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .est-card-pie svg { width: 13px; height: 13px; flex: none; }

  /* Fila secundaria: los sistemas que no son "de cara al cliente". Misma gramática,
     menos peso: sin nota y sin pie, solo nombre y estado. */
  .est-mini {
    display: flex; align-items: center; gap: var(--e-s3);
    padding: var(--e-s3) var(--e-s4); border-radius: var(--e-rad);
    border: 1px solid var(--line); background: var(--surface-2);
    transition: border-color .25s ease, background .25s ease;
  }
  .est-mini:hover { border-color: color-mix(in srgb, var(--e-tono) 34%, var(--line)); background: var(--surface); }
  .est-mini-tx { min-width: 0; line-height: 1.3; }
  .est-mini-tx b { display: block; font-size: .87rem; font-weight: 650; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .est-mini-tx small { font-size: .73rem; color: var(--ink-soft); }
  .est-mini.tono-warn, .est-mini.tono-alert, .est-mini.tono-info {
    background: var(--e-tono-bg); border-color: color-mix(in srgb, var(--e-tono) 34%, transparent);
  }

  /* ── Señales: punto e insignia ── */
  .est-dot {
    position: relative; width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: var(--e-tono);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--e-tono) 18%, transparent);
  }
  @supports not (color: color-mix(in srgb, red 50%, transparent)) {
    .est-dot { box-shadow: none; }
  }
  /* Late el HALO, no el punto: parpadear el punto lo apaga media animación y, de reojo,
     parece que el indicador se ha caído. */
  .est-dot.late::after {
    content: ''; position: absolute; inset: -2px; border-radius: 50%;
    border: 1.5px solid var(--e-tono);
    animation: est-pulso 2.6s cubic-bezier(.22,.8,.3,1) infinite;
  }

  .est-badge {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    padding: 3px 10px 3px 7px; border-radius: 999px;
    font-size: .72rem; font-weight: 700; letter-spacing: -.005em;
    color: var(--e-tono); background: var(--e-tono-bg);
    border: 1px solid color-mix(in srgb, var(--e-tono) 30%, transparent);
  }
  .est-badge svg { width: 13px; height: 13px; flex: none; }
  @supports not (color: color-mix(in srgb, red 50%, transparent)) {
    .est-badge { border-color: var(--e-tono); }
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     INCIDENCIAS
     ═══════════════════════════════════════════════════════════════════════════ */
  .est-inc {
    display: flex; width: 100%; gap: var(--e-s4); text-align: left; cursor: pointer;
    padding: var(--e-s5); margin-bottom: var(--e-s3);
    border-radius: var(--e-rad-lg); border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-family: var(--f-ui);
    transition: transform .25s var(--e-ease), box-shadow .25s ease, border-color .25s ease;
  }
  .est-inc:hover { transform: translateY(-3px); box-shadow: var(--e-lift);
    border-color: color-mix(in srgb, var(--e-tono) 42%, var(--line)); }
  .est-inc:active { transform: translateY(-1px); }
  .est-inc:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  /* Raíl de color a la izquierda en vez de un borde grueso: separa la gravedad del marco
     de la tarjeta, así el borde puede seguir reaccionando al hover sin cambiar de tono. */
  .est-inc-rail { width: 4px; flex: none; border-radius: 999px; background: var(--e-tono); align-self: stretch; }
  .est-inc-tx { flex: 1; min-width: 0; }
  .est-inc-top { display: flex; align-items: center; gap: var(--e-s2); flex-wrap: wrap; margin-bottom: var(--e-s3); }
  .est-inc-sis { font-size: .75rem; font-weight: 700; color: var(--ink-soft);
    letter-spacing: .02em; }
  .est-inc-h {
    display: block; margin: 0 0 6px;
    font-family: var(--f-display); font-size: 1.06rem; font-weight: 700;
    letter-spacing: -.015em; line-height: 1.35; color: var(--ink);
  }

      firma = nuevaFirma;

      pintarPortada(e, tono, bien, total, cambio);
      pintarSistemas(lista, cambio);
      pintarIncidencias(e, cambio);
      pintarAcciones();

      var sello = document.getElementById('est-pie-sello');
      if (sello) sello.textContent = 'Última consulta: ' + (fechaLarga(e.consultado) || '—');

      if (primerPintado) {
        primerPintado = false;
        entrada();
      } else if (cambio) {
        revelar(document.querySelectorAll('.est-card, .est-mini, .est-inc'), true);
      }

      arrancarTick();
      if (conScroll()) { try { ScrollTrigger.refresh(); } catch (err) {} }
    }

    /* ── Portada ── */

    function pintarPortada(e, tono, bien, total, cambio) {
      // Mientras nadie ha confirmado nada, el titular no puede afirmar más que el texto de
      // abajo: "Hay incidencias activas" sobre un aviso automático es prometer una certeza
      // que todavía no existe, y desdecirse mañana cuesta más que haber sido prudente hoy.
      var titular = (tono === 'ok') ? 'Todo funcionando'
                  : (e.sospecha ? 'Posibles problemas' : 'Hay incidencias activas');
      var rotulo = (tono === 'ok') ? 'Servicio operativo'
                  : (e.sospecha ? 'Revisando reportes' : 'Incidencia en curso');

      var portada = document.getElementById('est-portada');
      var titulo = portada.querySelector('.est-titulo');

      // El anillo y el titular se re-crean solo si cambió algo: así el SplitText del titular
      // sobrevive al repintado del minuto y la aguja del anillo se anima en vez de saltar.
      if (!cambio && titulo) {
        var horaEl = portada.querySelector('[data-hora]');
        if (horaEl) horaEl.textContent = 'Consultado ' + (desdeHace(e.consultado) || 'ahora');
        return;
      }

      if (split && split.revert) { try { split.revert(); } catch (err) {} split = null; }

      portada.innerHTML =
        '<div class="est-hero tono-' + esc(tono) + '">' +
          '<div class="est-hero-tx">' +
            '<span class="est-eyebrow"><span class="est-vivo"></span>' + esc(rotulo) + '</span>' +
            '<h1 class="est-titulo" id="est-titulo">' + esc(titular) + '</h1>' +
            '<p class="est-lead">' + esc(e.resumen || '') + '</p>' +
            '<div class="est-meta">' +
              '<span class="est-meta-i" data-hora>Consultado ' + esc(desdeHace(e.consultado) || 'ahora') + '</span>' +
              '<span class="est-meta-sep"></span>' +
              '<span class="est-meta-i">' +
                '<svg class="est-tick" viewBox="0 0 14 14" aria-hidden="true">' +
                  '<circle class="est-tick-tr" cx="7" cy="7" r="5.5"/>' +
                  '<circle class="est-tick-ar" cx="7" cy="7" r="5.5"/>' +
                '</svg>' +
                'Se actualiza sola' +
              '</span>' +
            '</div>' +
          '</div>' +
          '<div class="est-anillo" role="img" aria-label="' +
              esc(bien + ' de ' + total + ' sistemas funcionando') + '">' +
            '<span class="est-anillo-luz"></span>' +
            '<svg viewBox="0 0 170 170" aria-hidden="true">' +
              '<circle class="est-anillo-tr" cx="85" cy="85" r="75"/>' +
              '<circle class="est-anillo-ar" cx="85" cy="85" r="75"/>' +
            '</svg>' +
            '<div class="est-anillo-mid">' +
              '<b id="est-anillo-n">' + (conGsap() ? '0' : String(bien)) + '</b>' +
              '<small>de ' + esc(String(total)) + ' sistema' + (total === 1 ? '' : 's') + '</small>' +
            '</div>' +
          '</div>' +
        '</div>';

      dibujarAnillo(bien, total, !primerPintado);
    }

    /**
     * La aguja del anillo. En el primer pintado la dibuja la timeline de entrada (para que
     * llegue en su turno); en los repintados se anima aquí, que es cuando de verdad cuenta:
     * ver la aguja retroceder es enterarse de que un sistema se acaba de caer.
     */
    function dibujarAnillo(bien, total, animar) {
      var arco = document.querySelector('.est-anillo-ar');
      var num = document.getElementById('est-anillo-n');
      if (!arco) return;
      var frac = total ? (bien / total) : 1;
      var destino = PERIMETRO * (1 - frac);

      if (!conGsap()) {
        arco.style.strokeDashoffset = String(destino);
        if (num) num.textContent = String(bien);
        return;
      }
      if (!animar) { gsap.set(arco, { strokeDashoffset: PERIMETRO }); return; }

      gsap.to(arco, { strokeDashoffset: destino, duration: 1.1, ease: 'power2.inOut' });
      if (num) contar(num, bien);
    }

    /** Número que sube hasta su valor. Con enteros no hay decimales que bailen. */
    function contar(el, valor) {
      if (!conGsap()) { el.textContent = String(valor); return; }
      var caja = { v: Number(el.textContent) || 0 };
      gsap.to(caja, {
        v: valor, duration: .9, ease: 'power2.out',
        onUpdate: function () { el.textContent = String(Math.round(caja.v)); },
        onComplete: function () { el.textContent = String(valor); }
      });
    }

    /* ── Sistemas ── */

    function pintarSistemas(lista, cambio) {
      var caja = document.getElementById('est-sistemas');
      if (!cambio) return;

      var destacados = lista.filter(function (s) { return s.destacado; });
      var resto = lista.filter(function (s) { return !s.destacado; });
      var html = '';

      if (destacados.length) {
        html += '<div class="est-seccion">' +
          '<h2 class="est-rot">Sistemas principales</h2>' +
          '<div class="est-grid">' +
          destacados.map(function (s) {
            var i = (s.incidentes || [])[0];
            return '<article class="est-card tono-' + esc(s.tono) + '" data-tarjeta>' +
              '<div class="est-card-top">' +
                '<span class="est-dot' + (s.tono !== 'ok' ? ' late' : '') + '"></span>' +
                '<h3>' + esc(s.nombre) + '</h3>' +
                '<span class="est-badge" style="margin-left:auto">' +
                  (ICONO[s.tono] || IC.ok) + esc(s.estadoNombre) + '</span>' +
              '</div>' +
              '<p class="est-card-nota">' + esc(
                i ? ((i.ultima && i.ultima.nota) || i.detalle || i.titulo)
                  : 'Sin reportes. El servicio opera con normalidad.') + '</p>' +
              (i && i.desde
                ? '<div class="est-card-pie">' + IC.reloj + 'Desde ' + esc(desdeHace(i.desde)) + '</div>'
                : '') +
            '</article>';
          }).join('') +
          '</div></div>';
      }

      if (resto.length) {
        html += '<div class="est-seccion">' +
          '<h2 class="est-rot">Otros sistemas</h2>' +
          '<div class="est-grid est-grid-min">' +
          resto.map(function (s) {
            return '<div class="est-mini tono-' + esc(s.tono) + '">' +
              '<span class="est-dot' + (s.tono !== 'ok' ? ' late' : '') + '"></span>' +
              '<span class="est-mini-tx"><b>' + esc(s.nombre) + '</b>' +
              '<small>' + esc(s.estadoNombre) + '</small></span></div>';
          }).join('') +
          '</div></div>';
      }

      caja.innerHTML = html;
      cablearFoco(caja);
    }

    /**
     * El foco de luz que sigue al puntero. Se escribe una variable CSS y pinta el navegador:
     * no hay layout de por medio, así que da igual cuántas tarjetas haya en pantalla.
     */
    function cablearFoco(raiz) {
      if (menosMovimiento) return;
      raiz.querySelectorAll('[data-tarjeta]').forEach(function (card) {
        card.addEventListener('pointermove', function (ev) {
          var r = card.getBoundingClientRect();
          card.style.setProperty('--e-mx', ((ev.clientX - r.left) / r.width * 100) + '%');
          card.style.setProperty('--e-my', ((ev.clientY - r.top) / r.height * 100) + '%');
        });
      });
    }

    /* ── Incidencias ── */

    function pintarIncidencias(e, cambio) {
      var incs = document.getElementById('est-incidencias');
      if (!cambio) return;

      var lista = e.incidentes || [];
      if (!lista.length) {
        incs.innerHTML =
          '<div class="est-seccion">' +
            '<h2 class="est-rot">Incidencias</h2>' +
            '<div class="est-vacio">' +
              '<div class="est-vacio-ic">' + IC.ok + '</div>' +
              '<b>No hay incidencias abiertas</b>' +
              '<p>Cuando algo falle aparecerá aquí, con lo que se sepa y desde cuándo.</p>' +
            '</div>' +
          '</div>';
        return;
      }

      incs.innerHTML =
        '<div class="est-seccion">' +
          '<h2 class="est-rot">Incidencias abiertas<b>' + lista.length + '</b></h2>' +
          lista.map(function (i) {
            var nota = (i.ultima && i.ultima.nota) || i.detalle || '';
            return '<button type="button" class="est-inc tono-' + esc(i.tono) + '" data-inc="' + esc(i.id) + '">' +
              '<span class="est-inc-rail"></span>' +
              '<span class="est-inc-tx">' +
                '<span class="est-inc-top">' +
                  '<span class="est-badge">' + (ICONO[i.tono] || IC.info) + esc(i.estadoNombre) + '</span>' +
                  '<span class="est-inc-sis">' + esc(i.sistema) + '</span>' +
                '</span>' +
                '<span class="est-inc-h">' + esc(i.titulo) + '</span>' +
                (nota ? '<span class="est-inc-p">' + esc(nota) + '</span>' : '') +
                '<span class="est-inc-pie">' +
                  '<span>' + esc(i.desde ? 'Desde ' + fechaLarga(i.desde) + ' · ' + desdeHace(i.desde) : '') + '</span>' +
                  '<span class="est-abrir">' +
                    (haySesion() ? 'Ver reportes y evidencias' : 'Ver detalle') + IC.flecha +
                  '</span>' +
                '</span>' +
              '</span>' +
            '</button>';
          }).join('') +
        '</div>';

      incs.querySelectorAll('[data-inc]').forEach(function (b) {
        b.addEventListener('click', function () { abrirDetalle(b.getAttribute('data-inc'), b); });
      });
    }

    /* ── Acciones de la barra ── */

    function pintarAcciones() {
      var caja = document.getElementById('est-acciones');
      // "Ir al portal" está SIEMPRE, con sesión y sin ella: el portal es público y quien
      // llega aquí desde un enlace de aviso no tiene por qué quedarse encerrado en el
      // tablero buscando la salida.
      var portal = '<button type="button" class="v-btn v-btn-ghost v-btn-sm" id="est-portal">' +
                   IC.portal + '<span>Ir al portal</span></button>';

      caja.innerHTML = haySesion()
        ? (portal + '<button type="button" class="v-btn v-btn-primary v-btn-sm" id="est-reportar">Reportar una falla</button>')
        : (portal + '<button type="button" class="v-btn v-btn-primary v-btn-sm" id="est-login">Iniciar sesión</button>');

      var bPortal = caja.querySelector('#est-portal');
      if (bPortal) bPortal.addEventListener('click', function () { if (window.AppUrl) AppUrl.go('portal'); });

      var bRep = caja.querySelector('#est-reportar');
      if (bRep) bRep.addEventListener('click', function () { if (window.AppOperacion) AppOperacion.reportar(''); });

      var bLogin = caja.querySelector('#est-login');
      if (bLogin) bLogin.addEventListener('click', function () { if (window.AppUrl) AppUrl.go('login'); });
    }

    /* ═══════════════════════════════════════════════════════════════════════
       CINEMATOGRAFÍA
       ═══════════════════════════════════════════════════════════════════════
       Una sola timeline. El orden de la entrada es el orden en que hay que leer la
       pantalla: barra → rótulo → titular letra a letra → resumen → anillo → tarjetas.
       Nada dura más de un segundo y todo entra con easing de salida (rápido y frena),
       que es lo que hace que se lea como un movimiento decidido y no como una
       animación esperando a terminar. */

    function entrada() {
      if (!conGsap()) return;

      var mm = gsap.matchMedia();
      mm.add('(prefers-reduced-motion: no-preference)', function () {
        var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

        tl.from('.est-bar', { yPercent: -100, opacity: 0, duration: .7 })
          .from('.est-hero', { y: 46, opacity: 0, scale: .985, duration: .9 }, '-=.45');

        // Titular letra a letra. SplitText es lo que convierte una entrada correcta en una
        // entrada memorable; si el plugin no cargó, el titular entra entero y no pasa nada.
        var titulo = document.getElementById('est-titulo');
        if (titulo && window.SplitText) {
          try {
            // 'words,chars', no solo 'chars': partir únicamente en letras las convierte en
            // cajas sueltas y el navegador corta el titular a mitad de palabra
            // ("Hay inciden / cias activas"). Con las palabras envueltas, el salto vuelve
            // a caer donde tiene que caer.
            split = SplitText.create(titulo, { type: 'words,chars', autoSplit: true });
            tl.from(split.chars, {
              yPercent: 110, opacity: 0, duration: .8, stagger: .022, ease: 'power4.out'
            }, '-=.55');
          } catch (err) {
            tl.from(titulo, { y: 26, opacity: 0, duration: .7 }, '-=.5');
          }
        } else if (titulo) {
          tl.from(titulo, { y: 26, opacity: 0, duration: .7 }, '-=.5');
        }

        tl.from('.est-eyebrow', { x: -14, opacity: 0, duration: .5 }, '-=.7')
          .from('.est-lead', { y: 18, opacity: 0, duration: .6 }, '-=.45')
          .from('.est-meta', { y: 14, opacity: 0, duration: .5 }, '-=.4')
          .from('.est-anillo', { scale: .82, opacity: 0, duration: .8, ease: 'back.out(1.5)' }, '-=.9')
          .add(function () { dibujarAnillo(anilloBien(), anilloTotal(), true); }, '-=.5');

        // Halos del fondo: entran con la portada y se quedan respirando muy despacio. Es la
        // única animación infinita de la pantalla además del punto "en vivo", y a 22
        // segundos por ciclo no se percibe como movimiento, sino como profundidad.
        tl.from('.est-bg span', { opacity: 0, duration: 1.4, stagger: .12 }, 0);
        gsap.to('.est-halo-1', { xPercent: -6, yPercent: 8, scale: 1.08, duration: 22,
          ease: 'sine.inOut', repeat: -1, yoyo: true });
        gsap.to('.est-halo-2', { xPercent: 8, yPercent: -6, scale: 1.06, duration: 26,
          ease: 'sine.inOut', repeat: -1, yoyo: true });

        revelar(document.querySelectorAll('.est-card, .est-mini, .est-inc, .est-vacio'), false);
        parallax();

        return function () { tl.kill(); };
      });
    }

    function anilloBien() {
      var e = (datos && datos.estado) ? datos.estado : datos;
      return ((e && e.sistemas) || []).filter(function (s) { return s.tono === 'ok'; }).length;
    }
    function anilloTotal() {
      var e = (datos && datos.estado) ? datos.estado : datos;
      return ((e && e.sistemas) || []).length;
    }

    /**
     * Entrada de las piezas de abajo. Con ScrollTrigger aparecen cuando llegan a pantalla
     * (que es lo que hace que bajar por el tablero se sienta vivo); sin él, en cascada y
     * ya está. `ya` = repintado: entonces no se espera al scroll, porque lo que cambió está
     * donde ya estaba mirando la persona.
     */
    var lotes = [];   // ScrollTriggers de las tarjetas, para poder matarlos al repintar

    function matarLotes() {
      lotes.forEach(function (t) { try { t.kill(); } catch (e) {} });
      lotes = [];
    }

    function revelar(nodos, ya) {
      if (!conGsap() || !nodos.length) return;
      var lista = Array.prototype.slice.call(nodos);
      matarLotes();

      if (ya || !conScroll()) {
        gsap.from(lista, {
          y: 22, opacity: 0, duration: .6, ease: 'power3.out', stagger: .05,
          clearProps: 'transform,opacity', overwrite: 'auto'
        });
        return;
      }

      // El estado inicial se pone AQUÍ, no dentro del onEnter: batch no oculta nada por su
      // cuenta y, sin esto, lo que está por debajo del pliegue se ve un instante colocado
      // y luego salta hacia atrás para animarse.
      gsap.set(lista, { opacity: 0, y: 30 });
      lotes = ScrollTrigger.batch(lista, {
        start: 'top 92%',
        once: true,
        onEnter: function (grupo) {
          gsap.to(grupo, {
            opacity: 1, y: 0, duration: .7, ease: 'power3.out', stagger: .07,
            clearProps: 'transform,opacity', overwrite: 'auto'
          });
        }
      }) || [];

      // RED DE SEGURIDAD. Esta pantalla es la que se abre cuando algo ya va mal: dejar el
      // estado de un sistema escondido detrás de un scroll que no llegó a dispararse
      // —una medida mal calculada, un contenedor con scroll propio, el plugin a medias—
      // sería el peor fallo posible aquí. A los tres segundos, lo que siga invisible se
      // enseña sin más. Si el reveal funcionó, no queda nada que enseñar y no hace nada.
      setTimeout(function () {
        var perdidos = lista.filter(function (el) {
          return el.isConnected && Number(getComputedStyle(el).opacity) < .05;
        });
        if (perdidos.length) {
          gsap.to(perdidos, { opacity: 1, y: 0, duration: .4, ease: 'power2.out',
            clearProps: 'transform,opacity', overwrite: 'auto' });
        }
      }, 3000);
    }

    /**
     * Los halos del fondo se mueven a media velocidad al bajar: profundidad, no adorno.
     * Va en `y` (px) mientras la respiración infinita va en `yPercent`: GSAP los guarda por
     * separado dentro del mismo transform, así que las dos animaciones conviven sin pelearse.
     */
    function parallax() {
      if (!conScroll()) return;
      var recorrido = { trigger: document.body, start: 'top top', end: 'bottom bottom', scrub: 1 };
      gsap.to('.est-halo-1', { y: 160, ease: 'none', scrollTrigger: recorrido });
      gsap.to('.est-halo-2', { y: -110, ease: 'none', scrollTrigger: recorrido });
    }

    /** Cuenta atrás visible hasta el siguiente refresco. Se reinicia con cada consulta. */
    function arrancarTick() {
      var arco = document.querySelector('.est-tick-ar');
      if (!arco) return;
      if (!conGsap()) { arco.style.strokeDashoffset = '0'; return; }
      if (tlTick) tlTick.kill();
      tlTick = gsap.fromTo(arco,
        { strokeDashoffset: PERIMETRO_TICK },
        { strokeDashoffset: 0, duration: REFRESCO_MS / 1000, ease: 'none' });
    }

    /* La barra superior se despega del fondo solo cuando hay contenido debajo de ella. */
    window.addEventListener('scroll', function () {
      var bar = document.getElementById('est-bar');
      if (bar) bar.classList.toggle('est-pegada', window.scrollY > 8);
    }, { passive: true });

    /* ═══════════════════════════════════════════════════════════════════════
       DETALLE
       ═══════════════════════════════════════════════════════════════════════ */

    function abrirDetalle(id, quien) {
      incAbierto = id;
      disparador = quien || null;
      hoja.classList.add('abierto');
      scrim.classList.add('abierto');
      hoja.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      hojaHead.innerHTML =
        '<span style="flex:1"><h2 id="est-hoja-titulo">Cargando…</h2><p>Buscando los reportes</p></span>' +
        '<button type="button" class="est-x" id="est-hoja-x" aria-label="Cerrar">' + IC.cerrar + '</button>';
      hojaCuerpo.innerHTML = '<div class="est-sk"></div><div class="est-sk"></div>';
      cablearCierre();
      setTimeout(function () {
        var x = document.getElementById('est-hoja-x');
        if (x) x.focus();
      }, 60);

      if (!haySesion()) { pintarPuerta(id); return; }

      llamar('opIncidenteDetalle', [id, AppSession.userEmail]).then(function (r) {
        if (incAbierto !== id) return;
        if (!r || !r.success) {
          hojaCuerpo.innerHTML = '<div class="est-vacio"><b>No pudimos abrir este reporte</b>' +
            '<p>' + esc((r && r.message) || 'Inténtalo de nuevo en un momento.') + '</p></div>';
          return;
        }
        pintarDetalle(r);
      }, function () {
        if (incAbierto !== id) return;
        hojaCuerpo.innerHTML = '<div class="est-vacio"><b>No hay conexión con el sistema</b>' +
          '<p>Revisa tu internet e inténtalo de nuevo.</p></div>';
      });
    }

    /**
     * Sin sesión se enseña lo que ya está en la tarjeta y se explica qué falta y por qué.
     * Decir solo "no tienes acceso" deja a la persona sin saber si le sirve iniciar sesión.
     */
    function pintarPuerta(id) {
      var e = (datos && datos.estado) ? datos.estado : datos;
      var i = ((e && e.incidentes) || []).filter(function (x) { return x.id === id; })[0];
      if (!i) {
        hojaCuerpo.innerHTML = '<div class="est-vacio"><b>Ese reporte ya no está disponible</b></div>';
        return;
      }

      hojaHead.innerHTML =
        '<span style="flex:1">' +
          '<h2 id="est-hoja-titulo">' + esc(i.titulo) + '</h2>' +
          '<p>' + esc(i.sistema) + ' · ' + esc(i.estadoNombre) + '</p>' +
        '</span>' +
        '<button type="button" class="est-x" id="est-hoja-x" aria-label="Cerrar">' + IC.cerrar + '</button>';

      hojaCuerpo.innerHTML =
        '<div class="est-hoja-cab tono-' + esc(i.tono) + '">' +
          '<span class="est-badge">' + (ICONO[i.tono] || IC.info) + esc(i.estadoNombre) + '</span>' +
          (i.desde ? '<small>Desde ' + esc(fechaLarga(i.desde)) + '</small>' : '') +
        '</div>' +
        '<h3 class="est-rot">Lo que sabemos</h3>' +
        '<p class="est-hoja-tx">' +
          esc((i.ultima && i.ultima.nota) || i.detalle || 'Sin más detalle por ahora.') +
        '</p>' +
        '<div class="est-puerta">' +
          '<b>Los reportes del equipo son internos</b>' +
          '<p>Las notas y las capturas que comparten los asesores solo se ven con una sesión iniciada.</p>' +
          '<button type="button" class="v-btn v-btn-primary v-btn-sm" id="est-puerta-login">Iniciar sesión</button>' +
        '</div>';

      cablearCierre();
      var b = document.getElementById('est-puerta-login');
      if (b) b.addEventListener('click', function () { if (window.AppUrl) AppUrl.go('login'); });
      animarHoja();
    }

    function pintarDetalle(r) {
      var i = r.incidente;
      hojaHead.innerHTML =
        '<span style="flex:1">' +
          '<h2 id="est-hoja-titulo">' + esc(i.titulo) + '</h2>' +
          '<p>' + esc(i.sistema) + ' · ' + esc(i.personas) +
            (i.personas === 1 ? ' persona lo reportó' : ' personas lo reportaron') + '</p>' +
        '</span>' +
        '<button type="button" class="est-x" id="est-hoja-x" aria-label="Cerrar">' + IC.cerrar + '</button>';

      var html = '';

      html += '<div class="est-hoja-cab tono-' + esc(i.tono) + '">' +
        '<span class="est-badge">' + (ICONO[i.tono] || IC.info) + esc(i.estadoNombre) + '</span>' +
        (i.confirmado
          ? '<small>Confirmado ' + esc(fechaLarga(i.confirmado)) +
            (i.confirmadoNombre ? ' por ' + esc(i.confirmadoNombre) : '') + '</small>'
          : '<small>Detectado ' + esc(desdeHace(i.creado)) + '</small>') +
        '</div>';

      if (i.detalle) html += '<p class="est-hoja-tx">' + esc(i.detalle) + '</p>';

      if (r.actualizaciones && r.actualizaciones.length) {
        html += '<h3 class="est-rot">Actualizaciones</h3><div class="est-tl">';
        html += r.actualizaciones.map(function (a) {
          return '<div class="est-tl-item tono-' + esc(a.tono) + '">' +
            '<div class="est-tl-top"><b>' + esc(a.estadoNombre) + '</b>' +
              '<small>' + esc(fechaLarga(a.fecha)) + ' · ' + esc(a.autorNombre || a.autor) + '</small></div>' +
            (a.nota ? '<p>' + esc(a.nota) + '</p>' : '') +
            (a.aviso ? '<span class="est-tl-aviso">' + IC.mega + 'Se avisó al equipo</span>' : '') +
          '</div>';
        }).join('');
        html += '</div>';
      }

      html += '<h3 class="est-rot">Reportes del equipo</h3>';
      if (!r.reportes.length) {
        html += '<p class="est-hoja-tx">Todavía no hay reportes vinculados.</p>';
      } else {
        html += r.reportes.map(function (rep) {
          return '<div class="est-rep">' +
            '<div class="est-rep-top">' +
              '<b>' + esc(rep.nombre || rep.correo) + '</b>' +
              '<small>' + esc(fechaLarga(rep.fecha)) + '</small>' +
              (rep.mio ? '<span class="est-mio">Tu reporte</span>' : '') +
            '</div>' +
            (rep.submotivo ? '<span class="est-rep-sub">' + esc(rep.submotivo) + '</span>' : '') +
            (rep.notas ? '<p>' + esc(rep.notas) + '</p>' : '') +
            (rep.evidencias && rep.evidencias.length
              ? '<div class="est-evis">' + rep.evidencias.map(function (ev) {
                  return '<button type="button" class="est-evi" data-ver="' + esc(ev.url) + '">' +
                    '<img src="' + esc(ev.url) + '" alt="' + esc(ev.nombre || 'Captura') + '" loading="lazy">' +
                  '</button>';
                }).join('') + '</div>'
              : '') +
          '</div>';
        }).join('');
      }

      hojaCuerpo.innerHTML = html;
      cablearCierre();

      hojaCuerpo.querySelectorAll('[data-ver]').forEach(function (b) {
        b.addEventListener('click', function () {
          visorImg.src = b.getAttribute('data-ver');
          visor.classList.add('abierto');
          if (conGsap()) {
            gsap.fromTo(visorImg, { scale: .92, opacity: 0 },
              { scale: 1, opacity: 1, duration: .4, ease: 'power3.out', clearProps: 'transform' });
          }
        });
      });

      animarHoja();
    }

    /* El panel entra con CSS (transform en .abierto); lo que anima GSAP es su CONTENIDO,
       que llega después del servidor y necesita entrar por su cuenta. */
    function animarHoja() {
      if (!conGsap()) return;
      gsap.from(hojaCuerpo.children, {
        y: 18, opacity: 0, duration: .45, ease: 'power3.out', stagger: .055,
        clearProps: 'transform,opacity', overwrite: 'auto'
      });
    }

    function cablearCierre() {
      var x = document.getElementById('est-hoja-x');
      if (x) x.addEventListener('click', cerrarDetalle);
    }

    function cerrarDetalle() {
      incAbierto = '';
      hoja.classList.remove('abierto');
      scrim.classList.remove('abierto');
      hoja.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (disparador && disparador.focus) { try { disparador.focus(); } catch (e) {} }
      disparador = null;
    }

    scrim.addEventListener('click', cerrarDetalle);
    document.getElementById('est-visor-x').addEventListener('click', function () { visor.classList.remove('abierto'); });
    visor.addEventListener('click', function (e) { if (e.target === visor) visor.classList.remove('abierto'); });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (visor.classList.contains('abierto')) { visor.classList.remove('abierto'); return; }
      if (hoja.classList.contains('abierto')) cerrarDetalle();
    });

    /* ═══════════════════════════════════════════════════════════════════════
       DATOS
       ═══════════════════════════════════════════════════════════════════════ */

    function llamar(fn, args) {
      if (window.AppRun && AppRun.call) return AppRun.call(fn, args || []);
      return new Promise(function (resolve, reject) {
        if (!(window.google && google.script && google.script.run)) { reject(new Error('sin backend')); return; }
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        r[fn].apply(r, args || []);
      });
    }

    function cargar() {
      var conSesion = haySesion();
      var fn = conSesion ? 'opEstadoSesion' : 'opEstadoPublico';
      var args = conSesion ? [AppSession.userEmail] : [];
      return llamar(fn, args).then(function (r) {
        datos = r;
        pintar();
        // El indicador global vive también en esta pantalla (para el formulario de reporte)
        // y pediría lo mismo por su cuenta un segundo después. Se le pasa lo ya recibido:
        // una consulta en vez de dos en la pantalla más visitada del módulo.
        if (window.AppOperacion && AppOperacion.usarEstado) AppOperacion.usarEstado(r);
        return r;
      }, function () {
        if (!datos) { datos = { success: false }; pintar(); }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('est-portada').innerHTML =
        '<div class="est-sk" style="height:220px;border-radius:28px"></div>';
      document.getElementById('est-incidencias').innerHTML =
        '<div class="est-seccion"><div class="est-sk"></div><div class="est-sk"></div></div>';

      cargar().then(function () {
        // Enlace directo desde el aviso de Chat: ?page=estado&inc=<id> abre la incidencia.
        var inc = (window.AppUrl && AppUrl.param('inc')) || '';
        if (inc) abrirDetalle(inc, null);
      });

      /* El historial se monta DESPUÉS del estado actual y sin esperarlo. Son dos llamadas
         independientes, y encadenarlas retrasaría el titular —lo que la gente viene a
         leer— hasta que terminara de cargar un gráfico que está más abajo del pliegue. */
      if (window.AppEstadoHistorial) {
        AppEstadoHistorial.montar('est-historial-host', { dias: 14 });
      }

      // El tablero se mira mientras algo está roto: tiene que refrescarse solo.
      setInterval(function () {
        if (document.visibilityState === 'visible' && !hoja.classList.contains('abierto')) cargar();
      }, REFRESCO_MS);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') cargar();
      });
    });
  })();
  </script>
</body>
</html>
