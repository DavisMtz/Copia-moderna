<style>
/**
 * =====================================================================================
 * BUSCADOR GENERAL | Sistema de cotizaciones Ventel · Portal Ventel
 * =====================================================================================
 * El buscador del Portal, disponible en TODAS las pantallas. Antes solo existía en la
 * portada: para saltar de "Enviar correo" a "Revisar cotizaciones" había que volver al
 * panel, abrir el menú y bajar hasta el rótulo correcto. Ahora se abre con Ctrl+K (o
 * con «/») desde donde sea y lleva a cualquier función que ESA persona tenga permitida.
 *
 * Lo que encuentra, por orden de cercanía a lo que se estaba haciendo:
 *   1. Funciones de la app  — solo las que los permisos de la sesión dejan abrir.
 *   2. Cotizaciones         — por folio o por el correo del cliente, propias y de todo
 *                             el equipo (ver buscarCotizaciones en Code.gs).
 *   3. Contenido del Portal — herramientas, plantillas, formatos, paqueterías y pagos.
 *
 * DE DÓNDE SALEN LOS RESULTADOS. Primero del DIRECTORIO: un índice que se arma con lo
 * que la app ya tiene guardado en la caché local (la lista de cotizaciones del panel,
 * la de supervisión, la cola de revisión y el contenido del Portal). Eso responde en la
 * misma tecla y sin red. El servidor solo se consulta para lo que el directorio no
 * puede saber —las cotizaciones de otros asesores— y su respuesta también se guarda.
 *
 * CÓMO SE ABRE. El panel NACE del botón de buscar y vuelve a él al cerrarse
 * (transformación de contenedor con GSAP). No es un adorno: es lo que enseña dónde vive
 * el buscador, para que la siguiente vez se busque el botón en vez de descubrirlo.
 *
 * Es un include autónomo: se cuelga solo al cargar la pantalla. Necesita app_core
 * (AppUrl/AppSession/AppCache/AppRun) y app_buscar (el motor de coincidencias); si
 * alguno falta, no se monta y la pantalla sigue funcionando igual. GSAP es opcional.
 *
 * Los estilos usan los tokens del tema (--surface, --ink, --brand…), así que hereda
 * aurora/slate/carbón y el alto contraste sin código propio.
 */

.cmdk-backdrop {
  position: fixed; inset: 0; z-index: 10060; display: none;
  background: rgba(20, 14, 20, .5);
  padding: 9vh 1rem 1rem; overflow-y: auto; overscroll-behavior: contain;
  opacity: 0;
}
.cmdk-backdrop.open { display: block; opacity: 1; }
.cmdk-backdrop.cmdk-anima { overflow: hidden; }
@supports (backdrop-filter: blur(3px)) { .cmdk-backdrop { backdrop-filter: blur(3px); } }
@media (max-width: 640px) { .cmdk-backdrop { padding-top: 3vh; } }

.cmdk-panel {
  width: min(44rem, 100%); margin: 0 auto;
  background: var(--surface, #fff); color: var(--ink, #1B2330);
  border: 1px solid var(--line, #E4E9F0); border-radius: 18px;
  box-shadow: var(--sh-lg, 0 30px 60px -24px rgba(27,35,48,.3));
  font-family: var(--f-ui, var(--f-body, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif));
  overflow: hidden; box-sizing: border-box;
}
.cmdk-panel *, .cmdk-panel *::before, .cmdk-panel *::after { box-sizing: border-box; }
.cmdk-cuerpo { width: 100%; }

/* Durante la transformación se avisa al compositor de que estas dos capas van a
   moverse. Solo mientras dura: `will-change` permanente reserva memoria de vídeo por
   una animación que ocurre una vez cada varios minutos. */
.cmdk-backdrop.cmdk-anima .cmdk-panel,
.cmdk-backdrop.cmdk-anima .cmdk-cuerpo { will-change: transform; }

/* ── Caja de texto ── */
.cmdk-head { display: flex; align-items: center; gap: .75rem; padding: 1rem 1.15rem; border-bottom: 1px solid var(--line, #E4E9F0); }
.cmdk-head > .cmdk-ic { width: 20px; height: 20px; color: var(--brand, #E10098); flex: none; }
.cmdk-input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 0;
  font-family: inherit; font-size: 1.05rem; font-weight: 500; color: var(--ink, #1B2330);
}
.cmdk-input::placeholder { color: var(--ink-faint, #94A1B2); font-weight: 400; }
.cmdk-input::-webkit-search-cancel-button { display: none; }
.cmdk-borrar {
  flex: none; width: 1.7rem; height: 1.7rem; border-radius: 8px; border: 0; padding: 0; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  background: var(--surface-2, #F4F7FA); color: var(--ink-faint, #94A1B2);
}
.cmdk-borrar.ver { display: inline-flex; }
.cmdk-borrar:hover { color: var(--ink, #1B2330); }
.cmdk-borrar .cmdk-ic { width: 14px; height: 14px; }
.cmdk-esc {
  flex: none; font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: .3rem .55rem; border-radius: 7px; border: 1px solid var(--line, #E4E9F0);
  background: var(--surface-2, #F4F7FA); color: var(--ink-faint, #94A1B2); cursor: pointer;
  font-family: inherit;
}
.cmdk-esc:hover { color: var(--ink, #1B2330); border-color: var(--brand-soft, #FBD0E9); }

/* ── Resultados ── */
.cmdk-list { max-height: min(60vh, 32rem); overflow-y: auto; overscroll-behavior: contain; padding: .4rem; }
.cmdk-list::-webkit-scrollbar { width: 9px; }
.cmdk-list::-webkit-scrollbar-thumb { background: var(--line, #E4E9F0); border-radius: 99px; }
.cmdk-list::-webkit-scrollbar-track { background: transparent; }

.cmdk-group {
  display: flex; align-items: center; gap: .45rem;
  padding: .8rem .85rem .35rem; font-size: .63rem; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint, #94A1B2);
}
.cmdk-group .cmdk-ic { width: 13px; height: 13px; }
.cmdk-group .n {
  margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 700; font-size: .68rem;
  background: var(--surface-2, #F4F7FA); border-radius: 99px; padding: .08rem .45rem;
}

.cmdk-item {
  display: flex; align-items: center; gap: .8rem; width: 100%;
  padding: .62rem .85rem; border: 0; border-radius: 12px; background: transparent;
  text-align: left; cursor: pointer; font-family: inherit; color: inherit; position: relative;
}
.cmdk-item:hover { background: var(--surface-2, #F4F7FA); }
.cmdk-item.on { background: var(--brand-tint, #FDE7F4); }
.cmdk-item.on .cmdk-chip { background: var(--brand, #E10098); color: #fff; }
.cmdk-item.on .cmdk-enter { display: inline-flex; }
.cmdk-item.on .cmdk-go { display: none; }

.cmdk-chip {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-2, #F4F7FA); color: var(--ink-soft, #5C6B7E);
  transition: background .15s ease, color .15s ease;
}
.cmdk-chip .cmdk-ic { width: 17px; height: 17px; }
/* Nombre y detalle son <span> dentro de una fila flex: sin display:block se quedan
   en la misma línea y el título se pega al subtítulo. */
.cmdk-tx { min-width: 0; flex: 1; line-height: 1.3; display: block; }
.cmdk-name { display: block; font-size: .92rem; font-weight: 600; color: var(--ink, #1B2330); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-sub { display: block; font-size: .75rem; color: var(--ink-soft, #5C6B7E); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: .1rem; }
.cmdk-sub:empty { display: none; }
.cmdk-name mark, .cmdk-sub mark { background: var(--brand-soft, #FBD0E9); color: inherit; border-radius: 3px; padding: 0 .12em; font-weight: 700; }
.cmdk-go { flex: none; opacity: .4; color: var(--ink-faint, #94A1B2); display: inline-flex; }
.cmdk-go .cmdk-ic { width: 15px; height: 15px; }
/* Pista de teclado en la fila activa: dice qué hace Enter justo donde va a pasar. */
.cmdk-enter {
  display: none; flex: none; align-items: center; gap: .25rem; font-size: .66rem; font-weight: 700;
  color: var(--brand-deep, #A8006F); background: var(--surface, #fff);
  border: 1px solid var(--brand-soft, #FBD0E9); border-radius: 7px; padding: .14rem .4rem;
}

/* Acción secundaria (abrir el enlace de una herramienta sin salir del Portal). */
.cmdk-act {
  flex: none; width: 1.9rem; height: 1.9rem; border-radius: 8px; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line, #E4E9F0); background: var(--surface, #fff); color: var(--ink-faint, #94A1B2);
}
.cmdk-act:hover { color: var(--brand, #E10098); border-color: var(--brand-soft, #FBD0E9); }
.cmdk-act .cmdk-ic { width: 14px; height: 14px; }

/* Etiquetas: de quién es la cotización, de qué sección del Portal viene. */
.cmdk-tag {
  flex: none; font-size: .64rem; font-weight: 700; padding: .14rem .45rem; border-radius: 99px;
  background: var(--surface-2, #F4F7FA); color: var(--ink-soft, #5C6B7E); border: 1px solid var(--line, #E4E9F0);
  white-space: nowrap;
}
.cmdk-tag.mia { background: var(--brand-tint, #FDE7F4); color: var(--brand-deep, #A8006F); border-color: var(--brand-soft, #FBD0E9); }
.cmdk-tag.local { background: var(--ok-bg, #E5F5EE); color: var(--ok, #0E7A4F); border-color: transparent; }

/* ── Estados ── */
.cmdk-vacio { padding: 2.3rem 1.2rem; text-align: center; color: var(--ink-soft, #5C6B7E); font-size: .89rem; }
.cmdk-vacio .cmdk-ic { width: 30px; height: 30px; color: var(--ink-faint, #94A1B2); margin-bottom: .55rem; }
.cmdk-vacio b { color: var(--ink, #1B2330); }
.cmdk-vacio .cmdk-pistas { margin-top: .9rem; display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; }
.cmdk-pista {
  font-size: .74rem; font-weight: 600; font-family: inherit; cursor: pointer;
  padding: .3rem .6rem; border-radius: 99px; border: 1px solid var(--line, #E4E9F0);
  background: var(--surface, #fff); color: var(--ink-soft, #5C6B7E);
}
.cmdk-pista:hover { color: var(--brand, #E10098); border-color: var(--brand-soft, #FBD0E9); }

/* Esqueletos mientras contesta el servidor. Dicen "vienen más" mejor que un texto:
   se ve la forma de lo que falta y la lista no da un salto cuando llega. */
.cmdk-hueso { display: flex; align-items: center; gap: .8rem; padding: .62rem .85rem; }
.cmdk-hueso i, .cmdk-hueso u {
  display: block; border-radius: 8px; text-decoration: none;
  background: linear-gradient(90deg, var(--surface-2,#F4F7FA) 25%, var(--line-soft,#EEF2F7) 50%, var(--surface-2,#F4F7FA) 75%);
  background-size: 200% 100%; animation: cmdkBrillo 1.1s ease-in-out infinite;
}
.cmdk-hueso i { width: 34px; height: 34px; border-radius: 10px; flex: none; }
.cmdk-hueso u { height: 9px; }
.cmdk-hueso .cmdk-tx u:first-child { width: 42%; margin-bottom: .35rem; }
.cmdk-hueso .cmdk-tx u:last-child { width: 68%; height: 7px; }
@keyframes cmdkBrillo { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── Pie: atajos y acciones sobre la búsqueda ── */
.cmdk-foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: .8rem; padding: .55rem 1.15rem;
  border-top: 1px solid var(--line, #E4E9F0); background: var(--surface-2, #F4F7FA);
  font-size: .7rem; color: var(--ink-faint, #94A1B2);
}
.cmdk-foot span { display: inline-flex; align-items: center; gap: .3rem; }
.cmdk-foot kbd {
  font-family: inherit; font-size: .66rem; font-weight: 700; min-width: 1.3rem; text-align: center;
  padding: .12rem .32rem; border-radius: 6px; border: 1px solid var(--line, #E4E9F0);
  background: var(--surface, #fff); color: var(--ink-soft, #5C6B7E);
}
.cmdk-enlace {
  margin-left: auto; display: inline-flex; align-items: center; gap: .32rem; cursor: pointer;
  font-family: inherit; font-size: .7rem; font-weight: 650; padding: .26rem .55rem; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--ink-soft, #5C6B7E);
}
.cmdk-enlace:hover { color: var(--brand, #E10098); border-color: var(--brand-soft, #FBD0E9); background: var(--surface, #fff); }
.cmdk-enlace .cmdk-ic { width: 13px; height: 13px; }
.cmdk-enlace[hidden] { display: none; }
@media (max-width: 560px) { .cmdk-foot span:nth-child(n+3) { display: none; } }

/* ── Disparador en la barra superior ── */
.cmdk-abrir {
  display: inline-flex; align-items: center; gap: .5rem; max-width: 15rem;
  padding: .44rem .6rem .44rem .58rem; border-radius: 11px; cursor: pointer;
  border: 1px solid var(--line, #E4E9F0); background: var(--surface, #fff);
  color: var(--ink-faint, #94A1B2); font-family: inherit; font-size: .8rem; font-weight: 500;
  transition: border-color .18s, color .18s, box-shadow .18s;
}
.cmdk-abrir:hover { color: var(--ink-soft, #5C6B7E); border-color: var(--brand-soft, #FBD0E9); }
.cmdk-abrir:focus-visible { outline: none; box-shadow: var(--ring, 0 0 0 4px rgba(225,0,152,.16)); }
.cmdk-abrir .cmdk-ic { width: 16px; height: 16px; flex: none; }
.cmdk-abrir .cmdk-abrir-tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-abrir kbd {
  font-family: inherit; font-size: .64rem; font-weight: 700; padding: .1rem .32rem; border-radius: 6px;
  border: 1px solid var(--line, #E4E9F0); background: var(--surface-2, #F4F7FA); flex: none;
}
@media (max-width: 720px) {
  .cmdk-abrir .cmdk-abrir-tx, .cmdk-abrir kbd { display: none; }
  .cmdk-abrir { padding: .44rem; }
}

/* ── Disparador flotante ──
   Para las pantallas que no tienen barra superior donde colgar el botón (la
   cotización, la vista previa y la consulta ocupan el ancho completo). Va abajo a
   la DERECHA: la pastilla de estado de operación vive abajo a la izquierda y dos
   botones flotantes en la misma esquina se tapan. Un atajo que solo existe en el
   teclado lo usa quien ya sabe que existe; el botón es cómo se entera el resto. */
.cmdk-flota {
  position: fixed; right: 20px; bottom: calc(20px + var(--op-pill-suelo, 0px)); z-index: 900;
  display: inline-flex; align-items: center; gap: .5rem; padding: .62rem .9rem;
  border-radius: 99px; cursor: pointer; font-family: inherit; font-size: .82rem; font-weight: 600;
  border: 1px solid var(--line, #E4E9F0); background: var(--surface, #fff); color: var(--ink-soft, #5C6B7E);
  box-shadow: var(--sh-md, 0 14px 34px -16px rgba(27,35,48,.28));
  transition: transform .16s cubic-bezier(.32,.72,0,1), color .16s, border-color .16s;
}
.cmdk-flota:hover { transform: translateY(-2px); color: var(--brand, #E10098); border-color: var(--brand-soft, #FBD0E9); }
.cmdk-flota:focus-visible { outline: none; box-shadow: var(--ring, 0 0 0 4px rgba(225,0,152,.16)); }
.cmdk-flota .cmdk-ic { width: 17px; height: 17px; flex: none; }
@media (max-width: 640px) { .cmdk-flota .cmdk-flota-tx { display: none; } .cmdk-flota { padding: .72rem; } }

/* Sin GSAP la apertura la resuelve CSS: mismas propiedades, sin transformación.
   Con GSAP la transición se apaga — si no, cada valor que escribe la animación
   arrancaría además una transición de CSS y las dos tirarían de lo mismo. */
.cmdk-backdrop:not(.cmdk-gsap) { transition: opacity .2s ease; }
.cmdk-backdrop:not(.cmdk-gsap) .cmdk-panel { transform: translateY(-10px) scale(.99); opacity: 0; transition: transform .24s cubic-bezier(.2,.8,.2,1), opacity .24s ease; }
.cmdk-backdrop:not(.cmdk-gsap).open .cmdk-panel { transform: none; opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .cmdk-hueso i, .cmdk-hueso u { animation: none; }
  .cmdk-flota:hover { transform: none; }
  .cmdk-backdrop:not(.cmdk-gsap) .cmdk-panel { transition-duration: .01ms; }
}
@media print { .cmdk-backdrop, .cmdk-abrir, .cmdk-flota { display: none !important; } }
</style>

<script>
/**
 * AppComando — el buscador general, montado en cualquier pantalla.
 */
(function () {
  'use strict';

  /* ── Iconos (mismo lenguaje de trazo que el resto de la app) ── */
  function ic(d) {
    return '<svg class="cmdk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  var IC = {
    lupa:    ic('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>'),

    correo:  ic('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>'),
    correop: ic('<path d="M21 12.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8.5"/><path d="m3.5 7 8.5 6 8.5-6"/><path d="M18.5 15.5v5M16 18h5"/>'),
    grafica: ic('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
    check:   ic('<path d="M12 3l7.5 3v5.5c0 4.4-3.1 8.4-7.5 9.5-4.4-1.1-7.5-5.1-7.5-9.5V6Z"/><path d="m9.2 12.2 1.9 1.9 3.7-3.7"/>'),
    megafono:ic('<path d="M3 11v2a1 1 0 0 0 1 1h2l9 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M15 8a4 4 0 0 1 0 8"/><path d="M7 14v5"/>'),
    capas:   ic('<path d="m12 3 9 4.5-9 4.5-9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>'),

    estrella:ic('<path d="M12 3l2.3 6.2L21 11l-6 2 6 2-6.7 1.8L12 21l-2.3-4.2L3 15l6-2-6-2 6.7-1.8Z"/>'),
    engrane: ic('<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.77.32H9a1.6 1.6 0 0 0 1-1.47V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.47 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.47 1Z"/>'),
    flecha:  ic('<path d="M5 12h13M13 6l6 6-6 6"/>'),
    llave:   ic('<path d="M14.5 6.5a3.8 3.8 0 0 0-5 5l-6 6 2.5 2.5 6-6a3.8 3.8 0 0 0 5-5l-2.4 2.4-2-2 1.9-2.9Z"/>'),
    caja:    ic('<path d="M21 7.5 12 12 3 7.5 12 3l9 4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9M12 12v9"/>'),
    tarjeta: ic('<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M2.5 10h19"/>'),
    salir:   ic('<path d="M15 12H4M11 8l-4 4 4 4"/><path d="M9 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-8"/>'),
    cerrar:  ic('<path d="M18 6 6 18M6 6l12 12"/>'),
    externo: ic('<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
    liga:    ic('<path d="M10 13.5a4 4 0 0 0 5.7 0l2.8-2.8a4 4 0 1 0-5.7-5.7L11.5 6.3"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-2.8 2.8a4 4 0 1 0 5.7 5.7l1.3-1.3"/>'),
    reloj:   ic('<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/>')
  };

  function esc(s) { return window.AppBuscar ? AppBuscar.escapa(s) : String(s == null ? '' : s); }
  function puede(b) { return !!(window.AppSession && AppSession.can(b)); }
  function conSesion() { return !!(window.AppSession && AppSession.isLoggedIn()); }
  function correoSesion() { return String((window.AppSession && AppSession.userEmail) || '').toLowerCase(); }

  /* ═══════════════════════════════════════════════════════════════════════════
     CATÁLOGO DE FUNCIONES
     ═══════════════════════════════════════════════════════════════════════════
     Todo lo que la app sabe hacer, en un solo sitio, con el permiso que hace falta

  /** Sube o baja un paso el tamaño del texto, sin salirse de la escala. */
  function pasoTexto(dir) {
    var escala = ['sm', 'md', 'lg', 'xl'];
    var actual = document.documentElement.getAttribute('data-textscale') || 'md';
    var i = escala.indexOf(actual);
    if (i === -1) i = 1;
    var nuevo = escala[Math.max(0, Math.min(escala.length - 1, i + dir))];
    if (nuevo === actual) {
      if (window.AppMotion) {
        AppMotion.toast(dir > 0 ? 'Ya estás en el tamaño más grande.' : 'Ya estás en el tamaño más pequeño.', 'warn');
      }
      return;
    }
    AppShell.setTextScale(nuevo);
  }

  /** ¿Esta entrada del catálogo la alcanza la sesión actual? */
  function alcanzable(d, logueado) {
    if (!logueado) {
      // Sin sesión solo la landing pública y el tablero de estado, y ni siquiera esos
      // si el módulo está apagado por mantenimiento (ver AppFunciones en app_core:
      // la lista de apagados ya se consulta sin sesión).
      if (d.id !== 'portal' && d.id !== 'estado') return false;
      if (window.AppFunciones && d.bloques) {
        return d.bloques.some(function (b) { return !AppFunciones.moduloApagado(b); });
      }
      return true;
    }
    if (d.maestro && !(window.AppSession && AppSession.isMaster)) return false;
    if (!d.bloques) return true;
    for (var i = 0; i < d.bloques.length; i++) if (puede(d.bloques[i])) return true;
    return false;
  }

  /** Las funciones que ESTA sesión puede abrir de verdad. */
  function destinos() {
    var logueado = conSesion();
    return CATALOGO.filter(function (d) { return alcanzable(d, logueado); });
  }

  /** Los apartados internos que ESTA sesión puede abrir. */
  function secciones() {
    if (!conSesion()) return [];
    return SECCIONES.filter(function (d) { return alcanzable(d, true); });
  }

  function acciones() {
    var conShell = !!window.AppShell;
    return AJUSTES.filter(function (a) {
      if (a.shell && !conShell) return false;
      if (a.sesion && !conSesion()) return false;
      return true;
    });
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     MEMORIA DE LO USADO
     ═══════════════════════════════════════════════════════════════════════════
     Con el buscador vacío se ofrece lo último que se abrió: en la práctica casi
     todo el trabajo son cuatro pantallas, y recordarlas ahorra teclear. */
  var K_RECIENTES = 'ventel-cmdk-recientes';
  var K_BUSQUEDAS = 'ventel-cmdk-busquedas';
  function leerLista(clave) {
    try { var l = JSON.parse(localStorage.getItem(clave) || '[]'); return Array.isArray(l) ? l : []; }
    catch (e) { return []; }
  }
  function recordar(clave, valor, tope) {
    if (!valor) return;
    try {
      var l = leerLista(clave).filter(function (x) { return x !== valor; });
      l.unshift(valor);
      localStorage.setItem(clave, JSON.stringify(l.slice(0, tope || 6)));
    } catch (e) {}
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     DIRECTORIO LOCAL
     ═══════════════════════════════════════════════════════════════════════════
     La app ya tiene guardado, en la caché del navegador, casi todo lo que alguien va
     a buscar: la lista de cotizaciones del panel, la de supervisión, la cola de
     revisión y el contenido del Portal. Antes cada pantalla usaba SU trozo y nadie
     miraba el conjunto, así que el buscador tenía que ir al servidor para responder
     cosas que estaban a un palmo.

     Aquí se juntan en un solo índice. Resultado: se escribe y hay respuesta en la
     misma tecla, sin red. El servidor queda para lo único que el directorio no puede
     saber —las cotizaciones que hicieron otros—, y su respuesta también se guarda.

     Se arma al abrir el panel y cuando llega algo nuevo del servidor; no en cada
     tecla, que sería releer localStorage por cada letra. */
  var Directorio = (function () {
    var cotizaciones = [];
    var portal = [];
    var gente = [];
    var operacion = [];
    var anuncios = [];

    function cacheGet(nombre, maxEdad) {
      if (!window.AppCache) return null;
      try { var g = AppCache.get(nombre, maxEdad); return g ? g.data : null; } catch (e) { return null; }
    }

    /* Las tres listas guardadas traen la misma cotización con nombres distintos
       (el panel dice `cliente`, supervisión dice `clientName`). Se unifican aquí para
       que el buscador no tenga que saber de qué pantalla salió cada fila. */
    function normaliza(q, origen) {
      if (!q) return null;
      var folio = q.folio || '';
      if (!folio) return null;
      return {
        folio: folio,
        cliente: q.cliente || q.clientName || '',
        correoCliente: q.correoCliente || q.clientEmail || '',
        asesor: q.asesor || q.advisorName || '',
        asesorCorreo: q.asesorCorreo || q.advisorEmail || '',
        estatus: q.estatus || q.status || '',
        fecha: q.fecha || '',
        origen: origen
      };
    }

    function refrescar() {
      var correo = correoSesion();
      var vistos = Object.create(null);
      var out = [];
      function mete(lista, origen) {
        (lista || []).forEach(function (q) {
          var n = normaliza(q, origen);
          if (!n) return;
          var k = String(n.folio).toLowerCase();
          if (vistos[k]) return;
          vistos[k] = true;
          out.push(n);
        });
      }
      // Orden de preferencia: lo propio primero, que es lo que más se busca.
      mete(cacheGet('quotes-' + correo), 'propias');
      mete(cacheGet('pendientes-' + correo), 'revision');
      mete(cacheGet('sup-quotes-' + correo), 'equipo');
      cotizaciones = out;

      var pc = cacheGet('cmdk-portal', PORTAL_TTL);
      portal = pc ? indexaPortal(pc) : [];

      gente = indexaGente();
      operacion = indexaOperacion();
      anuncios = indexaAnuncios();
    }

    /* ── GENTE ──
       "¿Quién es Ana López?" y "¿sigue de alta Pedro?" son preguntas que el sistema ya
       podía contestar y a las que no había forma de llegar preguntando: había que
       saberse en qué pantalla vive la lista de miembros y abrirla. Se indexa desde la
       caché que dejaron el panel de equipo o la consola, así que no cuesta ni una
       llamada: si esa persona no ha abierto ninguna de las dos, sencillamente no hay
       nada que buscar todavía, y no se inventa. */
    function indexaGente() {
      var eq = cacheGet('equipo-panorama');
      var cns = cacheGet('consola-panorama-' + correoSesion());
      var lista = (eq && eq.asesores) || (cns && cns.miembros) || [];
      if (!lista.length) return [];
      // El destino depende de por dónde puede entrar QUIEN busca: un maestro va a la
      // consola, que es donde puede tocarlo todo; una supervisión, a su panel.
      var maestro = !!(window.AppSession && AppSession.isMaster) && puede('adm_miembros');
      return lista.map(function (m) {
        var aQuien = m.email || m.nombre || '';
        return {
          nombre: m.nombre || m.email,
          correo: m.email || '',
          rol: m.rolNombre || m.rol || '',
          activo: m.activo !== false,
          // La consola va por PESTAÑAS y el panel de equipo por ancla: cada destino se
          // abre como sabe abrirse, y en los dos casos con el buscador de esa pantalla
          // ya escrito, para caer sobre la persona y no sobre la lista entera.
          page: maestro ? 'consola' : 'inicio_avanzado',
          ancla: maestro ? '' : 'eq-seccion',
          params: maestro ? { sec: 'miembros', q: aQuien } : { q: aQuien }
        };
      });
    }

    /* ── FALLAS ABIERTAS ──
       Quien escribe "connect" casi nunca quiere una pantalla: quiere saber si está
       caído. Se responde con la incidencia misma, no con el enlace al tablero. */
    function indexaOperacion() {
      var p = cacheGet('operacion-panel') || cacheGet('operacion-estado');
      var lista = (p && (p.incidentes || p.abiertos || p.activos)) || [];
      if (!Array.isArray(lista)) return [];
      return lista.filter(function (i) { return i && (i.id || i.titulo); }).map(function (i) {
        return {
          id: i.id || '',
          titulo: i.titulo || i.sistema || 'Falla reportada',
          sistema: i.sistema || '',
          estado: i.estadoNombre || i.estado || '',
          detalle: i.submotivo || i.detalle || ''
        };
      });
    }

    /* ── ANUNCIOS PUBLICADOS ──
       Solo para quien puede administrarlos: al resto ya se los enseña el Portal en la
       portada, y sacarlos aquí sería repetir lo que esa persona no puede cambiar. */
    function indexaAnuncios() {
      if (!puede('anuncios')) return [];
      var a = cacheGet('anuncios-admin-' + correoSesion());
      var lista = (a && a.anuncios) || [];
      return lista.map(function (x) {
        var d = x.datos || {};
        return {
          id: x.id,
          titulo: d.titulo || d.mensaje || '(sin título)',
          sub: d.cuerpo || d.descripcion || '',
          estado: x.estado || (x.activo ? 'activo' : 'oculto')
        };
      });
    }

    return {
      refrescar: refrescar,
      cotizaciones: function () { return cotizaciones; },
      portal: function () { return portal; },
      gente: function () { return gente; },
      operacion: function () { return operacion; },
      anuncios: function () { return anuncios; },
      hayPortal: function () { return portal.length > 0; }
    };
  })();

  /* ═══════════════════════════════════════════════════════════════════════════
     FUENTES QUE VIVEN EN EL SERVIDOR
     ═══════════════════════════════════════════════════════════════════════════ */

  /* ── Contenido del Portal ──
     Se pide UNA vez por sesión de trabajo, la primera vez que alguien escribe algo
     de dos letras para arriba, y se guarda en la caché local. El buscador del
     Portal así deja de ser "el de la portada": llega igual desde la pantalla de
     cotización sin cargar nada de más en pantallas donde nadie lo va a usar. */
  var PORTAL_TTL = 30 * 60 * 1000;
  var portalPidiendo = false;

  /** A qué sección del Portal pertenece cada grupo (para llevar directo allá). */
  var SECCION = {
    'Herramientas': 'herramientas', 'Paqueterías': 'paqueterias', 'Formatos': 'formatos',
    'Pago web': 'pdepago', 'Presentaciones': 'presentaciones', 'Plantillas': 'plantillas'
  };

  function pidePortal(alLlegar) {
    if (Directorio.hayPortal() || portalPidiendo) return;
    if (!(window.AppRun && window.AppCache)) return;
    portalPidiendo = true;
    AppRun.call('fetchToolsData', [], { key: 'cmdk-portal', busy: false }).then(function (d) {
      portalPidiendo = false;
      if (!d) return;
      AppCache.set('cmdk-portal', d, { ttl: PORTAL_TTL });
      Directorio.refrescar();
      alLlegar();
    }, function () { portalPidiendo = false; alLlegar(); });
  }

  /** Aplana las hojas del Portal a una sola lista buscable. */
  function indexaPortal(d) {
    var out = [];
    function liga(v) {
      var s = String(v == null ? '' : v).trim();
      if (!s || s === '#') return '';
      return s.indexOf('http') === 0 ? s : 'https://' + s;
    }
    function mete(filas, grupo, icono, fNombre, fSub, fLiga, fExtra) {
      (filas || []).forEach(function (r) {
        var nombre = String(r[fNombre] || '').trim();
        if (!nombre) return;
        out.push({
          grupo: grupo, seccion: SECCION[grupo] || '', icono: icono, nombre: nombre,
          sub: String(r[fSub] || '').trim(),
          extra: (fExtra || []).map(function (f) { return String(r[f] || ''); }).join(' '),
          href: fLiga ? liga(r[fLiga]) : ''
        });
      });
    }
    mete(d.herramientas,   'Herramientas',   IC.llave,   'nombre', 'descripcion',   'enlace', ['comoAcceder', 'claves']);
    mete(d.paqueterias,    'Paqueterías',    IC.caja,    'nombre', 'soms',          'liga',   []);
    mete(d.formatos,       'Formatos',       IC.doc,     'acceso', 'observaciones', 'liga',   []);
    mete(d.pdePago,        'Pago web',       IC.tarjeta, 'nombre', 'detalles',      'liga',   []);
    mete(d.presentaciones, 'Presentaciones', IC.capas,   'nombre', 'descripcion',   'liga',   []);
    mete(d.plantillas,     'Plantillas',     IC.correo,  'titulo', 'asunto',        null,     ['cuerpo', 'tipo']);
    return out;
  }

  /* ── Personas del equipo ──
     Solo para quien puede gestionarlas. Mismo trato que el contenido del Portal: se
     pide UNA vez, la primera vez que esa persona escribe algo, y se guarda. Sin esto,
     buscar a un compañero solo funcionaba si antes se había abierto el panel de equipo
     —la caché la dejaba esa pantalla—, y "a veces encuentra a Ana y a veces no" es
     peor que no buscar personas en absoluto: enseña a no fiarse del buscador. */
  var GENTE_TTL = 5 * 60 * 1000;
  var gentePidiendo = false;

  function pideGente(alLlegar) {
    if (gentePidiendo || !conSesion()) return;
    if (Directorio.gente().length) return;
    if (!(window.AppRun && window.AppCache)) return;
    if (!puede('sup_equipo') && !puede('adm_miembros')) return;
    gentePidiendo = true;
    AppRun.call('equipoPanorama', [correoSesion()], { key: 'cmdk-equipo', busy: false })
      .then(function (r) {
        gentePidiendo = false;
        if (!r || !r.success) return;
        AppCache.set('equipo-panorama', r, { ttl: GENTE_TTL });
        Directorio.refrescar();
        alLlegar();
      }, function () { gentePidiendo = false; });
  }

  /* ── Cotizaciones del equipo ──
     El directorio ya resuelve las propias sin red. El servidor se consulta solo por
     lo que le falta —las de otros asesores— y con antirrebote: sin esto, escribir un
     folio de doce caracteres dispararía doce lecturas de la hoja de cálculo. */
  var COTS_TTL = 3 * 60 * 1000;
  var cotsServidor = { termino: '', filas: [], pidiendo: false };

  function pideCots(termino, alLlegar) {
    if (!(window.AppRun && window.AppSession)) return;
    var t = String(termino || '').trim();
    if (t.length < 3) return;
    if (cotsServidor.termino === t && !cotsServidor.pidiendo) return;

    var clave = 'cmdk-cots-' + (window.AppBuscar ? AppBuscar.compacta(t) : t.toLowerCase());
    var guardado = window.AppCache ? AppCache.get(clave, COTS_TTL) : null;
    if (guardado && guardado.data) {
      cotsServidor = { termino: t, filas: guardado.data, pidiendo: false };
      alLlegar();
      return;
    }
    cotsServidor = { termino: t, filas: [], pidiendo: true };
    alLlegar();
    AppRun.call('buscarCotizaciones', [AppSession.userEmail, t, 8], { key: 'cmdk-cot-' + t, busy: false })
      .then(function (r) {
        var filas = (r && r.success && r.quotes) ? r.quotes : [];
        if (window.AppCache) {
          AppCache.set(clave, filas, { ttl: COTS_TTL });
          // Cada término escrito deja su propia entrada. Sin podar, una tarde de
          // búsquedas llena el almacenamiento con respuestas que ya caducaron y le
          // quita sitio a lo que sí se reaprovecha (la lista del panel).
          AppCache.prune('cmdk-cots-', 12, clave);
        }
        if (cotsServidor.termino !== t) return;   // ya se tecleó otra cosa
        cotsServidor = { termino: t, filas: filas, pidiendo: false };
        alLlegar();
      }, function () {
        if (cotsServidor.termino === t) { cotsServidor.pidiendo = false; alLlegar(); }
      });
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     LA PANTALLA DONDE ESTAMOS (para los enlaces compartibles)
     ═══════════════════════════════════════════════════════════════════════════
     Dentro del recuadro de Apps Script, location.search NO es la dirección de la
     pestaña: hay que preguntársela a google.script.url. Se hace una sola vez al
     cargar, y de paso se recoge ?buscar= para abrir el panel con la búsqueda ya
     escrita —así un enlace a una búsqueda es un enlace de verdad. */
  var paginaActual = '';
  function leerUbicacion(alSaber) {
    // Primero lo que el servidor YA inyectó al renderizar (PARAMS_VISTA en Code.gs).
    // Es síncrono y llega antes de que se pinte nada, así que un enlace con ?buscar=
    // abre el panel de inmediato en vez de esperar el viaje de getLocation —que tarda
    // lo suyo y hacía que el panel se abriera solo cuando ya estabas leyendo la
    // pantalla, pareciendo un fallo y no una respuesta al enlace—.
    var inyectado = '';
    try { inyectado = (window.AppUrl && AppUrl.param('buscar')) || ''; } catch (e) {}

    try {
      if (window.google && google.script && google.script.url && google.script.url.getLocation) {
        // Se sigue preguntando: el nombre de la PÁGINA no viaja inyectado y hace falta
        // para que "copiar enlace a esta búsqueda" apunte a donde estamos.
        google.script.url.getLocation(function (loc) {
          var p = (loc && loc.parameter) || {};
          paginaActual = p.page || paginaActual || '';
          if (inyectado && !p.buscar) p.buscar = inyectado;
          alSaber(p);
        });
        if (inyectado) alSaber({ buscar: inyectado });   // no se espera para abrir
        return;
      }
    } catch (e) {}
    try {
      var qs = new URLSearchParams(window.location.search);
      paginaActual = qs.get('page') || '';
      alSaber({ page: paginaActual, buscar: inyectado || qs.get('buscar') || '' });
    } catch (e) { alSaber({ buscar: inyectado }); }
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     PANEL
     ═══════════════════════════════════════════════════════════════════════════ */
  var fondo = null, caja = null, lista = null, panel = null, cuerpo = null, botonEnlace = null;
  var filas = [];        // resultados planos, en el orden en que se ven
  var activo = -1;
  var relojTecleo = null;
  var abierto = false;
  var animando = false;
  var devuelveFoco = null;
  var disparador = null; // el botón del que nace el panel

  function conGsap() {
    if (typeof window.gsap === 'undefined') return false;
    try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false; }
    catch (e) {}
    return true;
  }

  function construye() {
    if (fondo) return;
    fondo = document.createElement('div');
    fondo.className = 'cmdk-backdrop';
    fondo.id = 'cmdkFondo';
    fondo.setAttribute('role', 'dialog');
    fondo.setAttribute('aria-modal', 'true');
    fondo.setAttribute('aria-label', 'Buscador general');
    fondo.innerHTML =
      '<div class="cmdk-panel"><div class="cmdk-cuerpo">' +
        '<div class="cmdk-head">' + IC.lupa +
          '<input class="cmdk-input" id="cmdkInput" type="text" autocomplete="off" spellcheck="false" ' +
            'placeholder="Busca una función, un folio o el correo del cliente…" ' +
            'role="combobox" aria-expanded="true" aria-controls="cmdkLista" aria-autocomplete="list">' +
          '<button type="button" class="cmdk-borrar" id="cmdkBorrar" aria-label="Limpiar la búsqueda">' + IC.cerrar + '</button>' +
          '<button type="button" class="cmdk-esc" id="cmdkEsc">esc</button>' +
        '</div>' +
        '<div class="cmdk-list" id="cmdkLista" role="listbox" aria-label="Resultados"></div>' +
        '<div class="cmdk-foot">' +
          '<span><kbd>↑</kbd><kbd>↓</kbd> Moverse</span>' +
          '<span><kbd>↵</kbd> Abrir</span>' +
          '<span><kbd>esc</kbd> Cerrar</span>' +
          '<button type="button" class="cmdk-enlace" id="cmdkEnlace" hidden>' + IC.liga + 'Copiar enlace de esta búsqueda</button>' +
        '</div>' +
      '</div></div>';
    document.body.appendChild(fondo);

    panel = fondo.querySelector('.cmdk-panel');
    cuerpo = fondo.querySelector('.cmdk-cuerpo');
    caja = fondo.querySelector('#cmdkInput');
    lista = fondo.querySelector('#cmdkLista');
    botonEnlace = fondo.querySelector('#cmdkEnlace');
    if (conGsap()) fondo.classList.add('cmdk-gsap');

    fondo.addEventListener('mousedown', function (e) { if (e.target === fondo) cerrar(); });
    fondo.querySelector('#cmdkEsc').addEventListener('click', cerrar);
    fondo.querySelector('#cmdkBorrar').addEventListener('click', function () {
      caja.value = ''; caja.focus(); alTeclear();
    });
    botonEnlace.addEventListener('click', copiaEnlace);
    caja.addEventListener('input', alTeclear);
    caja.addEventListener('keydown', alTeclado);
    lista.addEventListener('click', function (e) {
      var act = e.target.closest ? e.target.closest('.cmdk-act') : null;
      if (act) { e.stopPropagation(); abreLiga(act.getAttribute('data-href')); return; }
      var pista = e.target.closest ? e.target.closest('.cmdk-pista') : null;
      if (pista) { caja.value = pista.getAttribute('data-q'); caja.focus(); alTeclear(); return; }
      var el = e.target.closest ? e.target.closest('.cmdk-item') : null;
      if (el) ejecuta(parseInt(el.getAttribute('data-i'), 10));
    });
    lista.addEventListener('mousemove', function (e) {
      var el = e.target.closest ? e.target.closest('.cmdk-item') : null;
      if (!el) return;
      var i = parseInt(el.getAttribute('data-i'), 10);
      if (i !== activo) marca(i, false);
    });
  }

  function alTeclear() {
    clearTimeout(relojTecleo);
    pinta();                                  // el directorio responde en la misma tecla
    var t = caja.value.trim();
    fondo.querySelector('#cmdkBorrar').classList.toggle('ver', !!t);
    if (t.length >= 2) {
      relojTecleo = setTimeout(function () {
        pidePortal(pinta);
        pideGente(pinta);
        pideCots(t, pinta);
      }, 240);
    }
  }

  function alTeclado(e) {
    if (e.key === 'Escape') { e.preventDefault(); cerrar(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); marca(activo + 1, true); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); marca(activo - 1, true); return; }
    if (e.key === 'Home' && filas.length) { e.preventDefault(); marca(0, true); return; }
    if (e.key === 'End' && filas.length) { e.preventDefault(); marca(filas.length - 1, true); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      // Con un folio escrito y nada seleccionado, Enter va derecho a buscarlo: es lo
      // que quiere quien pegó un folio y pulsó Enter sin mirar la lista.
      if (activo < 0 && window.AppBuscar && AppBuscar.esFolio(caja.value)) { vaAFolio(caja.value.trim()); return; }
      ejecuta(activo);
    }
  }

  function marca(i, desplaza) {
    if (!filas.length) { activo = -1; return; }
    if (i < 0) i = filas.length - 1;
    if (i >= filas.length) i = 0;
    activo = i;
    var nodos = lista.querySelectorAll('.cmdk-item');
    for (var k = 0; k < nodos.length; k++) {
      var on = parseInt(nodos[k].getAttribute('data-i'), 10) === i;
      nodos[k].classList.toggle('on', on);
      nodos[k].setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) {
        caja.setAttribute('aria-activedescendant', nodos[k].id);
        if (desplaza && nodos[k].scrollIntoView) nodos[k].scrollIntoView({ block: 'nearest' });
      }
    }
  }

  /* ── Armado de los resultados ── */
  function calcula(q) {
    var B = window.AppBuscar;
    var grupos = [];
    var vacia = !q;

    // 1) Funciones de la app
    var dst = destinos().concat(acciones());
    if (vacia) {
      var mem = leerLista(K_RECIENTES);
      var pref = dst.filter(function (d) { return mem.indexOf(d.id) !== -1; })
                    .sort(function (a, b) { return mem.indexOf(a.id) - mem.indexOf(b.id); });
      var resto = dst.filter(function (d) { return mem.indexOf(d.id) === -1 && !d.fn; });
      var fn0 = pref.concat(resto).slice(0, 7);
      if (fn0.length) grupos.push({ tipo: 'fn', titulo: pref.length ? 'Lo que sueles abrir' : 'Ir a', icono: IC.flecha, filas: fn0 });
      return grupos;
    }

    /* Un folio o un correo no son ambiguos: quien los escribe busca UNA cotización,
       no una pantalla. Sin esta salvedad, teclear "jperez@hotmail.com" sacaba primero
       tres plantillas de correo —porque "com" es el principio de "compra"— y el folio
       que se buscaba quedaba debajo. */
    var esCotizacion = B.esCorreo(q) || B.esFolio(q);

    /* Con VARIAS palabras se exigen todas: "estado de cuenta" debe traer la plantilla
       de estado de cuenta, no todo lo que tenga la palabra "cuenta". Con una sola se
       es generoso, que es cuando hace falta. */
    var variasPalabras = B.consulta(q).palabras.length > 1;
    var camposCatalogo = function (d) {
      return [{ t: d.nombre, p: 3 }, { t: d.sub, p: 1 }, { t: d.kw, p: 1.4 }];
    };

    var fn = esCotizacion ? [] : B.filtra(dst, q, camposCatalogo,
      { limite: 6, exigirTodas: variasPalabras, conPuntaje: true });
    if (fn.length) grupos.push({ tipo: 'fn', titulo: 'Funciones', icono: IC.flecha,
                                 mejor: fn[0].score, filas: fn.map(function (r) { return r.item; }) });

    /* 1b) Apartados DENTRO de una pantalla. Van en su propio grupo y no mezclados con
       las funciones: "Bitácora" y "Consola" no son la misma respuesta, y
       ponerlas juntas obligaría a leer el subtítulo para distinguirlas. Se puntúan un
       punto por debajo (peso .92) para que, cuando el nombre coincide en los dos, gane
       la pantalla entera —que es el destino más seguro— y el apartado quede justo
       debajo, a un golpe de flecha. */
    var sec = esCotizacion ? [] : B.filtra(secciones(), q, camposCatalogo,
      { limite: 5, exigirTodas: variasPalabras, conPuntaje: true });
    if (sec.length) grupos.push({ tipo: 'sec', titulo: 'Apartados', icono: IC.capas,
                                  mejor: sec[0].score * .92, filas: sec.map(function (r) { return r.item; }) });

    // 2) Cotizaciones: el directorio local primero (sin red), el equipo después.
    if (conSesion()) {
      var yo = correoSesion();
      var locales = B.filtra(Directorio.cotizaciones(), q, function (c) {
        return [{ t: c.folio, p: 3 }, { t: c.cliente, p: 2 }, { t: c.correoCliente, p: 2 },
                { t: c.asesor, p: 1 }, { t: c.estatus, p: .6 }];
      }, { limite: 5, conPuntaje: true });
      var vistos = Object.create(null);
      var mejorCot = locales.length ? locales[0].score : 0;
      var cots = locales.map(function (r) {
        var c = r.item;
        vistos[String(c.folio).toLowerCase()] = true;
        var d = {};
        for (var k in c) d[k] = c[k];
        d.local = true;
        d.mia = !d.asesorCorreo || d.asesorCorreo.toLowerCase() === yo;
        return d;
      });
      // De quién es cada folio lo resuelve la pantalla y no el servidor: la respuesta
      // de una búsqueda se guarda en caché por término y la reaprovecha todo el equipo.
      (cotsServidor.termino === q ? cotsServidor.filas : []).forEach(function (c) {
        if (cots.length >= 8) return;
        if (vistos[String(c.folio || '').toLowerCase()]) return;
        c.mia = !!yo && String(c.asesorCorreo || '').toLowerCase() === yo;
        cots.push(c);
      });
      if (cots.length) grupos.push({ tipo: 'cot', titulo: 'Cotizaciones', icono: IC.doc,
                                     mejor: Math.max(mejorCot, 400), filas: cots });
    }

    // 3) Contenido del Portal
    var pc = esCotizacion ? [] : B.filtra(Directorio.portal(), q, function (p) {
      return [{ t: p.nombre, p: 3 }, { t: p.sub, p: 1.2 }, { t: p.extra, p: .7 }];
    }, { limite: 6, conPuntaje: true });
    if (pc.length) grupos.push({ tipo: 'portal', titulo: 'Portal Ventel', icono: IC.globo,
                                 mejor: pc[0].score, filas: pc.map(function (r) { return r.item; }) });

    if (conSesion()) {
      /* 4) GENTE. Un correo escrito entero busca una cotización de ese cliente, no a un
         compañero, así que ahí no se ofrece: el correo de un asesor se encuentra igual
         escribiendo su nombre, y quien teclea una dirección completa está buscando un
         folio nueve de cada diez veces. */
      var pers = esCotizacion ? [] : B.filtra(Directorio.gente(), q, function (g) {
        return [{ t: g.nombre, p: 3 }, { t: g.correo, p: 1.8 }, { t: g.rol, p: .8 }];
      }, { limite: 4, conPuntaje: true });
      if (pers.length) grupos.push({ tipo: 'gente', titulo: 'Personas', icono: IC.llave,
                                     mejor: pers[0].score, filas: pers.map(function (r) { return r.item; }) });

      /* 5) FALLAS ABIERTAS. Se empujan por encima de su puntaje bruto (×1.15) porque
         una caída en curso es lo más urgente que el buscador puede tener que decir:
         quien escribe "connect" mientras está caído necesita esa línea arriba, no la
         herramienta del Portal que se llama parecido. */
      var ops = esCotizacion ? [] : B.filtra(Directorio.operacion(), q, function (o) {
        return [{ t: o.sistema, p: 3 }, { t: o.titulo, p: 2 }, { t: o.detalle, p: 1 }, { t: o.estado, p: .6 }];
      }, { limite: 3, conPuntaje: true });
      if (ops.length) grupos.push({ tipo: 'op', titulo: 'Fallas abiertas', icono: IC.pulso,
                                    mejor: ops[0].score * 1.15, filas: ops.map(function (r) { return r.item; }) });

      /* 6) CLIENTES QUE ESPERAN UNA LLAMADA. Se pregunta a AppAtenciones, que contesta
         con lo que ya tiene en memoria o en su caché: ni un viaje al servidor, porque
         esto se calcula en cada tecla.

         Se empujan por encima de su puntaje bruto —y con un suelo— por dos razones. La
         primera es la misma que la de las fallas: alguien esperando una llamada que ya
         se le prometió es lo más urgente que el buscador puede tener que decir. La
         segunda es de mecánica: el módulo encuentra por teléfono comparando solo dígitos
         ("5512345678" contra "55 1234 5678"), y esa coincidencia —la más frecuente de
         todas, porque se teclea el número que aparece en la pantalla del teléfono— no
         puntúa como texto y quedaría enterrada bajo cualquier pantalla que se llame
         parecido. */
      var atn = (esCotizacion || !window.AppAtenciones || !AppAtenciones.coincidencias)
        ? [] : AppAtenciones.coincidencias(q, 3);
      if (atn.length) {
        var Qatn = B.consulta(q);
        var mejorAtn = 0;
        atn.forEach(function (a) {
          var s = B.puntua(Qatn, [{ t: a.cliente, p: 3 }, { t: a.telefono, p: 2 },
                                  { t: a.tipo, p: 1 }, { t: a.notas, p: .6 }]);
          if (s > mejorAtn) mejorAtn = s;
        });
        grupos.push({ tipo: 'aten', titulo: 'Clientes esperando llamada', icono: IC.reloj,
                      mejor: Math.max(mejorAtn, 70) * 1.1, filas: atn });
      }

      // 7) ANUNCIOS (solo quien los administra).
      var anun = esCotizacion ? [] : B.filtra(Directorio.anuncios(), q, function (a) {
        return [{ t: a.titulo, p: 3 }, { t: a.sub, p: 1 }];
      }, { limite: 3, conPuntaje: true });
      if (anun.length) grupos.push({ tipo: 'anuncio', titulo: 'Anuncios', icono: IC.megafono,
                                     mejor: anun[0].score, filas: anun.map(function (r) { return r.item; }) });
    }

    /* El grupo que MEJOR responde va arriba, no el que estaba primero en el código.
       Escribir un nombre de cliente tiene que enseñar su cotización antes que una
       pantalla que casualmente lleva esa palabra en su descripción. */
    grupos.sort(function (a, b) { return (b.mejor || 0) - (a.mejor || 0); });

    // 4) Salida explícita al buscador completo, siempre al final. Es la que resuelve
    //    "no está en la lista": lleva al panel que corresponde al rol CON la búsqueda
    //    ya aplicada, que allí sí tiene filtros, fechas y descarga.
    if (conSesion() && q.length >= 3) {
      var haciaPanel = puede('supervision') ? 'inicio_avanzado' : 'dashboard';
      grupos.push({ tipo: 'todo', titulo: 'Seguir buscando', icono: IC.lupa, mejor: -1, filas: [{
        nombre: 'Buscar «' + q + '» en todas las cotizaciones',
        sub: haciaPanel === 'inicio_avanzado'
          ? 'Abre el panel avanzado con filtros, fechas y descarga'
          : 'Abre tu panel con la búsqueda aplicada',
        page: haciaPanel, params: { q: q }
      }] });
    }
    return grupos;
  }

  function pinta() {
    var q = caja.value.trim();
    var B = window.AppBuscar;
    var grupos = calcula(q);
    filas = [];
    var html = '';

    function fila(clase, contenido) {
      var i = filas.length - 1;
      return '<div class="cmdk-item' + (clase ? ' ' + clase : '') + '" role="option" aria-selected="false" ' +
             'id="cmdkFila' + i + '" data-i="' + i + '">' + contenido + '</div>';
    }

    /* Esqueletos: mientras el servidor contesta se ve la FORMA de lo que falta, así
       la lista no pega un salto al llegar y "sin resultados" no parece definitivo.
       Van pegados a las cotizaciones —que es lo que se está esperando— y no al final
       de todo, donde parecerían una cuarta categoría suelta. */
    var esperando = q.length >= 2 && (cotsServidor.pidiendo || (portalPidiendo && !Directorio.hayPortal()));
    var huesos = '<div class="cmdk-group">' + IC.reloj + 'Buscando en el equipo<span class="n">…</span></div>' +
      '<div class="cmdk-hueso"><i></i><span class="cmdk-tx"><u></u><u></u></span></div>' +
      '<div class="cmdk-hueso"><i></i><span class="cmdk-tx"><u></u><u></u></span></div>';
    var huesosPuestos = false;

    grupos.forEach(function (g) {
      // Justo antes de "Seguir buscando", que es la última salida y siempre va al final.
      if (esperando && !huesosPuestos && g.tipo === 'todo') { html += huesos; huesosPuestos = true; }
      html += '<div class="cmdk-group">' + g.icono + g.titulo + '<span class="n">' + g.filas.length + '</span></div>';
      g.filas.forEach(function (r) {
        filas.push({ tipo: g.tipo, dato: r });

        if (g.tipo === 'cot') {
          var quien = r.mia ? '<span class="cmdk-tag mia">Tuya</span>'
                            : (r.asesor ? '<span class="cmdk-tag">' + esc(r.asesor) + '</span>' : '');
          var detalle = [r.cliente, r.correoCliente, r.estatus].filter(Boolean).join(' · ');
          html += fila('',
            '<span class="cmdk-chip">' + IC.doc + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.folio || 'Sin folio', q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(detalle, q) + '</span>' +
            '</span>' + quien +
            '<span class="cmdk-enter">↵ Abrir</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else if (g.tipo === 'portal') {
          var accion = r.href
            ? '<button type="button" class="cmdk-act" data-href="' + esc(r.href) + '" title="Abrir el enlace" aria-label="Abrir el enlace">' + IC.externo + '</button>'
            : '';
          html += fila('',
            '<span class="cmdk-chip">' + r.icono + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.nombre, q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(B.extracto(r.sub, q, 90) || r.grupo, q) + '</span>' +
            '</span>' +
            '<span class="cmdk-tag">' + esc(r.grupo) + '</span>' + accion +
            '<span class="cmdk-enter">↵ Ver</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else if (g.tipo === 'todo') {
          html += fila('',
            '<span class="cmdk-chip">' + IC.lupa + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + esc(r.nombre) + '</span>' +
              '<span class="cmdk-sub">' + esc(r.sub) + '</span>' +
            '</span>' +
            '<span class="cmdk-enter">↵ Ir</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else if (g.tipo === 'gente') {
          // El rol y la baja van en la propia línea: "¿sigue de alta Pedro?" se
          // contesta leyendo el resultado, sin tener que abrir nada.
          var etiqueta = r.activo
            ? (r.rol ? '<span class="cmdk-tag">' + esc(r.rol) + '</span>' : '')
            : '<span class="cmdk-tag">Dado de baja</span>';
          html += fila('',
            '<span class="cmdk-chip">' + IC.llave + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.nombre, q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(r.correo, q) + '</span>' +
            '</span>' + etiqueta +
            '<span class="cmdk-enter">↵ Ver</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else if (g.tipo === 'op') {
          html += fila('',
            '<span class="cmdk-chip">' + IC.pulso + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.sistema || r.titulo, q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(r.titulo !== r.sistema ? r.titulo : (r.detalle || ''), q) + '</span>' +
            '</span>' +
            (r.estado ? '<span class="cmdk-tag">' + esc(r.estado) + '</span>' : '') +
            '<span class="cmdk-enter">↵ Ver</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else if (g.tipo === 'aten') {
          // El teléfono va en la línea, y en grande: la mitad de las veces el resultado
          // se lee para marcarlo, no para abrir nada.
          var deQuien = r.mia
            ? '<span class="cmdk-tag mia">Tuya</span>'
            : '<span class="cmdk-tag">' + esc(r.asesorNombre || 'Liberada') + '</span>';
          html += fila('',
            '<span class="cmdk-chip">' + IC.reloj + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.cliente || 'Sin nombre', q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(r.telefono || '', q) +
                (r.tipo ? ' · ' + esc(r.tipo) : '') + '</span>' +
            '</span>' + deQuien +
            '<span class="cmdk-enter">↵ Ver</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else if (g.tipo === 'anuncio') {
          html += fila('',
            '<span class="cmdk-chip">' + IC.megafono + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.titulo, q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(B.extracto(r.sub, q, 90), q) + '</span>' +
            '</span>' +
            (r.estado ? '<span class="cmdk-tag">' + esc(r.estado) + '</span>' : '') +
            '<span class="cmdk-enter">↵ Editar</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else {
          html += fila('',
            '<span class="cmdk-chip">' + r.icono + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + (q ? B.resalta(r.nombre, q) : esc(r.nombre)) + '</span>' +
              '<span class="cmdk-sub">' + esc(r.sub) + '</span>' +
            '</span>' +
            '<span class="cmdk-enter">↵ ' + (r.fn ? 'Aplicar' : 'Abrir') + '</span>' +
            '<span class="cmdk-go">' + IC.flecha + '</span>');
        }
      });
    });

    if (esperando && !huesosPuestos) html += huesos;

    if (!filas.length && !esperando) {
      var sugerencias = q ? [] : leerLista(K_BUSQUEDAS).slice(0, 5);
      html = '<div class="cmdk-vacio">' + IC.lupa +
        (q ? '<div>Nada coincide con <b>' + esc(q) + '</b>.</div>' +
             '<div style="margin-top:.4rem;font-size:.8rem">Prueba con el folio completo, el correo del cliente o el nombre de la pantalla.</div>'
           : '<div>Escribe para buscar.</div>' +
             '<div style="margin-top:.4rem;font-size:.8rem">Pantallas y apartados, folios, clientes, personas del equipo, ' +
             'contenido del Portal, las fallas abiertas y los clientes que esperan una llamada.</div>') +
        (sugerencias.length
          ? '<div class="cmdk-pistas">' + sugerencias.map(function (s) {
              return '<button type="button" class="cmdk-pista" data-q="' + esc(s) + '">' + esc(s) + '</button>';
            }).join('') + '</div>'
          : '') +
        '</div>';
    }

    lista.innerHTML = html;
    botonEnlace.hidden = !q;
    botonEnlace.innerHTML = IC.liga + 'Copiar enlace de esta búsqueda';
    activo = -1;
    if (filas.length) marca(0, false);
  }

  /* ── Ejecutar el resultado elegido ──────────────────────────────────────────
     Todo destino viaja por la URL, y a propósito: un resultado abre su pantalla YA
     situada —la sección del Portal filtrada por lo que se escribió, el folio abierto,
     el panel con la búsqueda puesta— en vez de dejar a alguien en la portada de esa
     pantalla teniendo que repetir la búsqueda que acababa de hacer. */
  function ejecuta(i) {
    if (i < 0 || i >= filas.length) return;
    var f = filas[i];
    var q = caja.value.trim();
    recordar(K_BUSQUEDAS, q, 5);

    if (f.tipo === 'fn' || f.tipo === 'sec') {
      var d = f.dato;
      recordar(K_RECIENTES, d.id, 6);
      if (d.fn) { d.fn(); pinta(); return; }   // ajuste local: el panel se queda abierto
      navega(d.page, d.params || {}, d.ancla);
      return;
    }
    if (f.tipo === 'cot') { vaAFolio(f.dato.folio); return; }
    if (f.tipo === 'todo') { navega(f.dato.page, f.dato.params); return; }
    if (f.tipo === 'gente') { navega(f.dato.page, f.dato.params || {}, f.dato.ancla); return; }
    if (f.tipo === 'op')    { navega('estado', { inc: f.dato.id }); return; }
    if (f.tipo === 'aten') {
      // Se va a la atención con la pestaña puesta y el buscador ya escrito con el
      // teléfono: allí queda esa tarjeta sola en pantalla. Donde el módulo esté
      // cargado, esto abre el panel encima sin perder lo que se estaba haciendo (ver
      // el desvío en app_atenciones); donde no, abre la pantalla completa igual de
      // situada. El destino se escribe una vez y funciona en los dos casos.
      navega('atenciones', { sec: f.dato.donde, q: f.dato.telefono || f.dato.cliente });
      return;
    }
    if (f.tipo === 'anuncio') { navega('anuncios', { q: f.dato.titulo }); return; }
    if (f.tipo === 'portal') {
      var p = f.dato;
      // La sección del Portal, filtrada por lo que se escribió y con el elemento
      // elegido ya resaltado. Es exactamente lo que hace el buscador de la portada al
      // pulsar un resultado, y ahora se consigue desde cualquier pantalla porque todo
      // el destino cabe en la URL: sección, búsqueda y elemento.
      if (p.seccion) { navega('portal', { sec: p.seccion, q: q, item: p.nombre }); return; }
      if (p.href) { abreLiga(p.href); return; }
      navega('portal', {});
    }
  }

  function navega(page, params, ancla) {
    cerrar(true);
    if (window.VentelLoader) VentelLoader.show();
    if (window.AppUrl) AppUrl.go(page, params || {}, ancla);
  }

  function abreLiga(href) {
    if (!href) return;
    window.open(href, '_blank', 'noopener');
    cerrar();
  }

  function vaAFolio(folio) {
    if (!folio) return;
    try { if (window.AppSession) AppSession.selectedFolio = folio; } catch (e) {}
    navega('consulta_cotizacion', { folio: folio });
  }

  /** Enlace a ESTA búsqueda, en ESTA pantalla. Se pega en un chat y abre lo mismo. */
  function copiaEnlace() {
    var q = caja.value.trim();
    if (!q || !window.AppUrl) return;
    AppUrl.copyLink(paginaActual || 'dashboard', { buscar: q }).then(function (ok) {
      botonEnlace.innerHTML = IC.liga + (ok ? 'Enlace copiado' : 'No se pudo copiar');
      setTimeout(function () {
        if (botonEnlace) botonEnlace.innerHTML = IC.liga + 'Copiar enlace de esta búsqueda';
      }, 1800);
    });
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     APERTURA Y CIERRE — transformación de contenedor (FLIP)
     ═══════════════════════════════════════════════════════════════════════════
     El panel NACE del botón de buscar: crece desde su sitio exacto hasta ocupar su
     forma final, y al cerrarse vuelve a encogerse hacia él. No es decoración —es lo
     que enseña dónde vive el buscador. Quien lo abrió con Ctrl+K ve de dónde salió y
     la próxima vez sabe dónde está el botón.

     POR QUÉ SE REESCRIBIÓ ESTA ANIMACIÓN
     ------------------------------------
     Antes se animaban `left`, `top`, `width` y `height`. Eso obliga al navegador a
     recalcular la disposición de la página en CADA fotograma: el panel lleva dentro
     una lista de resultados y el reparto de esa lista se rehacía sesenta veces por
     segundo. En un equipo de mostrador el resultado era exactamente lo que se
     describía como "pegajoso": no es que fuera lenta, es que se saltaba fotogramas.

     Ahora es un FLIP: el panel se queda SIEMPRE en su sitio y su tamaño finales, y lo
     único que cambia es `transform`, que el navegador compone en la GPU sin volver a
     medir nada. Se calcula la transformación que lleva la caja final justo encima del
     botón, se parte de ahí y se anima hasta la identidad.

     LA CONTRAESCALA, que es lo que hacía falta para poder usar FLIP aquí:
     escalar el panel escalaría el texto con él —el motivo por el que la versión
     anterior no lo usaba—. Se corrige aplicando al cuerpo la escala INVERSA: el marco
     crece y el contenido se queda del tamaño que le toca. Es el mismo truco que usan
     los paneles de macOS al abrirse desde un icono.

     Lo único que no es transform es el radio de las esquinas, y se conserva a
     propósito: sin él la pastilla no se convierte en panel, se estira. Un cambio de
     radio repinta, pero no vuelve a medir la página, que era el problema. */
  function rectDisparador() {
    var b = disparador && disparador.isConnected ? disparador
          : (document.getElementById('cmdkAbrir') || document.getElementById('cmdkFlota'));
    if (!b) return null;
    var r = b.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return { el: b, left: r.left, top: r.top, width: r.width, height: r.height };
  }

  /**
   * La transformación que pone la caja `destino` justo encima de `origen`.
   *
   * Con transformOrigin en la esquina superior izquierda, el desplazamiento es la
   * diferencia de esquinas y la escala es la razón de tamaños. Se acota por abajo
   * porque una escala de 0 es una matriz sin inversa: la contraescala del contenido
   * saldría infinita y GSAP escribiría `scale(Infinity)`, que el navegador descarta
   * y deja el panel visible de golpe, sin animación.
   */
  function flip(origen, destino) {
    if (!origen || !destino || !destino.width || !destino.height) return null;
    return {
      x: origen.left - destino.left,
      y: origen.top - destino.top,
      sx: Math.max(origen.width / destino.width, .02),
      sy: Math.max(origen.height / destino.height, .02)
    };
  }

  function abrir(termino) {
    construye();
    if (abierto) { caja.focus(); caja.select(); return; }
    abierto = true;
    devuelveFoco = document.activeElement;

    // El directorio se rearma al abrir: entre una búsqueda y otra pudo guardarse una
    // cotización nueva o refrescarse la lista del panel.
    Directorio.refrescar();

    fondo.classList.add('open');
    document.documentElement.style.overflow = 'hidden';
    caja.value = termino || '';
    fondo.querySelector('#cmdkBorrar').classList.toggle('ver', !!termino);
    pinta();
    caja.focus();
    if (termino) { caja.select(); alTeclear(); }

    if (!conGsap()) return;
    var origen = rectDisparador();
    var destino = panel.getBoundingClientRect();
    if (!destino.width) return;

    animando = true;
    fondo.classList.add('cmdk-anima');
    var cabeza = fondo.querySelector('.cmdk-head');
    var resto = fondo.querySelectorAll('.cmdk-list, .cmdk-foot');
    var tl = gsap.timeline({
      onComplete: function () {
        animando = false;
        fondo.classList.remove('cmdk-anima');
        gsap.set([panel, cuerpo], { clearProps: 'transform,transformOrigin,borderRadius' });
        gsap.set([cabeza].concat([].slice.call(resto)), { clearProps: 'opacity,y' });
      }
    });

    tl.fromTo(fondo, { opacity: 0 }, { opacity: 1, duration: .18, ease: 'power1.out' }, 0);

    var salto = origen ? flip(origen, destino) : null;

    if (salto) {
      // El panel ya está donde tiene que estar; solo se le pone encima la
      // transformación que lo lleva al botón, y desde ahí se anima a la identidad.
      gsap.set(panel, { transformOrigin: '0 0' });
      gsap.set(cuerpo, { transformOrigin: '0 0' });

      tl.fromTo(panel,
        { x: salto.x, y: salto.y, scaleX: salto.sx, scaleY: salto.sy, borderRadius: 12 },
        { x: 0, y: 0, scaleX: 1, scaleY: 1, borderRadius: 18,
          duration: .44, ease: 'power3.out', force3D: true }, 0);

      // Contraescala: deshace en el contenido lo que se le hace al marco, así el texto
      // nunca aparece achatado ni estirado mientras el panel crece.
      tl.fromTo(cuerpo,
        { scaleX: 1 / salto.sx, scaleY: 1 / salto.sy },
        { scaleX: 1, scaleY: 1, duration: .44, ease: 'power3.out', force3D: true }, 0);

      /* La CAJA DE TEXTO entra enseguida y los resultados después. Es lo que hace que
         se lea como una transformación y no como una ventana que aparece encima: el
         botón dice "Buscar" con una lupa y se convierte en un campo con la misma lupa,
         listo para escribir. Con todo el contenido retrasado se veía crecer un
         rectángulo blanco vacío, que parece que algo está cargando. */
      tl.fromTo(cabeza, { opacity: 0 }, { opacity: 1, duration: .16, ease: 'power1.out' }, .04);
      tl.fromTo(resto, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .26, stagger: .05, ease: 'power2.out' }, .17);
      // El botón se apaga mientras el panel ocupa su lugar: es el mismo objeto.
      tl.to(origen.el, { opacity: .25, duration: .2, ease: 'power1.out' }, 0);
    } else {
      // Sin botón visible (atajo de teclado en una pantalla que aún no lo pintó):
      // entrada sobria desde arriba, que es de donde cuelga el panel.
      tl.fromTo(panel, { opacity: 0, y: -14, scale: .985 },
                       { opacity: 1, y: 0, scale: 1, duration: .3, ease: 'power3.out', clearProps: 'transform' }, 0);
    }
  }

  /**
   * @param {boolean=} instantaneo true cuando la pantalla se va a cambiar igual: no
   *   tiene sentido gastar tres décimas encogiendo un panel que nadie va a ver
   *   volver a su sitio, y deja el desplazamiento de la página libre enseguida.
   */
  function cerrar(instantaneo) {
    if (!abierto) return;
    abierto = false;
    clearTimeout(relojTecleo);
    caja.removeAttribute('aria-activedescendant');

    var terminar = function () {
      animando = false;
      fondo.classList.remove('open', 'cmdk-anima');
      if (window.gsap) {
        gsap.set(fondo, { clearProps: 'opacity' });
        gsap.set([panel, cuerpo], { clearProps: 'transform,transformOrigin,borderRadius,opacity' });
        gsap.set(fondo.querySelectorAll('.cmdk-head, .cmdk-list, .cmdk-foot'), { clearProps: 'opacity,y' });
      }
      document.documentElement.style.overflow = '';
      try { if (devuelveFoco && devuelveFoco.focus) devuelveFoco.focus({ preventScroll: true }); } catch (e) {}
      devuelveFoco = null;
    };

    if (instantaneo || !conGsap()) {
      if (window.gsap) gsap.killTweensOf([fondo, panel, cuerpo]);
      var b = rectDisparador();
      if (b && window.gsap) gsap.set(b.el, { clearProps: 'opacity' });
      terminar();
      return;
    }

    var origen = rectDisparador();
    // Se mide el panel SIN su transformación puesta: getBoundingClientRect devuelve la
    // caja ya transformada, y si quedara algo de la apertura a medias, el salto de
    // cierre partiría de una posición falsa y el panel daría un tirón al empezar.
    gsap.set([panel, cuerpo], { clearProps: 'transform' });
    var actualRect = panel.getBoundingClientRect();
    var salto = flip(origen, actualRect);

    if (!salto) {
      gsap.to(fondo, { opacity: 0, duration: .16, ease: 'power1.in', onComplete: terminar });
      return;
    }

    animando = true;
    fondo.classList.add('cmdk-anima');
    gsap.set(panel, { transformOrigin: '0 0' });
    gsap.set(cuerpo, { transformOrigin: '0 0' });

    var tl = gsap.timeline({ onComplete: terminar });
    tl.to(fondo.querySelectorAll('.cmdk-head, .cmdk-list, .cmdk-foot'),
          { opacity: 0, duration: .12, ease: 'power1.in' }, 0);
    tl.to(panel, { x: salto.x, y: salto.y, scaleX: salto.sx, scaleY: salto.sy,
                   borderRadius: 12, duration: .3, ease: 'power3.inOut', force3D: true }, .04);
    tl.to(cuerpo, { scaleX: 1 / salto.sx, scaleY: 1 / salto.sy,
                    duration: .3, ease: 'power3.inOut', force3D: true }, .04);
    tl.to(fondo, { opacity: 0, duration: .18, ease: 'power1.in' }, .14);
    tl.to(origen.el, { opacity: 1, duration: .2, ease: 'power1.out' }, .12);
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     ENGANCHE CON LA PANTALLA
     ═══════════════════════════════════════════════════════════════════════════ */

  /** ¿El foco está en un sitio donde «/» es una barra y no un atajo? */
  function escribiendo(el) {
    if (!el) return false;
    var t = (el.tagName || '').toLowerCase();
    return t === 'input' || t === 'textarea' || t === 'select' || el.isContentEditable;
  }

  function botonHTML() {
    return '<button type="button" class="cmdk-abrir" id="cmdkAbrir" aria-label="Buscar en todo el sistema" ' +
      'title="Buscar en todo el sistema (Ctrl+K)">' +
      IC.lupa + '<span class="cmdk-abrir-tx">Buscar…</span><kbd>Ctrl K</kbd></button>';
  }

  function desdeBoton(b) {
    disparador = b;
    b.addEventListener('click', function () { disparador = b; abrir(); });
  }

  /**
   * Pone el disparador en la barra superior. Se llama solo, pero AppShell dibuja
   * su barra con JS después de este archivo: por eso se reintenta unas veces en
   * vez de rendirse en el primer intento.
   */
  function ponBoton(intentos) {
    if (document.getElementById('cmdkAbrir') || document.getElementById('cmdkFlota')) return;
    var sesion = document.querySelector('.topbar .shell-session');
    var barra = document.querySelector('.topbar');
    if (!sesion && !barra) {
      // AppShell dibuja su barra por JS —dentro del DOMContentLoaded de la pantalla,
      // justo después de este archivo—, así que se reintenta un momento antes de dar
      // por hecho que esta pantalla no tiene barra. Poco tiempo a propósito: en las
      // que de verdad no la tienen, el botón flotante no debe tardar en salir.
      if ((intentos || 0) < 10) { setTimeout(function () { ponBoton((intentos || 0) + 1); }, 120); return; }
      ponFlotante();
      return;
    }
    var envoltura = document.createElement('span');
    envoltura.innerHTML = botonHTML();
    var btn = envoltura.firstChild;

    // Dónde cae el botón según cómo esté armada la barra de esa pantalla:
    // antes del saludo en las pantallas de app, y justo después del hueco
    // elástico en el Monitor de promociones (si no, quedaba detrás del reloj).
    if (sesion) sesion.insertBefore(btn, sesion.firstChild);
    else {
      var hueco = barra.querySelector('.spacer');
      if (hueco && hueco.nextSibling) barra.insertBefore(btn, hueco.nextSibling);
      else barra.appendChild(btn);
    }
    desdeBoton(btn);
  }

  /** Botón flotante para las pantallas sin barra superior. */
  function ponFlotante() {
    if (document.getElementById('cmdkFlota') || document.getElementById('cmdkAbrir')) return;
    if (!document.body) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cmdk-flota';
    b.id = 'cmdkFlota';
    b.setAttribute('aria-label', 'Buscar en todo el sistema');
    b.title = 'Buscar en todo el sistema (Ctrl+K)';
    b.innerHTML = IC.lupa + '<span class="cmdk-flota-tx">Buscar</span>';
    document.body.appendChild(b);
    desdeBoton(b);
  }

  function atajos(e) {
    if (animando) return;
    // Ctrl+K / ⌘K abren desde donde sea, incluso escribiendo en un campo.
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault(); abrir(); return;
    }
    if (abierto) return;
    // «/» solo cuando no se está escribiendo: en un formulario es una barra.
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !escribiendo(document.activeElement)) {
      e.preventDefault(); abrir(); return;
    }
  }

  function arranca() {
    if (!window.AppBuscar || !window.AppUrl) return;   // sin motor o sin rutas, no hay buscador
    document.addEventListener('keydown', atajos);
    ponBoton(0);
    // ?buscar=… abre el panel con la búsqueda ya escrita. Un enlace a una búsqueda
    // vale para pegarlo en un chat: quien lo abre ve exactamente lo mismo.
    //
    // leerUbicacion puede contestar DOS veces —el parámetro inyectado llega enseguida y
    // el nombre de la página tarda lo que tarde getLocation—, así que la apertura se
    // hace una sola vez: abrir dos veces con la misma búsqueda le robaría el foco a
    // quien ya hubiera empezado a teclear otra cosa.
    var yaAbierto = false;
    leerUbicacion(function (p) {
      if (!p || !p.buscar || yaAbierto) return;
      yaAbierto = true;
      setTimeout(function () { abrir(String(p.buscar)); }, 260);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();

  window.AppComando = {
    abrir: abrir,
    cerrar: cerrar,
    /** Destinos permitidos, para que otras pantallas ofrezcan la misma lista. */
    destinos: destinos,
    /** Vuelve a leer las cachés (una pantalla que acaba de guardar puede avisar). */
    refrescar: function () { Directorio.refrescar(); if (abierto) pinta(); },
    /** HTML del disparador, por si una pantalla lo quiere en otro sitio. */
    botonHTML: botonHTML,
    montarBoton: function () { ponBoton(0); }
  };
})();
</script>
