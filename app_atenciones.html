<style>
/* =====================================================================================
   ATENCIONES POSPUESTAS Y PENDIENTES · estilos
   =====================================================================================
   Todo se pinta con los tokens del tema (--surface/--ink/--line/--brand), así que hereda
   los tres temas y el modo de alto contraste sin una línea extra.

   Regla de movimiento de este módulo: NADA se anima con propiedades que provoquen
   reflow, salvo la altura del detalle desplegable —que es intrínsecamente de layout— y
   ahí se acota con `contain` para que el recálculo no salga de la tarjeta. Ver la nota
   junto a .atn-detalle. */

.atn-aviso {
  position: fixed; z-index: 10040;
  right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  width: min(24rem, calc(100vw - 2rem));
  background: var(--surface, #fff); color: var(--ink, #1B2330);
  border: 1px solid var(--line, #E4E9F0); border-left: 3px solid var(--brand, #E10098);
  border-radius: 14px; box-shadow: var(--sh-lg, 0 24px 48px -20px rgba(27,35,48,.28));
  padding: .95rem 1rem;
  font-family: var(--f-ui, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
  /* Nace invisible y desplazado: GSAP lo trae. Sin esto se ve un fotograma en su sitio
     final antes de que arranque la animación. */
  opacity: 0;
}
.atn-aviso, .atn-aviso *, .atn-aviso *::before, .atn-aviso *::after { box-sizing: border-box; }
.atn-aviso-top { display: flex; gap: .6rem; align-items: flex-start; margin-bottom: .7rem; }
.atn-aviso-ic {
  width: 2rem; height: 2rem; border-radius: 9px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--brand-tint, #FDE7F4); color: var(--brand, #E10098);
}
.atn-aviso-ic svg { width: 1.1rem; height: 1.1rem; }
.atn-aviso-tx { min-width: 0; }
.atn-aviso-tx b { display: block; font-size: .88rem; font-weight: 700; line-height: 1.35; }
.atn-aviso-tx p { margin: .2rem 0 0; font-size: .82rem; line-height: 1.5; color: var(--ink-soft, #5C6B7E); }
.atn-aviso-btns { display: flex; gap: .5rem; justify-content: flex-end; }

.atn-lista { display: grid; gap: .6rem; }
.atn-card {
  border: 1px solid var(--line, #E4E9F0); border-radius: var(--rad, 12px);
  background: var(--surface, #fff); overflow: hidden;
}
.atn-card.atn-urgente { border-left: 3px solid var(--warn, #B45309); }
.atn-card-top {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: .5rem .9rem; align-items: start; padding: .8rem .95rem;
}
.atn-quien { min-width: 0; }
.atn-nombre { display: block; font-size: .95rem; font-weight: 700; color: var(--ink, #1B2330);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.atn-meta { display: flex; flex-wrap: wrap; gap: .35rem .6rem; margin-top: .25rem;
  font-size: .78rem; color: var(--ink-soft, #5C6B7E); align-items: center; }
.atn-tel { font-family: var(--f-mono, ui-monospace, monospace); letter-spacing: .01em; }
.atn-chip {
  display: inline-flex; align-items: center; gap: .25rem; padding: .12rem .5rem;
  border-radius: 999px; font-size: .7rem; font-weight: 700;
  background: var(--surface-2, #F4F7FA); color: var(--ink-soft, #5C6B7E);
}
.atn-chip.priv { background: var(--surface-2, #F4F7FA); }
.atn-chip.libre { background: var(--info-bg, #EAF0FE); color: var(--info, #1D4ED8); }
.atn-chip.urge { background: var(--warn-bg, #FDF1E0); color: var(--warn, #B45309); }
.atn-acciones { display: flex; gap: .35rem; flex-wrap: wrap; justify-content: flex-end; }

/* El desplegable de "Consultar".
   Animar una altura ES una animación de layout, no hay forma de evitarlo si el
   contenido de abajo tiene que moverse de verdad (un scaleY deformaría el texto y un
   opacity dejaría un hueco vacío mientras está cerrado).

   Lo que sí se puede es acotar el coste: `contain: layout paint` le promete al
   navegador que nada de dentro afecta al layout de fuera, así que el recálculo se queda
   en esta caja en vez de recorrer la lista entera. Con veinte tarjetas en pantalla, esa
   es la diferencia entre 60 fps y un desplegable que da tirones. El contenido de dentro
   sí se mueve con transform + opacity, que no cuestan nada. */
.atn-detalle { height: 0; overflow: hidden; contain: layout paint; }
.atn-detalle-in {
  padding: 0 .95rem .9rem; border-top: 1px solid var(--line, #E4E9F0);
  display: grid; gap: .7rem;
}
.atn-campo { font-size: .82rem; line-height: 1.55; }
.atn-campo b { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-faint, #94A1B2); margin-bottom: .1rem; font-weight: 700; }
.atn-campo p { margin: 0; color: var(--ink-soft, #5C6B7E); white-space: pre-wrap; }
.atn-notas-edit { display: grid; gap: .45rem; }
.atn-notas-edit textarea { min-height: 5rem; resize: vertical; }

.atn-tabs { display: flex; gap: .3rem; margin-bottom: .9rem; flex-wrap: wrap; }
.atn-tab {
  border: 1px solid var(--line, #E4E9F0); background: var(--surface, #fff);
  color: var(--ink-soft, #5C6B7E); border-radius: 999px; cursor: pointer;
  padding: .4rem .85rem; font-size: .82rem; font-weight: 600; font-family: inherit;
  display: inline-flex; align-items: center; gap: .4rem;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.atn-tab[aria-selected="true"] { color: var(--brand, #E10098); border-color: var(--brand, #E10098);
  background: var(--brand-tint, #FDE7F4); }
.atn-tab-num { font-size: .72rem; font-weight: 800; padding: 0 .35rem; border-radius: 999px;
  background: var(--surface-2, #F4F7FA); }
.atn-tab[aria-selected="true"] .atn-tab-num { background: rgba(255,255,255,.6); }

.atn-vacio { padding: 2rem 1rem; text-align: center; color: var(--ink-soft, #5C6B7E); font-size: .86rem; }
.atn-vacio b { display: block; color: var(--ink, #1B2330); font-size: .95rem; margin-bottom: .25rem; }

.atn-form { display: grid; gap: .75rem; }
.atn-form .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
@media (max-width: 520px) { .atn-form .fila2 { grid-template-columns: 1fr; } }
.atn-form small.ayuda { display: block; font-size: .76rem; color: var(--ink-soft, #5C6B7E); margin-top: .2rem; }

/* Hora fija de liberación. La caja se anima en altura al aparecer, así que lleva la
   misma contención que el desplegable de las tarjetas: el recálculo se queda dentro. */
#atn-hora-fija { overflow: hidden; contain: layout paint; }
.atn-horas { display: flex; flex-wrap: wrap; gap: .35rem; }
.atn-hora-chip {
  border: 1px solid var(--line, #E4E9F0); background: var(--surface, #fff);
  color: var(--ink-soft, #5C6B7E); border-radius: 999px; cursor: pointer;
  padding: .3rem .7rem; font-size: .8rem; font-weight: 600; font-family: inherit;
  font-variant-numeric: tabular-nums;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.atn-hora-chip:hover { color: var(--ink, #1B2330); border-color: var(--brand-soft, #FBD0E9); }
.atn-hora-chip[aria-pressed="true"] { color: var(--brand, #E10098);
  border-color: var(--brand, #E10098); background: var(--brand-tint, #FDE7F4); }
.atn-hora-chip:focus-visible { outline: none; box-shadow: var(--ring, 0 0 0 4px rgba(225,0,152,.16)); }
#atn-liberar-hora { font-variant-numeric: tabular-nums; max-width: 8rem; }

@media (prefers-reduced-motion: reduce) { .atn-hora-chip { transition-duration: .01ms; } }

@media (prefers-reduced-motion: reduce) {
  .atn-aviso { opacity: 1; }
  .atn-tab { transition-duration: .01ms; }
}
@media print { .atn-aviso { display: none !important; } }
</style>
<script>
/**
 * =====================================================================================
 * ATENCIONES POSPUESTAS Y PENDIENTES | Sistema de cotizaciones Ventel
 * =====================================================================================
 * La mitad cliente de Atenciones.gs. Se incluye después de app_core, app_motion y
 * app_icons:
 *
 *      <?!= include('app_atenciones') ?>
 *
 * TRES PIEZAS, Y SE USAN POR SEPARADO
 * -----------------------------------
 *   AppAtenciones.sugerir()        El aviso que sale tras reportar una falla. Es lo que
 *                                  hace que este módulo se use: nadie va a buscar una
 *                                  herramienta de rescate en el momento en que tiene un
 *                                  cliente enfadado en la línea, así que la herramienta
 *                                  sale a buscarlo a él.
 *   AppAtenciones.registrar()      El formulario, en un modal. Veinte segundos.
 *   AppAtenciones.montar(host)     La gestión completa dentro de un contenedor.
 *
 * EL ENFRIAMIENTO DE DOS MINUTOS
 * ------------------------------
 * "Ahora no" tiene que significar ahora no, y durante un rato. Cuando un sistema se cae,
 * un asesor reporta varias veces en pocos minutos —Connect, luego el buscador, luego el
 * carrito— y si el aviso saliera con cada reporte se convertiría en el diálogo que se
 * cierra sin leer. A la tercera vez ya nadie lo ve, y cuando de verdad hiciera falta
 * tampoco.
 *
 * Los dos minutos se guardan en localStorage y NO en memoria, a propósito: entre un
 * reporte y el siguiente la persona cambia de pantalla, y en Apps Script cada pantalla
 * es una carga completa que se lleva por delante cualquier variable. Con el
 * enfriamiento en memoria, "ahora no" duraba hasta el siguiente clic en el menú.
 */
(function () {
  'use strict';

  var CD_CLAVE = 'atenciones-pospuesto';
  var CD_MS = 2 * 60 * 1000;          // los dos minutos del enfriamiento
  var TTL_PANORAMA = 60 * 1000;       // la lista se revalida cada minuto

  var aviso = null;                   // nodo del aviso flotante
  var avisoTl = null;                 // su animación de entrada
  var host = null;                    // contenedor de la gestión, si está montada
  var datos = null;                   // último panorama
  var pestana = 'mias';
  var abiertas = {};                  // { id: true } tarjetas desplegadas

  // ── Utilidades ───────────────────────────────────────────────────────────

  function esc(s) {
    return window.AppBuscar ? AppBuscar.escapa(s) : String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function reducido() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch (e) { return false; }
  }
  function conGsap() { return typeof window.gsap !== 'undefined' && !reducido(); }
  function haySesion() { return !!(window.AppSession && AppSession.isLoggedIn()); }
  function correo() { return (window.AppSession && AppSession.userEmail) || ''; }
  function puede() { return !!(window.AppSession && AppSession.can('atenciones')); }
  function toast(m, t) { if (window.AppMotion) AppMotion.toast(m, t); }

  function llamar(fn, args) {
    if (window.AppRun && AppRun.call) return AppRun.call(fn, args, { key: 'aten-' + fn });
    return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args);
    });
  }

  var IC = {
    reloj: '<path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/>',
    tel: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2Z"/>',
    copiar: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    check: '<path d="M4.5 12.75l6 6 9-13.5"/>',
    chevron: '<path d="m6 9 6 6 6-6"/>',
    usuario: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    rescate: '<path d="M12 3v6m0 0 3-3m-3 3L9 6"/><path d="M4 13v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M4 13h5l1.5 2.5h3L15 13h5"/>',
    aviso: '<path d="M12 9v3.75m0 3.375h.007M10.34 3.94 1.98 18a1.75 1.75 0 0 0 1.51 2.62h17.02A1.75 1.75 0 0 0 22.02 18L13.66 3.94a1.75 1.75 0 0 0-3.02 0Z"/>'
  };
  function svg(d, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }

  /** "hace 12 min", "hace 2 h". Es el dato que decide a quién se llama primero. */
  function desdeHace(iso) {
    if (!iso) return '';
    var ms = Date.now() - new Date(iso).getTime();
    if (isNaN(ms) || ms < 0) return '';
    var min = Math.floor(ms / 60000);
    if (min < 1) return 'hace un momento';
    if (min < 60) return 'hace ' + min + ' min';
    var h = Math.floor(min / 60);
    if (h < 24) return 'hace ' + h + ' h';
    var d = Math.floor(h / 24);
    return d === 1 ? 'ayer' : 'hace ' + d + ' días';
  }

  /** "en 25 min", "en 2 h", "ya". Lo contrario de desdeHace: mira hacia adelante. */
  function enCuanto(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var ms = d.getTime() - Date.now();
    if (isNaN(ms)) return '';
    if (ms <= 0) return 'ya';
    var min = Math.ceil(ms / 60000);
    if (min < 60) return 'en ' + min + ' min';

    // A partir de una hora se dice LA HORA y no "en 3 h". Es lo que se pidió al elegir
    // una hora fija —"hasta las 17:00"— y también lo más útil en las relativas largas:
    // quien mira su lista a las 15:40 necesita saber si le da tiempo antes de las cinco,
    // y "en 3 h" le obliga a hacer la cuenta con el cliente esperando.
    var hh = d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
    var hoy = new Date();
    var mismoDia = d.getDate() === hoy.getDate() &&
                   d.getMonth() === hoy.getMonth() &&
                   d.getFullYear() === hoy.getFullYear();
    return (mismoDia ? 'a las ' : 'mañana a las ') + hh;
  }

  /** Cuánto dura una reserva, según lo diga el servidor. */
  function reservaMin() { return (datos && datos.reservaMin) || 15; }

  /** "12 min", "1 min", "menos de 1 min". Para la cuenta atrás de la reserva. */
  function minutosTexto(ms) {
    var min = Math.floor((Number(ms) || 0) / 60000);
    if (min <= 0) return 'menos de 1 min';
    return min + ' min';
  }

  /** Una atención lleva demasiado esperando: se marca para que salte a la vista. */
  function urgente(a) {
    var ms = Date.now() - new Date(a.fecha).getTime();
    return !isNaN(ms) && ms > 60 * 60 * 1000;      // más de una hora
  }

  // ── Enfriamiento ─────────────────────────────────────────────────────────

  function enfriando() {
    if (!window.AppCache) return false;
    var g = AppCache.get(CD_CLAVE, CD_MS);
    return !!(g && g.data);
  }
  function posponer() {
    if (window.AppCache) AppCache.set(CD_CLAVE, { at: Date.now() }, { ttl: CD_MS });
  }

  // ── Aviso flotante ───────────────────────────────────────────────────────

  /**
   * Muestra la recomendación. No hace nada si no toca, y esa es la mitad del trabajo:
   * un aviso que sale cuando no debe es peor que no tenerlo.
   *
   * @param {object=} opts { sistema: 'Connect' }
   */
  function sugerir(opts) {
    if (!haySesion() || !puede()) return false;
    if (aviso) return false;              // ya está en pantalla
    if (enfriando()) return false;        // dijo "ahora no" hace menos de dos minutos

    var sistema = (opts && opts.sistema) || '';

    aviso = document.createElement('div');
    aviso.className = 'atn-aviso no-print';
    aviso.setAttribute('role', 'status');
    aviso.innerHTML =
      '<div class="atn-aviso-top">' +
        '<span class="atn-aviso-ic">' + svg(IC.tel) + '</span>' +
        '<div class="atn-aviso-tx">' +
          '<b>' + esc(sistema ? sistema + ' está fallando.' : 'El sistema está fallando.') + '</b>' +
          '<p>¿Tienes un cliente en línea? Pulsa aquí para registrar su información y ' +
          'retomar la atención posteriormente.</p>' +
        '</div>' +
      '</div>' +
      '<div class="atn-aviso-btns">' +
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-no>Ahora no</button>' +
        '<button type="button" class="v-btn v-btn-primary v-btn-sm" data-atn-si>Registrar cliente</button>' +
      '</div>';
    document.body.appendChild(aviso);

    aviso.querySelector('[data-atn-no]').addEventListener('click', function () {
      // "Ahora no" ARRANCA el enfriamiento. Cerrar con la X no lo haría, y por eso no hay
      // X: las dos salidas de este aviso son decisiones, no descartes accidentales.
      posponer();
      cerrarAviso();
    });
    aviso.querySelector('[data-atn-si]').addEventListener('click', function () {
      cerrarAviso();
      registrar({ sistema: sistema });
    });

    if (conGsap()) {
      // Entra desde abajo con transform + opacity. Nada más: este aviso aparece justo
      // cuando la pantalla está repintando el acuse del reporte, y es el peor momento
      // para pedirle al navegador que recalcule un layout.
      avisoTl = gsap.timeline();
      avisoTl.fromTo(aviso,
        { opacity: 0, y: 24, scale: .96 },
        { opacity: 1, y: 0, scale: 1, duration: .45, ease: 'power3.out', force3D: true })
        .from(aviso.querySelector('.atn-aviso-ic'),
          { scale: .5, duration: .4, ease: 'back.out(2.4)', force3D: true }, '-=.28')
        .from(aviso.querySelectorAll('.atn-aviso-btns .v-btn'),
          { opacity: 0, y: 8, duration: .28, stagger: { amount: .08 }, force3D: true }, '-=.24')
        .set([aviso, aviso.querySelector('.atn-aviso-ic'), aviso.querySelectorAll('.atn-aviso-btns .v-btn')],
          { clearProps: 'transform' });
    } else {
      aviso.style.opacity = '1';
    }
    return true;
  }

  function cerrarAviso() {
    if (!aviso) return;
    var nodo = aviso;
    aviso = null;
    if (avisoTl) { avisoTl.kill(); avisoTl = null; }
    var quitar = function () { if (nodo.parentNode) nodo.parentNode.removeChild(nodo); };
    if (conGsap()) {
      gsap.to(nodo, { opacity: 0, y: 14, scale: .98, duration: .22,
                      ease: 'power2.in', force3D: true, onComplete: quitar });
    } else { quitar(); }
  }

  // ── Formulario de registro ───────────────────────────────────────────────

  /**
   * Opciones de "si no lo atiendo yo".
   *
   * El valor del <option> lleva el TIPO delante ("rel:60", "hora", "nunca") y no solo el
   * número de minutos. Con solo el número, "nunca" y "a una hora fija" tendrían que
   * distinguirse por convenciones tipo 0 y -1, y ese es el tipo de código que se lee mal
   * seis meses después. El tipo va escrito.
   */
  function opcionesLiberar() {
    var lista = (datos && datos.opcionesLiberar) || [
      { tipo: 'nunca',    min: 0,   nombre: 'Nunca · solo yo la veo' },
      { tipo: 'relativa', min: 60,  nombre: 'En 1 hora' },
      { tipo: 'relativa', min: 240, nombre: 'En 4 horas' },
      { tipo: 'hora',     nombre: 'A una hora fija del día…' }
    ];
    return lista.map(function (o) {
      var valor = o.tipo === 'hora' ? 'hora'
                : o.tipo === 'nunca' ? 'nunca'
                : 'rel:' + o.min;
      return '<option value="' + esc(valor) + '">' + esc(o.nombre) + '</option>';
    }).join('');
  }

  /** Horas de fin de turno sugeridas, como botones. Teclear una hora es un paso de más. */
  function horasSugeridasHTML() {
    var horas = (datos && datos.horasSugeridas) || ['15:00', '17:00', '19:00', '21:00'];
    return horas.map(function (h) {
      return '<button type="button" class="atn-hora-chip" data-atn-hora="' + esc(h) + '">' +
        esc(h) + '</button>';
    }).join('');
  }

  /**
   * ¿La hora tecleada es válida? Espejo de atenParsearHora_ en el servidor.
   *
   * La comprobación está en los dos lados a propósito y las dos tienen que decir lo
   * mismo: aquí para avisar sin gastar un viaje, y allí porque el cliente se puede
   * editar. Se aceptan las cuatro formas que la gente teclea de verdad —"17:00", "17",
   * "5:30", "17.30"— en vez de exigir una: rechazar "17" cuando se entiende
   * perfectamente es hacer trabajar a quien tiene un cliente esperando.
   */
  function horaValida(v) {
    var m = String(v == null ? '' : v).trim().match(/^(\d{1,2})\s*[:.\s]?\s*(\d{2})?$/);
    if (!m) return false;
    var h = Number(m[1]);
    var min = m[2] === undefined ? 0 : Number(m[2]);
    return h >= 0 && h <= 23 && min >= 0 && min <= 59;
  }

  /** Nombre corto de la zona de la operación, para poder rotularla. */
  function zonaTexto() {
    var z = (datos && datos.zonaHoraria) || '';
    return z ? z.split('/').pop().replace(/_/g, ' ') : '';
  }

  function opcionesTipo() {
    var lista = (datos && datos.tipos) || ['Venta', 'Seguimiento', 'Aclaración', 'Otro'];
    return lista.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; })
      .join('') + '<option value="__nuevo">Otro… (escribir)</option>';
  }

  /**
   * Abre el formulario de registro.
   *
   * El orden de los campos es el orden en que se piden por teléfono: nombre, teléfono,
   * y lo demás. El botón se puede pulsar en cuanto hay nombre y teléfono; todo lo que
   * viene después es opcional a propósito, porque este formulario se rellena con alguien
   * esperando en la línea y un campo obligatorio de más es una atención que no se
   * registra.
   */
  function registrar(opts) {
    if (!haySesion() || !puede()) { toast('Necesitas iniciar sesión para registrar atenciones.', 'warn'); return; }
    opts = opts || {};

    // Se pide el catálogo si no se tiene, pero NO se espera: el formulario sale ya con
    // los tipos base y se enriquece cuando llegue. Hacer esperar aquí sería exactamente
    // el segundo que no hay.
    if (!datos) cargar(false);

    var contexto = opts.sistema
      ? 'Se registrará junto al reporte de <strong>' + esc(opts.sistema) + '</strong>.'
      : 'Guarda los datos ahora y retoma la atención cuando el sistema se recupere.';

    modal('Registrar atención pendiente',
      '<p class="cns-confirm-tx">' + contexto + '</p>' +
      '<div class="atn-form">' +
        '<div><label class="v-label" for="atn-cliente">Nombre del cliente *</label>' +
        '<input id="atn-cliente" class="v-input" autocomplete="off" maxlength="90" placeholder="Ana López"></div>' +
        '<div class="fila2">' +
          '<div><label class="v-label" for="atn-tel">Teléfono *</label>' +
          '<input id="atn-tel" class="v-input" type="tel" autocomplete="off" maxlength="40" placeholder="55 1234 5678"></div>' +
          '<div><label class="v-label" for="atn-correo">Correo (opcional)</label>' +
          '<input id="atn-correo" class="v-input" type="email" autocomplete="off" maxlength="120" placeholder="ana@correo.com"></div>' +
        '</div>' +
        '<div class="fila2">' +
          '<div><label class="v-label" for="atn-tipo">Tipo de atención</label>' +
          '<select id="atn-tipo" class="v-select">' + opcionesTipo() + '</select>' +
          '<input id="atn-tipo-nuevo" class="v-input" style="margin-top:.4rem" hidden ' +
                 'maxlength="40" placeholder="¿Qué tipo de atención es?"></div>' +
          '<div><label class="v-label" for="atn-hora">Hora de promesa (opcional)</label>' +
          '<input id="atn-hora" class="v-input" autocomplete="off" maxlength="40" placeholder="Hoy a las 5 pm"></div>' +
        '</div>' +
        '<div><label class="v-label" for="atn-notas">Anotaciones</label>' +
        '<textarea id="atn-notas" class="v-input" rows="3" maxlength="600" ' +
                  'placeholder="Qué buscaba, qué le prometiste, folio si lo hay…"></textarea></div>' +
        '<div><label class="v-label" for="atn-liberar">Si no la atiendo…</label>' +
        '<select id="atn-liberar" class="v-select">' + opcionesLiberar() + '</select>' +
        '<small class="ayuda">Pasado ese tiempo, cualquier asesor podrá verla y llamar al cliente. ' +
        'Con «Nunca», la atención es solo tuya para siempre.</small></div>' +
      '</div>' +
      '<p class="cns-ajuste-nota mal" id="atn-error" hidden></p>',
      'Guardar atención',
      function (cerrar, boton) {
        var cliente = val('atn-cliente');
        var tel = val('atn-tel');
        var err = document.getElementById('atn-error');
        var fallo = function (m) {
          err.hidden = false; err.textContent = m;
          if (window.AppMotion) AppMotion.shake(err);
        };

        if (!cliente) return fallo('Escribe el nombre del cliente.');
        if (String(tel).replace(/\D/g, '').length < 7) {
          return fallo('Hace falta un teléfono al que devolverle la llamada.');
        }

        var tipoSel = val('atn-tipo');
        var tipo = tipoSel === '__nuevo' ? val('atn-tipo-nuevo') : tipoSel;

        // La liberación se manda como UNA de las dos formas, nunca las dos. El servidor
        // da prioridad a la hora fija si llegan juntas, y mandar ambas dejaría el
        // resultado dependiendo de ese desempate en vez de de lo que se eligió aquí.
        var libSel = val('atn-liberar');
        var libMin = 0;
        var libHora = '';
        if (libSel === 'hora') {
          libHora = val('atn-liberar-hora');
          if (!horaValida(libHora)) {
            return fallo('Escribe la hora en formato de 24 horas, por ejemplo 17:00.');
          }
        } else if (libSel.indexOf('rel:') === 0) {
          libMin = Number(libSel.slice(4)) || 0;
        }
        // 'nunca' se queda con los dos vacíos: privada para siempre.

        boton.disabled = true;
        boton.textContent = 'Guardando…';

        llamar('atencionRegistrar', [correo(), {
          cliente: cliente, telefono: tel, correo: val('atn-correo'),
          tipo: tipo || 'Otro', notas: val('atn-notas'),
          horaPromesa: val('atn-hora'),
          liberarMin: libMin, liberarHora: libHora
        }]).then(function (r) {
          boton.disabled = false;
          boton.textContent = 'Guardar atención';
          if (!r || !r.success) return fallo((r && r.message) || 'No pudimos guardar la atención.');

          // La lista local se actualiza sin pedir el panorama otra vez: la respuesta ya
          // trae la atención creada, y un viaje de vuelta solo para repintar lo que ya
          // sabemos es medio segundo regalado.
          if (datos && datos.mias) {
            datos.mias.push(r.atencion);
            datos.mias.sort(function (a, b) {
              return new Date(a.fecha).getTime() - new Date(b.fecha).getTime();
            });
            if (window.AppCache) AppCache.remove(clavePanorama());
            pintar();
          }
          cerrar();
          toast(r.message, 'ok');
        }, function () {
          boton.disabled = false;
          boton.textContent = 'Guardar atención';
          fallo('No hay conexión con el sistema. Inténtalo de nuevo.');
        });
      });

    // "Otro…" abre el campo de texto libre. Es lo que hace personalizable el tipo sin
    // obligar a nadie a pasar por una pantalla de administración para añadir uno.
    var sel = document.getElementById('atn-tipo');
    var libre = document.getElementById('atn-tipo-nuevo');
    if (sel && libre) {
      sel.addEventListener('change', function () {
        libre.hidden = sel.value !== '__nuevo';
        if (!libre.hidden) libre.focus();
      });
    }
    /* El campo de la hora fija aparece solo al elegirla. Se anima con altura porque el
       contenido de abajo tiene que bajar de verdad; es un único elemento y el coste se
       acota con `contain`, igual que el desplegable de las tarjetas. */
    var selLib = document.getElementById('atn-liberar');
    var cajaHora = document.getElementById('atn-hora-fija');
    var campoHora = document.getElementById('atn-liberar-hora');
    var notaHora = document.getElementById('atn-hora-nota');

    function pintarNotaHora() {
      if (!notaHora) return;
      var h = campoHora ? campoHora.value.trim() : '';
      var z = zonaTexto();
      if (!h || !horaValida(h)) {
        notaHora.textContent = z
          ? 'Hora de la operación (' + z + ').'
          : 'Escribe la hora en formato de 24 horas.';
        return;
      }
      // Se dice explícitamente cuándo cae, porque "17:00" registrado a las 17:30 es
      // mañana y esa es exactamente la clase de sorpresa que hace desconfiar de la
      // herramienta. Mejor decirlo antes que descubrirlo después.
      notaHora.textContent = esHoraDeManana(h)
        ? 'Se liberará mañana a las ' + h + (z ? ' (' + z + ')' : '') + '.'
        : 'Se liberará hoy a las ' + h + (z ? ' (' + z + ')' : '') + '.';
    }

    if (selLib && cajaHora) {
      selLib.addEventListener('change', function () {
        var mostrar = selLib.value === 'hora';
        if (mostrar === !cajaHora.hidden) return;
        if (mostrar) {
          cajaHora.hidden = false;
          if (conGsap()) {
            gsap.set(cajaHora, { height: 'auto' });
            gsap.from(cajaHora, { height: 0, duration: .3, ease: 'power2.out' });
            gsap.fromTo(cajaHora.children, { opacity: 0, y: -6 },
              { opacity: 1, y: 0, duration: .28, ease: 'power2.out', delay: .05,
                stagger: { amount: .06 }, force3D: true, clearProps: 'transform' });
          }
          pintarNotaHora();
          // Se preselecciona la primera sugerencia: la mayoría de la gente elige una de
          // ellas, y dejar el campo vacío obliga a teclear en el caso más común.
          if (campoHora && !campoHora.value) {
            var chips = cajaHora.querySelectorAll('[data-atn-hora]');
            if (chips.length) chips[Math.min(3, chips.length - 1)].click();
          }
        } else if (conGsap()) {
          gsap.to(cajaHora, { height: 0, duration: .24, ease: 'power2.inOut',
            onComplete: function () { cajaHora.hidden = true; gsap.set(cajaHora, { clearProps: 'height' }); } });
        } else {
          cajaHora.hidden = true;
        }
      });

      cajaHora.querySelectorAll('[data-atn-hora]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (campoHora) campoHora.value = b.getAttribute('data-atn-hora');
          cajaHora.querySelectorAll('[data-atn-hora]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
          pintarNotaHora();
        });
      });

      if (campoHora) campoHora.addEventListener('input', pintarNotaHora);
    }

    var primero = document.getElementById('atn-cliente');
    if (primero) primero.focus();
  }

  /** ¿Esa hora del día ya pasó hoy? Misma regla que aplica el servidor al resolverla. */
  function esHoraDeManana(h) {
    var m = String(h).trim().match(/^(\d{1,2})\s*[:.\s]?\s*(\d{2})?$/);
    if (!m) return false;
    var ahora = new Date();
    var objetivo = new Date();
    objetivo.setHours(Number(m[1]), m[2] === undefined ? 0 : Number(m[2]), 0, 0);
    return objetivo.getTime() <= ahora.getTime();
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? String(el.value || '').trim() : '';
  }

  // ── Modal genérico ───────────────────────────────────────────────────────

  var modalNodo = null;

  /**
   * Modal propio y no el de la pantalla anfitriona.
   *
   * Este módulo se monta en el inicio del asesor, en el panel de supervisión y —vía el
   * aviso— en CUALQUIER pantalla donde se reporte una falla. Depender del modal de cada
   * una obligaría a que las siete tuvieran uno con la misma API, y bastaría que una no
   * lo tuviera para que el registro fallara justo ahí.
   */
  function modal(titulo, cuerpo, textoOk, alAceptar) {
    cerrarModal();
    modalNodo = document.createElement('div');
    modalNodo.className = 'v-modal-overlay';
    modalNodo.innerHTML =
      '<div class="v-modal" role="dialog" aria-modal="true" aria-labelledby="atn-modal-tit" style="max-width:34rem">' +
        '<h3 id="atn-modal-tit" style="font-size:1.1rem;font-weight:700;margin:0 0 .75rem">' + esc(titulo) + '</h3>' +
        '<div class="atn-modal-cuerpo">' + cuerpo + '</div>' +
        '<div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.15rem">' +
          '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-cancel>Cancelar</button>' +
          '<button type="button" class="v-btn v-btn-primary v-btn-sm" data-atn-ok>' + esc(textoOk) + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modalNodo);

    var card = modalNodo.querySelector('.v-modal');
    modalNodo.querySelector('[data-atn-cancel]').addEventListener('click', cerrarModal);
    modalNodo.addEventListener('click', function (e) { if (e.target === modalNodo) cerrarModal(); });
    var ok = modalNodo.querySelector('[data-atn-ok]');
    ok.addEventListener('click', function () { alAceptar(cerrarModal, ok); });

    var esc0 = function (e) { if (e.key === 'Escape') cerrarModal(); };
    document.addEventListener('keydown', esc0);
    modalNodo._esc = esc0;

    if (window.AppMotion) AppMotion.modalIn(modalNodo, card);
    else modalNodo.classList.add('active');
  }

  function cerrarModal() {
    if (!modalNodo) return;
    var nodo = modalNodo;
    modalNodo = null;
    if (nodo._esc) document.removeEventListener('keydown', nodo._esc);
    var quitar = function () { if (nodo.parentNode) nodo.parentNode.removeChild(nodo); };
    if (window.AppMotion) AppMotion.modalOut(nodo, nodo.querySelector('.v-modal'), quitar);
    else quitar();
  }

  // ── Gestión ──────────────────────────────────────────────────────────────

  function clavePanorama() { return 'atenciones-' + correo(); }

  function cargar(forzar) {
    if (!haySesion() || !puede()) return Promise.resolve(null);
    if (window.AppRun && AppRun.swr) {
      return AppRun.swr(clavePanorama(), 'atencionesPanorama', [correo()], {
        ttl: TTL_PANORAMA,
        fuerza: forzar === true,
        accept: function (r) { return !!(r && r.success); },
        onData: function (r) { if (r && r.success) { datos = r; pintar(); } },
        onError: function () { if (!datos && host) host.innerHTML = vacio('Sin conexión', 'No pudimos leer tus atenciones. Vuelve a intentarlo.'); }
      });
    }
    return llamar('atencionesPanorama', [correo()]).then(function (r) {
      if (r && r.success) { datos = r; pintar(); }
      return r;
    });
  }

  function vacio(titulo, texto) {
    return '<div class="atn-vacio"><b>' + esc(titulo) + '</b>' + esc(texto) + '</div>';
  }

  function tarjeta(a, modo) {
    var mia = modo === 'mias';
    var yo = (datos && datos.yo && datos.yo.email) || '';
    // "Rescatada por ti" solo tiene sentido cuando la registró OTRA persona y la tomaste
    // tú: es lo que distingue tus clientes de los que recogiste del pool, y cambia lo que
    // dices al llamar ("le atendió un compañero y se cortó" no es "le atendí yo").
    var esRescatada = mia && a.rescatadaPor === yo && a.asesor !== yo;
    // El chip de privacidad dice SIEMPRE en qué estado está la atención, porque es la
    // decisión con consecuencias: "Solo tuya" significa que si no la atiendes nadie más
    // lo hará, y "Se libera en 25 min" significa que a partir de esa hora el cliente
    // puede recibir la llamada de otro compañero. Dejarlo implícito haría que la
    // liberación se descubriera cuando ya hubiera pasado.
    var chipPriv = a.liberarEn
      ? '<span class="atn-chip libre">' + svg(IC.reloj, 'w-3 h-3') +
        (new Date(a.liberarEn).getTime() <= Date.now()
          ? 'Liberada al equipo'
          : 'Se libera ' + esc(enCuanto(a.liberarEn))) + '</span>'
      : '<span class="atn-chip priv">Solo tuya</span>';

    // Cuenta atrás de la reserva. Es el dato que decide qué hacer ahora mismo: con tres
    // minutos se llama ya, con doce se puede terminar lo que se estaba haciendo. Un
    // "tomada" a secas obliga a mirar el reloj y a calcular.
    var chipReserva = a.reservaViva
      ? '<span class="atn-chip ' + (a.reservaRestanteMs < 5 * 60000 ? 'urge' : 'libre') + '">' +
        svg(IC.reloj, 'w-3 h-3') +
        (a.rescatadaPor === yo
          ? 'La tienes ' + minutosTexto(a.reservaRestanteMs)
          : 'Tomada · ' + minutosTexto(a.reservaRestanteMs)) + '</span>'
      : '';

    var acciones = '';
    if (mia) {
      // Quien la registró puede soltarla YA, sin esperar a la hora que puso al crearla.
      // Solo se ofrece si todavía no está liberada: sobre una que ya lo está no haría
      // nada, y un botón que no hace nada enseña a desconfiar de los demás.
      var yaLibre = !!a.liberarEn && new Date(a.liberarEn).getTime() <= Date.now();
      var puedeLiberar = a.asesor === yo && !yaLibre;

      acciones =
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-ver="' + esc(a.id) + '" ' +
                'aria-expanded="' + (abiertas[a.id] ? 'true' : 'false') + '">Consultar</button>' +
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-copiar="' + esc(a.telefono) + '" ' +
                'title="Copiar el teléfono">' + svg(IC.copiar, 'w-4 h-4') + '</button>' +
        (puedeLiberar
          ? '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-liberar="' + esc(a.id) + '" ' +
                    'title="Que cualquier asesor pueda tomarla y llamar al cliente">' +
              svg(IC.rescate, 'w-4 h-4') + 'Liberar</button>'
          : '') +
        '<button type="button" class="v-btn v-btn-dark v-btn-sm" data-atn-fin="' + esc(a.id) + '">Finalizar</button>';
    } else {
      acciones =
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-ver="' + esc(a.id) + '" ' +
                'aria-expanded="' + (abiertas[a.id] ? 'true' : 'false') + '">Consultar</button>' +
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-copiar="' + esc(a.telefono) + '" ' +
                'title="Copiar el teléfono">' + svg(IC.copiar, 'w-4 h-4') + '</button>' +
        '<button type="button" class="v-btn v-btn-primary v-btn-sm" data-atn-rescatar="' + esc(a.id) + '">' +
          svg(IC.rescate, 'w-4 h-4') + 'Tomar ' + reservaMin() + ' min</button>';
    }

    return '<article class="atn-card' + (urgente(a) ? ' atn-urgente' : '') + '" data-atn-id="' + esc(a.id) + '">' +
      '<div class="atn-card-top">' +
        '<div class="atn-quien">' +
          '<span class="atn-nombre">' + esc(a.cliente) + '</span>' +
          '<div class="atn-meta">' +
            '<span class="atn-tel">' + esc(a.telefono) + '</span>' +
            (a.tipo ? '<span class="atn-chip">' + esc(a.tipo) + '</span>' : '') +
            '<span' + (urgente(a) ? ' class="atn-chip urge"' : '') + '>' + esc(desdeHace(a.fecha)) + '</span>' +
            (a.horaPromesa ? '<span class="atn-chip">Prometido: ' + esc(a.horaPromesa) + '</span>' : '') +
            (mia ? chipPriv : '<span class="atn-chip">de ' + esc(a.asesorNombre || 'otro asesor') + '</span>') +
            chipReserva +
            (esRescatada && !a.reservaViva ? '<span class="atn-chip libre">la tomaste tú</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="atn-acciones">' + acciones + '</div>' +
      '</div>' +
      '<div class="atn-detalle" data-atn-detalle="' + esc(a.id) + '">' +
        '<div class="atn-detalle-in">' +
          (a.notas
            ? '<div class="atn-campo"><b>Anotaciones</b><p>' + esc(a.notas) + '</p></div>'
            : '<div class="atn-campo"><b>Anotaciones</b><p style="opacity:.7">Sin anotaciones.</p></div>') +
          (a.correo ? '<div class="atn-campo"><b>Correo</b><p>' + esc(a.correo) + '</p></div>' : '') +
          '<div class="atn-campo"><b>Registrada</b><p>' +
            esc(new Date(a.fecha).toLocaleString('es-MX')) +
            (a.asesorNombre && !mia ? ' · por ' + esc(a.asesorNombre) : '') + '</p></div>' +
          (mia
            ? '<div class="atn-notas-edit">' +
                '<label class="v-label" for="atn-nota-' + esc(a.id) + '">Añadir o editar anotaciones</label>' +
                '<textarea id="atn-nota-' + esc(a.id) + '" class="v-input" rows="3" maxlength="600">' +
                  esc(a.notas) + '</textarea>' +
                '<div style="display:flex;justify-content:flex-end">' +
                  '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-nota="' + esc(a.id) + '">' +
                    'Guardar anotaciones</button>' +
                '</div>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function pintar() {
    if (!host || !datos) return;

    var mias = datos.mias || [];
    var publicas = datos.publicas || [];

    var html =
      '<div class="atn-tabs" role="tablist">' +
        '<button class="atn-tab" role="tab" data-atn-tab="mias" aria-selected="' + (pestana === 'mias') + '">' +
          svg(IC.usuario, 'w-4 h-4') + 'Mis pendientes <span class="atn-tab-num">' + mias.length + '</span></button>' +
        '<button class="atn-tab" role="tab" data-atn-tab="publicas" aria-selected="' + (pestana === 'publicas') + '">' +
          svg(IC.rescate, 'w-4 h-4') + 'Rescatables <span class="atn-tab-num">' + publicas.length + '</span></button>' +
      '</div>' +
      '<div class="atn-lista" data-atn-lista>';

    var lista = pestana === 'mias' ? mias : publicas;
    if (!lista.length) {
      html += pestana === 'mias'
        ? vacio('Ninguna atención pendiente', 'Cuando una plataforma falle y tengas un cliente en línea, guarda aquí sus datos.')
        : vacio('No hay atenciones para tomar',
                'Aquí aparecen las que otros asesores liberaron. Al tomar una la tienes ' +
                reservaMin() + ' minutos para llamar; si no la cierras, vuelve a quedar disponible.');
    } else {
      html += lista.map(function (a) { return tarjeta(a, pestana); }).join('');
    }
    html += '</div>';

    host.innerHTML = html;
    cablear();

    // Las tarjetas entran en cascada con `amount`: con tres o con treinta, la entrada
    // termina a la vez. Es el mismo criterio de AppMotion.staggerRows.
    if (conGsap()) {
      var cards = host.querySelectorAll('.atn-card');
      if (cards.length) {
        gsap.fromTo(cards, { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: .38, ease: 'power2.out', force3D: true,
            stagger: { amount: Math.min(.35, cards.length * .05) }, clearProps: 'transform' });
      }
    }

    // Se reabre lo que estuviera desplegado antes del repintado. Sin esto, la
    // revalidación del minuto cerraba la tarjeta que la persona estaba leyendo.
    Object.keys(abiertas).forEach(function (id) {
      if (abiertas[id]) desplegar(id, true);
    });

    // El reloj solo existe mientras haya una cuenta atrás que enseñar.
    if (hayReservas()) arrancarReloj(); else pararReloj();
  }

  /**
   * Despliega o pliega el detalle de una tarjeta.
   * @param {boolean=} sinAnimar true al restaurar tras un repintado.
   */
  function desplegar(id, sinAnimar) {
    var caja = host && host.querySelector('[data-atn-detalle="' + id + '"]');
    if (!caja) return;
    var dentro = caja.firstElementChild;
    var abrir = sinAnimar ? true : !abiertas[id];
    abiertas[id] = abrir;

    var btn = host.querySelector('[data-atn-ver="' + id + '"]');
    if (btn) btn.setAttribute('aria-expanded', abrir ? 'true' : 'false');

    if (!conGsap() || sinAnimar) {
      caja.style.height = abrir ? 'auto' : '0';
      return;
    }

    if (abrir) {
      // height:'auto' de GSAP mide una vez y anima el número. El contenido acompaña con
      // transform + opacity, que es lo que hace que se perciba fluido aunque la altura
      // sea una propiedad de layout: el ojo sigue al texto, no al borde de la caja.
      gsap.set(caja, { height: 'auto' });
      gsap.from(caja, { height: 0, duration: .34, ease: 'power2.out' });
      gsap.fromTo(dentro, { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: .3, ease: 'power2.out', delay: .06,
          force3D: true, clearProps: 'transform' });
    } else {
      gsap.to(dentro, { opacity: 0, duration: .16, ease: 'power1.in' });
      gsap.to(caja, { height: 0, duration: .28, ease: 'power2.inOut', delay: .05 });
    }
  }

  /** Copia el teléfono. La respuesta la da el propio botón, no un toast. */
  function copiar(btn, texto) {
    var original = btn.innerHTML;
    var listo = function (ok) {
      btn.innerHTML = svg(ok ? IC.check : IC.aviso, 'w-4 h-4');
      btn.setAttribute('title', ok ? 'Teléfono copiado' : 'No se pudo copiar');
      if (ok && window.AppMotion) AppMotion.pop(btn);
      setTimeout(function () {
        if (!btn.isConnected) return;
        btn.innerHTML = original;
        btn.setAttribute('title', 'Copiar el teléfono');
      }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { listo(true); },
                                               function () { listo(respaldo(texto)); });
    } else { listo(respaldo(texto)); }
  }

  function respaldo(texto) {
    try {
      var ta = document.createElement('textarea');
      ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }

  function cablear() {
    if (!host) return;

    host.querySelectorAll('[data-atn-tab]').forEach(function (b) {
      b.addEventListener('click', function () {
        pestana = b.getAttribute('data-atn-tab');
        abiertas = {};
        pintar();
      });
    });

    host.querySelectorAll('[data-atn-ver]').forEach(function (b) {
      b.addEventListener('click', function () { desplegar(b.getAttribute('data-atn-ver')); });
    });

    host.querySelectorAll('[data-atn-copiar]').forEach(function (b) {
      b.addEventListener('click', function () { copiar(b, b.getAttribute('data-atn-copiar')); });
    });

    host.querySelectorAll('[data-atn-fin]').forEach(function (b) {
      b.addEventListener('click', function () { finalizar(b.getAttribute('data-atn-fin')); });
    });

    host.querySelectorAll('[data-atn-nota]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-atn-nota');
        var ta = document.getElementById('atn-nota-' + id);
        if (!ta) return;
        guardarNotas(id, ta.value, b);
      });
    });

    host.querySelectorAll('[data-atn-rescatar]').forEach(function (b) {
      b.addEventListener('click', function () { rescatar(b.getAttribute('data-atn-rescatar'), b); });
    });

    host.querySelectorAll('[data-atn-liberar]').forEach(function (b) {
      b.addEventListener('click', function () { liberar(b.getAttribute('data-atn-liberar'), b); });
    });
  }

  function guardarNotas(id, texto, btn) {
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = 'Guardando…';
    llamar('atencionActualizar', [correo(), id, { notas: texto }]).then(function (r) {
      btn.disabled = false;
      btn.textContent = original;
      if (!r || !r.success) { toast((r && r.message) || 'No se pudo guardar.', 'error'); return; }
      // Se actualiza la copia en memoria para que un repintado no devuelva el texto viejo.
      (datos.mias || []).forEach(function (a) { if (a.id === id) a.notas = texto; });
      if (window.AppCache) AppCache.remove(clavePanorama());
      toast('Anotaciones guardadas.', 'ok');
    }, function () {
      btn.disabled = false;
      btn.textContent = original;
      toast('Sin conexión. Inténtalo de nuevo.', 'error');
    });
  }

  function finalizar(id) {
    var a = (datos.mias || []).filter(function (x) { return x.id === id; })[0];
    if (!a) return;

    modal('Finalizar la atención de ' + a.cliente,
      '<p class="cns-confirm-tx">Sale de tus pendientes. Si quieres, deja apuntado cómo acabó.</p>' +
      '<div><label class="v-label" for="atn-resultado">¿Cómo acabó? (opcional)</label>' +
      '<textarea id="atn-resultado" class="v-input" rows="3" maxlength="400" ' +
                'placeholder="Se cerró la venta, no contestó, pidió que le llamáramos mañana…"></textarea></div>',
      'Finalizar',
      function (cerrar, boton) {
        boton.disabled = true;
        boton.textContent = 'Finalizando…';
        llamar('atencionFinalizar', [correo(), id, val('atn-resultado')]).then(function (r) {
          boton.disabled = false;
          boton.textContent = 'Finalizar';
          if (!r || !r.success) { toast((r && r.message) || 'No se pudo finalizar.', 'error'); return; }
          datos.mias = (datos.mias || []).filter(function (x) { return x.id !== id; });
          delete abiertas[id];
          if (window.AppCache) AppCache.remove(clavePanorama());
          pintar();
          cerrar();
          toast('Atención finalizada.', 'ok');
        }, function () {
          boton.disabled = false;
          boton.textContent = 'Finalizar';
          toast('Sin conexión. Inténtalo de nuevo.', 'error');
        });
      });
  }

  /**
   * Suelta una atención propia al pool, ya.
   *
   * Se confirma antes. No es destructivo —la atención sigue siendo suya y puede cerrarla
   * él— pero sí es irreversible en la práctica: una vez que otro asesor la toma y llama al
   * cliente, no hay forma de deshacer esa llamada. Un clic accidental en un botón pegado a
   * "Finalizar" no debería poder provocarla.
   */
  function liberar(id, btn) {
    var a = (datos.mias || []).filter(function (x) { return x.id === id; })[0];
    if (!a) return;

    modal('Liberar la atención de ' + a.cliente,
      '<p class="cns-confirm-tx">A partir de ahora cualquier asesor podrá verla, tomarla y ' +
      'llamar al cliente. Sigue siendo tuya y puedes finalizarla tú si la atiendes antes.</p>' +
      '<p class="cns-confirm-tx" style="margin-top:.5rem">Quien la tome la tendrá reservada ' +
      reservaMin() + ' minutos; si no la cierra, vuelve a quedar disponible.</p>',
      'Liberar ahora',
      function (cerrar, boton) {
        boton.disabled = true;
        boton.textContent = 'Liberando…';
        llamar('atencionLiberarAhora', [correo(), id]).then(function (r) {
          boton.disabled = false;
          boton.textContent = 'Liberar ahora';
          if (!r || !r.success) { toast((r && r.message) || 'No se pudo liberar.', 'error'); return; }
          // Se actualiza la copia en memoria para que la tarjeta cambie de chip sin
          // esperar a la siguiente revalidación.
          if (r.liberarEn) a.liberarEn = r.liberarEn;
          if (window.AppCache) AppCache.remove(clavePanorama());
          pintar();
          cerrar();
          toast(r.message, 'ok');
        }, function () {
          boton.disabled = false;
          boton.textContent = 'Liberar ahora';
          toast('Sin conexión. Inténtalo de nuevo.', 'error');
        });
      });
  }

  function rescatar(id, btn) {
    btn.disabled = true;
    llamar('atencionRescatar', [correo(), id]).then(function (r) {
      btn.disabled = false;
      if (!r || !r.success) {
        toast((r && r.message) || 'No se pudo tomar la atención.', 'error');
        // Casi siempre el motivo es que otro asesor llegó primero, y la lista en pantalla
        // ya no dice la verdad: se relee en vez de dejar una tarjeta fantasma.
        cargar(true);
        return;
      }
      datos.publicas = (datos.publicas || []).filter(function (x) { return x.id !== id; });
      datos.mias = (datos.mias || []).concat([r.atencion]);
      datos.mias.sort(function (a, b) { return new Date(a.fecha).getTime() - new Date(b.fecha).getTime(); });
      if (window.AppCache) AppCache.remove(clavePanorama());
      pestana = 'mias';
      pintar();
      toast(r.message, 'ok');
    }, function () {
      btn.disabled = false;
      toast('Sin conexión. Inténtalo de nuevo.', 'error');
    });
  }

  /* ── EL RELOJ DE LAS RESERVAS ────────────────────────────────────────────
     Una reserva caduca sola, y la caducidad la calcula el servidor al leer: no hay nada
     escrito que cambie a los quince minutos. Eso significa que una pantalla abierta y
     quieta seguiría enseñando "La tienes 12 min" indefinidamente, y peor: seguiría
     enseñando en el pool una atención que otro ya tomó, o escondiendo una que volvió a
     estar libre.

     El reloj corrige las dos cosas con un solo mecanismo:

       · Cada 30 s repinta si hay alguna reserva viva, para que la cuenta atrás baje. Es
         repintado local, sin tocar el servidor: los milisegundos restantes se recalculan
         contra la hora de toma, que ya está en los datos.
       · Cuando una reserva vence, se pide el panorama de verdad. Ahí es donde puede haber
         cambiado algo que solo el servidor sabe —que otro la tomó, que el dueño la cerró—
         y es el único momento en que hace falta preguntar.

     Solo corre cuando hay algo que contar, y se detiene con la pestaña oculta: un
     intervalo eterno en una pantalla que alguien dejó abierta toda la tarde es batería
     regalada. */
  var reloj = null;

  function hayReservas() {
    var todas = (datos ? (datos.mias || []).concat(datos.publicas || []) : []);
    return todas.some(function (a) { return a.reservaViva; });
  }

  function recalcularReservas() {
    if (!datos) return false;
    var ahora = Date.now();
    var vencioAlguna = false;
    (datos.mias || []).concat(datos.publicas || []).forEach(function (a) {
      if (!a.reservaViva) return;
      var fin = new Date(a.rescatadaEn).getTime() + reservaMin() * 60000;
      a.reservaRestanteMs = Math.max(0, fin - ahora);
      if (a.reservaRestanteMs <= 0) { a.reservaViva = false; vencioAlguna = true; }
    });
    return vencioAlguna;
  }

  function arrancarReloj() {
    if (reloj || !host) return;
    reloj = setInterval(function () {
      if (document.visibilityState === 'hidden') return;
      if (!hayReservas()) { pararReloj(); return; }
      // Si alguna acaba de vencer, la lista ya no es de fiar: se pide la de verdad.
      if (recalcularReservas()) cargar(true);
      else pintar();
    }, 30000);
  }

  function pararReloj() {
    if (!reloj) return;
    clearInterval(reloj);
    reloj = null;
  }

  try {
    document.addEventListener('visibilitychange', function () {
      // Al volver a la pestaña, lo primero es releer: mientras estuvo oculta han podido
      // vencer varias reservas y la pantalla estaría enseñando el mundo de hace un rato.
      if (document.visibilityState === 'visible' && host && hayReservas()) cargar(true);
    });
  } catch (e) {}

  // ── API pública ──────────────────────────────────────────────────────────

  var AppAtenciones = {
    /**
     * Pinta la gestión completa dentro de un contenedor.
     * @param {Element|string} donde
     */
    montar: function (donde) {
      host = (typeof donde === 'string') ? document.getElementById(donde) : donde;
      if (!host) return false;
      if (!haySesion() || !puede()) {
        host.innerHTML = vacio('No disponible', 'Tu cuenta no tiene acceso a las atenciones pendientes.');
        return false;
      }
      host.innerHTML = '<div class="atn-vacio"><div class="v-spinner"></div> Cargando tus atenciones…</div>';
      cargar(false);
      return true;
    },

    registrar: registrar,
    sugerir: sugerir,
    recargar: function () { return cargar(true); },

    /** Cifras rápidas para el inicio y el feed de supervisión. */
    resumen: function () {
      return {
        mias: (datos && datos.mias) ? datos.mias.length : 0,
        publicas: (datos && datos.publicas) ? datos.publicas.length : 0
      };
    },

    /** Para pruebas y para el botón de "ya no me lo recuerdes" de otra pantalla. */
    enfriando: enfriando,
    posponer: posponer
  };

  window.AppAtenciones = AppAtenciones;

  /* Cualquier elemento con [data-atenciones-registrar] abre el formulario, y con
     [data-atenciones-abrir] lleva a la pantalla. Así una pantalla puede ofrecer el
     registro sin escribir una línea de JavaScript. */
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-atenciones-registrar]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); registrar({}); });
    });
    document.querySelectorAll('[data-atenciones-abrir]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        if (window.AppUrl) AppUrl.go('atenciones');
      });
    });
  });
})();
</script>
