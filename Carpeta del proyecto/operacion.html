  <!-- El gráfico del historial es el MISMO partial que monta el tablero público y el feed
       de supervisión. Se incluye aquí para el tablero embebido: rehacer el gráfico contra
       las mismas dos funciones del servidor sería la tercera copia, y a la primera que
       alguien tocara una de ellas empezarían a contar cosas distintas. -->
  <?!= include('app_estado_historial'); ?>
  <?!= include('LoaderPartial'); ?>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';

    // El candado real está en el servidor (opGate_); esto solo evita que alguien llegue por
    // un enlace y se quede mirando errores sin entender por qué.
    if (!requireBlock('operacion', 'operacion')) return;

    AppShell.mount({ active: 'operacion', title: 'Estado de operación' });
    if (window.VentelLoader) VentelLoader.hide();

    var IC = {
      ok:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.5 11.2 14.7 15.5 9.8"/><circle cx="12" cy="12" r="9"/></svg>',
      alerta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6 2.6 20h18.8L12 3.6Z"/><path d="M12 10v4.2M12 17.4h.01"/></svg>',
      reloj:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.6V12l3.4 2"/></svg>',
      info:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8h.01"/></svg>',
      gente:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 19.5a6.2 6.2 0 0 1 12.4 0"/><path d="M16.5 5.2a3.2 3.2 0 0 1 0 6M18 13.4a6.2 6.2 0 0 1 3.2 6.1"/></svg>',
      robot:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4.5V8"/><circle cx="9" cy="13.5" r="1.1"/><circle cx="15" cy="13.5" r="1.1"/></svg>'
    };
    var ICONO = { ok: IC.ok, warn: IC.reloj, alert: IC.alerta, info: IC.info, neutro: IC.info };

    var datos = null;
    var modalOv = document.getElementById('opp-modal-ov');
    var modal = document.getElementById('opp-modal');
    var visor = document.getElementById('opp-visor');
    var visorImg = document.getElementById('opp-visor-img');
    var disparador = null;

    /* El modal que pide la URL se abre UNA sola vez, y con los datos ya pintados (ver el
       final de pintar): antes no hay incidencia que enseñar, y sin el "una vez" cada
       recarga del panel —guardar recarga— volvería a abrir lo que se acaba de cerrar. */
    var urlAplicada = false;

    function esc(s) { return window.escapeHtml(s); }
    function correo() { return AppSession.userEmail; }

    function desdeHace(iso) {
      if (!iso) return '';
      var t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      var min = Math.floor((Date.now() - t) / 60000);
      if (min < 1) return 'hace un momento';
      if (min < 60) return 'hace ' + min + ' min';
      var h = Math.floor(min / 60);
      if (h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
      var d = Math.floor(h / 24);
      return 'hace ' + d + (d === 1 ? ' día' : ' días');
    }

    function fechaLarga(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return isNaN(d.getTime()) ? '' : d.toLocaleString('es-MX',
        { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    /* ── Carga ── */

    /**
     * Las cuatro secciones del panel, en el orden en que se leen. La tabla vive aquí y no
     * repartida por pintar() porque el id, el rótulo y la forma del esqueleto tienen que
     * decir lo mismo: si el esqueleto lleva un rótulo y el definitivo otro, al aterrizar
     * los datos parece que ha cambiado de sección.
     * Las cuatro son 'tarjetas' porque la incidencia (.opp-card) y el reporte suelto
     * (.opp-rep) son la misma silueta: recuadro con título, dos líneas y dos botones.
     */
    var SECCIONES = [
      { id: 'opp-esperan',  rotulo: 'Esperan tu decisión',  filas: 2 },
      { id: 'opp-vivas',    rotulo: 'Incidencias activas',  filas: 2 },
      { id: 'opp-sueltos',  rotulo: 'Reportes sin agrupar', filas: 3 },
      // Una sola caja: es la única sección que desaparece entera cuando no hay nada que
      // enseñar, así que dibujar de más aquí es un hueco que se cierra de golpe al llegar.
      { id: 'opp-cerradas', rotulo: 'Cerradas esta semana', filas: 1 }
    ];

    /**
     * Deja los cuatro contenedores puestos dentro de #opp-contenido. El rótulo se escribe
     * YA, antes que los datos: un esqueleto sin nombre no dice CUÁL de las cuatro esperas
     * es la que está tardando, que es lo que se venía a arreglar. Va sin la bolita del
     * contador porque un 0 provisional es un dato falso que además saltaría al corregirse.
     * @param {boolean=} limpiar true al empezar una carga desde cero (hay que barrer lo
     *   anterior); sin él solo se rehace si falta, que es como vuelve el panel después de
     *   que un error ocupara #opp-contenido entero y se pulsara Actualizar.
     */
    function armar(limpiar) {
      var cont = document.getElementById('opp-contenido');
      if (limpiar || !document.getElementById(SECCIONES[0].id)) {
        cont.innerHTML = SECCIONES.map(function (s) {
          return '<div id="' + s.id + '"><h2 class="opp-rot">' + esc(s.rotulo) + '</h2></div>';
        }).join('');
      }
      return cont;
    }

    function cargar(forzar) {
      var cont = document.getElementById('opp-contenido');
      var cajaKpis = document.getElementById('opp-kpis');
      var esqueletos = [];

      // Sin nada en mano se vacía el panel y se dibuja la FORMA de lo que viene, una por
      // sección: antes las cuatro esperaban tras un único esqueleto y mientras cargaba eran
      // un bloque indistinto en el que no se veía cuál iba lenta.
      // La condición es la misma que aplica `fx` de AppRun por dentro (app_core, swr): con
      // caché, swr pinta lo guardado en el acto, y montar aquí un esqueleto sería cambiarle
      // al usuario sus datos por cajas grises.
      if (!datos) {
        armar(true);
        cajaKpis.innerHTML = '';
        if (window.VentelFX) {
          esqueletos.push(VentelFX.skeleton(cajaKpis, 'kpis', { rows: 4 }));
          SECCIONES.forEach(function (s) {
            esqueletos.push(VentelFX.skeleton('#' + s.id, 'tarjetas', { rows: s.filas }));
          });
        }
      }

      // Se apagan en onData Y en onError. Solo en onData, un fallo del servidor dejaría las
      // cinco esperas brillando para siempre, que se lee como «esto sigue cargando».
      function apagar() {
        esqueletos.forEach(function (sk) { sk.done(); });
        esqueletos = [];
      }

      AppRun.swr('operacion-panel', 'opPanel', [correo()], {
        ttl: 45000,
        maxAge: forzar ? 0 : 45000,
        accept: function (r) { return !!(r && r.success); },
        /* El segundo argumento importa: swr avisa DOS veces cuando había copia local
           —primero con deCache=true y luego con la respuesta del servidor— y hay que
           saber cuál de las dos es, o el enlace profundo se gasta contra la copia. */
        onData: function (r, deCache) {
          apagar();
          if (!r || !r.success) {
            if (!datos) {
              cont.innerHTML = '<div class="opp-vacio"><b>No pudimos cargar el panel</b><p>' +
                esc((r && r.message) || 'Inténtalo de nuevo en un momento.') + '</p></div>';
            }
            return;
          }
          datos = r;
          pintar(deCache);
        },
        onError: function () {
          apagar();
          if (!datos) {
            cont.innerHTML = '<div class="opp-vacio"><b>No hay conexión con el sistema</b>' +
              '<p>Revisa tu internet e inténtalo de nuevo.</p></div>';
          }
        }
      });
    }

    /* ── Pintado ── */

    function pintar(deCache) {
      var incs = datos.incidentes || [];
      var sueltos = datos.sueltos || [];
      var esperan = incs.filter(function (i) { return i.estado === 'posible' && !i.cierra; });
      var vivas = incs.filter(function (i) { return !i.cierra && i.estado !== 'posible'; });
      var cerradas = incs.filter(function (i) { return i.cierra; });

      document.getElementById('opp-kpis').innerHTML =
        kpi(esperan.length, esperan.length === 1 ? 'espera decisión' : 'esperan decisión', esperan.length > 0) +
        kpi(vivas.length, vivas.length === 1 ? 'incidencia activa' : 'incidencias activas', false) +
        kpi(sueltos.length, 'reportes sin agrupar', false) +
        kpi(cerradas.length, 'cerradas esta semana', false);

      var aviso = document.getElementById('opp-webhook-aviso');
      aviso.textContent = datos.webhookEstado
        ? ''
        : 'Sin webhook configurado: los avisos al equipo no saldrán.';
      aviso.style.color = datos.webhookEstado ? '' : 'var(--warn)';

      // Cada sección escribe en SU contenedor. Se rehacen si faltan porque el mensaje de
      // error ocupa #opp-contenido entero: sin esto, la carga que viene detrás de un fallo
      // pintaría contra contenedores que ya no existen.
      armar();

      seccion('opp-esperan', esperan.length, esperan.length
        ? esperan.map(function (i) { return tarjeta(i, 'urge'); }).join('')
        : '<div class="opp-vacio"><b>Nada pendiente</b><p>Cuando ' + datos.umbral.personas +
          ' personas reporten lo mismo en menos de ' + datos.umbral.minutos +
          ' minutos, la incidencia aparecerá aquí para que la confirmes o la descartes.</p></div>');

      seccion('opp-vivas', vivas.length, vivas.length
        ? vivas.map(function (i) { return tarjeta(i, 'viva'); }).join('')
        : '<div class="opp-vacio"><b>Ningún sistema marcado como caído</b>' +
          '<p>Todo lo que el equipo ve ahora mismo es «funcionando».</p></div>');

      seccion('opp-sueltos', sueltos.length, sueltos.length
        ? sueltos.map(reporteSuelto).join('')
        : '<div class="opp-vacio"><b>Sin reportes sueltos</b>' +
          '<p>Aquí caen los reportes de las últimas 24 horas que todavía no llegaron al umbral.</p></div>');

      // Las cerradas no dejan ni rótulo cuando no hay ninguna: sin cierres esta semana no
      // hay nada que contar y el título solo sería ruido encima de un hueco.
      if (cerradas.length) {
        seccion('opp-cerradas', cerradas.length,
          cerradas.map(function (i) { return tarjeta(i, 'cerrada'); }).join(''));
      } else {
        document.getElementById('opp-cerradas').innerHTML = '';
      }

      cablear();

      /* El enlace profundo se aplica UNA vez… pero no contra cualquier pintado. Con copia
         local, este primer pintado es el de la copia, que puede tener hasta 45 s (y la
         precarga la mantiene caliente desde otras pantallas). Si la incidencia del enlace
         nació dentro de esa ventana, no está en la copia: aplicarUrl no la encontraba,
         olvidarUrl BORRABA action/inc/item de la barra, y cuando un segundo después
         llegaba el dato bueno el intento ya estaba gastado — ni se abría el modal ni
         quedaba enlace del que tirar, ni recargando. Por eso aplicarUrl devuelve false
         cuando no encuentra lo pedido en una copia: el intento queda pendiente para el
         pintado fresco. Mismo criterio que usa anuncios.html con su `abrirPendiente`. */
      if (!urlAplicada && window.AppUrl && AppUrl.params) {
        if (aplicarUrl(AppUrl.params(), deCache) !== false) urlAplicada = true;
      }
    }

    function kpi(n, texto, urge) {
      return '<div class="opp-kpi' + (urge ? ' urge' : '') + '"><b>' + n + '</b><small>' + esc(texto) + '</small></div>';
    }

    function rotulo(texto, n) {
      return '<h2 class="opp-rot">' + esc(texto) + '<span class="opp-n">' + n + '</span></h2>';
    }

    /**
     * Vuelca una sección entera: su rótulo, ya con el contador de verdad, y su contenido.
     * El texto lo saca de SECCIONES y no del llamador para que el rótulo que se leyó
     * mientras cargaba y el definitivo sean literalmente el mismo.
     */
    function seccion(id, n, html) {
      var s = SECCIONES.filter(function (x) { return x.id === id; })[0];
      document.getElementById(id).innerHTML = rotulo(s.rotulo, n) + html;
    }

    function tarjeta(i, clase) {
      var acciones = '';
      if (!i.cierra) {
        if (i.estado === 'posible') {
          acciones =
            btn('confirmar', i.id, 'v-btn-primary', 'Confirmar la falla') +
            btn('intermitencia', i.id, 'v-btn-ghost', 'Es intermitencia') +
            btn('descartar', i.id, 'v-btn-ghost', 'Descartar');
        } else {
          acciones =
            btn('actualizar', i.id, 'v-btn-primary', 'Actualizar') +
            btn('resolver', i.id, 'v-btn-ghost', 'Marcar resuelto');
        }
      } else {
        acciones = btn('reabrir', i.id, 'v-btn-ghost', 'Reabrir');
      }
      acciones += btn('ver', i.id, 'v-btn-ghost', 'Ver reportes');

      return '<article class="opp-card ' + clase + '">' +
        '<div class="opp-card-top">' +
          '<span class="opp-badge tono-' + esc(i.tono) + '">' + (ICONO[i.tono] || IC.info) +
            esc(i.estadoNombre) + '</span>' +
          '<span style="font-size:.8rem;font-weight:650;color:var(--ink-soft)">' + esc(i.sistema) + '</span>' +
          '<span class="opp-origen" style="margin-left:auto">' +
            (i.origen === 'automatico' ? 'Automática' : 'Publicada') + '</span>' +
        '</div>' +
        '<h3>' + esc(i.titulo) + '</h3>' +
        (i.detalle ? '<p class="opp-det">' + esc(i.detalle) + '</p>' : '') +
        '<div class="opp-meta">' +
          '<span class="opp-pin">' + IC.gente + esc(i.personas) +
            (i.personas === 1 ? ' persona' : ' personas') + ' · ' + esc(i.reportes) +
            (i.reportes === 1 ? ' reporte' : ' reportes') + '</span>' +
          '<span class="opp-pin">' + IC.reloj + esc(
            i.confirmado ? 'Confirmada ' + desdeHace(i.confirmado) : 'Detectada ' + desdeHace(i.creado)) + '</span>' +
          (i.confirmadoNombre ? '<span class="opp-pin">Por ' + esc(i.confirmadoNombre) + '</span>' : '') +
          (i.cerrado ? '<span class="opp-pin">Cerrada ' + esc(fechaLarga(i.cerrado)) + '</span>' : '') +
        '</div>' +
        '<div class="opp-acc">' + acciones + '</div>' +
      '</article>';
    }

    function btn(accion, id, clase, texto) {
      return '<button type="button" class="v-btn ' + clase + ' v-btn-sm" ' +
        'data-acc="' + accion + '" data-id="' + esc(id) + '">' + esc(texto) + '</button>';
    }

    function reporteSuelto(r) {
      return '<div class="opp-rep">' +
        '<div class="opp-rep-top">' +
          '<b>' + esc(r.nombre || r.correo) + '</b>' +
          '<small>' + esc(fechaLarga(r.fecha)) + ' · ' + esc(r.sistema) + '</small>' +
        '</div>' +
        (r.submotivo ? '<span class="opp-sub">' + esc(r.submotivo) + '</span>' : '') +
        (r.notas ? '<p>' + esc(r.notas) + '</p>' : '') +
        (r.evidencias && r.evidencias.length
          ? '<div class="opp-evis">' + r.evidencias.map(function (e) {
              return '<button type="button" class="opp-evi" data-ver="' + esc(e.url) + '">' +
                '<img src="' + esc(e.url) + '" alt="' + esc(e.nombre || 'Captura') + '" loading="lazy"></button>';
            }).join('') + '</div>'
          : '') +
        '<div class="opp-acc">' +
          '<button type="button" class="v-btn v-btn-primary v-btn-sm" data-acc="elevar" data-rep="' + esc(r.id) + '">' +
            'Convertir en incidencia</button>' +
          '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-acc="descartar-rep" data-rep="' + esc(r.id) + '">' +
            'Descartar</button>' +
        '</div>' +
      '</div>';
    }

    function cablear() {
      var cont = document.getElementById('opp-contenido');

      cont.querySelectorAll('[data-acc]').forEach(function (b) {
        b.addEventListener('click', function () {
          var acc = b.getAttribute('data-acc');
          var id = b.getAttribute('data-id');
          var rep = b.getAttribute('data-rep');
          disparador = b;

          if (acc === 'ver') { AppUrl.go('estado', { inc: id }); return; }
          if (acc === 'elevar') { abrirModalElevar(rep); return; }
          if (acc === 'descartar-rep') { descartarReporte(rep, b); return; }

          var inc = (datos.incidentes || []).filter(function (x) { return x.id === id; })[0];
          if (!inc) return;

          var preset = { confirmar: 'confirmado', intermitencia: 'intermitencia',
                         descartar: 'descartado', resolver: 'resuelto' }[acc] || '';
          abrirModalActualizar(inc, preset);
        });
      });

      cont.querySelectorAll('[data-ver]').forEach(function (b) {
        b.addEventListener('click', function () {
          visorImg.src = b.getAttribute('data-ver');
          visor.classList.add('abierto');
        });
      });

      // Las capturas bajan de Drive una por una: brillo en el hueco hasta que llegan. Se
      // retira solo al cargar o al fallar, así que no hay manejador que cerrar aquí.
      if (window.VentelFX) {
        cont.querySelectorAll('.opp-evi img').forEach(function (im) { VentelFX.image(im); });
      }
    }

    /* ── Recomendaciones ────────────────────────────────────────────────────────────
       `opRecomendaciones` lee los MISMOS reportes que ya hay en las hojas de este módulo y
       saca de ellos las tres o cuatro conclusiones que nadie tiene tiempo de sacar en mitad
       de una caída. Aquí solo se pintan: ni una cifra se calcula en el navegador, porque
       una cuenta hecha en la pantalla y otra hecha en el servidor terminan discrepando el
       día que alguien toque una de las dos.

       CLAVE DE swr PROPIA, y no la del panel. Son dos ritmos distintos —el panel caduca a
       los 45 s y esto a los cinco minutos, que es lo que el servidor tarda en recalcularlo—
       y, sobre todo, son dos esperas independientes: con una sola clave, el panel (que es a
       lo que se viene) no pintaría hasta que estuviera lista una sección de apoyo. */

    var recoDatos = null;
    var cajaReco = document.getElementById('opp-reco');

    /** Cómo se ve cada urgencia. El tono es el de las pastillas que ya usa la pantalla
        (.opp-badge tono-*), así que el rojo de «urgente» es exactamente el mismo rojo que
        el de una incidencia grave: dos rojos distintos para la misma gravedad se leen como
        dos gravedades distintas. */
    var URGENCIA = {
      alta:  { tono: 'alert', texto: 'Urgente' },
      media: { tono: 'warn',  texto: 'Conviene mirarlo' },
      baja:  { tono: 'info',  texto: 'Para tener en cuenta' }
    };

    function recoOcultar() { cajaReco.innerHTML = ''; cajaReco.hidden = true; }

    /** @param {boolean=} forzar true al volver de una escritura o del botón «Actualizar»:
        salta la copia local del navegador (el servidor ya tiró la suya al escribir). */
    function recoCargar(forzar) {
      var sk = null;

      /* Mismo criterio que las cuatro secciones de abajo: esqueleto SOLO cuando no hay nada
         que enseñar. Con copia local, swr pinta lo guardado en el acto y taparlo con cajas
         grises sería cambiarle al usuario información buena por una espera.
         Y UNA sola caja, no tres: esta sección puede terminar vacía —los días buenos lo
         está—, así que dibujar de más aquí es prometer un contenido que a lo mejor no
         existe y dejar un hueco que se cierra de golpe al llegar la respuesta. */
      if (!recoDatos) {
        cajaReco.hidden = false;
        cajaReco.innerHTML = '';
        if (window.VentelFX) sk = VentelFX.skeleton(cajaReco, 'tarjetas', { rows: 1 });
      }

      // Se apaga en onData Y en onError, como los del panel: solo en onData, un fallo del
      // servidor dejaría la caja gris brillando para siempre encima del contenido bueno.
      function apagar() { if (sk) { sk.done(); sk = null; } }

      AppRun.swr('operacion-reco', 'opRecomendaciones', [correo()], {
        /* Cinco minutos, los mismos que guarda el servidor (OP_TTL_RECOMENDACIONES).
           Pedirlo más a menudo sería pagar una llamada para que devolviera su misma copia,
           y una lectura de siete días no cambia de conclusión en 45 segundos. Esta es la
           mitad de «no encarecer la carga del panel»: la otra es no salir en el mismo
           fotograma que él (ver el arranque, al final del archivo). */
        ttl: 300000,
        maxAge: 300000,
        fuerza: !!forzar,
        /* El disco de la esquina NO se enciende por esto. La sección ya tiene su propia
           espera en su propio hueco, y el disco seguiría girando después de que el panel
           estuviera pintado, diciendo «esto sigue cargando» de una pantalla ya lista. */
        busy: false,
        accept: function (r) { return !!(r && r.success); },
        onData: function (r) {
          apagar();
          // Sin permiso, o con el cálculo caído, la sección sencillamente no está. Es una
          // ayuda, no el panel: un error rojo aquí alarmaría sobre algo que nadie pidió, y
          // el trabajo de esta pantalla se hace entero sin ella.
          if (!r || !r.success) { if (!recoDatos) recoOcultar(); return; }
          recoDatos = r;
          pintarReco();
        },
        onError: function () { apagar(); if (!recoDatos) recoOcultar(); }
      });
    }

    function pintarReco() {
      var lista = (recoDatos && recoDatos.recomendaciones) || [];
      // La lista vacía no pinta NADA, ni siquiera el rótulo. Ver el comentario de .opp-reco.
      if (!lista.length) { recoOcultar(); return; }

      cajaReco.hidden = false;
      cajaReco.innerHTML =
        rotulo('Lo que dicen los datos', lista.length) +
        /* El periodo se cita una vez, arriba, y viene del servidor ya redactado: si algún
           día se ampliara la ventana de cálculo allí y aquí siguiera diciendo «7 días», las
           cifras de abajo dejarían de cuadrar con la frase que las presenta. */
        '<p class="opp-reco-pie">Sobre ' + esc(recoDatos.periodo || 'los últimos días') +
          (desdeHace(recoDatos.generado) ? ' · calculado ' + esc(desdeHace(recoDatos.generado)) : '') +
        '</p>' +
        lista.map(tarjetaReco).join('');

      cablearReco();
    }

    function tarjetaReco(r, i) {
      var u = URGENCIA[r.urgencia] || URGENCIA.baja;
      var a = r.accion;
      return '<article class="opp-reco-c urg-' + esc(r.urgencia || 'baja') + '">' +
        '<span class="opp-badge tono-' + u.tono + '">' + (ICONO[u.tono] || IC.info) +
          esc(u.texto) + '</span>' +
        '<h3>' + esc(r.titulo) + '</h3>' +
        '<p class="opp-reco-ev">' + esc(r.evidencia) + '</p>' +
        (r.detalle ? '<p class="opp-reco-de">' + esc(r.detalle) + '</p>' : '') +
        (a && a.texto
          ? '<div class="opp-acc">' +
            '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-reco="' + i + '">' +
              esc(a.texto) + '</button></div>'
          : '') +
      '</article>';
    }

    /* El botón guarda el ÍNDICE, no el id: la acción se vuelve a leer de `recoDatos` en el
       momento del clic, así que si entretanto llegaron recomendaciones nuevas se sigue la
       que está en pantalla y no la que había cuando se pintó el botón.
       `data-reco` es un atributo aparte de `data-acc` a propósito: esta sección vive fuera
       de #opp-contenido y cablear() no la toca, pero el día que alguien mueva una de las
       dos, dos atributos distintos no pueden cablearse dos veces. */
    function cablearReco() {
      cajaReco.querySelectorAll('[data-reco]').forEach(function (b) {
        b.addEventListener('click', function () {
          var lista = (recoDatos && recoDatos.recomendaciones) || [];
          var r = lista[Number(b.getAttribute('data-reco'))];
          if (!r || !r.accion) return;
          disparador = b;      // ahí vuelve el foco cuando se cierre el modal
          seguirReco(r.accion);
        });
      });
    }

    /**
     * Lleva a donde dice la recomendación con los modales que la pantalla YA tiene:
     * `elevar` abre el de convertir el reporte suelto en incidencia y `ver` el de
     * actualizar la incidencia. No se escribe ningún modal nuevo a propósito: son las
     * mismas dos decisiones que se toman desde las tarjetas de abajo, y duplicarlas sería
     * tener dos sitios donde arreglar el mismo error.
     *
     * Antes de abrir se comprueba que lo señalado siga estando. Las recomendaciones se
     * guardan cinco minutos y el panel cuarenta y cinco segundos: en ese hueco otro
     * supervisor puede haber agrupado ese reporte o cerrado esa incidencia. Sin esta
     * comprobación, `abrirModalElevar` no encuentra el reporte y SALE EN SILENCIO —un botón
     * que al pulsarlo no hace absolutamente nada, que es la peor forma de contar que algo
     * cambió—. Con ella se dice qué pasó y se piden recomendaciones frescas.
     */
    function seguirReco(a) {
      if (datos) {
        if (a.tipo === 'elevar') {
          var rep = (datos.sueltos || []).filter(function (r) { return r.id === a.item; })[0];
          if (rep) { abrirModalElevar(rep.id); return; }
        } else {
          var inc = (datos.incidentes || []).filter(function (x) { return x.id === a.inc; })[0];
          if (inc) { abrirModalActualizar(inc); return; }
        }
      }
      if (window.AppMotion) {
        AppMotion.toast(datos
          ? 'Eso ya no está en el panel: alguien lo atendió mientras tanto.'
          : 'El panel todavía se está cargando.', 'warn');
      }
      if (datos) recoCargar(true);
    }

    /* ── Modal: actualizar una incidencia ── */

    var estadoModal = null;

    /**
     * @param {boolean=} sinUrl true cuando quien abre es la propia URL (el arranque o el
     *   botón atrás). Sin esto se contestaría al navegador con la dirección que él acaba
     *   de poner: una entrada nueva por cada vez que se pulsa atrás, y atrás sin avanzar.
     */
    function abrirModalActualizar(inc, preset, sinUrl) {
      estadoModal = {
        tipo: 'actualizar', id: inc.id, inc: inc,
        // Qué botón trae aquí. Solo sirve para el enlace: reabrir una cerrada y actualizar
        // una viva abren el mismo modal en blanco, pero no son la misma decisión y quien
        // reciba el enlace tiene que caer en la que se le estaba enseñando.
        accion: preset || (inc.cierra ? 'reabrir' : 'actualizar'),
        estado: preset || inc.estado,
        nota: '', avisar: !!preset && preset !== 'descartado',
        nuevoEstado: false, nombreEstado: '', tonoEstado: 'warn',
        error: '', guardando: false
      };
      pintarModal();
      if (!sinUrl) reflejarModal(true);
    }

    /** @param {boolean=} sinUrl Ver abrirModalActualizar. */
    function abrirModalElevar(repId, sinUrl) {
      var rep = (datos.sueltos || []).filter(function (r) { return r.id === repId; })[0];
      if (!rep) return;
      estadoModal = {
        tipo: 'elevar', repId: repId, rep: rep,
        estado: 'confirmado', nota: '', avisar: true,
        nuevoEstado: false, nombreEstado: '', tonoEstado: 'warn',
        error: '', guardando: false
      };
      pintarModal();
      if (!sinUrl) reflejarModal(true);
    }

    /** @param {boolean=} sinUrl Ver abrirModalActualizar. */
    function abrirModalNueva(sinUrl) {
      estadoModal = {
        tipo: 'nueva', sistema: '', sistemaNuevo: '', sistemaOtro: false,
        submotivo: '', titulo: '', detalle: '',
        estado: 'mantenimiento', nota: '', avisar: true,
        nuevoEstado: false, nombreEstado: '', tonoEstado: 'warn',
        error: '', guardando: false
      };
      pintarModal();
      if (!sinUrl) reflejarModal(true);
    }

    function estadosDisponibles() {
      return (datos && datos.catalogo && datos.catalogo.estados) || [];
    }

    function pintarModal() {
      var m = estadoModal;
      if (!m) return;

      var titulo, sub;
      if (m.tipo === 'actualizar') {
        titulo = 'Actualizar la incidencia';
        sub = m.inc.titulo;
      } else if (m.tipo === 'elevar') {
        titulo = 'Convertir en incidencia';
        sub = m.rep.sistema + ' · ' + m.rep.submotivo;
      } else {
        titulo = 'Publicar una incidencia';
        sub = 'Para lo que ya sabes de antemano: un mantenimiento programado, un aviso del proveedor.';
      }

      var html =
        '<h2 id="opp-modal-titulo">' + esc(titulo) + '</h2>' +
        '<p class="opp-modal-sub">' + esc(sub) + '</p>';

      if (m.tipo === 'nueva') {
        var sistemas = (datos.catalogo && datos.catalogo.sistemas) || [];
        html += '<div class="opp-campo">' +
          '<label class="opp-lbl" id="opp-l-sis">¿A qué sistema afecta?</label>' +
          '<div class="opp-ops" role="group" aria-labelledby="opp-l-sis">' +
          sistemas.map(function (s) {
            return '<button type="button" class="opp-op" data-sis="' + esc(s.clave) + '" aria-pressed="' +
              (!m.sistemaOtro && m.sistema === s.clave ? 'true' : 'false') + '">' + esc(s.nombre) + '</button>';
          }).join('') +
          '<button type="button" class="opp-op nuevo" data-sis="__otro" aria-pressed="' +
            (m.sistemaOtro ? 'true' : 'false') + '">+ Otro</button>' +
          '</div>' +
          (m.sistemaOtro
            ? '<input type="text" class="v-input" id="opp-sis-nuevo" style="margin-top:8px" maxlength="60" ' +
              'placeholder="Nombre del sistema" value="' + esc(m.sistemaNuevo) + '">'
            : '') +
          '</div>';

        html += '<div class="opp-campo">' +
          '<label class="opp-lbl" for="opp-submotivo">¿Qué está pasando?</label>' +
          '<input type="text" class="v-input" id="opp-submotivo" maxlength="60" ' +
            'placeholder="Ventana de mantenimiento" value="' + esc(m.submotivo) + '">' +
          '</div>';
      }

      html += '<div class="opp-campo">' +
        '<label class="opp-lbl" id="opp-l-est">Estado</label>' +
        '<div class="opp-ops" role="group" aria-labelledby="opp-l-est">' +
        estadosDisponibles().map(function (e) {
          return '<button type="button" class="opp-op" data-est="' + esc(e.clave) + '" aria-pressed="' +
            (!m.nuevoEstado && m.estado === e.clave ? 'true' : 'false') + '">' + esc(e.nombre) + '</button>';
        }).join('') +
        '<button type="button" class="opp-op nuevo" data-est="__nuevo" aria-pressed="' +
          (m.nuevoEstado ? 'true' : 'false') + '">+ Estado nuevo</button>' +
        '</div>';

      if (m.nuevoEstado) {
        html += '<input type="text" class="v-input" id="opp-est-nombre" style="margin-top:8px" maxlength="40" ' +
          'placeholder="Cómo se va a llamar" value="' + esc(m.nombreEstado) + '">' +
          '<label class="opp-lbl" style="margin-top:12px">Gravedad</label>' +
          '<div class="opp-ops">' +
          [['alert', 'Grave (rojo)'], ['warn', 'Con problemas (ámbar)'],
           ['info', 'Informativo (azul)'], ['ok', 'Todo bien (verde)']].map(function (t) {
            return '<button type="button" class="opp-op" data-tono="' + t[0] + '" aria-pressed="' +
              (m.tonoEstado === t[0] ? 'true' : 'false') + '">' + t[1] + '</button>';
          }).join('') +
          '</div>' +
          '<p style="margin:8px 0 0;font-size:.78rem;color:var(--ink-soft);line-height:1.45">' +
          'La gravedad decide de qué color se pinta el sistema para todo el equipo.</p>';
      }
      html += '</div>';

      var pideNota = m.estado === 'descartado';
      html += '<div class="opp-campo">' +
        '<label class="opp-lbl" for="opp-nota">Nota' +
          (pideNota ? '' : ' <span class="opp-opc">· opcional</span>') + '</label>' +
        '<textarea class="v-textarea" id="opp-nota" rows="3" maxlength="800" placeholder="' +
          esc(pideNota
            ? 'Explica por qué lo descartas'
            : 'Qué está pasando, si ya se está trabajando en ello, cuándo esperas noticias…') +
          '">' + esc(m.nota) + '</textarea>' +
        '<p style="margin:7px 0 0;font-size:.78rem;color:var(--ink-soft);line-height:1.45">' +
          'Si marcas el aviso, esta nota va tal cual en el mensaje al equipo.</p>' +
        '</div>';

      html += '<div class="opp-campo">' +
        '<label class="opp-check">' +
          '<input type="checkbox" id="opp-avisar"' + (m.avisar ? ' checked' : '') + '>' +
          '<span class="opp-check-tx">' +
            '<b>Avisar al equipo</b>' +
            '<small>Manda el mensaje al espacio de Chat con el enlace a los reportes y las evidencias. ' +
            'Déjalo sin marcar para corregir algo sin molestar a nadie.</small>' +
          '</span>' +
        '</label></div>';

      html += '<div class="opp-err" id="opp-modal-err" hidden></div>';

      html += '<div class="opp-modal-acc">' +
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" id="opp-modal-cancelar">Cancelar</button>' +
        '<button type="button" class="v-btn v-btn-primary v-btn-sm" id="opp-modal-guardar"' +
          (m.guardando ? ' disabled' : '') + '>' +
          (m.guardando ? 'Guardando…' : (m.tipo === 'nueva' ? 'Publicar' : 'Guardar')) + '</button>' +
        '</div>';

      modal.innerHTML = html;
      modalOv.classList.add('abierto');
      document.body.style.overflow = 'hidden';
      cablearModal();
      if (m.error) errorModal(m.error);

      setTimeout(function () {
        var f = modal.querySelector('input, textarea, button');
        if (f) f.focus();
      }, 40);
    }

    function cablearModal() {
      var m = estadoModal;

      modal.querySelectorAll('[data-sis]').forEach(function (b) {
        b.addEventListener('click', function () {
          var v = b.getAttribute('data-sis');
          if (v === '__otro') { m.sistemaOtro = true; m.sistema = ''; }
          else { m.sistemaOtro = false; m.sistema = v; m.sistemaNuevo = ''; }
          m.error = ''; pintarModal();
        });
      });

      modal.querySelectorAll('[data-est]').forEach(function (b) {
        b.addEventListener('click', function () {
          var v = b.getAttribute('data-est');
          if (v === '__nuevo') { m.nuevoEstado = true; }
          else { m.nuevoEstado = false; m.estado = v; }
          m.error = ''; pintarModal();
        });
      });

      modal.querySelectorAll('[data-tono]').forEach(function (b) {
        b.addEventListener('click', function () { m.tonoEstado = b.getAttribute('data-tono'); pintarModal(); });
      });

      var campos = {
        'opp-sis-nuevo': 'sistemaNuevo', 'opp-submotivo': 'submotivo',
        'opp-nota': 'nota', 'opp-est-nombre': 'nombreEstado'
      };
      Object.keys(campos).forEach(function (id) {
        var el = modal.querySelector('#' + id);
        if (el) el.addEventListener('input', function () { m[campos[id]] = el.value; });
      });

      var av = modal.querySelector('#opp-avisar');
      if (av) av.addEventListener('change', function () { m.avisar = av.checked; });

      // Envuelto y no `cerrarModal` a pelo: el manejador recibiría el MouseEvent como
      // primer argumento, cerrarModal lo leería como `sinUrl` y cancelar dejaría la
      // incidencia colgada en la barra —un F5 la resucitaría.
      modal.querySelector('#opp-modal-cancelar').addEventListener('click', function () { cerrarModal(); });
      modal.querySelector('#opp-modal-guardar').addEventListener('click', guardarModal);
    }

    function errorModal(msg) {
      var caja = modal.querySelector('#opp-modal-err');
      if (!caja) return;
      if (!msg) { caja.hidden = true; return; }
      caja.hidden = false;
      caja.innerHTML = IC.alerta + '<span>' + esc(msg) + '</span>';
      if (window.AppMotion) AppMotion.shake(caja);
    }

    /** @param {boolean=} sinUrl true cuando cierra el botón atrás. Ver abrirModalActualizar. */
    function cerrarModal(sinUrl) {
      modalOv.classList.remove('abierto');
      // El scroll del fondo se suelta solo cuando NO queda nada encima. Cerrar este modal
      // a pelo con '' devolvía el scroll a la pantalla cuando el modal se había abierto
      // sobre el tablero —un enlace ?action=…&sec=tablero—, y el panel rodaba por detrás
      // del tablero mientras se leía.
      ajustarFondo();
      estadoModal = null;
      if (disparador && disparador.focus) { try { disparador.focus(); } catch (e) {} }
      disparador = null;
      // Cerrar también se escribe. Es la puerta común de las cuatro salidas (cancelar,
      // fondo, Escape y el cierre optimista al guardar), así que basta con quitarlo aquí.
      if (!sinUrl) reflejarModal(false);
    }

    modalOv.addEventListener('click', function (e) { if (e.target === modalOv) cerrarModal(); });
    // Escape cierra SIEMPRE lo de más arriba y solo eso: la imagen ampliada, luego el modal
    // y por último el tablero. Cerrar de golpe las tres capas con una tecla dejaría al
    // supervisor de vuelta en el panel sin haber pedido salir de ninguna.
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (visor.classList.contains('abierto')) { visor.classList.remove('abierto'); return; }
      if (modalOv.classList.contains('abierto')) { cerrarModal(); return; }
      if (tableroAbierto) cerrarTablero();
    });

    /* ── Tablero embebido ───────────────────────────────────────────────────────────
       «Ver el tablero público» navegaba a ?page=estado, y eso SACABA de esta pantalla a
       quien estaba gestionando: en Apps Script cambiar de página recarga la webapp entera
       (2-5 s), y al volver se había perdido el scroll, el modal a medio escribir y la
       sección por la que se iba. Ahora se abre encima.

       Se pinta con lo que el navegador YA tiene: AppOperacion trae el estado en todas las
       pantallas para la pastilla de la esquina, y `alCambiar` entrega también lo que haya
       en caché, así que el tablero aparece en el primer fotograma en vez de costar otra
       consulta al servidor. La única llamada nueva es la del historial, y es suya.

       La ruta `estado` no se toca: los avisos de Chat mandan enlaces ?page=estado&inc= y
       el detalle por incidencia sigue viviendo allí —de ahí el botón del pie—. */

    var tabOv = document.getElementById('opp-tablero-ov');
    var tabPanel = document.getElementById('opp-tab');
    var tabAhora = document.getElementById('opp-tab-ahora');
    var tabHist = document.getElementById('opp-tab-historial');
    var tabSello = document.getElementById('opp-tab-sello');

    var tableroAbierto = false;
    var tabDisparador = null;    // el botón que lo abrió: ahí vuelve el foco al cerrar
    var tabScrollY = 0;          // dónde estaba la pantalla de debajo
    var tabDejar = null;         // la baja del oyente de AppOperacion
    var tabEstado = null;        // último estado conocido, ya desenvuelto
    var tabSk = null;            // la ÚNICA espera del tablero mientras no hay estado
    var tabReloj = null;         // tope de esa espera
    var tabHistMontado = false;
    var tabRangoInicial = '';    // el periodo del historial cuando la URL no dice cuál

    function animable() {
      return typeof window.gsap !== 'undefined' &&
        !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    }

    /** El estado llega envuelto ({estado:…}) o a pelo según por dónde venga. */
    function desenvolver(x) { return (x && x.estado) ? x.estado : x; }

    /** El fondo se bloquea mientras haya ALGO delante, y se suelta cuando no queda nada:
        son dos capas independientes y cada una creyéndose la única se pisaban. */
    function ajustarFondo() {
      var hayCapa = modalOv.classList.contains('abierto') || tableroAbierto;
      document.body.style.overflow = hayCapa ? 'hidden' : '';
    }

    /**
     * @param {Element=} quien   botón que abre, para devolverle el foco al cerrar.
     * @param {boolean=} sinUrl  true cuando quien abre es la propia URL (el arranque o el
     *   botón atrás): contestarle a la barra con lo que ella acaba de decir apilaría una
     *   entrada por cada pulsación de atrás.
     */
    function abrirTablero(quien, sinUrl) {
      if (tableroAbierto) return;
      tableroAbierto = true;
      tabDisparador = quien || null;

      // El scroll se apunta ANTES de bloquear el fondo: al poner overflow:hidden el
      // navegador puede llevar la página a lo alto, y cerrar devolvía al principio de la
      // lista a quien estaba mirando la quinta incidencia.
      tabScrollY = window.pageYOffset || document.documentElement.scrollTop || 0;

      tabOv.classList.add('abierto');
      tabOv.setAttribute('aria-hidden', 'false');
      ajustarFondo();

      // Solo opacidad y desplazamiento: nada que obligue al navegador a recalcular la
      // página de debajo. Sin GSAP —o con el movimiento reducido— el tablero simplemente
      // aparece, que es lo que tiene que pasar.
      if (animable()) {
        gsap.killTweensOf([tabOv, tabPanel]);
        gsap.fromTo(tabOv, { opacity: 0 }, { opacity: 1, duration: .18, ease: 'power1.out' });
        gsap.from(tabPanel, { y: 14, opacity: 0, duration: .34, ease: 'power3.out',
                              clearProps: 'transform,opacity' });
      }

      // `alCambiar` avisa YA con lo que hubiera en caché, así que esto pinta antes de
      // devolver el control. Si no hay nada todavía no llama a nadie, y ahí es donde entra
      // la espera de pintarTablero.
      if (!tabDejar && window.AppOperacion && AppOperacion.alCambiar) {
        tabDejar = AppOperacion.alCambiar(pintarTablero);
      }
      if (!tabEstado) pintarTablero(window.AppOperacion ? AppOperacion.estado() : null);

      sincronizarRango((window.AppUrl && AppUrl.param('rango')) || '');

      if (!sinUrl) reflejarTablero(true);

      setTimeout(function () {
        var x = document.getElementById('opp-tab-x');
        if (x) x.focus();
      }, 40);
    }

    /** @param {boolean=} sinUrl Ver abrirTablero. */
    function cerrarTablero(sinUrl) {
      if (!tableroAbierto) return;
      tableroAbierto = false;
      tabOv.classList.remove('abierto');
      tabOv.setAttribute('aria-hidden', 'true');
      ajustarFondo();

      // Deja de escuchar: repintar un tablero que no se ve es trabajo tirado, y el
      // oyente vuelve a ponerse —con los datos frescos— en cuanto se abra otra vez.
      if (tabDejar) { try { tabDejar(); } catch (e) {} tabDejar = null; }
      if (tabReloj) { clearTimeout(tabReloj); tabReloj = null; }

      // Se vuelve al MISMO sitio: el scroll que había y el foco en el botón que abrió. Si
      // lo abrió un enlace no hay tal botón, y el foco se caería al <body> —el siguiente
      // tabulador volvería a empezar por la barra lateral—: va al que lo abre, que es
      // justo donde está mirando quien acaba de cerrarlo.
      try { window.scrollTo(0, tabScrollY); } catch (e) {}
      var volverA = tabDisparador || document.getElementById('opp-tablero');
      if (volverA && volverA.focus) { try { volverA.focus(); } catch (e) {} }
      tabDisparador = null;

      if (!sinUrl) reflejarTablero(false);
    }

    /** @param {boolean} apilar true al abrir —atrás cierra el tablero y deja el panel
        debajo, en vez de sacar de la pantalla a quien solo quería cerrarlo—. Al cerrar se
        reemplaza, que cerrar no es ir a ningún sitio nuevo.
        `rango` se va con el tablero: es SU estado, y dejarlo colgado en la barra lo
        arrastraría reflejar() a todos los enlaces que se copiaran después. */
    function reflejarTablero(apilar) {
      if (!window.AppUrl || !AppUrl.reflejar) return;
      AppUrl.reflejar(apilar ? { sec: 'tablero' } : { sec: '', rango: '' },
                      apilar ? { apilar: true } : null);
    }

    /**
     * Pinta la vista compacta con el estado que haya. Se llama desde el oyente de
     * AppOperacion, así que también repinta sola cuando se confirma una falla desde el
     * panel de debajo (guardar refresca el estado).
     */
    function pintarTablero(e) {
      e = desenvolver(e);
      if (e && e.success !== false) tabEstado = e;
      if (!tableroAbierto) return;

      if (!tabEstado) {
        /* UNA espera, y solo aquí. El historial monta la suya en su propio hueco, y por eso
           no se monta hasta que esto tiene datos (ver montarHistorial): dos esperas a la
           vez dentro del mismo panel se leen como que algo va mal, no como que va a llegar.
           La del panel de debajo tampoco se solapa: está tapada por el tablero. */
        if (!tabSk && window.VentelFX) tabSk = VentelFX.skeleton(tabAhora, 'tarjetas', { rows: 2 });
        // Y un tope honesto: si el estado no llega —AppOperacion lo pide por su cuenta al
        // arrancar la pantalla—, el hueco dice qué pasa en vez de quedarse en cajas grises.
        if (!tabReloj) {
          tabReloj = setTimeout(function () {
            tabReloj = null;
            if (tabEstado || !tableroAbierto) return;
            if (tabSk) { tabSk.done(); tabSk = null; }
            tabAhora.innerHTML = '<div class="opp-vacio"><b>Todavía no tenemos el estado</b>' +
              '<p>No hemos podido consultar cómo van los sistemas. El tablero completo sigue ' +
              'disponible en su pantalla.</p></div>';
            montarHistorial();
          }, 12000);
        }
        return;
      }

      if (tabSk) { tabSk.done(); tabSk = null; }
      if (tabReloj) { clearTimeout(tabReloj); tabReloj = null; }

      tabAhora.innerHTML = vistaTablero(tabEstado);
      tabSello.textContent = 'Última consulta: ' + (fechaLarga(tabEstado.consultado) || '—');
      montarHistorial();
    }

    /**
     * La vista compacta: qué sistema, qué le pasa y desde cuándo. Las palabras son las del
     * tablero público a propósito —mismo titular, mismo rótulo, mismo vacío—: si aquí se
     * dijera otra cosa, quien supervisa creería estar leyendo algo distinto de lo que ve
     * el equipo, que es justo lo que viene a comprobar.
     */
    function vistaTablero(e) {
      var sistemas = e.sistemas || [];
      var incs = e.incidentes || [];
      var bien = sistemas.filter(function (s) { return s.tono === 'ok'; }).length;
      var tono = e.global || 'ok';

      // Mientras nadie ha confirmado nada el titular no afirma una caída: es la misma
      // prudencia del tablero público, y desdecirse mañana cuesta más que ser prudente hoy.
      var titular = (tono === 'ok') ? 'Todo funcionando'
                  : (e.sospecha ? 'Posibles problemas' : 'Hay incidencias activas');
      var rotulo = (tono === 'ok') ? 'Servicio operativo'
                  : (e.sospecha ? 'Revisando reportes' : 'Incidencia en curso');

      var html =
        '<div class="opp-tab-tit tono-' + esc(tono) + '">' +
          '<span class="opp-tab-ojo"><span class="opp-tab-vivo"></span>' + esc(rotulo) + '</span>' +
          '<h3>' + esc(titular) + '</h3>' +
          (e.resumen ? '<p>' + esc(e.resumen) + '</p>' : '') +
          '<div class="opp-meta">' +
            '<span class="opp-pin">' + IC.ok + esc(bien + ' de ' + sistemas.length +
              (sistemas.length === 1 ? ' sistema funcionando' : ' sistemas funcionando')) + '</span>' +
            '<span class="opp-pin">' + IC.reloj +
              esc('Consultado ' + (desdeHace(e.consultado) || 'ahora')) + '</span>' +
          '</div>' +
        '</div>';

      html += '<h3 class="opp-rot">Incidencias abiertas' +
        (incs.length ? '<span class="opp-n">' + incs.length + '</span>' : '') + '</h3>';

      html += incs.length
        ? incs.map(function (i) {
            var nota = (i.ultima && i.ultima.nota) || i.detalle || '';
            return '<article class="opp-card">' +
              '<div class="opp-card-top">' +
                '<span class="opp-badge tono-' + esc(i.tono) + '">' + (ICONO[i.tono] || IC.info) +
                  esc(i.estadoNombre) + '</span>' +
                '<span style="font-size:.8rem;font-weight:650;color:var(--ink-soft)">' +
                  esc(i.sistema) + '</span>' +
              '</div>' +
              '<h4>' + esc(i.titulo) + '</h4>' +
              (nota ? '<p class="opp-det">' + esc(nota) + '</p>' : '') +
              (i.desde
                ? '<div class="opp-meta"><span class="opp-pin">' + IC.reloj +
                  esc('Desde ' + fechaLarga(i.desde) + ' · ' + desdeHace(i.desde)) + '</span></div>'
                : '') +
            '</article>';
          }).join('')
        : '<div class="opp-vacio"><b>No hay incidencias abiertas</b>' +
          '<p>Cuando algo falle aparecerá aquí, con lo que se sepa y desde cuándo.</p></div>';

      // Los destacados van delante, como en el tablero público. Aquí no se parten en dos
      // apartados con rótulo propio: son cuatro o cinco cajas de una línea, y dos títulos
      // encima de eso ocupan más que lo que separan.
      var enOrden = sistemas.filter(function (s) { return s.destacado; })
        .concat(sistemas.filter(function (s) { return !s.destacado; }));

      html += '<h3 class="opp-rot">Sistemas<span class="opp-n">' + sistemas.length + '</span></h3>' +
        '<div class="opp-tab-sis">' +
        enOrden.map(function (s) {
          var i = (s.incidentes || [])[0];
          return '<div class="opp-tab-s tono-' + esc(s.tono) + '">' +
            '<span class="opp-tab-dot"></span>' +
            '<span class="opp-tab-s-tx"><b>' + esc(s.nombre) + '</b><small>' +
              esc(s.estadoNombre + (s.tono !== 'ok' && i && i.desde ? ' · ' + desdeHace(i.desde) : '')) +
            '</small></span>' +
          '</div>';
        }).join('') +
        '</div>';

      return html;
    }

    /**
     * El gráfico del historial, montado UNA vez en su hueco. Se monta al tener el estado
     * delante y no al abrir: mientras la vista compacta espera, la escena del historial
     * sería una segunda espera en el mismo panel.
     *
     * No se desmonta al cerrar: el partial guarda un solo anfitrión y sus datos, así que
     * dejarlo puesto es lo que hace que la segunda apertura sea instantánea y no otra
     * consulta al servidor.
     */
    function montarHistorial() {
      if (tabHistMontado || !window.AppEstadoHistorial) return;
      tabHistMontado = true;
      // Se pregunta ANTES de montar (montar ya aplica el de la URL si viene): es el periodo
      // al que hay que volver cuando atrás lleva a una dirección que no trae ?rango.
      tabRangoInicial = AppEstadoHistorial.rango() || '';
      AppEstadoHistorial.montar(tabHist, {
        rango: (window.AppUrl && AppUrl.param('rango')) || '',
        alCambiar: function (id) {
          if (!window.AppUrl || !AppUrl.reflejar) return;
          // Reemplaza, no apila: cambiar de periodo es mirar lo mismo de otra forma, y
          // apilarlo obligaría a pulsar atrás una vez por cada botón que se probara.
          AppUrl.reflejar({ rango: id });
        }
      });
    }

    /** El periodo que dice la barra manda sobre el que quedó de la vez anterior. Callado:
        lo que llega ES la dirección, y contestarle la reescribiría. */
    function sincronizarRango(id) {
      if (!tabHistMontado || !window.AppEstadoHistorial) return;
      AppEstadoHistorial.irARango(String(id || '') || tabRangoInicial, true);
    }

    document.getElementById('opp-tab-x').addEventListener('click', function () { cerrarTablero(); });
    // Envuelto y no `cerrarTablero` a pelo: como manejador recibiría el MouseEvent en el
    // primer argumento y lo leería como `sinUrl`, así que el fondo dejaría de limpiar la
    // barra —y un F5 resucitaría el tablero que se acaba de cerrar—.
    tabOv.addEventListener('click', function (e) { if (e.target === tabOv) cerrarTablero(); });

    // La salida a la pantalla completa se conserva: el detalle de una incidencia con sus
    // reportes y evidencias vive allí, y quien quiera copiar el enlace público lo necesita.
    // Se lleva el periodo que se está mirando: llegar al tablero completo y encontrarlo en
    // otra escala obligaría a volver a buscarlo.
    document.getElementById('opp-tab-ir').addEventListener('click', function () {
      AppUrl.go('estado', window.AppEstadoHistorial ? { rango: AppEstadoHistorial.rango() } : null);
    });

    /* ── Memoria de estado en la URL ────────────────────────────────────────────────
       Los modales de aquí no son ventanitas: son la decisión que se está tomando sobre una
       falla, y se pasan por chat («mira esta, ¿la confirmo?»). Abrirlos APILA —atrás cierra
       el modal y deja el panel debajo, en vez de sacar de la pantalla a quien solo quería
       cerrarlo— y cerrarlos limpia la barra, porque si no un F5 resucita el modal que el
       usuario acaba de cancelar. */

    /** Valores de ?action que esta pantalla sabe abrir sobre una incidencia, y el estado que
        dejan preseleccionado. `actualizar` y `reabrir` no preseleccionan ninguno —son el
        mismo modal en blanco— y se distinguen solo para que el enlace diga cuál se enseñaba. */
    var ACCIONES = {
      actualizar: '', reabrir: '', confirmado: 'confirmado',
      intermitencia: 'intermitencia', descartado: 'descartado', resuelto: 'resuelto'
    };

    /** Lo que la barra tiene que decir con este modal delante. Los tres parámetros se
        escriben SIEMPRE juntos: dejar colgado el `inc` de la incidencia anterior al abrir un
        reporte suelto haría que el enlace compartido abriera otra cosa distinta. */
    function urlDelModal(m) {
      if (!m) return { action: '', inc: '', item: '' };
      if (m.tipo === 'nueva') return { action: 'nueva', inc: '', item: '' };
      if (m.tipo === 'elevar') return { action: 'elevar', inc: '', item: m.repId };
      return { action: m.accion, inc: m.id, item: '' };
    }

    /** @param {boolean} apilar true al abrir (atrás vuelve al panel); al cerrar se reemplaza,
        que cerrar no es ir a ningún sitio nuevo. */
    function reflejarModal(apilar) {
      if (!window.AppUrl || !AppUrl.reflejar) return;
      AppUrl.reflejar(urlDelModal(estadoModal), apilar ? { apilar: true } : null);
    }

    /**
     * Pone en pantalla lo que pida la URL. La usan el arranque y atrás/adelante, y las dos
     * abren con `sinUrl`: lo que llega ES la barra de direcciones y contestarle escribiendo
     * lo mismo apilaría una entrada por cada pulsación de atrás.
     */
    /** Devuelve false —y solo entonces— cuando lo pedido no está PORQUE los datos son una
        copia local: el llamador deja el intento pendiente para el pintado fresco.
        @param {boolean=} deLaBarra true solo cuando llega de atrás/adelante. Ver aplicarSeccion. */
    function aplicarUrl(p, deCache, deLaBarra) {
      p = p || {};

      // El tablero va PRIMERO y por su cuenta: no es un modal sobre una incidencia, no
      // necesita los datos del panel para abrirse —se pinta con los de AppOperacion— y
      // debajo hay varios `return` que se lo saltarían.
      aplicarSeccion(p, deLaBarra);

      var pide = { action: String(p.action || ''), inc: String(p.inc || ''), item: String(p.item || '') };
      var hay = urlDelModal(estadoModal);
      // Ya está delante lo que se pide: repintarlo borraría la nota a medio escribir.
      if (pide.action === String(hay.action || '') &&
          pide.inc === String(hay.inc || '') &&
          pide.item === String(hay.item || '')) return;

      var esNuestra = pide.action === 'nueva' || pide.action === 'elevar' ||
                      Object.prototype.hasOwnProperty.call(ACCIONES, pide.action);

      // La ausencia también dice algo: volver a una URL sin acción es «el panel a secas».
      // El cierre pasa por cerrarModal y no por quitar la clase, porque es quien devuelve
      // el scroll al body y el foco al botón; a mano, la página se quedaba sin poder rodar.
      if (!esNuestra) { if (estadoModal) cerrarModal(true); return; }

      // Los tres modales necesitan los datos delante —la incidencia, el reporte, el catálogo
      // de estados—. Si todavía no han llegado no se pierde: pintar() lo aplica al terminar.
      if (!datos) return;

      if (pide.action === 'nueva') { abrirModalNueva(true); return; }

      if (pide.action === 'elevar') {
        var rep = (datos.sueltos || []).filter(function (r) { return r.id === pide.item; })[0];
        if (rep) { abrirModalElevar(rep.id, true); return; }
        if (deCache) return false;   // puede que aún no esté en la copia: se reintenta
        olvidarUrl();
        return;
      }

      var inc = (datos.incidentes || []).filter(function (x) { return x.id === pide.inc; })[0];
      if (inc) { abrirModalActualizar(inc, ACCIONES[pide.action], true); return; }
      if (deCache) return false;
      olvidarUrl();
    }

    /**
     * La sección que pide la barra: hoy solo `sec=tablero`. Se llama desde el arranque y
     * desde atrás/adelante, y siempre en callado —lo que llega ES la dirección—.
     *
     * La AUSENCIA también dice algo: volver a una dirección sin `sec` es «el panel a
     * secas», y sin el else el botón atrás cambiaba la barra dejando el tablero delante,
     * contando una cosa distinta de la que decía la URL.
     *
     * @param {boolean=} deLaBarra true solo cuando el aviso viene de atrás/adelante, que
     *   es el único caso en el que hay que mover el periodo del historial. Al arrancar no
     *   se toca, y no es un detalle: elegir un periodo lo escribe con la espera de 300 ms
     *   de reflejar(), así que durante ese momento la URL todavía no lo dice — y el
     *   pintado del panel, que llega por su cuenta y lee la barra, devolvía el gráfico al
     *   periodo inicial delante de quien acababa de pulsar otro.
     */
    function aplicarSeccion(p, deLaBarra) {
      var quiere = String((p && p.sec) || '') === 'tablero';
      if (quiere && !tableroAbierto) abrirTablero(null, true);
      else if (!quiere && tableroAbierto) cerrarTablero(true);
      // Y el periodo del historial, que viaja aparte: atrás desde ?rango=30d tiene que
      // devolver el gráfico al periodo de la entrada anterior, no dejar los 30 días.
      if (quiere && deLaBarra) sincronizarRango(String((p && p.rango) || ''));
    }

    /** El enlace pide algo que ya no está: la incidencia salió de la semana, el reporte se
        descartó. No es motivo para enseñarle un error a nadie —se llega aquí por un enlace
        de hace días—; se quita de la barra para que el siguiente atrás no vuelva a intentarlo. */
    function olvidarUrl() {
      if (window.AppUrl && AppUrl.reflejar) AppUrl.reflejar({ action: '', inc: '', item: '' });
    }

    /**
     * Un estado nuevo se crea ANTES de usarlo, en su propia llamada. Si se creara junto con
     * la actualización y la actualización fallara, quedaría un estado huérfano en el
     * catálogo que todo el equipo vería en la lista sin que nadie lo hubiera usado nunca.
     */
    function guardarModal() {
      var m = estadoModal;
      if (m.guardando) return;

      if (m.nuevoEstado) {
        var nombre = String(m.nombreEstado || '').trim();
        if (nombre.length < 3) { errorModal('Escribe cómo se va a llamar el estado.'); return; }
        m.guardando = true; pintarModal();
        // El botón ya se pintó ocupado; esto le pone además el disco girando. Se cierra
        // antes de repintar el modal: después el nodo ya está fuera del documento.
        var fxEstado = window.VentelFX ? VentelFX.button('#opp-modal-guardar', 'Creando el estado…') : null;
        AppRun.call('opCrearEstado', [{ email: correo(), nombre: nombre, tono: m.tonoEstado }])
          .then(function (r) {
            if (fxEstado) fxEstado.done();
            m.guardando = false;
            if (r && r.success) {
              // El catálogo local se actualiza para que el chip nuevo salga ya seleccionado.
              datos.catalogo.estados.push({
                clave: r.clave, nombre: r.valor, tono: r.tono,
                afecta: r.tono !== 'ok' && r.tono !== 'neutro',
                cierra: r.tono === 'ok' || r.tono === 'neutro', base: false
              });
              m.nuevoEstado = false; m.estado = r.clave; m.error = '';
              pintarModal();
            } else {
              if (r && r.yaExiste) {
                var ya = estadosDisponibles().filter(function (e) {
                  return e.nombre.toLowerCase() === String(r.valor).toLowerCase();
                })[0];
                if (ya) { m.nuevoEstado = false; m.estado = ya.clave; }
              }
              m.error = (r && r.message) || 'No pudimos crear el estado.';
              pintarModal();
            }
          }, function () {
            if (fxEstado) fxEstado.done();
            m.guardando = false; m.error = 'No hay conexión con el sistema.'; pintarModal();
          });
        return;
      }

      var payload = { email: correo(), estado: m.estado, nota: m.nota, avisar: !!m.avisar };
      var fn;

      if (m.tipo === 'actualizar') {
        fn = 'opActualizarIncidente';
        payload.id = m.id;
      } else if (m.tipo === 'elevar') {
        fn = 'opElevarReporte';
        payload.reporteId = m.repId;
      } else {
        fn = 'opCrearIncidente';
        payload.sistema = m.sistemaOtro ? '' : m.sistema;
        payload.sistemaNuevo = m.sistemaOtro ? String(m.sistemaNuevo || '').trim() : '';
        payload.submotivo = String(m.submotivo || '').trim();
        payload.titulo = String(m.titulo || '').trim();
        payload.detalle = String(m.detalle || '').trim();
        if (!payload.sistema && !payload.sistemaNuevo) { errorModal('Elige el sistema al que afecta.'); return; }
        if (!payload.submotivo) { errorModal('Dinos qué es lo que está pasando.'); return; }
      }

      /**
       * El modal se cierra al soltar el botón y la escritura sube por detrás.
       *
       * Aquí importa más que en otras pantallas: quien está actualizando una falla
       * suele tener tres o cuatro que atender, y el sitio donde se lleva el pulso de
       * la operación no puede ser el sitio donde más se espera. Si el servidor
       * rechaza, el modal vuelve con lo escrito y con el motivo.
       *
       * Solo `opActualizarIncidente` se reintenta: cambiar el estado de una falla
       * deja lo mismo si se repite. Crear una incidencia o elevar un reporte avisa
       * al equipo por Chat, y un reintento sería un segundo aviso.
       */
      var estadoAnterior = m;
      var esAlta = (fn !== 'opActualizarIncidente');
      var quePasa = m.tipo === 'actualizar' ? 'Actualizando la falla'
                  : (m.tipo === 'elevar' ? 'Elevando el reporte' : 'Publicando la falla');

      AppGuardado.guardar({
        clave: 'operacion:' + (payload.id || payload.reporteId || 'nueva'),
        etiqueta: quePasa,
        hecho: m.tipo === 'actualizar' ? 'Falla actualizada'
             : (m.tipo === 'elevar' ? 'Reporte elevado' : 'Falla publicada'),
        fn: fn,
        args: [payload],
        reintentos: esAlta ? 0 : 2,
        valida: function (r) { return !!(r && r.success); },
        optimista: function () { cerrarModal(); },
        revertir: function (r) {
          estadoModal = estadoAnterior;
          estadoModal.guardando = false;
          estadoModal.error = (r && r.message) || 'No pudimos guardar el cambio.';
          modalOv.classList.add('abierto');
          document.body.style.overflow = 'hidden';
          pintarModal();
          // El modal vuelve a estar delante, y la barra dice que no hay nada abierto desde
          // que el cierre optimista la limpió. Reemplaza y no apila: al usuario no lo ha
          // llevado nadie a otro sitio, es el servidor el que le devuelve lo que escribió.
          reflejarModal(false);
        },
        alLograr: function () {
          AppCache.remove('operacion-panel');
          AppCache.remove('operacion-estado');
          datos = null;
          cargar(true);
          // Toda escritura invalida su caché, y esta invalida también la de arriba: el
          // servidor tira de un golpe todo lo suyo (opInvalidarCache_), pero la copia de
          // recomendaciones del navegador dura cinco minutos y se quedaría proponiendo
          // agrupar el reporte que se acaba de agrupar, con el botón muerto que eso implica.
          recoCargar(true);
          if (window.AppOperacion) AppOperacion.refrescar(true);
        }
      });
    }

    function descartarReporte(repId, boton) {
      // La fila se va en cuanto se toca el botón: descartar un reporte es una decisión
      // ya tomada —se estaba leyendo—, y verla quedarse medio segundo con el botón
      // gris es lo que hace que la bandeja se sienta lenta cuando hay quince.
      // `.opp-rep` es la fila de verdad: los selectores que había aquí (li, tr, article) no
      // existen en este bloque, así que `closest` devolvía null y no se ocultaba nada.
      var fila = boton.closest ? boton.closest('.opp-rep') : null;

      AppGuardado.guardar({
        clave: 'reporte:' + repId,
        etiqueta: 'Descartando el reporte',
        hecho: 'Reporte descartado.',
        fn: 'opDescartarReporte',
        args: [{ email: correo(), reporteId: repId }],
        valida: function (r) { return !!(r && r.success); },
        optimista: function () {
          boton.disabled = true;
          if (fila) fila.style.display = 'none';
        },
        revertir: function () {
          boton.disabled = false;
          if (fila) fila.style.display = '';
        },
        alLograr: function () {
          AppCache.remove('operacion-panel');
          datos = null;
          cargar(true);
          // Descartar cambia la lista sobre la que se calcula «estos tres sueltos son la
          // misma falla»: sin releerlas, la recomendación seguiría contando —y ofreciendo
          // agrupar— un reporte que ya no está en ninguna parte.
          recoCargar(true);
        }
      });
    }

    /* ── Exporte a CSV ──────────────────────────────────────────────────────────────
       Esta pantalla no exportaba nada: para llevar una caída a una reunión había que
       transcribir las tarjetas a mano. El CSV se genera en el navegador, como el reporte de
       cotizaciones de inicio_avanzado: sin viaje al servidor, sin permisos de Drive y sin
       nada que se quede a medias si la conexión se corta a mitad de la descarga.

       Se exporta lo que hay en `datos`, que es exactamente lo que las cuatro secciones
       acaban de pintar: las incidencias (esperan, activas y cerradas de la semana) y los
       reportes sueltos de las últimas 24 h. Nada que no esté en pantalla.

       LAS CUATRO COLUMNAS QUE PIDE EL ALCANCE, con el campo que las sostiene:
         · Tipo       → incidencia o reporte suelto. No existe ningún campo llamado así; es
                        la distinción que de verdad separa las filas de este CSV y la que
                        decide qué columnas van llenas en cada una.
         · Hora       → en columna propia, aparte de la fecha, y en HH:mm de 24 horas.
                        Suelta es lo que permite repetir en una hoja de cálculo el análisis
                        por franjas que hace la sección de arriba («falla de 9 a 11 h»);
                        pegada a la fecha no se puede agrupar por ella.
         · Categoría  → el submotivo, que es el catálogo con el que el equipo clasifica lo
                        que le pasa («No abre», «Va lento»).
         · Plataforma → el sistema afectado (Connect, el CRM…). Es lo que el formulario de
                        reporte llama «sistema» y que aquí se pedía por su otro nombre. */

    /** Una celda: comillas dobladas y entrecomillado solo cuando hace falta. Mismo escapado
        que el reporte de cotizaciones —una nota con una coma partía la fila en dos—. */
    function csvCelda(v) {
      var s = String(v == null ? '' : v).replace(/"/g, '""');
      return /[",\n]/.test(s) ? '"' + s + '"' : s;
    }

    function csvFecha(iso) {
      var d = new Date(iso);
      return isNaN(d.getTime()) ? '' : d.toLocaleDateString('es-MX');
    }

    /* HH:mm a mano y no con toLocaleTimeString: en es-MX devuelve «9:14 a. m.», que Excel
       no ordena ni agrupa por hora —y agrupar por hora es justo para lo que se pidió esta
       columna—. Con dos dígitos siempre, que «9:14» y «10:14» se ordenan al revés como
       texto. */
    function csvHora(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }

    /** aaaammdd: así los archivos de varios días se ordenan solos en la carpeta. */
    function csvSello(d) {
      return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
    }

    var CSV_COLS = ['Tipo', 'Fecha', 'Hora', 'Plataforma', 'Categoría', 'Estado', 'Título',
                    'Personas', 'Reportes', 'Origen', 'Persona', 'Correo',
                    'Confirmada', 'Cerrada', 'Notas'];

    function exportarCsv(boton) {
      if (!datos) {
        if (window.AppMotion) AppMotion.toast('El panel todavía se está cargando.', 'warn');
        return;
      }

      var incs = datos.incidentes || [];
      var sueltos = datos.sueltos || [];
      if (!incs.length && !sueltos.length) {
        if (window.AppMotion) AppMotion.toast('No hay nada que exportar ahora mismo.', 'warn');
        return;
      }

      // La incidencia se fecha por cuando se DETECTÓ, que es lo que enseña su tarjeta;
      // confirmada y cerrada viajan en columnas propias porque son tres momentos distintos
      // y meterlos en una sola obligaría a elegir cuál de los tres se pierde.
      var filas = incs.map(function (i) {
        return [
          'Incidencia', csvFecha(i.creado), csvHora(i.creado),
          i.sistema, i.submotivo, i.estadoNombre, i.titulo,
          i.personas, i.reportes,
          i.origen === 'automatico' ? 'Automática' : 'Publicada',
          i.confirmadoNombre || '', '',
          i.confirmado ? csvFecha(i.confirmado) + ' ' + csvHora(i.confirmado) : '',
          i.cerrado ? csvFecha(i.cerrado) + ' ' + csvHora(i.cerrado) : '',
          i.detalle || ''
        ];
      }).concat(sueltos.map(function (r) {
        // Los unos de Personas y Reportes no son relleno: un suelto ES una persona y un
        // reporte, y dejarlos vacíos rompería cualquier suma de esas dos columnas.
        return [
          'Reporte suelto', csvFecha(r.fecha), csvHora(r.fecha),
          r.sistema, r.submotivo, 'Sin agrupar', '',
          1, 1, 'Reportado por el equipo',
          r.nombre || '', r.correo || '', '', '', r.notas || ''
        ];
      }));

      // BOM UTF-8: sin él Excel abre «Categoría» como «CategorÃ­a» y el archivo se vuelve
      // inservible justo para quien no sabe cambiarle la codificación al abrirlo.
      var csv = '﻿' + CSV_COLS.join(',') + '\n' +
        filas.map(function (f) { return f.map(csvCelda).join(','); }).join('\n');

      var nombre = 'Operacion_' + csvSello(new Date()) + '.csv';
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      var enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = nombre;
      document.body.appendChild(enlace);
      enlace.click();
      document.body.removeChild(enlace);
      // Se suelta el objeto en cuanto el navegador se lo ha llevado: sin esto cada descarga
      // deja el CSV entero retenido en memoria hasta recargar, y este panel se queda abierto
      // toda la jornada delante de quien va exportando una caída tras otra.
      URL.revokeObjectURL(url);

      if (window.AppMotion) {
        AppMotion.pop(boton);
        AppMotion.toast('Descargado ' + nombre + ': ' +
          incs.length + (incs.length === 1 ? ' incidencia y ' : ' incidencias y ') +
          sueltos.length + (sueltos.length === 1 ? ' reporte suelto.' : ' reportes sueltos.'), 'ok');
      }
    }

    /* ── Barra superior ── */

    document.getElementById('opp-nueva').addEventListener('click', function () {
      disparador = this; abrirModalNueva();
    });
    // Antes esto era AppUrl.go('estado'). Consultar el tablero era perder el sitio.
    document.getElementById('opp-tablero').addEventListener('click', function () { abrirTablero(this); });
    document.getElementById('opp-exportar').addEventListener('click', function () { exportarCsv(this); });
    document.getElementById('opp-refrescar').addEventListener('click', function () {
      AppCache.remove('operacion-panel');
      datos = null;
      cargar(true);
      // Las recomendaciones también se releen: salen de las mismas hojas, y dejarlas como
      // estaban después de pulsar «Actualizar» es enseñar dos verdades con distinta fecha
      // en la misma pantalla. No se vacían antes de pedirlas: lo que hay sigue siendo
      // cierto hasta que llegue lo nuevo, y taparlo con un esqueleto sería quitar
      // información a cambio de nada.
      recoCargar(true);
    });

    document.getElementById('opp-visor-x').addEventListener('click', function () { visor.classList.remove('abierto'); });
    visor.addEventListener('click', function (e) { if (e.target === visor) visor.classList.remove('abierto'); });

    // Atrás y adelante del navegador. Se registra antes de cargar para que una pulsación
    // temprana no se pierda: aplicarUrl aguanta sin datos y pintar() la repone al llegar.
    if (window.AppUrl && AppUrl.alCambiarUrl) {
      AppUrl.alCambiarUrl(function (loc) { aplicarUrl((loc && loc.parameter) || {}, false, true); });
    }

    /* Un F5 con el tablero abierto lo reabre, y ANTES de pedir el panel: el tablero no
       depende de opPanel —se pinta con el estado que AppOperacion ya trae—, así que
       esperar a pintar() lo habría hecho aparecer segundos tarde, y con el panel caído no
       habría aparecido nunca (pintar() no llega a llamarse). Los modales sí esperan ahí,
       porque sin sus datos no hay incidencia que enseñar. */
    if (window.AppUrl && AppUrl.params) aplicarSeccion(AppUrl.params());

    cargar(false);

    /* Las recomendaciones salen un fotograma DESPUÉS del panel, no en el mismo tick.
       Montar una llamada de google.script.run no es gratis —crea su iframe y serializa los
       argumentos—, así que pedirlas aquí mismo retrasaría el dibujado de los esqueletos que
       `cargar` acaba de escribir en el DOM: el panel, que es a lo que se viene, tardaría más
       en dar señales de vida por culpa de una sección de apoyo. Es la otra mitad de «las
       recomendaciones no encarecen la carga del panel»; la primera es su caché de cinco
       minutos. Con el hueco de por medio siguen siendo dos peticiones independientes: si
       una falla o tarda, la otra ni se entera. */
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(function () { setTimeout(function () { recoCargar(false); }, 0); });
    } else {
      setTimeout(function () { recoCargar(false); }, 0);
    }

    /* Recorrido guiado del panel de operación. Se explica lo que no se ve a la primera:
       que las recomendaciones son una lectura de las mismas cifras de arriba (y que
       desaparecen solas cuando no hay nada que avisar) y que el tablero público se puede
       abrir sin salir de aquí. Sin `centrarSiOculto` en el paso de #opp-reco a propósito:
       si esta persona entra sin recomendaciones que mostrar, ese paso se cae solo del
       recorrido en vez de señalar un hueco vacío. */
    if (window.AppOnboarding) AppOnboarding.auto({
      pantalla: 'operacion',
      version: 1,
      retraso: 900,
      pasos: [
        {
          titulo: 'El panel de operación',
          texto: 'Aquí se confirma o se descarta lo que reporta el equipo, y lo que publiques aquí lo ' +
                 've todo el mundo: los asesores y quien abra el tablero sin iniciar sesión.<br><br>' +
                 'El recorrido es corto: solo lo que no se nota a la primera.'
        },
        {
          sel: '#opp-kpis',
          pos: 'abajo',
          titulo: 'Así va todo ahora mismo',
          texto: 'Estas cifras resumen el día: lo que espera tu decisión, lo que sigue activo, lo que ' +
                 'todavía no llega al umbral y lo que ya se cerró.<br><br>' +
                 'Cuando hay algo urgente, el primer número se resalta.'
        },
        {
          sel: '#opp-reco',
          pos: 'auto',
          titulo: 'Lo que dicen los datos',
          texto: 'Esta sección lee las mismas cifras de arriba y saca la conclusión que nadie tiene tiempo ' +
                 'de sacar a mitad de una caída: un sistema que falla siempre a la misma hora, un fallo que ' +
                 'ya volvió varias veces.<br><br>' +
                 'Los días tranquilos <b>no aparece nada aquí</b>: sin nada que recomendar, el espacio desaparece.'
        },
        {
          sel: '#opp-esperan',
          pos: 'auto',
          titulo: 'Lo que espera tu decisión',
          texto: 'Las incidencias que el sistema detectó solo caen aquí primero. Mientras una siga en esta ' +
                 'lista, <b>nadie la ve confirmada ni descartada</b>.<br><br>' +
                 'Es lo primero que conviene revisar al entrar.'
        },
        {
          sel: '#opp-tablero',
          pos: 'abajo',
          titulo: 'El tablero público',
          texto: 'Este botón abre, sin salir de aquí, exactamente lo que ven los asesores y quien consulte ' +
                 'el tablero sin iniciar sesión.<br><br>' +
                 'Sirve para revisar cómo se ve antes de publicar algo, o para seguir el historial sin perder tu sitio.'
        }
      ]
    });
  });
  </script>
</body>
</html>
