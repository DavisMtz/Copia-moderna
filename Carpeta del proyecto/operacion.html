<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de operación - Sistema Ventel</title>
  <!-- Preferencias de vista (tema · densidad · texto · contraste) ANTES del tema,
       para que la pantalla no parpadee del ajuste por omisión al de la persona. -->
  <?!= include('ViewPrefsPartial'); ?>
  <?!= include('app_theme'); ?>
  <style>
  /**
   * =====================================================================================
   * PANEL DE OPERACIÓN (supervisión) · bloque 'operacion'
   * =====================================================================================
   * Aquí se decide qué ve el resto del equipo. La pantalla está ordenada por lo que hay
   * que HACER, no por lo que hay que leer:
   *
   *   1. Lo que espera una decisión (incidencias automáticas sin confirmar).
   *   2. Lo que ya está reconocido y sigue vivo.
   *   3. Reportes sueltos que no llegaron al umbral.
   *   4. Lo cerrado esta semana.
   *
   * El aviso al equipo es SIEMPRE una casilla explícita: publicar un cambio y anunciarlo
   * son dos decisiones distintas, y fundirlas obligaría a elegir entre no corregir una
   * errata o mandar un mensaje que nadie necesita.
   */

  /* Tokens de señal locales: --warn/--alert/--ok están hechos para fondo claro y en carbón
     caen a ~2,5:1. Se ajustan aquí una sola vez y lo heredan bordes, filos y KPIs; el token
     global no se toca porque en otras pantallas se usa como fondo. */
  .opp, .opp-modal-ov, .opp-tab-ov {
    --o-ok: var(--ok); --o-warn: var(--warn); --o-alert: var(--alert); --o-info: var(--info);
  }
  [data-theme="carbon"] .opp, [data-theme="carbon"] .opp-modal-ov, [data-theme="carbon"] .opp-tab-ov {
    --o-ok: #4ADE80; --o-warn: #F2B65A; --o-alert: #FCA5A5; --o-info: #93B4FF;
  }

  /* `width:100%` NO sobra. AppShell mete este <main> dentro de un contenedor flex en
     columna; un ítem flex con margen horizontal automático deja de estirarse y toma su
     ancho de CONTENIDO, así que el panel salía encogido a media pantalla con dos franjas
     vacías a los lados. Con el ancho declarado, el max-width vuelve a mandar. */
  .opp { width: 100%; max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }

  .opp-head { margin-bottom: 26px; }
  .opp-head h1 { margin: 0 0 6px; font-family: var(--f-display); font-size: 1.6rem;
    font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
  .opp-head p { margin: 0; font-size: .92rem; color: var(--ink-soft); line-height: 1.55; max-width: 62ch; }

  .opp-barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  .opp-barra .opp-sep { flex: 1; }

  .opp-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 30px; }
  .opp-kpi { padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
  .opp-kpi b { display: block; font-size: 1.7rem; font-weight: 800; line-height: 1.1;
    color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .opp-kpi small { display: block; margin-top: 3px; font-size: .76rem; font-weight: 650;
    color: var(--ink-soft); }
  .opp-kpi.urge { border-color: var(--o-warn); background: var(--warn-bg); }
  .opp-kpi.urge b, .opp-kpi.urge small { color: var(--o-warn); }

  /* ── Recomendaciones ────────────────────────────────────────────────────────────────
     Lo que estas mismas cifras ya dicen y que hoy solo lee quien tiene tiempo de mirar un
     rato: que un sistema falla siempre a la misma hora, que el fallo de la semana pasada
     ya volvió tres veces, que esos tres sueltos son la incidencia que hay abierta arriba.
     Va ENTRE los KPIs y las cuatro secciones porque es exactamente eso: la lectura de las
     cifras de arriba y el motivo por el que se baja a lo de abajo.

     Sin nada que recomendar la sección desaparece entera. Un recuadro permanente diciendo
     «sin recomendaciones» ocuparía el mejor sitio de la pantalla los días buenos —que son
     la mayoría— para no decir nada, y en una pantalla de trabajo eso se aprende a saltar
     con la vista en dos días; el día que sí tuviera algo, ya nadie lo miraría. */
  .opp-reco { margin-bottom: 30px; }
  .opp-reco[hidden] { display: none; }
  .opp-reco .opp-rot { margin-top: 0; }
  .opp-reco-pie { margin: -8px 0 14px; font-size: .76rem; font-weight: 600; color: var(--ink-faint); }

  /* El filo de color lo pone la urgencia, y sale de los tokens de señal de esta pantalla
     —los mismos que ya usan las tarjetas y los KPIs—. Un rojo escrito a mano aquí sería
     un rojo más que revisar cada vez que se toque el tema, y en carbón caería a 2,5:1
     justo en lo que quiere llamar la atención. */
  .opp-reco-c { border: 1px solid var(--line); border-left: 4px solid var(--o-info);
    border-radius: 14px; background: var(--surface); padding: 15px 17px; margin-bottom: 10px; }
  .opp-reco-c.urg-alta  { border-left-color: var(--o-alert); }
  .opp-reco-c.urg-media { border-left-color: var(--o-warn); }
  .opp-reco-c.urg-baja  { border-left-color: var(--o-info); }
  .opp-reco-c h3 { margin: 9px 0 0; font-size: 1rem; font-weight: 700; color: var(--ink); line-height: 1.4; }
  /* La cifra que sostiene el consejo: debajo del título y más discreta, porque primero se
     lee la conclusión y solo después por qué hay que creérsela. Nunca está vacía —una
     recomendación sin cifra detrás no se publica—, así que no hace falta preverlo. */
  .opp-reco-ev { margin: 5px 0 0; font-size: .84rem; color: var(--ink-soft); line-height: 1.55; }
  .opp-reco-de { margin: 5px 0 0; font-size: .79rem; color: var(--ink-faint); line-height: 1.5; }
  .opp-reco .opp-acc { margin-top: 12px; padding-top: 12px; }

  .opp-rot { display: flex; align-items: center; gap: 10px; margin: 34px 0 14px;
    font-size: .7rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-faint); }
  /* El primer rótulo no se separa de los KPIs. Aquí ponía `.opp-rot:first-of-type`, que
     valía cuando los cuatro colgaban del mismo padre; ahora cada sección es su propio
     contenedor y el rótulo de las cuatro era «el primero de su tipo», así que las cuatro
     perdían la separación y quedaban pegadas unas a otras. */
  #opp-esperan .opp-rot { margin-top: 0; }
  .opp-rot::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .opp-rot .opp-n { background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 8px; font-size: .68rem; color: var(--ink-soft); }

  /* ── Tarjeta de incidencia ── */
  .opp-card { border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
    padding: 18px 20px; margin-bottom: 12px; }
  .opp-card.urge { border-left: 4px solid var(--o-warn); }
  .opp-card.viva { border-left: 4px solid var(--o-alert); }
  .opp-card.cerrada { opacity: .75; }
  .opp-card-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .opp-card h3 { margin: 0 0 6px; font-size: 1.02rem; font-weight: 700; color: var(--ink); line-height: 1.35; }
  .opp-card .opp-det { margin: 0; font-size: .87rem; color: var(--ink-soft); line-height: 1.55; }
  .opp-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px;
    font-size: .77rem; color: var(--ink-faint); font-weight: 600; }
  .opp-meta .opp-pin { display: inline-flex; align-items: center; gap: 4px; }
  .opp-meta svg { width: 13px; height: 13px; }
  .opp-acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--line-soft, var(--line)); }

  .opp-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px;
    border-radius: 999px; font-size: .73rem; font-weight: 700; border: 1px solid transparent; }
  .opp-badge svg { width: 13px; height: 13px; flex: none; }
  .opp-badge.tono-ok     { background: var(--ok-bg);     color: var(--ok);     border-color: var(--ok); }
  .opp-badge.tono-warn   { background: var(--warn-bg);   color: var(--warn);   border-color: var(--warn); }
  .opp-badge.tono-alert  { background: var(--alert-bg);  color: var(--alert);  border-color: var(--alert); }
  .opp-badge.tono-info   { background: var(--info-bg);   color: var(--info);   border-color: var(--info); }
  .opp-badge.tono-neutro { background: var(--surface-2); color: var(--ink-soft); border-color: var(--line); }
  [data-theme="carbon"] .opp-badge.tono-ok    { color: #4ADE80; border-color: rgba(74,222,128,.4); }
  [data-theme="carbon"] .opp-badge.tono-warn  { color: #F2B65A; border-color: rgba(242,182,90,.4); }
  [data-theme="carbon"] .opp-badge.tono-alert { color: #FCA5A5; border-color: rgba(252,165,165,.4); }
  [data-theme="carbon"] .opp-badge.tono-info  { color: #93B4FF; border-color: rgba(147,180,255,.4); }

  .opp-origen { font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--ink-faint); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }

  /* ── Reporte suelto ── */
  .opp-rep { border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2);
    padding: 15px 17px; margin-bottom: 10px; }
  .opp-rep-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .opp-rep-top b { font-size: .9rem; font-weight: 650; color: var(--ink); }
  .opp-rep-top small { font-size: .75rem; color: var(--ink-faint); }
  .opp-rep .opp-sub { display: inline-block; font-size: .76rem; font-weight: 650; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; margin-bottom: 8px; }
  .opp-rep p { margin: 0; font-size: .85rem; color: var(--ink-soft); line-height: 1.55; white-space: pre-wrap; }
  .opp-evis { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .opp-evi { width: 84px; height: 84px; border-radius: 10px; overflow: hidden; padding: 0;
    border: 1px solid var(--line); background: var(--surface); cursor: zoom-in; }
  .opp-evi img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ── Vacío ── */
  .opp-vacio { text-align: center; padding: 40px 24px; border: 1px dashed var(--line);
    border-radius: 16px; color: var(--ink-soft); }
  .opp-vacio b { display: block; font-size: 1rem; color: var(--ink); margin-bottom: 5px; font-weight: 650; }
  .opp-vacio p { margin: 0 auto; max-width: 46ch; font-size: .87rem; line-height: 1.6; }

  /* Esqueletos de espera (VentelFX). El de los KPIs entra como UN hijo de la rejilla y sin
     esto se encogería a la primera columna con las cuatro cajas apiladas dentro; los de las
     secciones se ponen a una columna porque lo que va a llegar son tarjetas a lo ancho.
     El selector es de descendencia y no de hijo directo: los esqueletos ya no cuelgan de
     #opp-contenido sino de cada sección, y con `>` dejaban de coincidir —volvían a salir a
     dos y tres columnas contra un contenido que llega a lo ancho—.
     Las recomendaciones entran en la misma regla por lo mismo: son tarjetas a lo ancho, y
     con la rejilla por omisión la única caja del esqueleto salía a un tercio de ancho, que
     no es la forma de nada de lo que va a aterrizar ahí. */
  #opp-kpis > .vfx-sk { grid-column: 1 / -1; }
  #opp-contenido .vfx-sk-grid, #opp-reco .vfx-sk-grid { grid-template-columns: 1fr; }

  /* ── Modal ── */
  .opp-modal-ov { position: fixed; inset: 0; z-index: 980; background: rgba(16,24,40,.5);
    backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .opp-modal-ov.abierto { display: flex; }
  .opp-modal { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 24px 26px; box-shadow: 0 26px 60px -24px rgba(16,24,40,.5); }
  .opp-modal h2 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 700; color: var(--ink); }
  .opp-modal .opp-modal-sub { margin: 0 0 20px; font-size: .85rem; color: var(--ink-soft); line-height: 1.5; }

  .opp-campo { margin-bottom: 18px; }
  .opp-lbl { display: block; font-size: .8rem; font-weight: 650; color: var(--ink); margin-bottom: 7px; }
  .opp-lbl .opp-opc { font-weight: 500; color: var(--ink-soft); }
  .opp-ops { display: flex; flex-wrap: wrap; gap: 6px; }
  .opp-op { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer;
    font-family: var(--f-ui); font-size: .84rem; font-weight: 600; }
  .opp-op:hover { background: var(--surface-2); }
  .opp-op:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .opp-op[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .opp-op.nuevo { border-style: dashed; color: var(--ink-soft); }

  .opp-check { display: flex; align-items: flex-start; gap: 10px; padding: 13px 15px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
  .opp-check input { margin-top: 2px; width: 17px; height: 17px; accent-color: var(--brand); flex: none; }
  .opp-check-tx b { display: block; font-size: .86rem; font-weight: 650; color: var(--ink); margin-bottom: 2px; }
  .opp-check-tx small { font-size: .78rem; color: var(--ink-soft); line-height: 1.45; }

  .opp-err { display: flex; align-items: flex-start; gap: 6px; margin-top: 12px;
    font-size: .82rem; font-weight: 600; color: var(--o-alert); line-height: 1.45; }
  .opp-err svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
  .opp-err[hidden] { display: none; }

  .opp-modal-acc { display: flex; gap: 9px; justify-content: flex-end; flex-wrap: wrap; margin-top: 22px; }

  /* ── Tablero embebido ──────────────────────────────────────────────────────────────
     Lo que ve el equipo, encima de esta pantalla y sin salir de ella. Es una vista
     COMPACTA, no una copia de estado.html: comparte sus palabras y sus datos, pero de su
     hoja de estilos aquí no se copia nada —dos tableros con dos hojas divergen en cuanto
     alguien toca una—. Lo que se puede reutilizar se reutiliza tal cual (.opp-badge,
     .opp-rot, .opp-vacio, .opp-meta), y esto es solo el armazón que falta.

     Va por debajo del modal (980) y del visor (995): si un enlace abre las dos cosas a la
     vez —?action=nueva&sec=tablero—, la decisión que se está tomando manda sobre la
     consulta. */
  .opp-tab-ov { position: fixed; inset: 0; z-index: 970; background: rgba(16,24,40,.5);
    backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; padding: 22px 18px; }
  .opp-tab-ov.abierto { display: flex; }
  .opp-tab { width: 100%; max-width: 880px; max-height: 92vh; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 26px 60px -24px rgba(16,24,40,.5); overflow: hidden; }
  .opp-tab-head { display: flex; align-items: flex-start; gap: 12px;
    padding: 20px 22px 15px; border-bottom: 1px solid var(--line); }
  .opp-tab-head h2 { margin: 0; font-size: 1.12rem; font-weight: 700; color: var(--ink); }
  .opp-tab-head p { margin: 4px 0 0; font-size: .82rem; color: var(--ink-soft); line-height: 1.5; max-width: 58ch; }
  .opp-tab-x { flex: none; margin-left: auto; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft);
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .opp-tab-x:hover { color: var(--ink); }
  .opp-tab-x:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .opp-tab-x svg { width: 17px; height: 17px; }

  /* El cuerpo es el ÚNICO que rueda. Con la ventana rodando por detrás, la cabecera se
     iba de la pantalla y no quedaba a mano ni el aspa ni de qué tablero se trataba. */
  .opp-tab-cuerpo { padding: 18px 22px 22px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .opp-tab-pie { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 11px 22px; border-top: 1px solid var(--line); background: var(--surface-2);
    font-size: .76rem; font-weight: 600; color: var(--ink-faint); }
  .opp-tab-pie .opp-sep { flex: 1; }

  .opp-tab-tit { border: 1px solid var(--line); border-left-width: 4px; border-radius: 16px;
    padding: 17px 19px; background: var(--surface-2); margin-bottom: 6px; }
  .opp-tab-tit.tono-ok    { border-left-color: var(--o-ok); }
  .opp-tab-tit.tono-warn  { border-left-color: var(--o-warn); }
  .opp-tab-tit.tono-alert { border-left-color: var(--o-alert); }
  .opp-tab-tit.tono-info  { border-left-color: var(--o-info); }
  .opp-tab-ojo { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem;
    font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .opp-tab-vivo { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .opp-tab-tit.tono-ok    .opp-tab-ojo { color: var(--o-ok); }
  .opp-tab-tit.tono-warn  .opp-tab-ojo { color: var(--o-warn); }
  .opp-tab-tit.tono-alert .opp-tab-ojo { color: var(--o-alert); }
  .opp-tab-tit h3 { margin: 7px 0 0; font-family: var(--f-display); font-size: 1.3rem;
    font-weight: 800; letter-spacing: -.02em; color: var(--ink); line-height: 1.2; }
  .opp-tab-tit p { margin: 6px 0 0; font-size: .88rem; color: var(--ink-soft); line-height: 1.55; }

  /* La tarjeta de incidencia se reutiliza tal cual; solo baja un nivel de encabezado,
     porque aquí el h2 es el título del propio tablero y el h3 el rótulo de la sección. */
  .opp-tab .opp-card h4 { margin: 0 0 6px; font-size: 1.02rem; font-weight: 700;
    color: var(--ink); line-height: 1.35; }

  .opp-tab-sis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .opp-tab-s { display: flex; align-items: center; gap: 9px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .opp-tab-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--o-ok); }
  .opp-tab-s.tono-warn  .opp-tab-dot { background: var(--o-warn); }
  .opp-tab-s.tono-alert .opp-tab-dot { background: var(--o-alert); }
  .opp-tab-s.tono-info  .opp-tab-dot { background: var(--o-info); }
  .opp-tab-s-tx { min-width: 0; }
  .opp-tab-s-tx b { display: block; font-size: .84rem; font-weight: 650; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opp-tab-s-tx small { display: block; font-size: .74rem; color: var(--ink-soft); }

  /* El globo del historial cuelga del <body> con z-index 60, que es lo correcto cuando el
     gráfico es una tarjeta más de la página (tablero público, feed de supervisión). Aquí
     vive DENTRO de un overlay a 970, así que con su z-index de origen se dibujaba detrás
     del panel: señalar una barra no enseñaba nada. Se sube solo en esta pantalla —y por
     debajo del visor de evidencias, que sigue mandando sobre todo—.
     El selector lleva `body >` por peso, no por adorno: el partial se incluye al final del
     documento, así que con la misma especificidad ganaba su 60 por ir después. */
  body > .eh-globo { z-index: 990; }

  /* ── Visor ── */
  .opp-visor { position: fixed; inset: 0; z-index: 995; background: rgba(8,12,20,.9);
    display: none; align-items: center; justify-content: center; padding: 32px; }
  .opp-visor.abierto { display: flex; }
  .opp-visor img { max-width: 100%; max-height: 100%; border-radius: 12px; }
  .opp-visor-x { position: absolute; top: 20px; right: 20px; width: 42px; height: 42px;
    border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .opp-visor-x svg { width: 20px; height: 20px; }

  @media (max-width: 720px) {
    .opp { padding: 20px 14px 64px; }
    .opp-head h1 { font-size: 1.3rem; }
    .opp-modal { padding: 20px 18px; }
    /* En el teléfono el tablero ocupa la pantalla: con los 22 px de aire a los lados, la
       tira de barras del historial se quedaba sin ancho para leerse. */
    .opp-tab-ov { padding: 0; }
    .opp-tab { max-width: none; max-height: 100vh; height: 100%; border-radius: 0; border: 0; }
    .opp-tab-head { padding: 16px 15px 12px; }
    .opp-tab-cuerpo { padding: 15px 15px 20px; }
    .opp-tab-pie { padding: 10px 15px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  </style>
  <?!= include('app_tailwind'); ?>
</head>
<body>
  <div class="app-aurora"></div>

  <main id="main-content" class="opp">
    <header class="opp-head">
      <h1>Estado de operación</h1>
      <p>Aquí se confirma o se descarta lo que reporta el equipo. Lo que publiques aquí lo ven
         todos los asesores en cada pantalla y también quien abra el tablero sin sesión.</p>
    </header>

    <div class="opp-barra">
      <button type="button" class="v-btn v-btn-primary v-btn-sm" id="opp-nueva">Publicar una incidencia</button>

  <!-- Índices compartidos del Portal (Formas de Pago, Devoluciones SAP, Tiendas y CR,
