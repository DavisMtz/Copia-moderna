      },
      title: function (txt) {
        var t = card.querySelector('.vfx-title');
        if (t) t.textContent = txt || '';
        return api;
      },
      /** Cierra la escena. Idempotente: llamarla dos veces no rompe nada. */
      done: function (cb) {
        if (ended) { if (cb) cb(); return api; }
        ended = true;
        stopAll();
        host.removeAttribute('aria-busy');
        if (barFill && animOK()) G().to(barFill, { width: '100%', duration: .22, ease: 'power2.out' });
        var finish = function () {
          if (host.parentNode) opts.__remove(host);
          if (cb) cb();
        };
        if (animOK()) G().to(host, { opacity: 0, duration: .3, delay: barFill ? .18 : 0, ease: 'power2.in', onComplete: finish });
        else finish();
        return api;
      },
      /**
       * Deja la escena visible con el mensaje de error.
       *   fail(msg)              → se cierra sola a los 4.2 s
       *   fail(msg, false)       → se queda hasta que alguien llame a done()
       *   fail(msg, onReintentar)→ muestra botón «Reintentar» y no se cierra sola
       * Un error sin salida obliga a recargar la pantalla entera; con el botón,
       * el reintento cuesta un clic.
       */
      fail: function (msg, autoMs) {
        stopAll();
        host.classList.add('vfx-err');
        host.removeAttribute('aria-busy');
        api.title('No se pudo completar');
        setSub(msg || 'Vuelve a intentarlo en un momento.');
        if (typeof autoMs === 'function') {
          var reintentar = autoMs;
          if (!card.querySelector('.vfx-retry')) {
            var b = D.createElement('button');
            b.type = 'button';
            b.className = 'vfx-retry';
            b.textContent = 'Reintentar';
            b.addEventListener('click', function () {
              b.disabled = true;
              api.done(function () { try { reintentar(); } catch (e) {} });
            });
            card.appendChild(b);
            if (animOK()) G().fromTo(b, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .3, ease: 'power2.out' });
          }
          return api;
        }
        if (autoMs !== false) setTimeout(function () { api.done(); }, autoMs || 4200);
        return api;
      },
      isDone: function () { return ended; }
    };

    // Tope de seguridad: una escena jamás se queda tapando la pantalla para siempre.
    safety = setTimeout(function () {
      if (!ended) api.fail('El servidor está tardando más de lo normal.', 3000);
    }, opts.maxMs || 45000);

    return api;
  }

  /* ─────────────────────────────────────────────────────────────────────────
     API PÚBLICA
     ───────────────────────────────────────────────────────────────────────── */
  var openOverlay = null;

  function resolve(target) {
    if (!target) return null;
    if (typeof target === 'string') return D.querySelector(target);
    if (target.nodeType === 1) return target;
    if (target.jquery) return target[0];
    return null;
  }

  /**
   * Encender una espera aquí RELEVA al isotipo de arranque, en el acto.
   *
   * El overlay de LoaderPartial nace visible con la página y cada pantalla lo apaga
   * con `hide()`, que lo desvanece en 360 ms. Pero las pantallas apagan y montan su
   * espera en el mismo tick, así que las dos capas se cruzaban SIEMPRE: durante esos
   * 360 ms se veían el isotipo y, debajo, el esqueleto o la escena —que es
   * exactamente el «se ven dos loaders» que se reportó—. Y con `.vfx-cover`, que es
   * translúcido con desenfoque, el de abajo no quedaba tapado ni siquiera después.
   *
   * Se resuelve aquí, en el motor, y no pantalla por pantalla: quien monta una
   * espera nueva es quien sabe que ya no hace falta la genérica. Una pantalla que se
   * olvide de llamar a `hide()` también queda cubierta.
   */
  function relevarArranque() {
    try {
      if (window.VentelLoader && VentelLoader.retirarArranque) VentelLoader.retirarArranque();
    } catch (e) { /* sin LoaderPartial en esta pantalla no hay nada que relevar */ }
  }

  var VentelFX = {
    themes: THEMES,
    pantallas: PANTALLAS,

    /**
     * Declara qué pantalla es ésta (junto al include).  VentelFX.pagina('consola')
     * Sin argumento devuelve la clave declarada.
     */
    pagina: function (clave) {
      if (clave === undefined) return paginaActual;
      paginaActual = String(clave || '');
      return VentelFX;
    },

    /**
     * Ficha {tema, titulo, sub} de una pantalla. Sin argumento, la de la pantalla
     * actual. Es lo que permite que AppUrl.go elija escena por destino sin que
     * cada uno de los ~30 llamadores tenga que saber de temas.
     */
    para: function (page) {
      var k = String(page || paginaActual || '');
      return PANTALLAS[k] || { tema: 'camion', titulo: 'Un momento…', sub: 'Abriendo la pantalla' };
    },

    /** Tema de la pantalla actual (respaldo para el overlay de arranque). */
    temaActual: function () { return VentelFX.para().tema; },

    /**
     * Escena a pantalla completa. Devuelve el manejador; SIEMPRE hay que
     * llamar .done() al terminar (o .fail() si el backend devolvió error).
     */
    overlay: function (theme, opts) {
      opts = opts || {};
      relevarArranque();
      if (openOverlay && !openOverlay.isDone()) openOverlay.done();
      var host = D.createElement('div');
      host.className = 'vfx vfx-overlay';
      host.setAttribute('role', 'status');
      host.setAttribute('aria-live', 'polite');
      host.setAttribute('aria-label', opts.title || 'Cargando');
      D.body.appendChild(host);
      opts.__remove = function (h) { if (h.parentNode) h.parentNode.removeChild(h); };
      openOverlay = mount(host, theme, opts);
      return openOverlay;
    },

    /** Cierra la escena de pantalla completa si hay alguna abierta. */
    hideOverlay: function () { if (openOverlay) openOverlay.done(); return this; },

    /**
     * Escena dentro de un contenedor.
     *   mode 'cover' → se superpone al contenido actual (recargas)
     *   mode 'fill'  → ocupa el hueco vacío (primera carga)
     *   mode 'auto'  → decide según la altura del contenedor
     */
    section: function (target, theme, opts) {
      opts = opts || {};
      relevarArranque();
      var el = resolve(target);
      if (!el) return mountNoop();
      var mode = opts.mode || 'auto';
      if (mode === 'auto') mode = (el.offsetHeight > 120 && el.children.length) ? 'cover' : 'fill';

      var host = D.createElement('div');
      host.className = 'vfx ' + (mode === 'cover' ? 'vfx-cover' : 'vfx-fill');
      host.setAttribute('role', 'status');
      host.setAttribute('aria-live', 'polite');
      if (opts.minHeight) host.style.setProperty('--vfx-min', opts.minHeight);

      var scrollPrev = null, overflowPrev = null;
      if (mode === 'cover') {
        var cs = window.getComputedStyle(el);
        if (cs.position === 'static') { el.classList.add('vfx-host'); host.dataset.unhost = '1'; }
        // Contenedor con scroll propio (cuerpo de modal, panel largo): una capa
        // `absolute; inset:0` se dimensiona contra el CONTENIDO, no contra lo que
        // se ve, así que la escena quedaba centrada a mitad del contenido —fuera
        // de pantalla— y el formulario seguía a la vista y pulsable. Congelando el
        // scroll arriba, la caja de posicionamiento pasa a ser el recuadro visible
        // y la escena cae donde el usuario está mirando. Se restaura al cerrar.
        var conScroll = el.scrollHeight > el.clientHeight + 4 &&
                        /auto|scroll|overlay/.test(cs.overflowY + ' ' + cs.overflow);
        if (conScroll) {
          scrollPrev = el.scrollTop;
          overflowPrev = el.style.overflow;
          el.scrollTop = 0;
          el.style.overflow = 'hidden';
        }
      }
      el.appendChild(host);
      // El anfitrión se guarda en una variable, no se busca por h.parentNode: si
      // la pantalla repinta el contenedor con innerHTML, la escena se queda
      // huérfana y `.vfx-host` (position:relative) se quedaría pegada al
      // contenedor para siempre, descolocando lo que se posicione dentro.
      var anfitrion = el;
      opts.__remove = function (h) {
        if (h.dataset.unhost) anfitrion.classList.remove('vfx-host');
        if (overflowPrev !== null) {
          anfitrion.style.overflow = overflowPrev;
          anfitrion.scrollTop = scrollPrev;
        }
        if (h.parentNode) h.parentNode.removeChild(h);
      };
      if (opts.compact === undefined) opts.compact = true;
      if (opts.width === undefined) opts.width = Math.min(SCENES[pickTheme(theme)].w, 190);
      return mount(host, theme, opts);
    },

    /** Alias corto: VentelFX.at('#tabla','percha') */
    at: function (target, theme, opts) { return this.section(target, theme, opts); },

    /**
     * Esqueleto con brillo. Para listas y tablas es mejor que una escena:
     * dibuja la forma de lo que va a llegar, así que la página no da un salto
     * cuando el contenido aterriza.
     *   kind: 'tabla' | 'tarjetas' | 'lista' | 'formulario' | 'kpis'
     */
    skeleton: function (target, kind, opts) {
      opts = opts || {};
      relevarArranque();
      var el = resolve(target);
      if (!el) return mountNoop();
      var n = opts.rows || 6;
      var wrap = D.createElement('div');
      wrap.className = 'vfx vfx-sk';
      var html = '', i;
      function bar(w, h, r) { return '<span class="vfx-sk-b" style="width:' + w + ';height:' + (h || '.85rem') + (r ? ';border-radius:' + r : '') + '"></span>'; }
      if (kind === 'tarjetas') {
        wrap.classList.add('vfx-sk-grid');
        for (i = 0; i < (opts.rows || 6); i++) {
          html += '<div class="vfx-sk-card">' + bar('62%', '1rem') + bar('100%', '.7rem') + bar('84%', '.7rem') +
                  '<div class="vfx-sk-row" style="margin-top:.4rem">' + bar('4.5rem', '1.7rem', '999px') + bar('3.5rem', '1.7rem', '999px') + '</div></div>';
        }
      } else if (kind === 'kpis') {
        wrap.classList.add('vfx-sk-grid');
        for (i = 0; i < (opts.rows || 4); i++) {
          html += '<div class="vfx-sk-card">' + bar('45%', '.7rem') + bar('70%', '1.7rem') + bar('55%', '.65rem') + '</div>';
        }
      } else if (kind === 'formulario') {
        for (i = 0; i < n; i++) html += '<div>' + bar('28%', '.7rem') + '<div style="height:.4rem"></div>' + bar('100%', '2.4rem', 'var(--rad,12px)') + '</div>';
      } else if (kind === 'lista') {
        for (i = 0; i < n; i++) {
          html += '<div class="vfx-sk-row">' + bar('2.4rem', '2.4rem', '50%') +
                  '<div style="flex:1;display:flex;flex-direction:column;gap:.4rem">' + bar((55 + (i % 4) * 10) + '%', '.8rem') + bar((30 + (i % 3) * 12) + '%', '.65rem') + '</div></div>';
        }
      } else { // tabla
        var cols = opts.cols || 5;
        var row = function (h, op) {
          var s = '<div class="vfx-sk-row"' + (op ? ' style="opacity:' + op + '"' : '') + '>';
          for (var c = 0; c < cols; c++) s += bar(c === 0 ? '22%' : (c === cols - 1 ? '10%' : '16%'), h);
          return s + '</div>';
        };
        html += row('.9rem');
        for (i = 0; i < n; i++) html += row('.75rem', (1 - i * 0.09).toFixed(2));
      }
      wrap.innerHTML = html;
      el.appendChild(wrap);

      var ended = false;
      // Mismo tope de seguridad que las escenas. Un esqueleto olvidado no tapa la
      // pantalla, pero deja la sección con cajas grises que se leen como «esto
      // está cargando» para siempre, que es peor que un hueco vacío honesto.
      var tope = setTimeout(function () { api.done(); }, opts.maxMs || 45000);
      var api = {
        el: wrap,
        done: function (cb) {
          if (ended) { if (cb) cb(); return api; }
          ended = true;
          clearTimeout(tope);
          var rm = function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); if (cb) cb(); };
          if (animOK()) G().to(wrap, { opacity: 0, duration: .25, ease: 'power1.in', onComplete: rm });
          else rm();
          return api;
        },
        fail: function () { return api.done(); },
        text: function () { return api; },
        title: function () { return api; },
        isDone: function () { return ended; }
      };
      return api;
    },

    /**
     * Botón ocupado: chip girando + texto temporal. Devuelve el manejador que
     * lo restaura. Evita el doble clic sin tener que tocar `disabled` a mano.
     *
     * OJO: sustituye el innerHTML del botón y lo repone tal cual al terminar, así
     * que cualquier oyente atado a un HIJO del botón (no al botón) se pierde. Si
     * el botón lleva un icono con su propio listener, ata el listener al botón.
     */
    button: function (btn, label, opts) {
      opts = opts || {};
      var el = resolve(btn);
      if (!el) return mountNoop();
      if (el.dataset.vfxBusy === '1') return mountNoop();
      var prevHTML = el.innerHTML, prevDisabled = el.disabled;
      // `vfx` solo se retira si la puso este manejador: si el botón ya la traía
      // de fábrica, quitarla al terminar le cambiaría la tipografía para siempre.
      var puseVfx = !el.classList.contains('vfx');
      el.dataset.vfxBusy = '1';
      el.classList.add('vfx-btn-busy');
      if (puseVfx) el.classList.add('vfx');
      el.disabled = true;
      el.innerHTML = '<span class="vfx-chip">' + VentelFX.chip() + '<span>' + (label || 'Procesando…') + '</span></span>';
      var ended = false;
      // Tope de seguridad: un botón que se queda «Enviando…» para siempre es una
      // acción que el usuario ya no puede repetir ni abandonar.
      var tope = setTimeout(function () { api.done(); }, opts.maxMs || 45000);
      var api = {
        el: el,
        done: function (cb) {
          if (ended) { if (cb) cb(); return api; }
          ended = true;
          clearTimeout(tope);
          el.innerHTML = prevHTML;
          el.disabled = prevDisabled;
          el.classList.remove('vfx-btn-busy');
          if (puseVfx) el.classList.remove('vfx');
          delete el.dataset.vfxBusy;
          if (animOK()) G().fromTo(el, { scale: .97 }, { scale: 1, duration: .3, ease: 'back.out(3)', clearProps: 'transform' });
          if (cb) cb();
          return api;
        },
        fail: function () { return api.done(); },
        text: function (t) { var s = el.querySelector('.vfx-chip span'); if (s) s.textContent = t; return api; },
        title: function () { return api; },
        isDone: function () { return ended; }
      };
      return api;
    },

    /**
     * Hueco con brillo mientras baja una imagen remota (logos de tienda, fotos
     * de artículo, evidencias). Se retira en `load` Y en `error`: una imagen rota
     * dejaba el brillo latiendo para siempre, que se lee como «sigue cargando».
     *
     *   VentelFX.image(img)                      → sobre la propia <img>
     *   VentelFX.image(img, {wrap: contenedor})  → el brillo va en el contenedor
     *
     * Si la imagen ya está en caché del navegador (complete && naturalWidth) no
     * se monta nada: un parpadeo de 16 ms es peor que no poner nada.
     */
    image: function (img, opts) {
      opts = opts || {};
      var el = resolve(img);
      if (!el) return mountNoop();
      if (el.complete && el.naturalWidth > 0) return mountNoop();
      var host = resolve(opts.wrap) || el.parentElement || el;
      // El brillo va en una CAPA APARTE, no en clases sobre el contenedor del
      // sitio: poner overflow/background al padre para animar una foto es la
      // clase de cambio que recorta un menú o borra un fondo tres pantallas más
      // allá. Aquí solo se añade `position:relative` si el padre era estático.
      var capa = D.createElement('span');
      capa.className = 'vfx vfx-imgfx';
      capa.setAttribute('aria-hidden', 'true');
      var estatico = window.getComputedStyle(host).position === 'static';
      if (estatico) host.classList.add('vfx-imgwrap');
      host.appendChild(capa);
      var ended = false;
      var quitar = function () {
        if (ended) return;
        ended = true;
        if (capa.parentNode) capa.parentNode.removeChild(capa);
        if (estatico) host.classList.remove('vfx-imgwrap');
        el.removeEventListener('load', quitar);
        el.removeEventListener('error', quitar);
        if (animOK() && el.naturalWidth > 0) {
          G().fromTo(el, { opacity: 0 }, { opacity: 1, duration: .35, ease: 'power2.out', clearProps: 'opacity' });
        }
      };
      el.addEventListener('load', quitar);
      el.addEventListener('error', quitar);
      // Tope: si la petición se queda colgada, el brillo no se eterniza.
      setTimeout(quitar, opts.maxMs || 20000);
      var api = {
        el: host,
        done: function (cb) { quitar(); if (cb) cb(); return api; },
        fail: function () { quitar(); return api; },
        text: function () { return api; },
        title: function () { return api; },
        isDone: function () { return ended; }
      };
      return api;
    },

    /**
     * Loader dentro de una pestaña recién abierta con window.open(). Sin esto,
     * abrir una cotización en Google Sheets deja al asesor mirando una pestaña
     * EN BLANCO entre 3 y 15 s, que es donde más gente cree que se rompió algo.
     * La pestaña se sustituye sola cuando el destino termina de cargar.
     */
    tab: function (win, opts) {
      opts = opts || {};
      if (!win || !win.document) return mountNoop();
      var titulo = opts.title || 'Abriendo…';
      var sub = opts.sub || 'Preparando el documento en Google Sheets';
      try {
        win.document.open();
        win.document.write(
          '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
          '<title>' + titulo + '</title><style>' +
          'html,body{height:100%;margin:0}' +
          'body{display:flex;align-items:center;justify-content:center;background:#F7F9FB;' +
          "font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1B2330}" +
          '.b{text-align:center;padding:2rem}' +
          '.r{width:54px;height:54px;margin:0 auto 1.1rem;border-radius:50%;' +
          'border:5px solid #E4E9F0;border-top-color:#E10098;animation:s .9s linear infinite}' +
          '@keyframes s{to{transform:rotate(360deg)}}' +
          'h1{font-size:1rem;font-weight:600;margin:0}' +
          'p{font-size:.85rem;color:#5C6B7E;margin:.4rem 0 0}' +
          '@media (prefers-reduced-motion:reduce){.r{animation:none}}' +
          '</style></head><body><div class="b"><div class="r"></div>' +
          '<h1>' + titulo + '</h1><p>' + sub + '</p></div></body></html>');
        win.document.close();
      } catch (e) { return mountNoop(); }
      var ended = false;
      var api = {
        el: null,
        /** Manda la pestaña al destino real. */
        done: function (cb) {
          if (ended) { if (cb) cb(); return api; }
          ended = true;
          if (opts.url) { try { win.location.href = opts.url; } catch (e) {} }
          if (cb) cb();
          return api;
        },
        /** Escribe el error EN la pestaña: cerrarla sin más parece un fallo del navegador. */
        fail: function (msg) {
          if (ended) return api;
          ended = true;
          try {
            var b = win.document.querySelector('.b');
            if (b) b.innerHTML = '<h1>No se pudo abrir</h1><p>' +
              String(msg || 'Vuelve a intentarlo desde el Portal.') + '</p>';
          } catch (e) {}
          return api;
        },
        text: function () { return api; },
        title: function () { return api; },
        isDone: function () { return ended; }
      };
      return api;
    },

    /** Marcado del chip giratorio (para inyectar en cualquier texto). */
    chip: function (size) {
      return '<svg data-chipspin viewBox="0 0 24 24" style="width:' + (size || '1.05em') + ';height:' + (size || '1.05em') + '" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="9" fill="none" stroke="var(--vfx-line,#E4E9F0)" stroke-width="3"/>' +
        '<path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="var(--vfx-brand,#E10098)" stroke-width="3" stroke-linecap="round"/>' +
      '</svg>';
    },

    /* AQUÍ VIVÍA `VentelFX.run`, y se ha quitado a propósito.
       Era azúcar para montar una escena alrededor de una llamada, pero entregaba el
       runner de `google.script.run` pelado al llamador (`.call(function(run){…})`),
       así que todo lo que pasara por ahí se saltaba `AppRun`: sin deduplicación, sin
       el indicador de la esquina y con su propio camino de error. No lo usaba
       ninguna pantalla —era la única puerta abierta que quedaba, y una puerta así es
       justo lo que hace que un patrón por defecto deje de serlo—.

       Lo que hacía se escribe hoy con lo que ya existe, y además deduplicado:

         var fx = VentelFX.section('#panel', 'camion', { title: '…' });
         AppRun.call('miFuncion', [param])
           .then(function (r) { fx.done(); pintar(r); },
                 function (e) { fx.fail(e && e.message ? e.message : String(e)); });

       Y si lo que se pide es un dato que se pueda enseñar antes de revalidar, la
       forma corta es `AppRun.swr(clave, 'miFuncion', [param], { fx: {…}, onData })`,
       que monta la escena solo cuando no hay copia que pintar. */
  };

  /** Manejador inerte: la API nunca devuelve null, así el llamador no comprueba. */
  function mountNoop() {
    var api = {
      el: null,
      done: function (cb) { if (cb) cb(); return api; },
      fail: function () { return api; },
      text: function () { return api; },
      title: function () { return api; },
      isDone: function () { return true; }
    };
    return api;
  }

  window.VentelFX = VentelFX;

  /* ══════════════════════════════════════════════════════════════════════════
     QUÉ TEMA USAR DÓNDE (para que la escena signifique algo y no sea adorno)

       camion     importar/refrescar bloques grandes de datos
                  · Herramientas de contenido · precarga del portal · catálogos
       caja       guardar, registrar, dar de alta
       percha     catálogo de artículos, inventario, inspector de producto
       sobre      envío de correo (cliente y VENTEL)
       escaner    buscar por folio / SKU / clave, consultar cotización
       documento  generar PDF, armar cotización, formatos, revisión
       hoja       escribir o abrir la hoja de cálculo REAL en Google Sheets
                  · documento oficial de la cotización · vista previa incrustada
                  Frente a `documento`: aquél es «se está armando un archivo»,
                  éste es «Google Sheets está trabajando ahora mismo».
       radar      consola, métricas, tableros, operación, estado
       etiqueta   promociones, precios, descuentos
       bolsa      atenciones, pedidos, pendientes
       reportes   contar y verificar cifras de un periodo
                  · historial del estado del servicio (también en el tablero
                    público, así que la escena se diseñó para gente de fuera)
                  Frente a `radar`: aquél es «se está mirando el panorama
                  ahora», éste es «se están cuadrando los números de un rango».
       asesor     esperas del módulo de Atenciones donde hay personas detrás
                  · el panorama de clientes a los que hay que devolver la llamada
                  Frente a `bolsa`: aquél cuenta lo que se junta, éste cuenta
                  quién lo va a atender.

     La regla es una sola: dos esperas del MISMO tipo usan el MISMO tema. Es lo
     que convierte las escenas en un lenguaje —«ah, viene el camión, esto tarda
     lo de siempre»— en vez de en nueve animaciones sueltas.
     ══════════════════════════════════════════════════════════════════════════ */
})();
</script>
