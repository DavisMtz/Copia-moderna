<!-- ════════════════════════════════════════════════════════════════════════════
     ESCENAS DE ESPERA · VentelFX
     ────────────────────────────────────────────────────────────────────────
     Una espera sin nada en pantalla se siente el doble de larga. Este archivo
     da una escena ANIMADA DISTINTA para cada tipo de espera del portal, de modo
     que la animación diga qué está pasando: si viene un camión, se están
     trayendo datos; si se está escribiendo una hoja, se está generando el PDF.

     No sustituye a LoaderPartial (el isotipo Liverpool): aquel es el arranque
     de la página, éste es el trabajo intermedio.

       VentelFX.overlay('camion', {title, sub})   → tapa la pantalla
       VentelFX.section('#tabla', 'percha', {…})  → tapa una sección
       VentelFX.skeleton('#tabla', 'tabla')       → esqueleto con brillo
       VentelFX.button(btn, 'Enviando…')          → botón ocupado

     Todas devuelven un MANEJADOR con .done() / .fail(msg) / .text(msg).
     Llamar .done() es obligatorio: cada escena trae un tope de seguridad
     (maxMs) para no dejar la pantalla tapada si el backend nunca contesta.

     TEMAS (uno por familia de espera, ver tabla al final del archivo):
       camion · caja · percha · sobre · escaner · documento · hoja ·
       radar · etiqueta · bolsa · reportes · asesor

     DEGRADACIÓN: si GSAP no cargó (CDN caído) o el usuario pide menos
     movimiento, las escenas se dibujan igual pero quietas, con un pulso CSS
     mínimo. Nunca se queda una pantalla en blanco por culpa de la animación.
     ════════════════════════════════════════════════════════════════════════ -->
<style>
/* ── Variables de escena: se alimentan de los tokens del tema, con respaldo ── */
.vfx{
  --vfx-brand: var(--brand,#E10098);
  --vfx-deep: var(--brand-deep,#A8006F);
  --vfx-soft: var(--brand-soft,#FBD0E9);
  --vfx-tint: var(--brand-tint,#FDE7F4);
  --vfx-ink: var(--ink,#1B2330);
  --vfx-soft-ink: var(--ink-soft,#5C6B7E);
  --vfx-faint: var(--ink-faint,#94A1B2);
  --vfx-line: var(--line,#E4E9F0);
  --vfx-surface: var(--surface,#FFFFFF);
  --vfx-surface2: var(--surface-2,#F4F7FA);
  --vfx-orange:#EE7D00;
  --vfx-purple:#AC4581;
  /* Verde de Google Sheets. Es el ÚNICO color ajeno a la paleta de la casa que
     entra aquí, y entra por una razón concreta: en la escena `hoja` el glifo
     verde es lo que hace que se lea «Google Sheets» y no «una tabla cualquiera»,
     que es justo lo que hay que comunicar mientras se escribe el documento. */
  --vfx-sheets:#0F9D58;
  font-family: var(--f-ui, var(--f-body, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif));
}

/* ── Contenedor pantalla completa ───────────────────────────────────────── */
.vfx-overlay{
  position:fixed; inset:0; z-index:4200;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(120% 90% at 50% 34%,
    var(--vfx-surface) 0%, var(--vfx-surface2) 72%, var(--vfx-surface) 100%);
  opacity:0;
}
/* ── Contenedor de sección: tapa el bloque que está cargando ────────────── */
.vfx-cover{
  position:absolute; inset:0; z-index:40;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--vfx-surface) 78%, transparent);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  border-radius:inherit; opacity:0;
}
/* Respaldo para navegadores sin color-mix */
@supports not (background: color-mix(in srgb, red 50%, transparent)){
  .vfx-cover{ background:rgba(255,255,255,.86) }
}
.vfx-fill{ display:flex; align-items:center; justify-content:center;
  min-height:var(--vfx-min,260px); width:100%; opacity:0 }
.vfx-host{ position:relative }

/* ── Tarjeta interna (escena + textos) ──────────────────────────────────── */
.vfx-card{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:.15rem; padding:1rem 1.25rem; max-width:min(90vw,26rem);
}
.vfx-stage{ width:var(--vfx-w,224px); max-width:78vw; line-height:0 }
.vfx-stage svg{ width:100%; height:auto; overflow:visible; display:block }
.vfx-title{
  margin:.55rem 0 0; font-size:1rem; font-weight:650; letter-spacing:-.01em;
  color:var(--vfx-ink);
}
.vfx-sub{
  margin:.3rem 0 0; font-size:.83rem; line-height:1.5; color:var(--vfx-soft-ink);
  min-height:1.25em;
}
.vfx-sub b{ color:var(--vfx-brand); font-weight:600 }

/* ── Barra indeterminada: avanza rápido y desacelera; nunca miente con 100% ── */
.vfx-bar{
  margin-top:.85rem; width:min(220px,60vw); height:4px; border-radius:99px;
  background:var(--vfx-line); overflow:hidden;
}
.vfx-bar > i{
  display:block; height:100%; width:0%; border-radius:99px;
  background:linear-gradient(90deg,var(--vfx-purple),var(--vfx-brand) 55%,var(--vfx-orange));
}
.vfx-compact .vfx-title{ font-size:.9rem }
.vfx-compact .vfx-sub{ font-size:.78rem }

/* ── Dato curioso (solo esperas largas) ─────────────────────────────────── */
.vfx-fact{
  margin-top:1rem; padding:.85rem 1.1rem; border-radius:14px; max-width:32rem;
  background:var(--vfx-surface); border:1px solid var(--vfx-line);
  box-shadow:var(--sh-md,0 10px 30px -18px rgba(27,35,48,.3));
  font-size:.82rem; line-height:1.55; color:var(--vfx-ink); text-align:left;
}
.vfx-fact b{ color:var(--vfx-brand); font-weight:600 }
.vfx-fact-tag{
  display:block; font-size:.64rem; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--vfx-brand); margin-bottom:.3rem;
}

/* ── Estado de error dentro de la escena ────────────────────────────────── */
.vfx-err .vfx-title{ color:var(--alert,#C81E3C) }
.vfx-err .vfx-bar > i{ background:var(--alert,#C81E3C) }
.vfx-err .vfx-stage{ opacity:.42; filter:grayscale(.75) }
.vfx-retry{
  margin-top:.9rem; font:inherit; font-size:.82rem; font-weight:600; cursor:pointer;
  padding:.5rem 1.1rem; border-radius:99px; color:var(--vfx-surface);
  background:var(--vfx-brand); border:0; box-shadow:var(--sh-sm,0 2px 8px -2px rgba(27,35,48,.18));
}
.vfx-retry:hover{ background:var(--vfx-deep) }
.vfx-retry:focus-visible{ outline:none; box-shadow:var(--ring,0 0 0 4px rgba(225,0,152,.24)) }
.vfx-retry[disabled]{ opacity:.6; cursor:default }


/* ── Chip en línea (botones, celdas, títulos) ───────────────────────────── */
.vfx-chip{ display:inline-flex; align-items:center; gap:.45rem; vertical-align:middle }
.vfx-chip svg{ width:1.05em; height:1.05em; overflow:visible }
.vfx-btn-busy{ position:relative; pointer-events:none; opacity:.82 }
/* El chip gira SOLO, con CSS. chip() devuelve marcado que se pega en cualquier
   sitio —una celda, un <option>, un título— y quien lo pega no tiene por qué
   acordarse de animarlo: un disco de carga quieto se lee como «se colgó». */
/* transform-box explícito: el valor por omisión para SVG cambió entre versiones
   de la especificación, y con `border-box` el disco giraría descentrado. */
[data-chipspin]{ transform-box:view-box; transform-origin:50% 50%;
  animation:vfx-spin .9s linear infinite }
@keyframes vfx-spin{ to{ transform:rotate(360deg) } }
@media (prefers-reduced-motion:reduce){ [data-chipspin]{ animation-duration:2.4s } }

/* ── Hueco de imagen: capa aparte, sin tocar el contenedor del sitio ────── */
.vfx-imgwrap{ position:relative }
.vfx-imgfx{
  position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;
  border-radius:inherit; background:var(--vfx-line,#E4E9F0);
}
.vfx-imgfx::after{
  content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);
  animation:vfx-shimmer 1.35s ease-in-out infinite;
}
@media (prefers-reduced-motion:reduce){ .vfx-imgfx::after{ animation:none } }

/* ── Esqueletos con brillo ──────────────────────────────────────────────── */
.vfx-sk{ display:flex; flex-direction:column; gap:.7rem; width:100% }
.vfx-sk-row{ display:flex; align-items:center; gap:.75rem }
/* display:block es obligatorio: las barras son <span> y, fuera de una fila flex
   (el esqueleto de formulario no la usa), un elemento en línea ignora width y
   height y el esqueleto salía completamente vacío. */
.vfx-sk-b{
  display:block; position:relative; overflow:hidden; border-radius:8px; flex:none;
  background:var(--vfx-line); height:.85rem;
}
.vfx-sk-b::after{
  content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,
    color-mix(in srgb, var(--vfx-surface) 85%, transparent),transparent);
  animation:vfx-shimmer 1.35s ease-in-out infinite;
}
@supports not (background: color-mix(in srgb, red 50%, transparent)){
  .vfx-sk-b::after{ background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent) }
}
@keyframes vfx-shimmer{ to{ transform:translateX(100%) } }
.vfx-sk-card{
  border:1px solid var(--vfx-line); border-radius:var(--rad-lg,14px);
  padding:1rem; display:flex; flex-direction:column; gap:.7rem;
  background:var(--vfx-surface);
}
.vfx-sk-grid{ display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)) }

/* ── Sin GSAP o con «menos movimiento»: la escena se queda quieta y respira ── */
.vfx-static .vfx-stage{ animation:vfx-breathe 2.4s ease-in-out infinite }
.vfx-static .vfx-bar > i{ width:38%; animation:vfx-slide 1.6s ease-in-out infinite }
/* Las piezas que la escena `hoja` estrena con la animación —la cabecera de marca
   y la fila de totales— nacen invisibles en el marcado. Sin GSAP nadie las sube, y
   la hoja quedaba reducida a una rejilla gris sin marca Liverpool y sin total: el
   resultado final NO estaba a la vista, que es justo lo que la degradación tiene
   que garantizar. Quietas, pero puestas. */
.vfx-static [data-cabecera], .vfx-static [data-totales]{ opacity:1 }
@keyframes vfx-breathe{ 0%,100%{opacity:.72} 50%{opacity:1} }
@keyframes vfx-slide{ 0%{transform:translateX(-100%)} 100%{transform:translateX(310%)} }
@media (prefers-reduced-motion:reduce){
  .vfx-static .vfx-stage{ animation:none; opacity:.9 }
  .vfx-sk-b::after{ animation:none }
}
</style>

<script>
(function () {
  "use strict";
  if (window.VentelFX) return;

  var D = document;
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function G() { return (typeof window.gsap !== 'undefined') ? window.gsap : null; }
  function animOK() { return !!G() && !reduced; }

  /* ─────────────────────────────────────────────────────────────────────────
     ESCENAS
     Cada tema declara: viewBox, el SVG, y build(root, gsap) que devuelve una
     línea de tiempo en bucle. Los `data-*` son los únicos ganchos entre el
     markup y la animación, así que se puede retocar el dibujo sin romperla.
     ───────────────────────────────────────────────────────────────────────── */
  var SCENES = {};

  /* ── 1 · CAMIÓN · traer/importar datos en bloque ────────────────────────
     El camión no avanza: avanza el mundo. Mover la carretera y la ciudad a
     distinta velocidad da profundidad sin mover nada pesado, y la caja se va
     llenando de bultos — que es literalmente lo que está pasando por debajo. */
  SCENES.camion = {
    w: 260, box: '0 0 260 150',
    svg: function () {
      var dashes = '', i;
      for (i = 0; i < 9; i++) dashes += '<rect x="' + (i * 34) + '" y="130" width="20" height="3.5" rx="1.75" fill="var(--vfx-line)"/>';
      // Fachadas de anchos y alturas distintas, apoyadas en la calle y con
      // ventanas. Con todas iguales y flotando sobre el suelo, el fondo parecía
      // una gráfica de barras y competía con el camión en vez de quedarse atrás.
      var city = '', cx = 0;
      var B = [[28, 44], [20, 62], [34, 34], [24, 54], [30, 72], [18, 40], [32, 58], [26, 46], [22, 66]];
      for (i = 0; i < B.length; i++) {
        var bw = B[i][0], bh = B[i][1], by = 118 - bh;
        city += '<rect x="' + cx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="2" fill="var(--vfx-line)"/>';
        for (var wy = by + 9; wy < 108; wy += 13) {
          for (var wx = cx + 6; wx < cx + bw - 5; wx += 11) {
            city += '<rect x="' + wx + '" y="' + wy + '" width="4.5" height="5.5" rx="1" fill="var(--vfx-surface)" opacity=".8"/>';
          }
        }
        cx += bw + 7;
      }
      var parcels = '';
      var PX = [50, 74, 98], PY = [64, 88];
      for (var r = 0; r < 2; r++) for (var c = 0; c < 3; c++) {
        parcels += '<g data-parcel opacity="0"><rect x="' + PX[c] + '" y="' + PY[r] + '" width="20" height="20" rx="3" fill="var(--vfx-tint)" stroke="var(--vfx-deep)" stroke-width="1.4"/>' +
                   '<path d="M' + (PX[c] + 10) + ' ' + PY[r] + 'v20" stroke="var(--vfx-deep)" stroke-width="1.4" opacity=".7"/></g>';
      }
      function wheel(cx) {
        return '<g data-wheelgrp>' +
          '<circle cx="' + cx + '" cy="118" r="14" fill="var(--vfx-ink)"/>' +
          '<circle cx="' + cx + '" cy="118" r="6.5" fill="var(--vfx-surface)"/>' +
          '<g data-wheel data-org="' + cx + ' 118">' +
            '<path d="M' + cx + ' 106v24M' + (cx - 12) + ' 118h24M' + (cx - 8.5) + ' 109.5l17 17M' + (cx + 8.5) + ' 109.5l-17 17" stroke="var(--vfx-faint)" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>' +
          '</g></g>';
      }
      // El mundo va recortado al encuadre: sin el clip, la segunda copia de la
      // ciudad asomaba por la derecha y se veía la costura del bucle.
      return '' +
      '<defs><clipPath id="vfxRoad__UID__"><rect x="0" y="0" width="260" height="132"/></clipPath></defs>' +
      '<g clip-path="url(#vfxRoad__UID__)">' +
        '<g data-city opacity=".85">' + city + '<g transform="translate(297,0)">' + city + '</g></g>' +
        '<line x1="0" y1="118" x2="260" y2="118" stroke="var(--vfx-line)" stroke-width="2"/>' +
        '<g data-dashes>' + dashes + '<g transform="translate(306,0)">' + dashes + '</g></g>' +
      '</g>' +
      '<g data-speed opacity="0">' +
        '<path d="M4 70h22M0 86h16M6 102h20" stroke="var(--vfx-brand)" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>' +
      '</g>' +
      '<g data-truck>' +
        '<rect x="34" y="52" width="96" height="56" rx="6" fill="var(--vfx-brand)"/>' +
        '<rect x="42" y="58" width="80" height="44" rx="4" fill="var(--vfx-surface)" opacity=".92"/>' +
        parcels +
        '<path d="M130 108V64h26l22 22v22Z" fill="var(--vfx-deep)"/>' +
        '<path d="M136 70h18l16 16h-34Z" fill="var(--vfx-surface)" opacity=".85"/>' +
        '<rect x="178" y="96" width="9" height="8" rx="2" fill="var(--vfx-ink)" opacity=".55"/>' +
        '<circle cx="40" cy="46" r="3" fill="var(--vfx-orange)"/>' +
        '<circle cx="52" cy="46" r="3" fill="var(--vfx-purple)"/>' +
        '<circle cx="64" cy="46" r="3" fill="var(--vfx-orange)"/>' +
        wheel(62) + wheel(158) +
      '</g>';
    },
    build: function (root, gsap) {
      var q = gsap.utils.selector(root);
      var tl = gsap.timeline({ repeat: -1 });
      // Mundo en movimiento: dos velocidades = sensación de profundidad.
      gsap.to(q('[data-dashes]'), { x: -306, duration: 1.5, ease: 'none', repeat: -1 });
      gsap.to(q('[data-city]'), { x: -297, duration: 11, ease: 'none', repeat: -1 });
      // Cada rueda gira sobre SU eje: el origen va en coordenadas del SVG
      // (svgOrigin), no en CSS — GSAP no lee transform-origin de la hoja de
      // estilos y, sin esto, ambas ruedas giraban sobre el centro de su caja.
      gsap.to(q('[data-wheel]'), { rotation: 360, duration: .85, ease: 'none', repeat: -1,
        svgOrigin: function (i, el) { return el.getAttribute('data-org'); } });
      gsap.to(q('[data-truck]'), { y: -2.2, duration: .32, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.fromTo(q('[data-speed]'), { opacity: 0, x: 14 },
        { opacity: 1, x: -10, duration: .5, ease: 'power1.in', repeat: -1, repeatDelay: .12 });
      // La carga se llena, se asienta y se vacía: el bucle cuenta un viaje.
      tl.to(q('[data-parcel]'), { opacity: 1, scale: 1, transformOrigin: '50% 50%', duration: .3,
            ease: 'back.out(2.2)', stagger: { amount: 1.1, from: 'start' } }, 0)
        .from(q('[data-parcel]'), { y: -14, duration: .3, ease: 'power2.out',
            stagger: { amount: 1.1, from: 'start' } }, 0)
        .to({}, { duration: .7 })
        .to(q('[data-parcel]'), { opacity: 0, duration: .35, ease: 'power1.in',
            stagger: { amount: .35, from: 'start' } });
      return tl;
    }
  };

  /* ── 2 · CAJA · guardar, registrar, enviar a la hoja ────────────────────
     La tapa se abre, entra lo que se está guardando y se cierra. El «clac» de
     la tapa al cerrar es lo que hace que se lea como guardado y no como adorno. */
  SCENES.caja = {
    w: 190, box: '0 0 190 158',
    svg: function () {
      var items =
        '<g data-item opacity="0"><rect x="66" y="52" width="22" height="22" rx="4" fill="var(--vfx-orange)"/></g>' +
        '<g data-item opacity="0"><circle cx="95" cy="60" r="11" fill="var(--vfx-purple)"/></g>' +
        '<g data-item opacity="0"><path d="M104 52h22l-5 22h-12Z" rx="3" fill="var(--vfx-brand)"/></g>';
      return '' +
      '<ellipse cx="95" cy="142" rx="52" ry="7" fill="var(--vfx-ink)" opacity=".08" data-shadow/>' +
      items +
      '<g data-box>' +
        '<path d="M48 84h94v50a6 6 0 0 1-6 6H54a6 6 0 0 1-6-6Z" fill="var(--vfx-brand)"/>' +
        '<rect x="88" y="84" width="14" height="56" fill="var(--vfx-surface)" opacity=".9"/>' +
      '</g>' +
      '<g data-lid>' +
        '<rect x="42" y="66" width="106" height="20" rx="5" fill="var(--vfx-deep)"/>' +
        '<rect x="88" y="66" width="14" height="20" fill="var(--vfx-surface)" opacity=".9"/>' +
        '<path d="M95 66c-9-14-26-10-22 0M95 66c9-14 26-10 22 0" fill="none" stroke="var(--vfx-deep)" stroke-width="4.5" stroke-linecap="round"/>' +
        '<circle cx="95" cy="64" r="5" fill="var(--vfx-surface)" stroke="var(--vfx-deep)" stroke-width="3"/>' +
      '</g>' +
      '<g data-spark opacity="0">' +
        '<path d="M32 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="var(--vfx-orange)"/>' +
        '<path d="M158 48l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5Z" fill="var(--vfx-purple)"/>' +
        '<path d="M150 104l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="var(--vfx-brand)"/>' +
      '</g>';
    },
    build: function (root, gsap) {
      var q = gsap.utils.selector(root);
      var tl = gsap.timeline({ repeat: -1, defaults: { ease: 'power2.out' } });
      // La tapa bascula desde su esquina izquierda, como una bisagra.
      tl.to(q('[data-lid]'), { y: -26, rotation: -9, svgOrigin: '48 86', duration: .45 }, 0)
        .to(q('[data-spark]'), { opacity: 1, duration: .3 }, .1)
        .fromTo(q('[data-item]'), { opacity: 0, y: 26, scale: .6 },
          { opacity: 1, y: -10, scale: 1, duration: .5,
            ease: 'back.out(2)', stagger: .12 }, .2)
        .to(q('[data-item]'), { y: 16, opacity: 0, duration: .4, ease: 'power2.in', stagger: .08 }, 1.1)
        .to(q('[data-lid]'), { y: 0, rotation: 0, svgOrigin: '48 86', duration: .32, ease: 'power3.in' }, 1.5)
        .to(q('[data-box]'), { scaleY: .93, svgOrigin: '95 140', duration: .1, yoyo: true, repeat: 1 }, 1.82)
        .to(q('[data-shadow]'), { scaleX: 1.1, opacity: .14, svgOrigin: '95 142', duration: .1, yoyo: true, repeat: 1 }, 1.82)
        .to(q('[data-spark]'), { opacity: 0, duration: .3 }, 1.7)
        .to({}, { duration: .45 });
      return tl;
    }
  };

  /* ── 3 · PERCHA · catálogo, artículos, inventario ───────────────────────
     Cinco perchas balanceándose con un desfase mínimo. El desfase es lo único
     que hay que acertar: iguales parecen un GIF, demasiado sueltas parecen un
     error. Un `amount` corto reparte la ola por todo el riel. */
  SCENES.percha = {
    w: 260, box: '0 0 280 152',
    svg: function () {
      // Cuatro perchas, no cinco: con cinco las prendas se tocaban y el riel
      // se leía como una mancha. El aire entre prendas es lo que deja ver que
      // cada una se mueve por su cuenta.
      var s = '', xs = [56, 112, 168, 224];
      var tone = ['var(--vfx-brand)', 'var(--vfx-purple)', 'var(--vfx-orange)', 'var(--vfx-brand)'];
      for (var i = 0; i < xs.length; i++) {
        var x = xs[i];
        // data-org guarda el punto del riel del que cuelga esta percha; la
        // animación lo usa como eje de giro (ver build).
        s += '<g data-hanger data-org="' + x + ' 30">' +
          '<path d="M' + x + ' 46V34c0-6 7-6 7-10a3.6 3.6 0 0 0-7.2 0" fill="none" stroke="var(--vfx-faint)" stroke-width="2.6" stroke-linecap="round"/>' +
          '<path d="M' + (x - 21) + ' 62 ' + x + ' 46 ' + (x + 21) + ' 62Z" fill="none" stroke="var(--vfx-faint)" stroke-width="2.6" stroke-linejoin="round"/>' +
          '<path d="M' + (x - 10) + ' 60h20l12 11-6 8-5-4v33h-22V75l-5 4-6-8Z" fill="' + tone[i] + '" opacity="' + (i % 2 ? '.88' : '1') + '"/>' +
          '<path d="M' + (x - 6) + ' 60h12l-6 8Z" fill="var(--vfx-surface)" opacity=".6"/>' +

      '<line x1="14" y1="30" x2="266" y2="30" stroke="var(--vfx-line)" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M26 30V12M254 30V12" stroke="var(--vfx-line)" stroke-width="4" stroke-linecap="round"/>' +
      '<rect data-shine x="-44" y="26" width="44" height="8" rx="4" fill="var(--vfx-surface)" opacity=".9"/>' +

    },
    build: function (root, gsap) {

        { rotation: 6.5, duration: 1.05, ease: 'sine.inOut', yoyo: true, repeat: -1,

  /* ── 4 · SOBRE · envío de correo ────────────────────────────────────────
     La solapa se abre con scaleY de 1 a -1: al pasar por 0 el triángulo se ve
     de canto, que es exactamente cómo se dobla el papel. No hace falta morphing
     para esto, y así la escena funciona aunque MorphSVG no haya cargado. */
  SCENES.sobre = {
    w: 210, box: '0 0 210 150',
    svg: function () {
      return '' +
      '<g data-trail opacity="0">' +
        '<circle cx="150" cy="52" r="3.5" fill="var(--vfx-brand)"/>' +
        '<circle cx="166" cy="40" r="2.6" fill="var(--vfx-purple)"/>' +
        '<circle cx="180" cy="30" r="1.9" fill="var(--vfx-orange)"/>' +
      '</g>' +
      '<g data-fly>' +
        '<g data-letter>' +
          '<rect x="72" y="34" width="66" height="52" rx="4" fill="var(--vfx-surface)" stroke="var(--vfx-line)" stroke-width="2"/>' +
          '<rect x="82" y="46" width="46" height="4.5" rx="2.25" fill="var(--vfx-brand)"/>' +
          '<rect x="82" y="57" width="36" height="4" rx="2" fill="var(--vfx-line)"/>' +
          '<rect x="82" y="66" width="42" height="4" rx="2" fill="var(--vfx-line)"/>' +
          '<rect x="82" y="75" width="24" height="4" rx="2" fill="var(--vfx-line)"/>' +
        '</g>' +
        '<path d="M56 70h98v54a6 6 0 0 1-6 6H62a6 6 0 0 1-6-6Z" fill="var(--vfx-brand)"/>' +
        '<path d="M56 130 105 96l49 34Z" fill="var(--vfx-deep)" opacity=".92"/>' +
        '<path d="M56 70 105 104 154 70Z" fill="var(--vfx-deep)"/>' +
        '<g data-flap>' +
          '<path d="M56 70 105 104 154 70Z" fill="var(--vfx-brand)" stroke="var(--vfx-deep)" stroke-width="1.5" stroke-linejoin="round"/>' +

    build: function (root, gsap) {

      var tl = gsap.timeline({ repeat: -1, defaults: { ease: 'power2.inOut' } });
      gsap.set(q('[data-letter]'), { y: 34, opacity: 0 });
      // La solapa se voltea sobre su borde superior (y=70). Al pasar scaleY por
      // 0 el triángulo se ve de canto: es exactamente cómo se dobla el papel.
      tl.to(q('[data-flap]'), { scaleY: -1, svgOrigin: '105 70', duration: .5 }, 0)
        .to(q('[data-letter]'), { y: 0, opacity: 1, duration: .5, ease: 'power2.out' }, .3)
        .to({}, { duration: .35 })
        .to(q('[data-fly]'), { x: 46, y: -58, scale: .58, rotation: -12,
          svgOrigin: '105 96', opacity: 0, duration: .75, ease: 'power2.in' }, 1.2)
        .fromTo(q('[data-trail] circle'), { opacity: 0, scale: .3 },
          { opacity: 1, scale: 1, duration: .3, stagger: .1 }, 1.35)
        .to(q('[data-trail] circle'), { opacity: 0, duration: .3, stagger: .06 }, 1.85)
        // El sobre vuelve a entrar en cuanto el rastro se apaga: dejarlo un
        // segundo entero con el escenario vacío parecía que se había colgado.
        .set(q('[data-flap]'), { scaleY: 1 }, 1.95)
        .set(q('[data-letter]'), { y: 34, opacity: 0 }, 1.95)
        // immediateRender:false es obligatorio aquí. Un fromTo aplica su estado
        // INICIAL en cuanto se construye la línea de tiempo, no cuando le toca:
        // sin esto el sobre nacía con opacity 0 y solo se veía medio segundo de
        // cada bucle — el escenario pasaba vacío el 80% del tiempo.
        .fromTo(q('[data-fly]'), { x: -18, y: 26, scale: .9, rotation: 0, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: .42, ease: 'power2.out',
            immediateRender: false }, 1.95)
        .to({}, { duration: .3 });
      return tl;
    }
  };

  /* ── 5 · ESCÁNER · buscar folio, SKU, artículo ──────────────────────────
     Las barras se encienden AL PASO de la línea, no todas a la vez: el barrido
     y el relleno comparten duración y desfase, así que la luz «lee» el código. */
  SCENES.escaner = {
    w: 230, box: '0 0 230 140',
    svg: function () {
      var bars = '', x = 34, W = [3, 6, 2, 4, 8, 3, 2, 6, 4, 3, 7, 2, 5, 3, 6, 2, 4, 7];

      '<g data-frame stroke="var(--vfx-brand)" stroke-width="3" stroke-linecap="round" fill="none">' +

      '<g data-scan>' +
        '<rect x="24" y="-8" width="182" height="16" rx="8" fill="var(--vfx-brand)" opacity=".18"/>' +
        '<rect x="24" y="-1.5" width="182" height="3" rx="1.5" fill="var(--vfx-brand)"/>' +

    build: function (root, gsap) {

      gsap.set(q('[data-scan]'), { y: 34 });
      gsap.to(q('[data-frame]'), { opacity: .45, duration: .9, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      tl.to(q('[data-scan]'), { y: 96, duration: 1.1, ease: 'sine.inOut' }, 0)
        .to(bars, { fill: 'var(--vfx-brand)', duration: .18, stagger: { amount: 1.0, from: 'start' } }, 0.02)
        .fromTo(q('[data-read]'), { opacity: 0, scaleX: .2 },
          { opacity: 1, scaleX: 1, svgOrigin: '60 123', duration: .35, ease: 'power2.out' }, 1.0)
        .to({}, { duration: .3 })
        .to(q('[data-scan]'), { y: 34, duration: .95, ease: 'sine.inOut' }, 1.7)
        .to(bars, { fill: 'var(--vfx-faint)', duration: .18, stagger: { amount: .85, from: 'end' } }, 1.72)
        .to(q('[data-read]'), { opacity: 0, duration: .3 }, 1.72)

  /* ── 6 · DOCUMENTO · generar PDF, armar la cotización, formatos ─────────
     Las líneas se escriben con scaleX desde la izquierda y el sello cae al
     final. El sello es el remate: sin él la escena no termina, solo se repite. */
  SCENES.documento = {
    w: 180, box: '0 0 180 158',
    svg: function () {
      var lines = '', W = [70, 58, 66, 44, 62, 36], y = 60;
      for (var i = 0; i < W.length; i++) {
        lines += '<rect data-line x="46" y="' + y + '" width="' + W[i] + '" height="5" rx="2.5" fill="var(--vfx-line)"/>';
        y += 12;
      }
      return '' +
      '<path d="M30 16h84l32 32v96a6 6 0 0 1-6 6H36a6 6 0 0 1-6-6Z" fill="var(--vfx-surface)" stroke="var(--vfx-line)" stroke-width="2.4"/>' +
      '<path d="M114 16l32 32h-32Z" fill="var(--vfx-line)"/>' +
      '<rect x="46" y="36" width="46" height="8" rx="4" fill="var(--vfx-brand)"/>' +
      lines +
      '<circle data-nib r="3.2" cx="46" cy="60" fill="var(--vfx-orange)" opacity="0"/>' +
      '<g data-stamp opacity="0">' +
        '<circle cx="120" cy="120" r="21" fill="none" stroke="var(--vfx-deep)" stroke-width="3.4" opacity=".9"/>' +
        '<circle cx="120" cy="120" r="15" fill="none" stroke="var(--vfx-deep)" stroke-width="1.6" opacity=".55"/>' +
        '<path d="M112 120l6 6 11-12" fill="none" stroke="var(--vfx-deep)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</g>';
    },
    build: function (root, gsap) {
      var q = gsap.utils.selector(root);
      var lines = q('[data-line]');
      var tl = gsap.timeline({ repeat: -1 });
      // Las líneas se escriben de izquierda a derecha: el origen en x=46 es el
      // margen del documento, así que crecen desde el margen y no desde el centro.
      gsap.set(lines, { scaleX: 0, svgOrigin: '46 0' });
      tl.to(q('[data-nib]'), { opacity: 1, duration: .15 }, 0)
        .to(lines, { scaleX: 1, svgOrigin: '46 0', duration: .34, ease: 'power1.out', stagger: .16 }, 0)
        .to(q('[data-line]'), { fill: 'var(--vfx-faint)', duration: .3, stagger: .16 }, 0);
      // La punta recorre cada renglón mientras se escribe y salta al siguiente:
      // es lo que ata la escena: sin ella las líneas simplemente aparecían.
      lines.forEach(function (ln, i) {
        var w = parseFloat(ln.getAttribute('width'));
        tl.fromTo(q('[data-nib]'), { x: 0, y: i * 12 },
          { x: w, y: i * 12, duration: .34, ease: 'power1.out' }, i * .16);
      });
      tl.to(q('[data-nib]'), { opacity: 0, duration: .2 }, 1.15)
        .fromTo(q('[data-stamp]'), { opacity: 0, scale: 1.9, rotation: -34 },
          { opacity: 1, scale: 1, rotation: -11, svgOrigin: '120 120', duration: .42, ease: 'back.out(2.4)' }, 1.2)
        .to({}, { duration: .7 })
        .to([q('[data-stamp]'), lines], { opacity: 0, duration: .32, ease: 'power1.in' })
        .set(lines, { scaleX: 0, opacity: 1, fill: 'var(--vfx-line)' })
        .to({}, { duration: .2 });
      return tl;
    }
  };

  /* ── 6b · HOJA · la hoja de cálculo oficial escribiéndose sola ──────────
     Hermana de `documento`, para una espera distinta y muy concreta: la que
     ocurre mientras GOOGLE SHEETS escribe el documento de verdad.

     `documento` dibuja una hoja de papel con un sello: sirve para «se está
     armando un PDF». Aquí lo que pasa al otro lado es otra cosa —se está
     rellenando una hoja de cálculo, celda por celda, con la plantilla del
     formato— y la escena lo cuenta literalmente: la ventana de Sheets, la
     cabecera de marca Liverpool que lleva el formato, y las filas llenándose
     de izquierda a derecha con el cursor por delante. El asesor reconoce lo
     que ve porque es exactamente lo que abrirá después.

     Tres detalles que hacen que se lea como una hoja de cálculo y no como una
     tabla decorativa:
       · Las celdas de texto crecen desde el margen IZQUIERDO y las de importe
         desde el DERECHO, que es como se alinean los números de verdad.
       · La banda de fila resaltada va por delante del cursor: primero se
         «selecciona» la fila, después se escribe.
       · La fila de totales llega al final, con su línea superior y el importe
         en rosa de marca: es el remate que cierra el bucle. Sin él la escena
         se repetiría sin haber terminado nada. */
  SCENES.hoja = {
    w: 244, box: '0 0 244 172',
    svg: function () {
      // ── Geometría de la rejilla. Todo lo demás se deriva de aquí, así que
      //    mover una columna no obliga a recalcular la animación a mano.
      var X0 = 30, ANCHOS = [66, 30, 32, 32, 36];
      var vx = [X0], i, j;
      for (i = 0; i < ANCHOS.length; i++) vx.push(vx[i] + ANCHOS[i]);   // 30…226
      var XF = vx[vx.length - 1];
      var YH = 46, HH = 12;              // banda de letras de columna
      var YM = 58, HM = 18;              // fila de marca (la cabecera del formato)
      var YD = 76, HD = 15, NF = 4;      // filas de producto
      var YT = YD + HD * NF, HT = 17;    // fila de totales
      var YE = YT + HT;                  // pie de la ventana

      /* El isotipo se pide prestado a LoaderPartial en vez de volver a pegar los
         4 KB del trazado. Va envuelto en un <g> propio para que la animación
         pueda mover el de fuera sin pisar la transformación que encuadra el
         dibujo. Si esta pantalla no incluye LoaderPartial, cae a un cuadro de
         marca: la escena no depende del isotipo para tener sentido. */
      function isotipo(x, y, s) {
        var M = window.VentelLoader && window.VentelLoader.marca;
        if (!M || !M.islas || !M.islas.length) {
          return '<g data-marca><rect x="' + x + '" y="' + y + '" width="' + s +
                 '" height="' + s + '" rx="3.5" fill="var(--vfx-brand)"/></g>';
        }
        var k = s / 290, p = '';
        for (var n = 0; n < M.islas.length; n++) {
          p += '<path d="' + M.islas[n] + '" fill="' + M.colorIsla(n) + '"/>';
        }
        return '<g data-marca><g transform="translate(' + (x - 142.3 * k).toFixed(2) + ' ' +
               (y - 69.75 * k).toFixed(2) + ') scale(' + k.toFixed(5) + ')">' + p + '</g></g>';
      }

      // ── Rejilla: los filetes son lo que convierte cinco barras sueltas en
      //    una hoja de cálculo. Van por debajo del contenido y no se animan.
      var rejilla = '';
      for (i = 0; i < vx.length; i++) {
        rejilla += '<path d="M' + vx[i] + ' ' + YH + 'V' + YE + '" stroke="var(--vfx-line)" stroke-width="1"/>';
      }
      var ys = [YH, YM, YD, YD + HD, YD + HD * 2, YD + HD * 3, YT, YE];
      for (i = 0; i < ys.length; i++) {
        rejilla += '<path d="M18 ' + ys[i] + 'H' + XF + '" stroke="var(--vfx-line)" stroke-width="1"/>';
      }

      // ── Letras de columna y números de fila: pastillas diminutas. Con texto
      //    real se leerían borrosas a este tamaño y habría que cargar la fuente.
      var guias = '';
      for (i = 0; i < ANCHOS.length; i++) {
        guias += '<rect x="' + (vx[i] + ANCHOS[i] / 2 - 3) + '" y="' + (YH + 4) +
                 '" width="6" height="4" rx="2" fill="var(--vfx-faint)" opacity=".55"/>';
      }
      for (i = 0; i < NF + 2; i++) {
        var yr = (i === 0 ? YM + HM / 2 : (i === NF + 1 ? YT + HT / 2 : YD + HD * (i - 1) + HD / 2));
        guias += '<rect x="21" y="' + (yr - 2) + '" width="6" height="4" rx="2" fill="var(--vfx-faint)" opacity=".55"/>';
      }

      /* ── Celdas. `data-org` guarda el punto de crecimiento de cada barra: el
         borde izquierdo en la columna de descripción, el DERECHO en las de
         importe. Es el mismo truco que usan las ruedas del camión, y aquí es lo
         que hace que los números se escriban alineados a la derecha. */
      var TEXTO = [[52, 20, 22, 20, 26], [44, 18, 24, 18, 28], [58, 22, 20, 22, 24], [40, 18, 22, 20, 30]];
      var celdas = '';
      for (i = 0; i < NF; i++) {
        celdas += '<g data-fila>';
        for (j = 0; j < ANCHOS.length; j++) {
          var w = TEXTO[i][j];
          var izq = (j === 0);
          var bx = izq ? vx[j] + 4 : vx[j + 1] - 4 - w;
          var by = YD + HD * i + HD / 2 - 2.25;
          celdas += '<rect data-celda data-org="' + (izq ? bx : bx + w) + ' 0" x="' + bx + '" y="' + by +
                    '" width="' + w + '" height="4.5" rx="2.25" fill="var(--vfx-line)"/>';
        }
        celdas += '</g>';
      }

      return '' +
      /* El barrido de luz va recortado a la ventana: `.vfx-stage svg` lleva
         overflow visible (lo necesitan otras escenas), así que sin el recorte la
         banda se pasearía por fuera de la hoja, sobre el fondo de la tarjeta. */
      '<defs><clipPath id="vfxHoja__UID__">' +
        '<rect x="8" y="10" width="228" height="' + (YE + 9 - 10) + '" rx="11"/>' +
      '</clipPath></defs>' +
      // Ventana de Google Sheets
      '<rect x="8" y="10" width="228" height="' + (YE + 9 - 10) + '" rx="11" fill="var(--vfx-surface)" stroke="var(--vfx-line)" stroke-width="2"/>' +
      '<path d="M8 32h228M8 46h228" stroke="var(--vfx-line)" stroke-width="1.4"/>' +
      // Glifo de Sheets: el verde es el que dice de qué aplicación hablamos.
      '<rect x="17" y="14" width="14" height="14" rx="3.2" fill="var(--vfx-sheets)"/>' +
      '<g fill="var(--vfx-surface)">' +
        '<rect x="20" y="17.6" width="8" height="1.9" rx=".8"/>' +
        '<rect x="20" y="20.6" width="8" height="1.9" rx=".8"/>' +
        '<rect x="20" y="23.6" width="8" height="1.9" rx=".8"/>' +
      '</g>' +
      '<rect x="23.2" y="17.6" width="1.6" height="7.9" fill="var(--vfx-sheets)"/>' +
      '<rect x="38" y="18.5" width="72" height="5" rx="2.5" fill="var(--vfx-line)"/>' +
      '<rect x="196" y="17" width="28" height="9" rx="4.5" fill="var(--vfx-tint)"/>' +
      // Barra de herramientas
      '<g fill="var(--vfx-line)">' +
        '<rect x="18" y="35" width="7" height="7" rx="1.8"/><rect x="29" y="35" width="7" height="7" rx="1.8"/>' +
        '<rect x="40" y="35" width="7" height="7" rx="1.8"/><rect x="55" y="35" width="7" height="7" rx="1.8"/>' +
        '<rect x="66" y="35" width="7" height="7" rx="1.8"/><rect x="81" y="35" width="26" height="7" rx="3.5"/>' +
      '</g>' +
      '<rect x="18" y="' + YH + '" width="' + (XF - 18) + '" height="' + HH + '" fill="var(--vfx-surface2)"/>' +
      '<rect x="18" y="' + YH + '" width="12" height="' + (YE - YH) + '" fill="var(--vfx-surface2)"/>' +
      rejilla + guias +
      // Banda de fila activa: se «selecciona» la fila antes de escribirla.
      '<rect data-fila-hl x="' + X0 + '" y="' + YD + '" width="' + (XF - X0) + '" height="' + HD + '" fill="var(--vfx-brand)" opacity="0"/>' +
      // Cabecera de marca del formato: isotipo + título en rosa, como el CCL real.
      '<g data-cabecera opacity="0">' +
        isotipo(vx[0] + 5, YM + 3.5, 11.5) +
        '<rect x="' + (vx[0] + 24) + '" y="' + (YM + 6) + '" width="58" height="5" rx="2.5" fill="var(--vfx-brand)"/>' +
        '<rect x="' + (vx[0] + 24) + '" y="' + (YM + 13) + '" width="38" height="3" rx="1.5" fill="var(--vfx-faint)" opacity=".7"/>' +
        '<rect x="' + (vx[3] + 4) + '" y="' + (YM + 6) + '" width="' + (XF - vx[3] - 8) + '" height="4" rx="2" fill="var(--vfx-soft)"/>' +
      '</g>' +
      celdas +
      // Fila de totales: el remate. Línea, etiqueta e importe en rosa de marca.
      '<g data-totales opacity="0">' +
        '<rect x="' + X0 + '" y="' + YT + '" width="' + (XF - X0) + '" height="' + HT + '" fill="var(--vfx-tint)"/>' +
        '<rect data-tot-linea x="' + X0 + '" y="' + (YT - 1) + '" width="' + (XF - X0) + '" height="2" fill="var(--vfx-brand)"/>' +
        '<rect x="' + (vx[0] + 4) + '" y="' + (YT + HT / 2 - 2.5) + '" width="34" height="5" rx="2.5" fill="var(--vfx-deep)" opacity=".65"/>' +
        '<rect data-tot-valor x="' + (XF - 36) + '" y="' + (YT + HT / 2 - 3) + '" width="32" height="6" rx="3" fill="var(--vfx-brand)"/>' +
      '</g>' +
      // Cursor de escritura: va por delante de las barras, como el punto del
      // documento. Sin él las celdas simplemente aparecerían.
      '<rect data-caret x="' + (X0 + 4) + '" y="' + (YD + 3) + '" width="2" height="9" rx="1" fill="var(--vfx-brand)" opacity="0"/>' +
      /* Barrido de luz sobre el cristal, ya con la hoja escrita. En rosa de marca
         y no en blanco: la hoja YA es blanca, así que un reflejo blanco sobre
         blanco no se ve —costó un par de capturas darse cuenta— y además el
         rosa remata el bucle con el color de la casa. */
      /* El recorte va en un grupo APARTE del que se anima. Un `clip-path` se
         interpreta en el espacio de coordenadas del elemento que lo lleva, así
         que si se pone en el mismo grupo que GSAP traslada, el recorte viaja con
         la banda y solo deja pasar una rendija: el barrido parecía no existir. */
      '<g clip-path="url(#vfxHoja__UID__)">' +
        '<g data-brillo opacity="0">' +
          '<rect x="-38" y="-14" width="34" height="200" fill="var(--vfx-brand)" opacity=".14" transform="rotate(14 0 86)"/>' +
          '<rect x="-18" y="-14" width="10" height="200" fill="var(--vfx-brand)" opacity=".26" transform="rotate(14 0 86)"/>' +
        '</g>' +
      '</g>';
    },
    build: function (root, gsap) {
      var q = gsap.utils.selector(root);
      var filas = q('[data-fila]');
      var todas = q('[data-celda]');
      var org = function (i, el) { return el.getAttribute('data-org'); };
      var HD = 15, INICIO = .5, PASO = .46;

      /* Los orígenes de escalado se declaran TODOS aquí, antes de construir la
         línea de tiempo, y ningún tween vuelve a tocarlos.

         El motivo cuesta una tarde encontrarlo: GSAP compensa con una traslación
         cuando el origen de un elemento CAMBIA teniendo ya una transformación
         encima (`smoothOrigin`, que existe para que no dé un salto). Si el origen
         se estrena dentro del propio tween, esa compensación se cuela en la
         animación —el importe del total salía disparado al otro extremo de la
         hoja— y además solo se nota mientras la escala va por el medio, así que
         en el fotograma final todo parece correcto. Declarados antes, los tweens
         ya no cambian ningún origen: solo escalan.

         El isotipo pivota sobre SU centro dentro de la celda, no sobre el de su
         caja de dibujo; en SVG eso hay que decirlo en coordenadas del lienzo. */
      gsap.set(todas, { scaleX: 0, svgOrigin: org });
      gsap.set(q('[data-tot-linea]'), { scaleX: 0, svgOrigin: '30 0' });
      gsap.set(q('[data-tot-valor]'), { scaleX: .25, svgOrigin: '222 0' });
      gsap.set(q('[data-marca]'), { scale: .5, opacity: 0, svgOrigin: '40.75 67.25' });

      var tl = gsap.timeline({ repeat: -1 });
      tl.fromTo(q('[data-cabecera]'), { opacity: 0, y: -6 },
            { opacity: 1, y: 0, duration: .34, ease: 'power2.out' }, 0)
        .to(q('[data-marca]'), { scale: 1, opacity: 1, duration: .5, ease: 'back.out(2.6)' }, .06)
        .to(q('[data-caret]'), { opacity: 1, duration: .16 }, INICIO - .1);

      filas.forEach(function (fila, i) {
        var at = INICIO + i * PASO;
        var barras = fila.querySelectorAll('[data-celda]');
        // 1 · se resalta la fila, 2 · el cursor la recorre, 3 · se escribe.
        tl.to(q('[data-fila-hl]'), { y: i * HD, opacity: .1, duration: .18, ease: 'power2.out' }, at - .1)
          // immediateRender:false — la lección del sobre: un fromTo aplica su
          // estado inicial al CONSTRUIRSE, así que sin esto el cursor nacería
          // colocado en la última fila en vez de en la que le toca.
          .fromTo(q('[data-caret]'), { x: 0, y: i * HD },
              { x: 186, y: i * HD, duration: PASO - .06, ease: 'power1.inOut', immediateRender: false }, at - .06)
          .to(barras, { scaleX: 1, svgOrigin: org, duration: .26, ease: 'power2.out', stagger: .055 }, at)
          .to(barras, { fill: 'var(--vfx-faint)', duration: .3, stagger: .055 }, at);
      });

      var finFilas = INICIO + filas.length * PASO;
      tl.to(q('[data-caret]'), { opacity: 0, duration: .2 }, finFilas - .12)
        .to(q('[data-fila-hl]'), { opacity: 0, duration: .28 }, finFilas - .12)
        // El total entra desde su línea: se dibuja el filete y encima cae la cifra,
        // que crece desde su borde derecho igual que las celdas de importe.
        .to(q('[data-totales]'), { opacity: 1, duration: .26, ease: 'power2.out' }, finFilas)
        .to(q('[data-tot-linea]'), { scaleX: 1, duration: .38, ease: 'power2.out' }, finFilas)
        .to(q('[data-tot-valor]'), { scaleX: 1, duration: .42, ease: 'back.out(2.2)' }, finFilas + .12)
        // Brillo final: la hoja ya está escrita y «se cierra» con un reflejo.
        .fromTo(q('[data-brillo]'), { x: 0, opacity: 0 },
            { x: 300, opacity: 1, duration: .95, ease: 'power2.inOut', immediateRender: false }, finFilas + .5)
        .to(q('[data-brillo]'), { opacity: 0, duration: .2 }, finFilas + 1.3)
        .to({}, { duration: .55 })
        .to([todas, q('[data-totales]'), q('[data-cabecera]')],
            { opacity: 0, duration: .34, ease: 'power1.in' })
        // Vuelta al punto de partida: el bucle vuelve a escribir la hoja entera.
        .set(todas, { scaleX: 0, opacity: 1, fill: 'var(--vfx-line)' })
        .set(q('[data-totales]'), { opacity: 0 })
        .set(q('[data-tot-linea]'), { scaleX: 0 })
        .set(q('[data-tot-valor]'), { scaleX: .25 })
        .set(q('[data-marca]'), { scale: .5, opacity: 0 })
        .set(q('[data-fila-hl]'), { y: 0 })
        .to({}, { duration: .25 });
      return tl;
    }
  };

  /* ── 7 · RADAR · consola, métricas, monitoreo, operación ────────────────
     Barrido continuo + pulsos que se expanden. Los blips aparecen cuando el
     barrido los cruza; si aparecieran solos, el radar se vería decorativo. */
  SCENES.radar = {
    w: 190, box: '0 0 180 180',
    svg: function () {
      return '' +
      '<defs><linearGradient id="vfxRadar__UID__" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0%" stop-color="var(--vfx-brand)" stop-opacity=".38"/>' +
        '<stop offset="100%" stop-color="var(--vfx-brand)" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<circle cx="90" cy="90" r="72" fill="none" stroke="var(--vfx-line)" stroke-width="2"/>' +
      '<circle cx="90" cy="90" r="50" fill="none" stroke="var(--vfx-line)" stroke-width="2"/>' +
      '<circle cx="90" cy="90" r="28" fill="none" stroke="var(--vfx-line)" stroke-width="2"/>' +
      '<path d="M18 90h144M90 18v144" stroke="var(--vfx-line)" stroke-width="1.6" opacity=".7"/>' +
      '<circle data-pulse cx="90" cy="90" r="12" fill="none" stroke="var(--vfx-brand)" stroke-width="2.4" opacity="0"/>' +
      '<circle data-pulse cx="90" cy="90" r="12" fill="none" stroke="var(--vfx-purple)" stroke-width="2.4" opacity="0"/>' +
      '<g data-sweep>' +
        '<path d="M90 90V18A72 72 0 0 1 152 54Z" fill="url(#vfxRadar__UID__)"/>' +
        '<path d="M90 90V18" stroke="var(--vfx-brand)" stroke-width="2.2" opacity=".8"/>' +
      '</g>' +
      '<circle data-blip cx="124" cy="62" r="5" fill="var(--vfx-orange)" opacity="0"/>' +
      '<circle data-blip cx="58" cy="118" r="4.5" fill="var(--vfx-purple)" opacity="0"/>' +
      '<circle data-blip cx="112" cy="126" r="4" fill="var(--vfx-brand)" opacity="0"/>' +
      '<circle cx="90" cy="90" r="5.5" fill="var(--vfx-brand)"/>';
    },
    build: function (root, gsap) {
      var q = gsap.utils.selector(root);
      var SPIN = 2.4;
      // El barrido gira sobre el centro del radar (90,90), no sobre el centro
      // de la cuña: ahí está la antena.
      gsap.to(q('[data-sweep]'), { rotation: 360, svgOrigin: '90 90', duration: SPIN, ease: 'none', repeat: -1 });
      gsap.fromTo(q('[data-pulse]'), { attr: { r: 10 }, opacity: .55 },
        { attr: { r: 72 }, opacity: 0, duration: 2, ease: 'power1.out', repeat: -1, stagger: 1 });
      // Cada blip se enciende cuando el barrido pasa por su ángulo.
      var at = [SPIN * 0.12, SPIN * 0.62, SPIN * 0.37];
      var tl = gsap.timeline({ repeat: -1 });
      q('[data-blip]').forEach(function (b, i) {
        tl.fromTo(b, { opacity: 0, scale: .4, transformOrigin: '50% 50%' },
          { opacity: 1, scale: 1, duration: .22, ease: 'power2.out' }, at[i])
          .to(b, { opacity: 0, duration: 1.1, ease: 'power1.in' }, at[i] + .3);
      });
      tl.to({}, { duration: SPIN });
      return tl;
    }
  };

  /* ── 8 · ETIQUETA · promociones, precios, descuentos ────────────────────
     La etiqueta cuelga y oscila desde el ojal — el mismo punto por el que
     colgaría de verdad. Ese detalle es lo que la hace parecer física. */
  SCENES.etiqueta = {
    w: 210, box: '0 0 210 158',
    svg: function () {
      function tag(fill, stroke) {
        return '<path d="M92 22h74a12 12 0 0 1 12 12v52a12 12 0 0 1-12 12H92L54 60Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2" stroke-linejoin="round"/>' +
               '<circle cx="76" cy="60" r="7" fill="var(--vfx-surface)" stroke="' + stroke + '" stroke-width="2"/>';
      }
      return '' +
      '<path d="M76 60C76 32 96 14 122 12" fill="none" stroke="var(--vfx-line)" stroke-width="3" stroke-linecap="round"/>' +
      '<g data-tag2 opacity=".38">' + tag('var(--vfx-purple)', 'var(--vfx-purple)') + '</g>' +
      '<g data-tag>' +
        tag('var(--vfx-brand)', 'var(--vfx-deep)') +
        '<g data-pct stroke="var(--vfx-surface)" stroke-width="5" stroke-linecap="round" fill="none">' +
          '<path d="M148 40 116 82"/>' +
          '<circle cx="119" cy="43" r="7"/>' +
          '<circle cx="146" cy="79" r="7"/>' +
        '</g>' +
      '</g>' +
      '<g data-spark opacity="0">' +
        '<path d="M40 108l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="var(--vfx-orange)"/>' +
        '<path d="M186 112l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4Z" fill="var(--vfx-orange)"/>' +
        '<path d="M30 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="var(--vfx-purple)"/>' +
      '</g>';
    },
    build: function (root, gsap) {
      var q = gsap.utils.selector(root);
      // Oscila desde el ojal (76,60) — el punto por el que colgaría de verdad.
      // Ese detalle es todo lo que separa «etiqueta colgada» de «etiqueta flotando».
      gsap.fromTo(q('[data-tag]'), { rotation: -9 },
        { rotation: 9, svgOrigin: '76 60', duration: 1.25, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.fromTo(q('[data-tag2]'), { rotation: -6 },
        { rotation: 12, svgOrigin: '76 60', duration: 1.25, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: .12 });
      gsap.fromTo(q('[data-pct]'), { opacity: .7 },
        { opacity: 1, duration: .7, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      var tl = gsap.timeline({ repeat: -1 });
      tl.fromTo(q('[data-spark] path'), { opacity: 0, scale: .3, transformOrigin: '50% 50%' },
        { opacity: 1, scale: 1, duration: .35, ease: 'back.out(3)', stagger: .18 })
        .to(q('[data-spark] path'), { opacity: 0, scale: .4, duration: .4, stagger: .14 }, '>-.2')
        .set(q('[data-spark]'), { opacity: 1 }, 0)
        .to({}, { duration: .5 });
      return tl;
    }
  };

  /* ── 9 · BOLSA · atenciones, pedidos, carrito ───────────────────────────
     Los artículos caen dentro y la bolsa acusa el golpe. El clip es lo que
     vende el truco: sin él los artículos flotan por encima en vez de entrar. */
  SCENES.bolsa = {
    w: 180, box: '0 0 180 160',
    svg: function () {
      return '' +
      '<defs><clipPath id="vfxBag__UID__"><path d="M34 56h112l-9 88a8 8 0 0 1-8 7H51a8 8 0 0 1-8-7Z"/></clipPath></defs>' +
      '<g data-drop clip-path="url(#vfxBag__UID__)">' +
        '<rect data-it x="66" y="-26" width="24" height="24" rx="5" fill="var(--vfx-orange)"/>' +
        '<circle data-it cx="104" cy="-34" r="12" fill="var(--vfx-purple)"/>' +
        '<path data-it d="M78 -60h26l-6 26H84Z" fill="var(--vfx-deep)"/>' +
      '</g>' +
      '<path d="M62 58V42a28 28 0 0 1 56 0v16" fill="none" stroke="var(--vfx-deep)" stroke-width="6" stroke-linecap="round"/>' +
      '<g data-bag>' +
        '<path d="M34 56h112l-9 88a8 8 0 0 1-8 7H51a8 8 0 0 1-8-7Z" fill="var(--vfx-brand)"/>' +
        '<path d="M34 56h112l-2 18H36Z" fill="var(--vfx-deep)" opacity=".35"/>' +
        '<g opacity=".9"><circle cx="76" cy="112" r="5" fill="var(--vfx-surface)"/>' +
        '<circle cx="90" cy="112" r="5" fill="var(--vfx-surface)"/>' +
        '<circle cx="104" cy="112" r="5" fill="var(--vfx-surface)"/></g>' +
      '</g>' +
      '<ellipse cx="90" cy="154" rx="52" ry="6" fill="var(--vfx-ink)" opacity=".08" data-shadow/>';
    },
    build: function (root, gsap) {
      var q = gsap.utils.selector(root);
      // El recorte al contorno de la bolsa va en el propio markup (ver arriba):
      // es lo que hace que los artículos ENTREN en vez de pasar por delante.
      var items = q('[data-it]');
      var tl = gsap.timeline({ repeat: -1 });
      items.forEach(function (it, i) {
        var at = i * .45;
        tl.fromTo(it, { y: 0, rotation: -18, opacity: 0 },
          { y: 128, rotation: 14, opacity: 1, duration: .55, ease: 'power2.in' }, at)
          .to(it, { opacity: 0, duration: .18 }, at + .5)
          // La bolsa se aplasta desde su base (y=151) al recibir el golpe.
          .to(q('[data-bag]'), { scaleY: .95, scaleX: 1.04, svgOrigin: '90 151', duration: .11, ease: 'power2.out', yoyo: true, repeat: 1 }, at + .48)
          .to(q('[data-shadow]'), { scaleX: 1.08, opacity: .13, svgOrigin: '90 154', duration: .11, yoyo: true, repeat: 1 }, at + .48);
      });
      tl.to({}, { duration: .6 });
      return tl;
    }
  };

  /* ── 10 · REPORTES · verificar cifras, historial del estado del servicio ──
     Una persona ante su monitor repasando las gráficas del periodo, con el
     reporte impreso entrando y saliendo por un lado y la palomita al final de
     cada vuelta.

     Se dibuja SOBRIA a propósito: el partial que la monta es el mismo del
     tablero público, así que esta escena la ve gente de fuera del equipo. Sin
     guiños internos, y todo el color sale de los tokens de tema —nada a mano—
     para que se lea igual de bien en claro que en oscuro.

     Dos decisiones que no son de dibujo sino de degradación:
       · El SVG nace en su POSE FINAL (barras crecidas, hoja puesta, palomita
         puesta) y es build() quien retrocede lo que va a animar. Si el CDN de
         GSAP no llega, build() no corre y lo que queda es el informe ya
         revisado; al revés —piezas en opacity 0 esperando a GSAP— quedaba un
         monitor vacío, que se lee como pantalla rota y no como espera.
       · Todo el movimiento vive DENTRO de la línea que se devuelve. `.done()`
         solo mata lo que build() entrega, así que un `gsap.to` suelto con
         repeat:-1 seguiría latiendo contra un SVG que ya no está en la página.

     El bucle cierra por donde abre: las barras se recogen antes de acabar la
     vuelta, así que la última pose y la primera son la misma y no hay costura. */
  SCENES.reportes = {
    w: 250, box: '0 0 250 170',
    svg: function () {
      // Alturas desiguales y fijas: son cinco por diseño, así que valen a mano.
      // La línea base (y=92) es la que manda, porque de ella crecen las barras.
      var XB = [108, 131, 154, 177, 200], HB = [26, 40, 32, 54, 44];
      var TONO = ['var(--vfx-brand)', 'var(--vfx-purple)', 'var(--vfx-brand)', 'var(--vfx-orange)', 'var(--vfx-brand)'];
      var barras = '', i;
      for (i = 0; i < XB.length; i++) {
        barras += '<rect data-barra x="' + XB[i] + '" y="' + (92 - HB[i]) + '" width="14" height="' +
                  HB[i] + '" rx="2" fill="' + TONO[i] + '"/>';
      }
      var reng = '', RY = [128, 135, 142], RW = [40, 32, 36];
      for (i = 0; i < RY.length; i++) {
        reng += '<rect x="196" y="' + RY[i] + '" width="' + RW[i] + '" height="3.4" rx="1.7" fill="var(--vfx-line)"/>';
      }
      return '' +
      /* El recorte va en un grupo APARTE del que se anima: un clip-path se lee en
         el espacio del elemento que lo lleva, así que puesto sobre la hoja viajaría
         con ella. Y hace falta: `.vfx-stage svg` tiene overflow visible (lo piden
         otras escenas), de modo que sin recorte la hoja se pasearía por encima de
         la tarjeta al entrar y al salir. */
      '<defs><clipPath id="vfxRep__UID__"><rect x="0" y="0" width="250" height="170"/></clipPath></defs>' +
      '<path d="M8 152h234" stroke="var(--vfx-line)" stroke-width="2.5" stroke-linecap="round"/>' +
      // ── Quien revisa. Silueta geométrica, como el resto de la casa: cuello,
      //    hombros y cabeza. El tono medio (--vfx-faint) es el único que contrasta
      //    contra el fondo en los dos temas; el ink se perdería en uno de ellos.
      '<g data-persona>' +
        '<rect x="47" y="68" width="18" height="26" rx="8" fill="var(--vfx-faint)"/>' +
        '<path d="M20 152v-24a36 36 0 0 1 72 0v24Z" fill="var(--vfx-purple)"/>' +
        // El cuello de la prenda arranca DENTRO del hombro (el borde del torso
        // pasa por y≈95 a esa altura): un par de píxeles más arriba y las puntas
        // del trazo asomaban por fuera de la silueta, como dos rayas sueltas.
        '<path d="M42 98c5 8 22 8 28 0" fill="none" stroke="var(--vfx-deep)" stroke-width="2.4" opacity=".35"/>' +
        '<g data-cabeza><circle cx="56" cy="58" r="17" fill="var(--vfx-faint)"/></g>' +
      '</g>' +
      // ── El monitor y su gráfica
      '<rect x="96" y="18" width="132" height="90" rx="10" fill="var(--vfx-surface)" stroke="var(--vfx-line)" stroke-width="2.4"/>' +
      '<rect x="103" y="25" width="118" height="76" rx="6" fill="var(--vfx-surface2)"/>' +
      '<rect x="110" y="33" width="40" height="5" rx="2.5" fill="var(--vfx-brand)"/>' +
      '<rect x="156" y="33" width="20" height="5" rx="2.5" fill="var(--vfx-faint)" opacity=".5"/>' +
      // Retículas por debajo de las barras: son lo que convierte cinco rectángulos
      // en una gráfica y no en una fila de bloques.
      '<path d="M108 60h108M108 76h108" stroke="var(--vfx-line)" stroke-width="1" opacity=".9"/>' +
      '<path d="M106 92h112" stroke="var(--vfx-line)" stroke-width="1.6" stroke-linecap="round"/>' +
      barras +
      '<rect x="155" y="108" width="14" height="16" fill="var(--vfx-line)"/>' +
      '<rect x="138" y="123" width="48" height="6" rx="3" fill="var(--vfx-line)"/>' +
      '<rect x="116" y="140" width="80" height="10" rx="3" fill="var(--vfx-line)"/>' +
      '<rect x="122" y="143" width="34" height="2.6" rx="1.3" fill="var(--vfx-surface)" opacity=".7"/>' +
      '<rect x="160" y="143" width="22" height="2.6" rx="1.3" fill="var(--vfx-surface)" opacity=".7"/>' +
      // ── La palomita: va colgada de la esquina del monitor y no encima de la
      //    gráfica, que es la que hay que poder leer mientras se espera.
      '<g data-sello>' +
        '<circle cx="228" cy="96" r="13.5" fill="var(--vfx-brand)" stroke="var(--vfx-surface)" stroke-width="2.5"/>' +
        '<path d="M221.5 96.5l4.4 4.4 8.6-9.6" fill="none" stroke="var(--vfx-surface)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</g>' +
      // ── El reporte impreso, sobre la mesa. La inclinación va en un <g> interno
      //    para que la animación mueva el de fuera sin pelearse con ella.
      '<g clip-path="url(#vfxRep__UID__)">' +
        '<g data-hoja><g transform="rotate(-4 216 130)">' +
          '<rect x="188" y="111" width="56" height="40" rx="4" fill="var(--vfx-surface)" stroke="var(--vfx-line)" stroke-width="1.8"/>' +
          '<rect x="196" y="119" width="24" height="4.5" rx="2.25" fill="var(--vfx-brand)"/>' +
          reng +
        '</g></g>' +
      '</g>';
    },
    build: function (root, gsap) {
      var q = gsap.utils.selector(root);
      var barras = q('[data-barra]');
      var CICLO = 4.6;

      /* Los orígenes se declaran TODOS aquí y ningún tween vuelve a cambiarlos:
         cuando un origen se estrena dentro del propio tween teniendo ya una
         transformación encima, GSAP compensa con una traslación (smoothOrigin) y
         esa compensación se cuela en la animación —la hoja salía disparada—.

         Las cinco barras comparten origen «0 92» y no hace falta uno por barra:
         solo se escala en Y, así que la coordenada x del eje no cambia nada; lo
         único que importa es que crezcan desde la línea base de la gráfica. */
      gsap.set(barras, { scaleY: 0, svgOrigin: '0 92' });
      gsap.set(q('[data-sello]'), { opacity: 0, scale: .35, svgOrigin: '228 96' });
      gsap.set(q('[data-hoja]'), { svgOrigin: '216 130' });
      gsap.set(q('[data-cabeza]'), { svgOrigin: '56 90' });

      var tl = gsap.timeline({ repeat: -1 });
      // 1 · Las cifras del periodo entran de izquierda a derecha, como se leen.
      tl.to(barras, { scaleY: 1, duration: .5, ease: 'power2.out',
            stagger: { amount: .5, from: 'start' } }, 0)
        // 2 · El reporte impreso entra por la derecha y se queda para el repaso.
        .fromTo(q('[data-hoja]'), { x: 74, rotation: 6, opacity: 0 },
            { x: 0, rotation: 0, opacity: 1, duration: .6, ease: 'power3.out' }, .2)

        //     barras solo crecieran y se fueran, esto sería un gráfico, no un repaso.

        // 4 · El gesto de verificación: cabezada corta y palomita.

            yoyo: true, repeat: 1 }, 1.95)
        .to(q('[data-sello]'), { opacity: 1, scale: 1, duration: .45, ease: 'back.out(2.4)' }, 2.05)
        // 5 · La hoja sale por donde entró.
        .to(q('[data-hoja]'), { x: 74, rotation: 6, opacity: 0, duration: .55, ease: 'power2.in' }, 2.95)
        // 6 · Se recoge todo ANTES de que acabe la vuelta: así el bucle no da el
        //     corte seco de pasar de la última pose a la primera.
        .to(barras, { scaleY: 0, duration: .4, ease: 'power2.in',
            stagger: { amount: .3, from: 'end' } }, 3.55)
        .to(q('[data-sello]'), { opacity: 0, duration: .3, ease: 'power1.in' }, 3.55)
        .set(q('[data-sello]'), { scale: .35 }, 4)
        // La respiración cabe cuatro veces justas en el ciclo, así que termina en
        // su punto de partida y el reinicio no se nota.
        .to(q('[data-persona]'), { y: -2.2, duration: CICLO / 4, ease: 'sine.inOut',
            yoyo: true, repeat: 3 }, 0)
        .to({}, { duration: CICLO }, 0);
      return tl;
    }
  };

  /* ── 11 · ASESOR · atenciones, clientes a los que hay que devolver la llamada ─
     Una asesora con diadema y las fichas de quienes se quedaron a medias llegando
     a su lado, una detrás de otra.

     que hay al otro lado son clientes sin resolver. Una escena nerviosa ahí mete
     prisa en vez de acompañar, así que el pulso del auricular es lento y las
     fichas entran suave y se van hacia la asesora, no hacia fuera.

      '<g data-persona>' +
        '<rect x="55" y="68" width="18" height="26" rx="8" fill="var(--vfx-faint)"/>' +
        '<path d="M26 156v-26a38 38 0 0 1 76 0v26Z" fill="var(--vfx-brand)"/>' +

        '<path d="M85 71c3 7 1 11-7 12" fill="none" stroke="var(--vfx-deep)" stroke-width="3" stroke-linecap="round"/>' +
        '<circle cx="78" cy="83" r="3.4" fill="var(--vfx-deep)"/>' +

      // arrastra una compensación que se ve como un salto.

        .to(q('[data-ok]'), { opacity: 1, scale: 1, duration: .4, ease: 'back.out(2.2)' }, 2.2)

        .set(q('[data-ok]'), { scale: .4 }, 4.3)

        // dos veces: las tres acaban a la vez que la vuelta, sin media onda cortada.

  /* ── Ciclo de vida de una escena montada ───────────────────────────────── */
  function mount(host, theme, opts) {

    // una copia capturada al montar se queda a null para siempre mientras
    // animOK() ya dice que sí, y la escena revienta al primer .done().

           ruedas del camión. Como stopAll() solo mata lo que hay en `tweens`, esos
