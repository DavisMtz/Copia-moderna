          // se lee para marcarlo, no para abrir nada.
          var deQuien = r.mia
            ? '<span class="cmdk-tag mia">Tuya</span>'
            : '<span class="cmdk-tag">' + esc(r.asesorNombre || 'Liberada') + '</span>';
          html += fila('',
            '<span class="cmdk-chip">' + IC.reloj + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.cliente || 'Sin nombre', q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(r.telefono || '', q) +
                (r.tipo ? ' · ' + esc(r.tipo) : '') + '</span>' +
            '</span>' + deQuien +
            '<span class="cmdk-enter">↵ Ver</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else if (g.tipo === 'tienda') {
          /* El número EN GRANDE y el nombre debajo: nueve de cada diez veces este
             resultado se lee para dictarlo por teléfono, no para abrir nada. Y por eso
             la pista de teclado dice «Copiar» y no «Abrir»: no hay a dónde ir. */
          html += fila('',
            '<span class="cmdk-chip">' + IC.caja + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(String(r.num), q) + ' · ' + B.resalta(r.name, q) + '</span>' +
              '<span class="cmdk-sub">' + esc(r.tipo === 'CR' ? 'Centro de reparto' : 'Tienda') + '</span>' +
            '</span>' +
            '<span class="cmdk-tag">' + esc(r.tipo) + '</span>' +
            '<span class="cmdk-enter">↵ Copiar</span>');

        } else if (g.tipo === 'anuncio') {
          html += fila('',
            '<span class="cmdk-chip">' + IC.megafono + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.titulo, q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(B.extracto(r.sub, q, 90), q) + '</span>' +
            '</span>' +
            (r.estado ? '<span class="cmdk-tag">' + esc(r.estado) + '</span>' : '') +
            '<span class="cmdk-enter">↵ Editar</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else if (g.tipo === 'articulo') {
          /* La segunda línea enseña el RESUMEN salvo cuando lo escrito no aparece en él y
             sí en el cuerpo: ahí se enseña el trozo del cuerpo donde está. Es la línea que
             contesta «¿y por qué sale este artículo?», y con el resumen fijo esa pregunta
             se quedaba sin respuesta justo en el caso para el que se indexó el cuerpo. */
          var enResumen = !!r.resumen && B.coincide(r.resumen, q);
          var linea = enResumen ? r.resumen : (r.texto || r.resumen || '');
          html += fila('',
            '<span class="cmdk-chip">' + IC.libro + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + B.resalta(r.titulo, q) + '</span>' +
              '<span class="cmdk-sub">' + B.resalta(B.extracto(linea, q, 90), q) + '</span>' +
            '</span>' +
            '<span class="cmdk-enter">↵ Leer</span><span class="cmdk-go">' + IC.flecha + '</span>');

        } else {
          html += fila('',
            '<span class="cmdk-chip">' + r.icono + '</span>' +
            '<span class="cmdk-tx">' +
              '<span class="cmdk-name">' + (q ? B.resalta(r.nombre, q) : esc(r.nombre)) + '</span>' +
              '<span class="cmdk-sub">' + esc(r.sub) + '</span>' +
            '</span>' +
            '<span class="cmdk-enter">↵ ' + (r.fn ? 'Aplicar' : 'Abrir') + '</span>' +
            '<span class="cmdk-go">' + IC.flecha + '</span>');
        }
      });
    });

    if (esperando && !huesosPuestos) html += huesos;

    if (!filas.length && !esperando) {
      var sugerencias = q ? [] : leerLista(K_BUSQUEDAS).slice(0, 5);
      html = '<div class="cmdk-vacio">' + IC.lupa +
        (q ? '<div>Nada coincide con <b>' + esc(q) + '</b>.</div>' +
             '<div style="margin-top:.4rem;font-size:.8rem">Prueba con el folio completo, el correo del cliente o el nombre de la pantalla. ' +
             'También puedes acotar escribiendo <b>portal:</b>, <b>cot:</b> o <b>gente:</b> delante.</div>'
           : '<div>Escribe para buscar.</div>' +
             '<div style="margin-top:.4rem;font-size:.8rem">Pantallas y apartados, folios, clientes, personas del equipo, ' +
             'contenido del Portal, procesos y tiempos, tiendas y centros de reparto, las fallas abiertas ' +
             'y los clientes que esperan una llamada.</div>' +
             /* Los ámbitos no se adivinan: si no se enseñan aquí, existen para quien lea
                el código y para nadie más. Se pintan como lo que son, algo que se teclea. */
             '<div style="margin-top:.55rem;font-size:.78rem;opacity:.85">Para buscar en un solo sitio, ' +
             'empieza por <b>portal:</b>, <b>cot:</b>, <b>procesos:</b>, <b>gente:</b>, <b>fallas:</b> o <b>tienda:</b></div>') +
        (sugerencias.length
          ? '<div class="cmdk-pistas">' + sugerencias.map(function (s) {
              return '<button type="button" class="cmdk-pista" data-q="' + esc(s) + '">' + esc(s) + '</button>';
            }).join('') + '</div>'
          : '') +
        '</div>';
    }

    lista.innerHTML = html;
    botonEnlace.hidden = !q;
    botonEnlace.innerHTML = IC.liga + 'Copiar enlace de esta búsqueda';
    activo = -1;
    if (filas.length) marca(0, false);
  }

  /* ── Ejecutar el resultado elegido ──────────────────────────────────────────
     Todo destino viaja por la URL, y a propósito: un resultado abre su pantalla YA
     situada —la sección del Portal filtrada por lo que se escribió, el folio abierto,
     el panel con la búsqueda puesta— en vez de dejar a alguien en la portada de esa
     pantalla teniendo que repetir la búsqueda que acababa de hacer. */
  function ejecuta(i) {
    if (i < 0 || i >= filas.length) return;
    var f = filas[i];
    var q = caja.value.trim();
    recordar(K_BUSQUEDAS, q, 5);

    if (f.tipo === 'fn' || f.tipo === 'sec') {
      var d = f.dato;
      recordar(K_RECIENTES, d.id, 6);
      // Lo que se abre se apunta: es de donde sale la predicción de la próxima vez.
      usoAnotar(d.id);
      if (d.fn) {
        /* Por omisión el panel SE QUEDA ABIERTO: los ajustes locales (tema, tamaño de
           letra, densidad) se prueban tres o cuatro veces seguidas y cerrar entre cada
           uno obligaría a volver a abrirlo y a repetir la búsqueda.
           Con `cierra:true` se cierra antes de actuar. Es para las acciones que abren
           algo encima —reportar una falla abre el panel de operación—: dejar la paleta
           puesta la pondría por delante de lo que se acaba de abrir, y se leería como
           que el resultado no hizo nada. */
        if (d.cierra) { cerrar(true); d.fn(); return; }
        d.fn(); pinta(); return;
      }
      navega(d.page, d.params || {}, d.ancla);
      return;
    }
    if (f.tipo === 'cot') { vaAFolio(f.dato.folio); return; }
    if (f.tipo === 'pista') return;   // no es un resultado: es la señal del ámbito puesto
    if (f.tipo === 'todo') { navega(f.dato.page, f.dato.params, f.dato.ancla); return; }
    if (f.tipo === 'gente') { navega(f.dato.page, f.dato.params || {}, f.dato.ancla); return; }
    if (f.tipo === 'op')    { navega('estado', { inc: f.dato.id }); return; }
    if (f.tipo === 'traz') {
      /* Se abre el Portal en la sección del proceso, filtrada por lo que se escribió y
         con la tarjeta desplegada. `item` lleva el id de la tarjeta ('bt-3') en vez del
         nombre: el nombre viene de una hoja de cálculo y basta un espacio de más para
         que la comparación falle, mientras que el id lo pone el propio Portal al
         pintarla. */
      navega('portal', { sec: f.dato.seccion, q: q, item: f.dato.id });
      return;
    }
    if (f.tipo === 'aten') {
      // Se va a la atención con la pestaña puesta y el buscador ya escrito con el
      // teléfono: allí queda esa tarjeta sola en pantalla. Donde el módulo esté
      // cargado, esto abre el panel encima sin perder lo que se estaba haciendo (ver
      // el desvío en app_atenciones); donde no, abre la pantalla completa igual de
      // situada. El destino se escribe una vez y funciona en los dos casos.
      navega('atenciones', { sec: f.dato.donde, q: f.dato.telefono || f.dato.cliente });
      return;
    }
    if (f.tipo === 'tienda') {
      /* No hay a dónde navegar: el catálogo de tiendas no es una pantalla. Lo que se
         quiere del resultado es el NÚMERO, para dictarlo o pegarlo en SAP, así que Enter
         lo copia y el panel se queda abierto —normalmente se consultan dos o tres
         seguidas y cerrarlo obligaría a volver a escribir. */
      var texto = String(f.dato.num);
      var nombreTda = f.dato.name;
      /* Con respaldo y con aviso en los dos casos. La API del portapapeles no existe
         fuera de un origen seguro y el navegador la niega si la pestaña perdió el foco;
         sin esta rama, el panel prometía «↵ Copiar», no pasaba nada y no había forma de
         saber si se había copiado o no. Mismo patrón que ya usa app_atenciones. */
      var aviso = function (ok) {
        if (window.AppMotion && AppMotion.toast) {
          AppMotion.toast(ok ? 'Copiado: ' + texto + ' · ' + nombreTda
                             : 'No se pudo copiar el ' + texto + '; selecciónalo a mano.',
                          ok ? 'ok' : 'warn');
        }
      };
      var respaldo = function () {
        try {
          var ta = document.createElement('textarea');
          ta.value = texto;
          ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          aviso(!!ok);
        } catch (e) { aviso(false); }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { aviso(true); }, respaldo);
      } else respaldo();
      return;
    }
    if (f.tipo === 'anuncio') { navega('anuncios', { q: f.dato.titulo }); return; }
    /* Al artículo por su ID y no por su título: el enlace tiene que seguir llevando al
       mismo sitio cuando alguien le corrija la errata al encabezado. */
    if (f.tipo === 'articulo') { navega('articulo', { art: f.dato.id }); return; }
    if (f.tipo === 'portal') {
      var p = f.dato;
      // La sección del Portal, filtrada por lo que se escribió y con el elemento
      // elegido ya resaltado. Es exactamente lo que hace el buscador de la portada al
      // pulsar un resultado, y ahora se consigue desde cualquier pantalla porque todo
      // el destino cabe en la URL: sección, búsqueda y elemento.
      if (p.seccion) {
        /* Tres destinos distintos con la misma forma de URL:
             · Elemento con id ('fp-transfer', 'ds-enr'): el id es mejor que el nombre
               porque el Portal lo resuelve con getElementById y no depende de que el
               texto coincida letra a letra —basta un espacio de más en la hoja para que
               la comparación por nombre falle y la sección se abra sin resaltar nada.
             · Elemento de la hoja sin id: se manda el nombre, como se hacía siempre.
             · La SECCIÓN entera ("llévame a Paqueterías"): ni `item` ni `q`. Filtrar la
               sección por la palabra que se escribió la dejaría casi vacía, y lo que se
               pidió era verla completa. */
        var destino = { sec: p.seccion };
        var elemento = (p.item !== undefined) ? p.item : p.nombre;
        if (elemento) { destino.item = elemento; destino.q = q; }
        navega('portal', destino);
        return;
      }
      if (p.href) { abreLiga(p.href); return; }
      navega('portal', {});
    }
  }

  function navega(page, params, ancla) {
    cerrar(true);
    if (window.VentelLoader) VentelLoader.show();
    if (!window.AppUrl) return;
    /* '__home' no es una pantalla: es «la que le toque a quien busca». Un asesor va a su
       panel de cotizaciones y una supervisión al suyo, que es lo que decidió F1 para
       esta misma pregunta. El catálogo lo escribe así una vez y cada buscador lo
       resuelve al navegar. */
    var destino = (page === '__home' && AppUrl.homePage) ? AppUrl.homePage() : page;
    AppUrl.go(destino, params || {}, ancla);
  }

  function abreLiga(href) {
    if (!href) return;
    window.open(href, '_blank', 'noopener');
    cerrar();
  }

  function vaAFolio(folio) {
    if (!folio) return;
    try { if (window.AppSession) AppSession.selectedFolio = folio; } catch (e) {}
    navega('consulta_cotizacion', { folio: folio });
  }

  /** Enlace a ESTA búsqueda, en ESTA pantalla. Se pega en un chat y abre lo mismo. */
  function copiaEnlace() {
    var q = caja.value.trim();
    if (!q || !window.AppUrl) return;
    AppUrl.copyLink(paginaActual || 'dashboard', { buscar: q }).then(function (ok) {
      botonEnlace.innerHTML = IC.liga + (ok ? 'Enlace copiado' : 'No se pudo copiar');
      setTimeout(function () {
        if (botonEnlace) botonEnlace.innerHTML = IC.liga + 'Copiar enlace de esta búsqueda';
      }, 1800);
    });
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     APERTURA Y CIERRE — transformación de contenedor (FLIP)
     ═══════════════════════════════════════════════════════════════════════════
     El panel NACE del botón de buscar: crece desde su sitio exacto hasta ocupar su
     forma final, y al cerrarse vuelve a encogerse hacia él. No es decoración —es lo
     que enseña dónde vive el buscador. Quien lo abrió con Ctrl+K ve de dónde salió y
     la próxima vez sabe dónde está el botón.

     POR QUÉ SE REESCRIBIÓ ESTA ANIMACIÓN
     ------------------------------------
     Antes se animaban `left`, `top`, `width` y `height`. Eso obliga al navegador a
     recalcular la disposición de la página en CADA fotograma: el panel lleva dentro
     una lista de resultados y el reparto de esa lista se rehacía sesenta veces por
     segundo. En un equipo de mostrador el resultado era exactamente lo que se
     describía como "pegajoso": no es que fuera lenta, es que se saltaba fotogramas.

     Ahora es un FLIP: el panel se queda SIEMPRE en su sitio y su tamaño finales, y lo
     único que cambia es `transform`, que el navegador compone en la GPU sin volver a
     medir nada. Se calcula la transformación que lleva la caja final justo encima del
     botón, se parte de ahí y se anima hasta la identidad.

     LA CONTRAESCALA, que es lo que hacía falta para poder usar FLIP aquí:
     escalar el panel escalaría el texto con él —el motivo por el que la versión
     anterior no lo usaba—. Se corrige aplicando al cuerpo la escala INVERSA: el marco
     crece y el contenido se queda del tamaño que le toca. Es el mismo truco que usan
     los paneles de macOS al abrirse desde un icono.

     Lo único que no es transform es el radio de las esquinas, y se conserva a
     propósito: sin él la pastilla no se convierte en panel, se estira. Un cambio de
     radio repinta, pero no vuelve a medir la página, que era el problema. */
  function rectDisparador() {
    var b = disparador && disparador.isConnected ? disparador
          : (document.getElementById('cmdkAbrir') || document.getElementById('cmdkFlota'));
    if (!b) return null;
    var r = b.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return { el: b, left: r.left, top: r.top, width: r.width, height: r.height };
  }

  /**
   * La transformación que pone la caja `destino` justo encima de `origen`.
   *
   * Con transformOrigin en la esquina superior izquierda, el desplazamiento es la
   * diferencia de esquinas y la escala es la razón de tamaños. Se acota por abajo
   * porque una escala de 0 es una matriz sin inversa: la contraescala del contenido
   * saldría infinita y GSAP escribiría `scale(Infinity)`, que el navegador descarta
   * y deja el panel visible de golpe, sin animación.
   */
  function flip(origen, destino) {
    if (!origen || !destino || !destino.width || !destino.height) return null;
    return {
      x: origen.left - destino.left,
      y: origen.top - destino.top,
      sx: Math.max(origen.width / destino.width, .02),
      sy: Math.max(origen.height / destino.height, .02)
    };
  }

  /* ── El contorno vivo del panel ─────────────────────────────────────────────
     El mismo componente que lleva el buscador de la barra superior (app_aura),
     en su modo `panel`: el filo va por dentro porque esta caja recorta, y sin
     destello, que aquí barrería por encima de la lista de resultados.

     Se monta al ABRIR y se quita al CERRAR, no una vez para siempre. Dos
     razones: con el panel cerrado (`display:none`) las líneas de tiempo
     seguirían corriendo para nadie, y montándolo cada vez se vuelve a ver el
     barrido de entrada —el gesto que enseña que este borde hace cosas—.

     Si app_aura no está incluido en la pantalla, no pasa nada: el panel se abre
     igual que siempre. Es la misma degradación de toda la casa. */
  function ponAura() {
    /* `abierto` no es redundante con la llamada: quien pulsa Esc durante las
       cuatro décimas de la apertura deja la línea de tiempo en marcha, y su
       `onComplete` llegaría con el panel ya cerrándose. Montar ahí dejaría el
       aura girando dentro de un `display:none` para nadie. */
    if (!abierto || !panel || !window.VentelAura) return;
    try {
      window.VentelAura.mount(panel, {
        modo: 'panel',
        destello: false,
        /* 17 = 18 del panel − 1 del borde. El marco se posiciona contra la caja
           de relleno, no contra el borde, así que leer el radio del panel tal
           cual dejaría las esquinas un píxel abiertas. */
        radio: '17px'
      });
    } catch (e) { /* el buscador funciona igual sin contorno */ }
  }

  function quitaAura() {
    if (!panel || !window.VentelAura) return;
    try { window.VentelAura.destroy(panel); } catch (e) {}
  }

  function abrir(termino) {
    construye();
    if (abierto) { caja.focus(); caja.select(); return; }
    abierto = true;
    devuelveFoco = document.activeElement;

    // El directorio se rearma al abrir: entre una búsqueda y otra pudo guardarse una
    // cotización nueva o refrescarse la lista del panel.
    Directorio.refrescar();

    fondo.classList.add('open');
    document.documentElement.style.overflow = 'hidden';
    caja.value = termino || '';
    fondo.querySelector('#cmdkBorrar').classList.toggle('ver', !!termino);
    pinta();
    caja.focus();
    if (termino) { caja.select(); alTeclear(); }

    /* Sin GSAP el aura se monta ya: no hay apertura a la que esperar, y el halo
       —que es CSS puro— es parte del diseño, no del movimiento. */
    if (!conGsap()) { ponAura(); return; }
    var origen = rectDisparador();
    var destino = panel.getBoundingClientRect();
    if (!destino.width) { ponAura(); return; }

    animando = true;
    fondo.classList.add('cmdk-anima');
    var cabeza = fondo.querySelector('.cmdk-head');
    var resto = fondo.querySelectorAll('.cmdk-list, .cmdk-foot');
    var tl = gsap.timeline({
      onComplete: function () {
        animando = false;
        fondo.classList.remove('cmdk-anima');
        gsap.set([panel, cuerpo], { clearProps: 'transform,transformOrigin,borderRadius' });
        gsap.set([cabeza].concat([].slice.call(resto)), { clearProps: 'opacity,y' });
        /* El contorno entra cuando el panel ya está quieto y a su tamaño real.
           Montado antes, el aura mediría un panel a mitad de escala y el filo
           saldría deformado durante la apertura. */
        ponAura();
      }
    });

    tl.fromTo(fondo, { opacity: 0 }, { opacity: 1, duration: .18, ease: 'power1.out' }, 0);

    var salto = origen ? flip(origen, destino) : null;

    if (salto) {
      // El panel ya está donde tiene que estar; solo se le pone encima la
      // transformación que lo lleva al botón, y desde ahí se anima a la identidad.
      gsap.set(panel, { transformOrigin: '0 0' });
      gsap.set(cuerpo, { transformOrigin: '0 0' });

      tl.fromTo(panel,
        { x: salto.x, y: salto.y, scaleX: salto.sx, scaleY: salto.sy, borderRadius: 12 },
        { x: 0, y: 0, scaleX: 1, scaleY: 1, borderRadius: 18,
          duration: .44, ease: 'power3.out', force3D: true }, 0);

      // Contraescala: deshace en el contenido lo que se le hace al marco, así el texto
      // nunca aparece achatado ni estirado mientras el panel crece.
      tl.fromTo(cuerpo,
        { scaleX: 1 / salto.sx, scaleY: 1 / salto.sy },
        { scaleX: 1, scaleY: 1, duration: .44, ease: 'power3.out', force3D: true }, 0);

      /* La CAJA DE TEXTO entra enseguida y los resultados después. Es lo que hace que
         se lea como una transformación y no como una ventana que aparece encima: el
         botón dice "Buscar" con una lupa y se convierte en un campo con la misma lupa,
         listo para escribir. Con todo el contenido retrasado se veía crecer un
         rectángulo blanco vacío, que parece que algo está cargando. */
      tl.fromTo(cabeza, { opacity: 0 }, { opacity: 1, duration: .16, ease: 'power1.out' }, .04);
      tl.fromTo(resto, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .26, stagger: .05, ease: 'power2.out' }, .17);
      // El botón se apaga mientras el panel ocupa su lugar: es el mismo objeto.
      tl.to(origen.el, { opacity: .25, duration: .2, ease: 'power1.out' }, 0);
    } else {
      // Sin botón visible (atajo de teclado en una pantalla que aún no lo pintó):
      // entrada sobria desde arriba, que es de donde cuelga el panel.
      tl.fromTo(panel, { opacity: 0, y: -14, scale: .985 },
                       { opacity: 1, y: 0, scale: 1, duration: .3, ease: 'power3.out', clearProps: 'transform' }, 0);
    }
  }

  /**
   * @param {boolean=} instantaneo true cuando la pantalla se va a cambiar igual: no
   *   tiene sentido gastar tres décimas encogiendo un panel que nadie va a ver
   *   volver a su sitio, y deja el desplazamiento de la página libre enseguida.
   */
  function cerrar(instantaneo) {
    if (!abierto) return;
    abierto = false;
    clearTimeout(relojTecleo);
    caja.removeAttribute('aria-activedescendant');
    /* Lo primero, antes de medir nada: el aura deja el panel como estaba y mata
       sus líneas de tiempo. Si se quitara después, el salto de cierre partiría
       de un panel con estilos en línea puestos por otro módulo. */
    quitaAura();

    var terminar = function () {
      animando = false;
      fondo.classList.remove('open', 'cmdk-anima');
      if (window.gsap) {
        gsap.set(fondo, { clearProps: 'opacity' });
        gsap.set([panel, cuerpo], { clearProps: 'transform,transformOrigin,borderRadius,opacity' });
        gsap.set(fondo.querySelectorAll('.cmdk-head, .cmdk-list, .cmdk-foot'), { clearProps: 'opacity,y' });
      }
      document.documentElement.style.overflow = '';
      try { if (devuelveFoco && devuelveFoco.focus) devuelveFoco.focus({ preventScroll: true }); } catch (e) {}
      devuelveFoco = null;
    };

    if (instantaneo || !conGsap()) {
      if (window.gsap) gsap.killTweensOf([fondo, panel, cuerpo]);
      var b = rectDisparador();
      if (b && window.gsap) gsap.set(b.el, { clearProps: 'opacity' });
      terminar();
      return;
    }

    var origen = rectDisparador();
    // Se mide el panel SIN su transformación puesta: getBoundingClientRect devuelve la
    // caja ya transformada, y si quedara algo de la apertura a medias, el salto de
    // cierre partiría de una posición falsa y el panel daría un tirón al empezar.
    gsap.set([panel, cuerpo], { clearProps: 'transform' });
    var actualRect = panel.getBoundingClientRect();
    var salto = flip(origen, actualRect);

    if (!salto) {
      gsap.to(fondo, { opacity: 0, duration: .16, ease: 'power1.in', onComplete: terminar });
      return;
    }

    animando = true;
    fondo.classList.add('cmdk-anima');
    gsap.set(panel, { transformOrigin: '0 0' });
    gsap.set(cuerpo, { transformOrigin: '0 0' });

    var tl = gsap.timeline({ onComplete: terminar });
    tl.to(fondo.querySelectorAll('.cmdk-head, .cmdk-list, .cmdk-foot'),
          { opacity: 0, duration: .12, ease: 'power1.in' }, 0);
    tl.to(panel, { x: salto.x, y: salto.y, scaleX: salto.sx, scaleY: salto.sy,
                   borderRadius: 12, duration: .3, ease: 'power3.inOut', force3D: true }, .04);
    tl.to(cuerpo, { scaleX: 1 / salto.sx, scaleY: 1 / salto.sy,
                    duration: .3, ease: 'power3.inOut', force3D: true }, .04);
    tl.to(fondo, { opacity: 0, duration: .18, ease: 'power1.in' }, .14);
    tl.to(origen.el, { opacity: 1, duration: .2, ease: 'power1.out' }, .12);
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     ENGANCHE CON LA PANTALLA
     ═══════════════════════════════════════════════════════════════════════════ */

  /** ¿El foco está en un sitio donde «/» es una barra y no un atajo? */
  function escribiendo(el) {
    if (!el) return false;
    var t = (el.tagName || '').toLowerCase();
    return t === 'input' || t === 'textarea' || t === 'select' || el.isContentEditable;
  }

  function botonHTML() {
    return '<button type="button" class="cmdk-abrir" id="cmdkAbrir" aria-label="Buscar en todo el sistema" ' +
      'title="Buscar en todo el sistema (Ctrl+K)">' +
      IC.lupa + '<span class="cmdk-abrir-tx">Buscar…</span><kbd>Ctrl K</kbd></button>';
  }

  function desdeBoton(b) {
    disparador = b;
    b.addEventListener('click', function () { disparador = b; abrir(); });
  }

  /**
   * Pone el disparador en la barra superior. Se llama solo, pero AppShell dibuja
   * su barra con JS después de este archivo: por eso se reintenta unas veces en
   * vez de rendirse en el primer intento.
   */
  function ponBoton(intentos) {
    if (document.getElementById('cmdkAbrir') || document.getElementById('cmdkFlota')) return;
    var sesion = document.querySelector('.topbar .shell-session');
    var barra = document.querySelector('.topbar');
    if (!sesion && !barra) {
      // AppShell dibuja su barra por JS —dentro del DOMContentLoaded de la pantalla,
      // justo después de este archivo—, así que se reintenta un momento antes de dar
      // por hecho que esta pantalla no tiene barra. Poco tiempo a propósito: en las
      // que de verdad no la tienen, el botón flotante no debe tardar en salir.
      if ((intentos || 0) < 10) { setTimeout(function () { ponBoton((intentos || 0) + 1); }, 120); return; }
      ponFlotante();
      return;
    }
    var envoltura = document.createElement('span');
    envoltura.innerHTML = botonHTML();
    var btn = envoltura.firstChild;

    // Dónde cae el botón según cómo esté armada la barra de esa pantalla:
    // antes del saludo en las pantallas de app, y justo después del hueco
    // elástico en el Monitor de promociones (si no, quedaba detrás del reloj).
    if (sesion) sesion.insertBefore(btn, sesion.firstChild);
    else {
      var hueco = barra.querySelector('.spacer');
      if (hueco && hueco.nextSibling) barra.insertBefore(btn, hueco.nextSibling);
      else barra.appendChild(btn);
    }
    desdeBoton(btn);
  }

  /** Botón flotante para las pantallas sin barra superior. */
  function ponFlotante() {
    if (document.getElementById('cmdkFlota') || document.getElementById('cmdkAbrir')) return;
    if (!document.body) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cmdk-flota';
    b.id = 'cmdkFlota';
    b.setAttribute('aria-label', 'Buscar en todo el sistema');
    b.title = 'Buscar en todo el sistema (Ctrl+K)';
    b.innerHTML = IC.lupa + '<span class="cmdk-flota-tx">Buscar</span>';
    document.body.appendChild(b);
    desdeBoton(b);
  }

  function atajos(e) {
    if (animando) return;
    // Ctrl+K / ⌘K abren desde donde sea, incluso escribiendo en un campo.
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault(); abrir(); return;
    }
    if (abierto) return;
    // «/» solo cuando no se está escribiendo: en un formulario es una barra.
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !escribiendo(document.activeElement)) {
      e.preventDefault(); abrir(); return;
    }
  }

  function arranca() {
    if (!window.AppBuscar || !window.AppUrl) return;   // sin motor o sin rutas, no hay buscador
    document.addEventListener('keydown', atajos);
    ponBoton(0);
    // ?buscar=… abre el panel con la búsqueda ya escrita. Un enlace a una búsqueda
    // vale para pegarlo en un chat: quien lo abre ve exactamente lo mismo.
    //
    // leerUbicacion puede contestar DOS veces —el parámetro inyectado llega enseguida y
    // el nombre de la página tarda lo que tarde getLocation—, así que la apertura se
    // hace una sola vez: abrir dos veces con la misma búsqueda le robaría el foco a
    // quien ya hubiera empezado a teclear otra cosa.
    var yaAbierto = false;
    leerUbicacion(function (p) {
      if (!p || !p.buscar || yaAbierto) return;
      yaAbierto = true;
      setTimeout(function () { abrir(String(p.buscar)); }, 260);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();

  window.AppComando = {
    abrir: abrir,
    cerrar: cerrar,
    /** Destinos permitidos, para que otras pantallas ofrezcan la misma lista. */
    destinos: destinos,
    /** Vuelve a leer las cachés (una pantalla que acaba de guardar puede avisar). */
    refrescar: function () { Directorio.refrescar(); if (abierto) pinta(); },
    /** HTML del disparador, por si una pantalla lo quiere en otro sitio. */
    botonHTML: botonHTML,
    montarBoton: function () { ponBoton(0); }
  };
})();
</script>
