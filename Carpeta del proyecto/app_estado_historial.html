<style>
/* =====================================================================================
   HISTORIAL DE ESTADO · estilos
   =====================================================================================
   Una tira de barras por sistema, al estilo de las páginas de estado. Cada barra es una
   HORA o un DÍA según el periodo elegido; arranca por horas, que es la escala en la que
   se decide algo mientras algo está fallando.

   ── SOBRE EL COLOR, QUE ES LO QUE MÁS SE EQUIVOCA AQUÍ ──────────────────────────────
   Los tres tonos salen de la paleta de ESTADO del tema (--ok / --warn / --alert), que ya
   es la del sistema de diseño y no se toca. Pasados por el validador de paletas, el par
   ámbar↔rojo da ΔE 3.7 en deuteranopía y 10.5 en visión normal: por debajo del mínimo
   para distinguirse SOLO por color. Con ~8 % de los hombres con deficiencia al rojo-verde,
   en una plantilla de asesores eso no es un caso teórico.

   No se cambia la paleta —es la del tema y significa lo mismo en toda la app—; se le añade
   codificación secundaria, que es lo que corresponde a los colores de estado:

     · ALTURA. Verde 22 %, ámbar 58 %, rojo 100 %. Las tres alturas se distinguen por
       geometría, sin color de por medio. Es la señal principal, no un adorno.
     · TEXTURA. El rojo lleva rayado diagonal. Sobrevive a una impresión en blanco y negro
       y al modo de contraste forzado, donde el color desaparece del todo.
     · ETIQUETA. Cada barra lleva su hora (o su fecha) y su estado en el título accesible,
       y hay una vista de tabla con las mismas cifras en texto.

   ── SOBRE EL MOVIMIENTO ─────────────────────────────────────────────────────────────
   Las barras crecen con scaleY y transform-origin abajo, NUNCA animando `height`. Con
   cuarenta y ocho horas por cuatro sistemas son casi 250 barras: animar la altura sería
   recalcular el layout de la tira entera en cada fotograma. Con scaleY, el compositor
   escala capas ya pintadas y la entrada va a 60 fps en cualquiera de los periodos. */

.eh-wrap { display: grid; gap: 1rem; }

.eh-top { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; }
.eh-rangos { display: flex; gap: .3rem; flex-wrap: wrap; }
.eh-rango {
  border: 1px solid var(--line, #E4E9F0); background: var(--surface, #fff);
  color: var(--ink-soft, #5C6B7E); border-radius: 999px; cursor: pointer;
  padding: .32rem .7rem; font-size: .78rem; font-weight: 600; font-family: inherit;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.eh-rango[aria-pressed="true"] { color: var(--brand, #E10098); border-color: var(--brand, #E10098);
  background: var(--brand-tint, #FDE7F4); }

.eh-fila { display: grid; grid-template-columns: minmax(6.5rem, 9rem) minmax(0, 1fr) auto;
  gap: .75rem; align-items: center; padding: .5rem 0; }
.eh-fila + .eh-fila { border-top: 1px solid var(--line, #E4E9F0); }
.eh-fila.eh-total { border-top: 2px solid var(--line, #E4E9F0); }
.eh-nombre { font-size: .84rem; font-weight: 600; color: var(--ink, #1B2330);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eh-nombre small { display: block; font-weight: 400; font-size: .72rem; color: var(--ink-soft, #5C6B7E); }

/* La tira. `contain: layout paint` acota el trabajo del navegador a esta caja: con cuatro
   sistemas en pantalla, un hover en una no debe hacer pensar al resto. */
.eh-tira { display: flex; gap: 2px; align-items: flex-end; height: 2.6rem; contain: layout paint; }
.eh-bar {
  flex: 1 1 0; min-width: 3px; position: relative; height: 100%;
  display: flex; align-items: flex-end; cursor: default; background: none; border: 0; padding: 0;
}
/* El carril de fondo dice "este tramo existe y no pasó nada", que es distinto de un hueco. */
.eh-bar::before {
  content: ''; position: absolute; inset: 0; border-radius: 3px;
  background: var(--surface-2, #F4F7FA);
}
.eh-bar i {
  position: relative; display: block; width: 100%; border-radius: 3px;
  transform-origin: 50% 100%;   /* crece desde la base: es el eje natural de una barra */
}
.eh-bar.t-ok i    { height: 22%;  background: var(--ok, #0E7A4F); }
.eh-bar.t-warn i  { height: 58%;  background: var(--warn, #B45309); }
.eh-bar.t-alert i { height: 100%; background: var(--alert, #C81E3C); }

/* Rayado solo en el rojo. Es la señal que sobrevive sin color, y ponerlo en los tres
   quitaría el contraste de textura que lo hace útil. */
.eh-bar.t-alert i {
  background-image: repeating-linear-gradient(45deg,
    rgba(255,255,255,.30) 0 2px, transparent 2px 5px);
}
.eh-bar:hover i, .eh-bar:focus-visible i { filter: brightness(1.12); }
.eh-bar:focus-visible { outline: 2px solid var(--brand, #E10098); outline-offset: 2px; border-radius: 3px; }

.eh-resumen { font-size: .78rem; color: var(--ink-soft, #5C6B7E); white-space: nowrap; text-align: right; }
.eh-resumen b { display: block; font-size: .95rem; font-weight: 700; color: var(--ink, #1B2330); }

.eh-ejes { display: flex; justify-content: space-between; font-size: .72rem;
  color: var(--ink-faint, #94A1B2); padding-left: calc(6.5rem + .75rem); }
@media (max-width: 640px) { .eh-ejes { padding-left: 0; } .eh-fila { grid-template-columns: 1fr; gap: .3rem; }
  .eh-resumen { text-align: left; } }

.eh-leyenda { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .76rem; color: var(--ink-soft, #5C6B7E); }
.eh-leyenda span { display: inline-flex; align-items: center; gap: .35rem; }
.eh-muestra { width: .8rem; height: .8rem; border-radius: 3px; flex: none; display: inline-block; }
.eh-muestra.t-ok { background: var(--ok, #0E7A4F); height: .3rem; }
.eh-muestra.t-warn { background: var(--warn, #B45309); height: .55rem; }
.eh-muestra.t-alert { background: var(--alert, #C81E3C);
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.3) 0 2px, transparent 2px 5px); }

/* Globo de detalle. `position:fixed` + transform: se mueve sin tocar el layout. */
.eh-globo {
  position: fixed; z-index: 60; pointer-events: none; opacity: 0;
  background: var(--ink, #1B2330); color: #fff; border-radius: 8px;
  padding: .5rem .65rem; font-size: .76rem; line-height: 1.45; max-width: 15rem;
  box-shadow: 0 12px 28px -12px rgba(0,0,0,.5);
}
.eh-globo b { display: block; font-weight: 700; margin-bottom: .1rem; }
.eh-globo em { font-style: normal; opacity: .8; }

.eh-tabla { width: 100%; border-collapse: collapse; font-size: .8rem; }
.eh-tabla th, .eh-tabla td { padding: .35rem .5rem; text-align: left;
  border-bottom: 1px solid var(--line, #E4E9F0); }
.eh-tabla th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-faint, #94A1B2); }
.eh-tabla td.num { text-align: right; font-variant-numeric: tabular-nums; }
/* Título de la tabla para lectores de pantalla. Se define aquí y no se hereda del tema
   porque este partial también se monta en el tablero público, que no carga las utilidades. */
.eh-wrap .sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

.eh-conf { display: grid; gap: .4rem; }
.eh-conf-item { display: flex; gap: .55rem; align-items: flex-start; font-size: .8rem;
  padding: .5rem .65rem; border-radius: var(--rad, 12px); background: var(--alert-bg, #FDE8EC); }
.eh-conf-item.cerrado { background: var(--surface-2, #F4F7FA); }
.eh-conf-item b { color: var(--ink, #1B2330); }
.eh-conf-item p { margin: .1rem 0 0; color: var(--ink-soft, #5C6B7E); font-size: .76rem; }

/* En contraste forzado el color se pierde entero: la textura y la altura son lo único
   que queda, y por eso están. Se refuerza además con un borde. */
@media (forced-colors: active) {
  .eh-bar i { border: 1px solid CanvasText; }
  .eh-bar.t-ok i { background: Canvas; }
}
@media (prefers-reduced-motion: reduce) { .eh-rango { transition-duration: .01ms; } }
</style>
<script>
/**
 * =====================================================================================
 * HISTORIAL DE ESTADO POR FECHAS | Sistema de cotizaciones Ventel
 * =====================================================================================
 * Pinta la serie que devuelven opHistorialHorasPublico() y opHistorialPublico(): las dos
 * tienen la misma forma, así que el gráfico es UNO y solo cambia cómo rotula el eje. Es un
 * partial compartido a propósito:
 * el mismo gráfico se ve desde el tablero público (estado.html) y desde el panel de
 * supervisión (inicio_avanzado.html), y dos copias del mismo gráfico acabarían contando
 * cosas distintas en cuanto alguien tocara una.
 *
 *      AppEstadoHistorial.montar('mi-div', { dias: 14 });
 *
 * Es PÚBLICO: no necesita sesión. La pregunta "¿esto lleva pasando toda la semana?" hay
 * que poder contestarla justo cuando no puedes entrar, igual que la de "¿está caído ahora?".
 */
(function () {
  'use strict';

  /* ── LOS RANGOS, Y POR QUÉ EL PRIMERO ES DE HORAS ─────────────────────────
     Quien abre esto casi siempre acaba de tropezarse con algo, y lo que necesita saber es
     a qué hora empezó y si sigue subiendo. En una tira de días eso es UNA barra —la de
     hoy— y no dice nada de eso. Por eso se arranca en 24 h y los días quedan detrás, para
     la otra pregunta: "¿esto lleva pasando toda la semana?".

     El tope baja de 90 a 30 días. A los noventa las barras miden dos píxeles, ninguna se
     puede señalar con el ratón y lo único que queda es una mancha de color: eso es
     material para una tabla en un informe, no para una pantalla de operación. */
  var RANGOS = [
    { id: '24h', modo: 'horas', n: 24, rotulo: '24 h' },
    { id: '48h', modo: 'horas', n: 48, rotulo: '48 h' },
    { id: '7d',  modo: 'dias',  n: 7,  rotulo: '7 días' },
    { id: '14d', modo: 'dias',  n: 14, rotulo: '14 días' },
    { id: '30d', modo: 'dias',  n: 30, rotulo: '30 días' }
  ];
  var POR_OMISION = '24h';

  /* Dos cachés con dos vidas distintas: una serie por hora cambia mientras se mira, y
     enseñarla con diez minutos de retraso en plena caída es justo cuando peor sienta. */
  var TTL_DIAS = 10 * 60 * 1000;
  var TTL_HORAS = 2 * 60 * 1000;

  var host = null;
  var rango = RANGOS[0];
  var datos = null;
  var globo = null;

  function rangoPorId(id) {
    var s = String(id == null ? '' : id).trim().toLowerCase();
    for (var i = 0; i < RANGOS.length; i++) if (RANGOS[i].id === s) return RANGOS[i];
    return null;
  }
  /** Compatibilidad: quien monte con { dias: 14 } sigue pidiendo lo mismo. */
  function rangoPorDias(n) {
    for (var i = 0; i < RANGOS.length; i++) {
      if (RANGOS[i].modo === 'dias' && RANGOS[i].n === Number(n)) return RANGOS[i];
    }
    return null;
  }
  function rangoPorHoras(n) {
    for (var i = 0; i < RANGOS.length; i++) {
      if (RANGOS[i].modo === 'horas' && RANGOS[i].n === Number(n)) return RANGOS[i];
    }
    return null;
  }
  function porHoras() { return rango.modo === 'horas'; }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function reducido() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch (e) { return false; }
  }
  function conGsap() { return typeof window.gsap !== 'undefined' && !reducido(); }

  function llamar(fn, args) {
    if (window.AppRun && AppRun.call) return AppRun.call(fn, args, { key: 'eh-' + fn + '-' + rango.id });
    return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args);
    });
  }

  var NOMBRE_TONO = { ok: 'Sin reportes', warn: 'Algunos reportes', alert: 'Incidencia' };

  /** "12 ago" — corto, que es lo que cabe bajo una tira de treinta barras. */
  function fechaCorta(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
  }
  function fechaLarga(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  /* ── Rótulos de una hora ──────────────────────────────────────────────────
     La clave viaja como 'AAAA-MM-DD HH' en hora de la operación, y se rotula tal cual sin
     pasar por `new Date`: interpretarla como fecha la movería al huso del navegador, y un
     asesor en otro huso vería el pico de las 11 dibujado a las 9. Es la misma hora que
     enseña el resto del módulo. */
  function partesHora(clave) {
    var m = String(clave || '').match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{2})/);
    return m ? { a: m[1], mes: m[2], d: m[3], h: m[4] } : null;
  }
  /** "14:00" — lo que cabe debajo de una barra. */
  function horaCorta(clave) {
    var p = partesHora(clave);
    return p ? p.h + ':00' : String(clave || '');
  }
  /** "hoy a las 14:00", "ayer a las 03:00", "8 ago a las 22:00". */
  function horaLarga(clave) {
    var p = partesHora(clave);
    if (!p) return String(clave || '');
    var hoy = new Date();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var claveHoy = hoy.getFullYear() + '-' + pad(hoy.getMonth() + 1) + '-' + pad(hoy.getDate());
    var ayerD = new Date(hoy.getTime() - 86400000);
    var claveAyer = ayerD.getFullYear() + '-' + pad(ayerD.getMonth() + 1) + '-' + pad(ayerD.getDate());
    var dia = p.a + '-' + p.mes + '-' + p.d;
    var cuando = dia === claveHoy ? 'hoy' : (dia === claveAyer ? 'ayer' : fechaCorta(dia));
    return cuando + ' a las ' + p.h + ':00';
  }

  /** Rótulo corto y largo del tramo, sea hora o día. Un solo sitio donde se decide. */
  function tramoCorto(clave) { return porHoras() ? horaCorta(clave) : fechaCorta(clave); }
  function tramoLargo(clave) { return porHoras() ? horaLarga(clave) : fechaLarga(clave); }
  /** "24 horas" / "14 días", para las frases. */
  function tramosTexto() {
    var n = datos && datos.tramos ? datos.tramos : rango.n;
    return n + (porHoras() ? (n === 1 ? ' hora' : ' horas') : (n === 1 ? ' día' : ' días'));
  }

  // ── Globo de detalle ───────────────────────────────────────────────────────

  function verGlobo(bar, texto) {
    if (!globo) {
      globo = document.createElement('div');
      globo.className = 'eh-globo';
      globo.setAttribute('role', 'tooltip');
      document.body.appendChild(globo);
    }
    globo.innerHTML = texto;
    var r = bar.getBoundingClientRect();
    var g = globo.getBoundingClientRect();
    // Se centra sobre la barra y se mantiene dentro de la ventana: en la última barra,
    // pegada al borde derecho, un globo centrado se saldría de la pantalla.
    var x = Math.min(Math.max(8, r.left + r.width / 2 - g.width / 2), window.innerWidth - g.width - 8);
    var y = r.top - g.height - 8;
    if (y < 8) y = r.bottom + 8;
    // translate3d y no top/left: mover un elemento fijo con transform no cuesta layout.
    globo.style.transform = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)';
    globo.style.opacity = '1';
  }
  function ocultarGlobo() { if (globo) globo.style.opacity = '0'; }

  // ── Pintado ────────────────────────────────────────────────────────────────

  function tira(serie, nombreSistema) {
    return serie.map(function (d) {
      var estado = NOMBRE_TONO[d.tono] || '';
      // Cada barra es un <button>: se alcanza con el tabulador y anuncia su contenido a un
      // lector de pantalla. Una tira de <div> con color es invisible para quien no ve color.
      var etiqueta = tramoLargo(d.fecha) + ': ' + estado +
        (d.reportes ? ' · ' + d.reportes + ' reporte' + (d.reportes === 1 ? '' : 's') : '') +
        (d.confirmados ? ' · ' + d.confirmados + ' confirmada' + (d.confirmados === 1 ? '' : 's') : '');
      return '<button type="button" class="eh-bar t-' + d.tono + '" ' +
        'data-eh-dia="' + esc(d.fecha) + '" data-eh-sis="' + esc(nombreSistema || '') + '" ' +
        'aria-label="' + esc(etiqueta) + '"><i></i></button>';
    }).join('');
  }

  /** "3 horas con incidencias" / "3 días con incidencias" / "sin incidencias". */
  function malosTexto(n) {
    if (!n) return 'sin incidencias';
    return n + (porHoras() ? (n === 1 ? ' hora con incidencias' : ' horas con incidencias')
                           : (n === 1 ? ' día con incidencias' : ' días con incidencias'));
  }

  function filaSistema(s) {
    var malos = s.diasMalos || 0;
    return '<div class="eh-fila">' +
      '<div class="eh-nombre">' + esc(s.nombre) +
        '<small>' + malosTexto(malos) + '</small></div>' +
      '<div class="eh-tira" role="img" aria-label="Historial de ' + esc(s.nombre) +
        ': ' + esc(malosTexto(malos)) + ' de ' + esc(tramosTexto()) + '">' +
        tira(s.dias, s.nombre) + '</div>' +
      '<div class="eh-resumen"><b>' + (s.total || 0) + '</b>reportes</div>' +
    '</div>';
  }

  function pintar() {
    if (!host || !datos) return;

    var r = datos.resumen || {};
    var html =
      '<div class="eh-wrap">' +
        '<div class="eh-top">' +
          '<div class="eh-rangos" role="group" aria-label="Periodo del historial">' +
            RANGOS.map(function (x) {
              return '<button type="button" class="eh-rango" data-eh-rango="' + esc(x.id) + '" ' +
                'aria-pressed="' + (x.id === rango.id) + '">' + esc(x.rotulo) + '</button>';
            }).join('') +
          '</div>' +
          '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-eh-tabla ' +
                  'aria-expanded="false">Ver como tabla</button>' +
        '</div>' +

        /* El titular va en texto y no solo en el gráfico. Es la frase que alguien va a
           repetir en una reunión, y leerla de una tira de barras obliga a contarlas.
           `limpios` es el nombre neutro que sirve para las dos escalas; se cae a
           `diasLimpios` por si contesta un servidor todavía sin actualizar. */
        '<p style="margin:0;font-size:.86rem;color:var(--ink-soft,#5C6B7E)">' +
          '<strong style="color:var(--ink,#1B2330)">' +
            (r.limpios !== undefined ? r.limpios : (r.diasLimpios || 0)) +
            ' de ' + esc(tramosTexto()) + ' sin incidencias.</strong> ' +
          (r.confirmados
            ? r.confirmados + (r.confirmados === 1 ? ' falla confirmada' : ' fallas confirmadas') +
              ' y ' + (r.reportes || 0) + ' reportes en total.'
            : 'Ninguna falla confirmada en el periodo.') +
        '</p>' +

        '<div data-eh-filas>' +
          (datos.sistemas || []).map(filaSistema).join('') +
          '<div class="eh-fila eh-total">' +
            '<div class="eh-nombre">Todos<small>reportes del equipo</small></div>' +
            '<div class="eh-tira" role="img" aria-label="Historial de todos los sistemas">' +
              tira(datos.totales, 'Todos') + '</div>' +
            '<div class="eh-resumen"><b>' + (r.reportes || 0) + '</b>reportes</div>' +
          '</div>' +
        '</div>' +

        '<div class="eh-ejes"><span>' + esc(tramoCorto(datos.desde)) + '</span>' +
          '<span>' + esc(tramoCorto(datos.hasta)) + '</span></div>' +

        /* Leyenda SIEMPRE presente, y con la altura dibujada en la muestra: es la señal que
           distingue los tres estados sin depender del color. */
        '<div class="eh-leyenda">' +
          '<span><i class="eh-muestra t-ok"></i> Sin reportes</span>' +
          '<span><i class="eh-muestra t-warn"></i> Algunos reportes (1 a ' + (datos.umbral - 1) + ')</span>' +
          '<span><i class="eh-muestra t-alert"></i> Incidencia · ' + datos.umbral +
            ' personas o más, o falla confirmada</span>' +
        '</div>' +

        '<div data-eh-tabla-vista hidden></div>' +
        '<div data-eh-confirmados></div>' +
      '</div>';

    host.innerHTML = html;
    pintarConfirmados();
    cablear();

    if (conGsap()) {
      // scaleY desde 0, no height. Con 48 horas × 5 filas son 240 barras: animar la altura
      // recalcularía el layout de cada tira en cada fotograma. Así solo se escalan capas.
      var barras = host.querySelectorAll('.eh-bar i');
      if (barras.length) {
        gsap.fromTo(barras, { scaleY: 0 },
          { scaleY: 1, duration: .5, ease: 'power3.out', force3D: true,
            stagger: { amount: Math.min(.5, barras.length * .004) },
            clearProps: 'transform' });
      }
    }
  }

  /**
   * Las fallas confirmadas del periodo, en texto y de forma persistente.
   *
   * Es lo que pedía el requisito de transparencia: una vez confirmada, la falla se queda
   * publicada. El tablero de hoy deja de enseñarla cuando se resuelve —ya no afecta—, pero
   * aquí sigue. Un historial que se limpia solo al arreglar las cosas siempre enseña una
   * semana perfecta, y eso es peor que no tener historial.
   */
  function pintarConfirmados() {
    var caja = host.querySelector('[data-eh-confirmados]');
    if (!caja) return;
    var porDia = datos.confirmados || {};
    var dias0 = Object.keys(porDia).sort().reverse();
    if (!dias0.length) { caja.innerHTML = ''; return; }

    var items = [];
    dias0.forEach(function (f) {
      porDia[f].forEach(function (i) {
        items.push(
          '<div class="eh-conf-item' + (i.vigente ? '' : ' cerrado') + '">' +
            '<span style="flex:none;margin-top:.15rem">' +
              (i.vigente ? '⚠️' : '✓') + '</span>' +
            '<div><b>' + esc(i.titulo) + '</b>' +
            '<p>' + esc(tramoLargo(f)) + ' · ' + esc(i.estadoNombre) +
              (i.vigente ? ' · sigue abierta' : '') + '</p></div>' +
          '</div>');
      });
    });

    caja.innerHTML =
      '<h3 style="font-size:.9rem;font-weight:700;margin:.5rem 0 .5rem;color:var(--ink,#1B2330)">' +
        'Fallas confirmadas en el periodo</h3>' +
      '<div class="eh-conf">' + items.join('') + '</div>';
  }

  /** Vista de tabla: las mismas cifras en texto, para quien no puede leer el gráfico. */
  function pintarTabla() {
    var caja = host.querySelector('[data-eh-tabla-vista]');
    if (!caja) return '';
    var filas = datos.totales.map(function (d, i) {
      return '<tr><td>' + esc(tramoLargo(d.fecha)) + '</td>' +
        '<td>' + esc(NOMBRE_TONO[d.tono] || '') + '</td>' +
        '<td class="num">' + d.reportes + '</td>' +
        '<td class="num">' + (d.personas || 0) + '</td>' +
        '<td class="num">' + d.confirmados + '</td></tr>';
    }).reverse().join('');

    var rotuloEje = porHoras() ? 'Hora' : 'Día';
    caja.innerHTML =
      '<table class="eh-tabla"><caption class="sr-only">Reportes por ' +
        (porHoras() ? 'hora' : 'día') + '</caption><thead><tr>' +
        '<th scope="col">' + rotuloEje + '</th><th scope="col">Estado</th>' +
        '<th scope="col" class="num">Reportes</th><th scope="col" class="num">Personas</th>' +
        '<th scope="col" class="num">Confirmadas</th>' +
      '</tr></thead><tbody>' + filas + '</tbody></table>';
  }

  function cablear() {
    host.querySelectorAll('[data-eh-rango]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = rangoPorId(b.getAttribute('data-eh-rango'));
        if (!r || r.id === rango.id) return;
        rango = r;
        // Los datos anteriores son de otra escala: dejarlos puestos pintaría horas con
        // rótulos de días durante el medio segundo del viaje.
        datos = null;
        avisarRango();
        cargar(true);
      });
    });

    var btnTabla = host.querySelector('[data-eh-tabla]');
    if (btnTabla) {
      btnTabla.addEventListener('click', function () {
        // La caja se busca AL PULSAR, no al cablear. Mientras se espera otro periodo, la
        // cabecera sobrevive (es lo que deja volver a elegir) pero su panel de tabla ya no
        // está en el documento: con una referencia guardada, el botón cambiaba a «Ocultar
        // la tabla» sin enseñar ninguna tabla.
        var caja = host.querySelector('[data-eh-tabla-vista]');
        if (!caja || !datos) return;
        var abrir = caja.hidden;
        if (abrir) pintarTabla();
        caja.hidden = !abrir;
        btnTabla.setAttribute('aria-expanded', abrir ? 'true' : 'false');
        btnTabla.textContent = abrir ? 'Ocultar la tabla' : 'Ver como tabla';
      });
    }

    // Una sola escucha en el contenedor en vez de una por barra: con 450 barras, 450
    // escuchas es memoria y tiempo de arranque regalados.
    var filas = host.querySelector('[data-eh-filas]');
    if (!filas) return;

    var sobre = function (e) {
      var bar = e.target.closest ? e.target.closest('.eh-bar') : null;
      if (!bar) { ocultarGlobo(); return; }
      var dia = bar.getAttribute('data-eh-dia');
      var sis = bar.getAttribute('data-eh-sis');
      var serie = sis === 'Todos'
        ? datos.totales
        : ((datos.sistemas || []).filter(function (s) { return s.nombre === sis; })[0] || {}).dias || [];
      var d = serie.filter(function (x) { return x.fecha === dia; })[0];
      if (!d) return;

      verGlobo(bar,
        '<b>' + esc(tramoLargo(dia)) + '</b>' +
        esc(sis) + ' · ' + esc(NOMBRE_TONO[d.tono] || '') + '<br>' +
        '<em>' + d.reportes + ' reporte' + (d.reportes === 1 ? '' : 's') +
        (d.personas ? ' de ' + d.personas + ' persona' + (d.personas === 1 ? '' : 's') : '') +
        (d.confirmados ? ' · ' + d.confirmados + ' confirmada' + (d.confirmados === 1 ? '' : 's') : '') +
        '</em>');
    };

    filas.addEventListener('mouseover', sobre);
    filas.addEventListener('focusin', sobre);
    filas.addEventListener('mouseleave', ocultarGlobo);
    filas.addEventListener('focusout', ocultarGlobo);
  }

  // ── Carga ──────────────────────────────────────────────────────────────────

  /* ── La espera ────────────────────────────────────────────────────────────
     Cambiar de periodo borraba el gráfico ENTERO, botones incluidos: el clic se quedaba sin
     acuse y había que esperar al servidor para volver a elegir. Ahora la cabecera se
     conserva —es el mismo nodo, con sus escuchas— y solo se sustituye lo que ya no es
     cierto: las cifras y las tiras son del periodo anterior. */

  /** Sustituye todo menos la cabecera de periodos; si aún no hay cabecera, ocupa el hueco. */
  function cuerpoEspera(html) {
    var wrap = host.querySelector('.eh-wrap');
    var top = wrap ? wrap.querySelector('.eh-top') : null;
    if (!wrap || !top) { host.innerHTML = '<div class="eh-wrap">' + html + '</div>'; return; }
    wrap.innerHTML = '';
    wrap.appendChild(top);
    wrap.insertAdjacentHTML('beforeend', html);
  }

  /**
   * Esqueleto con la rejilla de .eh-fila (nombre · tira · reportes): dibuja la forma exacta
   * de lo que va a llegar, así que al aterrizar los datos no se mueve nada de sitio. Usa la
   * barra de brillo de VentelFX porque el motor no trae un esqueleto con esta forma; sin el
   * motor en la pantalla, se cae al aviso de siempre.
   */
  function esqueleto(n) {
    if (!window.VentelFX) {
      return '<div style="padding:2rem;text-align:center;color:var(--ink-soft,#5C6B7E)">' +
        '<div class="v-spinner"></div> Cargando el historial…</div>';
    }
    var fila = '<div class="eh-fila">' +
      '<span class="vfx-sk-b" style="width:75%"></span>' +
      '<div class="eh-tira"><span class="vfx-sk-b" style="width:100%;height:100%"></span></div>' +
      '<span class="vfx-sk-b" style="width:3.2rem;height:1.5rem"></span>' +
    '</div>';
    var s = '';
    for (var i = 0; i < n; i++) s += fila;
    return '<div class="vfx vfx-sk" style="gap:0">' + s + '</div>';
  }

  function esperar() {
    // Tantas filas como había: cambiar de periodo no cambia cuántos sistemas hay.
    var n = host.querySelectorAll('.eh-fila').length || 4;
    // El pulsado se mueve YA al periodo pedido, y la tabla vuelve a su rótulo cerrado: el
    // panel que abría desaparece con el resto del cuerpo.
    var tabla = host.querySelector('[data-eh-tabla]');
    if (tabla) {
      tabla.setAttribute('aria-expanded', 'false');
      tabla.textContent = 'Ver como tabla';
      // No hay cifras que enseñar hasta que conteste el periodo pedido: el botón se apaga
      // en vez de quedarse ofreciendo una tabla que no existe. pintar() lo repone entero.
      tabla.disabled = true;
    }
    host.querySelectorAll('[data-eh-rango]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-eh-rango') === rango.id));
    });
    cuerpoEspera(esqueleto(n));
  }

  function cargar(usarCache) {
    if (!host) return;
    if (!datos) esperar();

    /* Qué periodo se está pidiendo AQUÍ. Antes, cambiar de periodo borraba los botones
       hasta que contestaba el servidor, así que no había forma de tener dos peticiones en
       vuelo. Ahora los botones se quedan puestos —que es el punto—, y sin esta marca la
       respuesta lenta del periodo anterior pintaba sus cifras encima del que se acaba de
       pedir, con los rótulos de la escala nueva: horas rotuladas como días. */
    var pedido = rango.id;

    var deHoras = porHoras();
    var fn = deHoras ? 'opHistorialHorasPublico' : 'opHistorialPublico';
    // La clave lleva el id del rango entero y no solo el número: '24h' y '24d' pedirían
    // cosas distintas al servidor y compartir caché mezclaría las dos escalas.
    var clave = 'estado-historial-' + rango.id;

    if (window.AppRun && AppRun.swr) {
      return AppRun.swr(clave, fn, [rango.n], {
        ttl: deHoras ? TTL_HORAS : TTL_DIAS,
        fuerza: usarCache === false,
        accept: function (r) { return !!(r && r.success); },
        onData: function (r) {
          if (rango.id !== pedido) return;
          if (r && r.success) { datos = r; pintar(); }
        },
        onError: function () {
          if (rango.id !== pedido) return;
          // También aquí se conservan los botones de periodo: es la única salida que le
          // queda a quien acaba de tropezarse con el error.
          if (!datos) cuerpoEspera('<div style="padding:2rem;text-align:center;' +
            'color:var(--ink-soft,#5C6B7E)">No pudimos cargar el historial.</div>');
        }
      });
    }
    return llamar(fn, [rango.n]).then(function (r) {
      if (rango.id === pedido && r && r.success) { datos = r; pintar(); }
      return r;
    });
  }

  /* La pantalla que monta el gráfico decide qué hacer con el rango elegido —estado.html lo
     lleva a la barra de direcciones—. El módulo no escribe la URL él mismo: también vive
     dentro del feed de supervisión, donde es una tarjeta más y reescribir la dirección de
     esa pantalla por cambiar de rango sería pasarse. */
  var alCambiarRango = null;
  function avisarRango() {
    if (!alCambiarRango) return;
    try { alCambiarRango(rango.id); } catch (e) { console.error(e); }
  }

  window.AppEstadoHistorial = {
    /**
     * @param {Element|string} donde
     * @param {object=} opts
     *   rango      '24h' | '48h' | '7d' | '14d' | '30d' (gana sobre los demás)
     *   horas      24 | 48
     *   dias       7 | 14 | 30   (compatibilidad con las llamadas de antes)
     *   alCambiar  fn(idRango) cada vez que se elige otro periodo
     */
    montar: function (donde, opts) {
      host = (typeof donde === 'string') ? document.getElementById(donde) : donde;
      if (!host) return false;
      opts = opts || {};
      var r = (opts.rango && rangoPorId(opts.rango)) ||
              (opts.horas && rangoPorHoras(opts.horas)) ||
              (opts.dias && rangoPorDias(opts.dias)) ||
              rangoPorId(POR_OMISION);
      if (r) rango = r;
      if (typeof opts.alCambiar === 'function') alCambiarRango = opts.alCambiar;
      cargar(true);
      return true;
    },

    /** Cambia el periodo desde fuera (un enlace con ?rango=, atrás/adelante). */
    irARango: function (id, callado) {
      var r = rangoPorId(id);
      if (!r || r.id === rango.id) return false;
      rango = r;
      datos = null;
      if (!callado) avisarRango();
      cargar(true);
      return true;
    },
    /** El periodo que se está viendo, como id ('24h', '7d'…). */
    rango: function () { return rango.id; },
    /** Los periodos que existen, para quien quiera validar un parámetro de la URL. */
    rangos: function () { return RANGOS.map(function (x) { return x.id; }); },

    recargar: function () { datos = null; return cargar(false); },
    datos: function () { return datos; }
  };
})();
</script>
