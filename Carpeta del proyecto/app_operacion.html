<style>
/**
 * =====================================================================================
 * ESTADO DE OPERACIÓN · indicador global | Sistema de cotizaciones Ventel
 * =====================================================================================
 * Se incluye en TODAS las pantallas (después de app_core). Pinta una pastilla fija con el
 * estado de los sistemas, abre un panel con el detalle y contiene el formulario de reporte.
 *
 * ES AUTOSUFICIENTE A PROPÓSITO. El Portal (Index/Promociones) incluye app_core pero NO
 * app_theme, app_icons, app_motion ni el preflight de Tailwind. Por eso aquí:
 *   · se declara el propio box-sizing (sin él los botones miden lo que les da la gana),
 *   · cada var() lleva su valor de respaldo,
 *   · los iconos van en línea, sin depender de Icons.render(),
 *   · las media queries van en PX (las de rem/em no evalúan dentro de este iframe).
 *
 * JERARQUÍA: cuando todo funciona la pastilla es pequeña, verde y callada. Cuando algo
 * falla crece, cambia de color, late y dice QUÉ falla. El indicador tiene que ganarse la
 * atención solo cuando hay algo que mirar; si grita siempre, deja de significar nada.
 *
 * El color NUNCA viaja solo: cada estado lleva punto, icono y palabra.
 */

.op-root, .op-root *, .op-root *::before, .op-root *::after { box-sizing: border-box; }

.op-root {
  --op-ok:     #0E7A4F;  --op-ok-bg:     #E5F5EE;
  --op-warn:   #B45309;  --op-warn-bg:   #FDF1E0;
  --op-alert:  #C81E3C;  --op-alert-bg:  #FDE8EC;
  --op-info:   #1D4ED8;  --op-info-bg:   #EAF0FE;
  --op-neutro: #5C6B7E;  --op-neutro-bg: #F4F7FA;

  --op-surface: var(--surface, #FFFFFF);
  --op-surface-2: var(--surface-2, #F4F7FA);
  --op-ink: var(--ink, #1B2330);
  --op-ink-soft: var(--ink-soft, #5C6B7E);
  --op-line: var(--line, #E4E9F0);
  --op-brand: var(--brand, #E10098);

  --op-s1: 4px; --op-s2: 8px; --op-s3: 12px; --op-s4: 16px; --op-s5: 24px; --op-s6: 32px;
  --op-rad: 12px; --op-rad-sm: 8px; --op-rad-lg: 16px;
  --op-sh: 0 12px 28px -10px rgba(16,24,40,.22), 0 3px 8px -4px rgba(16,24,40,.12);

  /* La pastilla flota sobre pantallas de cualquier color, así que su sombra se arma en
     dos capas: un contacto muy corto que la despega del fondo y una difusa y larga que
     le da altura sin ensuciar lo que tiene debajo. Una sola sombra ancha la hacía
     parecer un recuadro gris pegado a la esquina. */
  --op-sh-pastilla: 0 1px 2px rgba(16,24,40,.06), 0 10px 26px -14px rgba(16,24,40,.38);
  --op-sh-pastilla-alta: 0 2px 5px rgba(16,24,40,.07), 0 18px 38px -16px rgba(16,24,40,.46);
  --op-brillo: inset 0 1px 0 rgba(255,255,255,.65);

  --op-f: var(--f-ui, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);

  font-family: var(--op-f);
}

/* Tema oscuro: los tonos de arriba están elegidos para fondo claro y sobre #1C2027 caen
   a ~2,5:1. Se aclaran SOLO aquí; el token global se sigue usando como fondo en otras
   pantallas y aclararlo allí las rompería. */
[data-theme="carbon"] .op-root {
  --op-ok: #4ADE80;   --op-ok-bg: rgba(74,222,128,.14);
  --op-warn: #F2B65A; --op-warn-bg: rgba(242,182,90,.14);
  --op-alert: #FCA5A5;--op-alert-bg: rgba(252,165,165,.14);
  --op-info: #93B4FF; --op-info-bg: rgba(147,180,255,.14);
  --op-neutro: #A7A2AC; --op-neutro-bg: rgba(167,162,172,.12);

  /* Sobre fondo oscuro una sombra clara no existe: lo que separa la pastilla del fondo
     es una sombra mucho más densa y un filo de luz de una décima parte de fuerza. */
  --op-sh-pastilla: 0 1px 2px rgba(0,0,0,.44), 0 12px 30px -14px rgba(0,0,0,.72);
  --op-sh-pastilla-alta: 0 2px 6px rgba(0,0,0,.5), 0 20px 42px -16px rgba(0,0,0,.8);
  --op-brillo: inset 0 1px 0 rgba(255,255,255,.07);
}

/* ── Pestaña fija ──────────────────────────────────────────────────────────── */
/*
 * El indicador se ve encima de TODAS las pantallas del sistema, incluidas las que ya
 * están llenas (cotización, revisión, consola). Ha pasado por dos formas antes de esta:
 * primero un letrero blanco siempre desplegado —"Sistemas operando"—, que no decía nada
 * nuevo el 99 % del tiempo; después un disco de cristal translúcido, que resolvía el
 * tamaño pero se leía como una burbuja flotando sin sitio: encima de una tabla clara
 * apenas existía y encima de una imagen se ensuciaba con lo que tenía detrás.
 *
 * AHORA ES UNA PESTAÑA ANCLADA AL BORDE. Nace del canto izquierdo de la ventana
 * (left: 0, esquina izquierda recta y radio solo hacia dentro), es OPACA —sin cristal,
 * sin desenfoque, sin transparencia— y lleva el color del estado en un LOMO vertical de
 * 4 px pegado a ese borde. Es la diferencia de fondo con las dos versiones anteriores:
 * ya no flota, está sujeta a la ventana, así que el ojo la clasifica como parte del
 * marco de la aplicación y no como un elemento del contenido que hay debajo.
 *
 * En reposo mide lo que mide el lomo más el pulso: unos 44 px de ancho, sin texto. La
 * frase se despliega al apuntarla, al enfocarla con el teclado o —sin que nadie la
 * toque— cuando algo falla, que es cuando ocupar sitio está justificado.
 *
 * ── SOBRE EL DISCO DE "CONSULTANDO" (AppBusy, app_core.html) ─────────────────────
 *
 * Durante un tiempo estas dos piezas fueron gemelas a propósito: mismo diámetro, mismo
 * cristal, misma sombra. Ya no, y es deliberado. Son cosas distintas y ahora se ven
 * distintas:
 *
 *   · El disco de arriba a la derecha es PASAJERO. Aparece mientras el servidor
 *     responde y se va solo. Flota porque dura tres segundos: flotar es lo correcto
 *     para algo que no va a estar cuando vuelvas a mirar.
 *   · Esta pestaña es PERMANENTE. Está en todas las pantallas, toda la sesión. Lo
 *     permanente se ancla; lo que se ancla no compite con el contenido.
 *
 * Así que NO hay que volver a emparejarlas: tocar el disco no obliga a tocar esto.
 * Lo único que siguen compartiendo es la gramática de color y el easing.
 */

.op-pill {
  --op-tono: var(--op-ok);
  /* --op-pill-suelo lo pone la pantalla que tenga algo pegado abajo (la barra de
     navegación del móvil en Index). Sin él la pestaña se sienta encima de un botón de
     esa barra y tapa justo lo que hay que tocar. */
  position: fixed; left: 8px; bottom: calc(16px + var(--op-pill-suelo, 0px)); z-index: 900;
  display: inline-flex; align-items: center; justify-content: flex-start;
  height: 28px; padding: 0 5px; /* Círculo perfecto de 28x28px al estar cerrado */
  border-radius: 14px; 
  background: var(--op-surface);
  border: 1px solid color-mix(in srgb, var(--op-line) 40%, transparent);
  color: var(--op-ink);
  box-shadow: 0 4px 12px -4px rgba(0,0,0,0.12), 0 2px 4px -2px rgba(0,0,0,0.08);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  /* La expansión principal de texto ahora la maneja GSAP */
  max-width: calc(100vw - 32px);
  overflow: hidden;
}

.op-pill:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px -4px rgba(0,0,0,0.15), 0 4px 8px -4px rgba(0,0,0,0.1);
}

.op-pill::before { display: none; }

.op-pill:active { transform: translateY(0) scale(0.98); }
.op-pill:focus-visible { outline: 2px solid var(--op-brand); outline-offset: 3px; }
.op-pill[hidden] { display: none; }

/* Ícono sólido y sutil */
.op-pill-sig { display: flex; align-items: center; justify-content: center; flex: none; color: var(--op-tono);
  width: 18px; height: 18px; border-radius: 50%;
  background: color-mix(in srgb, var(--op-tono) 12%, transparent);
  transition: transform 0.3s ease; }
.op-pill:hover .op-pill-sig { transform: scale(1.1); }
.op-pill-sig svg { width: 12px; height: 6px; display: block; }

/* Texto animado con GSAP */
.op-pill-tx {
  display: block; max-width: 0; margin-left: 0; padding: 0; opacity: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--op-f); font-size: 11.5px; font-weight: 600; letter-spacing: 0; line-height: 1;
}
/* Fallback si no hay GSAP activo en hover o cuando se despliega forzosamente por incidencia */
.op-pill.op-desplegada .op-pill-tx {
  max-width: 15rem; margin-left: 6px; padding-right: 4px; opacity: 1;
  transition: max-width 0.5s cubic-bezier(0.19, 1, 0.22, 1), margin-left 0.5s cubic-bezier(0.19, 1, 0.22, 1), padding 0.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.3s ease;
}

.op-pill-ic { width: 14px; height: 14px; flex: none; }

/* Cuando todo funciona el color lo ponen SOLO el lomo y el pulso: la frase en verde se
   leía como un aviso más, y "todo bien" no es un aviso.

   Y además se retira medio paso. "Todo bien" es la respuesta que ya se da por supuesta:
   tiene que estar consultable, no presente. En reposo la pestaña baja a 0,8 de opacidad
   —se ve si la buscas, no te interrumpe si no— y recupera el 100 % en cuanto la apuntas
   o la enfocas con el teclado. Los demás tonos NO se atenúan nunca: un aviso a media
   tinta es un aviso a medias.

   0,8 ES EL SUELO, no un gusto. El verde sobre blanco a esa opacidad da 3,66:1, y el
   mínimo AA para un elemento gráfico que porta información es 3:1. Si hay que hacerla
   más discreta, estréchala o acorta el lomo; no le bajes la opacidad. */
.op-pill.tono-ok     { --op-tono: var(--op-ok); }
.op-pill.tono-warn   { --op-tono: var(--op-warn); }
.op-pill.tono-alert  { --op-tono: var(--op-alert); }
.op-pill.tono-info   { --op-tono: var(--op-info); }

/* ── ISLA DINÁMICA ───────────────────────────────────────────────────────────
   La misma pestaña, prestada un momento a otra cosa.

   Antes el guardado en segundo plano dibujaba SU pastilla en esta misma esquina y
   las dos se tapaban. Se quitó aquella: cuando algo sube, esta pestaña se ensancha,
   cambia de tono, su trazo se transforma en una rampa que asciende y dice cuántos
   cambios faltan. Al terminar, el trazo se vuelve una palomita un segundo y medio y
   la pestaña regresa a lo suyo. No aparece nada nuevo en pantalla: lo que ya estaba
   ahí es lo que informa, que es la única forma de que una esquina no se llene de
   avisos compitiendo.

   El color de la marca en vez de verde a propósito: guardar no es un estado de
   salud del sistema, y usar el verde de "todo bien" para "estoy subiendo algo"
   confundiría las dos cosas justo en el sitio donde se leen de reojo. */
.op-pill.tono-guardando { --op-tono: var(--op-brand); }

.op-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

/* La transición de color la lleva CSS y la de forma GSAP: cada una a lo que sabe.
   Se excluye `transform`, que es de GSAP durante el morfismo y no admite dos dueños. */
.op-pill, .op-pill-sig { transition: background-color .35s ease, color .35s ease; }

/* Mientras la isla está puesta, la pestaña no reacciona al ratón: no es un botón que
   invita a pulsarse, es un parte de lo que está ocurriendo. Sigue siendo pulsable
   —abre el panel de estado, como siempre— pero deja de crecer al apuntarla, que
   pelearía con el ancho que está animando GSAP. */
.op-pill.op-isla:hover { transform: none; }
.op-pill.op-isla:hover .op-pill-sig { transform: none; }

/* El ancho lo sigue dando .op-desplegada —la isla se pone siempre con esa clase—, así
   que el ensanchado reutiliza exactamente la misma transición que el rótulo de estado
   al desplegarse. Una segunda regla de ancho aquí solo serviría para que un día las
   dos dijeran cosas distintas. */
/* El fondo y color general ahora siempre lo da el cristal esmerilado, no sobreescribimos */

/* Solo lo que ESPERA algo se mueve. Es la única animación permanente del módulo, y por
   eso se distingue sin tener que leerla.

   Se mueve el LOMO, con una luz que lo recorre de abajo arriba: no parpadea nada, así
   que de reojo nunca parece que el indicador se haya caído —que es justo lo que pasaba
   cuando la señal se apagaba media animación—. Y como el lomo está pegado al canto de
   la ventana, el movimiento se ve incluso con la pestaña plegada. */
.op-pill.late::before {
  background: linear-gradient(to bottom,
    var(--op-tono) 0%,
    color-mix(in srgb, var(--op-tono) 35%, #FFFFFF) 50%,
    var(--op-tono) 100%);
  background-size: 100% 300%;
  animation: op-barrido 2.6s cubic-bezier(.4,0,.35,1) infinite;
}
@keyframes op-barrido {
  0%   { background-position: 0 100%; }
  60%  { background-position: 0 0%; }
  100% { background-position: 0 0%; }
}
@supports not (color: color-mix(in srgb, red 50%, transparent)) {
  /* Sin color-mix no hay degradado que valga: el lomo se ensancha y se queda quieto,
     que sigue siendo una señal distinta de la de "todo bien". */
  .op-pill.late::before { width: 6px; animation: none; }
}

/* El contador de sistemas afectados. Cuadrado con las esquinas suavizadas, no redondo:
   es un número, y la pestaña ya no tiene ninguna otra forma circular con la que rimar. */
.op-cont { display: inline-flex; align-items: center; justify-content: center;
  min-width: 19px; height: 19px; margin-left: 8px; padding: 0 5px; border-radius: 6px;
  background: currentColor; font-size: 11px; font-weight: 800; flex: none;
  font-variant-numeric: tabular-nums; }
.op-cont span { color: var(--op-surface); }

/* ── Panel deslizante ──────────────────────────────────────────────────────── */

.op-scrim {
  position: fixed; inset: 0; z-index: 950;
  background: rgba(16,24,40,.45);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.op-scrim.abierto { opacity: 1; pointer-events: auto; }

.op-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 960;
  width: 420px; max-width: 100vw;
  background: var(--op-surface); color: var(--op-ink);
  border-left: 1px solid var(--op-line);
  box-shadow: -18px 0 44px -22px rgba(16,24,40,.45);
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  font-family: var(--op-f);
}
.op-panel.abierto { transform: translateX(0); }

.op-head {
  display: flex; align-items: flex-start; gap: var(--op-s3);
  padding: var(--op-s5) var(--op-s5) var(--op-s4);
  border-bottom: 1px solid var(--op-line); flex: none;
}
.op-head-ic { width: 40px; height: 40px; border-radius: var(--op-rad); flex: none;
  display: flex; align-items: center; justify-content: center; }
.op-head-ic svg { width: 21px; height: 21px; }
.op-head-ic.tono-ok    { background: var(--op-ok-bg);    color: var(--op-ok); }
.op-head-ic.tono-warn  { background: var(--op-warn-bg);  color: var(--op-warn); }
.op-head-ic.tono-alert { background: var(--op-alert-bg); color: var(--op-alert); }
.op-head-ic.tono-info  { background: var(--op-info-bg);  color: var(--op-info); }

.op-head-tx { flex: 1; min-width: 0; }
.op-head h2 { margin: 0 0 2px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
.op-head p  { margin: 0; font-size: 13px; color: var(--op-ink-soft); line-height: 1.45; }

.op-cerrar { width: 34px; height: 34px; flex: none; border-radius: var(--op-rad-sm);
  border: 1px solid transparent; background: transparent; color: var(--op-ink-soft);
  cursor: pointer; display: flex; align-items: center; justify-content: center; }
.op-cerrar:hover { background: var(--op-surface-2); color: var(--op-ink); }
.op-cerrar:focus-visible { outline: 2px solid var(--op-brand); outline-offset: 2px; }
.op-cerrar svg { width: 18px; height: 18px; }

.op-cuerpo { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: var(--op-s4) var(--op-s5) var(--op-s5); }
.op-pie { flex: none; padding: var(--op-s3) var(--op-s5) var(--op-s4); border-top: 1px solid var(--op-line);
  display: flex; flex-direction: column; gap: var(--op-s2); }

/* ── Rótulos de sección ────────────────────────────────────────────────────── */

.op-rotulo { display: flex; align-items: center; gap: var(--op-s2);
  font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--op-ink-soft); margin: var(--op-s5) 0 var(--op-s3); }
.op-rotulo:first-child { margin-top: 0; }
.op-rotulo::after { content: ''; flex: 1; height: 1px; background: var(--op-line); }

/* ── Rejilla de sistemas ───────────────────────────────────────────────────── */

.op-sistemas { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--op-s2); }
.op-sis {
  display: flex; align-items: center; gap: var(--op-s2);
  padding: 10px 12px; border-radius: var(--op-rad); border: 1px solid var(--op-line);
  background: var(--op-surface-2); min-width: 0;
}
.op-sis-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--op-ok); }
.op-sis-tx { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.op-sis-tx b { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-sis-tx small { font-size: 11px; color: var(--op-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-sis.tono-warn  { border-color: var(--op-warn);  background: var(--op-warn-bg); }
.op-sis.tono-alert { border-color: var(--op-alert); background: var(--op-alert-bg); }
.op-sis.tono-info  { border-color: var(--op-info);  background: var(--op-info-bg); }
.op-sis.tono-warn  .op-sis-dot { background: var(--op-warn); }
.op-sis.tono-alert .op-sis-dot { background: var(--op-alert); }
.op-sis.tono-info  .op-sis-dot { background: var(--op-info); }
.op-sis.tono-warn  .op-sis-tx small,
.op-sis.tono-alert .op-sis-tx small,
.op-sis.tono-info  .op-sis-tx small { color: inherit; opacity: .85; font-weight: 600; }
.op-sis.tono-warn  { color: var(--op-warn); }
.op-sis.tono-alert { color: var(--op-alert); }
.op-sis.tono-info  { color: var(--op-info); }
.op-sis.tono-warn .op-sis-tx b, .op-sis.tono-alert .op-sis-tx b, .op-sis.tono-info .op-sis-tx b { color: inherit; }

/* ── Tarjeta de incidencia ─────────────────────────────────────────────────── */

.op-inc {
  display: block; width: 100%; text-align: left;
  padding: var(--op-s3) var(--op-s4); margin-bottom: var(--op-s2);
  border-radius: var(--op-rad); border: 1px solid var(--op-line);
  background: var(--op-surface); color: var(--op-ink);
  cursor: pointer; font-family: var(--op-f);
  transition: transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s, box-shadow .18s;
}
.op-inc:hover { transform: translateY(-1px); box-shadow: var(--op-sh); }
.op-inc:focus-visible { outline: 2px solid var(--op-brand); outline-offset: 2px; }
.op-inc.tono-warn  { border-left: 3px solid var(--op-warn); }
.op-inc.tono-alert { border-left: 3px solid var(--op-alert); }
.op-inc.tono-info  { border-left: 3px solid var(--op-info); }
.op-inc.tono-ok    { border-left: 3px solid var(--op-ok); }

.op-inc-top { display: flex; align-items: center; gap: var(--op-s2); margin-bottom: 5px; flex-wrap: wrap; }
.op-inc-tit { margin: 0 0 4px; font-size: 14px; font-weight: 650; line-height: 1.35; }
.op-inc-nota { margin: 0; font-size: 12.5px; color: var(--op-ink-soft); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.op-inc-pie { display: flex; align-items: center; gap: var(--op-s2); margin-top: 8px;
  font-size: 11.5px; color: var(--op-ink-soft); }
.op-inc-pie .op-ver { margin-left: auto; color: var(--op-brand); font-weight: 650; display: inline-flex; align-items: center; gap: 3px; }
.op-inc-pie .op-ver svg { width: 13px; height: 13px; }

.op-chip { display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px 2px 7px; border-radius: 999px;
  font-size: 11px; font-weight: 700; line-height: 1.5; border: 1px solid transparent; }
.op-chip svg { width: 12px; height: 12px; flex: none; }
.op-chip.tono-ok     { background: var(--op-ok-bg);     color: var(--op-ok);     border-color: var(--op-ok); }
.op-chip.tono-warn   { background: var(--op-warn-bg);   color: var(--op-warn);   border-color: var(--op-warn); }
.op-chip.tono-alert  { background: var(--op-alert-bg);  color: var(--op-alert);  border-color: var(--op-alert); }
.op-chip.tono-info   { background: var(--op-info-bg);   color: var(--op-info);   border-color: var(--op-info); }
.op-chip.tono-neutro { background: var(--op-neutro-bg); color: var(--op-neutro); border-color: var(--op-line); }

/* ── Estado vacío / carga / error ──────────────────────────────────────────── */

.op-vacio { text-align: center; padding: var(--op-s6) var(--op-s4); color: var(--op-ink-soft); }
.op-vacio-ic { width: 46px; height: 46px; margin: 0 auto var(--op-s3); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--op-ok-bg); color: var(--op-ok); }

    scrim = raiz.querySelector('#op-scrim');
    cuerpo = raiz.querySelector('#op-cuerpo');
    pie = raiz.querySelector('#op-pie');

    pastilla.addEventListener('click', function () { abrir(this); });
    scrim.addEventListener('click', function () { cerrar(); });

    // El rótulo se despliega al apuntar… salvo mientras la pestaña está prestada al
    // guardado: ahí el ancho lo lleva la isla, y dos dueños animando el mismo max-width
    // se pisan y dejan el texto cortado a media palabra.
    pastilla.addEventListener('mouseenter', function() {
      if (window.gsap && !isla.activa && !pastilla.classList.contains('op-desplegada')) {
        gsap.to(pastilla.querySelector('.op-pill-tx'), {
          maxWidth: 240, marginLeft: 6, paddingRight: 4, opacity: 1, duration: 0.5, ease: "expo.out", overwrite: "auto"
        });
      }
    });
    pastilla.addEventListener('mouseleave', function() {
      if (window.gsap && !isla.activa && !pastilla.classList.contains('op-desplegada')) {
        gsap.to(pastilla.querySelector('.op-pill-tx'), {
          maxWidth: 0, marginLeft: 0, paddingRight: 0, opacity: 0, duration: 0.4, ease: "power2.inOut", overwrite: "auto"
        });
      }
    });

    // La pestaña se ofrece como indicador del guardado en segundo plano. Va aquí,
    // al montarla, y no al cargar el módulo: hasta este punto no existe el nodo que
    // habría que transformar.
    if (window.AppGuardado && AppGuardado.delegarIndicador) {
      AppGuardado.delegarIndicador(pintarIsla);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && abierto) { e.stopPropagation(); cerrar(); }
      if (e.key === 'Tab' && abierto) atraparFoco(e);
    });

    document.querySelectorAll('[data-operacion-abrir]').forEach(function (el) {
      el.addEventListener('click', function (ev) { ev.preventDefault(); abrir(el); });
    });
    document.querySelectorAll('[data-operacion-reportar]').forEach(function (el) {
      el.addEventListener('click', function (ev) {
        ev.preventDefault();
        abrir(el, 'reporte', el.getAttribute('data-operacion-reportar') || '');
      });
    });
  }

  /** El foco no se escapa del panel mientras está abierto. */
  function atraparFoco(e) {
    var focos = panel.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focos.length) return;
    var primero = focos[0], ultimo = focos[focos.length - 1];
    if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     ISLA DINÁMICA · la pestaña prestada al guardado en segundo plano
     ═══════════════════════════════════════════════════════════════════════════
     app_guardado sabe cuánto falta por subir pero no dónde enseñarlo; esta pestaña
     ya ocupa la esquina. Se reclama el indicador y se pinta aquí, cambiando de
     forma en vez de apilar una pastilla encima de otra.

     TRES REGLAS QUE NO SON OBVIAS:

      1. Mientras la isla está puesta, pintarPastilla() NO toca el DOM. Reconstruye
         el innerHTML entero, y hacerlo a media transformación arrancaría el <path>
         que GSAP está interpolando —la animación no falla, simplemente desaparece a
         mitad—. El estado que llegue durante ese rato se pinta al devolver la pestaña.

      2. Se guarda el HTML anterior y se restaura tal cual. La pestaña normal tiene
         variantes (contador de sistemas, rótulo desplegado, clase `late`) y
         reconstruirlas de memoria aquí sería copiar una lógica que ya vive treinta
         líneas más abajo, con la garantía de que las dos copias divergirían.

      3. Sin MorphSVGPlugin el trazo cambia con un cruce de opacidad en vez de
         transformarse. Se ve peor y se entiende igual; lo que no puede pasar es que
         la esquina se quede muda porque no cargó un plugin de un CDN. */

  /* `saliendo` no es lo mismo que `!activa`: el regreso dura casi medio segundo y en
     ese rato puede empezar otro guardado. Si `activa` se apagara al empezar a volver,
     el guardado nuevo reconstruiría la pestaña y la animación de regreso —que sigue
     corriendo— acabaría restaurando el estado ENCIMA de lo recién puesto. Con las dos
     banderas, empezar a guardar durante el regreso simplemente lo cancela. */
  var isla = { activa: false, saliendo: false, clasePrevia: '', temporizador: null, tl: null, latido: null };

  var morphListo;
  function hayMorph() {
    if (typeof morphListo !== 'undefined') return morphListo;
    try {
      if (typeof MorphSVGPlugin === 'undefined' || !window.gsap) { morphListo = false; return false; }
      // El registro es idempotente, pero se hace UNA vez: esto se pregunta en cada
      // cambio de estado y registrar un plugin no es gratis.
      gsap.registerPlugin(MorphSVGPlugin);
      morphListo = true;
    } catch (e) { morphListo = false; }
    return morphListo;
  }

  /** El <path> del trazo de la pestaña, para transformarlo. */
  function trazoActual() {
    return pastilla ? pastilla.querySelector('.op-pill-sig path') : null;
  }

  function entrarEnIsla() {
    if (isla.activa || !pastilla) return;
    isla.activa = true;
    isla.clasePrevia = pastilla.className;
    // La pestaña puede estar oculta si el estado todavía no ha llegado del servidor;
    // guardar algo tiene que verse igual, así que se enseña.
    pastilla.hidden = false;
    pastilla.innerHTML =
      '<span class="op-pill-sig">' + IC.pulso + '</span>' +
      '<span class="op-pill-tx"></span>';
  }

  /** Devuelve la pestaña a lo suyo: el trazo vuelve al latido y se repinta el estado. */
  function salirDeIsla() {
    if (!isla.activa || isla.saliendo || !pastilla) return;
    isla.saliendo = true;
    clearTimeout(isla.temporizador);
    if (isla.tl) { isla.tl.kill(); isla.tl = null; }
    if (isla.latido) { isla.latido.kill(); isla.latido = null; }

    var sr = raiz && raiz.querySelector('#op-sr');
    if (sr) sr.textContent = '';

    var restaurar = function () {
      // Si mientras volvía arrancó otro guardado, la isla ya está reclamada de nuevo:
      // restaurar ahora borraría el estado que se acaba de poner.
      if (!isla.saliendo) return;
      isla.saliendo = false;
      isla.activa = false;
      if (window.gsap) gsap.set(pastilla, { clearProps: 'transform' });
      // Se repinta desde el ESTADO REAL, no desde el HTML que había antes: el guardado
      // pudo durar más que el sondeo de operación y devolver la foto vieja enseñaría un
      // estado caducado. Si todavía no hay estado, pintarPastilla esconde la pestaña,
      // que es justo lo que hacía antes de que se la tomáramos prestada.
      pastilla.className = isla.clasePrevia || 'op-pill tono-ok';
      pintarPastilla();
    };

    var path = trazoActual();
    if (!conGsap() || !path || !hayMorph()) { restaurar(); return; }

    // El trazo vuelve al latido ANTES de soltar la pestaña. Sin esto, la palomita
    // desaparecía de golpe y el regreso se veía como un corte, no como el final del
    // mismo gesto.
    isla.tl = gsap.timeline({ onComplete: restaurar });
    isla.tl.to(path, { morphSVG: TRAZO.pulso, duration: .42, ease: 'power3.inOut' }, 0);
    isla.tl.to(pastilla, { scaleX: 1, scaleY: 1, duration: .3, ease: 'power2.out' }, 0);
  }

  /**
   * Pinta un estado de guardado en la pestaña.
   * @param {{modo:string, texto:string, pendientes:number}} s
   */
  function pintarIsla(s) {
    if (!pastilla) return;
    // Cancela un regreso a medias: la pestaña ya estaba puesta y solo cambia de estado,
    // así que se sigue transformando desde la forma que tenga ahora mismo.
    isla.saliendo = false;
    entrarEnIsla();
    clearTimeout(isla.temporizador);

    var tono = s.modo === 'error' ? 'alert' : (s.modo === 'hecho' ? 'ok' : 'guardando');
    var forma = s.modo === 'error' ? TRAZO.falla : (s.modo === 'hecho' ? TRAZO.hecho : TRAZO.subiendo);

    pastilla.className = 'op-pill op-isla op-desplegada tono-' + tono;
    pastilla.setAttribute('aria-label', s.texto + '. Abrir el estado de los sistemas.');

    var tx = pastilla.querySelector('.op-pill-tx');
    var sr = raiz.querySelector('#op-sr');
    var sig = pastilla.querySelector('.op-pill-sig');
    var path = trazoActual();
    if (sr) sr.textContent = s.texto;

    if (!conGsap()) {
      tx.textContent = s.texto;
      if (path) path.setAttribute('d', forma);
    } else {
      // El texto se cambia en el punto muerto de un pequeño rebote, no de golpe: es lo
      // que hace que se lea como UNA pieza que cambia y no como dos letreros distintos.
      if (isla.tl) isla.tl.kill();
      isla.tl = gsap.timeline();
      isla.tl.to(pastilla, { scaleX: 1.04, scaleY: .93, duration: .16, ease: 'power2.out',
                             transformOrigin: 'left center' }, 0);
      isla.tl.add(function () { tx.textContent = s.texto; }, .12);
      isla.tl.to(pastilla, { scaleX: 1, scaleY: 1, duration: .5, ease: 'elastic.out(1, .62)' }, .16);

      // El disco del trazo acompaña el rebote. A 12×6 px el cambio de forma es
      // pequeño; sin este golpe de escala el morfismo se pierde y solo se nota que
      // ha cambiado el texto.
      if (sig) isla.tl.fromTo(sig, { scale: .82 },
        { scale: 1, duration: .55, ease: 'back.out(2.6)', clearProps: 'transform' }, .06);

      if (path) {
        if (hayMorph()) isla.tl.to(path, { morphSVG: forma, duration: .55, ease: 'power3.inOut' }, 0);
        else isla.tl.to(path, { opacity: 0, duration: .12, ease: 'power1.in',
                                onComplete: function () { path.setAttribute('d', forma); } }, 0)
                    .to(path, { opacity: 1, duration: .2, ease: 'power1.out' }, .14);
      }
    }

    // Mientras sube, algo tiene que moverse. El lomo animado de la pestaña está
    // desactivado en este diseño (.op-pill::before { display:none }), así que la señal
    // de "esto sigue en marcha" la lleva el propio trazo, subiendo y bajando despacio.
    // Sin ella, una subida lenta se ve idéntica a una pestaña colgada.
    if (isla.latido) { isla.latido.kill(); isla.latido = null; }
    if (s.modo === 'guardando' && conGsap() && path) {
      isla.latido = gsap.fromTo(path, { yPercent: 6 },
        { yPercent: -6, duration: .9, ease: 'sine.inOut', repeat: -1, yoyo: true, delay: .5 });
    } else if (path && window.gsap) {
      // Se vuelve al centro ANIMANDO, no de un salto: el latido pudo quedarse parado
      // arriba o abajo, y un clearProps ahí da un tirón justo cuando la palomita entra.
      gsap.to(path, { yPercent: 0, duration: .3, ease: 'power2.out', overwrite: 'auto' });
    }

    // Un guardado en curso se queda puesto hasta que termine. Un desenlace se enseña
    // y se retira solo: dejar "Todo guardado" para siempre convertiría el indicador de
    // estado en un cartel de otra cosa.
    if (s.modo !== 'guardando') {
      isla.temporizador = setTimeout(salirDeIsla, s.modo === 'error' ? 6000 : 1800);
    }
  }

  /* ── Pastilla ───────────────────────────────────────────────────────────── */

  function pintarPastilla() {
    if (!pastilla) return;
    // Mientras la isla está prestada, el estado se guarda y se pinta al devolverla.
    if (isla.activa) return;
    var e = estado && estado.estado ? estado.estado : estado;
    if (!e || !e.success) { pastilla.hidden = true; return; }

    var afectados = (e.sistemas || []).filter(function (s) { return s.tono !== 'ok'; });
    var tono = e.global || 'ok';
    var texto, late = false;

    if (!afectados.length) {
      texto = 'Sistemas operando';
    } else if (afectados.length === 1) {
      texto = afectados[0].nombre + ': ' + afectados[0].estadoNombre.toLowerCase();
      late = afectados[0].tono !== 'ok';
    } else {
      texto = afectados.length + ' sistemas con incidencias';
      late = true;
    }

    // Si todo va bien la pastilla es un disco sin texto, y un disco solo no dice qué es.
    // La primera vez que aparece se presenta con su rótulo y se recoge sola: se entiende
    // qué es sin dejar un letrero puesto el resto de la sesión. El estado vive fuera de
    // esta función porque el mismo estado se repinta dos veces (caché y servidor) y el
    // segundo pintado cortaría la presentación a media frase.
    if (!presentada) {
      presentada = true;
      presentando = true;
      setTimeout(function () { presentando = false; pintarPastilla(); }, 3400);
    }

    // Con incidencias el rótulo se queda desplegado: no se puede pedir que alguien pase
    // el ratón por encima para enterarse de que un sistema está caído.
    var desplegada = afectados.length > 0 || presentando;

    pastilla.className = 'op-pill tono-' + tono + (late ? ' late' : '') +
                         (desplegada ? ' op-desplegada' : '');
    pastilla.innerHTML =
      '<span class="op-pill-sig">' + IC.pulso + '</span>' +
      '<span class="op-pill-tx">' + esc(texto) + '</span>' +
      (afectados.length > 1 ? '<span class="op-cont"><span>' + afectados.length + '</span></span>' : '');
    pastilla.setAttribute('aria-label', 'Estado de los sistemas: ' + texto + '. Abrir el detalle.');

    var estabaOculta = pastilla.hidden;
    pastilla.hidden = false;
    if (estabaOculta && conGsap()) {
      // Entra deslizándose DESDE el canto de la ventana, que es donde vive. Antes subía
      // desde abajo, que es el gesto de algo que flota; esta pieza no flota.
      gsap.from(pastilla, { x: -56, opacity: 0, duration: .5, ease: 'power3.out', clearProps: 'transform,opacity' });
    }
  }

  /* ── QUIÉN MÁS QUIERE SABER QUE ALGO SE CAYÓ ────────────────────────────
     Una pantalla puede necesitar reaccionar a las incidencias sin ser este módulo: el
     Portal, por ejemplo, recomienda guardar los datos del cliente cuando hay una falla
     en curso. Hasta ahora la única forma era preguntar `estado()` con temporizadores a
     ver si ya había llegado, que es adivinar cuánto tarda el servidor y equivocarse las
     dos veces —de más, avisando tarde; de menos, avisando en vacío—.

     El estado llega por tres caminos (la caché local, la respuesta del servidor y la
     entrega directa de una pantalla que ya lo pidió) y los tres pasan por aquí. */
  var oyentesEstado = [];

  function avisarEstado() {
    if (!oyentesEstado.length) return;
    var e = estado && estado.estado ? estado.estado : estado;
    oyentesEstado.forEach(function (cb) {
      try { cb(e); } catch (err) { console.error(err); }
    });
  }

  /* ── Avisos incrustados en la pantalla de inicio ────────────────────────── */

  function pintarAvisos() {
    avisarEstado();
    var slot = document.getElementById('operacion-avisos');
    if (!slot) return;
    if (!slot.classList.contains('op-root')) slot.classList.add('op-root');
    slot.classList.add('op-avisos');

    var e = estado && estado.estado ? estado.estado : estado;
    var incidentes = (e && e.success && e.incidentes) ? e.incidentes : [];
    if (!incidentes.length) { slot.innerHTML = ''; return; }

    slot.innerHTML = incidentes.map(function (i) {
      var nota = (i.ultima && i.ultima.nota) ? i.ultima.nota : (i.detalle || '');
      return '<button type="button" class="op-aviso tono-' + esc(i.tono) + '" ' +
                'data-op-inc="' + esc(i.id) + '">' +
        '<span class="op-aviso-ic">' + (ICONO_TONO[i.tono] || IC.info) + '</span>' +
        '<span class="op-aviso-tx">' +
          '<b>' + esc(i.titulo) + '</b>' +
          '<p>' + esc(nota || i.estadoNombre) + '</p>' +
          '<span class="op-aviso-meta">' + esc(i.estadoNombre) +
            (i.desde ? ' · ' + esc(desdeHace(i.desde)) : '') +
            ' · Toca para ver los reportes</span>' +
        '</span>' +
        '<span class="op-aviso-fl">' + IC.flecha + '</span>' +
      '</button>';
    }).join('');

    slot.querySelectorAll('[data-op-inc]').forEach(function (b) {
      b.addEventListener('click', function () { irADetalle(b.getAttribute('data-op-inc')); });
    });

    if (conGsap()) {
      gsap.from(slot.children, { y: 14, opacity: 0, duration: .5, ease: 'power3.out', stagger: .07, clearProps: 'transform' });
    }
  }

  /** Lleva a la vista de estado con el incidente abierto. */
  function irADetalle(id) {
    if (window.AppUrl && AppUrl.go) { AppUrl.go('estado', { inc: id }); return; }
    var base = (window.__APP__ && window.__APP__.baseUrl) || '';
    if (base) window.top.location.href = base + '?page=estado&inc=' + encodeURIComponent(id);
  }

  /* ── Panel ──────────────────────────────────────────────────────────────── */

  /**
   * Devuelve el velo al CSS.
   *
   * GSAP anima escribiendo `style="opacity:…"` en el elemento, y un estilo en línea gana
   * SIEMPRE a la clase. Al cerrar se quitaba `.abierto` pero el `opacity:1` que dejó la
   * animación de apertura seguía ahí: el velo —y con él el desenfoque de toda la
   * pantalla— se quedaba encima aunque el panel ya no se viera. Como `.op-scrim` sí
   * quita los clics, la página respondía normal y el usuario solo veía que el fondo se
   * había quedado borroso para siempre.
   *
   * Borrar el estilo en línea (en vez de fijar opacity:0) deja que la transición del CSS
   * haga la salida: no hace falta duplicar la animación en JS.
   */
  function limpiarVelo() {
    if (!scrim) return;
    if (typeof window.gsap !== 'undefined') {
      try { gsap.killTweensOf(scrim); } catch (e) {}
    }
    scrim.style.opacity = '';
  }

  function abrir(quien, modo, sistema) {
    montar();
    disparador = quien || null;
    vista = modo === 'reporte' ? 'reporte' : 'estado';
    if (vista === 'reporte') prepararFormulario(sistema);

    // La consulta se pide ANTES de pintar. pintarEstado distingue «cargando» de «no hay
    // conexión» mirando `cargando`, así que al revés el panel abría con un error de red que
    // no había ocurrido —y se corregía solo un segundo después, ya leído.
    if (Date.now() - ultimaCarga > 20000) cargar(false);
    pintarPanel();

    abierto = true;
    panel.setAttribute('aria-hidden', 'false');
    scrim.classList.add('abierto');
    panel.classList.add('abierto');
    // Se guarda lo que la pantalla tuviera puesto: varias vienen con su propio overflow
    // y devolverles '' al cerrar les cambiaba el scroll sin que nadie lo pidiera.
    scrollPrevio = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    if (conGsap()) {
      gsap.killTweensOf(scrim);
      gsap.fromTo(scrim, { opacity: 0 }, { opacity: 1, duration: .25, ease: 'power1.out' });
      var hijos = cuerpo.children;
      if (hijos.length) {
        gsap.from(hijos, { y: 16, opacity: 0, duration: .45, ease: 'power3.out', stagger: .05, delay: .1, clearProps: 'transform,opacity' });
      }
    }

    setTimeout(function () {
      var f = panel.querySelector('.op-cerrar');
      if (f) f.focus();
    }, 60);
  }

  function cerrar() {
    if (!abierto) return;
    abierto = false;
    panel.classList.remove('abierto');
    scrim.classList.remove('abierto');
    limpiarVelo();
    panel.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = scrollPrevio || '';
    scrollPrevio = '';
    if (disparador && disparador.focus) { try { disparador.focus(); } catch (e) {} }
    disparador = null;
    vista = 'estado';
  }

  function pintarPanel() {
    if (!panel) return;
    if (vista === 'reporte') { pintarFormulario(); return; }
    pintarEstado();
  }

  function pintarEstado() {
    var head = panel.querySelector('#op-head');
    var e = estado && estado.estado ? estado.estado : estado;

    if (cargando && !e) {
      head.innerHTML = cabecera('info', 'Estado de operación', 'Consultando cómo van los sistemas…');
      cuerpo.innerHTML = '<div class="op-sk"></div><div class="op-sk"></div><div class="op-sk"></div>';
      pie.innerHTML = '';
      return;
    }

    if (!e || !e.success) {
      head.innerHTML = cabecera('neutro', 'Estado de operación', 'No pudimos consultarlo ahora mismo.');
      cuerpo.innerHTML =
        '<div class="op-vacio">' +
          '<div class="op-vacio-ic" style="background:var(--op-neutro-bg);color:var(--op-neutro)">' + IC.info + '</div>' +
          '<b>No hay conexión con el sistema</b>' +
          '<p>Revisa tu internet e inténtalo de nuevo en un momento.</p>' +
        '</div>';
      pie.innerHTML = '<button type="button" class="op-btn op-btn-plano op-btn-bloque" id="op-reintentar">Reintentar</button>';
      var r = pie.querySelector('#op-reintentar');
      if (r) r.addEventListener('click', function () { cargar(true); });
      return;
    }

    var tono = e.global || 'ok';
    head.innerHTML = cabecera(tono, 'Estado de operación', e.resumen);

    var html = '';

    var incidentes = e.incidentes || [];
    if (incidentes.length) {
      html += '<div class="op-rotulo">Lo que está pasando</div>';
      html += incidentes.map(function (i) {
        var nota = (i.ultima && i.ultima.nota) ? i.ultima.nota : (i.detalle || '');
        return '<button type="button" class="op-inc tono-' + esc(i.tono) + '" data-op-inc="' + esc(i.id) + '">' +
          '<span class="op-inc-top">' +
            '<span class="op-chip tono-' + esc(i.tono) + '">' + (ICONO_TONO[i.tono] || IC.info) +
              esc(i.estadoNombre) + '</span>' +
            '<span style="font-size:11.5px;color:var(--op-ink-soft);font-weight:600">' + esc(i.sistema) + '</span>' +
          '</span>' +
          '<p class="op-inc-tit">' + esc(i.titulo) + '</p>' +
          (nota ? '<p class="op-inc-nota">' + esc(nota) + '</p>' : '') +
          '<span class="op-inc-pie">' +
            '<span>' + esc(i.desde ? 'Desde ' + desdeHace(i.desde) : '') + '</span>' +
            '<span class="op-ver">' + IC.ver + 'Ver reportes</span>' +
          '</span>' +
        '</button>';
      }).join('');
    } else {
      html += '<div class="op-vacio">' +
                '<div class="op-vacio-ic">' + IC.ok + '</div>' +
                '<b>Todo funcionando</b>' +
                '<p>No hay incidencias abiertas. Si algo no te funciona, repórtalo y lo revisamos.</p>' +
              '</div>';
    }

    html += '<div class="op-rotulo">Sistemas</div><div class="op-sistemas">';
    html += (e.sistemas || []).map(function (s) {
      return '<div class="op-sis tono-' + esc(s.tono) + '">' +
        '<span class="op-sis-dot"></span>' +
        '<span class="op-sis-tx"><b>' + esc(s.nombre) + '</b><small>' + esc(s.estadoNombre) + '</small></span>' +
      '</div>';
    }).join('');
    html += '</div>';

    cuerpo.innerHTML = html;
    cuerpo.querySelectorAll('[data-op-inc]').forEach(function (b) {
      b.addEventListener('click', function () { irADetalle(b.getAttribute('data-op-inc')); });
    });

    // Una sola acción primaria por vista: reportar. Ver el tablero completo es secundaria.
    pie.innerHTML =
      (haySesion()
        ? '<button type="button" class="op-btn op-btn-primario op-btn-bloque" id="op-ir-reportar">' +
            IC.mano + 'Reportar una falla</button>'
        : '') +
      '<button type="button" class="op-btn op-btn-plano op-btn-bloque" id="op-ir-estado">' +
        IC.ver + 'Ver el tablero completo</button>';

    var br = pie.querySelector('#op-ir-reportar');
    if (br) br.addEventListener('click', function () { vista = 'reporte'; prepararFormulario(''); pintarPanel(); });
    var be = pie.querySelector('#op-ir-estado');
    if (be) be.addEventListener('click', function () {
      if (window.AppUrl && AppUrl.go) AppUrl.go('estado');
      else {
        var base = (window.__APP__ && window.__APP__.baseUrl) || '';
        if (base) window.top.location.href = base + '?page=estado';
      }
    });
  }

  function cabecera(tono, titulo, sub) {
    return '<span class="op-head-ic tono-' + esc(tono === 'neutro' ? 'info' : tono) + '">' +
             (ICONO_TONO[tono] || IC.info) + '</span>' +
           '<span class="op-head-tx">' +
             '<h2 id="op-titulo">' + esc(titulo) + '</h2>' +
             '<p>' + esc(sub || '') + '</p>' +
           '</span>' +
           '<button type="button" class="op-cerrar" id="op-x" aria-label="Cerrar">' + IC.cerrar + '</button>';
  }

  /* ── Formulario de reporte ──────────────────────────────────────────────── */

  var form = null;

  function prepararFormulario(sistemaPre) {
    form = {
      sistema: sistemaPre || '',
      sistemaNuevo: '',
      submotivo: '',
      submotivoNuevo: '',
      notas: '',
      evidencias: [],
      enviando: false,
      error: '',
      sugerencia: null,
      hecho: null
    };
  }

  function catalogo() {
    return (estado && estado.catalogo) ? estado.catalogo : { sistemas: [], submotivos: {}, estados: [] };
  }

  function pintarFormulario() {
    var head = panel.querySelector('#op-head');

    if (form && form.hecho) { pintarGracias(); return; }

    head.innerHTML =
      '<button type="button" class="op-cerrar" id="op-atras" aria-label="Volver al estado">' + IC.atras + '</button>' +
      '<span class="op-head-tx">' +
        '<h2 id="op-titulo">Reportar una falla</h2>' +
        '<p>Dinos qué no te funciona. Si varias personas reportan lo mismo, avisamos al equipo.</p>' +
      '</span>' +
      '<button type="button" class="op-cerrar" id="op-x" aria-label="Cerrar">' + IC.cerrar + '</button>';

    var cat = catalogo();
    var sistemas = cat.sistemas || [];
    var subs = (cat.submotivos && cat.submotivos[form.sistema]) || [];

    var html = '';

    /* 1 · Sistema */
    html += '<div class="op-campo">' +
      '<label class="op-lbl" id="op-lbl-sis">¿Qué está fallando?</label>' +
      '<div class="op-opciones" role="group" aria-labelledby="op-lbl-sis">' +
      sistemas.map(function (s) {
        var sel = form.sistema === s.clave && !form.sistemaOtro;
        return '<button type="button" class="op-op" data-op-sis="' + esc(s.clave) + '" ' +
               'aria-pressed="' + (sel ? 'true' : 'false') + '">' + esc(s.nombre) + '</button>';
      }).join('') +
      '<button type="button" class="op-op op-op-nuevo" data-op-sis="__otro" ' +
        'aria-pressed="' + (form.sistemaOtro ? 'true' : 'false') + '">+ Otro</button>' +
      '</div>' +
      (form.sistemaOtro
        ? '<input type="text" class="op-input" id="op-sis-nuevo" style="margin-top:8px" ' +
          'placeholder="¿Cómo se llama?" maxlength="60" value="' + esc(form.sistemaNuevo) + '">' +
          '<p class="op-ayuda">Lo que escribas quedará disponible para el resto del equipo.</p>'
        : '') +
      '</div>';

    /* 2 · Submotivo (solo cuando ya hay sistema) */
    if (form.sistema || form.sistemaOtro) {
      html += '<div class="op-campo">' +
        '<label class="op-lbl" id="op-lbl-sub">¿Qué le pasa exactamente?</label>';

      if (subs.length && !form.sistemaOtro) {
        html += '<div class="op-opciones" role="group" aria-labelledby="op-lbl-sub">' +
          subs.map(function (s) {
            var sel = !form.submotivoOtro && form.submotivo === s.valor;
            return '<button type="button" class="op-op" data-op-sub="' + esc(s.valor) + '" ' +
                   'aria-pressed="' + (sel ? 'true' : 'false') + '">' + esc(s.valor) + '</button>';
          }).join('') +
          '<button type="button" class="op-op op-op-nuevo" data-op-sub="__nuevo" ' +
            'aria-pressed="' + (form.submotivoOtro ? 'true' : 'false') + '">+ Nuevo</button>' +
          '</div>';
      }

      if (form.submotivoOtro || !subs.length || form.sistemaOtro) {
        html += '<input type="text" class="op-input" id="op-sub-nuevo" ' +
          (subs.length && !form.sistemaOtro ? 'style="margin-top:8px" ' : '') +
          'placeholder="Descríbelo en pocas palabras" maxlength="60" value="' + esc(form.submotivoNuevo) + '">' +
          '<div class="op-sug" id="op-sug" hidden></div>' +
          '<p class="op-ayuda">Escríbelo como se lo dirías a un compañero. Aparecerá como opción para los demás.</p>';
      }
      html += '</div>';
    }

    /* 3 · Notas y evidencias */
    if (form.sistema || form.sistemaOtro) {
      html += '<div class="op-campo">' +
        '<label class="op-lbl" for="op-notas">Notas <span class="op-opc">· opcional</span></label>' +
        '<textarea class="op-area" id="op-notas" maxlength="1200" ' +
          'placeholder="¿Desde cuándo? ¿Le pasa a alguien más cerca de ti? ¿Sale algún mensaje?">' +
          esc(form.notas) + '</textarea>' +
        '</div>';

      html += '<div class="op-campo">' +
        '<label class="op-lbl">Evidencia <span class="op-opc">· opcional</span></label>' +
        '<button type="button" class="op-pegar" id="op-pegar">' +
          IC.imagen +
          '<b>Pega tu captura aquí</b>' +
          'Copia la pantalla y pulsa Ctrl + V, o haz clic para elegir la imagen.' +
        '</button>' +
        '<input type="file" id="op-archivo" accept="image/*" multiple hidden>' +
        '<div class="op-minis" id="op-minis"></div>' +
        '</div>';
    }

    /* Mientras no hay sistema elegido el formulario está casi vacío. Antes ese hueco se
       quedaba en blanco con un botón «Enviar» activo debajo, que solo servía para producir
       un error. Ahora el hueco explica qué va a pasar —incluido lo que más tranquiliza:
       que basta con un par de toques y que las capturas son opcionales— y el envío no se
       ofrece hasta que hay algo que enviar. */
    if (!form.sistema && !form.sistemaOtro) {
      html += '<div class="op-guia">' +
        '<b>Cómo funciona</b>' +
        '<ol>' +
          '<li>Elige arriba qué sistema te está fallando.</li>' +
          '<li>Di qué le pasa. Si tu caso no está en la lista, escríbelo tú.</li>' +
          '<li>Si quieres, añade una nota y pega una captura.</li>' +
        '</ol>' +
        '<p>Cuando varias personas reportan lo mismo, el equipo se entera solo.</p>' +
      '</div>';
    }

    html += '<div class="op-err" id="op-error" hidden></div>';

    cuerpo.innerHTML = html;
    pintarMinis();

    var listo = !!(form.sistema || form.sistemaOtro);
    pie.innerHTML =
      '<button type="button" class="op-btn op-btn-primario op-btn-bloque" id="op-enviar"' +
        (form.enviando || !listo ? ' disabled' : '') + '>' +
        IC.enviar + (form.enviando ? 'Enviando…' : 'Enviar el reporte') + '</button>' +
      '<button type="button" class="op-btn op-btn-plano op-btn-bloque" id="op-cancelar">Cancelar</button>';

    cablearFormulario();
    if (form.error) mostrarError(form.error);
    if (form.sugerencia) mostrarSugerencia(form.sugerencia);
  }

  function cablearFormulario() {
    var x = panel.querySelector('#op-x');
    if (x) x.addEventListener('click', cerrar);
    var atras = panel.querySelector('#op-atras');
    if (atras) atras.addEventListener('click', function () { vista = 'estado'; pintarPanel(); });

    cuerpo.querySelectorAll('[data-op-sis]').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-op-sis');
        if (v === '__otro') { form.sistemaOtro = true; form.sistema = ''; }
        else { form.sistemaOtro = false; form.sistema = v; form.sistemaNuevo = ''; }
        // Cambiar de sistema invalida el submotivo: "No entran llamadas" no significa
        // nada en la página de Liverpool.
        form.submotivo = ''; form.submotivoNuevo = ''; form.submotivoOtro = false;
        form.error = ''; form.sugerencia = null;
        pintarFormulario();
      });
    });

    cuerpo.querySelectorAll('[data-op-sub]').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-op-sub');
        if (v === '__nuevo') { form.submotivoOtro = true; form.submotivo = ''; }
        else { form.submotivoOtro = false; form.submotivo = v; form.submotivoNuevo = ''; }
        form.error = ''; form.sugerencia = null;
        pintarFormulario();
      });
    });

    var sisNuevo = cuerpo.querySelector('#op-sis-nuevo');
    if (sisNuevo) {
      sisNuevo.addEventListener('input', function () { form.sistemaNuevo = sisNuevo.value; });
      if (form.sistemaOtro && !form.sistemaNuevo) setTimeout(function () { sisNuevo.focus(); }, 30);
    }

    var subNuevo = cuerpo.querySelector('#op-sub-nuevo');
    if (subNuevo) {
      subNuevo.addEventListener('input', function () {
        form.submotivoNuevo = subNuevo.value;
        revisarDuplicado(subNuevo.value);
      });
      if (form.submotivoOtro && !form.submotivoNuevo) setTimeout(function () { subNuevo.focus(); }, 30);
    }

    var notas = cuerpo.querySelector('#op-notas');
    if (notas) notas.addEventListener('input', function () { form.notas = notas.value; });

    var pegar = cuerpo.querySelector('#op-pegar');
    var archivo = cuerpo.querySelector('#op-archivo');
    if (pegar && archivo) {
      pegar.addEventListener('click', function () { archivo.click(); });
      archivo.addEventListener('change', function () {
        Array.prototype.slice.call(archivo.files || []).forEach(leerArchivo);
        archivo.value = '';
      });
    }

    var enviar = pie.querySelector('#op-enviar');
    if (enviar) enviar.addEventListener('click', enviarReporte);
    var cancelar = pie.querySelector('#op-cancelar');
    if (cancelar) cancelar.addEventListener('click', cerrar);
  }

  /**
   * Aviso de duplicado EN EL CLIENTE, mientras se escribe.
   *
   * El servidor vuelve a decidir (y ahí manda), pero avisar aquí evita el caso incómodo de
   * escribir un submotivo entero y que el sistema lo cambie por otro sin explicar por qué.
   *
   * POR ESO LOS DOS CRITERIOS TIENEN QUE SER EL MISMO. Al principio aquí solo se medían
   * bigramas y el servidor medía además distancia de edición: un error de dedo sencillo
   * ("no cagra") pasaba el aviso sin decir nada y luego el servidor lo sustituía por su
   * cuenta. Un aviso que se calla justo cuando va a haber sustitución es peor que no tenerlo.
   * Cualquier cambio aquí hay que replicarlo en opSugerirExistente_ (Operacion.gs).
   */
  function revisarDuplicado(texto) {
    var t = normalizar(texto);
    if (t.length < 4) { form.sugerencia = null; mostrarSugerencia(null); return; }
    var subs = (catalogo().submotivos && catalogo().submotivos[form.sistema]) || [];
    var mejor = null;

    subs.forEach(function (s) {
      var otro = normalizar(s.valor);
      if (!otro) return;
      // Si las cifras no coinciden no son la misma queja: "Error 404" y "Error 403"
      // comparten casi todas sus letras y son cosas distintas.
      if (cifras(t) !== cifras(otro)) return;

      var d = dice(t, otro);
      var dist = distancia(t, otro);
      var largoParecido = Math.abs(t.length - otro.length) <= Math.max(2, Math.round(t.length * 0.34));
      var tolerancia = t.length <= 6 ? 1 : (t.length <= 12 ? 2 : 3);
      if (!(largoParecido && dist <= tolerancia) && d < 0.78) return;

      var p = Math.max(d, 1 - (dist / Math.max(t.length, otro.length)));
      if (!mejor || p > mejor.p) mejor = { valor: s.valor, p: p };
    });

    form.sugerencia = mejor ? mejor.valor : null;
    mostrarSugerencia(form.sugerencia);
  }

  /** Damerau-Levenshtein: "carga" ↔ "cagra" es UN error de dedo, no dos. */
  function distancia(a, b) {
    a = String(a || ''); b = String(b || '');
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;

    var fila = [], anterior = [], i, j;
    for (j = 0; j <= b.length; j++) fila[j] = j;
    for (i = 1; i <= a.length; i++) {
      var previa = fila.slice();
      fila[0] = i;
      for (j = 1; j <= b.length; j++) {
        var costo = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        fila[j] = Math.min(fila[j - 1] + 1, previa[j] + 1, previa[j - 1] + costo);
        if (i > 1 && j > 1 && a.charAt(i - 1) === b.charAt(j - 2) && a.charAt(i - 2) === b.charAt(j - 1)) {
          fila[j] = Math.min(fila[j], anterior[j - 2] + costo);
        }
      }
      anterior = previa;
    }
    return fila[b.length];
  }

  function normalizar(s) {
    return String(s || '')
      .normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), '')
      .toLowerCase().replace(/[^a-z0-9ñ ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function cifras(s) {
    var m = String(s || '').match(/\d+/g);
    return m ? m.join('|') : '';
  }

  function dice(a, b) {
    a = a.replace(/ /g, ''); b = b.replace(/ /g, '');
    if (!a || !b) return 0;
    if (a === b) return 1;
    if (a.length < 2 || b.length < 2) return 0;
    var bolsa = {}, i, par, comunes = 0;
    for (i = 0; i < a.length - 1; i++) { par = a.substr(i, 2); bolsa[par] = (bolsa[par] || 0) + 1; }
    for (i = 0; i < b.length - 1; i++) { par = b.substr(i, 2); if (bolsa[par] > 0) { bolsa[par]--; comunes++; } }
    return (2 * comunes) / ((a.length - 1) + (b.length - 1));
  }

  function mostrarSugerencia(valor) {
    var caja = cuerpo.querySelector('#op-sug');
    if (!caja) return;
    if (!valor) { caja.hidden = true; caja.innerHTML = ''; return; }
    caja.hidden = false;
    caja.innerHTML = IC.info +
      '<span>Ya existe algo muy parecido: <button type="button" id="op-usar-sug">«' + esc(valor) + '»</button>. ' +
      'Úsalo y tu reporte se sumará al de los demás.</span>';
    var b = caja.querySelector('#op-usar-sug');
    if (b) b.addEventListener('click', function () {
      form.submotivoOtro = false; form.submotivo = valor; form.submotivoNuevo = ''; form.sugerencia = null;
      pintarFormulario();
    });
  }

  function mostrarError(msg) {
    var caja = cuerpo.querySelector('#op-error');
    if (!caja) return;
    if (!msg) { caja.hidden = true; caja.innerHTML = ''; return; }
    caja.hidden = false;
    caja.innerHTML = IC.alerta + '<span>' + esc(msg) + '</span>';
    if (window.AppMotion && AppMotion.shake) AppMotion.shake(caja);
  }

  /* ── Evidencias ─────────────────────────────────────────────────────────── */

  function leerArchivo(file) {
    if (!file || file.type.indexOf('image/') !== 0) return;
    if (form.evidencias.length >= 4) {
      mostrarError('Puedes adjuntar hasta 4 capturas.');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      mostrarError('Esa captura pesa más de 5 MB. Recórtala e inténtalo de nuevo.');
      return;
    }
    var lector = new FileReader();
    lector.onload = function () { subirEvidencia(lector.result, file.name || 'captura'); };
    lector.readAsDataURL(file);
  }

  function subirEvidencia(dataUrl, nombre) {
    var item = { estado: 'subiendo', vista: dataUrl, nombre: nombre };
    form.evidencias.push(item);
    pintarMinis();
    mostrarError('');

    llamar('opSubirEvidencia', [{ email: correo(), dataUrl: dataUrl, nombre: nombre }])
      .then(function (r) {
        if (r && r.success) {
          item.estado = 'ok'; item.url = r.url; item.id = r.id;
        } else {
          form.evidencias.splice(form.evidencias.indexOf(item), 1);
          mostrarError((r && r.message) || 'No pudimos guardar la captura.');
        }
        pintarMinis();
      }, function () {
        form.evidencias.splice(form.evidencias.indexOf(item), 1);
        mostrarError('No pudimos guardar la captura. Revisa tu internet.');
        pintarMinis();
      });
  }

  function pintarMinis() {
    var caja = cuerpo.querySelector('#op-minis');
    if (!caja) return;
    caja.innerHTML = form.evidencias.map(function (e, i) {
      if (e.estado === 'subiendo') {
        return '<div class="op-mini subiendo"><span class="op-mini-spin"></span></div>';
      }
      return '<div class="op-mini">' +
        '<img src="' + esc(e.vista || e.url) + '" alt="' + esc(e.nombre || 'Captura') + '">' +
        '<button type="button" class="op-mini-x" data-op-quitar="' + i + '" aria-label="Quitar esta captura">' +
          IC.cerrar + '</button>' +
      '</div>';
    }).join('');
    caja.querySelectorAll('[data-op-quitar]').forEach(function (b) {
      b.addEventListener('click', function () {
        form.evidencias.splice(Number(b.getAttribute('data-op-quitar')), 1);
        pintarMinis();
      });
    });
  }

  /** Pegar con Ctrl+V mientras el formulario está abierto. */
  document.addEventListener('paste', function (e) {
    if (!abierto || vista !== 'reporte' || !form || form.hecho) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var encontrada = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) { leerArchivo(f); encontrada = true; }
      }
    }
    if (encontrada) e.preventDefault();
  });

  /* ── Envío ──────────────────────────────────────────────────────────────── */

  /**
   * Cierra la escena de envío y devuelve el cuerpo a como estaba.
   *
   * `done()` NO es inmediato: funde la escena y solo entonces la desmonta, y es el
   * desmontaje el que le quita a `.op-cuerpo` la clase `vfx-host` (position:relative) que
   * el cover le puso para anclarse. Como justo después repintamos el cuerpo entero, el
   * nodo de la escena ya no está en el documento cuando le toca desmontarse, la limpieza
   * se salta y la clase se quedaba puesta para siempre. Se retira aquí a mano.
   */
  function cerrarEnvio(fx) {
    fx.done();
    if (cuerpo) cuerpo.classList.remove('vfx-host');
  }

  function enviarReporte() {
    if (form.enviando) return;

    var sistema = form.sistemaOtro ? '' : form.sistema;
    var sistemaNuevo = form.sistemaOtro ? String(form.sistemaNuevo || '').trim() : '';
    if (!sistema && !sistemaNuevo) { mostrarError('Elige qué sistema está fallando.'); return; }

    var submotivo = form.submotivoOtro ? '' : form.submotivo;
    var submotivoNuevo = (form.submotivoOtro || !submotivo) ? String(form.submotivoNuevo || '').trim() : '';
    if (!submotivo && !submotivoNuevo) { mostrarError('Dinos qué es lo que le pasa.'); return; }
    if (submotivoNuevo && submotivoNuevo.length < 4) {
      mostrarError('Descríbelo con un poco más de detalle (al menos 4 letras).'); return;
    }
    if (form.evidencias.some(function (e) { return e.estado === 'subiendo'; })) {
      mostrarError('Espera a que terminen de subir las capturas.'); return;
    }

    form.enviando = true;
    form.error = '';
    pintarFormulario();

    /* La escena va SOBRE el cuerpo del panel, no en el pie: mientras el reporte sube, el
       formulario sigue ahí y sus botones siguen respondiendo —cambiar de sistema a media
       subida repinta el formulario por debajo del envío—. La caja es el tema de toda
       escritura. Se monta después de pintarFormulario porque ése reescribe el cuerpo. */
    var fxEnvio = window.VentelFX
      ? VentelFX.section(cuerpo, 'caja', { mode: 'cover', title: 'Enviando tu reporte…' })
      : null;

    var envio = {
      email: correo(),
      sistema: sistema,
      sistemaNuevo: sistemaNuevo,
      submotivo: submotivo,
      submotivoNuevo: submotivoNuevo,
      notas: form.notas,
      evidencias: form.evidencias.filter(function (e) { return e.estado === 'ok'; })
                                 .map(function (e) { return { url: e.url, id: e.id, nombre: e.nombre }; })
    };

    /* ── EL REPORTE VA POR LA COLA DE GUARDADO ────────────────────────────────
       Era la única escritura del módulo que se llamaba a pelo, y es la que más se usa:
       cada asesor que se topa con algo pasa por aquí. Eso costaba tres cosas que el
       resto de la app ya tiene resueltas:

         · La pastilla de abajo a la izquierda —esta misma, la que app_operacion presta a
           AppGuardado— se quedaba muda mientras el reporte subía. Justo el indicador que
           existe para decir "hay algo en vuelo" no se enteraba del envío más importante.
         · No había guardia de salida. Cerrar la pestaña con el reporte a medio subir lo
           perdía en silencio; ahora AppGuardado avisa y deja esperar.
         · La política de reintentos no estaba escrita en ninguna parte. Aquí va en cero y
           dicho: reportar avisa al equipo por Chat, así que repetirlo a ciegas mandaría un
           segundo aviso por la misma caída.

       Lo que NO cambia es el acuse. El panel se queda puesto hasta que el servidor
       contesta, porque lo que devuelve es información de verdad —si el reporte disparó una
       incidencia, cuánta gente lleva reportando lo mismo— y eso no se puede pintar antes de
       preguntarlo. `optimista` está vacío a propósito: aquí lo que se adelanta es el aviso
       en la pastilla, no el resultado. */
    enviarPorLaCola({
      clave: 'operacion:reporte',
      etiqueta: 'Enviando tu reporte',
      // Sin aviso propio: el acuse dentro del panel ya lo dice, y con más detalle.
      silencioso: true,
      hecho: 'Reporte enviado',
      fn: 'opReportar',
      args: [envio],
      reintentos: 0,
      valida: function (r) { return !!(r && r.success); }
    }).then(function (r) {
      // Antes de repintar: el cuerpo se reescribe entero y la escena se quedaría fuera del
      // documento sin haber devuelto el contenedor a como estaba.
      if (fxEnvio) cerrarEnvio(fxEnvio);
      form.enviando = false;
      if (r && r.success) {
        form.hecho = r;
        pintarFormulario();
        cargar(true);

        /* RESCATE DE ATENCIONES.
           Este es el único momento del día en que ofrecer la herramienta tiene sentido:
           acaba de reportar que algo se cayó, así que si tenía a alguien en la línea, lo
           tiene AHORA. Media hora después ya no se acuerda del teléfono.

           Se lanza con retraso a propósito. El acuse del reporte —"ya avisamos al
           equipo"— es lo que la persona vino a leer, y taparlo con otra tarjeta en el
           mismo fotograma haría que descartara las dos. Los 1.2 s dan tiempo a leer el
           acuse y llegan mucho antes de que cierre el panel.

           El enfriamiento de dos minutos lo lleva AppAtenciones: aquí se pide siempre y
           es él quien decide si toca. Duplicar esa condición aquí sería tener dos sitios
           donde apagar el aviso, y bastaría olvidar uno para que volviera a salir. */
        if (window.AppAtenciones) {
          var sistemaReportado = (r.sistema || sistema || sistemaNuevo || '');
          setTimeout(function () {
            try { AppAtenciones.sugerir({ sistema: sistemaReportado }); } catch (e) {}
          }, 1200);
        }
      }
    }, function (motivo) {
      /* Un solo camino para el "no salió", venga de donde venga.
         La cola RECHAZA en los dos casos: cuando el servidor contesta que no —y entonces
         `motivo` es su respuesta, con el porqué escrito— y cuando no hubo forma de
         llegar, donde lo único cierto es que falló el viaje. Distinguirlos importa: "no
         elegiste sistema" y "no hay internet" se arreglan de maneras muy distintas, y un
         mensaje genérico manda a revisar el wifi a quien solo tenía que rellenar un campo.

         Lo escrito NO se pierde: el formulario sigue puesto tal cual, con el motivo
         encima y el botón listo para volver a intentarlo. */
      if (fxEnvio) cerrarEnvio(fxEnvio);
      form.enviando = false;
      form.error = (motivo && motivo.message && !(motivo instanceof Error))
        ? motivo.message
        : 'No hay conexión con el sistema. Revisa tu internet e inténtalo de nuevo.';
      pintarFormulario();
    });
  }

  /**
   * Acuse de recibo.
   *
   * Importa MUCHO decir si el reporte se sumó a algo que ya existía: si no, la persona
   * cree que nadie más lo ha visto y va a escribir por otro canal "a mí también me pasa",
   * que es justo lo que este módulo viene a evitar.
   */
  function pintarGracias() {
    var head = panel.querySelector('#op-head');
    var r = form.hecho;
    var tono = r.elevado ? 'warn' : 'ok';

    head.innerHTML = cabecera(tono, 'Reporte enviado', r.message || 'Gracias por avisar.');

    var html = '<div class="op-vacio">' +
      '<div class="op-vacio-ic"' + (r.elevado ? ' style="background:var(--op-warn-bg);color:var(--op-warn)"' : '') + '>' +
        (r.elevado ? IC.alerta : IC.ok) + '</div>' +
      '<b>' + esc(r.sistema + (r.submotivo ? ' · ' + r.submotivo : '')) + '</b>' +
      '<p>' + esc(r.elevado
        ? 'Ya avisamos al equipo. Supervisión va a confirmarlo o descartarlo.'
        : (r.incidente
            ? 'Tu reporte se sumó a una incidencia que ya estaba abierta.'
            : 'Queda registrado. Si más gente reporta lo mismo, avisamos al equipo automáticamente.')) +
      '</p></div>';

    if (r.incidente) {
      html += '<button type="button" class="op-inc tono-' + esc(r.incidente.tono || 'warn') + '" ' +
        'data-op-inc="' + esc(r.incidente.id) + '">' +
        '<span class="op-inc-top"><span class="op-chip tono-' + esc(r.incidente.tono || 'warn') + '">' +
          (ICONO_TONO[r.incidente.tono] || IC.info) + esc(r.incidente.estadoNombre || '') + '</span></span>' +
        '<p class="op-inc-tit">' + esc(r.incidente.titulo || '') + '</p>' +
        '<span class="op-inc-pie"><span></span>' +
          '<span class="op-ver">' + IC.ver + 'Ver los reportes del equipo</span></span>' +
      '</button>';
    }

    cuerpo.innerHTML = html;
    cuerpo.querySelectorAll('[data-op-inc]').forEach(function (b) {
      b.addEventListener('click', function () { irADetalle(b.getAttribute('data-op-inc')); });
    });

    pie.innerHTML =
      '<button type="button" class="op-btn op-btn-primario op-btn-bloque" id="op-listo">Listo</button>' +
      '<button type="button" class="op-btn op-btn-plano op-btn-bloque" id="op-otro">Reportar otra cosa</button>';
    var l = pie.querySelector('#op-listo');
    if (l) { l.addEventListener('click', cerrar); setTimeout(function () { l.focus(); }, 40); }
    var o = pie.querySelector('#op-otro');
    if (o) o.addEventListener('click', function () { prepararFormulario(''); pintarFormulario(); });

    var x = panel.querySelector('#op-x');
    if (x) x.addEventListener('click', cerrar);

    if (conGsap()) {
      gsap.from(cuerpo.children, { y: 16, opacity: 0, duration: .45, ease: 'power3.out', stagger: .06, clearProps: 'transform,opacity' });
    }
  }

  /* ── Carga de datos ─────────────────────────────────────────────────────── */

  /**
   * Pinta lo guardado y revalida por detrás. Esto era una reimplementación a mano
   * de `AppRun.swr` —leer caché, pintar, llamar, pintar otra vez, guardar— y ahora
   * es la de verdad: se gana la deduplicación (dos pantallas del mismo módulo
   * pidiendo el estado a la vez ya no son dos viajes) y se pierde una copia más
   * del patrón que hay que mantener al día.
   *
   * El pintado es idempotente —repinta la pastilla y los avisos enteros—, que es
   * la condición para poder usar `swr`: `onData` se llama DOS veces cuando había
   * caché.
   */
  function cargar(forzar) {
    if (cargando) return;
    cargando = true;

    var fin = function (r) { cargando = false; ultimaCarga = Date.now(); return r; };

    return AppRun.swr(CLAVE_CACHE,
      haySesion() ? 'opEstadoSesion' : 'opEstadoPublico',
      haySesion() ? [correo()] : [],
      {
        ttl: TTL_MS,
        maxAge: TTL_MS,
        fuerza: forzar === true,
        // Un "no" del servidor no se guarda: la pastilla se quedaría diciendo que
        // no se sabe nada durante todo el TTL, en vez de volver a preguntar.
        accept: function (r) { return !!(r && r.success !== false); },
        onData: function (r) {
          if (!r || r.success === false) { if (!estado) pintarPastilla(); return; }
          estado = r;
          pintarPastilla();
          pintarAvisos();
          if (abierto && vista === 'estado') pintarEstado();
        },
        onError: function () {
          if (abierto && vista === 'estado' && !estado) pintarEstado();
        }
      }).then(fin, fin);
  }

  /* Revalidación discreta: solo con la pestaña a la vista. Un equipo que deja diez
     pestañas abiertas no debe generar diez consultas por minuto contra Apps Script. */
  function programarRevalidacion() {
    setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - ultimaCarga < REVALIDA_MS) return;
      cargar(true);
    }, 30000);

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Date.now() - ultimaCarga > REVALIDA_MS) cargar(true);
    });
  }

  /* ── Arranque ───────────────────────────────────────────────────────────── */

  window.AppOperacion = {
    abrir: function () { abrir(null); },
    reportar: function (sistema) { abrir(null, 'reporte', sistema || ''); },
    cerrar: cerrar,
    refrescar: function (forzar) { cargar(forzar !== false); },
    estado: function () { return estado; },

    /**
     * Avisa cada vez que se sabe algo nuevo del estado de los sistemas.
     *
     * El callback recibe el estado ya desenvuelto ({ success, incidentes, sistemas… })
     * y se llama TAMBIÉN con lo que hubiera en la caché, que es lo que permite a quien
     * escucha pintar en el primer fotograma en vez de esperar al servidor. Devuelve la
     * función para dejar de escuchar.
     */
    alCambiar: function (cb) {
      if (typeof cb !== 'function') return function () {};
      oyentesEstado.push(cb);
      // Si el estado ya está aquí, no se hace esperar al siguiente cambio: quien acaba
      // de suscribirse quiere saber CÓMO ESTÁ, no solo cuándo cambie.
      if (estado) { try { cb(estado.estado ? estado.estado : estado); } catch (e) { console.error(e); } }
      return function () {
        var i = oyentesEstado.indexOf(cb);
        if (i !== -1) oyentesEstado.splice(i, 1);
      };
    },

    /**
     * Una pantalla que YA pidió el estado por su cuenta se lo entrega aquí.
     *
     * Lo usa el tablero (`?page=estado`), que necesita los mismos datos para pintarse. Sin
     * esto, cada carga de la pantalla más visitada del módulo costaba DOS consultas
     * idénticas al servidor: la suya y la de este indicador. Marca la hora de carga, así
     * que además silencia la petición de arranque.
     */
    usarEstado: function (datos) {
      if (!datos || datos.success === false) return;
      estado = datos;
      ultimaCarga = Date.now();
      guardarCache(datos);
      montar();
      pintarPastilla();
      pintarAvisos();
      if (abierto && vista === 'estado') pintarEstado();
    }
  };

  document.addEventListener('DOMContentLoaded', function () {
    montar();
    // El estado no compite con el primer pintado de la pantalla: llega un poco después.
    // Si la pantalla ya nos lo entregó con usarEstado(), no se vuelve a pedir.
    setTimeout(function () {
      if (estado) return;
      cargar(false);
    }, 900);
    programarRevalidacion();
  });

  /* El botón de cerrar se vuelve a cablear en cada repintado de la cabecera. */
  document.addEventListener('click', function (e) {
    var x = e.target && e.target.closest ? e.target.closest('#op-x') : null;
    if (x && abierto) cerrar();
  });
})();
</script>
