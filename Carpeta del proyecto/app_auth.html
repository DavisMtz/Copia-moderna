<style>
/**
 * =====================================================================================
 * ESCENARIO DE ACCESO | Sistema de cotizaciones Ventel
 * =====================================================================================
 * Marco visual y coreografía compartidos por inicioDeSesion y registro.
 *
 * Cambio de dirección respecto al diseño anterior (panel rosa a media pantalla):
 *   · El rosa deja de ser el fondo y vuelve a ser ACENTO (regla 60/30/10). El lienzo
 *     usa los tokens del tema, así que estas pantallas por fin respetan aurora /
 *     slate / carbón como el resto de la app.
 *   · La marca se cuenta con el isotipo de Liverpool DIBUJADO a trazo (DrawSVG), no
 *     con degradados y orbes genéricos. El mismo isotipo sirve de filigrana de fondo,
 *     de sello en la tarjeta y de indicador de carga: un solo motivo, tres usos.
 *   · Tarjeta única centrada-desplazada en lugar de pantalla partida: menos superficie
 *     saturada, foco en el formulario, y se comporta igual de 375px a 1440px.
 *
 * USO en la pantalla:
 *   <head> ... <?!= include('ViewPrefsPartial'); ?> <?!= include('app_theme'); ?>
 *              <?!= include('app_auth'); ?>
 *   final del <body>, tras app_core / app_icons / app_motion:
 *              AuthStage.play({ title: '[data-split]' });
 *
 * Estas pantallas NO cargan Tailwind: todo lo que necesitan está aquí y en app_theme.
 */

/* ── Reset mínimo ──
   Estas pantallas ya no cargan Tailwind, así que su "preflight" (margen 0 del body,
   border-box) tiene que declararse aquí. Es deliberadamente corto: solo lo que se
   pierde al quitar el CDN. */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
img { max-width: 100%; display: block; }
button { font-family: inherit; }

/* ── Escala local (tipografía y espaciado). Candidata a subir a app_theme. ── */
.auth {
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .875rem; --fs-base: 1rem;
  --fs-lg: 1.125rem; --fs-xl: 1.5rem; --fs-2xl: 2rem;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
}

/* ── Lienzo ── */
.auth {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  grid-template-rows: 1fr auto;
  overflow-x: hidden;
  background:
    radial-gradient(52rem 32rem at 88% -8%, var(--brand-tint), transparent 62%),
    var(--app-bg);
}
[data-theme="carbon"] .auth {
  background:
    radial-gradient(52rem 32rem at 88% -8%, rgba(225, 0, 152, .13), transparent 62%),
    radial-gradient(40rem 28rem at 4% 96%, rgba(109, 40, 217, .10), transparent 58%),
    var(--app-bg);
}

/* Filigrana: el isotipo a gran escala, sangrando por el borde derecho.
 *
 * DOS elementos a propósito: el contenedor POSICIONA (y recorta el sangrado) y el
 * hijo es el único que se anima. Centrar el contenedor con transform y además
 * animarlo con GSAP no funciona: GSAP reescribe la propiedad `transform` entera y
 * el centrado se pierde en cuanto arranca la deriva o el paralaje. Aquí el
 * contenedor centra con grid — sin transform — y GSAP tiene el transform del hijo
 * para él solo. */
.auth-watermark {
  position: absolute;
  inset: 0;
  display: grid;
  align-items: center;
  justify-items: end;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
  /* La atenuación vive AQUÍ, no en el hijo: así GSAP puede animar la opacidad del
     hijo de 0 a 1 sin borrar el tono de filigrana. La opacidad final es el
     producto de ambas (.06 × 1). */
  opacity: .06;
}
[data-theme="carbon"] .auth-watermark { opacity: .11; }
.auth-watermark-inner {
  width: min(52vw, 40rem);
  margin-right: -12vw;
  color: var(--brand);
}
.auth-watermark-inner svg { width: 100%; height: auto; display: block; }

/* ── Escenario ── */
.auth-stage {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: var(--s5);
  width: min(100%, 76rem);
  margin-inline: auto;
  padding: var(--s7) var(--s5);
}

/* ── Tarjeta ── */
.auth-card {
  width: min(100%, 27rem);
  background: var(--surface);
  border-radius: 20px;
  padding: var(--s6);
  box-shadow: var(--sh-lg);
}
/* En oscuro la sombra no separa: ahí sí hace falta el borde. */
[data-theme="carbon"] .auth-card { border: 1px solid var(--line); }
html[data-contrast="high"] .auth-card { border: 2px solid var(--line); }

/* Filo de marca que se dibuja sobre la tarjeta.
   El trazo usa currentColor: var() dentro de un atributo de presentación SVG no es
   fiable entre navegadores, así que el color se inyecta por CSS. */
.auth-edge { display: block; width: 100%; height: 3px; margin-bottom: var(--s5); overflow: visible; color: var(--brand); }

/* ── Sello + palabra de marca ── */
.auth-lockup { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s5); }
.auth-mark { width: 34px; height: 34px; color: var(--brand); flex: none; }
.auth-mark svg { width: 100%; height: 100%; display: block; }
.auth-wordmark {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: var(--fs-sm);
  letter-spacing: .19em;
  text-transform: uppercase;
  color: var(--ink);
  line-height: 1.2;
}
.auth-wordmark small {
  display: block;
  font-size: .62rem;
  letter-spacing: .13em;
  color: var(--ink-faint);
  font-weight: 700;
}

/* ── Encabezado ── */
.auth-title {
  font-family: var(--f-display);
  font-size: var(--fs-2xl);
  font-weight: 800;
  letter-spacing: -.022em;
  line-height: 1.1;
  color: var(--ink);
  margin: 0;
}
.auth-sub {
  margin: var(--s2) 0 0;
  font-size: var(--fs-md);
  color: var(--ink-soft);
}
.auth-link {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-weight: 700;
  color: var(--brand);
  cursor: pointer;
  border-radius: 4px;
}
.auth-link:hover { color: var(--brand-deep); text-decoration: underline; }

/* ── Formulario ── */
.auth-form { display: flex; flex-direction: column; gap: var(--s4); margin-top: var(--s6); }
/* Con indicador de pasos el aire ya lo pone el propio indicador: sin esto se sumaban
   32 px + 32 px y el formulario caía demasiado lejos del progreso. */
.auth-steps ~ .auth-form { margin-top: var(--s4); }
.auth-row { display: flex; flex-direction: column; gap: var(--s1); }

/* Etiqueta a la izquierda y atajo a la derecha, sobre el mismo campo
   («Contraseña … ¿La olvidaste?»). En pantalla estrecha el atajo baja solo. */
.auth-row-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2);
  flex-wrap: wrap;
}
.auth-row-head .auth-link { font-size: var(--fs-xs); }

.field { position: relative; display: flex; align-items: center; }
/* Acento lateral que crece al enfocar. Solo transform: no provoca layout. */
.field::before {
  content: '';
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 2px;
  border-radius: 2px;
  background: var(--brand);
  transform: scaleY(0);
  transform-origin: center;
  transition: transform .22s cubic-bezier(.2, .8, .2, 1);
}
.field:focus-within::before { transform: scaleY(1); }

.field-ic {
  position: absolute;
  left: .8rem;
  width: 1.15rem;
  height: 1.15rem;
  color: var(--ink-faint);
  pointer-events: none;
  transition: color .22s ease;
}
.field:focus-within .field-ic { color: var(--brand); }
.field .v-input { padding-left: 2.6rem; }
.field .v-input[data-has-toggle] { padding-right: 2.9rem; }

.field-toggle {
  position: absolute;
  right: .45rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border: 0;
  border-radius: var(--rad-sm);
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
}
.field-toggle:hover { color: var(--ink); background: var(--surface-2); }
.field-toggle span { width: 1.15rem; height: 1.15rem; display: block; }

/* Ayuda del campo: la regla que hay que conocer ANTES de escribir (dominio exigido,
   formato esperado). No es un error, así que ni rojo ni icono de alerta. */
.auth-help {
  margin: 0;
  font-size: var(--fs-xs);
  line-height: 1.45;
  color: var(--ink-faint);
}

/* ── Errores y avisos ── */
.auth-error {
  display: none;
  align-items: center;
  gap: var(--s1);
  margin: 0;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--alert);
}
.auth-error.show { display: flex; }
.auth-error::before {
  content: '!';
  flex: none;
  width: 1rem; height: 1rem;
  border-radius: 50%;
  background: var(--alert);
  color: #fff;
  font-size: .68rem;
  font-weight: 800;
  display: grid;
  place-items: center;
}
#message-container:empty { display: none; }
#message-container {
  margin-bottom: var(--s4);
  padding: var(--s3) var(--s4);
  border-radius: var(--rad-sm);
  font-size: var(--fs-sm);
  font-weight: 600;
  background: var(--alert-bg);
  color: var(--alert);
}
#message-container.ok { background: var(--ok-bg); color: var(--ok); }

/* ── Medidor de contraseña ── */
.auth-meter { display: flex; gap: 5px; margin-top: var(--s2); }
.auth-meter i {
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
/* El relleno se anima con scaleX (compositable), nunca con width. */
.auth-meter i > b {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--ink-faint);
  transform: scaleX(0);
  transform-origin: left center;
}
.auth-meter-label {
  margin: var(--s1) 0 0;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--ink-faint);
  min-height: 1.05em;
}

/* ── Progreso por pasos ──
 * Recuperar la contraseña son tres momentos distintos (correo → código → contraseña
 * nueva) y el registro verificado, dos. Sin este rótulo el asesor no sabe si le
 * quedan 2 pantallas o 5, que es justo cuando se abandona un flujo.
 * <ol> real: el orden es información, no decoración. */
.auth-steps {
  display: flex;
  align-items: center;
  gap: var(--s2);
  /* Aire propio: sigue al subtítulo de la tarjeta y antecede al formulario, así que
     necesita separarse de ambos (verificado en navegador: pegado al texto se leía
     como parte del párrafo). El margen inferior del formulario se ajusta abajo. */
  margin: var(--s6) 0 var(--s2);
  padding: 0;
  list-style: none;
  counter-reset: paso;
}
.auth-steps li {
  display: flex;
  align-items: center;
  gap: var(--s2);
  min-width: 0;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ink-faint);
}
/* La línea de unión crece con el espacio disponible; el paso actual no se encoge. */
.auth-steps li:not(:last-child)::after {
  content: '';
  flex: 1 1 auto;
  min-width: 10px;
  height: 2px;
  border-radius: 2px;
  background: var(--line);
}
.auth-steps li { flex: 1 1 auto; }
.auth-steps li:last-child { flex: 0 0 auto; }
.auth-step-dot {
  flex: none;
  width: 1.5rem;
  height: 1.5rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-faint);
  font-size: .7rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.auth-step-dot > [data-icon] { width: .85rem; height: .85rem; display: block; }
.auth-step-tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Paso hecho y paso actual se distinguen por FORMA (relleno vs. borde) y no solo por
   color: en alto contraste, impreso o en blanco y negro siguen siendo legibles. */
.auth-steps li.is-done { color: var(--ink-soft); }
.auth-steps li.is-done .auth-step-dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.auth-steps li.is-done:not(:last-child)::after { background: var(--ok); }
.auth-steps li.is-on { color: var(--ink); }
.auth-steps li.is-on .auth-step-dot { background: var(--brand); border-color: var(--brand); color: #fff; }
/* En pantalla estrecha solo se rotula el paso actual: 3 etiquetas no caben. */
@media (max-width: 420px) {
  .auth-steps li:not(.is-on) .auth-step-tx { display: none; }
}

/* ── Casillas del código de un solo uso ──
 * Seis casillas en lugar de un campo suelto: se lee de un vistazo si ya van 4 o 5
 * dígitos y el error se señala en el conjunto, no dígito por dígito. La lógica de
 * teclado y pegado vive en AuthOtp (abajo). */
.otp {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--s2);
  margin-top: var(--s1);
}
.otp-cell {
  width: 100%;
  height: 3.4rem;
  padding: 0;
  text-align: center;
  font-family: var(--f-mono, ui-monospace, 'JetBrains Mono', monospace);
  font-size: 1.35rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-sm);
  transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
  /* iOS ampliaría la página al enfocar un campo de menos de 16px. */
  -moz-appearance: textfield;
}
.otp-cell::-webkit-outer-spin-button,
.otp-cell::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.otp-cell:hover:not(:disabled) { border-color: var(--brand-soft); }
.otp-cell:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-tint);
}
.otp-cell.is-filled { border-color: var(--brand-soft); background: var(--surface); }
.otp-cell:disabled { opacity: .55; cursor: not-allowed; }
.otp.is-error .otp-cell { border-color: var(--alert); }
@media (max-width: 380px) {
  .otp { gap: var(--s1); }
  .otp-cell { height: 3rem; font-size: 1.15rem; }
}

/* ── Fila de acciones secundarias (reenviar, cambiar correo) ── */
.auth-meta {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
  margin: var(--s3) 0 0;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--ink-faint);
}
.auth-meta [data-icon] { width: .95rem; height: .95rem; flex: none; }
/* El texto ocupa el resto de la línea y envuelve DENTRO de su columna. Sin esto, una
   nota de dos líneas se iba entera debajo del icono (visto en el registro). */
.auth-meta > span:not([data-icon]):not(.auth-meta-sep) { flex: 1 1 8rem; min-width: 0; }
.auth-meta .auth-link { font-size: var(--fs-xs); }
.auth-meta .auth-link[disabled] { color: var(--ink-faint); cursor: default; text-decoration: none; }
.auth-meta-sep { flex: 1 1 auto; }
/* Cuenta atrás: cifras tabulares para que no baile al pasar de 1:00 a 0:59. */
.auth-count { font-variant-numeric: tabular-nums; }

/* ── Volver al paso anterior ── */
.auth-back {
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  margin: 0 0 var(--s3);
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 4px;
}
.auth-back:hover { color: var(--brand); }
.auth-back [data-icon] { width: .95rem; height: .95rem; }

/* ── Nota destacada (a dónde fue el código, avisos del paso) ── */
.auth-hint {
  display: flex;
  gap: var(--s3);
  margin: 0 0 var(--s4);
  padding: var(--s3) var(--s4);
  border-radius: var(--rad-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: var(--fs-sm);
  line-height: 1.5;
  color: var(--ink-soft);
}
.auth-hint [data-icon] { width: 1.1rem; height: 1.1rem; flex: none; color: var(--brand); margin-top: 1px; }
.auth-hint b { color: var(--ink); font-weight: 700; word-break: break-word; }

/* ── Botón de envío ── */
.auth-submit { width: 100%; justify-content: center; margin-top: var(--s2); padding-block: .78rem; }
.auth-submit .auth-arrow { transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
.auth-submit:hover:not(:disabled) .auth-arrow { transform: translateX(4px); }

/* ── Estado de carga ── */
.auth-loading { text-align: center; padding: var(--s5) 0; }
.auth-loader { width: 62px; height: 62px; margin: 0 auto var(--s4); color: var(--brand); }
.auth-loader svg { width: 100%; height: 100%; display: block; }
.auth-loading h2 { font-family: var(--f-display); font-size: var(--fs-lg); font-weight: 700; color: var(--ink); margin: 0; }
.auth-loading p { margin: var(--s1) 0 0; font-size: var(--fs-md); color: var(--ink-soft); }

/* ── Salto a las áreas públicas del Portal ──
 * Portal y Monitor de Promociones no piden sesión (PORTAL_PAGES en Code.gs), así que
 * quien solo viene a consultar no tiene por qué iniciar sesión. Se reutiliza la
 * gramática del conmutador de área de la barra lateral —chip de icono + título +
 * subtítulo— para que sea el MISMO componente, adaptado a superficie clara. */
.auth-jump {
  width: min(100%, 27rem);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr));
  gap: var(--s2);
}
.auth-jump-lbl {
  grid-column: 1 / -1;
  font-size: .62rem;
  font-weight: 800;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.auth-jump-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: .7rem .8rem;
  border-radius: var(--rad);
  border: 1px solid var(--line);
  background: var(--surface);
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: transform .2s cubic-bezier(.2, .8, .2, 1), border-color .2s ease, box-shadow .2s ease;
}
.auth-jump-item:hover { transform: translateY(-2px); border-color: var(--brand-soft); box-shadow: var(--sh-sm); }
.auth-jump-ic {
  flex: none;
  width: 2rem;
  height: 2rem;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--brand-tint);
  color: var(--brand);
  transition: background-color .2s ease;
}
/* El [data-icon] va anidado dentro del chip: así la regla general de iconos
   (.auth [data-icon] > svg { width:100% }) dimensiona el SVG respecto a este
   span de 1.05rem, y no respecto al chip de 2rem. Sin pelea de especificidad. */
.auth-jump-ic > [data-icon] { display: block; width: 1.05rem; height: 1.05rem; }
.auth-jump-item:hover .auth-jump-ic { background: var(--brand); color: #fff; }
.auth-jump-tx { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.auth-jump-tx b { font-size: var(--fs-sm); font-weight: 700; color: var(--ink); }
.auth-jump-tx small {
  font-size: .68rem;
  font-weight: 600;
  color: var(--ink-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Notas al pie de la tarjeta ── */
.auth-notes {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s5);
  width: min(100%, 27rem);
  margin: 0;
  padding: 0;
  list-style: none;
}
.auth-notes li {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--ink-soft);
}
.auth-notes span[data-icon] { width: 1rem; height: 1rem; color: var(--brand); flex: none; }

.auth-foot {
  position: relative;
  z-index: 1;
  padding: var(--s5);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  text-align: center;
}

/* ── Iconos inyectados por Icons.render() (sin Tailwind aquí) ── */
.auth [data-icon] > svg { width: 100%; height: 100%; display: block; }
.auth .hidden, .hidden { display: none !important; }

/* ── Foco visible: falta en app_theme, aquí es innegociable ── */
.auth :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.auth .v-input:focus-visible { outline: none; }

/* ── Adaptación ── */
@media (min-width: 64rem) {
  .auth-stage { padding-inline: var(--s8); }
  .auth-card { padding: var(--s7) var(--s6); }
}
@media (max-width: 40rem) {
  .auth-watermark { opacity: .045; }
  .auth-watermark-inner { width: 80vw; margin-right: -30vw; }
  .auth-stage { padding: var(--s6) var(--s4); align-items: stretch; }
  .auth-card { padding: var(--s5) var(--s4); border-radius: 16px; }
  .auth-title { font-size: 1.65rem; }
}

@media (prefers-reduced-motion: reduce) {
  .field::before, .auth-submit .auth-arrow { transition: none; }
}
</style>

<script>
/**
 * AuthStage — inyecta el isotipo y dirige la coreografía de entrada.
 *
 * Principio de robustez: el contenido NUNCA se oculta desde CSS. Los estados

          var vacia = celdas.filter(function (c) { return !c.value; })[0] || celdas[0];
          vacia.focus();
        },
        error: function (on) {
          root.classList.toggle('is-error', !!on);
          celdas.forEach(function (c) {
            if (on) c.setAttribute('aria-invalid', 'true');
            else c.removeAttribute('aria-invalid');
          });
          if (on && window.AppMotion) AppMotion.shake(root);
        },
        disable: function (on) {
          celdas.forEach(function (c) { c.disabled = !!on; });
        },
        cells: celdas
      };
      return api;
    }
  };

  window.AuthStage = AuthStage;
  window.AuthOtp = AuthOtp;

  /* El isotipo se pinta cuanto antes para que el trazado empiece con la escena. */
  document.addEventListener('DOMContentLoaded', function () { AuthStage.paint(); });
})();
</script>
