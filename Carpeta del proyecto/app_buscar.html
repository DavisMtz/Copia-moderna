<script>
/**
 * =====================================================================================
 * MOTOR DE BÚSQUEDA COMPARTIDO | Sistema de cotizaciones Ventel · Portal Ventel
 * =====================================================================================
 * Un solo criterio de "esto coincide" para TODA la app. Antes cada pantalla llevaba su
 * propia copia recortada —inicio.html tenía fzMatches, inicio_avanzado otra igual,
 * Promociones comparaba con includes() a secas y la consola con indexOf—, así que la
 * misma palabra encontraba cosas distintas según dónde se escribiera, y arreglar un
 * buscador no arreglaba los demás.
 *
 * QUÉ SABE HACER (y por qué):
 *   · Ignora acentos, mayúsculas y signos: "gonzalez" encuentra "González".
 *   · Tolera errores de tipeo por distancia de edición con transposiciones:
 *     "cotizaicon" encuentra "cotización" y "jse" encuentra "José".
 *   · Separa letras de números: "lvp2024" encuentra "LVP-2024".
 *   · Compara también la forma COMPACTA (sin espacios ni guiones), que es como se
 *     teclean los folios: "lvp 1 2 3" y "LVP-123" son lo mismo.
 *   · Entiende correos: buscar "juan.perez@x.com" también acierta por "juan perez",
 *     y buscar "juan" acierta en la parte local del correo.
 *   · Acepta siglas: "cc" llega a "Correos a Clientes".
 *   · Expande sinónimos del negocio: "promo" alcanza "promociones" y "descuentos".
 *   · Ordena por RELEVANCIA en vez de devolver el orden de la hoja: lo que empieza
 *     con lo que escribiste va primero.
 *
 * RENDIMIENTO: normalizar es lo caro (NFD + regex) y se repite en cada tecla sobre las
 * mismas filas. Aquí se memoriza en un mapa acotado, así que teclear la quinta letra
 * de una búsqueda ya no vuelve a normalizar las 900 filas de la tabla.
 *
 * USO típico:
 *   AppBuscar.coincide(texto, termino)                    -> boolean (filtro simple)
 *   AppBuscar.filtra(lista, termino, function(x){...})     -> lista ordenada por relevancia
 *   AppBuscar.puntua(AppBuscar.consulta(q), [ {t:nombre, p:3}, {t:sub, p:1} ])
 *   AppBuscar.resalta(texto, termino)                      -> HTML con <mark>
 *
 * Es autónomo: no depende de app_core, del tema ni de ninguna otra pantalla.
 */
(function () {
  'use strict';

  /* ── Memoria de normalizaciones ────────────────────────────────────────────
     Acotada a propósito: una tabla de supervisión con miles de filas por seis
     campos llenaría la memoria del navegador si el mapa creciera sin freno. Al
     llegar al tope se vacía entero (más barato y predecible que llevar cuenta de
     accesos, y lo que importa se vuelve a llenar en el siguiente tecleo). */
  var MAX_MEMORIA = 4000;
  var memNorm = Object.create(null);
  var memNormN = 0;
  var memComp = Object.create(null);
  var memCompN = 0;

  /** Minúsculas, sin acentos, sin signos y con espacios colapsados. */
  function normaliza(s) {
    if (s == null) return '';
    var raw = typeof s === 'string' ? s : String(s);
    if (!raw) return '';
    if (raw.length < 120) {
      var hit = memNorm[raw];
      if (hit !== undefined) return hit;
    }
    var out = raw
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')  // acentos fuera
      .toLowerCase()
      .replace(/[^a-z0-9@._\s]+/g, ' ')                  // signos → espacio (se conserva lo del correo)
      .replace(/\s+/g, ' ')
      .trim();
    if (raw.length < 120) {
      if (memNormN >= MAX_MEMORIA) { memNorm = Object.create(null); memNormN = 0; }
      memNorm[raw] = out; memNormN++;
    }
    return out;
  }

  /** Forma compacta: solo letras y dígitos. Es como se teclean folios y claves. */
  function compacta(s) {
    if (s == null) return '';
    var raw = typeof s === 'string' ? s : String(s);
    if (!raw) return '';
    if (raw.length < 120) {
      var hit = memComp[raw];
      if (hit !== undefined) return hit;
    }
    var out = normaliza(raw).replace(/[^a-z0-9]/g, '');
    if (raw.length < 120) {
      if (memCompN >= MAX_MEMORIA) { memComp = Object.create(null); memCompN = 0; }
      memComp[raw] = out; memCompN++;
    }
    return out;
  }

  /**
   * Palabras de un texto ya normalizado, partiendo además en la frontera
   * letra/dígito y por los signos del correo. "lvp2024" -> ["lvp","2024"];
   * "ana.lopez@liverpool.com.mx" -> ["ana","lopez","liverpool","com","mx"].
   */
  function palabras(norm) {
    if (!norm) return [];
    return norm
      .replace(/([a-z])(\d)/g, '$1 $2')
      .replace(/(\d)([a-z])/g, '$1 $2')
      .split(/[\s@._]+/)
      .filter(Boolean);
  }

  /* ── Sinónimos del negocio ─────────────────────────────────────────────────
     Buscar es preguntar con las palabras propias, no con las de la hoja de
     cálculo. Quien escribe "promo" quiere promociones; quien escribe "factura"
     probablemente busca la cotización. Los sinónimos suman poco puntaje: acercan
     el resultado sin desbancar a una coincidencia literal. */
  var SINONIMOS = {
    cotizacion: 'cotizaciones folio presupuesto cotizar precio',
    cotizaciones: 'cotizacion folio presupuesto panel',
    folio: 'cotizacion lvp numero',
    presupuesto: 'cotizacion precio total',
    cliente: 'correo comprador destinatario contacto',
    correo: 'mail email mensaje enviar plantilla',
    mail: 'correo email enviar',
    email: 'correo mail electronico',
    enviar: 'mandar correo envio remitir',
    plantilla: 'formato correo modelo machote',
    promo: 'promocion promociones descuento oferta rebaja monitor',
    promocion: 'promociones descuento oferta rebaja monitor promo',
    promociones: 'promocion descuento oferta rebaja monitor promo',
    descuento: 'promocion oferta rebaja porcentaje',
    oferta: 'promocion descuento rebaja',
    msi: 'meses sin intereses pagos diferido',
    revision: 'revisar autorizar aprobar cola pendiente',
    revisar: 'revision autorizar aprobar cola pendiente',
    aprobar: 'autorizar revision aprobada',
    supervision: 'panel avanzado metricas reportes supervisar',
    metricas: 'reportes estadisticas indicadores supervision',
    reporte: 'metricas csv descarga informe',
    anuncio: 'anuncios aviso publicacion comunicado portal',
    anuncios: 'anuncio aviso publicacion comunicado portal',
    portal: 'herramientas procesos informacion inicio',
    contenido: 'portal herramientas plantillas formatos administrar',
    operacion: 'estado fallas incidencias caido sistemas',
    estado: 'operacion estatus semaforo fallas',
    incidencia: 'falla problema reporte operacion',
    consola: 'administracion maestro miembros ajustes usuarios',
    miembro: 'usuario asesor cuenta persona equipo',
    usuario: 'miembro asesor cuenta persona correo',
    asesor: 'usuario miembro vendedor ejecutivo',
    permiso: 'bloque acceso rol facultad',
    guia: 'paqueteria rastreo envio numero tracking',
    paqueteria: 'guia envio mensajeria rastreo',
    devolucion: 'retorno recogido cancelacion reembolso',
    pago: 'formas metodo tarjeta efectivo transferencia monedero',
    tienda: 'sucursal cr centro reparto almacen',
    nueva: 'crear nuevo generar alta',
    crear: 'nueva nuevo generar alta',
    buscar: 'busqueda encontrar localizar consultar',
    consultar: 'ver consulta buscar abrir',
    salir: 'cerrar sesion logout',
    tema: 'color apariencia oscuro claro ajustes vista'
  };

  /** Palabras de enlace: no aportan a las siglas de un nombre compuesto. */
  var NEXOS = { a: 1, al: 1, de: 1, del: 1, la: 1, las: 1, el: 1, los: 1, y: 1, e: 1,
                en: 1, con: 1, por: 1, para: 1, un: 1, una: 1, su: 1, sus: 1 };

  /** Amplía el diccionario de sinónimos (una pantalla puede aportar los suyos). */
  function agregaSinonimos(mapa) {
    if (!mapa) return;
    Object.keys(mapa).forEach(function (k) {
      var clave = normaliza(k);
      SINONIMOS[clave] = SINONIMOS[clave] ? (SINONIMOS[clave] + ' ' + mapa[k]) : mapa[k];
    });
  }

  /* ── Distancia de edición ──────────────────────────────────────────────────
     Damerau-Levenshtein acotada: además de altas, bajas y cambios cuenta la
     TRANSPOSICIÓN de dos letras seguidas como un solo error, que es el error de
     tecleo más común ("cotizaicon" ↔ "cotizacion"). Con Levenshtein a secas eso
     costaba dos errores y las palabras cortas se quedaban fuera del umbral. */
  function distancia(a, b, max) {
    if (a === b) return 0;
    var la = a.length, lb = b.length;
    if (!la) return lb;
    if (!lb) return la;
    if (Math.abs(la - lb) > max) return max + 1;

    var anterior2 = null;
    var anterior = new Array(lb + 1);
    var j;
    for (j = 0; j <= lb; j++) anterior[j] = j;

    for (var i = 1; i <= la; i++) {
      var actual = new Array(lb + 1);
      actual[0] = i;
      var mejor = actual[0];
      var ca = a.charCodeAt(i - 1);
      for (j = 1; j <= lb; j++) {
        var costo = ca === b.charCodeAt(j - 1) ? 0 : 1;
        var v = Math.min(anterior[j] + 1, actual[j - 1] + 1, anterior[j - 1] + costo);
        if (i > 1 && j > 1 && ca === b.charCodeAt(j - 2) && a.charCodeAt(i - 2) === b.charCodeAt(j - 1)) {
          v = Math.min(v, anterior2[j - 2] + 1);   // transposición
        }
        actual[j] = v;
        if (v < mejor) mejor = v;
      }
      if (mejor > max) return max + 1;             // poda: la fila entera ya se pasó
      anterior2 = anterior;
      anterior = actual;
    }
    return anterior[lb];
  }

  /** Errores tolerados según el largo de lo que se escribió. */
  function tolerancia(len) {
    if (len <= 2) return 0;   // dos letras: exacto, o el ruido se come la lista
    if (len <= 3) return 1;   // "jse" → "José" (acotado: ver puntuaPalabra)
    if (len <= 5) return 1;
    if (len <= 8) return 2;
    return 3;
  }

  /**
   * ¿Vale la pena medir la distancia entre estas dos palabras?
   *
   * Damerau es lo caro del filtro y en una tabla larga se llama una vez por
   * palabra y por celda. Casi ningún par lejano necesita medirse: quien se
   * equivoca al teclear rara vez falla la PRIMERA letra, y cuando lo hace es por
   * cambiarla de sitio con la segunda. Con esa criba se descarta el 90 % de los
   * pares sin tocar la matriz, y las coincidencias reales siguen entrando.
   */
  function vecinasPlausibles(w, t) {
    var w0 = w.charCodeAt(0), t0 = t.charCodeAt(0);
    if (w0 === t0) return true;
    if (w.length > 1 && t.length > 1) {
      if (w0 === t.charCodeAt(1) || w.charCodeAt(1) === t0) return true;  // letra de más, de menos o cambiada de sitio
    }
    return false;
  }

  /* ── Consulta ──────────────────────────────────────────────────────────────
     Se prepara UNA vez y se reutiliza contra cada fila: normalizar la búsqueda
     dentro del bucle era normalizarla mil veces por tecla. */
  var RE_CORREO = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  /**
   * @param {string} q Lo que escribió la persona.
   * @return {{crudo:string, compacto:string, palabras:string[], suaves:string[],
   *           correo:boolean, vacia:boolean}}
   */
  function consulta(q) {
    var crudo = normaliza(q);
    var lista = palabras(crudo);
    var suaves = [];
    var vistos = Object.create(null);
    lista.forEach(function (w) { vistos[w] = true; });
    lista.forEach(function (w) {
      var syn = SINONIMOS[w];
      if (!syn) return;
      normaliza(syn).split(' ').forEach(function (t) {
        if (t && !vistos[t]) { vistos[t] = true; suaves.push(t); }
      });
    });
    return {
      crudo: crudo,
      compacto: compacta(q),
      palabras: lista,
      suaves: suaves,
      correo: RE_CORREO.test(String(q || '').trim()),
      vacia: lista.length === 0
    };
  }

  /**
   * Puntúa UNA palabra buscada contra un campo ya preparado.
   * Devuelve 0 cuando no hay nada; a mayor número, mejor coincidencia.
   */
  function puntuaPalabra(w, campo) {
    var toks = campo.toks;
    var mejor = 0;
    var i, t;

    // 1) Frontal: el campo entero empieza con lo escrito. Es la señal más fuerte
    //    de "esto es lo que buscabas" (escribir "cot" y que salga "Cotizaciones").
    if (campo.norm.indexOf(w) === 0) mejor = 100;

    for (i = 0; i < toks.length; i++) {
      t = toks[i];
      if (t === w) { if (mejor < 92) mejor = 92; continue; }
      if (t.indexOf(w) === 0) {
        // Prefijo de palabra, mejor cuanto menos sobra: "gonz" en "gonzalez"
        // vale más que "a" en "anteriormente".
        var v = 60 + Math.round(24 * (w.length / t.length));
        if (mejor < v) mejor = v;
        continue;
      }
      if (t.indexOf(w) !== -1) { if (mejor < 48) mejor = 48; }
    }
    if (mejor >= 92) return mejor;

    // 2) Compacta: folios y claves tecleados sin guiones ni espacios.
    if (w.length >= 3 && campo.comp.indexOf(w) !== -1) {
      var vc = campo.comp.indexOf(w) === 0 ? 88 : 52;
      if (mejor < vc) mejor = vc;
    }
    if (mejor >= 88) return mejor;

    // 3) Siglas: "cc" → "Correos a Clientes", "pa" → "Panel Avanzado".
    if (w.length >= 2 && w.length <= 5 && campo.siglas && campo.siglas.indexOf(w) !== -1) {
      if (mejor < 70) mejor = 70;
    }
    if (mejor > 0) return mejor;

    // 4) Errores de tipeo. Solo si nada literal funcionó: es lo caro y lo dudoso.
    var tol = tolerancia(w.length);
    if (tol === 0) return mejor;
    // Con tres letras el margen es de una sola y solo contra palabras igual de
    // cortas: "jse" debe llegar a "José", pero no a media tabla.
    var maxLargo = w.length <= 3 ? w.length + 1 : Infinity;
    for (i = 0; i < toks.length; i++) {
      t = toks[i];
      if (t.length < 3 || t.length > maxLargo) continue;
      if (!vecinasPlausibles(w, t)) continue;
      if (Math.abs(t.length - w.length) <= tol) {
        var d = distancia(w, t, tol);
        if (d <= tol) { var vd = 44 - d * 8; if (mejor < vd) mejor = vd; continue; }
      }
      // Palabra larga con el principio bien escrito: "gonzales" ↔ "gonzalez rios".
      if (t.length > w.length && w.length >= 4) {
        var d2 = distancia(w, t.substring(0, w.length), tol);
        if (d2 <= tol) { var v2 = 36 - d2 * 8; if (mejor < v2) mejor = v2; }
      }
    }
    return mejor;
  }

  /* Prepara un campo para compararlo muchas veces (normalizado + palabras + siglas).
     También se memoriza: filtrar una tabla vuelve a preparar los MISMOS textos en
     cada tecla, y partir palabras con tres expresiones regulares por campo y por
     fila es justo lo que hacía que el filtro se sintiera pegajoso en listas largas.
     El peso NO forma parte del campo preparado —el mismo texto puede pesar distinto
     en dos buscadores— y viaja aparte para que la memoria se comparta. */
  /* Dos generaciones en vez de una: al llenarse, la actual pasa a ser la vieja y se
     empieza otra limpia. Se sigue consultando la vieja, así que una tabla con más
     celdas que el tope no pierde TODO en cada tecla —que era lo que convertía el
     ahorro en un gasto— y la memoria sigue acotada a dos mapas. */
  var CAMPOS_TOPE = 8000;
  var memCampo = Object.create(null);
  var memCampoViejo = Object.create(null);
  var memCampoN = 0;

  function preparaCampo(texto) {
    var raw = (texto == null) ? '' : String(texto);
    if (!raw) return { norm: '', comp: '', toks: [], siglas: '' };
    var memorizable = raw.length < 160;
    if (memorizable) {
      var hit = memCampo[raw];
      if (hit !== undefined) return hit;
      hit = memCampoViejo[raw];
      if (hit !== undefined) { memCampo[raw] = hit; memCampoN++; return hit; }
    }
    var norm = normaliza(raw);
    var toks = palabras(norm);
    var siglas = '';
    if (toks.length > 1 && toks.length <= 8) {
      // Las preposiciones y artículos no cuentan para las siglas: nadie teclea
      // "cac" buscando "Correos a Clientes", teclea "cc".
      var fuertes = toks.filter(function (t) { return !NEXOS[t]; });
      siglas = toks.map(function (t) { return t.charAt(0); }).join('');
      if (fuertes.length > 1 && fuertes.length !== toks.length) {
        siglas += ' ' + fuertes.map(function (t) { return t.charAt(0); }).join('');
      }
    }
    var campo = { norm: norm, comp: compacta(raw), toks: toks, siglas: siglas };
    if (memorizable) {
      if (memCampoN >= CAMPOS_TOPE) {
        memCampoViejo = memCampo; memCampo = Object.create(null); memCampoN = 0;
      }
      memCampo[raw] = campo; memCampoN++;
    }
    return campo;
  }

  /**
   * Puntúa una consulta contra varios campos con distinto peso.
   *
   * @param {object} Q      Lo que devolvió consulta().
   * @param {Array}  campos [{t:'texto', p:3}, …]  ·  p = peso (nombre pesa más que notas)
   * @param {object=} opts  { exigirTodas:true }  Con varias palabras, exigir que TODAS
   *                        encuentren algo. Es lo correcto para filtrar una tabla
   *                        ("juan perez" no debe traer a todos los Juan). Con false,
   *                        las parciales aparecen al final en vez de desaparecer.
   * @return {number} 0 = no coincide.
   */
  function puntua(Q, campos, opts) {
    if (!Q || Q.vacia) return 0;
    if (!campos) return 0;
    if (!campos.length && typeof campos !== 'string') return 0;
    var lista = (typeof campos === 'string') ? [campos] : campos;
    var exigirTodas = !opts || opts.exigirTodas !== false;

    // Campos preparados y pesos, en arreglos paralelos: el preparado sale de la
    // memoria compartida y el peso es de este buscador, así que no se mezclan.
    var prep = [], pesos = [];
    var i;
    for (i = 0; i < lista.length; i++) {
      var c = lista[i];
      if (c == null || c === '') continue;
      /* Campo YA preparado: `{ campo: AppBuscar.campo(texto), p: 1.4 }`.
         La memoria de campos solo guarda textos de menos de 160 caracteres —por encima
         de eso la clave del mapa pesaría más que lo que ahorra—, así que un campo LARGO
         se vuelve a tokenizar entero en cada pulsación de cada fila. Los `kw` de los
         procesos de trazabilidad llegan a 240 palabras: son exactamente ese caso, y sin
         esta puerta el tecleo se arrastra en cuanto la hoja de Homologación contesta.
         Quien tenga campos así los prepara UNA vez, al construir su índice, y los pasa
         hechos. */
      if (typeof c === 'object' && c.campo) {
        prep.push(c.campo);
        pesos.push(c.p || 1);
        continue;
      }
      var texto = (typeof c === 'object' && c.t !== undefined) ? c.t : c;
      if (texto == null || texto === '') continue;
      prep.push(preparaCampo(texto));
      pesos.push((typeof c === 'object' && c.p) ? c.p : 1);
    }
    if (!prep.length) return 0;

    var total = 0, acertadas = 0;
    for (var k = 0; k < Q.palabras.length; k++) {
      var w = Q.palabras[k];
      var mejor = 0;
      for (i = 0; i < prep.length; i++) {
        var s = puntuaPalabra(w, prep[i]) * pesos[i];
        if (s > mejor) mejor = s;
      }
      if (mejor > 0) acertadas++;
      total += mejor;
    }

    // Sinónimos: empujan, no deciden. Se cuentan aquí arriba porque también hay que
    // saber si hubo alguno ANTES de decidir que no hay coincidencia (ver abajo).
    var bonoSuave = 0;
    for (var j = 0; j < Q.suaves.length; j++) {
      var sw = Q.suaves[j];
      for (i = 0; i < prep.length; i++) {
        if (prep[i].toks.indexOf(sw) !== -1) { bonoSuave += 8 * pesos[i]; break; }
      }
    }

    /* Ni una palabra ESCRITA acertó, pero un sinónimo sí.
       Filtrando una tabla eso es un no rotundo —quien escribe "juan" no quiere ver a
       todos los clientes— y por eso con `exigirTodas` se devuelve 0 como siempre.
       En un BUSCADOR es lo contrario: el diccionario existe justamente para los casos
       en que la palabra buscada no aparece en el texto. Quien escribe "clabe" busca
       "Transferencia BBVA", donde "clabe" no está escrito por ninguna parte; quien
       escribe "med" busca el monedero. Hasta aquí esas 80 y pico entradas de sinónimos
       no servían de nada: la línea de arriba devolvía 0 antes de mirarlas, y el
       diccionario era decorado.
       Se devuelve solo el empujón y rebajado, de modo que un acercamiento por sinónimo
       quede SIEMPRE por debajo de una coincidencia de verdad —8 × peso contra los
       48-100 × peso de cualquier acierto literal—: aparece al final de la lista, que es
       donde tiene que aparecer, no desaparecido. */
    if (!acertadas) return exigirTodas ? 0 : bonoSuave * 0.25;
    if (exigirTodas && acertadas < Q.palabras.length) return 0;

    // Frase completa: escribir "estado de cuenta" y que exista tal cual pesa más
    // que las tres palabras sueltas repartidas por el texto.
    if (Q.crudo.length >= 4) {
      for (i = 0; i < prep.length; i++) {
        var pos = prep[i].norm.indexOf(Q.crudo);
        if (pos !== -1) { total += (pos === 0 ? 70 : 40) * pesos[i]; break; }
      }
    }
    total += bonoSuave;
    // Coincidencia parcial permitida: se ordena detrás de las completas.
    if (acertadas < Q.palabras.length) total *= (acertadas / Q.palabras.length) * 0.5;
    return total;
  }

  /** Puntúa contra un solo texto (atajo del caso más común). */
  function puntuaTexto(Q, texto, opts) {
    return puntua(Q, [texto], opts);
  }

  /**
   * ¿Coincide? Reemplazo directo de los `includes()` y `fzMatches` sueltos que
   * había por las pantallas. Sin término escrito, todo coincide (no filtra nada).
   * `termino` admite también una consulta ya preparada con consulta(), para no
   * rehacerla en cada elemento de un bucle.
   */
  function coincide(texto, termino, opts) {
    var Q = (termino && typeof termino === 'object' && termino.palabras) ? termino : consulta(termino);
    if (Q.vacia) return true;
    return puntua(Q, [texto], opts) > 0;
  }

  /**
   * Filtra y ORDENA por relevancia.
   *
   * @param {Array} lista
   * @param {string} termino
   * @param {function(*):(string|Array)} campos  Texto del elemento, o [{t,p}] con pesos.
   * @param {object=} opts { limite, exigirTodas, conPuntaje, desempate }
   * @return {Array} Los elementos (o {item,score} con conPuntaje:true).
   */
  function filtra(lista, termino, campos, opts) {
    opts = opts || {};
    var Q = consulta(termino);
    var arr = lista || [];
    if (Q.vacia) {
      var base = opts.limite ? arr.slice(0, opts.limite) : arr.slice();
      return opts.conPuntaje ? base.map(function (x) { return { item: x, score: 0 }; }) : base;
    }
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var s = puntua(Q, campos(arr[i], i), opts);
      if (s > 0) out.push({ item: arr[i], score: s, i: i });
    }
    out.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      if (opts.desempate) { var d = opts.desempate(a.item, b.item); if (d) return d; }
      return a.i - b.i;   // a igualdad, se respeta el orden original
    });
    if (opts.limite) out = out.slice(0, opts.limite);
    return opts.conPuntaje ? out.map(function (r) { return { item: r.item, score: r.score }; })
                           : out.map(function (r) { return r.item; });
  }

  /* ── Presentación ──────────────────────────────────────────────────────────
     Resaltar es parte de buscar: sin ver POR QUÉ salió una fila, el resultado
     difuso parece un error del sistema. */
  function escapa(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapaRegex(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  /**
   * Devuelve el texto escapado con <mark> sobre lo que coincidió. Marca la frase
   * completa y cada palabra por separado, con y sin acentos (se compara la forma
   * normalizada carácter a carácter contra el original).
   */
  function resalta(texto, termino) {
    var original = String(texto == null ? '' : texto);
    var Q = consulta(termino);
    if (!original || Q.vacia) return escapa(original);

    // Mapa posición-normalizada → posición-original, para marcar sobre el texto real.
    var mapa = [];
    var normado = '';
    for (var i = 0; i < original.length; i++) {
      var ch = original[i].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      for (var k = 0; k < ch.length; k++) { normado += ch[k]; mapa.push(i); }
    }
    mapa.push(original.length);

    var trozos = [];
    var terminos = [Q.crudo].concat(Q.palabras).filter(function (t, idx, a) {
      return t && t.length >= 2 && a.indexOf(t) === idx;
    });
    terminos.forEach(function (t) {
      var re = new RegExp(escapaRegex(t), 'g');
      var m;
      while ((m = re.exec(normado)) !== null) {
        trozos.push([mapa[m.index], mapa[m.index + t.length]]);
        if (m.index === re.lastIndex) re.lastIndex++;
      }
    });
    if (!trozos.length) return escapa(original);

    trozos.sort(function (a, b) { return a[0] - b[0] || b[1] - a[1]; });
    var unidos = [];
    trozos.forEach(function (t) {
      var ult = unidos[unidos.length - 1];
      if (ult && t[0] <= ult[1]) { if (t[1] > ult[1]) ult[1] = t[1]; }
      else unidos.push([t[0], t[1]]);
    });

    var salida = '', cursor = 0;
    unidos.forEach(function (t) {
      salida += escapa(original.slice(cursor, t[0])) + '<mark>' + escapa(original.slice(t[0], t[1])) + '</mark>';
      cursor = t[1];
    });
    return salida + escapa(original.slice(cursor));
  }

  /** Recorta un texto largo sin cortar a la mitad lo que coincidió. */
  function extracto(texto, termino, largo) {
    var original = String(texto == null ? '' : texto);
    largo = largo || 110;
    if (original.length <= largo) return original;
    var Q = consulta(termino);
    var pos = Q.vacia ? -1 : normaliza(original).indexOf(Q.palabras[0] || '');
    if (pos < 0) return original.slice(0, largo).trim() + '…';
    var ini = Math.max(0, pos - Math.floor(largo / 3));
    return (ini > 0 ? '…' : '') + original.slice(ini, ini + largo).trim() + '…';
  }

  /* ── Reconocedores ─────────────────────────────────────────────────────────
     Saber QUÉ escribió la persona deja preguntar mejor: un folio se puede abrir
     directo, un correo busca por cliente, y ninguno de los dos necesita gastar
     una llamada al servidor si son dos letras sueltas. */
  var RE_FOLIO = /^[a-z]{2,5}[-\s]?\d{2,}(?:[-\s]?\d+)*$/i;

  function esCorreo(q) { return RE_CORREO.test(String(q || '').trim()); }
  function esFolio(q) {
    var s = String(q || '').trim();
    return RE_FOLIO.test(s) || /^\d{4,}$/.test(s);
  }
  /** Folio en su forma canónica para comparar: "lvp 123" y "LVP-123" → "lvp123". */
  function claveFolio(q) { return compacta(q); }

  window.AppBuscar = {
    normaliza: normaliza,
    compacta: compacta,
    palabras: palabras,
    consulta: consulta,
    campo: preparaCampo,
    puntua: puntua,
    puntuaTexto: puntuaTexto,
    coincide: coincide,
    filtra: filtra,
    resalta: resalta,
    extracto: extracto,
    escapa: escapa,
    distancia: distancia,
    esCorreo: esCorreo,
    esFolio: esFolio,
    claveFolio: claveFolio,
    agregaSinonimos: agregaSinonimos
  };
})();
</script>
