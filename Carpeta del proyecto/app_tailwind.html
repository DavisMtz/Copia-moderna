/**
 * =====================================================================================
 * TAILWIND COMPILADO | Sistema de cotizaciones Ventel
 * =====================================================================================
 * Sustituye a <script src="https://cdn.tailwindcss.com"></script>, que estaba pensado
 * SOLO para desarrollo: descargaba ~100 KB de compilador y generaba el CSS en el
 * navegador en cada carga, con la app dependiendo de una red externa.
 *
 * Aquí está exactamente lo que el proyecto usa, en dos partes:
 *   1. PREFLIGHT  — el reset de Tailwind v3. NO es opcional: todo el maquetado
 *                   (márgenes de body y títulos, botones sin estilo, box-sizing,
 *                   bordes en 0) da por hecho que está aplicado.
 *   2. UTILIDADES — las clases realmente presentes en el markup.
 *
 * DÓNDE VA: al FINAL del <head>, después de app_theme y del <style> de la pantalla.
 * El CDN inyectaba su hoja al final del head en tiempo de ejecución, así que este
 * orden reproduce la cascada que la app ya tenía. Moverlo cambia qué regla gana.
 *
 * AL AGREGAR UNA CLASE NUEVA en el markup hay que agregarla también aquí: ya no hay
 * un compilador que la invente sola. Las clases propias del sistema de diseño
 * (v-btn, v-card, v-table…) viven en app_theme y no dependen de este archivo.
 *
 * Escala, colores y sombras son los valores por omisión de Tailwind v3.4, más los
 * colores de marca que definía tailwind.config: brand-pink #E10098 / dark #b8007c.
 */
