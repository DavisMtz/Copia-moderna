<!-- ════════════════════════════════════════════════════════════════════════
     AURA · el contorno vivo de los buscadores
     ────────────────────────────────────────────────────────────────────────
     El buscador general llega a casi cualquier sitio de la aplicación —una
     herramienta, una paquetería, un proceso, un cliente que espera llamada— y
     aun así se lee como un campo de texto más. Esto es lo que lo distingue sin
     gritar: un cono de luz que recorre el filo por su cuenta, se engancha al
     puntero cuando hay puntero, y se enciende de verdad al acercarse al borde.

     ── CÓMO SE PINTA ──────────────────────────────────────────────────────
     El filo se pinta con una MALLA de color —siete manchas rosas de distinta
     profundidad— y sobre ella una VENTANA CÓNICA que sólo deja ver un sector.
     Eso cambia dos cosas frente a un anillo de color girando:

       · el color ya no es plano: según por dónde pase la ventana asoma el rosa
         claro, el de marca o el profundo, y nunca dos vueltas iguales;
       · la ventana tiene dirección, así que puede APUNTAR. En reposo gira sola;
         con el ratón encima persigue al cursor; y su fuerza sube conforme el
         cursor se acerca al borde —en el centro del campo apenas se nota, sobre
         el filo se enciende del todo—.

     Seis capas, y cada una hace una sola cosa:

       halo    · el suelo del contorno. Va bajísimo a propósito (.05 en reposo,
                 .16 con el cursor dentro): es lo que evita que el filo se corte
                 en los tramos donde el cono no llega, no el protagonista. Un
                 anillo macizo al 60 % se lee como un aviso de error.
       malla   · el corazón. Mesh de rosas de marca + ventana cónica.
       chispa  · dientes finos girando al revés y parpadeando con tiempos
                 irregulares. Cruzándose con la malla produce un batido que se
                 lee como corriente. Va en el límite de lo perceptible (nivel 3
                 de 10); no está para verse, está para que el filo no parezca
                 pintado. Al enfocar no sube de brillo: acelera.
       luz     · un foco redondo que SIGUE AL PUNTERO por dentro del marco.
                 Como el campo tapa el centro, sólo se enciende el tramo de
                 filo que queda junto al cursor. Es el punto caliente dentro del
                 arco largo que dibuja la malla.
       cometa  · el punzante. Un arco corto y brillante que da una vuelta rápida
                 y desaparece varios segundos. Al enfocar deja de esperar y
                 orbita seguido, porque entonces sí hay algo ocurriendo.
       arco    · el resplandor de FUERA. Un anillo de sombras rosas al que se le
                 aplica la misma ventana cónica, así que sólo resplandece el
                 tramo hacia el que mira la malla. Es lo que hace que el campo
                 parezca encenderse en lugar de cambiar de color.

     ── POR QUÉ NO HAY ESTADOS, SINO FÍSICA ────────────────────────────────
     Esta es la decisión que gobierna el archivo entero, y la razón de que se
     sienta fluido en vez de correcto.

     Lo natural sería una animación por estado: una que gire en reposo, otra que
     persiga al cursor, otra que suba el brillo al enfocar, y apagar unas para
     encender otras. Eso produce COSTURAS: en cada cambio hay un instante en que
     dos animaciones escriben lo mismo, o en que una empieza a velocidad cero
     justo donde la otra iba lanzada. Es exactamente lo que se percibe como
     "hecho a trozos", y no se arregla con más `ease`: son dos movimientos
     distintos pegados, no uno.

     Aquí no hay estados: hay UN integrador —un único paso por fotograma— con
     tres reglas y nada más:

       1. el cono tiene VELOCIDAD ANGULAR, y esa velocidad tiende siempre a la
          de crucero (una vuelta cada 26 s);
       2. si hay un cursor, además actúa un RESORTE que tira del cono hacia él,
          con su amortiguación — por eso llega, se pasa un pelo y se asienta;
       3. cada opacidad persigue su objetivo por acercamiento exponencial, que
          nunca da un salto porque siempre parte de donde está.

     Con eso, todo lo que en otro diseño sería una transición aquí sale gratis:
     entrar con el ratón no "arranca" nada —sólo aparece un objetivo—, salir no
     "para" nada —el objetivo desaparece y la velocidad vuelve sola a la de
     crucero—, y el tirón de una tecla es un empujón a la misma velocidad. No
     hay dos caminos que sincronizar porque no hay dos caminos.

     La entrada, incluso, deja de ser una animación: el contorno nace apagado,
     con el cono a 300°/s. El integrador hace el resto —barre rápido, frena,
     se posa en su vuelta lenta— y lo que se ve es exactamente el gesto que se
     quería, sin una sola línea de tiempo dedicada.

     POR QUÉ SE GIRA UN ELEMENTO Y NO EL ÁNGULO DEL DEGRADADO. La forma corta de
     escribir esto es `conic-gradient(from var(--angulo))` y animar la variable.
     Se ve igual y cuesta muchísimo más: cada fotograma obliga a rasterizar de
     nuevo el degradado entero. Aquí la ventana cónica se declara UNA vez desde
     0° y lo que gira es la capa que la lleva puesta —la máscara vive en el
     espacio local del elemento, así que rota con él—. Resultado idéntico,
     transform puro, lo resuelve el compositor. Importa: esto vive en la barra
     superior, que está fija en pantalla todo el día.

     El resplandor exterior usa el mismo truco al revés: el contenedor rota para
     llevarse la ventana cónica, y el anillo de sombras de dentro CONTRARROTA la
     misma cantidad, así que se queda quieto mientras la ventana pasa por encima.

     Degradación (el contrato de la casa): sin GSAP o con `prefers-reduced-motion`
     no gira nada. Queda el halo, que responde al ratón y al foco con
     transiciones de CSS, y el anillo de foco original SIGUE en su sitio: sólo
     se cede cuando el aura está animando de verdad y tiene un resplandor con
     el que sustituirlo. Nadie se queda sin saber dónde está el cursor porque
     el CDN no contestara.

     API · window.VentelAura
       · mount(host, opts)  -> monta el aura en un contenedor con position:relative
       · auto(root)         -> monta todo [data-vx-aura] que encuentre
       · destroy(host)      -> mata el integrador y quita el DOM

     opts = {
       intensidad : 'normal' | 'sutil',
       modo       : 'campo' | 'panel',   // 'panel' = el filo va por dentro
       energia    : 3,                   // 0..10, el chisporroteo
       destello   : true,                // el barrido al entrar el ratón
       radio      : null                 // se lee del propio elemento
     }

     MODO PANEL. `campo` da por hecho lo de siempre: un `input` dentro de un
     contenedor que no recorta, así que el marco puede salirse 1.5 px y el
     resplandor 30 px más. La paleta de comandos no es eso —es una caja con
     `overflow:hidden`, y ahí cualquier cosa que se salga desaparece—, así que
     en `panel` el marco va por DENTRO (inset 0) y el contenido, con su fondo
     opaco, deja asomar el filo por los cuatro lados. Sin arco exterior: lo
     recortaría el propio panel. Ese resplandor lo pone el panel con su sombra.

     `energia` va de 0 a 10 y sale de `data-vx-energia`. Es el chisporroteo del
     filo: 0 lo apaga, 3 —el valor por omisión— lo deja en el límite de lo que
     se percibe sin llegar a mirarlo, que es donde tiene que estar.

     No necesita ningún plugin: núcleo de GSAP y ya. Si no está, se queda quieto.
     ════════════════════════════════════════════════════════════════════════ -->
<style>
  /* ── Paleta y fuerza ──────────────────────────────────────────────────
     Los colores son los de siempre —el rosa de marca y sus dos vecinos— y se
     leen de los tokens del tema, así que el aura hereda aurora, slate y carbón
     sin una sola regla por tema.

     `--vx-fuerza` es el multiplicador global de todas las opacidades. En claro
     va a 1; en carbón el mismo brillo se lee más flojo contra un fondo casi
     negro, así que sube. Lo lee el JS UNA vez al montar. */
  .vx-aura-host{
    --vx-fuerza:1;
    --vx-c1:var(--brand-bright,#EE2BAB);   /* el rosa que canta   */
    --vx-c2:var(--brand,#E10098);          /* el rosa de marca    */
    --vx-c3:var(--brand-deep,#A8006F);     /* la sombra del rosa  */
    --vx-c4:#FFC2E8;                       /* el destello, casi blanco */
    --vx-cono:22;                           /* medio ancho de la ventana, en % de la vuelta */
    /* Cuánto se sale el resplandor. Treinta píxeles no es un número redondo por
       gusto: el buscador vive en una barra superior con 13.6 px de aire arriba,
       y todo lo que pase de ahí se derrama fuera de la barra. Treinta deja que
       el halo se note sin que parezca que la barra gotea. */
    --vx-glow:30px;
  }
  [data-theme="carbon"] .vx-aura-host{--vx-fuerza:1.3}
  [data-theme="slate"]  .vx-aura-host{--vx-fuerza:1.06}

  /* ── El marco recortado ───────────────────────────────────────────────
     Se sale 1.5px del campo por los cuatro lados y recorta con el mismo radio,
     así lo único que asoma del disco que gira dentro es ese filo. El campo se
     sube a z-index:1 con su fondo opaco y tapa el resto: eso es lo que
     convierte un disco girando en un contorno. */
  .vx-aura{
    position:absolute;inset:-1.5px;z-index:0;
    border-radius:15px;                       /* lo ajusta el JS al del campo */
    overflow:hidden;
    pointer-events:none;
    /* Una sombra de apoyo, corta y difusa. El resplandor con dirección lo pone
       el arco; ésta sólo da cuerpo, y va por transición de CSS —una sombra
       difuminada es de las cosas más caras de repintar— para que se pague sólo
       durante los 420 ms del cambio. */
    box-shadow:0 0 0 0 rgba(225,0,152,0);
    transition:box-shadow .42s cubic-bezier(.22,1,.36,1);
  }
  .vx-aura-host:hover .vx-aura{box-shadow:0 5px 18px -10px rgba(225,0,152,.45)}
  .vx-aura-host:focus-within .vx-aura{box-shadow:0 8px 26px -10px rgba(225,0,152,.6)}
  /* En panel el filo va por dentro: el marco cubre la caja entera y es el
     contenido, con su fondo opaco, el que deja asomar el borde. */
  .vx-aura-panel > .vx-aura{inset:0}
  .vx-aura-panel:hover .vx-aura,
  .vx-aura-panel:focus-within .vx-aura{box-shadow:none}

  /* El filo de marca. Es la capa que se ve siempre, también sin GSAP.
     Su opacidad se declara AQUÍ y no desde JavaScript a propósito: un
     `style.opacity` en línea gana a cualquier regla de CSS, y entonces las
     dos de abajo —las que dan respuesta al ratón y marcan el foco cuando no
     hay GSAP— no llegarían a aplicarse nunca. */
  .vx-aura-halo{
    position:absolute;inset:0;border-radius:inherit;
    background:var(--brand,#E10098);
    opacity:.05;
    transition:opacity .38s cubic-bezier(.22,1,.36,1);
  }
  .vx-aura-sutil .vx-aura-halo{opacity:.035}
  /* Con el integrador en marcha el halo lo escribe él, fotograma a fotograma.
     Dejar puesta la transición sería pedirle al navegador que interpole entre
     dos valores que ya vienen interpolados: la respuesta se retrasaría 380 ms y
     el halo iría siempre por detrás del resto del componente. */
  .vx-aura-vivo .vx-aura-halo{transition:none}

  /* Las capas que giran. Centradas con `translate` —propiedad aparte— para
     que GSAP se quede con `transform` entero y no haya que reescribir el
     centrado en cada fotograma.

     El tamaño lo pone el JS: un CUADRADO del largo de la diagonal del host. Es
     lo que hace que los ángulos del cono sean ángulos de verdad — en un
     rectángulo, un `conic-gradient` reparte los grados sobre una elipse y el
     mismo sector se ve ancho arriba y estrecho a los lados. Los valores de aquí
     son sólo el respaldo del primer fotograma. */
  .vx-aura-malla,
  .vx-aura-chispa,
  .vx-aura-cometa{
    position:absolute;left:50%;top:50%;
    width:170%;min-width:260px;aspect-ratio:1;
    translate:-50% -50%;
    border-radius:50%;
    will-change:transform;
    opacity:0;                                /* las enciende el JS */
  }

  /* ── La malla ─────────────────────────────────────────────────────────
     Siete manchas de rosa a distinta profundidad sobre una base de marca. No
     es decoración: es lo que hace que el filo tenga COLOR variable en vez de
     un tono plano. Al girar, la ventana cónica va descubriendo unas y tapando
     otras, y por eso ninguna vuelta se parece a la anterior.

     Las posiciones están repartidas a ojo y desiguales a propósito. En una
     rejilla regular el ojo encuentra el patrón en dos vueltas y el efecto se
     convierte en una rueda de colores girando. */
  .vx-aura-malla{
    background:
      radial-gradient(at 80% 55%, var(--vx-c1) 0px, transparent 50%),
      radial-gradient(at 69% 34%, var(--vx-c4) 0px, transparent 50%),
      radial-gradient(at  8%  6%, var(--vx-c3) 0px, transparent 50%),
      radial-gradient(at 41% 38%, var(--vx-c2) 0px, transparent 50%),
      radial-gradient(at 86% 85%, var(--vx-c3) 0px, transparent 50%),
      radial-gradient(at 82% 18%, var(--vx-c1) 0px, transparent 50%),
      radial-gradient(at 51%  4%, var(--vx-c4) 0px, transparent 50%),
      linear-gradient(var(--vx-c2) 0 100%);

    /* La ventana. Se declara desde 0° y NO se anima nunca: lo que gira es el
       elemento, y la máscara —que vive en su espacio local— gira con él.

       Los veinte puntos de degradado a cada lado son lo que separa un barrido
       de una cuchilla: con el corte seco se ve pasar un borde recto por el
       filo, y el ojo lo lee como un fallo de pintado antes que como luz. */
    -webkit-mask-image:conic-gradient(from 0deg at center,
      #000 0%,
      #000 calc(var(--vx-cono) * 1%),
      transparent calc((var(--vx-cono) + 20) * 1%),
      transparent calc((80 - var(--vx-cono)) * 1%),
      #000 calc((100 - var(--vx-cono)) * 1%),
      #000 100%);
            mask-image:conic-gradient(from 0deg at center,
      #000 0%,
      #000 calc(var(--vx-cono) * 1%),
      transparent calc((var(--vx-cono) + 20) * 1%),
      transparent calc((80 - var(--vx-cono)) * 1%),
      #000 calc((100 - var(--vx-cono)) * 1%),
      #000 100%);
  }

  /* Chispa: nueve dientes estrechos y desiguales girando AL REVÉS que la malla.
     Es la capa que da la sensación de corriente, y no lo hace por sí sola: lo
     hace al cruzarse con la malla. Dos cónicos de distinto paso girando en
     sentidos opuestos se refuerzan y se cancelan a lo largo del filo, y ese
     batido —que nunca cae dos veces en el mismo sitio, porque 26 s y 9.5 s no
     encajan— es lo que se lee como carga y no como "algo dando vueltas".

     Los dientes van desiguales (7°, 5°, 9°, 4°…) a propósito: repartidos a
     intervalos iguales el ojo los cuenta y el efecto se convierte en una rueda
     dentada girando. La irregularidad es lo que lo mantiene en "chisporroteo".

     Va bajísima —el nivel 3 por defecto la deja en .11 de opacidad— porque a
     partir de ahí deja de ser una textura y empieza a ser un adorno. */
  .vx-aura-chispa{
    background:conic-gradient(from 0deg,
      transparent 0deg,
      var(--vx-c1)  7deg,  transparent 14deg,
      transparent 38deg,
      var(--vx-c4) 43deg,  transparent 48deg,
      transparent 74deg,
      var(--vx-c1) 83deg,  transparent 92deg,
      transparent 121deg,
      var(--vx-c2) 125deg, transparent 130deg,
      transparent 168deg,
      var(--vx-c4) 175deg, transparent 181deg,
      transparent 204deg,
      var(--vx-c1) 212deg, transparent 219deg,
      transparent 253deg,
      var(--vx-c2) 261deg, transparent 265deg,
      transparent 296deg,
      var(--vx-c4) 304deg, transparent 311deg,
      transparent 335deg,
      var(--vx-c1) 341deg, transparent 349deg,
      transparent 360deg);
  }

  /* Cometa: transparente casi toda la vuelta y un núcleo estrecho y claro.
     Los 14° de núcleo son lo "punzante"; ensancharlos lo convierte en una
     mancha girando, que es justo lo que no queremos. */
  .vx-aura-cometa{
    background:conic-gradient(from 0deg,
      transparent 0deg,
      transparent 292deg,
      color-mix(in srgb,var(--vx-c2) 45%,transparent) 320deg,
      var(--vx-c1) 340deg,
      #fff 347deg,
      var(--vx-c1) 352deg,
      transparent 360deg);
  }

  /* Luz de puntero: un foco redondo que sigue al ratón por dentro del marco.
     Como el campo tapa el centro, lo único que se enciende es el tramo de filo
     que queda junto al cursor. La malla dibuja el arco largo; esto pone el
     punto caliente exactamente donde está la mano.

     El margen negativo centra el círculo en (x,y) sin gastar el `transform`,
     que es del integrador. */
  .vx-aura-luz{
    position:absolute;top:0;left:0;
    width:172px;height:172px;margin:-86px 0 0 -86px;
    border-radius:50%;
    background:radial-gradient(circle closest-side,
      color-mix(in srgb,#fff 55%,var(--vx-c1)) 0%,
      var(--vx-c1) 32%,
      color-mix(in srgb,var(--vx-c2) 60%,transparent) 58%,
      transparent 78%);
    opacity:0;will-change:transform;pointer-events:none;
  }

  /* ── El resplandor de fuera ───────────────────────────────────────────
     Un anillo de seis sombras rosas que envuelve el campo. Lo interesante no es
     el anillo: es que va dentro de un contenedor con la MISMA ventana cónica que
     la malla, así que sólo resplandece el tramo hacia el que mira el cono.

     El contenedor rota para llevarse la ventana; el anillo contrarrota lo
     mismo y por tanto se queda quieto. Las dos son `transform` sobre capas ya
     compuestas: el anillo se rasteriza una vez y después sólo se compone.

     Se sale 30 px por los cuatro lados, así que el host no puede recortar. En
     `modo:'panel'` esta capa ni se crea. */
  .vx-aura-arco{
    position:absolute;inset:calc(var(--vx-glow) * -1);z-index:0;
    pointer-events:none;opacity:0;will-change:transform;
    -webkit-mask-image:conic-gradient(from 0deg at center,
      #000 0%,
      #000 calc(var(--vx-cono) * 1%),
      transparent calc((var(--vx-cono) + 22) * 1%),
      transparent calc((78 - var(--vx-cono)) * 1%),
      #000 calc((100 - var(--vx-cono)) * 1%),
      #000 100%);
            mask-image:conic-gradient(from 0deg at center,
      #000 0%,
      #000 calc(var(--vx-cono) * 1%),
      transparent calc((var(--vx-cono) + 22) * 1%),
      transparent calc((78 - var(--vx-cono)) * 1%),
      #000 calc((100 - var(--vx-cono)) * 1%),
      #000 100%);
  }
  /* Seis sombras y ninguna `inset`: el anillo cae justo debajo del campo, que es
     opaco y del mismo tamaño, así que todo lo que pintara hacia dentro quedaría
     tapado —coste de pintado a cambio de nada—. Lo que se ve es sólo lo que se
     derrama hacia fuera, y por eso el desenfoque mayor (24 + 3) se queda por
     debajo de los 30 px del contenedor: la máscara recorta en su borde, y una
     sombra que llegue hasta el filo se corta en seco en vez de desvanecerse. */
  .vx-aura-arco > i{
    position:absolute;inset:var(--vx-glow);
    border-radius:15px;                        /* lo ajusta el JS */
    will-change:transform;
    box-shadow:
      0 0 1px 0    color-mix(in srgb,var(--vx-c1) 60%,transparent),
      0 0 3px 0    color-mix(in srgb,var(--vx-c1) 50%,transparent),
      0 0 6px 0    color-mix(in srgb,var(--vx-c1) 40%,transparent),
      0 0 12px 0   color-mix(in srgb,var(--vx-c2) 32%,transparent),
      0 0 18px 2px color-mix(in srgb,var(--vx-c2) 22%,transparent),
      0 0 24px 3px color-mix(in srgb,var(--vx-c2) 14%,transparent);
  }
  /* Sobre fondo casi negro el resplandor sólo suma: `plus-lighter` es lo que
     hace que se vea como luz de verdad y no como pintura rosa. En claro suma
     hacia el blanco y desaparece, así que ahí va normal. */
  [data-theme="carbon"] .vx-aura-arco{mix-blend-mode:plus-lighter}

  /* Destello: va POR ENCIMA del campo, porque barre el ancho del campo y no
     su contorno. Banda estrecha, inclinada y con el filo delantero de marca.
     `mix-blend-mode` lo funde con lo que haya debajo en vez de pintar una
     barra blanca sobre el texto. */
  .vx-aura-brillo{
    position:absolute;inset:0;z-index:2;
    border-radius:inherit;overflow:hidden;contain:paint;
    pointer-events:none;opacity:0;
  }
  .vx-aura-brillo i{
    position:absolute;top:-30%;bottom:-30%;left:0;width:60%;
    display:block;
    background:linear-gradient(100deg,
      transparent 0%,
      color-mix(in srgb,var(--vx-c2) 30%,transparent) 38%,
      color-mix(in srgb,#fff 88%,var(--vx-c1)) 50%,
      color-mix(in srgb,var(--vx-c2) 22%,transparent) 62%,
      transparent 100%);
    mix-blend-mode:soft-light;
    will-change:transform;
  }
  [data-theme="carbon"] .vx-aura-brillo i{mix-blend-mode:screen;opacity:.5}

  /* El campo, por encima del marco. Lo pone el JS al montar, pero también aquí
     para que valga desde el primer fotograma y no haya un parpadeo. */
  .vx-aura-host > input,
  .vx-aura-host > textarea{position:relative;z-index:1}
  /* En panel el contenido es un bloque cualquiera, no un campo: lo que suba por
     encima del marco es todo lo que no sea una capa del aura. */
  .vx-aura-panel > :not(.vx-aura):not(.vx-aura-brillo):not(.vx-aura-arco){
    position:relative;z-index:1;
  }

  /* Y los acompañantes por encima del campo. Esto NO es un detalle de estilo,
     es lo que arregla que la lupa y el chip del atajo desaparecieran en cuanto
     el aura se montaba:

     el icono, el chip y el botón de limpiar van `position:absolute` sin z-index
     propio, y el orden de pintado deja para el final todo lo que tenga z-index
     positivo. El campo, al subir a 1 para tapar el disco que gira, pasaba a
     pintarse DESPUÉS que ellos — y con su fondo opaco encima, los borraba.

     Se sube a 2, que es la capa del destello: el brillo va después en el árbol,
     así que sigue barriendo por encima de todos. */
  .vx-aura-host > .s-icon,
  .vx-aura-host > .s-kbd,
  .vx-aura-host > .s-clear,
  .vx-aura-host > .icon-search,
  .vx-aura-host > .search-clear,
  .vx-aura-host > [data-vx-icono],
  .vx-aura-host > [data-vx-atajo]{z-index:2}

  /* El borde propio del campo se templa hacia el color de marca. Sin esto se
     leen DOS anillos —el filete gris de siempre y el filo rosa por fuera— y
     compiten; con esto el contorno es uno solo que se va encendiendo. */
  .vx-aura-host > input,
  .vx-aura-host > textarea{
    border-color:color-mix(in srgb,var(--brand,#E10098) 12%,var(--line,#E4E9F0));
  }
  .vx-aura-host:hover > input,
  .vx-aura-host:hover > textarea{
    border-color:color-mix(in srgb,var(--brand,#E10098) 38%,var(--line,#E4E9F0));
  }
  /* Enfocado, el borde propio se queda a media asta en vez de irse al 100 %.
     Con los dos a tope se leen dos líneas duras y concéntricas —el filo del
     aura y el borde del campo— y el conjunto sale romo, más de aviso de error
     que de campo activo. Así la línea nítida es una sola, la del aura, y el
     borde del campo la acompaña por dentro.

     va entero. Las dos reglas pesan igual, y por eso el orden importa: la de

<script>

  function anima() { return typeof window.gsap !== 'undefined' && !reducido; }

  /* ── Las constantes del movimiento ──────────────────────────────────────

     aquí arriba; abajo sólo hay física. */

  /* Opacidades del halo. Son bajas a propósito: el halo es el suelo del
     contorno, no su protagonista. Lo que se ve moverse es la malla, y lo que
     llama es el cometa; un anillo macizo al 60 % se lee como un aviso de
     error, no como un campo vivo. */
  var HALO = { reposo: .05, encima: .14, dentro: .16 };
  var HALO_SUTIL = { reposo: .035, encima: .1, dentro: .12 };

  /* Malla y arco. `encima` y `dentro` son los TECHOS: lo que se alcanza con el
     cursor pegado al filo. En el centro del campo se queda en el suelo, y esa
     diferencia es todo el efecto. */
  var MALLA = { reposo: .34, encima: .60, dentro: .76 };
  var ARCO  = { reposo: .20, encima: .54, dentro: .80 };

  var CRUCERO = 13.85;        /* grados por segundo — una vuelta cada 26 s */
  var CRUCERO_FOCO = 21;      /* enfocado el cono no brilla más: corre más   */

  /* El resorte que engancha el cono al cursor. `K` es cuánto tira y `C` cuánto
     frena; con C algo por debajo del amortiguamiento crítico (2·√K ≈ 10.2) el
     cono llega, se pasa un pelo y se asienta. Eso es lo que se lee como peso.
     Subir C lo vuelve obediente y muerto; bajarlo, un péndulo. */
  var K = 26, C = 9.2;

  /* Constantes de tiempo de los acercamientos exponenciales, en segundos: en
     una constante se recorre el 63 % de lo que falta. */
  var TAU_VEL = .85;          /* la vuelta a la velocidad de crucero */
  var TAU_OP  = .30;          /* malla, arco y halo                  */
  var TAU_LUZ = .13;          /* el foco que sigue al puntero        */

  var RESPIRA = 6.4, RESPIRA_AMP = .17;   /* el vaivén del reposo */

  function campoDe(host) {
    return host.querySelector('input, textarea');
  }

  /* El radio se lee del elemento real en vez de escribirse aquí: el buscador
     del Portal usa 13px, el de Promociones `--rad-md` (12px) y el panel de
     comandos 18px. En modo campo se le suma el 1.5 que el marco se sale por
     fuera, que es lo que mantiene las dos curvas concéntricas; con cualquier
     otro número las esquinas se separan y el filo engorda justo en los
     redondeos. Es una sola lectura de estilo al montar, no una por fotograma. */
  function radioDe(campo, host, fuera) {
    var extra = fuera ? 1.5 : 0;
    if (campo) {
      try {
        var n = parseFloat(getComputedStyle(campo).borderTopLeftRadius);
        if (!isNaN(n) && n > 0) return (n + extra) + 'px';
      } catch (e) {}
    }
    try {
      var rh = parseFloat(getComputedStyle(host).borderTopLeftRadius);
      if (!isNaN(rh) && rh > 0) return (rh + extra) + 'px';
    } catch (e) {}
    return (13 + extra) + 'px';
  }

  /* El multiplicador del tema. Una lectura de estilo al montar; si el tema
     cambia en caliente el aura se queda con el valor con el que nació, que es
     una diferencia de brillo que nadie va a notar y ahorra un observador. */
  function fuerzaDe(host) {
    try {
      var v = parseFloat(getComputedStyle(host).getPropertyValue('--vx-fuerza'));
      if (!isNaN(v) && v > 0) return Math.min(1.6, v);
    } catch (e) {}
    return 1;
  }

  function crearCapa(clase) {
    var el = document.createElement('span');
    el.className = clase;
    el.setAttribute('aria-hidden', 'true');
    return el;
  }

  /** El camino más corto entre dos ángulos: ±180 y nunca la vuelta larga. */
  function corto(grados) {
    return ((grados % 360) + 540) % 360 - 180;
  }

  /**
   * Monta el aura en un contenedor `position:relative`.
   * En modo campo tiene que envolver a un input/textarea; en modo panel vale
   * cualquier caja con fondo propio (la paleta de comandos, por ejemplo).
   */
  function mount(host, opts) {
    if (!host || host.hasAttribute('data-vx-listo')) return null;
    opts = opts || {};
    var panel = opts.modo === 'panel';
    var campo = campoDe(host);
    if (!campo && !panel) return null;

    var sutil = opts.intensidad === 'sutil';
    host.setAttribute('data-vx-listo', '1');
    host.classList.add('vx-aura-host');
    if (sutil) host.classList.add('vx-aura-sutil');
    if (panel) host.classList.add('vx-aura-panel');

    var escala = sutil ? HALO_SUTIL : HALO;
    var fuerza = fuerzaDe(host) * (sutil ? .78 : 1);
    var radio  = opts.radio || radioDe(panel ? null : campo, host, !panel);

    /* Nivel de energía, de 0 a 10. El 10 no llega ni a .4 de opacidad: pasado
       ese punto la textura se convierte en un adorno y el filo deja de leerse
       como un borde. El 3 por omisión sale de ahí — es la mitad justa de lo
       poco que admite el efecto. */
    var nivel = opts.energia;
    if (nivel === undefined || nivel === null || isNaN(nivel)) nivel = 3;
    nivel = Math.max(0, Math.min(10, Number(nivel)));
    var ENE = { reposo: nivel * .036 * fuerza, viva: nivel * .058 * fuerza };

    /* ── DOM ──────────────────────────────────────────────────────────
       El marco va como PRIMER hijo: así queda por debajo del icono, del
       atajo de teclado y del botón de limpiar, que son absolutos y sin
       z-index propio, y por debajo del desplegable de resultados. */
    var marco  = crearCapa('vx-aura');
    var halo   = crearCapa('vx-aura-halo');
    var malla  = crearCapa('vx-aura-malla');
    var chispa = crearCapa('vx-aura-chispa');
    var luz    = crearCapa('vx-aura-luz');
    var cometa = crearCapa('vx-aura-cometa');
    marco.style.borderRadius = radio;
    marco.appendChild(halo);
    marco.appendChild(malla);
    marco.appendChild(chispa);
    marco.appendChild(luz);
    marco.appendChild(cometa);
    host.insertBefore(marco, host.firstChild);

    /* El resplandor exterior. Sólo en modo campo: en un contenedor que recorta
       se perdería entero, y peor aún, obligaría a quitarle el recorte al panel
       para nada. */
    var arco = null, anillo = null;
    if (!panel) {
      arco = crearCapa('vx-aura-arco');
      anillo = document.createElement('i');
      /* El anillo cae exactamente sobre el host —no sobre el marco, que se sale
         1.5 px—, así que lleva el radio del campo tal cual: con el del marco,
         el resplandor saldría de una esquina más abierta que la del campo y en
         los redondeos se vería despegado. */
      anillo.style.borderRadius = radioDe(campo, host, false);
      arco.appendChild(anillo);
      host.insertBefore(arco, host.firstChild);
    }

    /* Los dos acompañantes del campo. Puede no haberlos —el buscador de

    var icono = host.querySelector('.s-icon, .icon-search, [data-vx-icono]');

    if (opts.destello !== false) {

      brillo.style.borderRadius = radio;
      barra = document.createElement('i');
      brillo.appendChild(barra);
      host.appendChild(brillo);         /* por encima del campo */
    }

    var api = {
      host: host, marco: marco, halo: halo, malla: malla, chispa: chispa,
      luz: luz, cometa: cometa, arco: arco, brillo: brillo,
      nivel: nivel, panel: panel, tls: [], oyentes: []
    };
    host._vxAura = api;

    /* Sin GSAP el trabajo ya está hecho: el halo está puesto y el CSS se
       encarga de :hover y :focus-within. No hay nada que animar ni que
       limpiar después. */
    if (!anima()) return api;

    /* ── Movimiento ───────────────────────────────────────────────────
       Todo dentro de un contexto: un `revert()` en destroy() deshace las
       líneas de tiempo Y los estilos que dejaron puestos. La función que se
       devuelve al final es la limpieza propia —el integrador y el observador

    host.classList.add('vx-aura-vivo');

    var ctx = gsap.context(function () {

      /* ── Geometría ────────────────────────────────────────────────────

         Un `conic-gradient` reparte sus grados sobre la caja del elemento: en
         un rectángulo tumbado, un sector de 40° ocupa media anchura arriba y un
         suspiro en los costados, y el cono se ve deformarse al girar. Cuadrado,
         los grados son grados.

         El 8 % de más es para que las esquinas del campo no queden justo en el
         borde del disco, donde el degradado ya se está acabando. */
      var lado = 0;
      function mide() {
        var r = host.getBoundingClientRect();
        if (!r.width || !r.height) return;
        var d = Math.ceil(Math.sqrt(r.width * r.width + r.height * r.height) * 1.08);
        if (d === lado) return;
        lado = d;
        [malla, chispa, cometa].forEach(function (el) {
          el.style.width = d + 'px';
          el.style.height = d + 'px';
          el.style.minWidth = '0';

      mide();

      /* El panel de comandos cambia de alto con cada búsqueda y el buscador de
         la barra cambia de ancho con la ventana. Sin esto, el cono se queda con
         la geometría del primer fotograma y el filo se corta en las esquinas
         justo cuando la caja crece. */
      var ro = null;
      if (window.ResizeObserver) {

      /* ── El estado ────────────────────────────────────────────────────
         Nueve números. Todo lo que se ve moverse sale de aquí. */
      var E = {
        t: 0,               /* reloj propio, para el vaivén del reposo    */
        ang: -150,          /* grados del cono                            */
        vel: 300,           /* grados/s — el impulso con el que nace      */
        obj: null,          /* ángulo al que apunta el cursor, o nada     */
        cerca: 0,           /* 0 en el centro del campo, 1 pegado al filo */
        malla: 0, arco: 0, halo: 0,   /* opacidades vivas                 */
        lx: 0, ly: 0, lop: 0,         /* el foco del puntero              */
        tlx: 0, tly: 0,               /* a dónde va el foco               */
        pulso: 0,           /* el sobresalto de una tecla, que decae      */
        dentro: false, encima: false, listo: false

      gsap.delayedCall(.25, function () { E.listo = true; });

      /* ── Los escritores ───────────────────────────────────────────────

         se escribe sólo lo que cambió de verdad: en reposo las opacidades se
         mueven milésimas por fotograma, y ahorrarse esas escrituras es
         ahorrarse un recálculo de estilo por capa y por fotograma. */
      var ponMallaR  = gsap.quickSetter(malla, 'rotation', 'deg');
      var ponChispaO = gsap.quickSetter(chispa, 'opacity');
      var ponMallaO  = gsap.quickSetter(malla, 'opacity');
      var ponHaloO   = gsap.quickSetter(halo, 'opacity');
      var ponLuzX    = gsap.quickSetter(luz, 'x', 'px');
      var ponLuzY    = gsap.quickSetter(luz, 'y', 'px');
      var ponLuzO    = gsap.quickSetter(luz, 'opacity');
      var ponArcoR   = arco ? gsap.quickSetter(arco, 'rotation', 'deg') : null;
      var ponArcoO   = arco ? gsap.quickSetter(arco, 'opacity') : null;
      var ponAnilloR = arco ? gsap.quickSetter(anillo, 'rotation', 'deg') : null;

      var ult = { ang: null, malla: -1, arco: -1, halo: -1, lx: null, ly: null, lop: -1 };

      /* ── El paso ──────────────────────────────────────────────────────
         Un único integrador, una vez por fotograma. No hay estados que
         encender ni apagar: hay objetivos, y lo que se ve es cómo el sistema
         va hacia ellos. */
      function paso(tiempo, delta) {
        /* El tope de 50 ms es la red contra un fotograma perdido —una pestaña
           que vuelve, una pausa del recolector—: sin él, un delta de un segundo
           haría avanzar el cono un cuarto de vuelta de golpe y, peor, volvería
           inestable el resorte, que da por hecho pasos pequeños. */
        var dt = Math.min(delta, 50) / 1000;
        E.t += dt;

        /* ── el ángulo ──
           Regla 1: la velocidad tiende siempre a la de crucero.
           Regla 2: si hay cursor, un resorte tira del cono hacia él.
           No hay una tercera. */
        if (E.obj === null) {
          var crucero = E.dentro ? CRUCERO_FOCO : CRUCERO;
          E.vel += (crucero - E.vel) * (1 - Math.exp(-dt / TAU_VEL));
        } else {
          E.vel += (K * corto(E.obj - E.ang) - C * E.vel) * dt;
        }
        E.ang += E.vel * dt;
        if (E.ang > 3600 || E.ang < -3600) E.ang = corto(E.ang);   /* sin números enormes */

        /* ── las opacidades ──
           Objetivo = suelo + (techo − suelo) × cercanía al borde. Sin cursor,
           la cercanía es 0 y manda el suelo; y en reposo el suelo respira. */
        var k = 1 - Math.exp(-dt / TAU_OP);
        var quieto = !E.dentro && !E.encima;
        var vaiven = quieto ? 1 + RESPIRA_AMP * Math.sin(E.t * 2 * Math.PI / RESPIRA) : 1;

        var sueloM = (E.dentro ? MALLA.encima : MALLA.reposo) * vaiven;
        var techoM =  E.dentro ? MALLA.dentro : MALLA.encima;
        var objM = E.listo ? (sueloM + (techoM - sueloM) * E.cerca + E.pulso) * fuerza : 0;
        E.malla += (Math.min(1, objM) - E.malla) * k;

        if (ponArcoO) {
          var sueloA = (E.dentro ? ARCO.encima : ARCO.reposo) * vaiven;
          var techoA =  E.dentro ? ARCO.dentro : ARCO.encima;
          var objA = E.listo ? (sueloA + (techoA - sueloA) * E.cerca) * fuerza : 0;
          E.arco += (Math.min(1, objA) - E.arco) * k;
        }

        var objH = !E.listo ? 0
                 : E.dentro ? escala.dentro
                 : E.encima ? escala.encima
                 : escala.reposo;
        E.halo += (objH - E.halo) * k;

        /* El sobresalto de una tecla se va solo, y por eso no hace falta ni
           antirrebote ni una bandera de "ya está pulsando". */
        if (E.pulso > .001) E.pulso *= Math.exp(-dt / .26); else E.pulso = 0;

        /* ── el foco del puntero ──
           Su retraso propio —más corto que el del cono— es lo que hace que la
           luz vaya pegada a la mano mientras el cono llega detrás. Ese desfase
           entre las dos capas es media sensación de profundidad. */
        var kl = 1 - Math.exp(-dt / TAU_LUZ);
        E.lx += (E.tlx - E.lx) * kl;
        E.ly += (E.tly - E.ly) * kl;
        var objL = E.encima ? .9 : (E.dentro ? .55 : 0);
        E.lop += (objL - E.lop) * (1 - Math.exp(-dt / (objL > E.lop ? .18 : .5)));

        /* ── a la pantalla ── */
        if (ult.ang === null || Math.abs(E.ang - ult.ang) > .02) {
          ponMallaR(E.ang); ult.ang = E.ang;
          if (ponArcoR) { ponArcoR(E.ang); ponAnilloR(-E.ang); }
        }
        if (Math.abs(E.malla - ult.malla) > .002) { ponMallaO(E.malla); ult.malla = E.malla; }
        if (Math.abs(E.halo  - ult.halo)  > .002) { ponHaloO(E.halo);   ult.halo  = E.halo; }
        if (ponArcoO && Math.abs(E.arco - ult.arco) > .002) { ponArcoO(E.arco); ult.arco = E.arco; }
        if (ult.lx === null || Math.abs(E.lx - ult.lx) > .3) { ponLuzX(E.lx); ult.lx = E.lx; }
        if (ult.ly === null || Math.abs(E.ly - ult.ly) > .3) { ponLuzY(E.ly); ult.ly = E.ly; }
        if (Math.abs(E.lop - ult.lop) > .003) { ponLuzO(E.lop); ult.lop = E.lop; }
      }

      gsap.ticker.add(paso);

      /* ── Lo que sí es una línea de tiempo ─────────────────────────────
         Dos cosas no son física continua sino sucesos con su propio guion: el
         chisporroteo, que es aleatorio por definición, y el cometa, que aparece
         cada tantos segundos. Esas siguen siendo timelines de GSAP. */

      var tlChispa = null;
      if (nivel > 0) {
        function eneTecho() {
          if (E.dentro) return ENE.viva;
          if (E.encima) return (ENE.reposo + ENE.viva) / 2;
          return ENE.reposo;
        }
        /* La chispa se escribe con su propio quickSetter desde un tween sobre un
           objeto: así el parpadeo lee el estado actual en cada repetición
           (`repeatRefresh`) sin que nadie tenga que rehacer el tween cuando el
           ratón entra o sale. */
        var ch = { o: 0 };
        tlChispa = gsap.timeline()
          .to(chispa, { rotation: -360, duration: 9.5, ease: 'none', repeat: -1 }, 0)
          .to(ch, {
            o: function () { var t = eneTecho(); return gsap.utils.random(t * .45, t); },
            duration: function () { return gsap.utils.random(.28, .6); },
            ease: 'power1.inOut', repeat: -1, repeatRefresh: true,
            onUpdate: function () { ponChispaO(E.listo ? ch.o : 0); }
          }, .9);
        api.tls.push(tlChispa);
      }

      /* El cometa: una vuelta rápida y a esperar. `power2.inOut` es lo que lo
         hace "controlado" en vez de mecánico —arranca, cruza y frena—, y el
         retraso largo es lo que lo hace notar en vez de molestar: si diera
         vueltas sin parar sería un spinner, y un spinner dice "espera", que
         es justo lo contrario de lo que este campo tiene que decir.

         La primera vuelta sale a la vez que el barrido de nacimiento: es el
         gesto que enseña, sin que nadie lo diga, que este borde hace cosas. */
      var tlCometa = gsap.timeline({ repeat: -1, repeatDelay: 6.4, delay: .45 })
        .set(cometa, { rotation: -110 })
        .to(cometa, { opacity: 1, duration: .18, ease: 'power1.out' })
        .to(cometa, { rotation: 250, duration: 1.2, ease: 'power2.inOut' }, 0)
        .to(cometa, { opacity: 0, duration: .34, ease: 'power1.in' }, '-=.36');
      api.tls.push(tlCometa);

      /* El destello. Una sola pasada, con el ease cargado al final para que
         entre rápido y salga frenando: eso es lo que lo hace cinematográfico
         y no una barra cruzando. Se reutiliza pausada en vez de crear un
         tween por cada vez que el ratón entra. */
      var tlBrillo = null, sentido = 1;   /* 1 = hacia la derecha, -1 = hacia la izquierda */
      if (barra) {
        gsap.set(barra, { xPercent: -160, rotate: 8 });
        tlBrillo = gsap.timeline({ paused: true })
          .set(brillo, { opacity: 1 })
          /* Valores por función para que `invalidate()` los relea: así el mismo
             tween sirve para los dos sentidos sin construir uno de cada. */
          .fromTo(barra,
            { xPercent: function () { return sentido > 0 ? -160 : 260; } },
            { xPercent: function () { return sentido > 0 ? 260 : -160; },
              duration: .78, ease: 'power3.inOut' })
          .to(brillo, { opacity: 0, duration: .2, ease: 'power1.in' }, '-=.18');
        api.tls.push(tlBrillo);
      }

      /* ── Los acompañantes ─────────────────────────────────────────────
         El icono y el chip del atajo van centrados con `translateY(-50%)` desde
         el CSS de cada pantalla, y GSAP reescribe `transform` entero en cuanto
         los toca: por eso hay que devolverle el centrado como `yPercent`.

         `force3D:false` no es cosmética. Con la aceleración 3D que GSAP pone por
         defecto, el icono se promociona a su propia capa y se rasteriza a media
         posición de píxel: una lupa de 18 px con trazo de 2 px sale visiblemente
         borrosa y se queda así mientras dure el estilo en línea. En 2D el
         navegador la dibuja nítida.

         Y al volver a reposo se limpia el `transform` entero: lo mejor que le
         puede pasar al icono el 99 % del tiempo es no tener nada escrito encima. */
      function icoA(escalaIcono, vuelve) {
        if (!icono) return;
        gsap.to(icono, {
          scale: escalaIcono, yPercent: -50, duration: vuelve ? .45 : .5,
          ease: vuelve ? 'power2.out' : 'back.out(2.2)',
          force3D: false, overwrite: 'auto',
          onComplete: vuelve ? function () { gsap.set(icono, { clearProps: 'transform' }); } : null
        });
      }
      function atajoA(op, y, vuelve) {
        if (!atajo) return;
        gsap.to(atajo, {
          opacity: op, y: y, yPercent: -50, duration: vuelve ? .35 : .3,
          ease: vuelve ? 'power2.out' : 'power2.in',
          force3D: false, overwrite: 'auto',
          onComplete: vuelve ? function () { gsap.set(atajo, { clearProps: 'transform' }); } : null
        });
      }

      /* ── Lo que hace la mano ──────────────────────────────────────────
         Los manejadores no animan: sólo cambian objetivos. Es la diferencia
         entre un componente con costuras y uno que se mueve solo. */

      var caja = null;

      /* Cercanía al borde, de 0 (justo en el centro) a 1 (tocando el filo).
         Se compara cuánto queda para salirse por el eje que antes se agote, así
         que la diagonal y el lado largo dan el mismo 1 en el borde. Sin esto, un
         campo de 560×44 daría casi siempre 1 por arriba y nunca por los lados. */
      function cercania(x, y) {
        var cx = caja.width / 2, cy = caja.height / 2;
        var dx = Math.abs(x - cx), dy = Math.abs(y - cy);
        var kx = dx === 0 ? Infinity : cx / dx;
        var ky = dy === 0 ? Infinity : cy / dy;
        return Math.min(Math.max(1 / Math.min(kx, ky), 0), 1);
      }

      /* El rectángulo se mide UNA vez, al entrar. Leerlo en cada movimiento
         obligaría al navegador a recalcular la disposición sesenta veces por
         segundo para saber algo que no ha cambiado. */
      function mueve(ev) {
        if (!caja) return;
        var x = ev.clientX - caja.left, y = ev.clientY - caja.top;
        E.tlx = x; E.tly = y;
        E.cerca = cercania(x, y);

        var dx = x - caja.width / 2, dy = y - caja.height / 2;
        if (dx || dy) E.obj = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      }

      function entra(ev) {
        E.encima = true;
        caja = marco.getBoundingClientRect();
        if (ev && ev.clientX !== undefined) {
          /* La luz aparece YA en el punto por el que ha entrado el cursor, no
             viajando desde donde se quedó la última vez: si no, cada entrada
             empieza con un barrido fantasma cruzando el campo. */
          E.lx = E.tlx = ev.clientX - caja.left;
          E.ly = E.tly = ev.clientY - caja.top;
          mueve(ev);
        }

        /* El cometa se adelanta a su turno: el destello y la vuelta salen
           juntos, y esa coincidencia es la que se lee como respuesta. */
        tlCometa.restart(true);

        /* El barrido sale hacia donde va la mirada: si el cursor entró por la
           derecha, cruza hacia la derecha. Un destello que va siempre en el
           mismo sentido delata que es una animación enlatada; que siga al
           gesto es lo que lo hace parecer causado por ti.
           Sólo con el campo vacío: con texto escrito sería luz pasando por
           encima de lo que la persona está leyendo. */
        if (tlBrillo && !(campo && campo.value)) {
          var porLaDerecha = !!(ev && caja && (ev.clientX - caja.left) > caja.width / 2);
          sentido = porLaDerecha ? -1 : 1;
          gsap.set(barra, { rotate: porLaDerecha ? -8 : 8 });
          tlBrillo.invalidate().restart();
        }
      }

      /* Al salir no se para nada: se quita el objetivo. El cono sigue con la
         velocidad que llevaba y el integrador la devuelve a la de crucero por
         el camino largo, que es justo lo que se ve como inercia. */
      function sale() {
        E.encima = false;
        E.obj = null;
        E.cerca = 0;
        caja = null;
        if (E.dentro) luzAlCursor();
      }

      /* Con el teclado no hay puntero al que seguir, y quien entra con `/` o
         con el tabulador se merece la misma luz que quien entra con el ratón.
         Se aparca junto al principio del texto, que es donde va a estar
         mirando. */
      function luzAlCursor() {
        var r = marco.getBoundingClientRect();
        E.tlx = Math.min(64, r.width * .16);
        E.tly = r.height / 2;
      }

      function enfoca() {
        E.dentro = true;
        /* Con el cursor dentro el cometa deja de esperar: órbita seguida y un
           poco más lenta. Ya no tiene que llamar la atención —ya la tiene—,
           tiene que acompañar. */
        tlCometa.repeatDelay(0);
        gsap.to(tlCometa, { timeScale: .8, duration: .5, ease: 'power2.out' });
        tlCometa.restart(true);
        if (tlChispa) gsap.to(tlChispa, { timeScale: 1.35, duration: .6, ease: 'power2.out' });

        /* El levantamiento. Un píxel: no se ve, se nota. `expo.out` frena casi
           del todo en el primer tercio, que es lo que hace que un movimiento
           tan corto se sienta asentado en vez de brusco. En panel no: una caja
           de 44 rem levantándose un píxel no se lee como respuesta, se lee como
           que la ventana se ha movido. */
        if (!panel) gsap.to(host, { y: -1, duration: .55, ease: 'expo.out', overwrite: 'auto' });

        /* Un componente responde entero o no responde: el icono crece con un
           asentamiento mínimo y el chip se va hacia arriba en vez de
           desvanecerse en el sitio, porque desaparecer sin moverse parece un
           fallo de pintado. */
        icoA(1.12, false);
        atajoA(0, -6, false);

        if (!caja) luzAlCursor();
      }

      function desenfoca() {
        E.dentro = false;
        tlCometa.repeatDelay(6.4);
        gsap.to(tlCometa, { timeScale: 1, duration: .5, ease: 'power2.out' });
        if (tlChispa) gsap.to(tlChispa, { timeScale: 1, duration: .7, ease: 'power2.out' });
        if (!panel) gsap.to(host, { y: 0, duration: .6, ease: 'expo.out', overwrite: 'auto' });
        icoA(1, true);
        atajoA(1, 0, true);
      }

      /* ── Al escribir ──────────────────────────────────────────────────
         Dos empujones a la misma física: uno a la opacidad, que decae solo, y
         otro a la velocidad del cono. La subida y la bajada del ritmo es lo que
         se lee como "está recibiendo", igual que un motor al que le entra gas.

         No hace falta antirrebote: `pulso` se satura y decae por su cuenta, así
         que escribir deprisa sube el filo y lo mantiene arriba en vez de dejar
         el efecto siempre a medias, que es lo que pasaba al encadenar tweens. */
      function teclea() {
        if (!E.dentro) return;
        E.pulso = Math.min(.34, E.pulso + .16);
        if (E.obj === null) E.vel += 55;
        if (tlChispa) {
          gsap.timeline()
            .to(tlChispa, { timeScale: 2.6, duration: .1, ease: 'power2.out' })
            .to(tlChispa, { timeScale: 1.35, duration: .85, ease: 'power2.out' });
        }
      }

      function on(el, ev, fn) {
        el.addEventListener(ev, fn);
        api.oyentes.push([el, ev, fn]);
      }
      on(host, 'mouseenter', entra);
      on(host, 'mouseleave', sale);
      on(host, 'mousemove', mueve);
      if (campo) {
        on(campo, 'focus', enfoca);
        on(campo, 'blur', desenfoca);
        on(campo, 'input', teclea);
      }

      /* Si el campo ya venía enfocado (atajo `/`, deep-link con ?q=, o el panel
         de comandos que se abre con el foco puesto), el estado correcto es el
         de dentro, no el de reposo. */
      if (campo && document.activeElement === campo) enfoca();

      /* La limpieza que `gsap.context` no puede adivinar. Se devuelve, y
         `revert()` la ejecuta. */
      return function () {
        gsap.ticker.remove(paso);
        if (ro) ro.disconnect();
      };
    }, host);

    api.ctx = ctx;
    return api;
  }

  /** Monta todo [data-vx-aura] que haya bajo `root`. Repetirlo no duplica nada. */
  function auto(root) {
    var nodos = (root || document).querySelectorAll('[data-vx-aura]');
    for (var i = 0; i < nodos.length; i++) {
      try {
        var v = nodos[i].getAttribute('data-vx-aura');
        mount(nodos[i], {
          intensidad: v === 'sutil' ? 'sutil' : 'normal',
          modo: nodos[i].getAttribute('data-vx-modo') === 'panel' ? 'panel' : 'campo',
          energia: nodos[i].getAttribute('data-vx-energia'),
          destello: nodos[i].getAttribute('data-vx-destello') !== 'no'
        });
      } catch (e) { /* un buscador sin aura sigue buscando igual */ }
    }
  }

  /** Deshace todo: integrador, líneas de tiempo, estilos, oyentes y DOM. */
  function destroy(host) {
    var api = host && host._vxAura;
    if (!api) return;
    if (api.ctx) api.ctx.revert();
    api.oyentes.forEach(function (o) { o[0].removeEventListener(o[1], o[2]); });
    [api.marco, api.brillo, api.arco].forEach(function (el) {
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });
    host.classList.remove('vx-aura-host', 'vx-aura-sutil', 'vx-aura-vivo', 'vx-aura-panel');
    host.removeAttribute('data-vx-listo');
    delete host._vxAura;
  }

  window.VentelAura = { mount: mount, auto: auto, destroy: destroy };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { auto(); });
  } else {
    auto();
  }
})();
</script>
