<style>
/**
 * =====================================================================================
 * FIRMA ANIMADA DEL CREADOR | Sistema de cotizaciones Ventel   ·   F10
 * =====================================================================================
 * La firma de puño y letra del creador del proyecto, trazada delante de quien mira. No es
 * un adorno suelto: va encima de su nombre en los créditos de «Acerca de», y hace lo que
 * una firma hace en un documento —decir quién responde por esto—.
 *
 * CÓMO SE DIBUJA. Cada trazo es un `path` cuya línea se esconde poniendo el guion
 * discontinuo tan largo como el propio trazo (`strokeDasharray = longitud`) y desplazándolo
 * entero fuera de la vista (`strokeDashoffset = longitud`); animar ese desplazamiento a
 * cero descubre la tinta de principio a fin. Es la misma técnica del anillo de estado.html
 * y por eso no estrena nada. La punta de la pluma va aparte, recorriendo el mismo `path`
 * con MotionPathPlugin, y se apaga entre trazo y trazo: sin eso se vería saltar de donde
 * acaba una letra a donde empieza la siguiente, que es justo lo que la mano NO hace.
 *
 * TRES CANDADOS, y los tres son la regla de la casa (documento 11):
 *
 *   1. SIN GSAP —el CDN bloqueado, que pasa en la red de tienda— la firma se ve ENTERA y
 *      quieta. Por eso el SVG no nace oculto en el CSS: nace dibujado, y solo se esconde
 *      cuando ya sabemos que hay con qué animarlo. Una firma que se queda invisible porque
 *      no cargó una librería es peor que una firma sin animar.
 *   2. Con `prefers-reduced-motion`, lo mismo: entera y quieta.
 *   3. Si MotionPathPlugin no llegó pero GSAP sí, se traza la tinta igual y lo único que
 *      falta es la punta. Se degrada por partes y no de golpe.
 *
 * Y ARRANCA CUANDO SE VE, no al cargar. Los créditos están al final de la pantalla: una
 * animación de seis segundos que empieza con la página todavía arriba es una animación que
 * nadie ve. Lo resuelve un IntersectionObserver, que es nativo y no cuesta una librería
 * más.
 */

.firma-caja { margin-bottom: .55rem; }

.firma-svg {
  display: block;
  width: 100%;
  max-width: 15rem;
  height: auto;
  overflow: visible;          /* que el resplandor de la punta no se recorte */
}

.firma-trazo {
  fill: none;
  stroke: var(--ink);
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* La punta nace oculta y solo la enseña la línea de tiempo. Sin GSAP no aparece nunca,
   que es exactamente lo que tiene que pasar: es el acompañamiento del trazo, no el trazo. */
.firma-punta {
  fill: var(--brand);
  opacity: .85;
  filter: drop-shadow(0 0 4px var(--brand));
  visibility: hidden;
}
</style>

  /* La telemetría del pulso real con el que se escribió: cuánto duró cada trazo y en qué
     segundo empezó. No se redondea ni se reparte a partes iguales — eso convierte una
     firma en una animación, y la gracia es justo lo contrario. */
  var TRAZOS = [
    { id: '#firma-trazo-0', dur: 0.396, inicio: 0.000 },
    { id: '#firma-trazo-1', dur: 0.095, inicio: 1.134 },
    { id: '#firma-trazo-2', dur: 4.130, inicio: 1.850 },
    { id: '#firma-trazo-3', dur: 0.078, inicio: 6.368 }
  ];

  var menosMovimiento = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function conGsap() { return !!window.gsap && !menosMovimiento; }

  var yaTrazada = false;

  function animar(svg) {
    if (yaTrazada || !conGsap()) return;
    yaTrazada = true;

    /* MotionPathPlugin es un archivo aparte del CDN y puede no llegar. Si falta, la tinta
       se traza igual y lo único que se pierde es la punta que la recorre. */
    var conPunta = !!window.MotionPathPlugin;
    if (conPunta) { try { gsap.registerPlugin(MotionPathPlugin); } catch (e) { conPunta = false; } }

    var punta = svg.querySelector('.firma-punta');
    var tl = gsap.timeline({
      delay: 0.35,
      onComplete: function () { if (punta) gsap.to(punta, { autoAlpha: 0, duration: .3 }); }
    });

    TRAZOS.forEach(function (t) {
      var el = svg.querySelector(t.id);
      if (!el) return;
      var largo = el.getTotalLength();

      // Se esconde la tinta AQUÍ y no en el CSS: así, sin GSAP, la firma se ve entera.
      gsap.set(el, { strokeDasharray: largo, strokeDashoffset: largo });

      tl.to(el, { strokeDashoffset: 0, duration: t.dur, ease: 'power1.inOut' }, t.inicio);

      if (!conPunta || !punta) return;
      // La punta aparece al posar y desaparece al levantar: entre trazo y trazo no hay
      // pluma, que es lo que impide verla saltar de una letra a la siguiente.
      tl.set(punta, { autoAlpha: 1 }, t.inicio)
        .to(punta, {
          motionPath: { path: t.id, align: t.id, alignOrigin: [0.5, 0.5] },
          duration: t.dur, ease: 'power1.inOut'
        }, t.inicio)
        .set(punta, { autoAlpha: 0 }, t.inicio + t.dur);
    });
  }

  /**
   * Pinta la firma dentro de `host` y la traza cuando entre en pantalla.
   *
   * Devuelve true si se pintó. El SVG se inserta ya dibujado; el escondite de la tinta lo
   * pone `animar()` en el mismo turno en que va a empezar, así que no hay un fotograma con
   * la firma completa antes de borrarse.
   */
  function pintar(host) {
    if (!host) return false;
    host.className = 'firma-caja';
    host.innerHTML = SVG;
    var svg = host.querySelector('.firma-svg');
    if (!svg) return false;

    if (!conGsap()) return true;          // se queda dibujada y quieta

    if (!window.IntersectionObserver) { animar(svg); return true; }
    var obs = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (!e.isIntersecting) return;
        obs.disconnect();
        animar(svg);
      });
    }, { threshold: 0.35 });
    obs.observe(svg);
    return true;
  }

  window.AppFirma = { pintar: pintar };
