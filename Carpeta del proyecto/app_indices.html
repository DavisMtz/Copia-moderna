  /* ── Puntuación de Tienda/CR ─────────────────────────────────────────────────
     Scorer propio, y no el motor general, por una razón concreta: aquí el NÚMERO manda.
     Un número exacto (+100) tiene que ganar siempre a la mejor coincidencia de nombre
     posible (14 de nombre + 10 de frase), porque quien teclea "96" sabe lo que quiere.
     Después va el prefijo (+30) y por último que el número aparezca dentro (+6).

     La preferencia de tipo es un empujón SUAVE, nunca un filtro: "cr 96" prioriza los
     centros de reparto pero no esconde la tienda 96. Convertirla en filtro es la
     simplificación evidente al reescribir esto, y hace desaparecer resultados legítimos.

     `levLE`/`fuzzyHit` viven aquí por lo mismo: son los únicos que quedaban del motor
     viejo del Portal y solo esta función los usaba. */
  function levLE(a, b, max) {
    var la = a.length, lb = b.length;
    if (Math.abs(la - lb) > max) return false;
    var prev = new Array(lb + 1), j;
    for (j = 0; j <= lb; j++) prev[j] = j;
    for (var i = 1; i <= la; i++) {
      var cur = new Array(lb + 1); cur[0] = i;
      var best = cur[0];
      for (j = 1; j <= lb; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        if (cur[j] < best) best = cur[j];
      }
      if (best > max) return false;   // poda: toda la fila supera el umbral
      prev = cur;
    }
    return prev[lb] <= max;
  }
  function fuzzyHit(hay, w) {
    if (w.length < 4 || !hay) return false;
    var max = w.length >= 7 ? 2 : 1;
    var toks = hay.split(' ');
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (t.length >= 3 && Math.abs(t.length - w.length) <= max && levLE(t, w, max)) return true;
    }
    return false;
  }

  /**

   * @param {object} it   elemento de TIENDA_CR
   * @param {string=} prefTipo  'CR' | 'Tienda' | null
   */

    var words = (Q && Q.words) || (Q && Q.palabras) || [];
    var raw = (Q && (Q.raw !== undefined ? Q.raw : Q.crudo)) || '';
    var s = words.length ? 0 : 1, matched = 0;   // sin texto → base 1 (listar el catálogo)
    words.forEach(function (w) {
      var hit = false;
      if (/^\d+$/.test(w)) {
        if (it._num === w) { s += 100; hit = true; }
        else if (it._num.indexOf(w) === 0) { s += 30; hit = true; }
        else if (it._num.indexOf(w) !== -1) { s += 6; hit = true; }
      } else {
        if (it._name.indexOf(w) !== -1) { s += it._name.indexOf(w) === 0 ? 14 : 8; hit = true; }
        else if (fuzzyHit(it._name, w)) { s += 5; hit = true; }
      }
      if (hit) matched++;
    });
    if (raw.length >= 3 && it._name.indexOf(raw) !== -1) s += 10;   // frase completa en el nombre
    if (words.length > 1 && matched < words.length) s *= (matched / words.length) * 0.6;
    if (prefTipo && it.tipo === prefTipo && (matched > 0 || !words.length)) s += words.length ? 4 : 0.5;
    return s;
  }

  function paraBuscadorGeneral() {

  /* ═══════════════════════════════════════════════════════════════════════════
     ÁMBITO DE UNA CONSULTA
     ═══════════════════════════════════════════════════════════════════════════
     Había DOS parsers incompatibles, y por eso lo que se aprendía en un buscador no
     servía en el otro: el Portal solo entendía la primera palabra suelta («formatos
     guía») y el buscador general solo los dos puntos («cot: LVP-123»). Escribir en el
     sitio equivocado no avisaba: simplemente buscaba el prefijo como si fuera texto.

     Aquí está el único parser, y entiende las dos formas. Lo que NO se unifica es
     CUÁNDO se acepta la forma suelta, y eso es deliberado:

       · En el Portal sí. Sus ámbitos son nombres de sección —«plantillas», «formatos»,
         «tienda»— y escribirlos a secas ya significaba acotar desde siempre.
       · En el buscador general no. Sus ámbitos son «estado», «equipo», «cotizaciones»,
         «portal»… que son también el nombre de las pantallas que ese mismo buscador
         ofrece. Aceptar la forma suelta convertiría «estado de cuenta» en «búscame "de
         cuenta" dentro de las fallas», que es de las consultas más frecuentes del día.

     Un texto con dos puntos que NO sea un ámbito —«nota: pedir factura», una URL— se
     devuelve como null y se busca tal cual. Y no se cae a la forma suelta: si no, la
     primera palabra de una frase legítima acabaría acotando por su cuenta.
  */
  function ambito(texto, alias, opts) {
    if (!alias) return null;
    /* `hasOwnProperty` y no `alias[k]` a secas: los dos diccionarios que llegan aquí son
       objetos literales, así que heredan de Object.prototype y escribir «constructor:»,
       «toString:» o «valueOf:» devolvía una función haciéndose pasar por un ámbito. El
       panel se quedaba entonces intentando pintar un grupo que no existe. */
    var suyo = function (k) {
      return Object.prototype.hasOwnProperty.call(alias, k) ? alias[k] : null;
    };
    var t = String(texto || '');
    var dosPuntos = t.match(/^\s*([^\s:]+)\s*:\s*([\s\S]*)$/);
    if (dosPuntos) {
      var k1 = norm(dosPuntos[1]).trim();
      var a1 = suyo(k1);
      return a1 ? { ambito: a1, alias: k1, resto: dosPuntos[2].trim() } : null;
    }
    if (opts && opts.sueltos === false) return null;
    var t2 = t.trim();
    var sp = t2.search(/\s/);
    var k2 = norm(sp === -1 ? t2 : t2.slice(0, sp)).trim();
    var a2 = suyo(k2);
    if (!a2) return null;
    return { ambito: a2, alias: k2, resto: sp === -1 ? '' : t2.slice(sp + 1).trim() };
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     PROCESOS DE TRAZABILIDAD
     ═══════════════════════════════════════════════════════════════════════════
     Los dos buscadores armaban su propio índice de lo MISMO —la hoja de Homologación—
     y con criterios distintos: uno se saltaba los procesos sin nombre y el otro no; uno
     tiraba las secciones que no reconocía y el otro las conservaba; uno resumía el
     proceso con «reporte · solución» y el otro añadía sección y plataformas. Resultado:
     el mismo «devolución de MarketPlace» se leía distinto según dónde se preguntara, y
     alguno de los dos podía no encontrarlo.

     Este es el único armador, y produce el registro completo: cada consumidor lee los
     campos que le sirven. Se quedó lo mejor de cada uno —el resumen largo, las palabras
     clave ricas y el descarte de procesos sin nombre, que no son un resultado.

     `kwCampo` viene ya preparado a propósito: los kw llegan a 240 palabras, muy por
     encima del tope de memoización del motor, así que sin esto se volvían a tokenizar
     en cada pulsación por cada uno de los ~120 procesos. */
  var TRAZ_SINONIMOS = {
    bigticket:     'bt big ticket bigticket trazabilidad proceso muebles linea blanca',
    softline:      'sf sl softline soft line logistica interna mensajeria interna trazabilidad proceso',
    slmensajerias: 'sf slm sl softline soft line mensajerias externas paqueteria guia trazabilidad proceso',
    mkp:           'mkp marketplace market place seller vendedor trazabilidad proceso',
    tienda:        'tda tienda fisica sucursal apv pos trazabilidad proceso',
    generales:     'gen generales general otros trazabilidad proceso'
  };
  function trazLimpio(v) {
    var s = String(v == null ? '' : v).trim();
    if (!s || s === '-' || s === '—' || /^n\s*\/?\s*a$/i.test(s)) return '';
    return s;
  }
  function trazEsLargo(v) {
    var s = trazLimpio(v);
    return !!s && (s.indexOf('\n') > -1 || s.length > 44);
  }
  function trazCorto(s, n) {
    var t = String(s == null ? '' : s).trim();
    return t.length > n ? t.slice(0, n - 1).trim() + '…' : t;
  }
  function trazPlataformas(str) {
    return String(str == null ? '' : str).split(/[\/\n]+/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean)
      .map(function (s) {
        var m = s.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
        return (m && m[1].trim()) ? m[1].trim() : s;
      })
      .filter(function (b) { return b.length <= 46; });
  }
  function trazResumen(sec, p) {
    var partes = [sec.label || sec.etiqueta || ''];
    var rep = trazLimpio(p.reporte), sol = trazLimpio(p.solucion);
    if (rep && !trazEsLargo(rep)) partes.push('Reporte ' + rep);
    if (sol) partes.push(trazEsLargo(sol) ? 'Solución según método de pago' : sol);
    var plats = trazPlataformas(p.plataformas).slice(0, 3);
    if (plats.length) partes.push(plats.join('/'));
    return trazCorto(partes.filter(Boolean).join(' · '), 110);
  }
  function trazPalabrasClave(sec, p) {
    var crudo = norm([
      p.nombre, p.plataformas, p.reporte, p.avance, p.solucion, p.observaciones,
      TRAZ_SINONIMOS[sec.id] || '', sec.label
    ].join(' '));
    var vistas = Object.create(null), salida = [];
    crudo.split(/\s+/).forEach(function (w) {
      if (w.length < 2 || vistas[w] || salida.length >= 240) return;
      vistas[w] = 1;
      salida.push(w);
    });
    return salida.join(' ');
  }

  function indexaTraz(datos) {
    var out = [];
    ((datos && datos.secciones) || []).forEach(function (sec) {
      (sec.procesos || []).forEach(function (p) {
        // Un proceso sin nombre no es un resultado: no hay nada que enseñar ni a dónde ir.
        if (!p || !p.nombre) return;
        var etiqueta = sec.label || sec.etiqueta || '';
        var kw = trazPalabrasClave(sec, p);
        out.push({
          id: p.id, seccion: sec.id, seccionNombre: etiqueta,
          nombre: p.nombre,
          // El buscador del Portal enseña la sección pegada al nombre porque sus grupos
          // ya están separados por sección; el general no, porque los mezcla en uno solo.
          name: p.nombre + (etiqueta ? ' — ' + etiqueta : ''),
          sub: trazResumen(sec, p),
          target: p.id,
          kw: kw,
          kwCampo: (window.AppBuscar && AppBuscar.campo) ? AppBuscar.campo(kw) : null
        });
      });
    });
    return out;
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     CATÁLOGO DE FUNCIONES — todo lo que la app sabe hacer
     ═══════════════════════════════════════════════════════════════════════════

     Aquí está una sola vez, como DATOS. Lo que cambia por superficie —qué se ofrece sin
     sesión, con qué icono se pinta, cómo se navega— lo decide cada buscador al pedirlo.

     CAMPOS:
       id        clave estable. Es también la clave con la que el buscador general
                 guarda la costumbre de uso en el navegador de cada persona: renombrarla

       page      pantalla destino. '__home' = la que corresponda al rol de quien busca.
       params    parámetros de vista (tpl, sec, action…). Solo llegan si su clave está
                 en PARAMS_VISTA (Code.gs y app_core): inventar una se pierde sin aviso.
       fn        NOMBRE de una acción local, no la función: el catálogo son datos, y
                 cada superficie resuelve el nombre contra su propio mapa.
       bloques   permisos; con tener UNO basta. Sin `bloques`, para cualquiera con sesión.
       publica   se puede abrir SIN sesión y tiene sentido sin ella.
       sesion    no significa nada sin haber entrado (reportar una falla, p. ej.).
       fuera     superficies donde la entrada no se ofrece, con su motivo al lado.

     Esto NO es seguridad: el servidor vuelve a exigir el permiso al abrir cada pantalla
     (secIdentidadConBloque_). Es no ofrecer una puerta que se va a cerrar en la cara. */
  var FUNCIONES = [

    { id:'atenciones', nombre:'Atenciones pendientes', sub:'Clientes por retomar cuando algo falló',

      kw:'atencion pendiente pospuesta cliente telefono llamar retomar rescate rescatar guardar datos ' +

    { id:'atenciones-nueva', nombre:'Registrar un cliente en espera', sub:'Guardar sus datos para retomar la atención',

  /**
   * Las funciones que ESTA superficie puede ofrecer a QUIEN está buscando.
   *
   * La política sin sesión es distinta en cada buscador, y no por descuido:
   *   · En el Portal se ofrece todo lo que no exija identidad. Un visitante que elige
   *     «Nueva cotización» pasa por el login y aterriza EN LA COTIZACIÓN: eso es una
   *     respuesta útil, y la pantalla de destino viaja en el enlace (T1.3).
   *   · En el buscador general solo lo `publica`. Ahí no hay ese puente al login —una
   *     pantalla que exige sesión aparecería y no llevaría a ninguna parte—, así que
   *     ofrecerla sería prometer una puerta cerrada.
   *
   * SUPERFICIES VIVAS: 'portal' (buscador del Portal), 'cmdk' (buscador general) y
   * 'acerca' (la lista «qué puedes hacer tú» de la pantalla «Acerca de», T10.2). La
   * tercera pide la lista COMPLETA a propósito y por eso es una superficie propia y no
   * un `funciones('portal', …)` reaprovechado: con 'portal' se caerían «Portal Ventel»
   * y «Monitor de promociones», que llevan `fuera:['portal']` porque allí se está
   * parado encima de ellas —y son justo dos de las cosas que un asesor nuevo tiene que
   * enterarse de que puede abrir—. Una lista que se titula «qué puedes hacer tú» y se
   * deja dos fuera es peor que no tenerla.
   *
   * `ctx` = { conSesion, esMaestro, puede(bloque) }.
   */
  function funciones(superficie, ctx) {
    ctx = ctx || {};
    var puede = ctx.puede || function () { return false; };
    return FUNCIONES.filter(function (f) {
      if (f.fuera && f.fuera.indexOf(superficie) !== -1) return false;
      if (!ctx.conSesion) {
        if (f.sesion) return false;                       // no significa nada sin entrar
        return superficie === 'portal' ? true : !!f.publica;
      }
      if (f.maestro && !ctx.esMaestro) return false;
      if (!f.bloques) return true;
      return f.bloques.some(puede);
    });
  }

  window.AppIndices = {
    secciones: SECCIONES,

    ambito: ambito,
    indexaTraz: indexaTraz,
    catalogo: FUNCIONES,
    funciones: funciones,
    normaliza: norm
  };
})();
