<style>
/* ════════════════════════════════════════════════════════════
   TRAZABILIDAD · UNA SOLA, POR SITUACIÓN (26/09/2026)
   Las seis secciones (Big Ticket, Soft Line, SL Mensajerías, MarketPlace, Tienda y Generales)
   pintan la MISMA vista, que se muda a la sección activa: el menú sigue teniendo sus seis accesos
   y cada uno llega filtrado por su línea. Arriba, una pestaña por situación del cliente («No me ha
   llegado», «Me llegó mal»…); dentro, una fila por proceso agrupada por línea, con el plazo y la
   fecha. La fila se despliega en su ficha: la fecha para el cliente en días hábiles, qué hacer y a
   quién escalar, si procede y dónde revisar.
   La hoja de Homologación no cambia: cada proceso se reconoce por su nombre (modelo, abajo).
   Respaldo: etiqueta git «respaldo-trazabilidad-antes-situaciones».
════════════════════════════════════════════════════════════ */
#tz-app{--tz-linea:color-mix(in srgb,var(--ink) 18%,var(--line));--tz-ink-brand:var(--brand-deep);--tz-ok:var(--ok);--tz-warn:var(--warn);--tz-alert:var(--alert);--tz-info:var(--info);container:tz/inline-size}
/* En Carbón los tonos de estado del Portal son los de fondo claro: aquí se aclaran para leerse */
[data-theme="carbon"] #tz-app{--tz-ink-brand:#F46BC6;--tz-ok:#6EE7B7;--tz-warn:#FDBA74;--tz-alert:#FB7185;--tz-info:#93C5FD}
#tz-app ::selection{background:var(--brand-soft);color:var(--ink)}
#tz-app mark{background:var(--brand-soft);color:inherit;border-radius:3px}
.tz-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
#tz-app .ic{width:18px;height:18px;flex-shrink:0}
#tz-app strong{font-weight:700;color:var(--ink)}

/* — Barra: filtro y línea del pedido (la sección no lleva título visible) — */
.tz-barra{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;margin-bottom:1rem}
.tz-buscar{position:relative;flex:1 1 18rem;max-width:30rem}
.tz-buscar .ic{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
.tz-buscar input{width:100%;height:46px;padding:0 1rem 0 2.7rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.93rem}
.tz-buscar input::placeholder{color:var(--ink-soft)}
.tz-buscar input:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.tz-lineas{display:flex;flex-wrap:wrap;gap:.3rem;padding:.3rem;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.tz-lineas button{height:36px;padding:0 .8rem;border:0;border-radius:11px;background:none;color:var(--ink-soft);font:inherit;font-weight:650;font-size:.84rem;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s}
.tz-lineas button:hover{background:var(--surface-2);color:var(--ink)}
.tz-lineas button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* — Aviso de copia guardada o de error — */
.tz-estado{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;margin-bottom:1rem;padding:.7rem .9rem;border-radius:14px;font-size:.88rem;line-height:1.45;color:var(--ink)}
.tz-estado.es-warn{background:var(--warn-bg)}
.tz-estado.es-alert{background:var(--alert-bg)}
.tz-estado > .ic{width:17px;height:17px}
.tz-estado.es-warn > .ic{color:var(--tz-warn)}
.tz-estado.es-alert > .ic{color:var(--tz-alert)}
.tz-estado span{flex:1 1 16rem;min-width:0}
.tz-estado button{display:inline-flex;align-items:center;gap:.35rem;height:34px;padding:0 .75rem;border-radius:10px;border:1px solid var(--tz-linea);background:var(--surface);color:var(--ink);font:inherit;font-weight:650;font-size:.82rem;cursor:pointer}
.tz-estado button .ic{width:14px;height:14px}

/* — Pestañas: las de Formas de Pago y Formatos, una por situación del cliente — */
.tz-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem;padding:.35rem;margin-bottom:1rem;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.tz-tab{display:flex;align-items:center;gap:.6rem;min-width:0;min-height:56px;padding:.45rem .8rem .45rem .7rem;border:0;border-radius:15px;background:none;color:var(--ink-soft);font:inherit;text-align:left;cursor:pointer;transition:background-color .15s,color .15s}
#tz-app .tz-tab .ic{width:19px;height:19px}
.tz-tab > span{min-width:0}
.tz-tab b{display:block;font-weight:750;font-size:.92rem;line-height:1.2;color:var(--ink);text-wrap:balance}
.tz-tab small{display:block;font-size:.76rem;font-weight:600;font-variant-numeric:tabular-nums}
.tz-tab:hover{background:var(--surface-2)}
.tz-tab[aria-selected="true"]{background:var(--ink);color:color-mix(in srgb,var(--surface) 72%,transparent)}
.tz-tab[aria-selected="true"] b{color:var(--surface)}
.tz-tab[aria-selected="true"] .ic{color:var(--brand-bright)}
/* Con el filtro o la línea, la pestaña sin procesos baja de tono sin perder contraste */
.tz-tab.es-cero:not([aria-selected="true"]) b{color:var(--ink-soft);font-weight:650}

/* — Hoja de la pestaña — */
.tz-hoja{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:1.3rem 1.6rem .8rem}
.tz-hoja[hidden]{display:none}
.tz-hoja:focus{outline:0}
.tz-hoja:focus-visible{outline:2.5px solid var(--brand);outline-offset:4px}
.tz-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem .8rem;padding-bottom:.9rem;border-bottom:1px solid var(--line)}
.tz-hd h2{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:84%;font-size:1.5rem;line-height:1.1;letter-spacing:-.008em}
.tz-hd span{font-size:.88rem;color:var(--ink-soft)}
.tz-hd b{margin-left:auto;font-family:var(--f-mono);font-size:.76rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tz-grupos,.tz-filas{list-style:none;margin:0;padding:0}
.tz-grupo{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:0 1rem;padding:.2rem 0;border-bottom:1px solid var(--line)}
.tz-grupo:last-child{border-bottom:0}
.tz-grupo[hidden]{display:none}
.tz-gl{margin:0;padding:1.1rem 0 0;font-size:.8rem;font-weight:750;color:var(--ink-soft)}
.tz-fila + .tz-fila{border-top:1px solid var(--line-soft)}
.tz-fila[hidden]{display:none}
.tz-f-bt{width:100%;display:flex;align-items:center;gap:1rem;min-height:58px;padding:.6rem .5rem .6rem .75rem;border:0;border-radius:12px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background-color .15s}
.tz-f-bt:hover{background:var(--surface-2)}
.tz-f-tx{flex:1;min-width:0;display:grid;gap:.2rem}
.tz-f-nom{min-width:0;font-weight:750;font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
/* Con el filtro: dónde coincidió, si no fue en el nombre */
.tz-f-frag{font-size:.82rem;font-weight:500;line-height:1.45;color:var(--ink-soft);max-width:80ch;text-wrap:pretty}
.tz-f-frag[hidden]{display:none}
.tz-f-plazo{display:flex;align-items:baseline;gap:.5rem;white-space:nowrap}
.tz-f-plazo b{font-family:var(--f-display);font-weight:800;font-stretch:84%;font-size:1.12rem;font-variant-numeric:tabular-nums}
.tz-f-plazo small{font-size:.8rem;font-weight:650;color:var(--ink-soft)}
#tz-app .tz-chev{width:18px;height:18px;color:var(--ink-soft);transition:transform .2s}
.tz-fila.es-abierta .tz-chev{transform:rotate(180deg);color:var(--tz-ink-brand)}
.tz-fila.es-abierta > .tz-f-bt{background:var(--brand-tint)}
.tz-panel{padding:.9rem .75rem 1.3rem}
.tz-panel[hidden]{display:none}
.tz-nada{padding:1.2rem 0 .9rem;color:var(--ink-soft);font-size:.95rem;line-height:1.5;text-wrap:pretty}
.tz-nada b{color:var(--ink)}
.tz-nada button{margin-left:.35rem;border:0;background:none;padding:0;font:inherit;font-weight:650;color:var(--tz-ink-brand);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* — Ficha: plazo, qué hacer, si procede y dónde revisar — */
.tz-ficha{display:grid;gap:1.1rem}
.tz-plazo{border-radius:18px;background:var(--surface-2);padding:1rem 1.15rem 1.1rem;display:grid;gap:.3rem}
.tz-p-lbl{font-size:.8rem;font-weight:700;color:var(--ink-soft);margin:0}
.tz-p-cuando{font-size:.95rem;font-weight:600;color:var(--ink);margin:.1rem 0 0}
.tz-p-fecha{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;margin:0}
.tz-p-fecha > span{font-family:var(--f-display);font-weight:800;font-stretch:84%;font-size:clamp(1.7rem,1.25rem + 1.4vw,2.3rem);line-height:1.04;letter-spacing:-.012em;color:var(--ink)}
.tz-p-fecha > span::first-letter{text-transform:uppercase}
.tz-p-cant{font-size:.84rem;color:var(--ink-soft);margin:0}
.tz-p-nada{font-size:.95rem;color:var(--ink-soft);margin:0}
.tz-p-texto{font-size:.9rem;line-height:1.5;margin-top:.35rem}
.tz-copiar{display:inline-flex;align-items:center;gap:.35rem;height:32px;padding:0 .7rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:650;font-size:.8rem;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s}
#tz-app .tz-copiar .ic{width:14px;height:14px}
.tz-copiar:hover{border-color:var(--brand);color:var(--tz-ink-brand)}
.tz-avance{display:flex;gap:.45rem;align-items:flex-start;font-size:.84rem;color:var(--ink);margin:.35rem 0 0}
#tz-app .tz-avance .ic{width:15px;height:15px;color:var(--ink-soft);margin-top:.15rem}
/* La tira: de hoy a la fecha límite; los inhábiles, angostos y punteados */
.tz-tira-w{margin-top:.55rem;padding-top:1rem}
.tz-tira{display:flex;flex-wrap:wrap;gap:1.25rem 3px;list-style:none;margin:0;padding:0 0 .2rem}
.tz-dia{position:relative;flex:0 0 auto;width:34px;display:grid;justify-items:center;gap:1px;padding:.3rem 0 .35rem;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.tz-dia span{font-size:.62rem;font-weight:700;color:var(--ink-soft)}
.tz-dia b{font-family:var(--f-mono);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.tz-dia i{position:absolute;top:-1.05rem;left:0;font-style:normal;font-size:.62rem;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.tz-dia.es-inhabil{width:22px;background:transparent;border-style:dashed}
.tz-dia.es-inhabil b{color:var(--ink-soft);font-size:.7rem;font-weight:500}
.tz-dia.es-inhabil span{font-weight:500}
.tz-dia.es-festivo{border-color:var(--tz-warn)}
.tz-dia.es-hoy{border-color:var(--ink);border-style:solid}
.tz-dia.es-rango{background:var(--brand-tint);border-color:var(--brand-soft)}
.tz-dia.es-limite{background:var(--brand);border-color:var(--brand)}
.tz-dia.es-limite b,.tz-dia.es-limite span{color:#fff}
.tz-p-leyenda{font-size:.76rem;color:var(--ink-soft);margin:.35rem 0 0}
/* Reembolso por método de pago */
.tz-metodos{width:100%;border-collapse:collapse;margin-top:.35rem;font-size:.88rem}
.tz-metodos th{text-align:left;font-weight:650;padding:.55rem .8rem .55rem 0;border-top:1px solid var(--line);vertical-align:top;line-height:1.35}
.tz-metodos td{padding:.55rem 0 .55rem .8rem;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
.tz-metodos tr:first-child th,.tz-metodos tr:first-child td{border-top:0}
.tz-m-t{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-soft)}
.tz-m-f b{font-family:var(--f-display);font-weight:800;font-stretch:84%;font-size:1.08rem}
.tz-p-notas{list-style:none;margin:.4rem 0 0;padding:0;display:grid;gap:.3rem;font-size:.84rem;line-height:1.45;color:var(--ink-soft)}
/* Bloques */
.tz-bloque{display:grid;gap:.5rem}
.tz-bloque h4{display:flex;align-items:center;gap:.45rem;margin:0;font-size:.95rem;font-weight:750;color:var(--ink)}
#tz-app .tz-bloque h4 .ic{width:16px;height:16px;color:var(--tz-ink-brand)}
.tz-lista,.tz-pasos{margin:0;padding:0;list-style:none;display:grid;gap:.45rem;font-size:.92rem;line-height:1.5;max-width:74ch}
.tz-lista li{position:relative;padding-left:1.1rem;text-wrap:pretty}
.tz-lista li::before{content:"";position:absolute;left:.15rem;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--tz-linea)}
.tz-lista li.es-frase{padding-left:0}
.tz-lista li.es-frase::before{display:none}
.tz-pasos li{display:grid;grid-template-columns:1.6rem 1fr;gap:.4rem;align-items:start}
.tz-n{display:grid;place-items:center;width:1.45rem;height:1.45rem;border-radius:7px;background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-size:.72rem;font-weight:700;margin-top:.05rem}
.tz-aviso{display:flex;gap:.5rem;align-items:flex-start;margin:0;padding:.55rem .8rem;border-radius:12px;background:var(--warn-bg);font-size:.88rem;line-height:1.45;max-width:74ch;width:fit-content}
#tz-app .tz-aviso .ic{width:15px;height:15px;color:var(--tz-warn);margin-top:.2rem}
.tz-aviso.es-tip{background:var(--info-bg)}
#tz-app .tz-aviso.es-tip .ic{color:var(--tz-info)}
.tz-cita{font-style:italic;color:var(--ink)}
.tz-copiable{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem;margin:.35rem 0 .15rem;padding:.6rem .8rem;border-radius:12px;background:var(--brand-tint);font-style:normal}
.tz-copiable > span{font-style:italic}
.tz-procede{list-style:none;margin:0;padding:0;display:grid;gap:.45rem;font-size:.92rem;line-height:1.5;max-width:74ch}
.tz-procede li{display:flex;gap:.5rem;align-items:flex-start}
#tz-app .tz-procede .ic{width:16px;height:16px;margin-top:.2rem;color:var(--ink-soft)}
#tz-app .tz-procede .es-no .ic{color:var(--tz-alert)}
#tz-app .tz-procede .es-si .ic{color:var(--tz-ok)}
.tz-donde{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.35rem}
.tz-donde li{display:inline-flex;align-items:baseline;gap:.3rem;padding:.3rem .6rem;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:650}
.tz-donde small{font-weight:500;color:var(--ink-soft);font-size:.76rem}
.tz-f-vacia{margin:0;font-size:.9rem;color:var(--ink-soft)}

/* — Foco — */
.tz-lineas button:focus-visible,.tz-tab:focus-visible,.tz-f-bt:focus-visible,.tz-copiar:focus-visible,.tz-estado button:focus-visible,.tz-nada button:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}

/* — Densidad compacta y alto contraste (Ajustes de vista) — */
html[data-density="compact"] .tz-tab{min-height:46px}
html[data-density="compact"] .tz-f-bt{min-height:46px;padding-top:.4rem;padding-bottom:.4rem}
html[data-density="compact"] .tz-hoja{padding-top:1rem}
html[data-contrast="high"] .tz-tabs,html[data-contrast="high"] .tz-hoja,html[data-contrast="high"] .tz-lineas{border-width:2px}

/* — Anchos: en em, para que escalen con los cuatro tamaños de texto del Portal — */
@container tz (max-width:62em){ .tz-tabs{grid-template-columns:repeat(3,minmax(0,1fr))} }
@container tz (max-width:46em){
  .tz-grupo{grid-template-columns:1fr}
  .tz-gl{padding:.8rem 0 .1rem .75rem}
  .tz-hoja{padding:1.1rem 1rem .6rem}
  .tz-panel{padding:.8rem .35rem 1.1rem}
}
/* Teléfono: las doce pestañas y las siete líneas en una tira cada una, que se desliza de lado; en
   rejilla eran 700 px de botones antes del primer proceso. La pestaña de al lado asoma y lo dice. */
@container tz (max-width:34em){
  .tz-tabs,.tz-lineas{display:flex;flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;position:relative}
  .tz-tabs::-webkit-scrollbar,.tz-lineas::-webkit-scrollbar{display:none}
  .tz-tab{flex:0 0 auto;max-width:12.5rem;min-height:50px;padding:.4rem .7rem .4rem .6rem;gap:.45rem;scroll-snap-align:start}
  .tz-tab b{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tz-lineas button{flex:0 0 auto;scroll-snap-align:start}
  .tz-f-bt{flex-wrap:wrap;gap:.2rem .8rem}
  .tz-f-tx{flex:1 1 100%}
  .tz-chev{margin-left:auto}
  .tz-buscar{max-width:none}
  /* Reembolsos: el método arriba, a lo ancho; el plazo y la fecha debajo */
  .tz-metodos,.tz-metodos tbody{display:block}
  .tz-metodos tr{display:grid;grid-template-columns:1fr auto;column-gap:.8rem;align-items:baseline;padding:.55rem 0;border-top:1px solid var(--line)}
  .tz-metodos tr:first-child{border-top:0}
  .tz-metodos th{grid-column:1/-1;padding:0 0 .2rem;border:0}
  .tz-metodos td{padding:0;border:0}
  .tz-m-f{text-align:right}
}
@media (prefers-reduced-motion: reduce){ #tz-app *{transition:none!important} }
@media print{ .tz-barra,.tz-tabs{display:none} }
</style>
<script>
(function(){
  'use strict';

  /* ── Líneas (las seis pestañas de la hoja) y situaciones del cliente ─────────
     Las situaciones van en el orden en que llegan en una llamada; `cliente` es como lo dice el
     cliente y `que` lo que cubre, en palabras del equipo. */
  var LINEAS = [
    { id: 'bigticket',     nombre: 'Big Ticket' },
    { id: 'softline',      nombre: 'Soft Line' },
    { id: 'slmensajerias', nombre: 'SL Mensajerías' },
    { id: 'mkp',           nombre: 'MarketPlace' },
    { id: 'tienda',        nombre: 'Tienda' },
    { id: 'generales',     nombre: 'Generales' }
  ];
  var SECS = LINEAS.map(function (l) { return l.id; });
  var SITUACIONES = [
    { id: 'cuando',    cliente: '¿Cuándo me llega?',               que: 'Pedido en tiempo, sin fecha o sin disponibilidad',     ic: 'calendar' },
    { id: 'vencido',   cliente: 'No me ha llegado',                que: 'Fecha vencida, guía sin movimiento o retornada',       ic: 'clock' },
    { id: 'norecibio', cliente: 'Dice entregado y no lo tengo',    que: 'Entrega no reconocida o caja vacía',                   ic: 'package' },
    { id: 'llegomal',  cliente: 'Me llegó mal',                    que: 'Dañado, incompleto, equivocado o con falla',           ic: 'roto' },
    { id: 'devolver',  cliente: 'Ya no lo quiero',                 que: 'Recolección o devolución por satisfacción',            ic: 'regreso' },
    { id: 'cancelar',  cliente: 'Quiero cancelar',                 que: 'Cancelación antes de la entrega',                      ic: 'cancelar' },
    { id: 'reembolso', cliente: '¿Y mi reembolso?',                que: 'Devoluciones de dinero, rechazadas o no reflejadas',   ic: 'money' },
    { id: 'domicilio', cliente: 'Quiero cambiar la dirección',     que: 'Cambio de domicilio de entrega',                       ic: 'home' },
    { id: 'pagos',     cliente: 'Pagué y no se ve',                que: 'Métodos de pago y reprocesos',                         ic: 'card' },
    { id: 'mesa',      cliente: 'Mesa de regalos',                 que: 'Dedicatoria, cancelar o asociar una compra',           ic: 'regalo' },
    { id: 'servicios', cliente: 'Armado, instalación y servicios', que: 'Armado, puertas, instalación y joyería',               ic: 'tools' },
    { id: 'otros',     cliente: 'Otros casos',                     que: 'Lo que no entra en las anteriores',                    ic: 'mas' }
  ];

  /* ── Modelo ──────────────────────────────────────────────────────────────────
     La hoja de Homologación la editan personas: nada cuelga de la posición de una fila. Cada
     proceso se reconoce por su NOMBRE. El orden de las reglas importa: «Recogidos por
     satisfacción/ mercancía dañada» es una recolección aunque diga «dañada», y «Mesa de Regalos
     (Canc…)» es mesa de regalos aunque sea una cancelación. Lo que no se reconoce va a «Otros
     casos»: una fila nueva nunca desaparece. */
  var REGLAS = [
    ['mesa',      /mesa de regalos/],
    ['pagos',     /metodos? de pago|reproceso/],
    ['reembolso', /devoluciones? no reflejad/],
    ['devolver',  /higiene|no aplican? para reembolso/],
    ['domicilio', /cambios? de domicilio/],
    ['cancelar',  /cancel/],
    ['norecibio', /entrega no reconocida|caja vacia/],
    ['devolver',  /recogid|por satisfaccion/],
    ['llegomal',  /resurtido|incomplet|maltratad|equivocad|danad|defecto|funcionalidad|catalogacion/],
    ['reembolso', /devolucion|reembolso|rechazad/],
    ['cuando',    /c\/ ?movimiento|con movimiento|fecha en tiempo|asignar fecha|sin disponibilidad/],
    ['vencido',   /fecha vencida|mas datos|s\/ ?movimiento|sin movimiento|retornad|inexistente/],
    ['servicios', /armado|puertas|instalac|conexion|joyeria/]
  ];

  /* ── Estado ───────────────────────────────────────────────────────────────────── */
  var app = null;

  /* Filtro (texto y línea): muestra filas, cuenta por pestaña y elige la hoja que se ve. `respetar`:

  function aplicar(respetar) {

    var ws = norm(st.q).split(' ').filter(Boolean);

      var okQ = ws.every(function (w) { return p.texto.indexOf(w) > -1; });
      var ok = okQ && (st.linea === 'todas' || p.linea.id === st.linea);
      if (okQ) total[p.situacion]++;

    if (!sinUrl && typeof reflejarFiltro === 'function') reflejarFiltro(secActiva(), st.q.trim());
  }

  /* ── Lo que usa Index.html ───────────────────────────────────────────────────── */
  /* Datos nuevos (o el error sin datos). `aviso` = {tipo:'warn'|'alert', texto} o null. */
  window.trzPintar = function (datos, aviso) {
    st.aviso = aviso || null;
    if (datos && Array.isArray(datos.secciones)) {
      st.sinDatos = false;
      procesos = modelo(datos);
      porId = {};
      procesos.forEach(function (p) { porId[p.id] = p; });
      if (st.abierta && !porId[st.abierta]) st.abierta = null;
    }
    pintar();
    var s = secActiva();
    if (SECS.indexOf(s) > -1) {
      montar(s);
      if (!st.abierta) abrirPrimera();
    }
  };
  /* Solo el aviso (misma copia de datos). */
  window.trzAviso = function (aviso) {
    st.aviso = aviso || null;
    if (!app) return;
    var viejo = app.querySelector('.tz-estado');
    if (viejo) viejo.remove();
    if (st.aviso) app.insertAdjacentHTML('afterbegin', estadoHTML());
  };
  /* Entrar a una de las seis secciones (switchSec, antes de animar la entrada): la vista se muda a
     esa sección y toma su línea. */
  window.trzAlEntrar = function (secId) {
    if (SECS.indexOf(secId) < 0) return;
    var otraLinea = st.linea !== secId;
    st.linea = secId;
    if (!app) return;
    if (st.dia && st.dia !== diaClave()) pintar();
    montar(secId);
    aplicar();
    var fila = st.abierta && enApp(st.abierta);
    if (otraLinea || !fila || fila.hidden) abrirPrimera();
  };
  /* Destino del buscador o de ?item=: abre su pestaña y su ficha. Devuelve la fila. */
  window.trzRevelar = function (el) {
    var fila = el && el.closest ? el.closest('.tz-fila') : null;
    if (!fila || !app || !app.contains(fila) || !porId[fila.id]) return null;
    var p = porId[fila.id];
    if (st.linea !== 'todas' && st.linea !== p.linea.id) st.linea = p.linea.id;
    if (fila.hidden && st.q) {
      var input = app.querySelector('[data-tz="q"]');
      if (input) input.value = '';
      st.q = '';
    }
    st.sit = p.situacion;
    aplicar();
    abrir(p.id, { seco: true });
    return fila;
  };
  /* ?q= de un enlace (restore): escribe y filtra sin volver a escribir la dirección. */
  window.trzAplicarBusqueda = function (secId, q) {
    if (!app) return;
    var input = app.querySelector('[data-tz="q"]');
    if (input) input.value = q;
    filtrar(q, true);
    /* Un enlace con ?q= que deja un solo proceso llega con él abierto: es lo que se compartió. */
    var visibles = [].slice.call(app.querySelectorAll('.tz-hoja:not([hidden]) .tz-fila:not([hidden])'));
    var enTodas = procesos.filter(function (p) { var f = enApp(p.id); return f && !f.hidden; });
    if (enTodas.length === 1 && visibles.length === 1) abrir(visibles[0].id, { seco: true });
  };
  window.trzLista = function () { return !!(app && app.querySelector('.tz-fila')); };
  /* «Todas» en la dirección: la escribe navUrl (Index) y la lee restore. */
  window.trzLineaUrl = function (secId) { return (SECS.indexOf(secId) > -1 && st.linea === 'todas') ? 'todas' : ''; };
  window.trzVerTodas = function () { st.linea = 'todas'; aplicar(); };
})();
</script>
