<style>
/* =====================================================================================
   ATENCIONES POSPUESTAS Y PENDIENTES · estilos
   =====================================================================================
   Todo se pinta con los tokens del tema (--surface/--ink/--line/--brand), así que hereda
   los tres temas y el modo de alto contraste sin una línea extra.

   Regla de movimiento de este módulo: NADA se anima con propiedades que provoquen
   reflow, salvo la altura del detalle desplegable —que es intrínsecamente de layout— y
   ahí se acota con `contain` para que el recálculo no salga de la tarjeta. Ver la nota
   junto a .atn-detalle. */

.atn-aviso {
  position: fixed; z-index: 10040;
  right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  width: min(24rem, calc(100vw - 2rem));
  background: var(--surface, #fff); color: var(--ink, #1B2330);
  border: 1px solid var(--line, #E4E9F0); border-left: 3px solid var(--brand, #E10098);
  border-radius: 14px; box-shadow: var(--sh-lg, 0 24px 48px -20px rgba(27,35,48,.28));
  padding: .95rem 1rem;
  font-family: var(--f-ui, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
  /* Nace invisible y desplazado: GSAP lo trae. Sin esto se ve un fotograma en su sitio
     final antes de que arranque la animación. */
  opacity: 0;
}
.atn-aviso, .atn-aviso *, .atn-aviso *::before, .atn-aviso *::after { box-sizing: border-box; }
.atn-aviso-top { display: flex; gap: .6rem; align-items: flex-start; margin-bottom: .7rem; }
.atn-aviso-ic {
  width: 2rem; height: 2rem; border-radius: 9px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--brand-tint, #FDE7F4); color: var(--brand, #E10098);
}
.atn-aviso-ic svg { width: 1.1rem; height: 1.1rem; }
.atn-aviso-tx { min-width: 0; }
.atn-aviso-tx b { display: block; font-size: .88rem; font-weight: 700; line-height: 1.35; }
.atn-aviso-tx p { margin: .2rem 0 0; font-size: .82rem; line-height: 1.5; color: var(--ink-soft, #5C6B7E); }
.atn-aviso-btns { display: flex; gap: .5rem; justify-content: flex-end; }

.atn-lista { display: grid; gap: .6rem; }
.atn-card {
  border: 1px solid var(--line, #E4E9F0); border-radius: var(--rad, 12px);
  background: var(--surface, #fff); overflow: hidden;
}
.atn-card.atn-urgente { border-left: 3px solid var(--warn, #B45309); }
.atn-card-top {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: .5rem .9rem; align-items: start; padding: .8rem .95rem;
}
.atn-quien { min-width: 0; }
.atn-nombre { display: block; font-size: .95rem; font-weight: 700; color: var(--ink, #1B2330);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.atn-meta { display: flex; flex-wrap: wrap; gap: .35rem .6rem; margin-top: .25rem;
  font-size: .78rem; color: var(--ink-soft, #5C6B7E); align-items: center; }
.atn-tel { font-family: var(--f-mono, ui-monospace, monospace); letter-spacing: .01em; }
.atn-chip {
  display: inline-flex; align-items: center; gap: .25rem; padding: .12rem .5rem;
  border-radius: 999px; font-size: .7rem; font-weight: 700;
  background: var(--surface-2, #F4F7FA); color: var(--ink-soft, #5C6B7E);
}
.atn-chip.priv { background: var(--surface-2, #F4F7FA); }
.atn-chip.libre { background: var(--info-bg, #EAF0FE); color: var(--info, #1D4ED8); }
.atn-chip.urge { background: var(--warn-bg, #FDF1E0); color: var(--warn, #B45309); }
.atn-acciones { display: flex; gap: .35rem; flex-wrap: wrap; justify-content: flex-end; }

/* El desplegable de "Consultar".
   Animar una altura ES una animación de layout, no hay forma de evitarlo si el
   contenido de abajo tiene que moverse de verdad (un scaleY deformaría el texto y un
   opacity dejaría un hueco vacío mientras está cerrado).

   Lo que sí se puede es acotar el coste: `contain: layout paint` le promete al
   navegador que nada de dentro afecta al layout de fuera, así que el recálculo se queda
   en esta caja en vez de recorrer la lista entera. Con veinte tarjetas en pantalla, esa
   es la diferencia entre 60 fps y un desplegable que da tirones. El contenido de dentro
   sí se mueve con transform + opacity, que no cuestan nada. */
.atn-detalle { height: 0; overflow: hidden; contain: layout paint; }
.atn-detalle-in {
  padding: 0 .95rem .9rem; border-top: 1px solid var(--line, #E4E9F0);
  display: grid; gap: .7rem;
}
.atn-campo { font-size: .82rem; line-height: 1.55; }
.atn-campo b { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-faint, #94A1B2); margin-bottom: .1rem; font-weight: 700; }
.atn-campo p { margin: 0; color: var(--ink-soft, #5C6B7E); white-space: pre-wrap; }
.atn-notas-edit { display: grid; gap: .45rem; }
.atn-notas-edit textarea { min-height: 5rem; resize: vertical; }

.atn-tabs { display: flex; gap: .3rem; margin-bottom: .9rem; flex-wrap: wrap; }
.atn-tab {
  border: 1px solid var(--line, #E4E9F0); background: var(--surface, #fff);
  color: var(--ink-soft, #5C6B7E); border-radius: 999px; cursor: pointer;
  padding: .4rem .85rem; font-size: .82rem; font-weight: 600; font-family: inherit;
  display: inline-flex; align-items: center; gap: .4rem;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.atn-tab[aria-selected="true"] { color: var(--brand, #E10098); border-color: var(--brand, #E10098);
  background: var(--brand-tint, #FDE7F4); }
.atn-tab-num { font-size: .72rem; font-weight: 800; padding: 0 .35rem; border-radius: 999px;
  background: var(--surface-2, #F4F7FA); }
.atn-tab[aria-selected="true"] .atn-tab-num { background: rgba(255,255,255,.6); }

/* "Comprobando con el sistema…" fuera del panel. El panel lo dice en su cabecera;
   montada como pantalla o como tarjeta no hay cabecera donde decirlo, y la lista
   sale pintada desde la caché sin que nada cuente que se está revalidando. */
.atn-comprobando { display: flex; align-items: center; gap: .4rem;
  margin: -.5rem 0 .8rem; font-size: .78rem; color: var(--ink-soft, #5C6B7E); }

.atn-vacio { padding: 2rem 1rem; text-align: center; color: var(--ink-soft, #5C6B7E); font-size: .86rem; }
.atn-vacio b { display: block; color: var(--ink, #1B2330); font-size: .95rem; margin-bottom: .25rem; }

.atn-form { display: grid; gap: .75rem; }
.atn-form .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
@media (max-width: 520px) { .atn-form .fila2 { grid-template-columns: 1fr; } }
.atn-form small.ayuda { display: block; font-size: .76rem; color: var(--ink-soft, #5C6B7E); margin-top: .2rem; }

/* Hora fija de liberación. La caja se anima en altura al aparecer, así que lleva la
   misma contención que el desplegable de las tarjetas: el recálculo se queda dentro. */
#atn-hora-fija { overflow: hidden; contain: layout paint; }
.atn-horas { display: flex; flex-wrap: wrap; gap: .35rem; }
.atn-hora-chip {
  border: 1px solid var(--line, #E4E9F0); background: var(--surface, #fff);
  color: var(--ink-soft, #5C6B7E); border-radius: 999px; cursor: pointer;
  padding: .3rem .7rem; font-size: .8rem; font-weight: 600; font-family: inherit;
  font-variant-numeric: tabular-nums;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.atn-hora-chip:hover { color: var(--ink, #1B2330); border-color: var(--brand-soft, #FBD0E9); }
.atn-hora-chip[aria-pressed="true"] { color: var(--brand, #E10098);
  border-color: var(--brand, #E10098); background: var(--brand-tint, #FDE7F4); }
.atn-hora-chip:focus-visible { outline: none; box-shadow: var(--ring, 0 0 0 4px rgba(225,0,152,.16)); }
#atn-liberar-hora { font-variant-numeric: tabular-nums; max-width: 8rem; }

@media (prefers-reduced-motion: reduce) { .atn-hora-chip { transition-duration: .01ms; } }

@media (prefers-reduced-motion: reduce) {
  .atn-aviso { opacity: 1; }
  .atn-tab { transition-duration: .01ms; }
}
@media print { .atn-aviso { display: none !important; } }

/* ═══════════════════════════════════════════════════════════════════════════
   PANEL DE ATENCIONES · la pantalla entera, encima de donde ya estás
   ═══════════════════════════════════════════════════════════════════════════
   Atenciones dejó de ser un destino. Irse a otra pantalla para mirar quién está
   esperando cuesta una carga completa de Apps Script —y otra para volver—, y eso
   convierte una consulta de cinco segundos en medio minuto con el hilo perdido. El
   panel se abre sobre lo que se esté haciendo, se cierra con Escape y deja la
   cotización a medias exactamente como estaba.

   Es GRANDE a propósito: aquí no se confirma nada, se trabaja. Hay que poder buscar
   a un cliente entre veinte, leer sus anotaciones sin que la caja se quede sin sitio
   y tomar una atención liberada sin cerrar y volver a abrir. Un diálogo de 34 rem
   —el de registrar— es para una decisión; esto es una mesa de trabajo. */
.atn-panel-ovl {
  position: fixed; inset: 0; z-index: 10050;
  display: flex; align-items: center; justify-content: center;
  padding: clamp(.5rem, 3vw, 2rem);
  background: rgba(15, 23, 42, .5);
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  /* Nace invisible: lo trae AppMotion/GSAP. Sin esto se ve un fotograma en su sitio
     final antes de que arranque la animación. */
  opacity: 0;
}
/* Sin GSAP —o con «reducir movimiento»— AppMotion solo pone la clase y no anima nada,
   así que la opacidad tiene que subirla el CSS. Sin esta línea el panel se montaba
   entero pero invisible en cuanto el sistema pedía menos animación. */
.atn-panel-ovl.active { opacity: 1; }
.atn-panel-ovl, .atn-panel-ovl *, .atn-panel-ovl *::before, .atn-panel-ovl *::after { box-sizing: border-box; }
.atn-panel {
  width: min(68rem, 100%);
  max-height: min(92vh, 56rem);
  display: flex; flex-direction: column; min-height: 0;
  background: var(--surface, #fff); color: var(--ink, #1B2330);
  border: 1px solid var(--line, #E4E9F0); border-radius: 18px;
  box-shadow: var(--sh-lg, 0 40px 80px -30px rgba(15, 23, 42, .45));
  overflow: hidden;
  font-family: var(--f-ui, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
}

.atn-panel-head {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: 1.1rem 1.25rem .9rem;
  border-bottom: 1px solid var(--line-soft, #EEF2F7);
}
.atn-panel-ic {
  width: 2.4rem; height: 2.4rem; border-radius: 11px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--brand-tint, #FDE7F4); color: var(--brand, #E10098);
}
.atn-panel-ic svg { width: 1.3rem; height: 1.3rem; }
.atn-panel-tx { min-width: 0; flex: 1; }
.atn-panel-tx h2 {
  margin: 0; font-family: var(--f-display, inherit);
  font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.25;
}
/* El subtítulo dice DE CUÁNDO son los datos. Es la contrapartida de pintar desde la
   caché: la lista aparece llena al instante y sin esta línea no habría forma de
   distinguir "esto es de ahora" de "esto es de hace media hora". */
.atn-panel-sub {
  margin: .18rem 0 0; font-size: .8rem; line-height: 1.45; color: var(--ink-soft, #5C6B7E);
  display: flex; align-items: center; gap: .4rem; flex-wrap: wrap;
}
.atn-panel-sub .atn-punto {
  width: .4rem; height: .4rem; border-radius: 50%; flex: none;
  background: var(--ok, #0E7A4F);
}
.atn-panel-sub.cargando .atn-punto { background: var(--brand, #E10098); animation: atn-late 1.4s ease-in-out infinite; }
@keyframes atn-late { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .atn-panel-sub.cargando .atn-punto { animation: none; } }

.atn-panel-x {
  flex: none; width: 2.2rem; height: 2.2rem; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line, #E4E9F0); background: transparent; color: var(--ink-soft, #5C6B7E);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s ease, color .15s ease;
}
.atn-panel-x:hover { background: var(--surface-2, #F4F7FA); color: var(--ink, #1B2330); }
.atn-panel-x:focus-visible { outline: none; box-shadow: var(--ring, 0 0 0 4px rgba(225,0,152,.16)); }
.atn-panel-x svg { width: 1.05rem; height: 1.05rem; }

/* ── Barra de herramientas: buscar, actualizar, registrar ── */
.atn-panel-barra {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  padding: .8rem 1.25rem; border-bottom: 1px solid var(--line-soft, #EEF2F7);
  background: var(--surface-2, #F4F7FA);
}
.atn-busca { position: relative; flex: 1 1 16rem; min-width: 0; display: flex; align-items: center; }
.atn-busca-ic {
  position: absolute; left: .65rem; width: 1rem; height: 1rem; pointer-events: none;
  color: var(--ink-faint, #94A1B2);
}
.atn-busca-ic svg { width: 100%; height: 100%; }
/* El hueco de la derecha es para el aspa de limpiar: sin él, una búsqueda larga se
   mete por debajo del botón y las últimas letras dejan de leerse justo cuando hace
   falta comprobar qué se escribió. */
.atn-busca-in {
  width: 100%; padding: .5rem 2.1rem .5rem 2.1rem;
  border: 1px solid var(--line, #E4E9F0); border-radius: 10px;
  background: var(--surface, #fff); color: var(--ink, #1B2330);
  font: inherit; font-size: .86rem; line-height: 1.4;
}
.atn-busca-in::-webkit-search-cancel-button { display: none; }
.atn-busca-in:focus { outline: none; border-color: var(--brand, #E10098); box-shadow: var(--ring, 0 0 0 4px rgba(225,0,152,.16)); }
.atn-busca-x {
  position: absolute; right: .4rem; width: 1.5rem; height: 1.5rem; border: 0; cursor: pointer;
  border-radius: 50%; background: transparent; color: var(--ink-faint, #94A1B2);
  display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; line-height: 1;
}
.atn-busca-x:hover { background: var(--surface-2, #F4F7FA); color: var(--ink, #1B2330); }

/* El botón de actualizar gira mientras se revalida. Es la única señal de que se está
   preguntando al servidor cuando la lista ya estaba pintada desde la caché. */
.atn-panel-barra .atn-girando svg { animation: atn-giro .9s linear infinite; }
@keyframes atn-giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .atn-panel-barra .atn-girando svg { animation: none; } }

.atn-panel-cuerpo {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 1rem 1.25rem 1.25rem;
}
.atn-panel-cuerpo::-webkit-scrollbar { width: 10px; }
.atn-panel-cuerpo::-webkit-scrollbar-thumb { background: var(--line, #E4E9F0); border-radius: 99px; }
.atn-panel-cuerpo::-webkit-scrollbar-track { background: transparent; }

.atn-panel-pie {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding: .7rem 1.25rem; border-top: 1px solid var(--line-soft, #EEF2F7);
  font-size: .78rem; color: var(--ink-soft, #5C6B7E);
}
.atn-panel-pie .atn-pie-der { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; }

/* Una tarjeta que todavía se está subiendo se ve distinta: el borde punteado dice
   "esto ya cuenta, pero aún no está confirmado". Sin la señal, un guardado que
   fallara desaparecería de una lista que parecía firme. */
.atn-card.atn-subiendo { border-style: dashed; }
.atn-chip.subiendo { background: var(--brand-tint, #FDE7F4); color: var(--brand, #E10098); }

@media (max-width: 640px) {
  .atn-panel { max-height: 100%; height: 100%; border-radius: 14px; }
  .atn-panel-head, .atn-panel-barra, .atn-panel-cuerpo, .atn-panel-pie { padding-left: .9rem; padding-right: .9rem; }
  .atn-card-top { grid-template-columns: minmax(0, 1fr); }
  .atn-acciones { justify-content: flex-start; }
}
@media print { .atn-panel-ovl { display: none !important; } }
</style>
<script>
/**
 * =====================================================================================
 * ATENCIONES POSPUESTAS Y PENDIENTES | Sistema de cotizaciones Ventel
 * =====================================================================================
 * La mitad cliente de Atenciones.gs. Se incluye después de app_core, app_motion y
 * app_icons:
 *
 *      <?!= include('app_atenciones') ?>
 *
 * TRES PIEZAS, Y SE USAN POR SEPARADO
 * -----------------------------------
 *   AppAtenciones.sugerir()        El aviso que sale tras reportar una falla. Es lo que
 *                                  hace que este módulo se use: nadie va a buscar una
 *                                  herramienta de rescate en el momento en que tiene un
 *                                  cliente enfadado en la línea, así que la herramienta
 *                                  sale a buscarlo a él.
 *   AppAtenciones.registrar()      El formulario, en un modal. Veinte segundos.
 *   AppAtenciones.montar(host)     La gestión completa dentro de un contenedor.
 *
 * EL ENFRIAMIENTO DE DOS MINUTOS
 * ------------------------------
 * "Ahora no" tiene que significar ahora no, y durante un rato. Cuando un sistema se cae,
 * un asesor reporta varias veces en pocos minutos —Connect, luego el buscador, luego el
 * carrito— y si el aviso saliera con cada reporte se convertiría en el diálogo que se
 * cierra sin leer. A la tercera vez ya nadie lo ve, y cuando de verdad hiciera falta
 * tampoco.
 *
 * Los dos minutos se guardan en localStorage y NO en memoria, a propósito: entre un
 * reporte y el siguiente la persona cambia de pantalla, y en Apps Script cada pantalla
 * es una carga completa que se lleva por delante cualquier variable. Con el
 * enfriamiento en memoria, "ahora no" duraba hasta el siguiente clic en el menú.
 */
(function () {
  'use strict';

  var CD_CLAVE = 'atenciones-pospuesto';
  var CD_MS = 2 * 60 * 1000;          // los dos minutos del enfriamiento

  /* CUÁNTO SE GUARDA Y CUÁNTO SE FÍA SON DOS NÚMEROS DISTINTOS.
     AppRun.swr revalida SIEMPRE contra el servidor; el ttl solo decide hasta cuándo lo
     guardado se puede seguir pintando mientras esa respuesta llega. Con un minuto, abrir
     el panel a los dos minutos de la última consulta encontraba la entrada caducada —y
     AppCache la borra al leerla—, así que el panel aparecía con una rueda: justo lo que
     la caché venía a evitar, y justo lo que el rótulo "actualizado hace 5 minutos" da por
     hecho que no pasa. Diez minutos es lo que usan los demás módulos de la app. */
  var TTL_PANORAMA = 10 * 60 * 1000;  // cuánto sobrevive lo guardado y se puede pintar

  var aviso = null;                   // nodo del aviso flotante
  var avisoTl = null;                 // su animación de entrada
  var host = null;                    // contenedor de la gestión, si está montada
  var datos = null;                   // último panorama
  var datosAt = 0;                    // cuándo se leyó lo que hay pintado (caché o servidor)
  var cargando = false;               // ¿se está revalidando contra el servidor ahora mismo?
  var revalidando = false;            // …y sin que nadie lo haya pedido (ver marcarRevalidacion)
  var pestana = 'mias';
  var abiertas = {};                  // { id: true } tarjetas desplegadas
  var filtro = '';                    // texto del buscador del panel
  var panel = null;                   // nodo del panel, si está abierto
  var hostPrevio = null;              // dónde estaba montada la gestión antes del panel
  var pantallaPropia = false;         // ¿esto es atenciones.html? entonces no hay panel que abrir
  var provisional = 0;                // contador de ids temporales del guardado optimista
  var alCambiarEstado = null;         // avisa a la pantalla de qué se está viendo (para la URL)
  var campoBusqueda = null;           // buscador que monta la pantalla completa, si lo hay

  // ── Utilidades ───────────────────────────────────────────────────────────

  function esc(s) {
    return window.AppBuscar ? AppBuscar.escapa(s) : String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function reducido() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch (e) { return false; }
  }
  function conGsap() { return typeof window.gsap !== 'undefined' && !reducido(); }
  function haySesion() { return !!(window.AppSession && AppSession.isLoggedIn()); }
  function correo() { return (window.AppSession && AppSession.userEmail) || ''; }
  function puede() { return !!(window.AppSession && AppSession.can('atenciones')); }

  /* ── EL MÓDULO SE VISTE SOLO DONDE NO HAY TEMA ────────────────────────────
     El panel trae su propio CSS (todo lo .atn-*), pero sus botones y el diálogo de
     registrar usan las clases compartidas —.v-btn, .v-modal— que viven en app_theme.
     En las pantallas de la app eso está garantizado; en el Portal y en Promociones no,
     porque son landings con hoja propia y sin app_theme. Allí el panel se pintaba bien
     pero los botones salían como los del navegador y el diálogo ni siquiera flotaba:
     .v-modal-overlay sin CSS no es una capa, es un div más en mitad de la página.

     Así que se comprueba si la clase existe y, solo si no, se inyecta un respaldo con
     lo justo que este módulo usa. Donde app_theme está cargado no se inyecta nada y no
     cambia ni un píxel; donde no está, el módulo se ve como en el resto de la app en
     vez de romperse. Es la misma regla que ya sigue guardarFondo con app_guardado: lo
     que no puede pasar es que algo funcione o no según qué includes tenga la pantalla. */
  var estilosBase = false;
  function asegurarEstilosBase() {
    if (estilosBase || !document.body) return;
    estilosBase = true;

     guardar" o "enlace copiado" son la única señal de que algo pasó. Colgaban de
     AppMotion, que en el Portal no está, así que allí una atención que fallaba al
     guardarse se deshacía en silencio. El respaldo escribe el MISMO marcado que
     AppMotion.toast para que app_theme —donde esté— lo vista igual. */
  function toast(m, t) {
    if (window.AppMotion) { AppMotion.toast(m, t); return; }
    if (!document.body) return;
    asegurarEstilosBase();
    var region = document.getElementById('v-toast-region');
    if (!region) {
      region = document.createElement('div');
      region.id = 'v-toast-region';
      region.setAttribute('aria-live', 'polite');
      document.body.appendChild(region);
    }
    var el = document.createElement('div');
    el.className = 'v-toast ' + (t === 'error' ? 'bad' : (t === 'warn' ? 'warn' : 'ok'));
    el.textContent = m;
    region.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); },
               t === 'error' ? 7000 : 4500);

  /**
   * Llamada al servidor, siempre por `AppRun`. Se quitaron dos cosas de aquí, y
   * las dos importan:
   *
   *  · **El respaldo a `google.script.run`.** Las 17 pantallas que incluyen este
   *    partial cargan `app_core` antes, así que nunca se usaba; y cuando se
   *    usara, invocaba el runner con `apply(null, …)`, que en la librería de
   *    Apps Script se traga los manejadores en silencio.
   *
   *  · **La clave `'aten-' + fn`.** Deduplicaba por nombre de función SIN mirar
   *    los argumentos, y por aquí pasan escrituras: registrar dos atenciones
   *    seguidas, o marcar como llamados a dos clientes distintos, son la misma
   *    función con argumentos distintos. La segunda se habría fusionado con la
   *    primera y habría dado por buena una respuesta que no era la suya —un alta
   *    perdida sin un solo mensaje de error—. Sin clave, `AppRun` la construye
   *    con la función Y los argumentos, que es lo que hace segura la fusión.
   */
  function llamar(fn, args) {
    return AppRun.call(fn, args);
  }

  /* ── GUARDADO OPTIMISTA ──────────────────────────────────────────────────
     Todo lo que este módulo ESCRIBE se pinta antes de subirlo.

     El motivo es el de siempre en Apps Script: una escritura son entre medio segundo
     y varios segundos de viaje, y hasta ahora cada botón de aquí se quedaba
     deshabilitado durante todo ese rato con un "Guardando…" encima. Con un cliente en
     la línea, tomar una atención liberada y esperar dos segundos a que el botón
     reaccione es exactamente el momento en que se abandona la herramienta.

     Ahora el cambio se ve en el mismo fotograma en que se suelta el botón y la subida
     sigue por detrás, anunciada en la isla de estado de abajo a la izquierda (la
     pestaña de app_operacion, que app_guardado reclama como indicador). Si el servidor
     dice que no, se DESHACE lo pintado y se dice por qué: un cambio optimista que
     sobrevive a su propio fallo es peor que no haberlo pintado nunca.

     El contrato es el de AppGuardado.guardar. Esta envoltura existe porque el módulo
     también se usa en pantallas que no cargan app_guardado —el aviso flotante sale en
     cualquier sitio donde se reporte una falla—, y ahí se hace lo mismo a mano: pintar,
     llamar, deshacer si falla. Lo que no puede pasar es que una acción funcione en una
     pantalla y no en otra según qué includes tenga. */
  function guardarFondo(op) {
    if (window.AppGuardado && AppGuardado.guardar) {
      var p = AppGuardado.guardar(op);
      p.catch(function () {});     // nadie está obligado a esperarla; el fallo ya se anunció
      return p;
    }

    if (op.optimista) { try { op.optimista(); } catch (e) { console.error(e); } }
    var valida = op.valida || function (r) { return !(r && r.success === false); };
    var falla = function (motivo, texto) {
      if (op.revertir) { try { op.revertir(motivo); } catch (e) { console.error(e); } }
      toast(texto, 'error');
      if (op.alFallar) { try { op.alFallar(motivo); } catch (e) { console.error(e); } }
    };
    return llamar(op.fn, op.args || []).then(function (r) {
      if (!valida(r)) {
        falla(r, (r && r.message) || 'No se pudo guardar. Vuelve a intentarlo.');
        return null;
      }
      if (!op.silencioso && op.hecho) toast(op.hecho, 'ok');
      if (op.alLograr) { try { op.alLograr(r); } catch (e) { console.error(e); } }
      return r;
    }, function (err) {
      falla(err, 'Sin conexión con el sistema. Inténtalo de nuevo.');
      return null;
    });
  }

  /** "hace 12 min", "hace 2 h". Es el dato que decide a quién se llama primero. */
  function desdeHace(iso) {
    if (!iso) return '';
    var ms = Date.now() - new Date(iso).getTime();
    if (isNaN(ms) || ms < 0) return '';
    var min = Math.floor(ms / 60000);
    if (min < 1) return 'hace un momento';
    if (min < 60) return 'hace ' + min + ' min';
    var h = Math.floor(min / 60);
    if (h < 24) return 'hace ' + h + ' h';
    var d = Math.floor(h / 24);
    return d === 1 ? 'ayer' : 'hace ' + d + ' días';
  }

  /** "en 25 min", "en 2 h", "ya". Lo contrario de desdeHace: mira hacia adelante. */
  function enCuanto(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var ms = d.getTime() - Date.now();
    if (isNaN(ms)) return '';
    if (ms <= 0) return 'ya';
    var min = Math.ceil(ms / 60000);
    if (min < 60) return 'en ' + min + ' min';

    // A partir de una hora se dice LA HORA y no "en 3 h". Es lo que se pidió al elegir
    // una hora fija —"hasta las 17:00"— y también lo más útil en las relativas largas:
    // quien mira su lista a las 15:40 necesita saber si le da tiempo antes de las cinco,
    // y "en 3 h" le obliga a hacer la cuenta con el cliente esperando.
    var hh = d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
    var hoy = new Date();
    var mismoDia = d.getDate() === hoy.getDate() &&
                   d.getMonth() === hoy.getMonth() &&
                   d.getFullYear() === hoy.getFullYear();
    return (mismoDia ? 'a las ' : 'mañana a las ') + hh;
  }

  /** Cuánto dura una reserva, según lo diga el servidor. */
  function reservaMin() { return (datos && datos.reservaMin) || 15; }

  /** "12 min", "1 min", "menos de 1 min". Para la cuenta atrás de la reserva. */
  function minutosTexto(ms) {
    var min = Math.floor((Number(ms) || 0) / 60000);
    if (min <= 0) return 'menos de 1 min';
    return min + ' min';
  }

  /** Una atención lleva demasiado esperando: se marca para que salte a la vista. */
  function urgente(a) {
    var ms = Date.now() - new Date(a.fecha).getTime();
    return !isNaN(ms) && ms > 60 * 60 * 1000;      // más de una hora
  }

  /**
   * Muestra la recomendación. No hace nada si no toca, y esa es la mitad del trabajo:
   * un aviso que sale cuando no debe es peor que no tenerlo.
   *
   * @param {object=} opts { sistema: 'Connect' }
   */
  function sugerir(opts) {
    if (!haySesion() || !puede()) return false;
    if (aviso) return false;              // ya está en pantalla
    if (enfriando()) return false;        // dijo "ahora no" hace menos de dos minutos

    var sistema = (opts && opts.sistema) || '';
    asegurarEstilosBase();

    aviso = document.createElement('div');
    aviso.className = 'atn-aviso no-print';
    aviso.setAttribute('role', 'status');
    aviso.innerHTML =
      '<div class="atn-aviso-top">' +
        '<span class="atn-aviso-ic">' + svg(IC.tel) + '</span>' +
        '<div class="atn-aviso-tx">' +
          '<b>' + esc(sistema ? sistema + ' está fallando.' : 'El sistema está fallando.') + '</b>' +
          '<p>¿Tienes un cliente en línea? Pulsa aquí para registrar su información y ' +
          'retomar la atención posteriormente.</p>' +
        '</div>' +
      '</div>' +
      '<div class="atn-aviso-btns">' +
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-no>Ahora no</button>' +
        '<button type="button" class="v-btn v-btn-primary v-btn-sm" data-atn-si>Registrar cliente</button>' +
      '</div>';
    document.body.appendChild(aviso);

    aviso.querySelector('[data-atn-no]').addEventListener('click', function () {
      // "Ahora no" ARRANCA el enfriamiento. Cerrar con la X no lo haría, y por eso no hay
      // X: las dos salidas de este aviso son decisiones, no descartes accidentales.
      posponer();
      cerrarAviso();
    });
    aviso.querySelector('[data-atn-si]').addEventListener('click', function () {
      cerrarAviso();
      registrar({ sistema: sistema });
    });

    if (conGsap()) {
      // Entra desde abajo con transform + opacity. Nada más: este aviso aparece justo
      // cuando la pantalla está repintando el acuse del reporte, y es el peor momento
      // para pedirle al navegador que recalcule un layout.
      avisoTl = gsap.timeline();
      avisoTl.fromTo(aviso,
        { opacity: 0, y: 24, scale: .96 },
        { opacity: 1, y: 0, scale: 1, duration: .45, ease: 'power3.out', force3D: true })
        .from(aviso.querySelector('.atn-aviso-ic'),
          { scale: .5, duration: .4, ease: 'back.out(2.4)', force3D: true }, '-=.28')
        .from(aviso.querySelectorAll('.atn-aviso-btns .v-btn'),
          { opacity: 0, y: 8, duration: .28, stagger: { amount: .08 }, force3D: true }, '-=.24')
        .set([aviso, aviso.querySelector('.atn-aviso-ic'), aviso.querySelectorAll('.atn-aviso-btns .v-btn')],
          { clearProps: 'transform' });
    } else {
      aviso.style.opacity = '1';
    }
    return true;
  }

  function cerrarAviso() {
    if (!aviso) return;
    var nodo = aviso;
    aviso = null;
    if (avisoTl) { avisoTl.kill(); avisoTl = null; }
    var quitar = function () { if (nodo.parentNode) nodo.parentNode.removeChild(nodo); };
    if (conGsap()) {

                      ease: 'power2.in', force3D: true, onComplete: quitar });
    } else { quitar(); }
  }

  /**
   * Opciones de "si no lo atiendo yo".
   *
   * El valor del <option> lleva el TIPO delante ("rel:60", "hora", "nunca") y no solo el
   * número de minutos. Con solo el número, "nunca" y "a una hora fija" tendrían que
   * distinguirse por convenciones tipo 0 y -1, y ese es el tipo de código que se lee mal
   * seis meses después. El tipo va escrito.
   */
  function opcionesLiberar() {
    var lista = (datos && datos.opcionesLiberar) || [
      { tipo: 'nunca',    min: 0,   nombre: 'Nunca · solo yo la veo' },
      { tipo: 'relativa', min: 60,  nombre: 'En 1 hora' },
      { tipo: 'relativa', min: 240, nombre: 'En 4 horas' },
      { tipo: 'hora',     nombre: 'A una hora fija del día…' }
    ];
    return lista.map(function (o) {
      var valor = o.tipo === 'hora' ? 'hora'
                : o.tipo === 'nunca' ? 'nunca'
                : 'rel:' + o.min;
      return '<option value="' + esc(valor) + '">' + esc(o.nombre) + '</option>';
    }).join('');
  }

  /** Horas de fin de turno sugeridas, como botones. Teclear una hora es un paso de más. */
  function horasSugeridasHTML() {
    var horas = (datos && datos.horasSugeridas) || ['15:00', '17:00', '19:00', '21:00'];
    return horas.map(function (h) {
      // `aria-pressed` nace puesto (en "false") y no aparece con el primer clic: un
      // botón que solo anuncia que se puede pulsar cuando ya lo pulsaste no le sirve a
      // quien está oyendo el formulario en vez de mirándolo.
      return '<button type="button" class="atn-hora-chip" aria-pressed="false" ' +
        'data-atn-hora="' + esc(h) + '">' + esc(h) + '</button>';
    }).join('');

  /**
   * ¿La hora tecleada es válida? Espejo de atenParsearHora_ en el servidor.
   *
   * La comprobación está en los dos lados a propósito y las dos tienen que decir lo
   * mismo: aquí para avisar sin gastar un viaje, y allí porque el cliente se puede
   * editar. Se aceptan las cuatro formas que la gente teclea de verdad —"17:00", "17",
   * "5:30", "17.30"— en vez de exigir una: rechazar "17" cuando se entiende
   * perfectamente es hacer trabajar a quien tiene un cliente esperando.
   */
  function horaValida(v) {
    var m = String(v == null ? '' : v).trim().match(/^(\d{1,2})\s*[:.\s]?\s*(\d{2})?$/);
    if (!m) return false;
    var h = Number(m[1]);
    var min = m[2] === undefined ? 0 : Number(m[2]);
    return h >= 0 && h <= 23 && min >= 0 && min <= 59;
  }

  /** Nombre corto de la zona de la operación, para poder rotularla. */
  function zonaTexto() {
    var z = (datos && datos.zonaHoraria) || '';
    return z ? z.split('/').pop().replace(/_/g, ' ') : '';
  }

    var lista = (datos && datos.tipos) || ['Venta', 'Seguimiento', 'Aclaración', 'Otro'];
    return lista.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; })
      .join('') + '<option value="__nuevo">Otro… (escribir)</option>';

  /**
   * Abre el formulario de registro.
   *
   * El orden de los campos es el orden en que se piden por teléfono: nombre, teléfono,
   * y lo demás. El botón se puede pulsar en cuanto hay nombre y teléfono; todo lo que
   * viene después es opcional a propósito, porque este formulario se rellena con alguien
   * esperando en la línea y un campo obligatorio de más es una atención que no se
   * registra.
   */
  function registrar(opts) {
    if (!haySesion() || !puede()) { toast('Necesitas iniciar sesión para registrar atenciones.', 'warn'); return; }
    opts = opts || {};

    // Se pide el catálogo si no se tiene, pero NO se espera: el formulario sale ya con
    // los tipos base y se enriquece cuando llegue. Hacer esperar aquí sería exactamente
    // el segundo que no hay.
    if (!datos) cargar(false);

    var contexto = opts.sistema
      ? 'Se registrará junto al reporte de <strong>' + esc(opts.sistema) + '</strong>.'
      : 'Guarda los datos ahora y retoma la atención cuando el sistema se recupere.';

    modal('Registrar atención pendiente',
      '<p class="cns-confirm-tx">' + contexto + '</p>' +
      '<div class="atn-form">' +
        '<div><label class="v-label" for="atn-cliente">Nombre del cliente *</label>' +
        '<input id="atn-cliente" class="v-input" autocomplete="off" maxlength="90" placeholder="Ana López"></div>' +
        '<div class="fila2">' +
          '<div><label class="v-label" for="atn-tel">Teléfono *</label>' +
          '<input id="atn-tel" class="v-input" type="tel" autocomplete="off" maxlength="40" placeholder="55 1234 5678"></div>' +
          '<div><label class="v-label" for="atn-correo">Correo (opcional)</label>' +
          '<input id="atn-correo" class="v-input" type="email" autocomplete="off" maxlength="120" placeholder="ana@correo.com"></div>' +
        '</div>' +
        '<div class="fila2">' +
          '<div><label class="v-label" for="atn-tipo">Tipo de atención</label>' +
          '<select id="atn-tipo" class="v-select">' + opcionesTipo() + '</select>' +
          '<input id="atn-tipo-nuevo" class="v-input" style="margin-top:.4rem" hidden ' +
                 'maxlength="40" placeholder="¿Qué tipo de atención es?"></div>' +
          '<div><label class="v-label" for="atn-hora">Hora de promesa (opcional)</label>' +
          '<input id="atn-hora" class="v-input" autocomplete="off" maxlength="40" placeholder="Hoy a las 5 pm"></div>' +
        '</div>' +
        '<div><label class="v-label" for="atn-notas">Anotaciones</label>' +
        '<textarea id="atn-notas" class="v-input" rows="3" maxlength="600" ' +
                  'placeholder="Qué buscaba, qué le prometiste, folio si lo hay…"></textarea></div>' +
        '<div><label class="v-label" for="atn-liberar">Si no la atiendo…</label>' +
        '<select id="atn-liberar" class="v-select">' + opcionesLiberar() + '</select>' +
        '<small class="ayuda">Pasado ese tiempo, cualquier asesor podrá verla y llamar al cliente. ' +
        'Con «Nunca», la atención es solo tuya para siempre.</small>' +
        /* La hora fija nace plegada y solo baja al elegirla en el desplegable. Los
           botones de arriba son las horas de fin de turno: teclear una hora es un paso
           de más cuando casi siempre se quiere "hasta que acabe mi jornada". El campo
           sigue estando para el caso que no encaje. */
        '<div id="atn-hora-fija" hidden>' +
          '<label class="v-label" for="atn-liberar-hora" style="margin-top:.6rem">¿A qué hora se libera?</label>' +
          '<div class="atn-horas" style="margin-bottom:.45rem">' + horasSugeridasHTML() + '</div>' +
          '<input id="atn-liberar-hora" class="v-input" autocomplete="off" maxlength="5" ' +
                 'inputmode="numeric" placeholder="17:00">' +
          '<small class="ayuda" id="atn-hora-nota"></small>' +
        '</div></div>' +
      '</div>' +
      '<p class="cns-ajuste-nota mal" id="atn-error" hidden></p>',
      'Guardar atención',
      function (cerrar, boton) {
        var cliente = val('atn-cliente');
        var tel = val('atn-tel');
        var err = document.getElementById('atn-error');
        var fallo = function (m) {
          err.hidden = false; err.textContent = m;
          if (window.AppMotion) AppMotion.shake(err);
        };

        if (!cliente) return fallo('Escribe el nombre del cliente.');
        if (String(tel).replace(/\D/g, '').length < 7) {
          return fallo('Hace falta un teléfono al que devolverle la llamada.');
        }

        var tipoSel = val('atn-tipo');
        var tipo = tipoSel === '__nuevo' ? val('atn-tipo-nuevo') : tipoSel;

        // La liberación se manda como UNA de las dos formas, nunca las dos. El servidor
        // da prioridad a la hora fija si llegan juntas, y mandar ambas dejaría el
        // resultado dependiendo de ese desempate en vez de de lo que se eligió aquí.
        var libSel = val('atn-liberar');
        var libMin = 0;
        var libHora = '';
        if (libSel === 'hora') {
          libHora = val('atn-liberar-hora');
          if (!horaValida(libHora)) {
            return fallo('Escribe la hora en formato de 24 horas, por ejemplo 17:00.');
          }
        } else if (libSel.indexOf('rel:') === 0) {
          libMin = Number(libSel.slice(4)) || 0;
        }
        // 'nunca' se queda con los dos vacíos: privada para siempre.

        var envio = {
          cliente: cliente, telefono: tel, correo: val('atn-correo'),
          tipo: tipo || 'Otro', notas: val('atn-notas'),
          horaPromesa: val('atn-hora'),
          liberarMin: libMin, liberarHora: libHora
        };
        // Lo que se tecleó, tal cual, por si el guardado no sale. Va aparte de `envio`
        // porque incluye el estado del formulario (qué opción de liberación se eligió),
        // que no viaja al servidor pero sí hace falta para volver a dibujarlo igual.
        var previo = { datos: envio, liberar: libSel, sistema: opts.sistema || '' };

        // El formulario se cierra YA: los campos están validados en este lado y no queda
        // ninguna decisión pendiente. Quedarse mirando "Guardando…" con el cliente en la
        // línea es el segundo que este módulo entero existe para no gastar.
        cerrar();

        // Tarjeta provisional con un id temporal. El de verdad lo asigna el servidor, y
        // hasta que llegue la tarjeta se enseña sin acciones (ver `tarjeta`): así se ve
        // que la atención ya cuenta, sin ofrecer botones que apuntarían a un id inexistente.
        var temporal = {
          id: '__nueva-' + (++provisional),
          cliente: cliente, telefono: tel, correo: envio.correo,
          tipo: envio.tipo, notas: envio.notas, horaPromesa: envio.horaPromesa,
          fecha: new Date().toISOString(),
          asesor: yoEmail(), asesorNombre: (datos && datos.yo && datos.yo.nombre) || '',
          estado: 'pendiente', liberarEn: '', reservaViva: false,
          _subiendo: true
        };

        guardarFondo({
          clave: 'atencion:nueva:' + temporal.id,
          etiqueta: 'Registrando a ' + cliente,
          hecho: 'Atención registrada',
          fn: 'atencionRegistrar',
          args: [correo(), envio],
          // Registrar CREA una fila. Un reintento a ciegas daría de alta al mismo
          // cliente dos veces, y dos asesores llamándole es peor que no llamarle.
          reintentos: 0,
          valida: function (r) { return !!(r && r.success); },
          optimista: function () {
            if (!datos) return;
            datos.mias = (datos.mias || []).concat([temporal]);
            datos.mias.sort(function (a, b) {
              return new Date(a.fecha).getTime() - new Date(b.fecha).getTime();
            });
            if (window.AppCache) AppCache.remove(clavePanorama());
            pestana = 'mias';
            pintar();
          },
          alLograr: function (r) {
            // Sin panorama todavía no hubo tarjeta provisional que sustituir —el
            // formulario se puede abrir desde el aviso de una falla, en una pantalla
            // que nunca pidió la lista—. Ahí sí se pide: si no, la atención queda
            // guardada y sin rastro en pantalla, que se lee como que no se guardó.
            if (!datos) { cargar(true); return; }
            // La respuesta ya trae la atención creada: se sustituye la provisional por
            // la de verdad en vez de pedir el panorama otra vez, que sería medio
            // segundo regalado para repintar lo que ya sabemos.
            datos.mias = (datos.mias || []).map(function (x) {
              return x === temporal ? (r.atencion || x) : x;
            });
            pintar();
          },
          alFallar: function () {
            // Deshacer una alta no puede significar perder lo tecleado: se quita la
            // tarjeta provisional y se devuelve el formulario relleno, listo para
            // reintentar. Es la diferencia entre "vuelve a preguntárselo al cliente" y
            // "vuelve a pulsar Guardar".
            if (datos) {
              datos.mias = (datos.mias || []).filter(function (x) { return x !== temporal; });
              pintar();
            }
            registrar({ sistema: previo.sistema, previo: previo });
          }
        });
      });

    // "Otro…" abre el campo de texto libre. Es lo que hace personalizable el tipo sin
    // obligar a nadie a pasar por una pantalla de administración para añadir uno.
    var sel = document.getElementById('atn-tipo');
    var libre = document.getElementById('atn-tipo-nuevo');
    if (sel && libre) {
      sel.addEventListener('change', function () {
        libre.hidden = sel.value !== '__nuevo';
        if (!libre.hidden) libre.focus();
      });
    }
    /* El campo de la hora fija aparece solo al elegirla. Se anima con altura porque el
       contenido de abajo tiene que bajar de verdad; es un único elemento y el coste se
       acota con `contain`, igual que el desplegable de las tarjetas. */
    var selLib = document.getElementById('atn-liberar');
    var cajaHora = document.getElementById('atn-hora-fija');
    var campoHora = document.getElementById('atn-liberar-hora');
    var notaHora = document.getElementById('atn-hora-nota');

    function pintarNotaHora() {
      if (!notaHora) return;
      var h = campoHora ? campoHora.value.trim() : '';
      var z = zonaTexto();
      if (!h || !horaValida(h)) {
        notaHora.textContent = z
          ? 'Hora de la operación (' + z + ').'
          : 'Escribe la hora en formato de 24 horas.';
        return;
      }
      // Se dice explícitamente cuándo cae, porque "17:00" registrado a las 17:30 es
      // mañana y esa es exactamente la clase de sorpresa que hace desconfiar de la
      // herramienta. Mejor decirlo antes que descubrirlo después.
      notaHora.textContent = esHoraDeManana(h)
        ? 'Se liberará mañana a las ' + h + (z ? ' (' + z + ')' : '') + '.'
        : 'Se liberará hoy a las ' + h + (z ? ' (' + z + ')' : '') + '.';
    }

    if (selLib && cajaHora) {
      selLib.addEventListener('change', function () {
        var mostrar = selLib.value === 'hora';
        if (mostrar === !cajaHora.hidden) return;
        if (mostrar) {
          cajaHora.hidden = false;
          if (conGsap()) {
            gsap.set(cajaHora, { height: 'auto' });
            gsap.from(cajaHora, { height: 0, duration: .3, ease: 'power2.out' });
            gsap.fromTo(cajaHora.children, { opacity: 0, y: -6 },
              { opacity: 1, y: 0, duration: .28, ease: 'power2.out', delay: .05,
                stagger: { amount: .06 }, force3D: true, clearProps: 'transform' });
          }
          pintarNotaHora();
          // Se preselecciona la primera sugerencia: la mayoría de la gente elige una de
          // ellas, y dejar el campo vacío obliga a teclear en el caso más común.
          if (campoHora && !campoHora.value) {
            var chips = cajaHora.querySelectorAll('[data-atn-hora]');
            if (chips.length) chips[Math.min(3, chips.length - 1)].click();
          }
        } else if (conGsap()) {
          gsap.to(cajaHora, { height: 0, duration: .24, ease: 'power2.inOut',
            onComplete: function () { cajaHora.hidden = true; gsap.set(cajaHora, { clearProps: 'height' }); } });
        } else {
          cajaHora.hidden = true;
        }
      });

      cajaHora.querySelectorAll('[data-atn-hora]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (campoHora) campoHora.value = b.getAttribute('data-atn-hora');
          cajaHora.querySelectorAll('[data-atn-hora]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
          pintarNotaHora();
        });
      });

      if (campoHora) campoHora.addEventListener('input', pintarNotaHora);
    }

    // Reapertura tras un guardado que no salió: se devuelve el formulario tal y como
    // se dejó. Que un fallo de red cueste volver a preguntarle el teléfono al cliente
    // sería exactamente el fallo que este módulo viene a evitar.
    if (opts.previo && opts.previo.datos) {
      var p = opts.previo.datos;
      var poner = function (id, v) { var el = document.getElementById(id); if (el && v) el.value = v; };
      poner('atn-cliente', p.cliente);
      poner('atn-tel', p.telefono);
      poner('atn-correo', p.correo);
      poner('atn-hora', p.horaPromesa);
      poner('atn-notas', p.notas);

      if (sel && p.tipo) {
        var conocido = Array.prototype.some.call(sel.options, function (o) { return o.value === p.tipo; });
        sel.value = conocido ? p.tipo : '__nuevo';
        if (!conocido && libre) { libre.hidden = false; libre.value = p.tipo; }
      }
      if (selLib && opts.previo.liberar) {
        selLib.value = opts.previo.liberar;
        // Se dispara el 'change' para que la caja de la hora fija baje si tocaba.
        try { selLib.dispatchEvent(new Event('change')); } catch (e) {}
        if (opts.previo.liberar === 'hora') poner('atn-liberar-hora', p.liberarHora);
      }
      var errPrevio = document.getElementById('atn-error');
      if (errPrevio) {
        errPrevio.hidden = false;
        errPrevio.textContent = 'No pudimos guardarla. Está todo como lo dejaste: vuelve a pulsar Guardar.';
      }
    }

    var primero = document.getElementById('atn-cliente');
    if (primero) primero.focus();
  }

  /** ¿Esa hora del día ya pasó hoy? Misma regla que aplica el servidor al resolverla. */
  function esHoraDeManana(h) {
    var m = String(h).trim().match(/^(\d{1,2})\s*[:.\s]?\s*(\d{2})?$/);
    if (!m) return false;
    var ahora = new Date();
    var objetivo = new Date();
    objetivo.setHours(Number(m[1]), m[2] === undefined ? 0 : Number(m[2]), 0, 0);
    return objetivo.getTime() <= ahora.getTime();
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? String(el.value || '').trim() : '';
  }

  // ── Modal genérico ───────────────────────────────────────────────────────

  var modalNodo = null;

  /**
   * Modal propio y no el de la pantalla anfitriona.
   *
   * Este módulo se monta en el inicio del asesor, en el panel de supervisión y —vía el
   * aviso— en CUALQUIER pantalla donde se reporte una falla. Depender del modal de cada
   * una obligaría a que las siete tuvieran uno con la misma API, y bastaría que una no
   * lo tuviera para que el registro fallara justo ahí.
   */
  function modal(titulo, cuerpo, textoOk, alAceptar) {
    cerrarModal();
    asegurarEstilosBase();
    modalNodo = document.createElement('div');
    modalNodo.className = 'v-modal-overlay';
    // .v-modal-overlay vive en z-index 9999, por debajo del panel (10050). Un diálogo
    // que se abre DESDE el panel y aparece detrás de él se lee como que el botón no
    // hizo nada, así que cuando el panel está puesto el diálogo se sube por encima.
    if (panel) modalNodo.style.zIndex = '10070';
    modalNodo.innerHTML =
      '<div class="v-modal" role="dialog" aria-modal="true" aria-labelledby="atn-modal-tit" style="max-width:34rem">' +
        '<h3 id="atn-modal-tit" style="font-size:1.1rem;font-weight:700;margin:0 0 .75rem">' + esc(titulo) + '</h3>' +
        '<div class="atn-modal-cuerpo">' + cuerpo + '</div>' +
        '<div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.15rem">' +
          '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-cancel>Cancelar</button>' +
          '<button type="button" class="v-btn v-btn-primary v-btn-sm" data-atn-ok>' + esc(textoOk) + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modalNodo);

    var card = modalNodo.querySelector('.v-modal');
    modalNodo.querySelector('[data-atn-cancel]').addEventListener('click', cerrarModal);
    modalNodo.addEventListener('click', function (e) { if (e.target === modalNodo) cerrarModal(); });
    var ok = modalNodo.querySelector('[data-atn-ok]');
    ok.addEventListener('click', function () { alAceptar(cerrarModal, ok); });

    var esc0 = function (e) { if (e.key === 'Escape') cerrarModal(); };
    document.addEventListener('keydown', esc0);
    modalNodo._esc = esc0;

    if (window.AppMotion) AppMotion.modalIn(modalNodo, card);
    else modalNodo.classList.add('active');
  }

  function cerrarModal() {
    if (!modalNodo) return;
    var nodo = modalNodo;
    modalNodo = null;
    if (nodo._esc) document.removeEventListener('keydown', nodo._esc);
    var quitar = function () { if (nodo.parentNode) nodo.parentNode.removeChild(nodo); };
    if (window.AppMotion) AppMotion.modalOut(nodo, nodo.querySelector('.v-modal'), quitar);
    else quitar();
  }

  // ── Gestión ──────────────────────────────────────────────────────────────

  function clavePanorama() { return 'atenciones-' + correo(); }

  /* ── EL HUECO MIENTRAS SE PIDE EL PANORAMA ───────────────────────────────
     Tres estados en el mismo sitio: la escena del asesor mientras se pide, la
     lista cuando llega, y la escena de la bolsa con «Reintentar» si no llegó.

     El hueco se deja VACÍO a propósito cuando el motor de escenas está en la
     pantalla: lo llena `cargar`, y ese hueco vacío es justo la señal que usa para
     saber que puede hacerlo sin taparle la lista a nadie. Sin motor —hay pantallas
     que montan este módulo sin incluirlo— queda el disco de siempre. */
  function prepararHueco() {
    if (!host) return;
    var conEscena = !!window.VentelFX;
    host.innerHTML = conEscena
      ? ''
      : '<div class="atn-vacio"><div class="v-spinner"></div> Cargando tus atenciones…</div>';
  }

  var fxError = null;

  function limpiarError() {
    if (!fxError) return;
    var fx = fxError;
    fxError = null;
    fx.done();
    // `done` retira el nodo al FINAL del fundido (medio segundo con GSAP en la
    // pantalla). Hasta entonces el hueco sigue teniendo un hijo, y la comprobación
    // `!host.firstChild` de dos líneas más abajo decidiría que no cabe el esqueleto:
    // quien pulsa "Actualizar" sobre el aviso de error se quedaba mirando un hueco
    // vacío durante toda la llamada. Se retira YA, que además es lo que hace la
    // salida por "Reintentar" (ahí el nodo se va antes de volver a cargar).
    var nodo = fx.host;
    if (nodo && nodo.parentNode) nodo.parentNode.removeChild(nodo);
  }

  /**
   * El panorama no llegó. Antes esto era un aviso sin salida: para volver a
   * intentarlo había que encontrar el botón de Actualizar o recargar la pantalla
   * entera, que en Apps Script son varios segundos. La escena dice lo mismo y trae
   * el reintento dentro.
   */
  function mostrarError() {
    if (!host || datos) return;
    if (fxError && !fxError.isDone()) return;
    if (!window.VentelFX) {
      host.innerHTML = vacio('Sin conexión', 'No pudimos leer tus atenciones. Vuelve a intentarlo.');
      return;
    }
    host.innerHTML = '';
    fxError = VentelFX.section(host, 'bolsa', { mode: 'fill', minHeight: '15rem' });
    // El fallo se pinta un instante DESPUÉS de montar la escena: `fail` detiene las
    // animaciones en curso y una de ellas es la de aparecer, así que hacerlo en el
    // mismo fotograma dejaría el aviso invisible.
    var fx = fxError;
    setTimeout(function () {
      // El aviso puede haberse quedado sin destinatario: si en estos 260 ms arrancó
      // otra carga, `limpiarError` ya cerró esta escena. Pintar el fallo encima
      // resucitaría un nodo que se está yendo —`fail` mata el fundido de salida— y
      // dejaría un "Reintentar" que ya no manda sobre nada.
      if (fx.isDone() || fx !== fxError) return;
      fx.fail('No pudimos leer tus atenciones. Puede ser la conexión.',
              function () { cargar(true); });
    }, 260);
  }

  /**
   * Trae el panorama. Con caché: pinta lo guardado YA y revalida por detrás.
   *
   * `datosAt` es la hora de lo que hay pintado, y viaja hasta el rótulo del panel.
   * Es la contrapartida obligatoria de pintar desde la caché: si la lista aparece
   * llena al instante y en ningún sitio dice de cuándo es, no hay forma de
   * distinguir "esto ya está" de "esto es de hace media hora", y la única salida que
   * le queda a quien duda es recargar la pantalla entera —justo lo que la caché
   * venía a evitar—. Por eso el panel dice siempre la antigüedad y tiene un botón de
   * Actualizar a la vista: la caché es rápida, pero la decisión de fiarse es de quien
   * está llamando al cliente.
   *
   * @param {boolean=} forzar Salta la caché local (botón "Actualizar").
   */
  function cargar(forzar) {
    if (!haySesion() || !puede()) return Promise.resolve(null);

    cargando = true;
    revalidando = forzar !== true;
    limpiarError();
    pintarCabecera();
    var fin = function (r) {
      cargando = false;
      revalidando = false;
      pintarCabecera();
      // El servidor también puede contestar «no» sin caerse. Sin esto, el hueco se
      // quedaría vacío al retirarse el esqueleto, y un hueco vacío se lee como «no
      // tienes atenciones», que es una cosa muy distinta de «no pudimos preguntar».
      if (!datos) mostrarError();
      return r;
    };

    return AppRun.swr(clavePanorama(), 'atencionesPanorama', [correo()], {
      ttl: TTL_PANORAMA,
      fuerza: forzar === true,
      accept: function (r) { return !!(r && r.success); },
      // Escena SOLO con el hueco vacío. Con la lista ya pintada —la
      // revalidación de siempre, o «Actualizar», que salta la caché— se colgaría
      // DEBAJO de lo que se está leyendo; ahí el acuse va en el botón que se pulsó.
      //
      // Era un esqueleto de tres tarjetas y ahora es la escena del asesor. El
      // esqueleto prometía una forma que aquí nadie puede saber: quien abre esto
      // puede tener cero pendientes o doce, así que las tres tarjetas grises eran un
      // número inventado y el salto que venían a evitar lo daban ellas mismas al
      // aterrizar la lista de verdad. La escena no promete forma: cuenta lo que se
      // está preguntando al servidor, que es lo único cierto durante esos segundos.
      //
      // Sin `title` ni `steps`: los textos de `asesor` viven en la copia del tema y
      // están escritos para ESTA espera («separando las tuyas de las que están
      // libres», «revisando qué reservas siguen vivas»). Repetirlos aquí sería
      // tener el mismo guion en dos archivos, y el que se quedaría viejo es éste.
      //
      // `minHeight` y `mode` son los mismos que usa `mostrarError` unas líneas más
      // arriba, y eso es a propósito: si la espera acaba mal, el aviso ocupa
      // exactamente el hueco que ya estaba reservado y la tarjeta no se encoge para
      // volver a crecer delante de quien está mirando.
      //
      // El manejador NO se guarda en una variable del módulo, al revés que `fxError`:
      // esta escena la cierra `AppRun.swr`, que llama a `.done()` tanto si llegan los
      // datos como si la llamada falla, y el `!host.firstChild` de aquí arriba impide
      // montar una segunda encima de una viva. Guardar una copia sería un segundo
      // dueño del mismo nodo, que es justo como se acaba cerrando la escena de otro.
      fx: (host && !host.firstChild)
        ? { target: host, tema: 'asesor', mode: 'fill', minHeight: '15rem' }
        : null,
      onData: function (r, deCache, at) {
        if (r && r.success) { datos = r; datosAt = at || Date.now(); pintar(); }
      },
      onError: function () { mostrarError(); }
    }).then(fin, fin);
  }

  function vacio(titulo, texto) {
    return '<div class="atn-vacio"><b>' + esc(titulo) + '</b>' + esc(texto) + '</div>';
  }

  function tarjeta(a, modo) {
    var mia = modo === 'mias';
    var yo = (datos && datos.yo && datos.yo.email) || '';
    // "Rescatada por ti" solo tiene sentido cuando la registró OTRA persona y la tomaste
    // tú: es lo que distingue tus clientes de los que recogiste del pool, y cambia lo que
    // dices al llamar ("le atendió un compañero y se cortó" no es "le atendí yo").
    var esRescatada = mia && a.rescatadaPor === yo && a.asesor !== yo;
    // El chip de privacidad dice SIEMPRE en qué estado está la atención, porque es la
    // decisión con consecuencias: "Solo tuya" significa que si no la atiendes nadie más
    // lo hará, y "Se libera en 25 min" significa que a partir de esa hora el cliente
    // puede recibir la llamada de otro compañero. Dejarlo implícito haría que la
    // liberación se descubriera cuando ya hubiera pasado.
    var chipPriv = a.liberarEn
      ? '<span class="atn-chip libre">' + svg(IC.reloj, 'w-3 h-3') +
        (new Date(a.liberarEn).getTime() <= Date.now()
          ? 'Liberada al equipo'
          : 'Se libera ' + esc(enCuanto(a.liberarEn))) + '</span>'
      : '<span class="atn-chip priv">Solo tuya</span>';

    // Cuenta atrás de la reserva. Es el dato que decide qué hacer ahora mismo: con tres
    // minutos se llama ya, con doce se puede terminar lo que se estaba haciendo. Un
    // "tomada" a secas obliga a mirar el reloj y a calcular.
    var chipReserva = a.reservaViva
      ? '<span class="atn-chip ' + (a.reservaRestanteMs < 5 * 60000 ? 'urge' : 'libre') + '">' +
        svg(IC.reloj, 'w-3 h-3') +
        (a.rescatadaPor === yo
          ? 'La tienes ' + minutosTexto(a.reservaRestanteMs)
          : 'Tomada · ' + minutosTexto(a.reservaRestanteMs)) + '</span>'
      : '';

    // Mientras la atención está subiendo, la tarjeta se enseña pero sin acciones. No es
    // prudencia decorativa: su `id` todavía es provisional —el de verdad lo asigna el
    // servidor— y "Finalizar" sobre un id que no existe daría un error que parecería un
    // fallo del sistema en vez de lo que es, una carrera de medio segundo.
    //
    // El disco del chip GIRA: un reloj quieto junto a un "Guardando…" que lleva medio
    // segundo ahí se lee como que se colgó, que es justo lo contrario de lo que pasa.
    var chipSubiendo = a._subiendo
      ? '<span class="atn-chip subiendo">' +
        (window.VentelFX ? VentelFX.chip('.75rem') : svg(IC.reloj, 'w-3 h-3')) + 'Guardando…</span>'
      : '';

    var acciones = '';
    if (a._subiendo) {
      acciones = '<button type="button" class="v-btn v-btn-ghost v-btn-sm" disabled>Guardando…</button>';
    } else if (mia) {
      // Quien la registró puede soltarla YA, sin esperar a la hora que puso al crearla.
      // Solo se ofrece si todavía no está liberada: sobre una que ya lo está no haría
      // nada, y un botón que no hace nada enseña a desconfiar de los demás.
      var yaLibre = !!a.liberarEn && new Date(a.liberarEn).getTime() <= Date.now();
      var puedeLiberar = a.asesor === yo && !yaLibre;

      acciones =
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-ver="' + esc(a.id) + '" ' +
                'aria-expanded="' + (abiertas[a.id] ? 'true' : 'false') + '">Consultar</button>' +
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-copiar="' + esc(a.telefono) + '" ' +
                'title="Copiar el teléfono">' + svg(IC.copiar, 'w-4 h-4') + '</button>' +
        (puedeLiberar
          ? '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-liberar="' + esc(a.id) + '" ' +
                    'title="Que cualquier asesor pueda tomarla y llamar al cliente">' +
              svg(IC.rescate, 'w-4 h-4') + 'Liberar</button>'
          : '') +
        '<button type="button" class="v-btn v-btn-dark v-btn-sm" data-atn-fin="' + esc(a.id) + '">Finalizar</button>';
    } else {
      acciones =
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-ver="' + esc(a.id) + '" ' +
                'aria-expanded="' + (abiertas[a.id] ? 'true' : 'false') + '">Consultar</button>' +
        '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-copiar="' + esc(a.telefono) + '" ' +
                'title="Copiar el teléfono">' + svg(IC.copiar, 'w-4 h-4') + '</button>' +
        '<button type="button" class="v-btn v-btn-primary v-btn-sm" data-atn-rescatar="' + esc(a.id) + '">' +
          svg(IC.rescate, 'w-4 h-4') + 'Tomar ' + reservaMin() + ' min</button>';
    }

    return '<article class="atn-card' + (urgente(a) ? ' atn-urgente' : '') +
      (a._subiendo ? ' atn-subiendo' : '') + '" data-atn-id="' + esc(a.id) + '">' +
      '<div class="atn-card-top">' +
        '<div class="atn-quien">' +
          '<span class="atn-nombre">' + esc(a.cliente) + '</span>' +
          '<div class="atn-meta">' +
            '<span class="atn-tel">' + esc(a.telefono) + '</span>' +
            (a.tipo ? '<span class="atn-chip">' + esc(a.tipo) + '</span>' : '') +
            '<span' + (urgente(a) ? ' class="atn-chip urge"' : '') + '>' + esc(desdeHace(a.fecha)) + '</span>' +
            (a.horaPromesa ? '<span class="atn-chip">Prometido: ' + esc(a.horaPromesa) + '</span>' : '') +
            (mia ? chipPriv : '<span class="atn-chip">de ' + esc(a.asesorNombre || 'otro asesor') + '</span>') +
            chipReserva + chipSubiendo +
            (esRescatada && !a.reservaViva ? '<span class="atn-chip libre">la tomaste tú</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="atn-acciones">' + acciones + '</div>' +
      '</div>' +
      '<div class="atn-detalle" data-atn-detalle="' + esc(a.id) + '">' +
        '<div class="atn-detalle-in">' +
          (a.notas
            ? '<div class="atn-campo"><b>Anotaciones</b><p>' + esc(a.notas) + '</p></div>'
            : '<div class="atn-campo"><b>Anotaciones</b><p style="opacity:.7">Sin anotaciones.</p></div>') +
          (a.correo ? '<div class="atn-campo"><b>Correo</b><p>' + esc(a.correo) + '</p></div>' : '') +
          '<div class="atn-campo"><b>Registrada</b><p>' +
            esc(new Date(a.fecha).toLocaleString('es-MX')) +
            (a.asesorNombre && !mia ? ' · por ' + esc(a.asesorNombre) : '') + '</p></div>' +
          (mia && !a._subiendo
            ? '<div class="atn-notas-edit">' +
                '<label class="v-label" for="atn-nota-' + esc(a.id) + '">Añadir o editar anotaciones</label>' +
                '<textarea id="atn-nota-' + esc(a.id) + '" class="v-input" rows="3" maxlength="600">' +
                  esc(a.notas) + '</textarea>' +
                '<div style="display:flex;justify-content:flex-end">' +
                  '<button type="button" class="v-btn v-btn-ghost v-btn-sm" data-atn-nota="' + esc(a.id) + '">' +
                    'Guardar anotaciones</button>' +
                '</div>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>' +
    '</article>';
  }

  /**
   * Normaliza para buscar: sin acentos, sin mayúsculas y —en los teléfonos— sin nada
   * que no sea un dígito. Quien busca "5512345678" tiene que encontrar al cliente que
   * se registró como "55 1234 5678", que es como se dicta un teléfono por la línea.
   */
  function plano(s) {
    var t = String(s == null ? '' : s);
    try { t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}
    return t.toLowerCase();
  }

  /**
   * ¿Esta atención responde a lo que se está buscando?
   *
   * Se mira TODO lo que identifica al cliente —nombre, teléfono, correo, tipo, notas y
   * quién la registró—, no solo el nombre. En la práctica se busca por lo que se tiene a
   * mano: a veces el nombre, muy a menudo el teléfono desde el que acaban de llamar, y a
   * veces una palabra suelta de la anotación ("pantalla", "el folio de ayer").
   */
  function coincide(a, q) {
    if (!q) return true;
    var soloDigitos = q.replace(/\D/g, '');
    if (soloDigitos.length >= 3 &&
        String(a.telefono || '').replace(/\D/g, '').indexOf(soloDigitos) !== -1) return true;
    var heno = plano([a.cliente, a.telefono, a.correo, a.tipo, a.notas,
                      a.asesorNombre, a.horaPromesa].join(' \n '));
    return plano(q).split(/\s+/).filter(Boolean).every(function (t) { return heno.indexOf(t) !== -1; });
  }

  function filtrar(lista) {
    var q = String(filtro || '').trim();
    if (!q) return lista;
    return lista.filter(function (a) { return coincide(a, q); });
  }

  /* ── LO QUE SABE ESTE MÓDULO, PARA EL BUSCADOR GENERAL ───────────────────
     Un asesor contesta el teléfono, ve un número que no reconoce y lo teclea en el
     buscador general. Ese número puede estar ya registrado —alguien lo atendió esta
     mañana y se cortó—, y ESA es la respuesta que hace falta antes de contestar: quién
     es, qué buscaba y qué se le prometió. Hasta ahora el buscador solo sabía llevarte a
     la pantalla de atenciones para que buscaras otra vez allí dentro.

     Se responde sin pedir nada al servidor: o los datos ya están en memoria, o están en
     la caché del panorama. Si no hay ninguna de las dos cosas no se inventa una consulta
     —el buscador general tiene que contestar mientras se teclea— y el resultado
     simplemente no sale esta vez. */

  /* El panorama guardado, sin viajes. null si no hay nada que leer.

     Con una memoria de tres segundos porque quien pregunta es el buscador general, que
     recalcula en CADA tecla: sin ella, escribir un teléfono de diez dígitos serían diez
     lecturas de localStorage con su JSON.parse de la lista entera, en el hilo que
     debería estar dibujando los resultados. Tres segundos no envejecen nada —el módulo
     tira su propia caché en cuanto escribe algo— y bastan para una ráfaga de tecleo. */
  var localMemo = null, localMemoAt = 0;

  function panoramaLocal() {
    if (datos) return datos;
    if (!window.AppCache || !haySesion() || !puede()) return null;
    if (localMemo && Date.now() - localMemoAt < 3000) return localMemo;
    var g = AppCache.get(clavePanorama());
    localMemo = (g && g.data && g.data.success) ? g.data : null;
    localMemoAt = Date.now();
    return localMemo;
  }

  /**
   * Atenciones que responden a lo que se está buscando.
   * @param {string} q
   * @param {number=} limite  por omisión 3: es un grupo dentro de una lista, no la lista.
   * @returns {Array} [{ id, cliente, telefono, tipo, notas, donde, mia }]
   */
  function coincidencias(q, limite) {
    var t = String(q == null ? '' : q).trim();
    if (t.length < 2) return [];
    var d = panoramaLocal();
    if (!d) return [];
    var tope = limite || 3;
    var out = [];
    var meter = function (lista, donde) {
      (lista || []).forEach(function (a) {
        if (out.length >= tope || !coincide(a, t)) return;
        out.push({
          id: a.id, cliente: a.cliente, telefono: a.telefono, tipo: a.tipo,
          notas: a.notas, donde: donde, mia: donde === 'mias',
          asesorNombre: a.asesorNombre || ''
        });
      });
    };
    // Las propias primero: son las que ya son responsabilidad de quien busca.
    meter(d.mias, 'mias');
    meter(d.publicas, 'publicas');
    return out;
  }

  /* ── QUÉ SE ESTÁ VIENDO, Y CÓMO SE CUENTA HACIA FUERA ────────────────────
     El módulo tiene dos cosas que un enlace debería poder decir: en qué pestaña estás
     y qué estás buscando. Vivían solo en dos variables de aquí dentro, así que un
     enlace a "las atenciones liberadas" no existía —se llegaba abriendo la pantalla y
     cambiando de pestaña a mano— y compartir "mira a este cliente" era imposible.

     El módulo no escribe la URL: no sabe si es la pantalla entera o un panel encima de
     una cotización a medio escribir, y reescribir la dirección en el segundo caso se
     llevaría por delante el enlace de la pantalla anfitriona. Solo AVISA, y quien lo
     montó decide. atenciones.html lo lleva a la barra de direcciones; el inicio del
     asesor y el panel se lo callan. */

  /** Nombres con los que la gente y los enlaces se refieren a cada pestaña. */
  function normPestana(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === 'publicas' || s === 'públicas' || s === 'rescatables' || s === 'pool' ||
        s === 'liberadas' || s === 'libres') return 'publicas';
    if (s === 'mias' || s === 'mías' || s === 'mis' || s === 'pendientes' ||
        s === 'propias') return 'mias';
    return '';
  }

  function avisarEstado() {
    if (!alCambiarEstado) return;
    try { alCambiarEstado({ pestana: pestana, buscar: filtro }); }
    catch (e) { console.error(e); }
  }

  /**
   * Cambia de pestaña.
   * @param {boolean=} callado true al venir de la URL (atrás/adelante): no se reavisa,
   *   o se reescribiría la dirección que acabamos de leer.
   */
  function irAPestana(nombre, callado) {
    var p = normPestana(nombre);
    if (!p || p === pestana) return false;
    pestana = p;
    abiertas = {};
    pintar();
    if (!callado) avisarEstado();
    return true;
  }

  /** Pone el buscador. Filtra en local, sin viajes al servidor. */
  function buscar(texto, callado) {
    var t = String(texto == null ? '' : texto);
    if (t === filtro) return false;
    filtro = t;
    sincronizarBuscador();
    // Sin cascada: la animación de entrada es para cuando la lista APARECE, no para
    // cada tecla (ver la nota del buscador del panel).
    pintar(true);
    if (!callado) avisarEstado();
    return true;
  }

  /**
   * Repinta la lista entera.
   * @param {boolean=} sinCascada  Repintado continuo (filtrar mientras se teclea): la
   *   animación de entrada se salta porque solo tiene sentido cuando la lista APARECE.
   */
  function pintar(sinCascada) {
    pintarCabecera();
    if (!host || !datos) return;

    var mias = filtrar(datos.mias || []);
    var publicas = filtrar(datos.publicas || []);
    var buscando = !!String(filtro || '').trim();

    /* Pestañas de verdad, no botones que lo parecen: `role="tablist"` con un solo
       tabulador de entrada (el resto se recorre con las flechas, que es lo que espera
       quien navega con teclado) y la lista marcada como el panel que gobiernan. Sin
       `aria-controls` un lector de pantalla anuncia "pestaña seleccionada" y no dice
       QUÉ acaba de cambiar debajo. */
    var tab = function (id, icono, rotulo, n) {
      var sel = pestana === id;
      return '<button type="button" class="atn-tab" role="tab" id="atn-tab-' + id + '" ' +
        'data-atn-tab="' + id + '" aria-selected="' + sel + '" aria-controls="atn-lista" ' +
        'tabindex="' + (sel ? '0' : '-1') + '">' +
        svg(icono, 'w-4 h-4') + rotulo + ' <span class="atn-tab-num">' + n + '</span></button>';
    };

    var html =
      '<div class="atn-tabs" role="tablist" aria-label="Qué atenciones se están viendo">' +
        tab('mias', IC.usuario, 'Mis pendientes', mias.length) +
        tab('publicas', IC.rescate, 'Rescatables', publicas.length) +
      '</div>' +
      '<div class="atn-lista" id="atn-lista" role="tabpanel" tabindex="-1" ' +
           'aria-labelledby="atn-tab-' + pestana + '" data-atn-lista>';

    var lista = pestana === 'mias' ? mias : publicas;
    var otra = pestana === 'mias' ? publicas : mias;
    if (!lista.length) {
      if (buscando) {
        // Buscar en la pestaña equivocada es el caso normal, no el raro: se busca a un
        // cliente, no se busca "en mis pendientes". Si lo que se busca está en la otra
        // lista, se dice y se ofrece el salto en vez de dejar un "sin resultados" que
        // hace pensar que el cliente no está registrado en ninguna parte.
        html += '<div class="atn-vacio"><b>Nada que coincida con «' + esc(filtro.trim()) + '»</b>' +
          (otra.length
            ? (pestana === 'mias'
                ? 'Pero hay ' + otra.length + (otra.length === 1 ? ' atención liberada' : ' atenciones liberadas') +
                  ' que sí coinciden y puedes tomar.'
                : 'Pero ' + (otra.length === 1 ? 'una de tus atenciones coincide' : otra.length + ' de tus atenciones coinciden') + '.') +
              '<div style="margin-top:.75rem"><button type="button" class="v-btn v-btn-ghost v-btn-sm" ' +
              'data-atn-tab="' + (pestana === 'mias' ? 'publicas' : 'mias') + '">' +
              (pestana === 'mias' ? 'Ver las rescatables' : 'Ver mis pendientes') + '</button></div>'
            : 'Prueba con el teléfono, o pulsa Actualizar por si se registró hace un momento.') +
          '</div>';
      } else {
        html += pestana === 'mias'
          ? vacio('Ninguna atención pendiente', 'Cuando una plataforma falle y tengas un cliente en línea, guarda aquí sus datos.')
          : vacio('No hay atenciones para tomar',
                  'Aquí aparecen las que otros asesores liberaron. Al tomar una la tienes ' +
                  reservaMin() + ' minutos para llamar; si no la cierras, vuelve a quedar disponible.');
      }
    } else {
      html += lista.map(function (a) { return tarjeta(a, pestana); }).join('');
    }
    html += '</div>';

    host.innerHTML = html;
    cablear();
    // Va DESPUÉS de pintar: `pintarCabecera` corre al principio de esta función, cuando
    // las pestañas junto a las que se cuelga el aviso todavía no existen.
    marcarRevalidacion();

    // Las tarjetas entran en cascada con `amount`: con tres o con treinta, la entrada
    // termina a la vez. Es el mismo criterio de AppMotion.staggerRows.
    if (conGsap() && !sinCascada) {
      var cards = host.querySelectorAll('.atn-card');
      if (cards.length) {
        gsap.fromTo(cards, { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: .38, ease: 'power2.out', force3D: true,
            stagger: { amount: Math.min(.35, cards.length * .05) }, clearProps: 'transform' });
      }
    }

    // Se reabre lo que estuviera desplegado antes del repintado. Sin esto, la
    // revalidación del minuto cerraba la tarjeta que la persona estaba leyendo.
    Object.keys(abiertas).forEach(function (id) {
      if (abiertas[id]) desplegar(id, true);
    });

    // El reloj solo existe mientras haya una cuenta atrás que enseñar.
    if (hayReservas()) arrancarReloj(); else pararReloj();
  }

  /**
   * Despliega o pliega el detalle de una tarjeta.
   * @param {boolean=} sinAnimar true al restaurar tras un repintado.
   */
  function desplegar(id, sinAnimar) {
    var caja = host && host.querySelector('[data-atn-detalle="' + id + '"]');
    if (!caja) return;
    var dentro = caja.firstElementChild;
    var abrir = sinAnimar ? true : !abiertas[id];
    abiertas[id] = abrir;

    var btn = host.querySelector('[data-atn-ver="' + id + '"]');
    if (btn) btn.setAttribute('aria-expanded', abrir ? 'true' : 'false');

    if (!conGsap() || sinAnimar) {
      caja.style.height = abrir ? 'auto' : '0';
      return;
    }

    if (abrir) {
      // height:'auto' de GSAP mide una vez y anima el número. El contenido acompaña con
      // transform + opacity, que es lo que hace que se perciba fluido aunque la altura
      // sea una propiedad de layout: el ojo sigue al texto, no al borde de la caja.
      gsap.set(caja, { height: 'auto' });
      gsap.from(caja, { height: 0, duration: .34, ease: 'power2.out' });
      gsap.fromTo(dentro, { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: .3, ease: 'power2.out', delay: .06,
          force3D: true, clearProps: 'transform' });
    } else {
      gsap.to(dentro, { opacity: 0, duration: .16, ease: 'power1.in' });
      gsap.to(caja, { height: 0, duration: .28, ease: 'power2.inOut', delay: .05 });
    }
  }

  /** Copia el teléfono. La respuesta la da el propio botón, no un toast. */
  function copiar(btn, texto) {
    var original = btn.innerHTML;
    var listo = function (ok) {
      btn.innerHTML = svg(ok ? IC.check : IC.aviso, 'w-4 h-4');
      btn.setAttribute('title', ok ? 'Teléfono copiado' : 'No se pudo copiar');
      if (ok && window.AppMotion) AppMotion.pop(btn);
      setTimeout(function () {
        if (!btn.isConnected) return;
        btn.innerHTML = original;
        btn.setAttribute('title', 'Copiar el teléfono');
      }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { listo(true); },
                                               function () { listo(respaldo(texto)); });
    } else { listo(respaldo(texto)); }
  }

  function respaldo(texto) {
    try {
      var ta = document.createElement('textarea');
      ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }

  function cablear() {
    if (!host) return;

    host.querySelectorAll('[data-atn-tab]').forEach(function (b) {
      b.addEventListener('click', function () {
        irAPestana(b.getAttribute('data-atn-tab'));
      });
    });
