    /* Flechas entre pestañas, como manda el patrón de tablist (y como ya hace la
       consola). Con `tabindex` rotatorio, el tabulador entra una vez y sale: quien
       navega con teclado no tiene que atravesar todas las pestañas para llegar a la
       lista. */
    var tabs = host.querySelector('.atn-tabs');
    if (tabs) {
      tabs.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        var lista = Array.prototype.slice.call(host.querySelectorAll('.atn-tab'));
        var i = lista.indexOf(document.activeElement);
        if (i === -1) return;
        e.preventDefault();
        var sig = lista[(i + (e.key === 'ArrowRight' ? 1 : -1) + lista.length) % lista.length];
        irAPestana(sig.getAttribute('data-atn-tab'));
        var puesta = host.querySelector('.atn-tab[aria-selected="true"]');
        if (puesta) { try { puesta.focus(); } catch (err) {} }
      });
    }

    host.querySelectorAll('[data-atn-ver]').forEach(function (b) {
      b.addEventListener('click', function () { desplegar(b.getAttribute('data-atn-ver')); });
    });

    host.querySelectorAll('[data-atn-copiar]').forEach(function (b) {
      b.addEventListener('click', function () { copiar(b, b.getAttribute('data-atn-copiar')); });
    });

    host.querySelectorAll('[data-atn-fin]').forEach(function (b) {
      b.addEventListener('click', function () { finalizar(b.getAttribute('data-atn-fin')); });
    });

    host.querySelectorAll('[data-atn-nota]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-atn-nota');
        var ta = document.getElementById('atn-nota-' + id);
        if (!ta) return;
        guardarNotas(id, ta.value, b);
      });
    });

    host.querySelectorAll('[data-atn-rescatar]').forEach(function (b) {
      b.addEventListener('click', function () { rescatar(b.getAttribute('data-atn-rescatar'), b); });
    });

    host.querySelectorAll('[data-atn-liberar]').forEach(function (b) {
      b.addEventListener('click', function () { liberar(b.getAttribute('data-atn-liberar'), b); });
    });
  }

  /** Acuse en el propio botón: más rápido de leer que un aviso y no tapa nada. */
  function acuse(btn, texto) {
    if (!btn) return;
    var original = btn.getAttribute('data-atn-original') || btn.textContent;
    btn.setAttribute('data-atn-original', original);
    btn.textContent = texto;
    if (window.AppMotion) AppMotion.pop(btn);
    setTimeout(function () {
      if (!btn.isConnected) return;
      btn.textContent = original;
    }, 1800);
  }

  function guardarNotas(id, texto, btn) {
    var a = (datos && datos.mias || []).filter(function (x) { return x.id === id; })[0];
    var antes = a ? a.notas : '';

    // Aquí el botón NO desaparece —guardar una anotación no repinta la lista—, así que
    // es el sitio donde se ve la espera: se queda ocupado hasta que el servidor
    // contesta. Decir "Guardado" en el mismo clic era prometer algo que todavía podía
    // fallar, y el aviso del fallo llegaba cuando la persona ya estaba en otra cosa.
    var fxBtn = window.VentelFX ? VentelFX.button(btn, 'Guardando…') : null;
    var soltar = function () { if (fxBtn) fxBtn.done(); };

    guardarFondo({
      clave: 'atencion:' + id,
      etiqueta: 'Guardando las anotaciones',
      hecho: 'Anotaciones guardadas',
      // Sin aviso propio: el botón ya dice "Guardado" en el sitio donde se está mirando,
      // y la isla de estado cierra con "Todo guardado". Un tercer acuse es ruido.
      silencioso: true,
      fn: 'atencionActualizar',
      args: [correo(), id, { notas: texto }],
      // Fijar un texto en una celda es idempotente: repetirlo deja lo mismo. Si la
      // respuesta se pierde de vuelta, reintentar es inofensivo.
      reintentos: 2,
      valida: function (r) { return !!(r && r.success); },
      optimista: function () {
        // Se actualiza la copia en memoria para que un repintado no devuelva el texto
        // viejo, y la caché se tira para que la siguiente pantalla no lo resucite.
        if (a) a.notas = texto;
        if (window.AppCache) AppCache.remove(clavePanorama());
      },
      alLograr: function () { soltar(); acuse(btn, 'Guardado'); },
      alFallar: soltar,
      revertir: function () {
        if (a) a.notas = antes;
        pintar();
      }
    });
  }

  function finalizar(id) {
    var a = (datos.mias || []).filter(function (x) { return x.id === id; })[0];
    if (!a) return;

    modal('Finalizar la atención de ' + a.cliente,
      '<p class="cns-confirm-tx">Sale de tus pendientes. Si quieres, deja apuntado cómo acabó.</p>' +
      '<div><label class="v-label" for="atn-resultado">¿Cómo acabó? (opcional)</label>' +
      '<textarea id="atn-resultado" class="v-input" rows="3" maxlength="400" ' +
                'placeholder="Se cerró la venta, no contestó, pidió que le llamáramos mañana…"></textarea></div>',
      'Finalizar',
      function (cerrar) {
        var resultado = val('atn-resultado');
        var lista = datos.mias || (datos.mias = []);
        var sitio = lista.indexOf(a);

        // El diálogo se va YA. La decisión está tomada y confirmada; dejarlo puesto con
        // un "Finalizando…" durante dos segundos es pedirle a quien tiene otro cliente
        // esperando que mire cómo gira una rueda.
        cerrar();

        guardarFondo({
          clave: 'atencion:' + id,
          etiqueta: 'Finalizando la atención de ' + a.cliente,
          hecho: 'Atención finalizada',
          fn: 'atencionFinalizar',
          args: [correo(), id, resultado],
          // Cerrar NO se reintenta. Si la respuesta se pierde de vuelta, el segundo
          // intento cae sobre una atención que ya está cerrada y el servidor contesta
          // que no —y entonces desharíamos en pantalla algo que sí se guardó—.
          reintentos: 0,
          valida: function (r) { return !!(r && r.success); },
          optimista: function () {
            datos.mias = lista.filter(function (x) { return x.id !== id; });
            delete abiertas[id];
            if (window.AppCache) AppCache.remove(clavePanorama());
            pintar();
          },
          revertir: function () {
            var actual = datos.mias || (datos.mias = []);
            if (actual.indexOf(a) === -1) actual.splice(Math.max(0, sitio), 0, a);
            pintar();
          }
        });
      });
  }

  /**
   * Suelta una atención propia al pool, ya.
   *
   * Se confirma antes. No es destructivo —la atención sigue siendo suya y puede cerrarla
   * él— pero sí es irreversible en la práctica: una vez que otro asesor la toma y llama al
   * cliente, no hay forma de deshacer esa llamada. Un clic accidental en un botón pegado a
   * "Finalizar" no debería poder provocarla.
   */
  function liberar(id, btn) {
    var a = (datos.mias || []).filter(function (x) { return x.id === id; })[0];
    if (!a) return;

    modal('Liberar la atención de ' + a.cliente,
      '<p class="cns-confirm-tx">A partir de ahora cualquier asesor podrá verla, tomarla y ' +
      'llamar al cliente. Sigue siendo tuya y puedes finalizarla tú si la atiendes antes.</p>' +
      '<p class="cns-confirm-tx" style="margin-top:.5rem">Quien la tome la tendrá reservada ' +
      reservaMin() + ' minutos; si no la cierra, vuelve a quedar disponible.</p>',
      'Liberar ahora',
      function (cerrar) {
        var antes = a.liberarEn;
        cerrar();

        guardarFondo({
          clave: 'atencion:' + id,
          etiqueta: 'Liberando la atención de ' + a.cliente,
          hecho: 'Atención liberada al equipo',
          fn: 'atencionLiberarAhora',
          args: [correo(), id],
          reintentos: 0,
          valida: function (r) { return !!(r && r.success); },
          optimista: function () {
            // La hora exacta la fija el servidor; aquí basta con "ya", que es lo que
            // hace que la tarjeta cambie de chip en el mismo fotograma. Cuando llegue la
            // respuesta se sustituye por la de verdad.
            a.liberarEn = new Date().toISOString();
            if (window.AppCache) AppCache.remove(clavePanorama());
            pintar();
          },
          alLograr: function (r) {
            if (r && r.liberarEn) { a.liberarEn = r.liberarEn; pintar(); }
          },
          revertir: function () {
            a.liberarEn = antes;
            pintar();
          }
        });
      });
  }

  /**
   * Toma una atención liberada.
   *
   * Es la acción con más prisa de todo el módulo: se pulsa con el cliente ya marcado en
   * el teléfono. Se pinta como tomada al instante y la reserva se confirma por detrás.
   *
   * Aquí lo optimista tiene un riesgo real que no tienen las demás: otro asesor puede
   * haber llegado primero. Por eso, cuando el servidor dice que no, no basta con
   * deshacer —la lista entera dejó de ser de fiar en ese mismo momento— y se vuelve a
   * pedir el panorama de verdad.
   */
  function rescatar(id, btn) {
    var a = (datos && datos.publicas || []).filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    if (btn) btn.disabled = true;

    // Copia provisional con lo que el servidor va a devolver: sin esto, la tarjeta
    // saltaría a "Mis pendientes" sin cuenta atrás y parecería que la reserva no se hizo.
    var mio = {};
    Object.keys(a).forEach(function (k) { mio[k] = a[k]; });
    mio.rescatadaPor = yoEmail();
    mio.rescatadaEn = new Date().toISOString();
    mio.reservaViva = true;
    mio.reservaRestanteMs = reservaMin() * 60000;

    guardarFondo({
      clave: 'atencion:' + id,
      etiqueta: 'Tomando la atención de ' + a.cliente,
      hecho: 'La atención es tuya durante ' + reservaMin() + ' minutos',
      fn: 'atencionRescatar',
      args: [correo(), id],
      // Tomar CREA una reserva a nombre de alguien. No se reintenta a ciegas.
      reintentos: 0,
      valida: function (r) { return !!(r && r.success); },
      optimista: function () {
        datos.publicas = (datos.publicas || []).filter(function (x) { return x.id !== id; });
        datos.mias = (datos.mias || []).concat([mio]);
        datos.mias.sort(function (x, y) { return new Date(x.fecha).getTime() - new Date(y.fecha).getTime(); });
        if (window.AppCache) AppCache.remove(clavePanorama());
        pestana = 'mias';
        pintar();
      },
      alLograr: function (r) {
        // La versión del servidor manda: trae la hora exacta de la reserva.
        if (r && r.atencion) {
          datos.mias = (datos.mias || []).map(function (x) { return x.id === id ? r.atencion : x; });
          pintar();
        }
      },
      revertir: function () {
        datos.mias = (datos.mias || []).filter(function (x) { return x !== mio; });
        // Casi siempre el motivo es que otro asesor llegó primero, y la lista en pantalla
        // ya no dice la verdad: se relee en vez de dejar una tarjeta fantasma.
        cargar(true);
      },
      alFallar: function () { if (btn && btn.isConnected) btn.disabled = false; }
    });
  }

  /* ── EL RELOJ DE LAS RESERVAS ────────────────────────────────────────────
     Una reserva caduca sola, y la caducidad la calcula el servidor al leer: no hay nada
     escrito que cambie a los quince minutos. Eso significa que una pantalla abierta y
     quieta seguiría enseñando "La tienes 12 min" indefinidamente, y peor: seguiría
     enseñando en el pool una atención que otro ya tomó, o escondiendo una que volvió a
     estar libre.

     El reloj corrige las dos cosas con un solo mecanismo:

       · Cada 30 s repinta si hay alguna reserva viva, para que la cuenta atrás baje. Es
         repintado local, sin tocar el servidor: los milisegundos restantes se recalculan
         contra la hora de toma, que ya está en los datos.
       · Cuando una reserva vence, se pide el panorama de verdad. Ahí es donde puede haber
         cambiado algo que solo el servidor sabe —que otro la tomó, que el dueño la cerró—
         y es el único momento en que hace falta preguntar.

     Solo corre cuando hay algo que contar, y se detiene con la pestaña oculta: un
     intervalo eterno en una pantalla que alguien dejó abierta toda la tarde es batería
     regalada. */
  var reloj = null;

  function hayReservas() {
    var todas = (datos ? (datos.mias || []).concat(datos.publicas || []) : []);
    return todas.some(function (a) { return a.reservaViva; });
  }

  function recalcularReservas() {
    if (!datos) return false;
    var ahora = Date.now();
    var vencioAlguna = false;
    (datos.mias || []).concat(datos.publicas || []).forEach(function (a) {
      if (!a.reservaViva) return;
      var fin = new Date(a.rescatadaEn).getTime() + reservaMin() * 60000;
      a.reservaRestanteMs = Math.max(0, fin - ahora);
      if (a.reservaRestanteMs <= 0) { a.reservaViva = false; vencioAlguna = true; }
    });
    return vencioAlguna;
  }

  function arrancarReloj() {
    if (reloj || !host) return;
    reloj = setInterval(function () {
      if (document.visibilityState === 'hidden') return;
      if (!hayReservas()) { pararReloj(); return; }
      // Si alguna acaba de vencer, la lista ya no es de fiar: se pide la de verdad.
      if (recalcularReservas()) cargar(true);
      else pintar();
    }, 30000);
  }

  function pararReloj() {
    if (!reloj) return;
    clearInterval(reloj);
    reloj = null;
  }

  try {
    document.addEventListener('visibilitychange', function () {
      // Al volver a la pestaña, lo primero es releer: mientras estuvo oculta han podido
      // vencer varias reservas y la pantalla estaría enseñando el mundo de hace un rato.
      if (document.visibilityState === 'visible' && host && hayReservas()) cargar(true);
    });
  } catch (e) {}

  /* ═══════════════════════════════════════════════════════════════════════════
     EL PANEL · atenciones encima de la pantalla en la que ya estás
     ═══════════════════════════════════════════════════════════════════════════
     Atenciones era un destino: se pulsaba en la barra, se iba, se miraba y se volvía.
     En Apps Script cada uno de esos dos saltos es una carga completa de la aplicación
     —varios segundos, y el trabajo a medias de la pantalla anterior perdido—, así que
     en la práctica no se consultaba: se consultaba cuando ya no quedaba más remedio.

     El panel invierte eso. Se abre sobre la cotización que se está escribiendo, sobre
     el correo a medio redactar, sobre la consola. Se cierra con Escape y debajo sigue
     todo exactamente igual. Y como no hay navegación de por medio, la lista sale
     PINTADA desde la caché en el mismo fotograma en que se pulsa; la comprobación
     contra el servidor va por detrás y se anuncia en el rótulo.

     La pantalla completa (atenciones.html) no desaparece: sigue siendo el destino de un
     enlace compartido y el sitio donde cae quien llega desde el Portal. Lo que cambia es
     que ya no hace falta ir hasta ella para trabajar. */

  var precargado = false;

  /**
   * Deja el panorama en memoria y en caché, sin pintar nada. Ver `precargar` en la API.
   *
   * Devuelve la PROMESA de la lectura (o false si no había nada que hacer). Quien solo
   * quiere calentar la caché puede ignorarla —la barra lateral lo hace—, pero quien
   * enseña una cifra sacada de `resumen()` la necesita: sin ella no tiene forma de
   * saber cuándo repintar, y el número se queda en el cero de antes de preguntar.
   */
  function precargar() {
    if (precargado || datos || panel || cargando) return false;
    if (!haySesion() || !puede()) return false;
    precargado = true;
    // Sin host, `pintar` no hace nada: esto solo llena datos y caché.
    return cargar(false);
  }

  /**
   * Aviso de revalidación cuando NO hay panel (la pantalla completa, la tarjeta del
   * inicio del asesor). Ahí no existe el rótulo que en el panel dice "comprobando con
   * el sistema", así que la lista aparecía pintada desde la caché y la comprobación
   * que va por detrás no se veía en ninguna parte.
   *
   * Solo para las revalidaciones que NADIE pidió: cuando se pulsa Actualizar el acuse
   * va en el botón que se pulsó, y decirlo dos veces a la vez es ruido.
   */
  function marcarRevalidacion() {
    if (!host) return;
    var puesto = host.querySelector('.atn-comprobando');
    var tabs = host.querySelector('.atn-tabs');
    var toca = revalidando && !panel && !!tabs;
    if (toca === !!puesto) return;
    if (!toca) { if (puesto.parentNode) puesto.parentNode.removeChild(puesto); return; }
    var s = document.createElement('span');
    s.className = 'atn-comprobando';
    s.innerHTML = (window.VentelFX ? VentelFX.chip('.9rem') : '') +
      '<span>Comprobando con el sistema…</span>';
    tabs.insertAdjacentElement('afterend', s);
  }

  /** Rótulo del panel: cuántas hay, y de cuándo son los datos que se están viendo. */
  function pintarCabecera() {
    marcarRevalidacion();
    if (!panel) return;

    var btn = panel.querySelector('#atn-panel-recargar');
    if (btn) {
      if (cargando) btn.classList.add('atn-girando'); else btn.classList.remove('atn-girando');
    }

    var sub = panel.querySelector('#atn-panel-sub');
    if (!sub) return;

    var partes = [];
    if (datos) {
      var m = (datos.mias || []).length;
      var p = (datos.publicas || []).length;
      partes.push(m === 1 ? '1 cliente esperando tu llamada' : m + ' clientes esperando tu llamada');
      if (p) partes.push(p === 1 ? '1 liberada que puedes tomar' : p + ' liberadas que puedes tomar');
    }

    var edad = '';
    if (cargando) edad = 'comprobando con el sistema…';
    else if (datosAt && window.AppCache) edad = 'actualizado ' + AppCache.ageLabel(datosAt);

    sub.className = 'atn-panel-sub' + (cargando ? ' cargando' : '');
    sub.innerHTML = '<span class="atn-punto" aria-hidden="true"></span>' +
      '<span>' + esc(partes.join(' · ') || 'Todavía no hay atenciones registradas') + '</span>' +
      (edad ? '<span style="opacity:.72">· ' + esc(edad) + '</span>' : '');
  }

  function panelHTML() {
    return '' +
      '<div class="atn-panel" role="dialog" aria-modal="true" aria-labelledby="atn-panel-tit">' +
        '<header class="atn-panel-head">' +
          '<span class="atn-panel-ic">' + svg(IC.tel) + '</span>' +
          '<div class="atn-panel-tx">' +
            '<h2 id="atn-panel-tit">Atenciones pendientes</h2>' +
            '<p class="atn-panel-sub" id="atn-panel-sub"></p>' +
          '</div>' +
          '<button type="button" class="atn-panel-x" data-atn-panel-cerrar aria-label="Cerrar el panel">' +
            svg(IC.equis) + '</button>' +
        '</header>' +
        '<div class="atn-panel-barra">' +
          '<div class="atn-busca">' +
            '<span class="atn-busca-ic">' + svg(IC.lupa) + '</span>' +
            '<input type="search" id="atn-busca" class="atn-busca-in" autocomplete="off" ' +
                   'placeholder="Buscar cliente, teléfono, tipo o anotación…" ' +
                   'aria-label="Buscar entre las atenciones">' +
            '<button type="button" class="atn-busca-x" id="atn-busca-x" hidden aria-label="Limpiar la búsqueda">×</button>' +
          '</div>' +
          '<button type="button" class="v-btn v-btn-ghost v-btn-sm" id="atn-panel-recargar" ' +
                  'title="Volver a preguntar al sistema">' + svg(IC.refrescar, 'w-4 h-4') + 'Actualizar</button>' +
          '<button type="button" class="v-btn v-btn-primary v-btn-sm" id="atn-panel-nueva">' +
            svg(IC.mas, 'w-4 h-4') + 'Registrar atención</button>' +
        '</div>' +
        '<div class="atn-panel-cuerpo" id="atn-panel-cuerpo"></div>' +
        '<footer class="atn-panel-pie">' +
          '<span>Al tomar una atención liberada la tienes reservada ' + reservaMin() + ' minutos para llamar.</span>' +
          '<span class="atn-pie-der">' +
            '<button type="button" class="v-btn v-btn-ghost v-btn-sm" id="atn-panel-todas">Abrir la pantalla completa</button>' +
          '</span>' +
        '</footer>' +
      '</div>';
  }

  var panelEsc = null, panelScrollPrevio = '', panelFocoPrevio = null;

  /**
   * Abre el panel sobre la pantalla actual.
   * @param {object=} opts { registrar: true abre además el formulario,
   *   buscar: 'texto', pestana: 'mias'|'publicas' }
   */
  function abrirPanel(opts) {
    opts = opts || {};
    if (!haySesion() || !puede()) {
      toast('Tu cuenta no tiene acceso a las atenciones pendientes.', 'warn');
      return false;
    }
    asegurarEstilosBase();

    var pPedida = normPestana(opts.pestana);

    if (panel) {
      // Ya está abierto: pulsar otra vez en la barra no debe apilar un segundo panel.
      if (pPedida) irAPestana(pPedida, true);
      if (opts.buscar !== undefined) buscar(String(opts.buscar || ''), true);
      if (opts.registrar) registrar({});
      var yaB = panel.querySelector('#atn-busca');
      if (yaB) { try { yaB.focus(); yaB.select(); } catch (e) {} }
      return true;
    }

    try { panelFocoPrevio = document.activeElement; } catch (e) { panelFocoPrevio = null; }

    filtro = String(opts.buscar || '');
    if (pPedida) pestana = pPedida;
    abiertas = {};

    panel = document.createElement('div');
    panel.className = 'atn-panel-ovl no-print';
    panel.innerHTML = panelHTML();
    document.body.appendChild(panel);

    // El fondo no se desplaza mientras el panel está puesto: con el ratón sobre el
    // borde, la rueda movía la pantalla de debajo y la lista parecía haberse quedado
    // enganchada. `overscroll-behavior: contain` en el cuerpo remata el efecto dentro.
    try {
      panelScrollPrevio = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
    } catch (e) {}

    // La gestión se muda al panel. Si la pantalla ya la tenía montada —el inicio del
    // asesor la enseña en una tarjeta— se guarda dónde estaba y se le devuelve al
    // cerrar, con los datos ya frescos que trajo el panel.
    hostPrevio = host;
    host = panel.querySelector('#atn-panel-cuerpo');
    prepararHueco();

    cablearPanel();
    pintarCabecera();

    // Lo cacheado se pinta en este mismo fotograma; la revalidación va por detrás.
    if (datos) pintar();
    cargar(false);

    if (window.AppMotion) AppMotion.modalIn(panel, panel.querySelector('.atn-panel'));
    else { panel.style.opacity = '1'; }

    // El foco arranca en el buscador: nueve de cada diez aperturas son "busca a este
    // cliente", y así se puede teclear sin tocar el ratón.
    var busca = panel.querySelector('#atn-busca');
    if (busca) {
      busca.value = filtro;
      setTimeout(function () { try { busca.focus(); } catch (e) {} }, 60);
    }

    if (opts.registrar) registrar({});
    return true;
  }

  /**
   * Deja los buscadores diciendo lo mismo que el filtro.
   *
   * Son dos —el del panel y el que la pantalla completa monta en su barra— y no
   * conviven nunca, pero los dos pueden quedarse desfasados: el filtro también cambia
   * desde fuera (un enlace con ?q=, el botón atrás del navegador), y un campo que
   * enseña una cosa mientras la lista enseña otra hace dudar de la lista.
   */
  function sincronizarBuscador() {
    if (campoBusqueda && campoBusqueda.value !== filtro) campoBusqueda.value = filtro;
    if (!panel) return;
    var busca = panel.querySelector('#atn-busca');
    var limpiar = panel.querySelector('#atn-busca-x');
    if (busca && busca.value !== filtro) busca.value = filtro;
    if (limpiar) limpiar.hidden = !filtro;
  }

  function cablearPanel() {
    if (!panel) return;

    panel.addEventListener('click', function (e) {
      // Pulsar fuera de la tarjeta cierra. Dentro, nunca: se está trabajando.
      if (e.target === panel) cerrarPanel();
    });
    panel.querySelector('[data-atn-panel-cerrar]').addEventListener('click', cerrarPanel);

    var busca = panel.querySelector('#atn-busca');
    var limpiar = panel.querySelector('#atn-busca-x');
    if (busca) {
      // Se filtra en local, sobre lo que ya está en memoria: no hay ni un viaje al
      // servidor por tecla. Buscar entre veinte atenciones es trabajo de un `filter`,
      // y hacerlo en el cliente es lo que permite que responda mientras se teclea.
      // Sin la animación de entrada: la cascada de tarjetas es para cuando la lista
      // APARECE. Repetirla en cada tecla convierte el buscador en un parpadeo. De eso
      // se encarga `buscar`, que además deja el aspa de limpiar en su sitio.
      busca.addEventListener('input', function () { buscar(busca.value); });
    }
    if (limpiar) {
      limpiar.addEventListener('click', function () {
        buscar('');
        if (busca) busca.focus();
      });
    }

    panel.querySelector('#atn-panel-recargar').addEventListener('click', function () {
      cargar(true);
    });
    panel.querySelector('#atn-panel-nueva').addEventListener('click', function () {
      registrar({});
    });
    panel.querySelector('#atn-panel-todas').addEventListener('click', function () {
      // La pantalla completa se abre EN LO QUE SE ESTABA VIENDO. Ir al panel, filtrar
      // por un cliente, pulsar "Abrir la pantalla completa" y aterrizar en la lista sin
      // filtrar y en la otra pestaña es empezar de cero: la carga de Apps Script ya
      // cuesta varios segundos como para además tener que reconstruir el estado a mano.
      var e = { sec: pestana, q: filtro };
      cerrarPanel();
      if (window.AppUrl) irAPantalla({ sec: e.sec === 'mias' ? '' : e.sec, q: e.q || '' });
    });

    panelEsc = function (e) {
      if (!panel) return;
      if (e.key === 'Escape') {
        // Con un diálogo encima (registrar, finalizar), Escape cierra ESE, no el panel.
        if (modalNodo) return;
        // Escape con una búsqueda escrita la borra primero. La escucha va en captura
        // —para ganarle a las de las pantallas de debajo— y eso significa que llega
        // ANTES que cualquier manejador del propio campo: el escalón hay que hacerlo
        // aquí o no se hace en ninguna parte.
        if (filtro && busca && document.activeElement === busca) {
          e.stopPropagation();
          buscar('');
          return;
        }
        e.stopPropagation();
        cerrarPanel();
        return;
      }
      if (e.key === 'Tab' && !modalNodo) atraparFocoPanel(e);
    };
    document.addEventListener('keydown', panelEsc, true);
  }

  /** El tabulador no se escapa del panel mientras está abierto. */
  function atraparFocoPanel(e) {
    var caja = panel.querySelector('.atn-panel');
    var focos = caja.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if (!focos.length) return;
    var primero = focos[0], ultimo = focos[focos.length - 1];
    if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
  }

  function cerrarPanel() {
    if (!panel) return;
    var nodo = panel;
    panel = null;
    filtro = '';
    if (panelEsc) { document.removeEventListener('keydown', panelEsc, true); panelEsc = null; }
    try { document.body.style.overflow = panelScrollPrevio || ''; } catch (e) {}

    // La gestión vuelve a donde estuviera antes —o a ninguna parte, que es lo normal
    // en una pantalla que solo abrió el panel—. Se repinta para que la tarjeta del
    // inicio del asesor refleje lo que se acaba de hacer aquí dentro.
    host = hostPrevio;
    hostPrevio = null;
    abiertas = {};
    if (host && datos) pintar(); else pararReloj();

    var quitar = function () { if (nodo.parentNode) nodo.parentNode.removeChild(nodo); };
    if (window.AppMotion) AppMotion.modalOut(nodo, nodo.querySelector('.atn-panel'), quitar);
    else quitar();

    if (panelFocoPrevio && panelFocoPrevio.focus) {
      try { panelFocoPrevio.focus({ preventScroll: true }); } catch (e) {}
    }
    panelFocoPrevio = null;
  }

  /** Navega a atenciones.html de verdad, saltándose el desvío al panel. */
  function irAPantalla(params) {
    if (!window.AppUrl) return false;
    var ir = AppUrl.__atencionesGoOriginal || AppUrl.go.bind(AppUrl);
    return ir('atenciones', params || null);
  }

  /* ── EL DESVÍO ───────────────────────────────────────────────────────────
     Todo lo que llevaba a la pantalla de atenciones —la barra lateral, el buscador
     general, la paleta de comandos, el aviso de una falla— pasa por AppUrl.go. En vez
     de ir uno por uno cambiando lo que hacen (y olvidarse de alguno, y de los que se
     añadan mañana), se desvía aquí una sola vez: pedir "atenciones" abre el panel.

     Se envuelve DESPUÉS de app_guardado, que ya envolvió go() con su guardia de
     salida. El orden es el correcto y no por casualidad: abrir el panel no se lleva la
     pantalla, así que no tiene por qué preguntar por los cambios en vuelo. Cualquier
     otro destino sigue cayendo en la guardia intacta.

     En atenciones.html el desvío no se pone: allí el panel sería un duplicado de lo
     que ya se está viendo. */
  function desviarNavegacion() {
    if (!window.AppUrl || AppUrl.__atencionesPanel || pantallaPropia) return;
    var original = AppUrl.go.bind(AppUrl);
    AppUrl.__atencionesGoOriginal = original;
    AppUrl.go = function (page, params) {
      if (page === 'atenciones' && haySesion() && puede()) {
        var p = params || {};
        // El panel entiende los MISMOS parámetros que la pantalla completa. Si no,
        // "Atenciones rescatables" del buscador general abriría el panel en la pestaña
        // de siempre y habría que ir a buscar a mano justo lo que se pidió por nombre.
        abrirPanel({
          registrar: p.action === 'nueva',
          buscar: p.q || p.buscar || '',
          pestana: p.sec || p.pestana || ''
        });
        return true;
      }
      return original.apply(null, arguments);
    };
    AppUrl.__atencionesPanel = true;
  }

  // ── API pública ──────────────────────────────────────────────────────────

  var AppAtenciones = {
    /**
     * Pinta la gestión completa dentro de un contenedor.
     *
     * @param {Element|string} donde
     * @param {object=} opts
     *   pantallaPropia  true en atenciones.html: no se instala el desvío al panel.
     *   pestana         'mias' | 'publicas' (o 'rescatables'), normalmente de la URL.
     *   buscar          texto inicial del buscador, normalmente de ?q=.
     *   campoBusqueda   input de la pantalla que hace de buscador; el módulo lo cablea.
     *   alCambiar       fn({ pestana, buscar }) cada vez que cambia lo que se está viendo.
     */
    montar: function (donde, opts) {
      opts = opts || {};
      // `pantallaPropia` lo pone atenciones.html: allí la gestión ES la pantalla, así
      // que el desvío al panel no se instala (se abriría un panel encima de lo mismo).
      if (opts.pantallaPropia) pantallaPropia = true;
      host = (typeof donde === 'string') ? document.getElementById(donde) : donde;
      if (!host) return false;
      if (!haySesion() || !puede()) {
        host.innerHTML = vacio('No disponible', 'Tu cuenta no tiene acceso a las atenciones pendientes.');
        return false;
      }

      // El estado de entrada se pone ANTES del primer pintado y sin avisar: viene de la
      // URL, así que reescribirla aquí sería contestarle al navegador lo que él nos
      // acaba de decir —y de paso apilar una entrada de historial por cada carga—.
      var pIni = normPestana(opts.pestana);
      if (pIni) pestana = pIni;
      if (opts.buscar) filtro = String(opts.buscar);

      if (opts.campoBusqueda) {
        campoBusqueda = (typeof opts.campoBusqueda === 'string')
          ? document.getElementById(opts.campoBusqueda) : opts.campoBusqueda;
        if (campoBusqueda) {
          campoBusqueda.value = filtro;
          // Se filtra sobre lo que ya está en memoria: ni un viaje al servidor por tecla.
          campoBusqueda.addEventListener('input', function () { buscar(campoBusqueda.value); });
          // Escape borra la búsqueda sin tener que ir al aspa. Es el mismo escalón que
          // el del panel, y aquí importa igual: se busca a un cliente, se le llama, y lo
          // siguiente es volver a ver la lista entera.
          campoBusqueda.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && filtro) { e.stopPropagation(); buscar(''); }
          });
        }
      }
      if (typeof opts.alCambiar === 'function') alCambiarEstado = opts.alCambiar;

      prepararHueco();
      cargar(false);
      return true;
    },

    /** Cambia de pestaña desde fuera. `callado` = viene de la URL, no la reescribas. */
    irAPestana: irAPestana,
    /** Pone el buscador desde fuera (?q=, atrás/adelante). */
    buscar: buscar,
    /** Qué se está viendo ahora mismo: { pestana, buscar }. */
    estado: function () { return { pestana: pestana, buscar: filtro }; },

    registrar: registrar,
    sugerir: sugerir,
    recargar: function () { return cargar(true); },

    /**
     * Calienta el panorama sin pintar nada.
     *
     * La llama la barra lateral al APUNTAR a "Atenciones", antes de que se pulse. Entre
     * que el ratón entra en el botón y se suelta el clic pasan de 200 a 600 ms, que es
     * justo lo que tarda el viaje al servidor: cuando el panel se abre, la lista ya
     * está. No cuesta nada cuando no se pulsa —una sola lectura por pantalla, y solo si
     * la persona demostró intención de abrirlo— y es lo que convierte "rápido porque
     * hay caché" en "rápido también la primera vez".
     */
    precargar: precargar,

    /** Abre la gestión como panel encima de la pantalla actual. */
    abrirPanel: abrirPanel,
    cerrarPanel: cerrarPanel,
    panelAbierto: function () { return !!panel; },
    /** ¿Esta pantalla ES la de atenciones? Entonces no hay panel que abrir. */
    esPantallaPropia: function () { return pantallaPropia; },

    /** Atenciones que coinciden con una búsqueda, para el buscador general. */
    coincidencias: coincidencias,

    /** Cifras rápidas para el inicio y el feed de supervisión. */
    resumen: function () {
      return {
        mias: (datos && datos.mias) ? datos.mias.length : 0,
        publicas: (datos && datos.publicas) ? datos.publicas.length : 0
      };
    },

    /** Para pruebas y para el botón de "ya no me lo recuerdes" de otra pantalla. */
    enfriando: enfriando,
    posponer: posponer
  };

  window.AppAtenciones = AppAtenciones;

  /* Cualquier elemento con [data-atenciones-registrar] abre el formulario, y con
     [data-atenciones-abrir] abre el panel. Así una pantalla puede ofrecer las
     atenciones sin escribir una línea de JavaScript. */
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-atenciones-registrar]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); registrar({}); });
    });
    document.querySelectorAll('[data-atenciones-abrir]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        if (!abrirPanel({}) && window.AppUrl) irAPantalla();
      });
    });

    /* El desvío se instala al final del arranque, cuando ya han corrido los
       DOMContentLoaded de las pantallas: atenciones.html monta la gestión ahí y es lo
       que marca `pantallaPropia`. Instalarlo antes desviaría a la propia pantalla de
       atenciones sobre sí misma. */
    setTimeout(desviarNavegacion, 0);
  });
})();
</script>
