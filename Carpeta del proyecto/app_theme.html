<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tipografía del sistema: UNA familia de interfaz (Inter) + una monoespaciada.
     Antes eran tres (Archivo display + Instrument Sans cuerpo + JetBrains Mono).
     Inter está dibujada para pantalla: altura de x alta, y sobre todo distingue
     1/l/I y 0/O, que es justo lo que se lee todo el día aquí (folios LVP-260726-0001
     y SKUs). El eje opsz (14..32) ajusta el dibujo al tamaño real: los títulos salen
     más ceñidos y el texto chico más abierto — de ahí viene el aire "premium",
     no de una segunda fuente decorativa. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/**
 * =====================================================================================
 * TEMA COMPARTIDO | Sistema de cotizaciones Ventel  ·  homologado a Portal Ventel
 * =====================================================================================
 * Sistema de diseño ÚNICO para toda la app. Tokens, tipografía (Inter para toda la
 * interfaz + JetBrains Mono para folios y claves), 3 temas (aurora claro por defecto,
 * slate, carbon) y ajustes de vista (escala de texto y contraste) idénticos a los del
 * Portal Ventel, de modo que ambos proyectos se ven como uno solo.
 *
 * TIPOGRAFÍA — la jerarquía la hace el PESO, no una segunda familia:
 *   400 texto corrido · 500 énfasis y controles · 600 títulos · 700 cifras y KPIs
 * Los tokens --f-* y --fw-* están DUPLICADOS a mano en Index.html y Promociones.html
 * (esas dos páginas no incluyen este archivo). Si cambias de familia, cámbiala en los
 * tres, incluido el <link> de Google Fonts.
 *
 * COMPATIBILIDAD: los nombres de token antiguos (--bg, --radius, --shadow-*, --brand-dark…)
 * se conservan como ALIAS de los nuevos, así que todo el markup y las clases v-* actuales
 * siguen funcionando sin tocarse.
 *
 * FORMATOS SAGRADOS: las vistas de documento (cotizacion / cotizado_preview /
 * consulta_cotizacion) redefinen su propia tipografía (Roboto/monospace) DESPUÉS de este
 * include, por lo que su maquetación imprimible NO se ve afectada. Aquí no se toca ninguna
 * clase propia del documento (.container-pdf, tablas CCL, etc.).
 */

/* ════════════════════════════════════════════════════════════
   TOKENS · base (tema AURORA claro por defecto)
════════════════════════════════════════════════════════════ */
:root {
  /* Marca Liverpool */
  --brand: #E10098; --brand-deep: #A8006F; --brand-bright: #EE2BAB;
  --brand-tint: #FDE7F4; --brand-soft: #FBD0E9;

  /* Superficies y tinta */
  --app-bg: #EEF1F5;
  --content-bg: #F7F9FB;
  --surface: #FFFFFF;
  --surface-2: #F4F7FA;
  --ink: #1B2330; --ink-soft: #5C6B7E; --ink-faint: #94A1B2;
  --line: #E4E9F0; --line-soft: #EEF2F7;

  /* Barra lateral / topbar (para el shell del Portal cuando se integre) */
  --side-bg: #E10098;
  --side-ink: #FFFFFF; --side-ink-soft: rgba(255,255,255,.88); --side-faint: rgba(255,255,255,.66);
  --side-active-bg: rgba(255,255,255,.22); --side-active-ink: #FFFFFF;
  --side-line: rgba(255,255,255,.14);
  --side-logo-filter: brightness(0) invert(1);
  --top-bg: rgba(255,255,255,.82);
  --top-border: var(--line);
  /* ALTURA DEL TOPBAR. Aquí solo vive el valor por omisión: la altura REAL la mide y la
     publica AppShell.mount() sobre <html>, porque cambia con las cuatro escalas de texto
     (~59 px en md, ~70 px en xl) y con la consulta de 720 px. Se declara igualmente para
     que una pantalla sin marco —o el instante anterior a mount()— tenga un número
     razonable en vez de nada. De ella cuelga todo lo que una pantalla pegue arriba. */
  --top-h: 3.75rem;

  /* Semánticos */
  --ok: #0E7A4F; --ok-bg: #E5F5EE;
  --warn: #B45309; --warn-bg: #FDF1E0;
  --alert: #C81E3C; --alert-bg: #FDE8EC;
  --info: #1D4ED8; --info-bg: #EAF0FE;
  --violet: #6D28D9; --violet-bg: #F1EAFD;

  --grad-brand: #E10098;
  --grad-ink: #241C22;

  /* Radios, sombras, foco y transición */
  --rad: 12px; --rad-sm: 8px; --rad-lg: 14px;
  --sh-xs: 0 1px 2px rgba(27,35,48,.06);
  --sh-sm: 0 2px 8px -2px rgba(27,35,48,.08), 0 1px 2px rgba(27,35,48,.05);
  --sh-md: 0 14px 34px -16px rgba(27,35,48,.22);
  --sh-lg: 0 30px 60px -24px rgba(27,35,48,.26);
  --ring: 0 0 0 4px var(--brand-tint);
  --tr: all .15s cubic-bezier(.32,.72,0,1);
  --app-glow: none;

  /* Tipografía — una sola familia de interfaz; la jerarquía la hace el PESO,
     no una segunda fuente. Si algún día se cambia de familia, se cambia aquí
     (y en las copias de Index.html y Promociones.html) y cambia todo. */
  --f-ui: 'Inter', system-ui, -apple-system, 'Segoe UI Variable Text', 'Segoe UI', Roboto, sans-serif;
  --f-display: var(--f-ui);
  --f-body: var(--f-ui);
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;

  /* Pesos con nombre: 4 escalones, ni uno más. Un peso nuevo es una decisión,
     no un número suelto en medio del CSS. */
  --fw-normal: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;

  /* ESCALA DE ESPACIO Y DE TAMAÑO DE TEXTO.
     Existían de hecho en cuatro pantallas —anuncios, portal_contenido, app_auth y
     Promociones las declaran cada una en su propio :root— pero NO aquí, y articulo.html
     las usa 59 veces sin declararlas: `padding: var(--s4) var(--s3) var(--s6)` con las
     variables sin definir es una declaración inválida, así que el visor de artículos se
     estaba pintando sin un solo margen y con los tamaños heredados. Se suben al tema,
     que es donde tenían que estar desde el principio. Las cuatro pantallas que traen su
     copia la declaran DESPUÉS de este include y siguen mandando ellas: no cambia nada de
     lo que ya se veía bien.
     En rem y no en px para el tamaño de texto: la escala de --textscale se aplica sobre
     el font-size del <html> (abajo), y un token en px se quedaría sordo a ese ajuste. */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .875rem; --fs-base: 1rem; --fs-lg: 1.0625rem;

  /* ---- ALIAS de compatibilidad (tokens antiguos → nuevos) ---- */
  --bg: var(--app-bg);
  --radius: var(--rad-lg);
  --shadow-sm: var(--sh-sm);
  --shadow-md: var(--sh-md);
  --shadow-brand: 0 10px 24px -10px rgba(225,0,152,.45);
  --brand-dark: var(--brand-deep);
  --bad: var(--alert);
}

/* ── Tema SLATE · corporativo claro, pink solo de acento ── */
[data-theme="slate"] {
  --app-bg: #EEF1F5;
  --content-bg: #F7F9FB;
  --surface: #FFFFFF;
  --surface-2: #F4F7FA;
  --ink: #1B2330; --ink-soft: #5C6B7E; --ink-faint: #94A1B2;
  --line: #E4E9F0; --line-soft: #EEF2F7;
  --top-bg: rgba(255,255,255,.85);
  --app-glow: radial-gradient(900px 420px at 90% -10%, rgba(225,0,152,.05), transparent 60%);
  --ring: 0 0 0 4px rgba(225,0,152,.16);
}

/* ── Tema CARBÓN · panel oscuro ── */
[data-theme="carbon"] {
  --app-bg: #0E1014;
  --content-bg: #15181E;
  --surface: #1C2027;
  --surface-2: #22272F;
  --ink: #F1EDEF; --ink-soft: #A7A2AC; --ink-faint: #8B8590;
  --line: #2C313A; --line-soft: #262B33;
  --brand-tint: rgba(225,0,152,.16); --brand-soft: rgba(225,0,152,.34);
  --top-bg: rgba(21,24,30,.82);
  --ok-bg: rgba(14,122,79,.18); --warn-bg: rgba(180,83,9,.18);
  --alert-bg: rgba(200,30,60,.18); --info-bg: rgba(29,78,216,.20); --violet-bg: rgba(109,40,217,.20);
  --app-glow:
    radial-gradient(1000px 460px at 92% -8%, rgba(225,0,152,.14), transparent 60%),
    radial-gradient(760px 400px at -6% 30%, rgba(109,40,217,.10), transparent 55%);
  --grad-ink: #1A1016;
  --sh-xs: 0 1px 2px rgba(0,0,0,.4);
  --sh-sm: 0 2px 10px -2px rgba(0,0,0,.5);
  --sh-md: 0 16px 40px -18px rgba(0,0,0,.7);
  --sh-lg: 0 30px 60px -24px rgba(0,0,0,.75);
  --ring: 0 0 0 4px rgba(225,0,152,.22);
}

/* ── Ajustes de vista: escala de texto (rem globales) ── */
html { font-size: 16px; transition: font-size .18s ease; }
html[data-textscale="sm"] { font-size: 15px; }
html[data-textscale="md"] { font-size: 16px; }
html[data-textscale="lg"] { font-size: 17.5px; }
html[data-textscale="xl"] { font-size: 19px; }

/* ── Ajustes de vista: alto contraste ── */
html[data-contrast="high"] {
  --line: #0c1420; --line-soft: #22303f; --ink-soft: #2b3645; --ink-faint: #475160;
}
html[data-contrast="high"][data-theme="carbon"] {
  --line: #7b8696; --line-soft: #5c6677; --ink-soft: #d6d2da; --ink-faint: #b4afbb;
}
html[data-contrast="high"] .v-card,
html[data-contrast="high"] .v-input,
html[data-contrast="high"] .v-select,
html[data-contrast="high"] .v-textarea { border-width: 2px; }
html[data-contrast="high"] :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

/* ── Ajustes de vista: densidad (compacto) ── */
html[data-density="compact"] .v-table thead th,
html[data-density="compact"] .v-table tbody td { padding-top: .55rem; padding-bottom: .55rem; }
html[data-density="compact"] .v-card { border-radius: var(--rad); }

/* ════════════════════════════════════════════════════════════
   BASE
════════════════════════════════════════════════════════════ */
body {
  font-family: var(--f-body);
  background: var(--app-glow), var(--app-bg);
  background-attachment: fixed;
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* Deja que Inter use su eje óptico: dibuja distinto a 12px que a 32px. */
  font-optical-sizing: auto;
  /* cv05 = "l" con cola. Sin esto, en un folio LVP-... o un SKU la ele minúscula
     y el uno son casi el mismo palito. Es la mitad de la legibilidad de esta app. */
  font-feature-settings: 'cv05' 1;
  transition: background-color .4s ease, color .4s ease;
}
::selection { background: var(--brand-soft); }

/* ── Jerarquía tipográfica ──
   Una sola familia: lo que separa un título de un párrafo es el peso, el
   interlineado y el tracking. Regla: a más tamaño, más ceñido y más apretado. */
h1, h2, h3, h4, .v-display {
  font-family: var(--f-display);
  font-weight: var(--fw-semibold);
  line-height: 1.18;
  letter-spacing: -.018em;
  text-wrap: balance;              /* evita títulos con una palabra huérfana */
}
h1, .v-display { letter-spacing: -.024em; }
h4 { line-height: 1.3; letter-spacing: -.012em; }

/* FORMATOS INTOCABLES: el documento de cotización (.container-pdf en
   cotizado_preview / consulta_cotizacion) replica un documento oficial. Hereda la
   familia del sistema —ya lo hacía antes—, pero NO el tracking, el interlineado
   ni el balanceo de líneas que se acaban de definir arriba: esos sí moverían el
   maquetado del documento. */
.container-pdf h1, .container-pdf h2, .container-pdf h3, .container-pdf h4 {
  letter-spacing: normal;
  line-height: inherit;
  text-wrap: initial;
}

/* Texto largo: 65 caracteres es el ancho donde el ojo no se pierde al saltar
   de renglón. Se aplica con la clase, no a ciegas, para no romper maquetados. */
.v-prose { max-width: 65ch; line-height: 1.65; }

/* Rótulos en MAYÚSCULAS: necesitan aire entre letras o se leen como un bloque. */
.v-label, .side-label, .app-switch-lbl { letter-spacing: .08em; }

/* ── Cifras ──
   tabular-nums fija el ancho de cada dígito: en una tabla de importes las
   columnas dejan de bailar al cambiar de fila, y un total alineado se lee de
   un vistazo. Es la señal de "hecho con cuidado" más barata que existe. */
.v-table, .v-kpi-value, .v-money, .side-count, time, [data-money] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1, 'cv05' 1;
}

/* Fondo con aurora sutil para pantallas de app (no se imprime) */
.app-aurora {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(60rem 30rem at 110% -10%, rgba(225, 0, 152, .08), transparent 60%),
    radial-gradient(48rem 28rem at -20% 110%, rgba(225, 0, 152, .05), transparent 60%);
}

/* ---------- Botones ---------- */
.v-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .62rem 1.1rem;
  border-radius: var(--rad-sm);
  border: 1px solid transparent;
  font-family: var(--f-body);
  font-weight: 700;
  font-size: .875rem;
  line-height: 1.25;
  cursor: pointer;
  white-space: nowrap;
  transition: transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s ease, background-color .16s ease, color .16s ease, border-color .16s ease;
  box-shadow: var(--sh-xs);
}
.v-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--sh-md); }
.v-btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
.v-btn:focus-visible { outline: none; box-shadow: var(--ring); }
.v-btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.v-btn svg { width: 1.15em; height: 1.15em; flex: none; }

.v-btn-primary { background: var(--grad-brand); color: #fff; box-shadow: 0 6px 14px -8px rgba(225,0,152,.55); }
.v-btn-primary:hover:not(:disabled) { box-shadow: var(--shadow-brand); }
.v-btn-dark { background: var(--grad-ink); color: #fff; }
.v-btn-dark:hover:not(:disabled) { background: #000; }
.v-btn-ghost { background: var(--surface); color: var(--ink-soft); border-color: var(--line); }
.v-btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--brand-soft); }
.v-btn-success { background: var(--ok); color: #fff; }
.v-btn-danger { background: var(--alert); color: #fff; }
.v-btn-indigo { background: linear-gradient(135deg, #5850ec, #6d28d9); color: #fff; }
.v-btn-sm { padding: .4rem .75rem; font-size: .8rem; border-radius: var(--rad-sm); }

/* Acciones de fila en tablas */
.v-row-action {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  font-weight: 700;
  font-size: .8rem;
  padding: .3rem .55rem;
  border-radius: var(--rad-sm);
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-soft);
  transition: background-color .15s ease, color .15s ease, transform .15s ease;
}
.v-row-action:hover:not(:disabled) { transform: translateY(-1px); }
.v-row-action:disabled { opacity: .5; cursor: wait; }
.v-row-action svg { width: 1em; height: 1em; }
.v-act-pink { color: var(--brand); } .v-act-pink:hover:not(:disabled) { background: var(--brand-tint); }
.v-act-blue { color: var(--info); } .v-act-blue:hover:not(:disabled) { background: var(--info-bg); }
.v-act-green { color: var(--ok); } .v-act-green:hover:not(:disabled) { background: var(--ok-bg); }
.v-act-slate { color: var(--ink-soft); } .v-act-slate:hover:not(:disabled) { background: var(--surface-2); }

/* ---------- Tarjetas y secciones ---------- */
.v-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  box-shadow: var(--sh-sm);
}
.v-card-hover { transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease, border-color .22s ease; }
.v-card-hover:hover { transform: translateY(-3px); box-shadow: var(--sh-md); border-color: var(--brand-soft); }

/* ---------- Inputs ---------- */
.v-input, .v-select, .v-textarea {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: .6rem .8rem;
  font-family: var(--f-body);
  font-size: .875rem;
  background: var(--surface);
  color: var(--ink);
  transition: border-color .16s ease, box-shadow .16s ease;
  box-sizing: border-box;
}
.v-input::placeholder, .v-textarea::placeholder { color: var(--ink-faint); }
.v-input:focus, .v-select:focus, .v-textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: var(--ring);
}
.v-input:disabled, .v-select:disabled, .v-textarea:disabled { background: var(--surface-2); color: var(--ink-faint); }
.v-label { display: block; font-size: .8rem; font-weight: 600; color: var(--ink-soft); margin-bottom: .35rem; }

/* ---------- Navbar ---------- */
.v-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--top-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: background-color .3s ease, border-color .3s ease, box-shadow .3s ease;
}
.v-nav.is-scrolled {
  border-bottom-color: var(--line);
  box-shadow: var(--sh-sm);
}

/* ---------- Badges de estatus ---------- */
.v-badge {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .2rem .65rem;
  border-radius: 999px;
  font-size: .72rem;
  font-weight: 700;
  white-space: nowrap;
}
.v-badge::before { content: ''; width: .42rem; height: .42rem; border-radius: 999px; background: currentColor; opacity: .7; }
.v-badge-green { background: var(--ok-bg); color: var(--ok); }
.v-badge-yellow { background: var(--warn-bg); color: var(--warn); }
.v-badge-red { background: var(--alert-bg); color: var(--alert); }
.v-badge-blue { background: var(--info-bg); color: var(--info); }
.v-badge-pink { background: var(--brand-tint); color: var(--brand-deep); }

/* ---------- Spinner ---------- */
.v-spinner {
  display: inline-block;
  width: 1.1em;
  height: 1.1em;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: v-spin .7s linear infinite;
  flex: none;
}
@keyframes v-spin { to { transform: rotate(360deg); } }

/* ---------- Toast ---------- */
/* Comparte esquina con el indicador "Consultando…" de app_core, que se planta en
   top:1rem. Cuando ese indicador está en pantalla se marca --vb-alto y los avisos
   bajan lo justo para no taparlo: los dos dicen cosas distintas y hay momentos
   —revalidar y fallar— en los que se ven a la vez. */
#v-toast-region {
  position: fixed;
  top: calc(1rem + var(--vb-alto, 0px));
  right: 1rem;
  z-index: 10000;
  transition: top .22s ease;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  max-width: min(24rem, calc(100vw - 2rem));
}
.v-toast {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  padding: .8rem 1rem;
  border-radius: 12px;
  background: var(--grad-ink);
  color: #fff;
  font-size: .85rem;
  line-height: 1.45;
  box-shadow: var(--sh-md);
  border-left: 4px solid var(--brand);
}
.v-toast.ok { border-left-color: var(--ok); }
.v-toast.bad { border-left-color: var(--alert); }
.v-toast.warn { border-left-color: var(--warn); }

/* ---------- Modal ---------- */
.v-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, .45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  padding: 1rem;
}
.v-modal-overlay.active { display: flex; }
.v-modal {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1.6rem;
  width: 100%;
  max-width: 34rem;
  box-shadow: var(--sh-lg);
}

/* ---------- Overlay de carga / redirección ---------- */
.v-overlay {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  background: color-mix(in srgb, var(--app-bg) 92%, transparent);
  backdrop-filter: blur(3px);
  transition: opacity .35s ease, visibility .35s ease;
}
.v-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.v-overlay-spinner {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 5px solid var(--brand-tint);
  border-top-color: var(--brand);
  animation: v-spin 1.1s cubic-bezier(.5, 0, .5, 1) infinite;
}
.v-overlay-text { font-weight: 600; color: var(--ink-soft); }

/* ---------- Tablas ---------- */
.v-table-wrap { overflow-x: auto; border-radius: var(--rad); }
.v-table { width: 100%; font-size: .85rem; text-align: left; color: var(--ink-soft); border-collapse: collapse; }
.v-table thead th {
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--ink-faint);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  padding: .85rem 1.25rem;
  font-weight: 700;
  white-space: nowrap;
}
