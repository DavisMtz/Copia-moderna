<body class="h-full">

    <main id="main-content" class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Estado de operación: si algún sistema está caído se dice aquí, antes que nada.
             Lo rellena AppOperacion; si no hay incidencias, no ocupa espacio. -->

        <!-- Cabecera -->

            </h1>
            <p class="text-slate-600 mt-1" data-animate>

            </p>
        </header>

        <!-- El Inicio es de las COTIZACIONES y de nada más. Aquí hubo una tarjeta de
             atenciones pendientes; se retiró porque partía en dos la pantalla que
             contesta una sola pregunta —"¿cómo van mis cotizaciones?"— y obligaba a
             leer dos listas para llegar a la de siempre.

             Las atenciones no se pierden: siguen en el botón de la barra lateral, que
             las abre como panel encima de esta pantalla sin llevársela, y en el
             buscador general. El módulo se sigue cargando abajo justo para eso. -->

        <!-- Acciones -->
        <section class="mb-8 p-6 v-card" data-animate>
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center gap-3 flex-wrap">
                    <button id="newQuoteButton" class="v-btn v-btn-primary">
                        <span class="button-icon"><span class="w-5 h-5 block" data-icon="plus"></span></span>
                        <span class="button-text">Nueva Cotización</span>
                    </button>
                    <button id="sendEmailButton" class="v-btn v-btn-dark">
                        <span class="button-icon"><span class="w-5 h-5 block" data-icon="mail"></span></span>
                        <span class="button-text">Enviar Correo</span>
                    </button>
                </div>
                <div class="flex-grow md:max-w-sm">
                    <form id="searchForm" class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                            <span class="w-5 h-5 block text-slate-400" data-icon="search"></span>
                        </div>
                        <input type="search" id="searchInput" name="search" placeholder="Folio, cliente o su correo · si no es tuya, se busca en todo el equipo" class="v-input" style="padding-left: 2.5rem;">
                    </form>
                </div>
            </div>
        </section>

        <!-- Resumen proactivo + estado de sincronización -->
        <section class="mb-4 flex flex-wrap items-center justify-between gap-3" data-animate>
            <div class="flex items-center gap-2 flex-wrap">
                <span class="v-badge v-badge-pink">Tus cotizaciones: <strong id="stat-total" class="ml-1">0</strong></span>
                <span class="v-badge v-badge-green">Enviadas: <strong id="stat-sent" class="ml-1">0</strong></span>
                <span class="v-badge v-badge-yellow">Por enviar: <strong id="stat-pending" class="ml-1">0</strong></span>
                <span class="v-badge v-badge-blue">Este mes: <strong id="stat-month" class="ml-1">0</strong></span>
            </div>
            <div class="flex items-center gap-2">
                <span id="sync-status" class="text-xs text-slate-500"></span>
                <button id="refreshButton" class="v-btn v-btn-ghost v-btn-sm" title="Buscar la información más reciente">
                    <span class="button-icon"><span class="w-4 h-4 block" data-icon="refresh"></span></span>
                    <span class="button-text">Actualizar</span>

        </section>

        <!-- Tabla de Cotizaciones -->
        <section data-animate>

        </footer>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Con la clave de página: sin ella, el login no sabía a dónde devolver y un
        // enlace a ?page=dashboard&q=… que caía sin sesión terminaba en el panel
        // del rol, perdiendo la búsqueda que venía en el enlace.
        if (!requireSession('dashboard')) return;

        // Marco lateral compartido con el Portal (envuelve el <main> y aporta sesión/tema).
        AppShell.mount({ active: 'dashboard', title: 'Panel' });

        /* ── Atenciones pendientes ─────────────────────────────────────────────
           Ya no se pintan en esta pantalla: el Inicio es de las cotizaciones. Lo que
           queda es dejar la lista CALIENTE, porque el botón de la barra lateral abre el
           panel encima de aquí y ese panel tiene que aparecer lleno, no con una rueda.

           Se pide sin pintar nada y sin prisa: un segundo después del arranque, para no
           competir con la carga de las cotizaciones, que es lo que la persona vino a
           ver. Si además pasa el ratón por el botón, app_shell vuelve a pedirlo y este
           módulo ya no repite la llamada. */
        if (window.AppAtenciones && AppAtenciones.precargar && AppSession.can('atenciones')) {
            setTimeout(function () { AppAtenciones.precargar(); }, 1000);
        }

        /* Recorrido guiado del Panel. Se registra después de montar la barra para que
           los pasos que apuntan al menú encuentren el menú ya pintado. */
        if (window.AppOnboarding) AppOnboarding.auto({
          pantalla: 'dashboard',
          version: 1,
          retraso: 700,
          pasos: [
            {
              titulo: 'Tu panel de cotizaciones',
              texto: 'Aquí vive todo lo que has cotizado: qué se envió, qué falta por enviar y en qué ' +
                     'estatus va cada folio.<br><br>Cinco paradas y te dejo trabajar.'
            },
            {
              sel: '#newQuoteButton',
              pos: 'abajo',
              titulo: 'Empezar una cotización',
              texto: 'Este es el botón del día a día. Abre la pantalla de cotización con tus datos ya puestos; ' +
                     'tú solo agregas cliente y productos.'
            },
            {
              sel: '#searchInput',
              pos: 'abajo',
              titulo: 'Encontrar un folio',
              texto: 'Escribe el <b>folio</b> (LVP-…), el <b>nombre del cliente</b> o su <b>correo</b> y la tabla ' +
                     'se filtra al momento. No hace falta escribirlo perfecto: encuentra igual sin acentos y ' +
                     'con algún dedazo.' +
                     '<br><br>Si no aparece entre las tuyas, la búsqueda sigue sola en las de todo el equipo ' +
                     'y te dice de quién es cada folio.' +
                     '<br><br>¿Buscas otra pantalla y no un folio? <b>Ctrl + K</b> abre el buscador general ' +
                     'desde cualquier parte del sistema.'
            },
            {
              sel: '#stat-total',
              pos: 'abajo',
              relleno: 12,
              titulo: 'Tus números de un vistazo',
              texto: 'Cuántas llevas, cuántas se enviaron y cuántas siguen <b>por enviar</b>. ' +
                     'Esa última es la que conviene mirar antes de terminar el día.'
            },
            {
              sel: '.v-table',
              pos: 'arriba',
              titulo: 'La tabla manda',
              texto: 'Cada fila tiene sus acciones al final: ver, enviar o duplicar. El <b>estatus</b> te dice ' +
                     'si una cotización está esperando algo de ti.<br><br>' +
                     'El botón <b>Ver el tutorial</b>, abajo en la barra lateral, repite este recorrido.'
            }
          ]
        });

        // El loader de marca cubre el arranque; se retira en cuanto la pantalla está lista.
        if (window.VentelLoader) VentelLoader.hide();

        const mainContent = document.getElementById('main-content');
        const userNameElement = document.getElementById('user-name');
        const tableBody = document.getElementById('quotes-table-body');
        const tablePlaceholder = document.getElementById('table-placeholder');
        const quoteTable = tableBody.closest('table');
        const newQuoteButton = document.getElementById('newQuoteButton');
        const sendEmailButton = document.getElementById('sendEmailButton');
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');

        const currentUserEmail = AppSession.userEmail;
        userNameElement.textContent = AppSession.firstName;

        const setUIInteractionState = (isLocked) => {
            const interactiveElements = [newQuoteButton, sendEmailButton, searchInput, ...document.querySelectorAll('.v-row-action')];
            interactiveElements.forEach(el => { if (el) el.disabled = isLocked; });
            mainContent.style.pointerEvents = isLocked ? 'none' : '';
        };

        const setButtonLoadingState = (button, isLoading) => {
            if (!button) return;
            const textEl = button.querySelector('.button-text');
            const iconEl = button.querySelector('.button-icon');
            if (isLoading) {
                if (textEl && !button.dataset.originalText) button.dataset.originalText = textEl.textContent;
                if (iconEl && !button.dataset.originalIcon) button.dataset.originalIcon = iconEl.innerHTML;
                if (textEl) textEl.textContent = 'Cargando...';
                if (iconEl) iconEl.innerHTML = '<div class="v-spinner"></div>';
            } else {
                if (textEl && button.dataset.originalText) textEl.textContent = button.dataset.originalText;
                if (iconEl && button.dataset.originalIcon) iconEl.innerHTML = button.dataset.originalIcon;
            }
        };

        const navigateToPage = (page, params = {}, buttonElement = null) => {
            setUIInteractionState(true);
            if (buttonElement) setButtonLoadingState(buttonElement, true);
            if (!AppUrl.go(page, params)) {
                setUIInteractionState(false);
                if (buttonElement) setButtonLoadingState(buttonElement, false);
            }
        };

        window.navigateToQuoteView = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');
            AppSession.selectedFolio = folio;   // respaldo si el parámetro no llega (ver app_core)
            navigateToPage('consulta_cotizacion', { folio: folio }, this);
        };

        window.navigateToQuoteEdit = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');
            navigateToPage('cotizacion', { folio: folio, action: 'edit' }, this);
        };

        window.navigateToResend = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');
            navigateToPage('correoventel', { folio: folio }, this);
        };

        // Copia un deep-link a la consulta de la cotización (para compartir por chat/correo).
        window.copyQuoteLink = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');
            AppUrl.copyLink('consulta_cotizacion', { folio: folio }).then(ok => {
                AppMotion.toast(ok ? `Enlace de ${folio} copiado. Pégalo donde lo necesites.` : 'No se pudo copiar el enlace.', ok ? 'ok' : 'error');
            });
        };

        window.openQuoteInSheets = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');

            const button = this;
            // La pestaña se abre aquí, durante el clic. Si se abriera al llegar la respuesta
            // del servidor, el navegador la bloquearía por ser un popup sin interacción.
            const tab = window.open('', '_blank');
            setButtonLoadingState(button, true);
            button.disabled = true;

            // Se le escribe algo dentro mientras el servidor prepara el enlace: la pestaña
            // en blanco de 3-15 s es justo donde la gente cree que se rompió algo (igual
            // que en inicio_avanzado.html). Si falla, el aviso se queda EN esa pestaña
            // -que es donde está mirando quien pulsó- además del toast de aquí.
            const fxTab = VentelFX.tab(tab, {
                title: 'Abriendo ' + escapeHtml(folio) + '…',
                sub: 'Preparando el formato CCL en Google Sheets'
            });

            // `busy: 'Abriendo'` en vez del rótulo genérico: lo que se está esperando
            // no es una consulta, es que se arme el documento en Sheets.
            AppRun.call('openQuoteInSheets', [folio, AppSession.userEmail], { busy: 'Abriendo' })
                .then(response => {
                    setButtonLoadingState(button, false);
                    button.disabled = false;
                    if (response && response.success) {
                        if (tab) {
                            fxTab.done();
                            tab.location.href = response.url;
                        } else {
                            AppMotion.toast('El navegador bloqueó la pestaña nueva. Permite las ventanas emergentes para este sitio e intenta de nuevo.', 'warn');
                        }
                    } else {
                        fxTab.fail(escapeHtml((response && response.message) || 'No se pudo abrir el documento.'));
                        AppMotion.toast((response && response.message) || 'No se pudo abrir el documento.', 'error');
                    }
                }, error => {
                    setButtonLoadingState(button, false);
                    button.disabled = false;
                    fxTab.fail('No pudimos abrir el documento. Inténtalo de nuevo en un momento.');
                    console.error('openQuoteInSheets:', error);
                    AppMotion.toast('No pudimos abrir el documento. Inténtalo de nuevo en un momento.', 'error');
                });
        };

        /* --- Datos locales: las cotizaciones propias se guardan en caché para pintar
               la tabla al instante y se revalidan SIEMPRE contra el servidor. ---

           POR QUÉ AQUÍ NO SE USA `AppRun.swr`, que es el patrón por defecto.
           `swr` guarda en la caché LA RESPUESTA ENTERA (`{success, quotes}`), y esta
           clave no es solo suya: `app_precarga` la calienta desde otras pantallas y
           el buscador general (`app_comando`) la lee para indexar folios sin gastar
           una llamada. Los dos esperan encontrar ahí EL ARREGLO de cotizaciones.
           Cambiar la forma obligaría a tocar los tres a la vez y a que, mientras la
           copia vieja siguiera en el navegador de cada quien, la tabla se pintara
           vacía durante un instante en el arranque.

           Lo que sí es de `AppRun` es la llamada, que es donde estaba lo que faltaba:
           deduplicación —dos pulsaciones seguidas de "Actualizar" son un viaje, no
           dos— e indicador de la esquina llevado por el mismo sitio que el resto de
           la app. El leer-pintar-revalidar-guardar se queda escrito aquí porque la
           forma de lo guardado es un contrato con otros dos módulos. */
        const QUOTES_CACHE_KEY = 'quotes-' + currentUserEmail;
        const syncStatus = document.getElementById('sync-status');
        const refreshButton = document.getElementById('refreshButton');
        let myQuotes = []; // Última lista propia conocida (para filtrar sin red y calcular el resumen).
        let listaPropiaPedida = false;  // ¿se ha llegado a pedir? (ver la rama de término vacío)
        let buscandoFuera = false;  // hay una búsqueda del equipo en marcha o en pantalla
        let relojFuera = null;      // antirrebote de esa búsqueda

        const setSyncStatus = (text) => { if (syncStatus) syncStatus.textContent = text; };

        const updateStats = (quotes) => {
            const isSent = (q) => String(q.estatus || '').toLowerCase().includes('enviada');
            // El folio LVP-AAMMDD-XXXX codifica la fecha: el prefijo del mes es exacto.
            const now = new Date();
            const monthPrefix = 'LVP-' + String(now.getFullYear()).slice(-2) + String(now.getMonth() + 1).padStart(2, '0');
            const thisMonth = quotes.filter(q => String(q.folio || '').startsWith(monthPrefix)).length;
            document.getElementById('stat-total').textContent = quotes.length;
            document.getElementById('stat-sent').textContent = quotes.filter(isSent).length;
            document.getElementById('stat-pending').textContent = quotes.filter(q => !isSent(q)).length;
            document.getElementById('stat-month').textContent = thisMonth;
        };

        const loadUserQuotes = (searchTerm = null, forzarRecarga = false) => {
            const isOwnList = !searchTerm;
            if (isOwnList) listaPropiaPedida = true;

            // 1. Primer pintado instantáneo desde la caché local (solo para la lista propia).
            const cached = isOwnList ? AppCache.get(QUOTES_CACHE_KEY) : null;
            if (cached && Array.isArray(cached.data)) {
                myQuotes = cached.data;
                displayQuotes(myQuotes);
                updateStats(myQuotes);
                setSyncStatus('Datos guardados ' + AppCache.ageLabel(cached.at) + ' · actualizando...');
            } else {
                const loadingMessage = searchTerm ? 'Buscando en todo el sistema...' : 'Cargando tus cotizaciones...';
                updateTablePlaceholder(`<div class="flex items-center justify-center gap-3 text-slate-500"><div class="v-spinner"></div> ${loadingMessage}</div>`);
                setSyncStatus('');
            }

            // 2. Revalidación contra el servidor (siempre).
            // El indicador de la esquina dice que esto sigue en marcha: con la tabla
            // ya pintada desde la caché, es la única señal de que lo que se está
            // leyendo todavía se está comprobando. Lo enciende y lo apaga AppRun, que
            // es quien sabe si la llamada se fusionó con otra ya en vuelo.
            // El tercer argumento salta la caché del servidor: "Actualizar" debe
            // significar releer la hoja, no repetir lo que ya estaba guardado.
            AppRun.call('getQuotesForUser', [currentUserEmail, searchTerm, forzarRecarga === true],
                        { busy: searchTerm ? 'Buscando' : 'Consultando' })
                .then(response => {
                    response = response || {};
                    if (!response.success && response.message) AppMotion.toast(response.message, 'error');
                    const quotes = response.success ? (response.quotes || []) : [];
                    if (isOwnList) {
                        myQuotes = quotes;
                        AppCache.set(QUOTES_CACHE_KEY, quotes);
                        updateStats(quotes);
                        setSyncStatus('Actualizado ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
                        // Si el usuario ya está filtrando localmente, se respeta su filtro.
                        const term = searchInput.value.trim();
                        if (term) { filterLocal(term); return; }
                    } else {
                        // Una respuesta que ya no corresponde a lo que está escrito no debe
                        // pisar la tabla: se teclea más rápido de lo que contesta la hoja.
                        if (searchInput.value.trim() !== String(searchTerm).trim()) return;
                        const ajenas = quotes.filter(q => !esMia(q)).length;
                        setSyncStatus(quotes.length
                            ? `${quotes.length} en todo el sistema${ajenas ? ` · ${ajenas} de otros asesores` : ''}`
                            : 'Sin resultados en todo el sistema');
                    }
                    displayQuotes(quotes, searchTerm
                        ? 'Nada coincide en todo el sistema. Revisa el folio o prueba con el correo del cliente.'
                        : null);
                }, error => {
                    console.error("Fallo en la llamada a getQuotesForUser:", error);
                    if (cached) {
                        setSyncStatus('Sin conexión · mostrando datos guardados ' + AppCache.ageLabel(cached.at));
                        AppMotion.toast('No pudimos conectarnos: te mostramos la última información guardada.', 'warn');
                    } else {
                        updateTablePlaceholder("No pudimos cargar tus cotizaciones. Revisa tu conexión e inténtalo de nuevo.");
                    }
                });
        };

        /* --- Filtro instantáneo (sin red) sobre las cotizaciones propias ---
         *
         * El criterio de coincidencia ya no vive aquí: lo pone AppBuscar (app_buscar.html),
         * el mismo motor que usan el buscador general, el panel de supervisión y el monitor
         * de promociones. Antes cada pantalla llevaba su propia copia del algoritmo y la
         * misma palabra encontraba cosas distintas según dónde se escribiera.
         *
         * Se busca por FOLIO, CLIENTE, CORREO DEL CLIENTE y estatus. El correo es la
         * novedad y no es un adorno: cuando el cliente vuelve a llamar rara vez trae el
         * folio a la mano, pero su correo sí está a la vista en el chat o en el pedido.
         *
         * Los pesos dicen qué manda. Un folio que coincide vale más que un estatus que
         * coincide, así que escribir "118" no entierra el folio bajo las cotizaciones
         * cuyo total lleva un 118.
         */
        const camposCotizacion = (q) => [
            { t: q.folio, p: 3 },
            { t: q.cliente, p: 2 },
            { t: q.correoCliente, p: 2 },
            { t: q.asesor, p: 1 },
            { t: q.estatus, p: 0.6 }
        ];

        /** Filtra la lista propia ya cargada. Devuelve cuántas quedaron. */
        const filterLocal = (term) => {
            const filtered = window.AppBuscar
                ? AppBuscar.filtra(myQuotes, term, camposCotizacion)
                : myQuotes.filter(q => [q.folio, q.cliente, q.correoCliente, q.estatus]
                    .join(' ').toLowerCase().indexOf(String(term).toLowerCase()) !== -1);
            displayQuotes(filtered, buscandoFuera
                ? 'Sin coincidencias entre tus cotizaciones. Buscando en las de todo el equipo…'
                : 'Sin coincidencias entre tus cotizaciones. Presiona Enter para buscar en todo el sistema.');
            return filtered.length;
        };

        /*
         * El catálogo de estatus vive en app_estatus.html, compartido con el panel de
         * supervisión y con la pantalla de revisión. Antes este archivo tenía su propio mapa
         * y pintaba "Aprobada" y "Enviada por Correo" del mismo verde: el asesor no podía
         * distinguir lo que ya salió al cliente de lo que solo está autorizado. Ahora cada
         * estado trae color, icono y palabra propios, y son idénticos en todas las pestañas.
         */

        const statusKey = AppEstatus.clave;

        // Los datos de una cotización los teclea un asesor y los ve cualquier otro desde
        // la búsqueda global: todo lo que entra a innerHTML pasa por escapeHtml, y lo que
        // va dentro de un onclick por escapeJsString (ambos viven en app_core).
        const esc = window.escapeHtml || ((s) => String(s == null ? '' : s));
        const escapeFolio = window.escapeJsString || ((folio) => String(folio || '').replace(/'/g, "\\'"));

        /* ¿Es mía esta cotización? Lo decide la pantalla y no el servidor: los resultados
           de una búsqueda se guardan en caché por término y esa copia la comparte todo el
           equipo, así que la marca tiene que calcularse contra ESTA sesión. */
        const esMia = (q) => {
            const suyo = String(q.asesorCorreo || '').trim().toLowerCase();
            return !suyo || suyo === String(currentUserEmail || '').trim().toLowerCase();
        };

        /* Resalta lo que coincidió. Ver el PORQUÉ de una fila es lo que vuelve creíble una
           búsqueda tolerante: sin esto, encontrar "González" al escribir "gonzales" parece
           un error del sistema en vez de la ayuda que es. */
        const marca = (texto, termino) => (window.AppBuscar && termino)
            ? AppBuscar.resalta(texto == null ? '' : texto, termino)
            : esc(texto == null ? '' : texto);

        const displayQuotes = (quotes, emptyMessage = null) => {
            tableBody.innerHTML = '';
            if (quotes.length === 0) {
                const message = emptyMessage || (searchInput.value.trim() ? "No se encontraron cotizaciones para tu búsqueda." : "Aún no tienes cotizaciones. ¡Crea una nueva!");
                updateTablePlaceholder(message);
                return;
            }
            updateTablePlaceholder("");

            const termino = searchInput.value.trim();

            quotes.forEach(quote => {
                const row = document.createElement('tr');
                row.style.opacity = '0';
                const est = AppEstatus.info(quote.estatus, quote.revisionEstado);
                const folioJs = escapeFolio(quote.folio);
                // Filo de color en la primera celda: lo que sigue esperando revisión se
                // localiza bajando por la columna del folio, sin llegar a la de estatus.
                if (est.pendiente) row.className = 'v-fila-pendiente';
                else if (est.clave === 'rechazada') row.className = 'v-fila-rechazada';

                /* De quién es y a qué correo fue. En una búsqueda de todo el sistema, la
                   mitad de las filas son de otros asesores y antes no había forma de
                   distinguirlas: se veían dos folios iguales de gente distinta sin saber
                   a quién preguntarle. El correo del cliente va debajo del nombre porque
                   es el dato con el que más se vuelve a buscar la misma cotización. */
                const ajena = !esMia(quote);
                const sello = ajena
                    ? `<span class="v-badge v-badge-blue ml-2" title="La creó ${esc(quote.asesor || 'otro asesor')}">${esc(quote.asesor || 'Otro asesor')}</span>`
                    : '';
                const correo = quote.correoCliente
                    ? `<div class="text-xs text-slate-500">${marca(quote.correoCliente, termino)}</div>`
                    : '';

                row.innerHTML = `
                    <td class="font-medium text-slate-900">${marca(quote.folio || 'N/A', termino)}${sello}</td>
                    <td>${marca(quote.cliente || 'N/A', termino)}${correo}</td>
                    <td>${esc(quote.fecha || 'N/A')}</td>
                    <td class="font-medium">${formatMoney(quote.total)}</td>
                    <td>${AppEstatus.badge(quote.estatus, quote.revisionEstado)}</td>
                    <td>
                        <div class="flex items-center justify-center gap-1 flex-wrap">
                            <button onclick="navigateToQuoteView.call(this, '${folioJs}')" title="Ver la cotización" class="v-row-action v-act-pink">
                                ${Icons.svg('eye')}
                                Ver
                            </button>
                            <button onclick="navigateToQuoteEdit.call(this, '${folioJs}')" title="Editar y volver a cotizar" class="v-row-action v-act-blue">
                                ${Icons.svg('pencil')}
                                Editar
                            </button>
                            <button onclick="navigateToResend.call(this, '${folioJs}')" title="Enviar o reenviar por correo" class="v-row-action v-act-slate">
                                ${Icons.svg('send')}
                                Correo
                            </button>
                            <button onclick="copyQuoteLink('${folioJs}')" title="Copiar enlace directo a esta cotización" class="v-row-action v-act-slate">
                                ${Icons.svg('link')}
                                Enlace
                            </button>
                            ${quote.formato === 'ccl_liverpool' ? `
                            <button onclick="openQuoteInSheets.call(this, '${folioJs}')" title="Abrir el formato CCL en Google Sheets" class="v-row-action v-act-green">
                                ${Icons.svg('document')}
                                Sheets
                            </button>` : ''}
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            AppMotion.staggerRows(tableBody.querySelectorAll('tr'));
        };

        const updateTablePlaceholder = (message) => {
            tablePlaceholder.innerHTML = message;
            const showPlaceholder = message !== "";
            tablePlaceholder.classList.toggle('hidden', !showPlaceholder);
            quoteTable.classList.toggle('hidden', showPlaceholder);
        };

        newQuoteButton.addEventListener('click', () => navigateToPage('cotizacion', {}, newQuoteButton));
        sendEmailButton.addEventListener('click', () => navigateToPage('correoventel', {}, sendEmailButton));

        // Enter = búsqueda global. Cada búsqueda vive en el panel que corresponde al rol:
        // un usuario avanzado es llevado al panel de supervisión con su búsqueda aplicada
        // (ahí tiene filtros, fechas y CSV); el usuario normal busca aquí mismo.
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const term = searchInput.value.trim();
            if (!term) return;
            clearTimeout(relojFuera);
            if (AppSession.can('supervision')) { AppUrl.go('inicio_avanzado', { q: term }); return; }
            // Quien se queda aquí deja su búsqueda en la barra igual que quien se va: la
            // rama de arriba se lleva el término en el enlace y esta, sin esto, cambiaba
            // la tabla sin cambiar la dirección —copiar la URL de una búsqueda con Enter
            // daba el panel vacío, y F5 la perdía—.
            AppUrl.reflejar({ q: term });
            loadUserQuotes(term);
        });

        /* Teclear = filtro instantáneo local sobre tus cotizaciones (sin esperar al servidor)
           Y, si ahí no hay nada, la misma búsqueda sale sola a las de todo el equipo.
           Antes había que adivinar que existía esa segunda búsqueda y pulsar Enter: quien
           no lo sabía leía "no se encontraron cotizaciones" y daba por perdido un folio que
           sí estaba en el sistema, solo que lo había hecho alguien más.

           Se espera un poco y se exigen tres caracteres para no mandar a la hoja de cálculo
           una consulta por cada tecla. */
        const BUSCAR_FUERA_MS = 420;

        /**
         * Aplica un término a la pantalla. Es la PUERTA ÚNICA: por aquí pasan el teclado y
         * el botón atrás, para que volver atrás repinte exactamente igual que teclear.
         *
         * @param {string} term
         * @param {boolean=} sinUrl true cuando el término LO TRAE la propia URL (atrás /
         *   adelante). Reescribirla ahí sería contestarle al navegador lo que él acaba de
         *   decir, y el botón atrás se quedaría girando sobre la misma búsqueda.
         */
        const aplicarBusqueda = (term, sinUrl) => {
            clearTimeout(relojFuera);

            /* La búsqueda pasa a la barra de direcciones: sin esto la pantalla leía ?q al
               entrar pero no lo escribía nunca, así que una búsqueda hecha aquí no se podía
               pegar en un chat ni sobrevivía a un F5. Va por `reflejar` SIN apilar —que ya
               junta las pulsaciones y reemplaza a los 300 ms—: no se cuelga del antirrebote
               de abajo, que decide otra cosa (cuándo salir a la red). Término vacío QUITA
               ?q; si se quedara, recargar resucitaría la búsqueda recién borrada. */
            if (!sinUrl) AppUrl.reflejar({ q: term });

            if (term === '') {
                buscandoFuera = false;
                /* Quedarse sin búsqueda es volver a TU lista, y quien entró por un enlace
                   con ?q nunca llegó a pedirla —`loadUserQuotes` con término no toca
                   `myQuotes`—: sin esta rama, vaciar el campo (o volver atrás a una URL sin
                   ?q) le dejaba "Aún no tienes cotizaciones" a quien sí las tiene. */
                if (!listaPropiaPedida) { loadUserQuotes(); return; }
                displayQuotes(myQuotes);
                updateStats(myQuotes);
                setSyncStatus('');
                return;
            }

            /* Se sabe de antemano si la búsqueda va a poder salir al equipo, y por eso se
               decide ANTES de pintar: el aviso de "sin coincidencias" tiene que decir lo
               que está a punto de pasar, no pedir que se pulse Enter mientras la búsqueda
               ya va en camino. */
            buscandoFuera = term.length >= 3;
            const encontradas = filterLocal(term);
            if (encontradas > 0) {
                buscandoFuera = false;
                setSyncStatus(`${encontradas} de tus cotizaciones`);
                return;
            }
            if (!buscandoFuera) { setSyncStatus(''); return; }

            setSyncStatus('Buscando en las cotizaciones del equipo…');
            relojFuera = setTimeout(() => {
                if (searchInput.value.trim() !== term) return;
                loadUserQuotes(term);
            }, BUSCAR_FUERA_MS);
        };

        searchInput.addEventListener('input', () => aplicarBusqueda(searchInput.value.trim()));

        refreshButton.addEventListener('click', () => {
            AppCache.remove(QUOTES_CACHE_KEY);
            // Este botón vacía el campo, así que también tiene que vaciar la barra: con ?q
            // puesto, recargar devolvía la búsqueda que Actualizar acababa de quitar.
            searchInput.value = '';
            AppUrl.reflejar({ q: '' });
            clearTimeout(relojFuera);
            buscandoFuera = false;
            loadUserQuotes(null, true);   // sin caché local NI de servidor
        });

        // Deep-link de búsqueda: ?page=dashboard&q=término llega con la búsqueda aplicada
        // (enlaces compartibles a resultados concretos).
        const urlQuery = AppUrl.param('q');
        if (urlQuery) {
            searchInput.value = urlQuery;
            loadUserQuotes(urlQuery);
        } else {
            loadUserQuotes();
        }

        /* Atrás y adelante del navegador. Manda la barra: con ?q se repuebla el campo y se
           aplica; SIN ?q se vacía el campo y vuelve la lista propia. La ausencia del
           parámetro también es un estado, no un "déjalo como está": tratarla de otro modo
           dejaba la tabla filtrada y el campo escrito en una dirección que ya no decía nada
           de eso, y el siguiente F5 deshacía el filtro solo.

           Se aplica con `sinUrl` para no reescribir lo que el navegador acaba de poner.
           El corte de abajo evita el viaje de más: si cambió otro parámetro pero `q` es el
           mismo, la pantalla ya muestra lo que la URL pide y volver a buscar en las
           cotizaciones del equipo sería una llamada para repintar lo idéntico. */
        AppUrl.alCambiarUrl((loc) => {
            const p = (loc && loc.parameter) || {};
            const term = String(p.q || '').trim();
            if (searchInput.value.trim() === term) return;
            searchInput.value = term;
            aplicarBusqueda(term, true);
        });
    });
    </script>
</body>
</html>
