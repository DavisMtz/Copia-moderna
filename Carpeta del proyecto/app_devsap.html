<style>
/* ════════════════════════════════════════════════════════════
   DEVOLUCIONES SAP · CONSOLA (26/09/2026)
   El asesor llega con lo que le pasó al cliente y el monto, y lo primero que busca es qué
   procede (respuestas del creador). A la izquierda, los casos agrupados por lo que le pasó, cada
   uno con su respuesta debajo del nombre; a la derecha, la ficha con el nombre en el cartel de
   Herramientas (.cs-cartel) y, en orden: qué procede, la leyenda para SAP (se copia con un clic),
   los criterios que le tocan y «revisa también». La autorización va UNA vez, arriba.
   El contenido está escrito aquí (no hay hoja). Es el de la sección de antes, pasado a datos:
   las dos matrices de ✓ y ✕ caben en caso × monto → acción, porque cada fila tenía un solo ✓ y la
   columna «Recogido» sola no la usaba ninguna. Respaldo: etiqueta git «respaldo-devsap-antes-consola».
════════════════════════════════════════════════════════════ */
#dv-app{--dv-top:72px;--dv-linea:color-mix(in srgb,var(--ink) 18%,var(--line));--dv-ink-brand:var(--brand-deep);--dv-alert:var(--alert);container:dv/inline-size}
[data-theme="carbon"] #dv-app{--dv-ink-brand:#F46BC6;--dv-alert:#FB7185}
#dv-app ::selection{background:var(--brand-soft);color:var(--ink)}
#dv-app .ic{width:18px;height:18px;flex-shrink:0}
:where(#dv-app) :where(b,strong){font-weight:700;color:var(--ink)}
.dv-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* — Autorización: la compuerta de todo, una sola vez — */
.dv-aut{display:flex;align-items:center;gap:.85rem;margin-bottom:1rem;padding:.7rem .8rem .7rem .75rem;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.dv-aut-ic{display:grid;place-items:center;width:38px;height:38px;flex-shrink:0;border-radius:12px;background:var(--alert-bg);color:var(--dv-alert)}
#dv-app .dv-aut-ic .ic{width:20px;height:20px}
.dv-aut-tx{flex:1;min-width:0;margin:0;font-size:.9rem;line-height:1.45;color:var(--ink);text-wrap:pretty}
.dv-aut-correo{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.dv-aut-correo > span{display:grid;line-height:1.25}
.dv-aut-correo small{font-size:.74rem;font-weight:700;color:var(--ink-soft)}
.dv-aut-correo code{font-family:var(--f-mono);font-size:.82rem;font-weight:600;color:var(--ink)}

/* — Copiar — */
.dv-copiar{display:inline-flex;align-items:center;gap:.35rem;height:36px;padding:0 .8rem;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:650;font-size:.82rem;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s}
#dv-app .dv-copiar .ic{width:14px;height:14px}
.dv-copiar:hover{border-color:var(--brand);color:var(--dv-ink-brand)}
/* Una leyenda es lo que se escribe en SAP: va en mono, tal cual, y el chip entero la copia */
.dv-chips{display:flex;flex-wrap:wrap;gap:.45rem}
.dv-chip{display:inline-flex;align-items:center;gap:.6rem;min-height:42px;padding:.3rem .4rem .3rem .8rem;border-radius:12px;border:1px solid var(--dv-linea);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s}
.dv-chip code{font-family:var(--f-mono);font-size:.9rem;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.dv-chip > span{display:inline-flex;align-items:center;gap:.3rem;flex-shrink:0;height:30px;padding:0 .6rem;border-radius:8px;background:var(--surface-2);font-size:.76rem;font-weight:700;color:var(--ink-soft);transition:color .15s,background-color .15s}
#dv-app .dv-chip > span .ic{width:13px;height:13px}
.dv-chip:hover{border-color:var(--brand)}
.dv-chip:hover > span{background:var(--brand-tint);color:var(--dv-ink-brand)}
.dv-chip.es-listo > span{background:var(--ok-bg);color:var(--ok)}

/* — Consola: lista y ficha — */
.dv-cuerpo{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.25fr);gap:1.4rem;align-items:start}
.dv-lista{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:.4rem}
/* Si no cabe en una línea (lista angosta o texto grande), los botones bajan enteros: la etiqueta no se parte */
.dv-monto{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .6rem;padding:.3rem .3rem .3rem .85rem;margin-bottom:.15rem;border-radius:16px;background:var(--surface-2)}
.dv-monto > span{flex:1 0 auto;font-size:.82rem;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.dv-monto-g{display:flex;gap:.25rem;margin-left:auto}
.dv-monto button{height:38px;padding:0 .8rem;border:0;border-radius:12px;background:none;color:var(--ink-soft);font:inherit;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s}
.dv-monto button:hover{background:var(--surface);color:var(--ink)}
.dv-monto button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.dv-opcs{display:grid;gap:.1rem}
.dv-grupo{display:grid;gap:.1rem}
.dv-g{display:flex;align-items:center;gap:.45rem;margin:0;padding:.8rem .65rem .3rem;font-size:.8rem;font-weight:750;color:var(--ink-soft)}
#dv-app .dv-g .ic{width:15px;height:15px}
.dv-opc{display:grid;gap:.18rem;padding:.55rem .7rem .6rem .75rem;border-radius:14px;cursor:pointer;outline:none;transition:background-color .15s}
.dv-opc:hover{background:var(--surface-2)}
.dv-opc[aria-selected="true"]{background:var(--brand-tint)}
.dv-opc:focus-visible{box-shadow:inset 0 0 0 2px var(--brand)}
.dv-nom{font-weight:700;font-size:.96rem;line-height:1.25;color:var(--ink)}
.dv-opc[aria-selected="true"] .dv-nom{color:var(--dv-ink-brand)}
.dv-res{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .4rem;font-size:.82rem;font-weight:650;line-height:1.3;color:var(--ink-soft)}
.dv-res i{font-style:normal;color:var(--ink)}
.dv-res code{font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--ink)}
.dv-res.es-doble{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1rem .55rem;align-items:baseline}
.dv-res.es-doble small{font-size:.76rem;font-weight:650;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.dv-res em{font-style:normal;display:inline-flex;align-items:center;height:19px;padding:0 .4rem;border-radius:6px;background:var(--surface-2);font-size:.7rem;font-weight:750;color:var(--ink-soft)}
.dv-opc[aria-selected="true"] .dv-res.es-doble{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1rem .55rem;align-items:baseline}
.dv-res.es-doble small{font-size:.76rem;font-weight:650;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.dv-res em{background:var(--surface)}
.dv-sep{height:1px;margin:.45rem .65rem;background:var(--line)}
.dv-ficha{position:sticky;top:calc(var(--dv-top) + 16px);min-width:0;max-height:calc(100vh - var(--dv-top) - 104px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.dv-ficha .cs-cartel{min-height:148px}
.dv-ficha .cs-cartel-t{margin:0}
.dv-ficha-cuerpo{padding:1.25rem 1.45rem 1.4rem;overflow:auto;display:grid;gap:1.15rem;align-content:start;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--dv-linea) transparent}

/* — Ficha: qué procede, leyenda, criterios, revisa también — */
.dv-bloque{display:grid;gap:.6rem}
.dv-bloque + .dv-bloque{padding-top:1.05rem;border-top:1px solid var(--line-soft)}
.dv-bloque h3{display:flex;align-items:center;gap:.45rem;margin:0;font-size:.96rem;font-weight:750;color:var(--ink)}
#dv-app .dv-bloque h3 .ic{width:16px;height:16px;color:var(--dv-ink-brand)}
.dv-bloque h4{margin:.2rem 0 0;font-size:.8rem;font-weight:750;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dv-resp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.dv-resp.es-una{grid-template-columns:minmax(0,1fr)}
.dv-r{display:grid;gap:.35rem;align-content:start;padding:.95rem 1.05rem 1.05rem;border-radius:18px;background:var(--surface-2);border:1px solid transparent;transition:background-color .2s,border-color .2s}
.dv-r > small{font-size:.8rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dv-r-acc{display:flex;align-items:center;gap:.55rem;margin:0}
#dv-app .dv-r-acc .ic{width:26px;height:26px;color:var(--ink-soft)}
.dv-r-acc b{font-family:var(--f-display);font-weight:800;font-stretch:84%;font-size:clamp(1.45rem,1.1rem + 1vw,1.95rem);line-height:1.05;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
.dv-r-nota{margin:0;font-size:.84rem;line-height:1.45;color:var(--ink-soft);text-wrap:pretty}
.dv-r.es-elegido{background:var(--brand-tint);border-color:var(--brand-soft)}
#dv-app .dv-r.es-elegido .dv-r-acc .ic{color:var(--dv-ink-brand)}
.dv-r.es-otro{background:transparent;border-color:var(--line)}
.dv-r.es-otro .dv-r-acc b{font-size:1.15rem;color:var(--ink-soft)}
#dv-app .dv-r.es-otro .dv-r-acc .ic{width:20px;height:20px}
.dv-ley{display:grid;gap:.5rem}
.dv-ley + .dv-ley{padding-top:.7rem}
.dv-cuando{margin:0;font-size:.92rem;line-height:1.55;max-width:70ch;color:var(--ink);text-wrap:pretty}
.dv-sin{margin:0;font-size:.92rem;line-height:1.55;color:var(--ink-soft)}
.dv-meta{display:flex;flex-wrap:wrap;gap:.35rem}
.dv-meta span{display:inline-flex;align-items:center;min-height:26px;padding:.1rem .6rem;border-radius:8px;background:var(--surface-2);font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.dv-crit{list-style:none;margin:0;padding:0;display:grid;gap:.45rem;font-size:.92rem;line-height:1.5;max-width:74ch}
.dv-crit li{position:relative;padding-left:1.1rem;text-wrap:pretty}
.dv-crit li::before{content:"";position:absolute;left:.15rem;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--dv-linea)}
.dv-ver{display:flex;flex-wrap:wrap;gap:.4rem}
.dv-ir{display:inline-flex;align-items:center;gap:.45rem;min-height:38px;padding:.3rem .75rem;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;font-weight:650;text-align:left;cursor:pointer;transition:border-color .15s,background-color .15s}
.dv-ir small{font-weight:600;font-size:.82rem;color:var(--ink-soft)}
#dv-app .dv-ir .ic{width:14px;height:14px;color:var(--ink-soft)}
.dv-ir:hover{border-color:var(--dv-linea);background:var(--surface-2)}
.dv-gl{display:grid;gap:.6rem}
.dv-gl + .dv-gl{padding-top:1.1rem;border-top:1px solid var(--line-soft)}
.dv-gl h3{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:84%;font-size:1.15rem;line-height:1.2}
.dv-gl .dv-ver{margin-top:.1rem}
.dv-gl-va{font-size:.8rem;font-weight:750;color:var(--ink-soft)}

/* — Foco — */
#dv-app button:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
#dv-app .dv-ficha-cuerpo:focus-visible{outline:2.5px solid var(--brand);outline-offset:-3px}

/* — Densidad compacta y alto contraste (Ajustes de vista) — */
html[data-density="compact"] .dv-opc{padding-top:.38rem;padding-bottom:.4rem}
html[data-density="compact"] .dv-g{padding-top:.55rem}
html[data-density="compact"] .dv-ficha .cs-cartel{min-height:116px}
html[data-density="compact"] .dv-ficha-cuerpo{gap:.85rem;padding:1rem 1.2rem 1.1rem}
html[data-density="compact"] .dv-r{padding:.75rem .9rem .85rem}
html[data-contrast="high"] .dv-lista,html[data-contrast="high"] .dv-ficha,html[data-contrast="high"] .dv-aut{border-width:2px}
html[data-contrast="high"] .dv-r.es-otro,html[data-contrast="high"] .dv-chip{border-color:var(--ink-soft)}

/* Según el ancho de la sección, en em: escala con los cuatro tamaños de texto. Debajo, la lista va
   arriba y la ficha abajo, sin quedarse fija; tocar un caso baja hasta su ficha. */
@container dv (max-width:54em){
  .dv-cuerpo{grid-template-columns:minmax(0,1fr)}
  .dv-ficha{position:static;max-height:none;scroll-margin-top:96px}
  .dv-ficha-cuerpo{overflow:visible}
}
@container dv (max-width:40em){
  .dv-aut{flex-wrap:wrap;align-items:flex-start}
  .dv-aut-correo{width:100%;justify-content:space-between;padding-left:calc(38px + .85rem)}
  .dv-resp{grid-template-columns:minmax(0,1fr)}
}
@container dv (max-width:30em){
  .dv-aut-correo{padding-left:0}
  .dv-monto{flex-wrap:wrap;padding-left:.3rem}
  .dv-monto > span{flex:1 1 100%;padding:.3rem .55rem 0}
  .dv-monto-g{flex:1 1 100%}
  .dv-monto button{flex:1}
  .dv-ficha-cuerpo{padding:1rem 1.05rem 1.2rem}
  .dv-ficha .cs-cartel{min-height:116px}
  .dv-ficha .cs-cartel.tam-s .cs-cartel-t{font-size:2.7rem}
  .dv-ficha .cs-cartel.tam-m .cs-cartel-t{font-size:2.1rem}
  .dv-ficha .cs-cartel.tam-l .cs-cartel-t{font-size:1.75rem}
  .dv-ficha .cs-cartel-s{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){ #dv-app .dv-opc,#dv-app .dv-r,#dv-app .dv-chip,#dv-app .dv-chip > span,#dv-app .dv-ir,#dv-app .dv-copiar,#dv-app .dv-monto button{transition:none} }
@media print{ .dv-monto{display:none} .dv-ficha{position:static;max-height:none} .dv-ficha-cuerpo{overflow:visible} }
</style>
<script>
/* Devoluciones SAP · la consola de #sec-devsap (el hueco vive en Index.html: <div id="dv-app">).
   Lo que el guion grande llama:
     · dvAlEntrar()  — switchSec al abrir la sección: la pinta la primera vez.
     · dvRevelar(el) — revealTarget, con el buscador o un ?item=: elige el caso, pone el monto o
                       enseña la leyenda; devuelve true si lo atendió.
   Los id ds-* (app_indices.html, DEVSAP) son un contrato: el buscador y los enlaces llegan por ellos.
   Están en la lista, que siempre está pintada, y no en la ficha, que cambia. */
(function(){
  'use strict';

  /* ── El contenido (el de la sección de antes, pasado a datos) ── */
  var AUT = { nombre: 'Ventas CCL', dir: 'ventas-ccl@liverpool.com.mx', correo: 'Ventas CCL <ventas-ccl@liverpool.com.mx>' };
  /* «Hasta $3,000» incluye los $3,000: la matriz menor decía «de hasta $3,000 pesos» y la mayor «de más de $3,000 pesos». */
  var MONTOS = [
    { id: 'hasta', nombre: 'Hasta $3,000', ancla: 'ds-menor' },
    { id: 'mas', nombre: 'Más de $3,000', ancla: 'ds-mayor' }
  ];
  var ACC = {
    devolucion: { nombre: 'Devolución', ic: 'regreso' },
    recogido_dev: { nombre: 'Recogido y devolución', ic: 'camion' },
    canalizar: { nombre: 'Canalizar a tienda', ic: 'tienda' }
  };
  /* La leyenda de Servicio SL se escribe con espacio, como en la hoja de Homologación (el creador,
     26/09/2026). Antes el Portal la copiaba junta, sin el espacio. */
  var LEYENDAS = [
    { id: 'servicio-sl', ancla: 'ds-servicio-sl', escenario: 'Servicio SL',
      textos: ['Servicio SL/dañada', 'Servicio SL/incompleta', 'Servicio SL/equivocada'],
      cuando: 'Aplica para mercancía que llegó dañada, incompleta o equivocada. Se coloca la leyenda de acuerdo al caso.',
      nota: 'No es necesario correo soporte.', ambito: 'Mercaderías y MKP Soft Line' },
    { id: 'enr', ancla: 'ds-enr', escenario: 'ENR', textos: ['Reconocida'],
      cuando: 'Aplica cuando el cliente indica no reconocer la entrega y no se cuenta con evidencia en las diversas plataformas.',
      ambito: 'Mercaderías y MKP Soft Line' },
    { id: 'satisfaccion-sl', ancla: 'ds-satisfaccion-sl', escenario: 'Satisfacción SL', textos: ['Satisfacción SL'],
      cuando: 'Aplica cuando el cliente no cuenta con una tienda Liverpool cerca, el producto es menor a $3,000 y solicita la devolución.',
      ambito: 'Mercaderías y MKP Soft Line' },
    { id: 'correo-soporte', ancla: 'ds-correo-soporte', escenario: 'Correo soporte', textos: ['Correo soporte'],
      cuando: 'Aplica cuando se tiene autorización por recogido vencido, descargas digitales, bonificaciones, cuando el semáforo de PAO no permite cambio de estatus o cuando se tiene autorización en cadena de correos.',
      lista: ['Hay autorización por recogido vencido', 'Hay autorización por descargas digitales', 'Hay autorización por bonificaciones', 'El semáforo de PAO no permite el cambio de estatus', 'Hay autorización en cadena de correos'],
      ambito: 'Mercaderías SL, MKP y BT, sólo en órdenes de venta' }
  ];
  var CRITERIOS = [
    { id: 'definicion', html: '<b>Servicio SL</b> = mercancía <b>dañada, equivocada o incompleta</b>. <b>Satisfacción SL</b> = el cliente <b>no cumple expectativas</b>.' },
    { id: 'fragil', html: '<b>No aplica recogido</b> en mercancía frágil: <b>cristalería, vinos, perfumería, vajillas</b>, etc. — en estos casos se aplica <b>devolución</b>.' },
    { id: 'grandes', html: '<b>Productos grandes</b> (hornos, pantallas 40", escritorios, aparatos de ejercicio): se genera <b>recogido y, posteriormente, la devolución</b>.' },
    { id: 'sin-tienda', monto: 'hasta', html: '<b>Satisfacción SL menor a $3,000</b>: por regla se <b>canaliza a tienda</b>; como excepción, si el cliente <b>no cuenta con un Liverpool cerca</b>, se aplica devolución con la leyenda «Satisfacción SL» en SAP.' },
    { id: 'servicio-mas', monto: 'mas', html: 'En <b>Servicio SL mayor a $3,000</b> el recogido se genera y la devolución se aplica <b>cuando éste se realice</b>.' }
  ];
  /* Así llega el asesor: por lo que le pasó al cliente (el creador, 26/09/2026). */
  var GRUPOS = [
    { id: 'mal', nombre: 'Le llegó mal', ic: 'roto' },
    { id: 'gusto', nombre: 'No le gustó', ic: 'cara' },
    { id: 'grande', nombre: 'Es un producto grande', ic: 'caja' },
    { id: 'enr', nombre: 'No reconoce la entrega', ic: 'alto' },
    { id: 'otros', nombre: 'Otros casos', ic: 'correo' }
  ];
  /* Los siete escenarios de las matrices y los dos casos del glosario que no estaban en ellas.
     `acc`: la acción por monto, de la matriz. `ley`: la leyenda para SAP; donde la tabla no la
     nombraba, va «por lo que le pasó» (regla del creador, 26/09/2026): llegó dañada, incompleta o
     equivocada → Servicio SL/…; no le gustó → Satisfacción SL. `por` la explica y `si` la condiciona.
     Solo se enseña en los montos cuya acción no es canalizar a tienda. `ver`: navegación, no prioridad. */
  var CASOS = [
    { id: 'servicio', ancla: 'ds-esc-servicio', grupo: 'mal', nombre: 'Servicio SL', sub: 'Llegó dañada, incompleta o equivocada',
      acc: { hasta: 'devolucion', mas: 'recogido_dev' }, ley: [{ id: 'servicio-sl' }], crit: ['definicion', 'servicio-mas'],
      ver: [{ id: 'fragil', q: '¿Es frágil y llegó rota?' }, { id: 'grandes', q: '¿Es un producto grande?' }, { id: 'cc-servicio', q: '¿Es pedido C&C?' }] },
    { id: 'fragil', ancla: 'ds-esc-fragil', grupo: 'mal', nombre: 'Mercancía frágil rota', sub: 'Cristalería, vinos, perfumería, vajillas…',
      acc: { hasta: 'devolucion', mas: 'devolucion' }, ley: [{ id: 'servicio-sl', textos: ['Servicio SL/dañada'], por: 'Llegó rota: es mercancía dañada.' }],
      crit: ['fragil'], ver: [{ id: 'servicio', q: 'El caso general' }] },
    { id: 'cc-servicio', ancla: 'ds-esc-cc-servicio', grupo: 'mal', nombre: 'C&C Servicio SL', sub: 'Pedido C&C que llegó dañado, incompleto o equivocado',
      acc: { hasta: 'devolucion', mas: 'canalizar' }, ley: [{ id: 'servicio-sl', por: 'Por lo que le pasó: llegó dañada, incompleta o equivocada.' }],
      crit: ['definicion'], ver: [{ id: 'servicio', q: 'El caso general' }] },
    { id: 'satisfaccion', ancla: 'ds-esc-satisfaccion', grupo: 'gusto', nombre: 'Satisfacción SL', sub: 'No cumple sus expectativas',
      acc: { hasta: 'canalizar', mas: 'canalizar' }, ley: [], crit: ['definicion', 'sin-tienda'],
      ver: [{ id: 'sin-tienda', q: '¿No tiene un Liverpool cerca?' }, { id: 'cc-satisfaccion', q: '¿Es pedido C&C?' }, { id: 'grandes', q: '¿Es un producto grande?' }] },
    { id: 'sin-tienda', ancla: 'ds-esc-sin-tienda', grupo: 'gusto', nombre: 'Sin tienda Liverpool cercana', sub: 'No le gustó y no tiene un Liverpool cerca',

  function apilada(){ return ficha.getBoundingClientRect().top > lista.getBoundingClientRect().bottom - 4; }

  function copiar(b){

  function irATraz(secId){

    if (b.hasAttribute('data-dv-copiar')) { copiar(b); return; }
    if (b.hasAttribute('data-dv-monto')) { ponerMonto(b.getAttribute('data-dv-monto')); return; }
    if (b.hasAttribute('data-dv-traz')) { irATraz(b.getAttribute('data-dv-traz')); return; }
    if (b.hasAttribute('data-dv-ir')) {
      elegir(b.getAttribute('data-dv-ir'), { foco: true });
      if (apilada()) bajarAFicha(); else { var o = lista.querySelector('[aria-selected="true"]'); if (o && o.getBoundingClientRect().top < 80) subirA(o); }
      return;
    }
    elegir(b.getAttribute('data-dv'));
    bajarAFicha();
  }
  function alTecla(e){
    var o = e.target.closest && e.target.closest('.dv-opc');
    if (!o) return;
    var l = [].slice.call(lista.querySelectorAll('.dv-opc')), i = l.indexOf(o), j = i;
    if (e.key === 'ArrowDown') j = Math.min(l.length - 1, i + 1);
    else if (e.key === 'ArrowUp') j = Math.max(0, i - 1);
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = l.length - 1;
    else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (o.getAttribute('data-dv') !== st.sel) elegir(o.getAttribute('data-dv'));
      var ch = ficha.querySelector('.dv-chip, .dv-ir') || ficha.querySelector('.dv-ficha-cuerpo');
      bajarAFicha();
      if (ch) ch.focus({ preventScroll: !apilada() });
      return;
    } else return;
    e.preventDefault();
    if (j !== i) elegir(l[j].getAttribute('data-dv'), { foco: true });
  }
  function montar(){
    if (app) return true;
    var host = document.getElementById('dv-app');
    if (!host) return false;
    app = host;
    app.innerHTML = autHTML() + '<div class="dv-cuerpo"><div class="dv-lista">' + montoHTML() + listaHTML() + '</div>' +
      '<section class="dv-ficha" aria-labelledby="dvTitulo"></section></div>';
    lista = app.querySelector('.dv-lista');
    ficha = app.querySelector('.dv-ficha');
    app.addEventListener('click', alClic);
    lista.addEventListener('keydown', alTecla);
    elegir(st.sel, { quieto: true });
    return true;
  }

  window.dvAlEntrar = function(){ montar(); };
  window.dvRevelar = function(el){
    if (!montar() || !el || !el.closest || !app.contains(el)) return false;
    var fin = function(foco, brillo){
      if (typeof clearPendingOpen === 'function') clearPendingOpen();
      if (typeof hideKbHint === 'function') hideKbHint();
      if (brillo && typeof flashEl === 'function') flashEl(brillo);
      if (foco) foco.focus({ preventScroll: true });
    };
    var mb = el.closest('[data-dv-monto]');
    if (mb) { ponerMonto(mb.getAttribute('data-dv-monto'), true); subirA(lista); fin(lista.querySelector('[data-dv-monto="' + st.monto + '"]'), lista); return true; }
    var aut = el.closest('.dv-aut');
    if (aut) { subirA(aut); fin(aut.querySelector('button'), aut); return true; }
    var o = el.closest('.dv-opc');
    if (!o) return false;
    elegir(o.getAttribute('data-dv'));
    o = lista.querySelector('[aria-selected="true"]');
    var ley = el.getAttribute('data-dv-ley'), destino = ley ? ficha.querySelector('[data-dv-bloque="' + ley + '"]') : null;
    if (apilada()) subirA(destino || ficha);
    else {
      subirA(app);
      var cuerpo = ficha.querySelector('.dv-ficha-cuerpo');
      if (destino && cuerpo) cuerpo.scrollTop = Math.max(0, destino.offsetTop - cuerpo.offsetTop - 12);
    }
    /* Si la opción quedó fuera de la vista (las de abajo de la lista), el foco va a la ficha: quien devuelva el foco
       después (el recorrido de bienvenida lo hace sin preventScroll) no baja la página y la autorización sigue arriba. */
    var r = o.getBoundingClientRect(), aLaVista = r.top >= 0 && r.bottom <= window.innerHeight;
    fin(aLaVista ? o : (ficha.querySelector('.dv-ficha-cuerpo') || o), destino || o);
    return true;
  };
})();
</script>
