       hace, porque cuanto menos texto se ve de golpe más se agradece saber por dónde vas. */
    var indice = construirIndice(cuerpo, cabeElIndice());
    var col = el('div', 'art-lee-col');
    col.appendChild(acciones);
    col.appendChild(doc);

    if (indice && cabeElIndice()) {
      doc.appendChild(cuerpo);
      var conIndice = el('div', 'art-lectura');
      conIndice.appendChild(col);
      conIndice.appendChild(indice);
      vista.appendChild(conIndice);
    } else {
      if (indice) doc.appendChild(indice);   // plegado, entre la cabecera y el cuerpo
      doc.appendChild(cuerpo);
      vista.appendChild(col);
    }

    iconos();
    entrada(acciones, { y: 8, duration: .3 });
    if (indice) entrada(indice, { y: 10, delay: .12 });
    montarZoomImagenes(cuerpo);
    montarEscena(cuerpo, barraProg);
    if (window.AppUrl && AppUrl.irAncla) AppUrl.irAncla();
  }

  /** ¿Cabe el índice AL LADO? Se mide la columna de contenido, no la ventana, y se
      multiplica por el rem real para que el umbral siga a data-textscale (en una media
      query, `rem` es el tamaño inicial del navegador y no el de <html>). */
  function cabeElIndice(){
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    return vista.clientWidth >= 57 * rem;   // medida 40 + canal 2 + índice 13.5, con holgura
  }

  /** El título de la pestaña sigue a lo que se está mirando. */
  function tituloDePagina(titulo){
    document.title = (titulo ? titulo + ' · ' : '') + 'Artículos · Ventel';
  }

  /**
   * Tabla de contenidos a partir de los subtítulos ya pintados.
   * @param {boolean} alLado  si va en la columna de al lado (nav) o plegado (details).
   *
   * Cuando NO cabe al lado se pliega en un <details>, que cerrado cuesta un renglón y
   * lo abre y lo cierra el navegador sin una línea de JS ni una escucha de teclado que
   * mantener. Antes simplemente desaparecía.
   */
  function construirIndice(cuerpo, alLado){
    var titulos = cuerpo.querySelectorAll('.art-h2, .art-h3');
    if (titulos.length < 2) return null;

    var lista = el('ul', 'art-indice-lista');
    Array.prototype.forEach.call(titulos, function (t, i){
      var id = 'art-sec-' + i;
      t.id = id;
      var li = document.createElement('li');
      var a = el('a', t.className === 'art-h3' ? 'es-hijo' : null, t.textContent);
      a.href = '#' + id;
      a.dataset.destino = id;
      a.addEventListener('click', function (e){
        e.preventDefault();
        t.scrollIntoView({ behavior: mueve() ? 'smooth' : 'auto', block: 'start' });
        /* Y el foco viaja con el salto: sin esto el siguiente Tab seguía en el índice y
           no en la sección a la que se acaba de llegar. */
        t.setAttribute('tabindex', '-1');
        t.focus({ preventScroll: true });
      });
      li.appendChild(a);
      lista.appendChild(li);
    });

    if (alLado) {
      var nav = el('nav', 'art-indice');
      nav.setAttribute('aria-label', 'Contenido del artículo');
      nav.appendChild(el('p', 'art-panel-t', 'En este artículo'));
      nav.appendChild(lista);
      return nav;
    }

    var det = el('details', 'art-indice');
    var sum = el('summary', 'art-panel-t',
      'En este artículo · ' + titulos.length + ' apartados');
    det.appendChild(sum);
    var navP = el('nav', null);
    navP.setAttribute('aria-label', 'Contenido del artículo');
    navP.appendChild(lista);
    det.appendChild(navP);
    return det;
  }

  /** ¿Se puede animar? Mismo guardián que app_motion: sin GSAP o con movimiento
      reducido, el resultado final se enseña de inmediato y no se anima nada. */
  function mueve(){
    var reducido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    return typeof window.gsap !== 'undefined' && !reducido;
  }

  /* Entrada de una vista. Siempre `from`: se parte de VISIBLE y se anima hacia el
     sitio, así que si el CDN no llega no se ejecuta y no pasa nada — nunca al revés.

     Y nunca se anima un contenedor que tenga dentro algo `position:sticky`: un
     `transform` en un ancestro crea un contexto de apilamiento y el sticky deja de
     pegarse mientras dura la animación. Por eso se animan los hijos concretos y no
     `#vista` entera, que es donde vive la barra de trabajo del editor.

     El escalonado va por `amount` con techo, no por escalón fijo: una lista de tres
     artículos y una de treinta tienen que terminar de entrar en el mismo rato. */
  function entrada(nodos, opts){
    if (!mueve() || !nodos) return;
    var lista = nodos.length !== undefined ? Array.prototype.slice.call(nodos) : [nodos];
    if (!lista.length) return;
    opts = opts || {};
    gsap.from(lista, {
      opacity: 0,
      y: opts.y === undefined ? 14 : opts.y,
      duration: opts.duration || .45,
      ease: 'power3.out',
      delay: opts.delay || 0,
      stagger: { amount: Math.min(.4, lista.length * .05) },
      overwrite: 'auto',
      clearProps: 'transform,opacity'
    });
  }

  /* Entrada del índice de artículos: la cabecera y las tarjetas en UNA línea de tiempo,
     con el solape escrito (-.18) en vez de un delay mágico, y el escalonado POR REJILLA.
     Con escalón lineal la misma pantalla se leía como un barrido horizontal cuando caben
     cuatro columnas y como uno vertical cuando caben dos: dos animaciones distintas
     según el monitor. Con `grid:'auto'` GSAP mide cuántas columnas hay AHORA y reparte
     la onda desde la esquina de arriba a la izquierda, que es por donde se empieza a
     leer. El tiempo TOTAL sigue mandando (`amount`): seis tarjetas o treinta, la entrada
     termina en el mismo rato. */
  function entradaDeLista(hd, tarjetas){
    if (!mueve()) return;
    var lista = Array.prototype.slice.call(tarjetas || []);
    gsap.timeline({ defaults: { ease: 'power3.out' } })
      .from(hd, { opacity: 0, y: 10, duration: .35, clearProps: 'transform,opacity' })
      .from(lista, {
        opacity: 0, y: 14, duration: .45,
        stagger: { amount: .26, grid: 'auto', from: 'start' },
        overwrite: 'auto', clearProps: 'transform,opacity'
      }, '-=.18');
  }

  /* UN SOLO CAMINO PARA CAMBIAR LO QUE HAY DENTRO DE #vista. Tres cosas que hay que
     hacer siempre, se anime o no:
       1 · matar la escena de la lectura anterior. Antes matarEscena() solo se llamaba al
           ENTRAR en un artículo, así que al volver a la lista o abrir el editor los
           ScrollTrigger seguían vivos midiendo nodos ya borrados y se acumulaban en cada
           ida y vuelta.
       2 · volver arriba. Se bajaba por la lista, se pulsaba la última tarjeta y el
           artículo se pintaba con la página a 800 px de scroll: se entraba al artículo
           por la mitad, y la barra de progreso nacía a mitad de recorrido.
       3 · repintar.
     El cross-fade es lo único opcional, y va SOLO en opacity: #vista contiene elementos
     `position:sticky` y un `transform` en un ancestro los desengancha mientras dura la
     animación; `opacity` crea contexto de apilamiento pero no bloque contenedor, así que
     el sticky sigue pegándose. Es la misma regla que explica entrada().
     El `finally` es la salvaguarda: si pintar() revienta, la vista vuelve a encenderse
     igual y nunca se queda apagada con contenido dentro. */
  function repintar(pintar){
    matarEscena();
    cerrarMenu();
    var saltar = function (){ window.scrollTo(0, 0); vaciar(vista); pintar(); };
    if (!mueve() || !vista.firstChild) { saltar(); return; }
    gsap.to(vista, {
      opacity: 0, duration: .14, ease: 'power1.in',
      onComplete: function (){
        try { saltar(); }
        finally {
          gsap.fromTo(vista, { opacity: 0 },
            { opacity: 1, duration: .2, ease: 'power1.out', clearProps: 'opacity' });
        }
      }
    });
  }

  var escena = null;
  var soltarEscena = null;
  function matarEscena(){
    /* revert() del contexto ya mata SUS disparadores y devuelve los estilos que tocó. El
       `ScrollTrigger.getAll().forEach(kill)` que venía después no tenía nada suyo que
       matar y sí podía llevarse por delante los de cualquier otro módulo del marco: una
       escoba global para limpiar la propia casa. */
    if (soltarEscena) { try { soltarEscena(); } catch (e) {} soltarEscena = null; }
    if (escena) { try { escena.revert(); } catch (e) {} escena = null; }
    // La barra de progreso ya no vive dentro de #vista, así que vaciar() no se la lleva.
    var p = document.querySelector('.topbar > .art-progreso');
    if (p && p.parentNode) p.parentNode.removeChild(p);
  }

  /* Las animaciones del visor, dentro de un `gsap.matchMedia` para poder matarlas de
     una vez y —a diferencia del contexto de antes— para que REEVALÚE la preferencia de
     movimiento si cambia a media lectura: con el guardián leído una sola vez, quien
     activaba «reducir movimiento» se quedaba con los bloques escondidos hasta recargar. */
  function montarEscena(cuerpo, barraProg){
    if (typeof window.gsap === 'undefined') { progresoSinGsap(barraProg); return; }

    escena = gsap.matchMedia();
    var ANIMA = '(prefers-reduced-motion: no-preference)';

    /* El progreso NO es movimiento: es un indicador de estado, y quien pide menos
       movimiento es justo quien más agradece saber cuánto le queda —dentro del iframe de
       Apps Script no hay barra de desplazamiento de la ventana que se lo diga—. Por eso
       va fuera del guardián y con su propio camino sin tweens. */
    escena.add('(prefers-reduced-motion: reduce)', function (){
      return progresoSinGsap(barraProg);
    });

    escena.add(ANIMA, function (){
      var sueltas = [];

      // Cabecera: entra una vez, corta.
      gsap.from('.art-doc-hd > *', {
        opacity: 0, y: 14, duration: .5, ease: 'power3.out',
        stagger: { amount: .18 }, clearProps: 'transform,opacity'
      });

      if (!window.ScrollTrigger) return;

      /* ¿QUIÉN SE DESPLAZA? Dentro del iframe de Apps Script, el documento del propio
         iframe: `.app` es min-height:100vh sin overflow y la barra lateral tiene su
         scroll aparte, así que el scroller por omisión de ScrollTrigger es el correcto y
         declarar `scroller` lo rompería. Lo que sí puede pasar —y por eso la
         comprobación— es que alguien arregle el desbordamiento de la barra lateral
         poniendo .app-main a height:100vh con overflow:auto: en ese momento la ventana
         deja de desplazarse, ningún disparador se cruza jamás y el artículo se queda EN
         BLANCO del primer pliegue para abajo, sin un error en consola que lo delate.
         Si el artículo cabe entero tampoco hay nada que revelar: mismo camino. */
      var raiz = document.scrollingElement || document.documentElement;
      if (raiz.scrollHeight <= raiz.clientHeight + 4) return;

      var bloques = Array.prototype.slice.call(cuerpo.children);
      var pliegue = window.innerHeight * .9;
      var abajo = bloques.filter(function (n){ return n.getBoundingClientRect().top > pliegue; });
      var arriba = bloques.filter(function (n){ return abajo.indexOf(n) === -1; });

      /* Lo que ya se ve entra con `from`: se parte de VISIBLE, que es la regla de la
         casa. Antes se apagaba el cuerpo ENTERO con un `set` y se volvía a encender lo
         visible con un segundo tween, así que el primer fotograma del artículo era un
         hueco y cualquier fallo entre las dos líneas dejaba el artículo en blanco. */
      gsap.from(arriba, { opacity: 0, y: 16, duration: .5, ease: 'power2.out',
        stagger: { amount: Math.min(.3, arriba.length * .05) }, clearProps: 'transform,opacity' });

      /* Lo de abajo del pliegue es lo ÚNICO que se esconde, y con red:
           · once:true → el disparador se retira solo tras revelar.
           · try/catch → si algo revienta, se limpia y el artículo se lee igual.
           · beforeprint → un bloque en opacity 0 sale EN BLANCO en el papel, y un
             procedimiento se imprime. */
      try {
        gsap.set(abajo, { opacity: 0, y: 16 });
        ScrollTrigger.batch(abajo, {
          start: 'top 90%', once: true,
          onEnter: function (lote){
            gsap.to(lote, { opacity: 1, y: 0, duration: .5, ease: 'power2.out',
              stagger: { amount: Math.min(.3, lote.length * .05) },
              overwrite: 'auto', clearProps: 'transform' });
          }
        });
      } catch (e) { gsap.set(abajo, { clearProps: 'all' }); }

      var alImprimir = function (){ gsap.set(abajo, { opacity: 1, y: 0, clearProps: 'transform' }); };
      window.addEventListener('beforeprint', alImprimir);
      sueltas.push(function (){ window.removeEventListener('beforeprint', alImprimir); });

      /* Las figuras van con loading="lazy" y sin alto declarado: hasta que bajan de
         Drive miden 0, así que toda medida tomada antes de que aterricen es falsa —los
         bloques se revelan donde no toca y el progreso llega al 100 % a media lectura—.
         El antirrebote va con el reloj de GSAP y no con setTimeout, así se muere con el
         contexto igual que todo lo demás. */
      var remedir = gsap.delayedCall(.2, function (){ ScrollTrigger.refresh(); }).pause();
      Array.prototype.forEach.call(cuerpo.querySelectorAll('img'), function (img){
        if (img.complete) return;
        var otra = function (){ remedir.restart(true); };
        img.addEventListener('load', otra);
        img.addEventListener('error', otra);
      });

      // Progreso: quickTo reutiliza UN tween en vez de crear uno por evento de scroll.
      var mueveBarra = gsap.quickTo(barraProg, 'scaleX', { duration: .2, ease: 'none' });
      ScrollTrigger.create({
        start: 0, end: 'max',
        onUpdate: function (self){ mueveBarra(self.progress); },
        /* Tras cargar una imagen el documento crece: sin esto la barra se queda marcando
           el porcentaje de un documento que ya no existe hasta el siguiente scroll. */
        onRefresh: function (self){ mueveBarra(self.progress); }
      });

      /* SCROLL-SPY del índice. Antes el disparador era el PROPIO subtítulo
         (start 'top 30%', end 'bottom 30%') y un subtítulo mide un renglón: el índice se
         encendía durante ~30 px de desplazamiento y se quedaba apagado toda la sección,
         que es justo cuando se está leyendo. Una sección va de un subtítulo AL
         SIGUIENTE, así que el final es el siguiente subtítulo. Tramos contiguos =
         siempre exactamente uno encendido. */
      var titulos = Array.prototype.slice.call(cuerpo.querySelectorAll('.art-h2, .art-h3'));
      titulos.forEach(function (t, i){
        var enlace = vista.querySelector('.art-indice a[data-destino="' + t.id + '"]');
        if (!enlace) return;
        var conf = {
          trigger: t, start: 'top 30%',
          onToggle: function (self){
            enlace.classList.toggle('es-aqui', self.isActive);
            enlace.setAttribute('aria-current', self.isActive ? 'true' : 'false');
          }
        };
        var sig = titulos[i + 1];
        if (sig) { conf.endTrigger = sig; conf.end = 'top 30%'; } else { conf.end = 'max'; }
        ScrollTrigger.create(conf);
      });

      return function (){ sueltas.forEach(function (f){ f(); }); };
    }, vista);

    // Después de pintar y en el frame siguiente: medir un layout a medio hacer da
    // posiciones equivocadas y los revelados disparan todos a la vez.
    requestAnimationFrame(function (){ if (window.ScrollTrigger) ScrollTrigger.refresh(); });
  }

  /** El progreso cuando no hay GSAP o se pidió menos movimiento: una escritura de
      transform por scroll, sin tween. Devuelve su propia baja. */
  function progresoSinGsap(barraProg){
    var raiz = document.scrollingElement || document.documentElement;
    var pinta = function (){
      var m = raiz.scrollHeight - raiz.clientHeight;
      barraProg.style.transform = 'scaleX(' + (m > 0 ? Math.min(1, raiz.scrollTop / m) : 0) + ')';
    };
    window.addEventListener('scroll', pinta, { passive: true });
    pinta();
    soltarEscena = function (){ window.removeEventListener('scroll', pinta); };
    return soltarEscena;
  }

  /* Zoom de imágenes: una captura de pantalla dentro de una columna de 40rem no se lee.
     Al pulsarla se abre a tamaño completo, con Esc y clic fuera para cerrar.

     La imagen se envuelve en un <button> de verdad en vez de ponerle role="button":
     `role` sobre un <img> le BORRA el rol de imagen, así que el alt deja de exponerse
     como descripción. Con el botón alrededor, el alt sigue siendo el alt y el teclado y
     el foco vienen de serie —sin el keydown a mano de Enter y Espacio—. */
  function montarZoomImagenes(cuerpo){
    var figs = cuerpo.querySelectorAll('.art-fig');
    Array.prototype.forEach.call(figs, function (fig){
      var img = fig.querySelector('img');
      if (!img || img.parentNode !== fig) return;
      var btn = el('button', 'art-zoom-btn');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Ampliar: ' + (img.alt || 'imagen del artículo'));
      fig.insertBefore(btn, img);
      btn.appendChild(img);
      btn.addEventListener('click', function (){ ampliarImagen(img); });
    });
  }

  function ampliarImagen(img){
    var overlay = el('div', 'art-zoom');
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', img.alt || 'Imagen ampliada');
    var quienAbrio = document.activeElement;
    var grande = document.createElement('img');
    grande.src = img.src;
    grande.alt = img.alt || '';
    overlay.appendChild(grande);
    var cerrar = el('button', 'art-zoom-x', '×');
    cerrar.type = 'button';
    cerrar.setAttribute('aria-label', 'Cerrar');
    overlay.appendChild(cerrar);
    document.body.appendChild(overlay);

    function fuera(){
      document.removeEventListener('keydown', porEsc);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (quienAbrio && quienAbrio.focus) quienAbrio.focus();
    }
    function porEsc(e){ if (e.key === 'Escape') fuera(); }
    cerrar.addEventListener('click', fuera);
    overlay.addEventListener('click', function (e){ if (e.target === overlay) fuera(); });
    document.addEventListener('keydown', porEsc);
    cerrar.focus();
    if (mueve()) gsap.from(grande, { opacity: 0, scale: .96, duration: .28, ease: 'power3.out' });
  }

  function verLectores(id){
    AppRun.call('artLectores', [id, correo()], { busy: 'Consultando lectores' })
      .then(function (r){
        if (!r || r.status !== 'ok') { aviso((r && r.error) || 'No pudimos consultarlo.', 'warn'); return; }
        var caja = el('div', 'art-panel-caja');
        caja.style.marginTop = 'var(--s3)';
        caja.appendChild(el('p', 'art-panel-t', r.total === 1 ? '1 persona lo ha leído' : r.total + ' personas lo han leído'));
        var lista = el('div', 'art-lectores');
        (r.lectores || []).forEach(function (l){
          var fila = el('div', 'art-lector');
          fila.appendChild(el('b', null, l.nombre || l.correo));
          fila.appendChild(el('span', null, l.primera + (l.veces > 1 ? ' · ' + l.veces + ' veces' : '')));
          lista.appendChild(fila);
        });
        if (!r.total) lista.appendChild(el('div', 'art-lector', 'Todavía nadie.'));
        caja.appendChild(lista);
        vista.appendChild(caja);
      }, function (){ aviso('No pudimos consultarlo.', 'warn'); });
  }

  /* ── Editor ────────────────────────────────────────────────────────── */
  var TIPOS = [
    { t: 'texto',      n: 'Párrafo',    i: 'document',     d: 'Texto corrido' },
    { t: 'titulo',     n: 'Subtítulo',  i: 'textsize',     d: 'Separa las partes' },
    { t: 'lista',      n: 'Lista',      i: 'layers',       d: 'Un punto por renglón' },
    { t: 'imagen',     n: 'Imagen',     i: 'image',        d: 'Se sube a Drive' },
    { t: 'tabla',      n: 'Tabla',      i: 'chart',        d: 'Pegada de Sheets' },
    { t: 'documento',  n: 'Documento',  i: 'presentation', d: 'Docs, Slides u hoja' },
    { t: 'diagrama',   n: 'Diagrama',   i: 'layers',       d: 'Flujo con draw.io' },
    { t: 'separador',  n: 'Separador',  i: 'minus',        d: 'Una línea de descanso' }
  ];

  function abrirEditor(a){
    /* Al entrar al editor hay que matar la escena de la lectura anterior: sus
       ScrollTrigger están midiendo nodos que desaparecen en cuanto se repinta #vista. */
    matarEscena();
    anchoDeModo(false);
    st.modo = 'edita';
    st.articulo = a || { id: '', titulo: '', resumen: '', estado: 'borrador', contenido: { v: 1, bloques: [] } };
    st.id = st.articulo.id || '';
    st.bloques = ((st.articulo.contenido && st.articulo.contenido.bloques) || []).slice();
    if (!st.bloques.length) st.bloques.push({ tipo: 'texto', partes: [{ t: '' }] });
    st.sucio = false;
    st.previa = false;
    st.foco = null;          // bloque al que llevar el cursor tras repintar
    pintarEditor();
    reflejar({ art: st.id, action: st.id ? 'edit' : 'nueva' }, true);
  }

  function marcar(){
    st.sucio = true;
    pintarCifras();
    pintarEstado();
  }

  /* Un textarea que crece con lo que se escribe. Sin esto, el lienzo tiene barras de
     desplazamiento dentro de cada párrafo y deja de parecerse a un artículo. */
  function autoAlto(ta){
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
  }
  function conAutoAlto(ta){
    ta.addEventListener('input', function (){ autoAlto(this); });
    setTimeout(function (){ autoAlto(ta); }, 0);
    return ta;
  }

  /* ── Las cifras del artículo, en vivo ─────────────────────────────────
     Cuántas palabras llevas y cuánto se tarda en leerlo es lo que de verdad
     contesta «¿me estoy pasando?», y hasta ahora había que guardar y salir para
     saberlo. Se calcula sobre los bloques en memoria, sin ir al servidor. */
  function palabrasDe(bloques){
    var partes = [];
    (bloques || []).forEach(function (b){
      if (b.tipo === 'titulo') partes.push(b.texto || '');
      else if (b.tipo === 'texto') partes.push((b.partes || []).map(function (p){ return p.t; }).join(''));
      else if (b.tipo === 'lista') (b.items || []).forEach(function (it){
        partes.push((it || []).map(function (p){ return p.t; }).join(''));
      });
      else if (b.tipo === 'tabla') (b.filas || []).forEach(function (f){ partes.push(f.join(' ')); });
      else if (b.tipo === 'imagen') partes.push(b.pie || '');
    });
    var t = partes.join(' ').replace(/\s+/g, ' ').trim();
    return t ? t.split(' ').length : 0;
  }

  function pintarCifras(){
    var caja = document.getElementById('artCifras');
    if (!caja) return;
    var pal = palabrasDe(st.bloques);
    var datos = [
      ['Palabras', pal],
      ['Lectura', Math.max(1, Math.round(pal / 200)) + ' min'],
      ['Bloques', st.bloques.length]
    ];
    vaciar(caja);
    datos.forEach(function (d){
      var fila = el('div', 'art-cifra');
      fila.appendChild(el('span', null, d[0]));
      fila.appendChild(el('b', null, d[1]));
      caja.appendChild(fila);
    });
  }

  function pintarEstado(){
    var n = document.getElementById('artEstado');
    if (!n) return;
    var antes = n.className;
    n.className = 'art-estado ' + (st.sucio ? 'sucio' : 'guardado');
    n.textContent = st.sucio ? 'Sin guardar' : (st.id ? 'Guardado' : 'Nuevo');
    /* Pasar de «sin guardar» a «guardado» es la confirmación que se busca con el
       rabillo del ojo tras pulsar Ctrl+S, y un cambio de color sin movimiento se
       pierde. El pop lo pone AppMotion, que es la pieza de la casa para esto. */
    if (antes.indexOf('sucio') > -1 && !st.sucio && window.AppMotion && AppMotion.pop) AppMotion.pop(n);
  }

  function pintarEditor(){
    vaciar(vista);

    /* ── Barra de trabajo ───────────────────────────────────────────────
       Lo que hay que saber siempre a la izquierda (dónde estoy, en qué estado,
       si hay cambios sin guardar) y a la derecha UNA sola acción primaria. */
    var barra = el('div', 'art-barra');
    var izq = el('div', 'art-barra-izq');
    var salir = el('button', 'v-btn v-btn-ghost', '← Salir');
    salir.type = 'button';
    salir.addEventListener('click', salirDelEditor);
    izq.appendChild(salir);
    izq.appendChild(el('span', 'art-badge ' + (st.articulo.estado === 'publicado' ? 'publicado' : 'borrador'),
      st.articulo.estado === 'publicado' ? 'Publicado' : 'Borrador'));
    var estado = el('span', 'art-estado', '');
    estado.id = 'artEstado';
    estado.setAttribute('aria-live', 'polite');
    izq.appendChild(estado);
    barra.appendChild(izq);

    var der = el('div', 'art-barra-der');
    var previa = el('button', 'v-btn v-btn-ghost', st.previa ? 'Seguir escribiendo' : 'Vista previa');
    previa.type = 'button';
    previa.addEventListener('click', function (){ st.previa = !st.previa; pintarEditor(); });
    der.appendChild(previa);
    var guardar = el('button', 'v-btn v-btn-ghost', 'Guardar');
    guardar.type = 'button';
    guardar.title = 'Ctrl + S';
    guardar.addEventListener('click', function (){ guardarArticulo(st.articulo.estado || 'borrador'); });
    der.appendChild(guardar);
    var publicar = el('button', 'v-btn v-btn-primary',
      st.articulo.estado === 'publicado' ? 'Guardar y retirar' : 'Publicar');
    publicar.type = 'button';
    publicar.addEventListener('click', function (){
      guardarArticulo(st.articulo.estado === 'publicado' ? 'borrador' : 'publicado');
    });
    der.appendChild(publicar);
    barra.appendChild(der);
    vista.appendChild(barra);

    var grid = el('div', 'art-editor');
    var col = document.createElement('div');

    if (st.previa) {
      /* Vista previa: el render REAL, el mismo que verá quien lo lea. No una
         imitación —eso es lo que acaba mintiendo— sino la misma función. */
      var caja = el('div', 'art-previa');
      caja.appendChild(el('p', 'art-previa-nota', 'Así se verá'));
      var doc = el('article', 'art-doc');
      var hdp = el('div', 'art-doc-hd');
      hdp.appendChild(el('h1', null, st.articulo.titulo || '(sin título)'));
      if (st.articulo.resumen) hdp.appendChild(el('p', 'art-doc-rs', st.articulo.resumen));
      doc.appendChild(hdp);
      doc.appendChild(R.pintarCuerpo({ v: 1, bloques: st.bloques }));
      caja.appendChild(doc);
      col.appendChild(caja);
    } else {
      var lienzo = el('div', 'art-lienzo');

      var cab = el('div', 'art-cabecera');
      var tTitulo = document.createElement('input');
      tTitulo.type = 'text';
      tTitulo.className = 'art-campo-titulo';
      tTitulo.value = st.articulo.titulo || '';
      tTitulo.placeholder = 'Título del artículo';
      tTitulo.maxLength = 160;
      tTitulo.setAttribute('aria-label', 'Título del artículo');
      tTitulo.addEventListener('input', function (){ st.articulo.titulo = this.value; marcar(); });
      cab.appendChild(tTitulo);
      var tRes = document.createElement('textarea');
      tRes.className = 'art-campo-resumen';
      tRes.rows = 1;
      tRes.value = st.articulo.resumen || '';
      tRes.placeholder = 'Resumen en una o dos líneas. Es lo que se lee en la lista y en el buscador.';
      tRes.maxLength = 400;
      tRes.setAttribute('aria-label', 'Resumen del artículo');
      tRes.addEventListener('input', function (){ st.articulo.resumen = this.value; marcar(); });
      cab.appendChild(conAutoAlto(tRes));
      lienzo.appendChild(cab);

      var caja2 = el('div', 'art-bloques');
      st.bloques.forEach(function (b, i){
        caja2.appendChild(editorDeBloque(b, i));
        caja2.appendChild(zonaInsertar(i + 1));
      });
      lienzo.appendChild(caja2);
      col.appendChild(lienzo);
    }
    grid.appendChild(col);

    // ── Panel lateral: contexto y herramientas. Nunca la acción primaria.
    var panel = el('div', 'art-panel');

    var fichaCaja = el('div', 'art-panel-caja');
    fichaCaja.appendChild(el('p', 'art-panel-t', 'Este artículo'));
    var cifras = el('div', 'art-cifras');
    cifras.id = 'artCifras';
    fichaCaja.appendChild(cifras);
    panel.appendChild(fichaCaja);

    var insertar = el('div', 'art-panel-caja');
    insertar.appendChild(el('p', 'art-panel-t', 'Añadir al final'));
    var botones = el('div', 'art-insertar');
    TIPOS.forEach(function (t){
      var b = el('button', null, null);
      b.type = 'button';
      b.appendChild(icono(t.i));
      b.appendChild(document.createTextNode(t.n));
      b.addEventListener('click', function (){ anadirBloque(t.t); });
      botones.appendChild(b);
    });
    insertar.appendChild(botones);
    insertar.appendChild(el('p', 'art-ayuda', 'También puedes usar el + que aparece entre dos bloques para insertar justo ahí.'));
    panel.appendChild(insertar);

    var ayuda = el('div', 'art-panel-caja');
    ayuda.appendChild(el('p', 'art-panel-t', 'Cómo se pegan las cosas'));
    ayuda.appendChild(el('p', 'art-ayuda',
      'Copia un rango de Sheets o Excel y pégalo en un bloque de tabla: se reparte solo en columnas. ' +
      'Pega el enlace de un Docs, Slides o Sheets en un bloque de documento y se incrusta. ' +
      'Las imágenes se suben a la carpeta del Portal en Drive.'));
    panel.appendChild(ayuda);

    var borrarCaja = el('div', 'art-panel-caja');
    borrarCaja.appendChild(el('p', 'art-panel-t', 'Zona de riesgo'));
    var borrar = el('button', 'v-btn v-btn-ghost', 'Borrar este artículo');
    borrar.type = 'button';
    borrar.disabled = !st.id;
    borrar.addEventListener('click', borrarArticulo);
    borrarCaja.appendChild(borrar);
    if (!st.id) borrarCaja.appendChild(el('p', 'art-ayuda', 'Todavía no se ha guardado, así que no hay nada que borrar.'));
    panel.appendChild(borrarCaja);

    grid.appendChild(panel);
    vista.appendChild(grid);
    pintarCifras();
    pintarEstado();
    iconos();
    entrada(col.firstChild ? col.firstChild.children : null, { y: 10, duration: .38 });
    entrada(panel.children, { y: 12, delay: .08 });

    /* El cursor vuelve donde estaba: tras insertar o mover un bloque, repintar y
       dejar el foco en el body obliga a buscar con el ratón dónde ibas. Y el bloque
       en cuestión se señala con una entrada corta: cuando se inserta en medio de un
       artículo largo, sin eso no se sabe cuál de los quince es el nuevo. */
    if (st.foco != null) {
      var campos = vista.querySelectorAll('.art-bloque .art-esc');
      var destino = campos[st.foco];
      if (destino) {
        destino.focus();
        if (destino.setSelectionRange) { var n = destino.value.length; destino.setSelectionRange(n, n); }
        var bloque = destino.closest('.art-bloque');
        if (bloque && mueve()) {
          gsap.from(bloque, { opacity: 0, y: -8, duration: .32, ease: 'power3.out',
                              overwrite: 'auto', clearProps: 'transform,opacity' });
        }
      }
      st.foco = null;
    }
  }

  function salirDelEditor(){
    if (st.sucio && !window.confirm('Se perderá lo que has escrito desde el último guardado. ¿Salir igualmente?')) return;
    if (st.id) abrirArticulo(st.id); else cargarLista();
  }

  function borrarArticulo(){
    if (!st.id) return;
    if (!window.confirm('Se borrará el artículo del Portal. Esta acción no se puede deshacer.')) return;
    AppRun.call('artEliminar', [st.id, correo()], { busy: 'Borrando el artículo' })
      .then(function (r){
        if (!r || r.status !== 'ok') { aviso((r && r.error) || 'No pudimos borrarlo.', 'warn'); return; }
        st.sucio = false; st.id = '';
        aviso('Artículo borrado.', 'ok');
        cargarLista();
      }, function (){ aviso('No pudimos borrarlo.', 'warn'); });
  }

  /* Zona de inserción entre dos bloques: una línea con un «+» que solo aparece al
     acercarse. Es donde la gente quiere añadir algo —justo ahí— y evita tener que
     añadir al final y subir el bloque a base de flechas. */
  function zonaInsertar(pos){
    var zona = el('div', 'art-entre');
    var mas = el('button', 'art-mas', '+');
    mas.type = 'button';
    mas.setAttribute('aria-label', 'Insertar un bloque aquí');
    mas.addEventListener('click', function (e){ abrirMenuInsertar(e.currentTarget, pos); });
    zona.appendChild(mas);
    return zona;
  }

  function abrirMenuInsertar(anclaje, pos){
    cerrarMenu();
    var menu = el('div', 'art-menu');
    menu.id = 'artMenuInsertar';
    TIPOS.forEach(function (t){
      var b = el('button', null, null);
      b.type = 'button';
      b.appendChild(icono(t.i));
      var txt = document.createElement('span');
      txt.appendChild(document.createTextNode(t.n));
      txt.appendChild(el('small', null, t.d));
      b.appendChild(txt);
      b.addEventListener('click', function (){ cerrarMenu(); anadirBloque(t.t, pos); });
      menu.appendChild(b);
    });
    document.body.appendChild(menu);
    var r = anclaje.getBoundingClientRect();
    // Si no cabe debajo, se abre hacia arriba: pulsar el «+» del último bloque no
    // puede dejar el menú medio fuera de la pantalla.
    var alto = menu.offsetHeight || 280;
    var abajo = r.bottom + 6;
    menu.style.top = (abajo + alto > window.innerHeight - 8 ? Math.max(8, r.top - alto - 6) : abajo) + 'px';
    menu.style.left = Math.max(8, Math.min(window.innerWidth - 230, r.left - 90)) + 'px';
    if (window.Icons) Icons.render(menu);
    if (mueve()) gsap.from(menu, { opacity: 0, y: -6, duration: .18, ease: 'power2.out', clearProps: 'transform,opacity' });
    var primero = menu.querySelector('button');
    if (primero) primero.focus();
    setTimeout(function (){
      document.addEventListener('click', cerrarMenuFuera);
      // Al desplazarse, el menú se queda donde estaba y el «+» se va: se cierra.
      window.addEventListener('scroll', cerrarMenu, true);
    }, 0);
  }
  function cerrarMenu(){
    var m = document.getElementById('artMenuInsertar');
    if (m && m.parentNode) m.parentNode.removeChild(m);
    document.removeEventListener('click', cerrarMenuFuera);
    window.removeEventListener('scroll', cerrarMenu, true);
  }
  function cerrarMenuFuera(e){
    var m = document.getElementById('artMenuInsertar');
    if (m && !m.contains(e.target)) cerrarMenu();
  }

  /** `pos` = dónde insertarlo. Sin ella, al final. */
  function anadirBloque(tipo, pos){
    var nuevo = tipo === 'texto' ? { tipo: 'texto', partes: [{ t: '' }] }
      : tipo === 'titulo' ? { tipo: 'titulo', texto: '', nivel: 2 }
      : tipo === 'lista' ? { tipo: 'lista', items: [[{ t: '' }]], ordenada: false }
      : tipo === 'imagen' ? { tipo: 'imagen', url: '', alt: '', pie: '' }
      : tipo === 'tabla' ? { tipo: 'tabla', filas: [], encabezado: true }
      : tipo === 'documento' ? { tipo: 'documento', clase: '', docId: '', titulo: '' }
      : tipo === 'diagrama' ? { tipo: 'diagrama', xml: '', titulo: '', alto: 420 }
      : { tipo: 'separador' };
    var destino = (pos == null || pos > st.bloques.length) ? st.bloques.length : pos;
    st.bloques.splice(destino, 0, nuevo);
    st.foco = destino;          // el cursor cae dentro del bloque recién creado
    marcar();
    pintarEditor();
  }

  function moverBloque(i, dir){
    var j = i + dir;
    if (j < 0 || j >= st.bloques.length) return;
    var tmp = st.bloques[i]; st.bloques[i] = st.bloques[j]; st.bloques[j] = tmp;
    st.foco = j;                // el foco viaja CON el bloque, no se queda en su hueco
    marcar();
    pintarEditor();
  }

  function quitarBloque(i){
    st.bloques.splice(i, 1);
    if (!st.bloques.length) st.bloques.push({ tipo: 'texto', partes: [{ t: '' }] });
    st.foco = Math.max(0, i - 1);
    marcar();
    pintarEditor();
  }

  /** El texto de un párrafo se edita como TEXTO PLANO; los enlaces se escriben aparte. */
  function textoDePartes(partes){
    return (partes || []).map(function (p){ return p.t; }).join('');
  }

  function editorDeBloque(b, i){
    var caja = el('div', 'art-bloque');
    caja.setAttribute('data-i', String(i));

    // Chrome flotante: rótulo del tipo y acciones. Solo se ve al pasar o enfocar.
    var hd = el('div', 'art-bloque-hd');
    var ficha = TIPOS.filter(function (t){ return t.t === b.tipo; })[0];
    hd.appendChild(el('span', 'art-bloque-tipo', (ficha && ficha.n) || b.tipo));
    var ac = el('div', 'art-bloque-ac');
    /* Subir y bajar con el MISMO dibujo girado, y no con dos iconos distintos: una
       flecha para arriba y un galón para abajo se leen como dos gestos diferentes.
       (Antes eran 'arrow' y 'chevdown', dos nombres que ni siquiera existían en el
       catálogo, así que los dos botones salían sin icono.) */
    [[-1, 'Subir'], [1, 'Bajar']].forEach(function (m){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.title = m[1];
      btn.setAttribute('aria-label', m[1] + ' este bloque');
      btn.appendChild(icono('chevron', m[0] === -1 ? 'es-arriba' : null));
      btn.disabled = (m[1] === -1 && i === 0) || (m[1] === 1 && i === st.bloques.length - 1);
      btn.addEventListener('click', function (){ moverBloque(i, m[1]); });
      ac.appendChild(btn);
    });
    var borrar = document.createElement('button');
    borrar.type = 'button';
    borrar.title = 'Quitar bloque';
    borrar.setAttribute('aria-label', 'Quitar este bloque');
    borrar.appendChild(icono('trash'));
    borrar.addEventListener('click', function (){ quitarBloque(i); });
    ac.appendChild(borrar);
    hd.appendChild(ac);
    caja.appendChild(hd);

    if (b.tipo === 'texto') {
      var ta = document.createElement('textarea');
      ta.className = 'art-esc es-parrafo';
      ta.rows = 1;
      ta.value = textoDePartes(b.partes);
      ta.placeholder = 'Escribe aquí…';
      ta.setAttribute('aria-label', 'Párrafo ' + (i + 1));
      ta.addEventListener('input', function (){
        var u = (b.partes || []).filter(function (p){ return p.url; })[0];
        b.partes = u ? [{ t: this.value, url: u.url }] : [{ t: this.value }];
        marcar();
      });
      /* Enter al final de un párrafo abre el siguiente, como en cualquier editor.
         Con Shift+Enter se parte la línea dentro del mismo párrafo, que es la otra
         mitad de la convención. */
      ta.addEventListener('keydown', function (e){
        if (e.key !== 'Enter' || e.shiftKey) return;
        if (this.selectionStart !== this.value.length) return;
        e.preventDefault();
        anadirBloque('texto', i + 1);
      });
      caja.appendChild(conAutoAlto(ta));

      var sub = el('div', 'art-sub art-sub-op');
      var enl = document.createElement('input');
      enl.type = 'text';
      enl.placeholder = 'Enlace para todo el párrafo (https://…), opcional';
      enl.setAttribute('aria-label', 'Enlace del párrafo ' + (i + 1));
      var urlActual = (b.partes || []).filter(function (p){ return p.url; })[0];
      enl.value = urlActual ? urlActual.url : '';
      enl.addEventListener('input', function (){
        var u = R.urlSegura(this.value);
        var txt = textoDePartes(b.partes);
        b.partes = u ? [{ t: txt, url: u }] : [{ t: txt }];
        var pista = caja.querySelector('.art-ayuda');
        if (pista) pista.textContent = this.value.trim() && !u
          ? 'Ese enlace no vale: solo se admiten direcciones que empiecen por https://'
          : '';
        marcar();
      });
      sub.appendChild(enl);
      sub.appendChild(el('p', 'art-ayuda', ''));
      caja.appendChild(sub);
    }

    else if (b.tipo === 'titulo') {
      var ti = document.createElement('input');
      ti.type = 'text';
      ti.className = 'art-esc ' + (b.nivel === 3 ? 'es-titulo3' : 'es-titulo2');
      ti.value = b.texto || '';
      ti.placeholder = b.nivel === 3 ? 'Subtítulo menor' : 'Subtítulo';
      ti.setAttribute('aria-label', 'Subtítulo');
      ti.addEventListener('input', function (){ b.texto = this.value; marcar(); });
      caja.appendChild(ti);
      var nivel = el('div', 'art-sub art-sub-op');
      var lbl = document.createElement('label');
      lbl.style.display = 'flex';
      lbl.style.alignItems = 'center';
      lbl.style.gap = '.4rem';
      lbl.style.fontSize = 'var(--fs-xs)';
      lbl.style.color = 'var(--ink-faint)';
      var chkN = document.createElement('input');
      chkN.type = 'checkbox';
      chkN.checked = b.nivel === 3;
      chkN.addEventListener('change', function (){ b.nivel = this.checked ? 3 : 2; marcar(); pintarEditor(); });
      lbl.appendChild(chkN);
      lbl.appendChild(document.createTextNode('Subtítulo de segundo nivel (más pequeño)'));
      nivel.appendChild(lbl);
      caja.appendChild(nivel);
    }

    else if (b.tipo === 'lista') {
      var tl = document.createElement('textarea');
      tl.className = 'art-esc es-lista';
      tl.rows = 1;
      tl.value = (b.items || []).map(function (it){ return textoDePartes(it); }).join('\n');
      tl.placeholder = 'Un punto por renglón.';
      tl.setAttribute('aria-label', 'Lista');
      tl.addEventListener('input', function (){
        b.items = this.value.split('\n').map(function (t){ return [{ t: t }]; });
        marcar();
      });
      caja.appendChild(conAutoAlto(tl));
      var subL = el('div', 'art-sub art-sub-op');
      var lblL = document.createElement('label');
      lblL.style.display = 'flex';
      lblL.style.alignItems = 'center';
      lblL.style.gap = '.4rem';
      lblL.style.fontSize = 'var(--fs-xs)';
      lblL.style.color = 'var(--ink-faint)';
      var chkL = document.createElement('input');
      chkL.type = 'checkbox';
      chkL.checked = b.ordenada === true;
      chkL.addEventListener('change', function (){ b.ordenada = this.checked; marcar(); });
      lblL.appendChild(chkL);
      lblL.appendChild(document.createTextNode('Numerada (1, 2, 3…)'));
      subL.appendChild(lblL);
      caja.appendChild(subL);
    }

    else if (b.tipo === 'imagen') {
      /* La imagen se ve TAL CUAL va a quedar, con su pie debajo: es el bloque donde
         más se agradece no tener que imaginar, porque lo que se sube desde el móvil
         suele venir con otra proporción de la que uno recuerda. */
      if (b.url) {
        var fig = el('figure', 'art-fig');
        var prev = document.createElement('img');
        prev.src = R.urlSegura(b.url);
        prev.alt = b.alt || '';
        fig.appendChild(prev);
        if (b.pie) fig.appendChild(el('figcaption', null, b.pie));
        caja.appendChild(fig);
      } else {
        caja.appendChild(el('p', 'art-ayuda', 'Todavía sin imagen. Elige un archivo y se sube a la carpeta del Portal en Drive.'));
      }
      var subI = el('div', 'art-sub');
      var file = document.createElement('input');
      file.type = 'file';
      file.accept = 'image/*';
      file.setAttribute('aria-label', 'Archivo de imagen');
      file.style.fontSize = 'var(--fs-xs)';
      file.addEventListener('change', function (){ subirImagen(this.files && this.files[0], b); });
      subI.appendChild(file);
      var pie = document.createElement('input');
      pie.type = 'text';
      pie.placeholder = 'Pie de imagen (opcional)';
      pie.value = b.pie || '';
      pie.setAttribute('aria-label', 'Pie de imagen');
      pie.addEventListener('input', function (){
        b.pie = this.value;
        var f = caja.querySelector('figcaption');
        if (f) f.textContent = this.value;
        marcar();
      });
      subI.appendChild(pie);
      var alt = document.createElement('input');
      alt.type = 'text';
      alt.placeholder = 'Descripción para quien no puede ver la imagen';
      alt.value = b.alt || '';
      alt.setAttribute('aria-label', 'Texto alternativo');
      alt.addEventListener('input', function (){ b.alt = this.value; marcar(); });
      subI.appendChild(alt);
      caja.appendChild(subI);
    }

    else if (b.tipo === 'tabla') {
      /* Dos mitades: donde se pega y lo que va a quedar. Pegar cien celdas y ver
         solo el texto separado por tabuladores no dice si las columnas cuadran. */
      var tt = document.createElement('textarea');
      tt.className = 'art-esc es-mono';
      tt.rows = 3;
      tt.value = (b.filas || []).map(function (f){ return f.join('\t'); }).join('\n');
      tt.placeholder = 'Pega aquí el rango copiado de Sheets o Excel.';
      tt.setAttribute('aria-label', 'Contenido de la tabla');
      var repintaTabla = function (){
        var vieja = caja.querySelector('.art-tabla-bloque');
        if (vieja) vieja.parentNode.removeChild(vieja);
        if (!(b.filas || []).length) return;
        var nueva = R.pintarBloque(b);
        if (nueva) {
          caja.insertBefore(nueva, caja.querySelector('.art-sub'));
          R.avisarTablasAnchas(caja);
        }
      };
      tt.addEventListener('input', function (){
        b.filas = R.parsearTSV(this.value);
        autoAlto(this);
        var n = caja.querySelector('.art-ayuda');
        if (n) n.textContent = b.filas.length
          ? b.filas.length + ' filas × ' + (b.filas[0] ? b.filas[0].length : 0) + ' columnas'
          : 'Pega el rango y se reparte solo en columnas.';
        repintaTabla();
        marcar();
      });
      caja.appendChild(conAutoAlto(tt));
      if ((b.filas || []).length) {
        var tablaPrev = R.pintarBloque(b);
        if (tablaPrev) caja.appendChild(tablaPrev);
      }
      var subT = el('div', 'art-sub');
      var chk = document.createElement('label');
      chk.style.display = 'flex';
      chk.style.alignItems = 'center';
      chk.style.gap = '.4rem';
      chk.style.fontSize = 'var(--fs-xs)';
      chk.style.color = 'var(--ink-faint)';
      var ci = document.createElement('input');
      ci.type = 'checkbox';
      ci.checked = b.encabezado !== false;
      ci.addEventListener('change', function (){ b.encabezado = this.checked; marcar(); repintaTabla(); });
      chk.appendChild(ci);
      chk.appendChild(document.createTextNode('La primera fila son los encabezados'));
      subT.appendChild(chk);
      subT.appendChild(el('p', 'art-ayuda', (b.filas || []).length
        ? b.filas.length + ' filas × ' + (b.filas[0] ? b.filas[0].length : 0) + ' columnas'
        : 'Pega el rango y se reparte solo en columnas.'));
      caja.appendChild(subT);
    }

    else if (b.tipo === 'documento') {
      var estadoDoc = el('p', 'art-ayuda', '');
      var pintaDoc = function (){
        var viejo = caja.querySelector('.art-doc-emb');
        if (viejo) viejo.parentNode.removeChild(viejo);
        if (!b.docId) return;
        var visor = R.pintarBloque(b);
        if (visor) caja.insertBefore(visor, caja.querySelector('.art-sub'));
      };
      if (b.docId) {
        var visorIni = R.pintarBloque(b);
        if (visorIni) caja.appendChild(visorIni);
      } else {
        caja.appendChild(el('p', 'art-ayuda', 'Pega abajo el enlace y el documento aparecerá aquí mismo.'));
      }
      var subD = el('div', 'art-sub');
      var du = document.createElement('input');
      du.type = 'text';
      du.placeholder = 'Enlace del Documento, Presentación u Hoja de Google';
      du.value = b.docId ? 'https://docs.google.com/' + ((DOC_RUTA[b.clase]) || 'file') + '/d/' + b.docId + '/edit' : '';
      du.setAttribute('aria-label', 'Enlace del documento de Google');
      du.addEventListener('input', function (){
        var d = R.docDeUrl(this.value);
        if (d) { b.clase = d.clase; b.docId = d.docId; marcar(); pintaDoc(); }
        estadoDoc.textContent = d
          ? 'Reconocido: ' + NOMBRE_DOC[d.clase] + '.'
          : (this.value.trim() ? 'No reconozco ese enlace. Tiene que ser de docs.google.com o drive.google.com.' : '');
      });
      subD.appendChild(du);
      var dt = document.createElement('input');
      dt.type = 'text';
      dt.placeholder = 'Cómo llamarlo en el artículo (opcional)';
      dt.value = b.titulo || '';
      dt.setAttribute('aria-label', 'Nombre del documento en el artículo');
      dt.addEventListener('input', function (){ b.titulo = this.value; marcar(); });
      subD.appendChild(dt);
      estadoDoc.textContent = b.docId ? 'Reconocido: ' + (NOMBRE_DOC[b.clase] || 'archivo de Drive') + '.' : '';
      subD.appendChild(estadoDoc);
      subD.appendChild(el('p', 'art-ayuda',
        'Quien lea el artículo verá el documento solo si Drive le da permiso: compártelo con el equipo antes de publicar.'));
      caja.appendChild(subD);
    }

    else if (b.tipo === 'diagrama') {
      /* En el editor se ve el MISMO visor que verá quien lea, y el dibujo se hace en
         una ventana aparte a pantalla completa. Poner el editor de draw.io dentro del
         lienzo —a 420 px, con su barra de herramientas y su paleta— dejaba el artículo
         reducido a una rendija y el diagrama tampoco se dibujaba a gusto. */
      var lienzoD = el('div', 'art-diag-hueco');
      var pintaDiag = function (){
        vaciar(lienzoD);
        if (b.xml) {
          lienzoD.appendChild(R.pintarBloque(b));
        } else {
          var vacio = el('div', 'art-diag-vacio');
          vacio.appendChild(icono('layers'));
          vacio.appendChild(el('div', 'art-vacio-t', 'Diagrama en blanco'));
          vacio.appendChild(el('div', 'art-vacio-s',
            'Dibuja un flujo con cajas, flechas y textos. Se guarda dentro del artículo y se puede volver a editar cuando quieras.'));
          lienzoD.appendChild(vacio);
        }
      };
      pintaDiag();
      caja.appendChild(lienzoD);

      var subG = el('div', 'art-sub');
      var abrirEd = el('button', 'v-btn v-btn-primary', b.xml ? 'Editar el diagrama' : 'Dibujar el diagrama');
      abrirEd.type = 'button';
      abrirEd.addEventListener('click', function (){
        abrirEditorDiagrama(b, function (xmlNuevo){
          if (xmlNuevo == null) return;      // salió sin guardar
          b.xml = xmlNuevo;
          marcar();
          pintaDiag();
          abrirEd.textContent = 'Editar el diagrama';
        });
      });
      subG.appendChild(abrirEd);
      var dtG = document.createElement('input');
      dtG.type = 'text';
      dtG.placeholder = 'Cómo llamar al diagrama (opcional)';
      dtG.value = b.titulo || '';
      dtG.setAttribute('aria-label', 'Nombre del diagrama');
      dtG.addEventListener('input', function (){
        b.titulo = this.value;
        var tt = lienzoD.querySelector('.art-doc-tt');
        if (tt) tt.textContent = this.value || 'Diagrama';
        marcar();
      });
      subG.appendChild(dtG);
      subG.appendChild(el('p', 'art-ayuda',
        'El diagrama se dibuja con draw.io y se guarda dentro del artículo, no en Drive: quien lo lea lo verá sin pedir permisos a nadie.'));
      caja.appendChild(subG);
    }

    else if (b.tipo === 'separador') {
      caja.appendChild(el('hr', 'art-sep'));
    }

    return caja;
  }

  /* El editor de diagramas, a pantalla completa. Se cierra desde el propio draw.io
     («Guardar y salir» manda `save` y luego `exit`), y también con Esc o el botón. */
  function abrirEditorDiagrama(b, alTerminar){
    var overlay = el('div', 'art-diag-full es-editor');
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'Editor de diagramas');
    var quienAbrio = document.activeElement;
    var guardado = null;

    var barra = el('div', 'art-diag-full-bar');
    barra.appendChild(el('span', 'art-diag-full-tt', b.titulo || 'Diagrama del artículo'));
    barra.appendChild(el('span', 'art-ayuda', 'Dibuja y pulsa «Guardar y salir» dentro del editor.'));
    var cerrar = el('button', 'v-btn v-btn-ghost', 'Cerrar');
    cerrar.type = 'button';
    barra.appendChild(cerrar);
    overlay.appendChild(barra);

    var montaje = R.montarDiagrama({ xml: b.xml, titulo: b.titulo, alto: 0 }, true, function (xml){
      if (xml == null) { fuera(); return; }   // `exit` sin guardar
      guardado = xml;
      alTerminar(xml);
      aviso('Diagrama guardado en el artículo.', 'ok');
      fuera();
    });
    montaje.el.classList.add('es-full');
    overlay.appendChild(montaje.el);
    document.body.appendChild(overlay);

    function fuera(){
      montaje.destruir();
      document.removeEventListener('keydown', porEsc);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (quienAbrio && quienAbrio.focus) quienAbrio.focus();
      if (guardado == null) alTerminar(null);
    }
    function porEsc(e){ if (e.key === 'Escape') fuera(); }
    cerrar.addEventListener('click', fuera);
    document.addEventListener('keydown', porEsc);
    if (window.AppMotion && AppMotion.modalIn) AppMotion.modalIn(overlay, montaje.el);
  }

  var DOC_RUTA = { documento: 'document', presentacion: 'presentation', hoja: 'spreadsheets', archivo: 'file' };
  var NOMBRE_DOC = { documento: 'un Documento de Google', presentacion: 'una Presentación',
                     hoja: 'una Hoja de cálculo', archivo: 'un archivo de Drive' };

  /**
   * PEGAR UNA IMAGEN EN EL EDITOR (T8.2 · criterio 1 de la fase, «dos imágenes pegadas»).
   *
   * Hasta ahora el único camino era el selector de archivo, y eso obligaba a un rodeo justo
   * en el caso más frecuente: nueve de cada diez imágenes de una guía son un recorte de
   * pantalla, y con el recorte en el portapapeles había que guardarlo antes en el disco
   * para poder elegirlo.
   *
   * Solo se queda el pegado cuando de verdad viene un archivo de imagen. Pegar texto en un
   * párrafo, o el TSV de una hoja de cálculo en la caja de una tabla, tiene que seguir
   * funcionando exactamente igual — y ese TSV llega como texto, no como archivo, así que la
   * comprobación de `kind` los separa sin ambigüedad.
   */
  function pegarImagen(e){
    if (st.modo !== 'edita') return;
    var dt = e.clipboardData || window.clipboardData;
    if (!dt || !dt.items) return;

    var imagenes = [];
    for (var i = 0; i < dt.items.length; i++) {
      var it = dt.items[i];
      if (it.kind === 'file' && String(it.type || '').indexOf('image/') === 0) {
        var f = it.getAsFile();
        if (f) imagenes.push(f);
      }
    }
    if (!imagenes.length) return;
    e.preventDefault();

    /* Detrás del bloque en el que se está, que es donde se está mirando; al final si no hay
       ninguno enfocado. Varias imágenes de un mismo pegado entran EN ORDEN y no todas en el
       sitio de la primera, que es lo que pasaría reusando la misma posición. */
    var base = (typeof st.foco === 'number' && st.foco >= 0) ? st.foco + 1 : st.bloques.length;
    imagenes.forEach(function (f, n){
      var destino = Math.min(base + n, st.bloques.length);   // mismo tope que anadirBloque
      anadirBloque('imagen', destino);
      subirImagen(f, st.bloques[destino]);
    });
    /* Se avisa porque el bloque nuevo nace VACÍO —la imagen llega cuando el servidor
       contesta— y sin una palabra parece que el pegado no hizo nada. */
    aviso(imagenes.length === 1 ? 'Imagen pegada: subiéndola…'
                                : 'Pegadas ' + imagenes.length + ' imágenes: subiéndolas…');
  }

  function subirImagen(file, bloque){
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) { aviso('La imagen supera los 8 MB.', 'warn'); return; }
    var lector = new FileReader();
    lector.onload = function (){
      AppRun.call('artSubirImagen', [{ dataUrl: lector.result, nombre: file.name, asesor: correo() }],
        { busy: 'Subiendo la imagen' })
        .then(function (r){
          if (!r || r.status !== 'ok') { aviso((r && r.error) || 'No pudimos subir la imagen.', 'warn'); return; }
          bloque.url = r.url;
          marcar();
          pintarEditor();
        }, function (){ aviso('No pudimos subir la imagen.', 'warn'); });
    };
    lector.readAsDataURL(file);
  }

  function guardarArticulo(estado){
    var titulo = String(st.articulo.titulo || '').trim();
    if (!titulo) { aviso('El artículo necesita un título.', 'warn'); return; }

    var payload = {
      id: st.id || '',
      titulo: titulo,
      resumen: String(st.articulo.resumen || '').trim(),
      contenido: { v: 1, bloques: st.bloques },
      estado: estado,
      asesor: correo()
    };

    AppGuardado.guardar({
      clave: 'articulo:' + (payload.id || 'nuevo'),
      etiqueta: payload.id ? 'Guardando el artículo' : 'Creando el artículo',
      hecho: estado === 'publicado' ? 'Artículo publicado.' : 'Artículo guardado.',
      fn: 'artGuardar',
      args: [payload],
      /* Con id es una actualización —repetirla deja el mismo resultado, así que se puede
         reintentar—; sin id, cada intento CREA un artículo, y reintentar publicaría el
         mismo dos veces. Es el mismo criterio que el constructor de anuncios. */
      reintentos: payload.id ? 2 : 0,
      valida: function (res){ return !!(res && res.status === 'ok'); },
      alLograr: function (res){
        st.id = res.id;
        st.articulo.id = res.id;
        st.articulo.estado = res.estado;
        st.sucio = false;
        abrirArticulo(res.id);
      }
    });
  }

  /* ── Arranque y estado en la URL ───────────────────────────────────── */
  function aplicarUrl(){
    var id = param('art');
    if (id && id !== st.id) { abrirArticulo(id); return; }
    if (!id && st.modo !== 'lista') cargarLista();
  }

  document.addEventListener('DOMContentLoaded', function () {
    // Leer artículos no pide bloque: pide sesión. El editor aparece solo si el servidor
    // dice que esta persona puede (artListar/artObtener devuelven `puedeEditar`).
    if (!requireSession('articulo')) return;

    AppShell.mount({ active: 'articulo', title: 'Artículos' });
    if (window.VentelLoader) VentelLoader.hide();

    var id = param('art');
    if (id) abrirArticulo(id); else cargarLista();

    if (window.AppUrl && AppUrl.alCambiarUrl) AppUrl.alCambiarUrl(aplicarUrl);

    window.addEventListener('beforeunload', function (e){
      if (st.modo === 'edita' && st.sucio) { e.preventDefault(); e.returnValue = ''; }
    });

    /* Ctrl/Cmd + S guarda, y Esc cierra el menú de insertar. Lo primero porque quien
       escribe algo largo lo pulsa por reflejo cada pocos minutos, y sin atajo el
       navegador ofrece «guardar la página», que no es lo que nadie quiere. */
    document.addEventListener('keydown', function (e){
      if (e.key === 'Escape') { cerrarMenu(); return; }
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's') {
        if (st.modo !== 'edita') return;
        e.preventDefault();
        guardarArticulo(st.articulo.estado || 'borrador');
      }
    });

    /* Pegar una imagen. Va en `document` y no en el lienzo porque el lienzo se vuelve a
       pintar entero en cada cambio y el escuchador se iría con él; la guarda de modo hace
       el resto. */
    document.addEventListener('paste', pegarImagen);
  });
})();
</script>
