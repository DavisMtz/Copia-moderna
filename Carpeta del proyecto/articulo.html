<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artículos · Ventel</title>

<!-- Preferencias de vista (tamaño de letra, contraste) antes que nada, para que la
     pantalla no parpadee del ajuste por omisión al de la persona. -->
<?!= include('ViewPrefsPartial'); ?>
<?!= include('app_theme'); ?>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ARTÍCULOS · pantalla de LECTURA LARGA
   ───────────────────────────────────────────────────────────────────────────
   Es la primera pantalla del sistema pensada para leer y no para operar, y eso
   cambia las reglas: la medida de línea manda sobre el ancho disponible (65
   caracteres, que es donde el ojo salta de renglón sin perderse), el interlineado
   sube a 1.7, y el contraste del cuerpo baja un punto respecto a los títulos para
   que la página no grite. Todo sale de los tokens de app_theme, salvo los pocos
   colores del velo de los diálogos a pantalla completa —que es oscuro en los tres
   temas— y los remiendos de contraste marcados uno a uno más abajo.

   LAS CUATRO MEDIDAS DE ESTA PANTALLA, declaradas una vez y consumidas siempre.
   En rem y no en px porque el ajuste de tamaño de texto (data-textscale) escala el
   font-size del <html>: una columna en px se queda del mismo ancho con la letra un
   19 % más grande, y los títulos del índice acababan partidos en cuatro renglones.
═══════════════════════════════════════════════════════════════════════════ */

.art-wrap{
  --art-medida: 40rem;   /* la columna de lectura: ~68 caracteres con Inter */
  --art-ancho:  54rem;   /* lo que puede ocupar un bloque ancho (tabla, figura, diagrama) */
  --art-indice: 13.5rem; /* el índice lateral */
  --art-canal:  var(--s6);
  --art-tope:   min(1180px, 100%);
}

/* EL BUG QUE DEJABA ESTA PANTALLA FLOTANDO EN MEDIO DE DOS VACÍOS.
   `main` es un ítem flex de `.app-main`, que es una columna, y llevaba
   `margin-inline:auto`: en flexbox, un ítem con LOS DOS márgenes del eje transversal
   en `auto` no recibe el estirado y se queda en su ancho de CONTENIDO. Medido en un
   monitor de 2133 px: la columna daba 1865 px y la pantalla usaba 832, centrados,
   con ~500 px muertos a cada lado y dos columnas de tarjetas donde caben cuatro.

   `width:100%` es el arreglo: con un ancho definido, los márgenes auto vuelven a ser
   lo que querían ser —centrar— en vez de la razón por la que el main se encogía.
   Y el selector lleva `#main-content` a propósito, porque `.app-main > main{max-width:100%}`
   de app_shell se incluye DESPUÉS y ganaba por orden a `.art-wrap{max-width:…}`.
   No lo «limpies»: sin el `#` vuelve el defecto. */
#main-content.art-wrap{
  width:100%;
  max-width:var(--art-tope);
  margin-inline:auto;
  /* El topbar acolcha 1.6rem a los lados (app_shell): el mismo valor aquí es lo que
     alinea el borde del contenido con el del título de arriba. */
  padding:var(--s5) 1.6rem var(--s7);
}
@media (max-width:640px){ #main-content.art-wrap{padding:var(--s4) var(--s4) var(--s6)} }

/* El ÍNDICE de artículos es una rejilla y quiere ancho; la LECTURA es una columna y
   quiere medida. Un solo tope no sirve para las dos, así que cada modo pone el suyo
   (lo conmuta anchoDeModo(), abajo en el JS). 1600 px no es un número redondo: son
   cuatro tarjetas de 388 px más tres huecos de 16, o sea justo antes de que entre una
   quinta columna y las cuatro adelgacen. */
#main-content.art-wrap.es-indice{--art-tope:min(1600px, 100%)}

/* ── Índice de artículos ──
   El <h1> «Artículos» se quitó del cuerpo: el topbar del shell ya pinta uno con ese
   mismo texto (AppShell.mount le pasa el título), y dos encabezados de nivel 1
   idénticos no son una repetición de adorno —quien navega por encabezados los
   encuentra dos veces seguidas—. Se queda la línea que dice para qué sirve esto, que
   es la única que aportaba algo, y un contador que además hace de región viva. */
.art-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  flex-wrap:wrap;margin-bottom:var(--s5)}
.art-hd-sub{color:var(--ink-soft);font-size:var(--fs-md);line-height:1.55;margin:0;max-width:38rem}
.art-hd-cuenta{color:var(--ink-soft);font-size:var(--fs-xs);margin:.4rem 0 0;font-variant-numeric:tabular-nums}

/* auto-FILL y no auto-fit: con dos artículos, auto-fit los estiraría a media pantalla
   cada uno; auto-fill deja las pistas vacías y la tarjeta conserva su tamaño.
   El `min(...,100%)` evita que la pista mínima desborde por la derecha en un móvil
   estrecho, que es lo que hacía el `minmax(300px,1fr)` por debajo de 324 px.
   `align-items:start` es lo que quita el hueco de la tarjeta sin resumen: cada una
   mide lo suyo en vez de estirarse a la altura de la más alta de su fila. */
.art-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(19.5rem,100%),1fr));
  gap:var(--s5) var(--s4);align-items:start;list-style:none;margin:0;padding:0}
.art-lista > li{display:flex;min-width:0}

.art-card{display:flex;flex-direction:column;gap:.45rem;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--rad-lg);
  padding:var(--s4);cursor:pointer;font:inherit;transition:var(--tr)}
.art-card:hover{border-color:var(--brand-soft);transform:translateY(-2px);box-shadow:var(--sh-sm)}
/* El halo de --ring es rosa palidísimo sobre un fondo casi blanco (1.07:1): como la
   tarjeta ES un <button>, ese halo era el ÚNICO indicador de foco de teclado y no se
   veía. Se le pone encima un trazo de --brand, que pasa de 3:1 en los tres temas. */
.art-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px;
  border-color:var(--brand-soft);transform:translateY(-2px);box-shadow:var(--ring),var(--sh-sm)}
.art-card:active{transform:translateY(0) scale(.995)}

/* Orden de lectura y por qué: primero ESTADO y FECHA (¿esto es para mí, sigue vigente?),
   luego el TÍTULO (la decisión), luego el RESUMEN (la confirmación) y al final autor y
   minutos (el coste, que solo importa cuando ya te interesa). */
.art-card-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  font-size:var(--fs-xs);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.art-card-tt{font-family:var(--f-display);font-size:var(--fs-lg);font-weight:var(--fw-bold);
  line-height:1.3;letter-spacing:-.012em;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* El resumen se pinta SIEMPRE, con dos renglones reservados. Dejarlo en blanco cuando
   no lo hay abría un hueco dentro de la caja que se lee como «esto no cargó». */
.art-card-rs{font-size:var(--fs-sm);line-height:1.5;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:calc(2 * 1.5em)}
.art-card-rs.es-hueco{color:var(--ink-faint);font-style:italic}
/* --ink-soft y no --ink-faint: #94A1B2 sobre blanco da 2.6:1, por debajo del 4.5:1 que
   pide un texto de 12 px. El gris más claro se queda para lo que no hay que leer. */
.art-card-pie{display:flex;align-items:baseline;gap:.5rem;margin-top:.25rem;
  padding-top:.55rem;border-top:1px solid var(--line-soft);
  font-size:var(--fs-xs);color:var(--ink-soft)}
.art-card-aut{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.art-card-min{flex:none;color:var(--ink-faint)}
/* El borrador se distingue por TRES canales y el color es el último: la palabra, el
   trazo discontinuo —que sobrevive a la escala de grises y al daltonismo— y el fondo
   hundido. Con solo el chip ámbar, en una rejilla de doce tarjetas no se ve. */
.art-card.es-borrador{border-style:dashed;background:var(--surface-2)}

/* ── El artículo ──
   LA LEY DE ALINEACIÓN, que antes no existía: la medida se fijaba en `.art-cuerpo`
   pero nunca se centraba, así que el texto se pegaba al borde izquierdo de la columna
   que le tocara y dejaba ~500 px de vacío a la derecha. Ahora la cabecera y el cuerpo
   se centran en el MISMO padre, así que comparten centro y borde izquierdo. La misma
   regla arregla de paso el artículo sin índice y la vista previa del editor, que era
   la única que no heredaba el centrado y saltaba al pulsar «Vista previa». */
.art-doc{min-width:0}
.art-doc-hd{max-width:var(--art-medida);margin:0 auto var(--s6);
  padding-bottom:var(--s5);border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2)}
/* Fuera el clamp con `vw`: interpola contra la VENTANA, y la columna ya está topada,
   así que en cualquier escritorio se quedaba clavado en el máximo y la parte fluida
   solo era ruido. Con la columna fija, el tamaño también puede serlo. */
.art-doc-hd h1{font-family:var(--f-display);font-size:2.15rem;font-weight:var(--fw-bold);
  line-height:1.15;letter-spacing:-.024em;color:var(--ink);margin:0}
@media (max-width:640px){ .art-doc-hd h1{font-size:1.7rem} }
.art-doc-rs{font-size:1.05rem;line-height:1.6;color:var(--ink-soft);margin:0}
.art-firma{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin:0;
  font-size:var(--fs-xs);color:var(--ink-soft)}
.art-firma b{color:var(--ink);font-weight:700}
.art-firma .art-sep-punto{color:var(--ink-faint)}

/* El cuerpo: la medida de línea es la regla, no el ancho de la ventana.
   En REM y no en `ch`: `ch` mide el ancho del cero de la fuente ACTIVA, así que
   mientras Inter no ha llegado —o si el CDN de fuentes está bloqueado— se calcula con
   la fuente del sistema y sale una medida distinta. En el iPad se veían renglones de
   730 px, que es media línea de más de lo que el ojo sigue sin perderse. 40rem son
   640 px: unos 68 caracteres con nuestra tipografía.

   Y una rejilla de tres carriles en vez de una caja: el del medio es la MEDIDA y se
   lo queda todo por omisión; el ancho es para lo que se ahoga dentro de una columna de
   lectura —una tabla de siete columnas pegada de Sheets, una captura de pantalla, un
   diagrama de flujo—, que se marcan con [data-ancho] al pintarlas. Ese sobrante ya
   estaba ahí; simplemente no lo usaba nadie. */
.art-cuerpo{display:grid;max-width:var(--art-ancho);margin-inline:auto;
  grid-template-columns:[ancho-i] minmax(0,1fr) [medida-i] minmax(0,var(--art-medida)) [medida-f] minmax(0,1fr) [ancho-f]}
.art-cuerpo > *{grid-column:medida-i/medida-f;min-width:0}
.art-cuerpo > [data-ancho]{grid-column:ancho-i/ancho-f}

/* EL RITMO VERTICAL, y por qué estaba roto. `.art-cuerpo > * + *{margin-top}` daba el
   aire entre bloques, pero `.art-p{margin:0}` venía DESPUÉS con la misma especificidad
   y ganaba: cada párrafo que seguía a un subtítulo quedaba pegado a él y el artículo
   se leía como un muro. Ahora los hijos no ponen margen (arriba, en su regla) y el
   ritmo lo declara el contenedor, una sola vez: MÁS aire antes de un subtítulo que
   después, porque el título y su primer párrafo son un mismo bloque. */
.art-p{font-size:1.02rem;line-height:1.75;color:var(--ink);margin:0}
.art-h2{font-family:var(--f-display);font-size:1.35rem;font-weight:var(--fw-bold);line-height:1.25;
  color:var(--ink);margin:0;letter-spacing:-.014em}
.art-h3{font-family:var(--f-display);font-size:1.1rem;font-weight:var(--fw-semibold);line-height:1.3;
  color:var(--ink);margin:0}
.art-cuerpo > * + *{margin-top:1.25rem}
.art-cuerpo > .art-h2 + *,.art-cuerpo > .art-h3 + *{margin-top:.6rem}
.art-cuerpo > * + .art-h2{margin-top:2.4rem}
.art-cuerpo > * + .art-h3{margin-top:1.9rem}

.art-cuerpo a{color:var(--brand-deep);text-decoration:underline;text-underline-offset:2px;
  text-decoration-thickness:1px}
/* El hover engorda el subrayado y NO cambia el color: pasar a --brand bajaba el
   contraste en vez de subirlo, sobre todo en carbón. */
.art-cuerpo a:hover{text-decoration-thickness:2px}

/* LAS VIÑETAS. El «preflight» de Tailwind (app_tailwind) hace `ul,ol{list-style:none}`,
   así que las listas del artículo se pintaban sin viñeta ni número: cinco puntos se
   leían como cinco párrafos sangrados. Se devuelven aquí, que es donde el artículo
   manda. Y el hueco entre puntos deja de ser `display:flex` —que además estorba al
   marcador— y pasa a ser el margen de cada renglón. */
.art-ul,.art-ol{margin:0;padding-left:1.6rem;display:block}
.art-ul{list-style:disc}
.art-ol{list-style:decimal}
.art-ul li,.art-ol li{font-size:1.02rem;line-height:1.7;color:var(--ink)}
.art-ul li + li,.art-ol li + li{margin-top:.4rem}
.art-ul li::marker,.art-ol li::marker{color:var(--brand)}
.art-sep{border:0;border-top:1px solid var(--line);margin:0}

.art-fig{margin:0}
.art-fig img{display:block;width:100%;height:auto;border-radius:var(--rad-sm);
  border:1px solid var(--line);background:var(--surface-2)}
.art-fig figcaption{font-size:var(--fs-xs);color:var(--ink-soft);margin-top:.5rem;text-align:center}
/* La imagen ampliable es un <button> de verdad y no un <img role="button">: así el
   alt sigue siendo el alt, y el teclado y el foco vienen de serie. */
.art-zoom-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;font:inherit}
.art-zoom-btn:focus-visible{outline:2px solid var(--brand);outline-offset:3px}

/* ── Tablas ───────────────────────────────────────────────────────────────────
   Se desplazan dentro de su caja: una tabla ancha no puede empujar la página entera
   a la derecha, que es lo que rompe la lectura en el móvil.

   La clave está en `width:max-content`, y es lo que faltaba. Con `width:100%` la
   tabla se COMPRIME para caber en la columna de lectura: siete columnas pegadas de
   una hoja de cálculo acababan en tiras de dos centímetros con las palabras partidas
   una por renglón —así se veía la tabla de cumpleaños en el iPad, ilegible—. Ahora la
   tabla pide el ancho que necesita y, si no cabe, se arrastra; el `min-width:100%`
   evita que una tabla de dos columnas quede encogida a la izquierda.

   Las tablas de un artículo casi siempre vienen pegadas de Sheets, así que el ancho
   real lo mandan los datos y no nosotros: por eso `min-width` por celda y `nowrap` en
   los encabezados, que son los que peor se leen partidos. */
.art-tabla-caja{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad-sm);
  -webkit-overflow-scrolling:touch}
.art-tabla{border-collapse:collapse;width:max-content;min-width:100%;font-size:var(--fs-sm)}
.art-tabla th,.art-tabla td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top;white-space:pre-wrap;min-width:7rem;max-width:22rem}
.art-tabla th{background:var(--surface-2);font-weight:700;color:var(--ink);white-space:nowrap}
.art-tabla tr:last-child td{border-bottom:0}
.art-tabla tbody tr{background:var(--surface)}
.art-tabla tbody tr:nth-child(even){background:var(--surface-2)}

/* EL AVISO DE QUE LA TABLA SIGUE. Sin él, una tabla cortada por el borde parece una
   tabla incompleta y nadie prueba a arrastrarla.

   Antes se hacía con cuatro degradados de fondo y `background-attachment:local`, y el
   truco tenía dos defectos que se veían: pintaba sobre el fondo de la CAJA, así que se
   colaba por las filas impares —que son transparentes— como dos rectángulos claros
   encima del texto, muy evidentes en tema carbón; y su color iba escrito a mano
   (rgba(27,35,48,.14)), o sea invisible justo en el tema donde más falta hacía.

   Ahora se dice con palabras y solo cuando de verdad sobra tabla (lo mide
   avisarTablasAnchas después de pintar). Una frase corta gana a un degradado que hay
   que aprender, se lee en los tres temas y la anuncia el lector de pantalla. */
.art-tabla-bloque{min-width:0}
.art-tabla-nota{display:none;font-size:var(--fs-xs);color:var(--ink-soft);margin-top:.45rem}
.art-tabla-bloque.es-ancha .art-tabla-nota{display:block}

/* Documentos incrustados */
.art-doc-emb{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--surface)}
.art-doc-bar{display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;
  background:var(--surface-2);border-bottom:1px solid var(--line);font-size:var(--fs-xs);
  font-weight:700;color:var(--ink-soft)}
.art-doc-bar .ic{width:15px;height:15px;flex:none}
.art-doc-bar .art-doc-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art-doc-emb iframe{display:block;width:100%;height:min(70vh,560px);border:0;background:var(--surface-2)}
/* El aviso va SIEMPRE visible, no solo cuando falla: un iframe de Google al que no
   tienes acceso no avisa de nada —se queda en blanco— y desde fuera no hay forma de
   saberlo. Es la lección del iframe de la revisión, y aquí se repite a propósito. */
.art-doc-nota{padding:.5rem .75rem;font-size:var(--fs-xs);line-height:1.5;color:var(--ink-soft);
  border-top:1px solid var(--line);background:var(--surface)}
.art-doc-nota a{color:var(--brand-deep);font-weight:700}

/* ── VISOR: progreso, índice, zoom ────────────────────────────────────────── */

/* LA BARRA DE PROGRESO DE LECTURA vive ahora en el BORDE INFERIOR DEL TOPBAR, y no
   pegada dentro del contenido. Antes era `sticky` en top:0 con z-index 15… y en top:0
   lo que hay es el topbar del shell: sticky, z-index 40, fondo al 82 % y con desenfoque.
   O sea que la función estaba escrita, se ejecutaba en cada scroll y no la veía nadie.
   Colgada del topbar —que es `sticky`, o sea un elemento posicionado— pinta por encima
   de su fondo sin pelearse con nadie, cruza toda la columna de contenido y no se
   despega nunca, porque el topbar tampoco. El respaldo `sticky` se queda por si algún
   día esta pantalla se usa sin marco. */
.art-progreso{position:sticky;top:var(--top-h,3.75rem);z-index:15;height:3px;
  background:transparent;margin:0 0 var(--s2)}
.topbar > .art-progreso{position:absolute;left:0;right:0;bottom:-1px;top:auto;margin:0;
  z-index:1;pointer-events:none}
/* Nace en scaleX(0): es una barra vacía, no contenido escondido. Si GSAP no llega,
   una barra al 0 % es invisible igual y no falta nada. */
.art-progreso i{display:block;height:100%;background:var(--brand);border-radius:0 2px 2px 0;
  transform:scaleX(0);transform-origin:left center}

/* Lectura con índice. La columna 1 se queda TODO el sobrante y la medida se centra
   dentro de ella (ver .art-doc-hd/.art-cuerpo): antes el sobrante se quedaba en medio
   y el texto acababa a 292 px del índice, que se leía como algo caído en el borde
   derecho de la pantalla en vez de como parte del documento.
   `minmax(0,1fr)` y no `1fr`: es lo que impide que una tabla ancha estire la columna. */
.art-lectura{display:grid;grid-template-columns:minmax(0,1fr) var(--art-indice);
  column-gap:var(--art-canal);align-items:start}
.art-lee-col{min-width:0}
/* La barra de acciones se alinea con la MEDIDA, no con la columna: si no, empieza a un
   sitio y el título a otro. */
.art-lee-barra{max-width:var(--art-medida);margin:0 auto var(--s5);flex-wrap:nowrap;gap:var(--s2)}
.art-lee-der{margin-left:auto;display:flex;gap:var(--s2)}
/* «← Todos los artículos» es NAVEGACIÓN, no una acción: deja de ser un botón con caja
   igual que los otros tres. Cuatro botones fantasma idénticos obligan a leerse las
   cuatro etiquetas para elegir. */
.art-volver{background:none;border:0;padding:.3rem .1rem;font:inherit;font-size:var(--fs-sm);
  font-weight:600;color:var(--ink-soft);cursor:pointer;border-radius:6px}
.art-volver:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.art-volver:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* El índice se pega DEBAJO del topbar —cuya altura publica el shell en --top-h,
   porque cambia con las cuatro escalas de texto y ningún número fijo acierta— y lleva
   su propio tope de alto: un procedimiento con veinte apartados generaba un índice más
   alto que la ventana y los últimos quedaban fuera para siempre, que es exactamente el
   defecto de la barra lateral repetido aquí. */
.art-indice{position:sticky;top:calc(var(--top-h,3.75rem) + var(--s4));
  max-height:calc(100vh - var(--top-h,3.75rem) - var(--s6));
  overflow-y:auto;overscroll-behavior:contain;
  border-left:1px solid var(--line);padding-left:var(--s3)}
.art-indice-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15rem}
/* --ink-soft en reposo: con --ink-faint (2.5:1) el índice entero incumplía contraste y
   solo era legible el enlace bajo el ratón, de uno en uno. */
.art-indice a{display:block;font-size:var(--fs-xs);line-height:1.45;color:var(--ink-soft);
  text-decoration:none;padding:.28rem .35rem;border-radius:6px;border-left:2px solid transparent;
  margin-left:-.35rem;transition:color .15s,border-color .15s,background .15s}
.art-indice a:hover{color:var(--ink);background:var(--surface-2)}
.art-indice a.es-hijo{padding-left:1rem}
.art-indice a.es-aqui{color:var(--brand-deep);border-left-color:var(--brand);font-weight:700}
.art-indice a:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* Cuando el índice no cabe al lado NO desaparece: se pliega y va debajo de la cabecera
   —después de saber de qué va el artículo, antes de empezarlo—. Antes se ocultaba con
   una media query de 1100 px que además medía la ventana y no la columna, así que en un
   portátil de 1366 px (donde de verdad hacen falta 252 px para la barra lateral) el
   índice desaparecía justo donde más falta hace: cuanto menos texto se ve de golpe,
   más se agradece saber por dónde vas. */
.art-doc > .art-indice{position:static;max-height:none;overflow:visible;
  border-left:0;padding:var(--s3) var(--s4);border:1px solid var(--line);
  border-radius:var(--rad);background:var(--surface-2);
  max-width:var(--art-medida);margin:0 auto var(--s5)}
.art-doc > .art-indice > summary{cursor:pointer;margin:0;list-style:none}
.art-doc > .art-indice > summary::-webkit-details-marker{display:none}
.art-doc > .art-indice > summary::after{content:'▾';float:right;color:var(--ink-faint)}
.art-doc > .art-indice[open] > summary{margin-bottom:var(--s2)}
.art-doc > .art-indice[open] > summary::after{content:'▴'}
.art-doc > .art-indice > summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.art-zoom{position:fixed;inset:0;z-index:1300;display:flex;align-items:center;justify-content:center;
  padding:var(--s4);background:rgba(12,14,20,.86);backdrop-filter:blur(3px)}
.art-zoom img{max-width:100%;max-height:92vh;border-radius:var(--rad-sm);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.art-zoom-x{position:absolute;top:var(--s3);right:var(--s3);width:38px;height:38px;border-radius:999px;
  border:0;background:rgba(255,255,255,.92);color:#111;font-size:22px;line-height:1;cursor:pointer}
.art-zoom-x:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ── DIAGRAMAS (draw.io) ──────────────────────────────────────────────────── */
.art-diag{position:relative;background:var(--surface-2)}
.art-diag-frame{display:block;width:100%;border:0;background:var(--surface-2)}
.art-diag.es-full{flex:1;min-height:0}
.art-diag.es-full .art-diag-frame{height:100%}
/* Mientras diagrams.net no ha dicho «init» se ve el fondo del lienzo, no un hueco
   blanco: el marco tarda lo suyo y un rectángulo en blanco parece un fallo. */
.art-diag:not(.is-listo)::after{content:'Cargando el diagrama…';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);
  color:var(--ink-faint);pointer-events:none}
.art-diag.sin-red::after{content:none}
.art-diag-nota{padding:var(--s3);font-size:var(--fs-xs);line-height:1.55;color:var(--warn);
  background:var(--warn-bg)}
.art-diag-ampliar{font:inherit;font-size:var(--fs-xs);font-weight:700;color:var(--brand-deep);
  background:none;border:0;cursor:pointer;padding:.1rem .2rem;border-radius:4px}
.art-diag-ampliar:hover{text-decoration:underline}
.art-diag-ampliar:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.art-diag-full{position:fixed;inset:0;z-index:1300;display:flex;flex-direction:column;
  background:rgba(12,14,20,.9);backdrop-filter:blur(3px);padding:var(--s3)}
.art-diag-full-bar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:0 0 var(--s2);color:#fff}
.art-diag-full-tt{font-family:var(--f-display);font-weight:var(--fw-bold);font-size:1.05rem;color:#fff;flex:1;min-width:0}
.art-diag-full-bar .art-ayuda{color:rgba(255,255,255,.72);margin:0}
/* El fondo, que faltaba: `.v-btn-ghost` trae `background:var(--surface)`, que en los dos
   temas CLAROS es blanco puro. Con `color:#fff` encima, el único botón de cerrar de los
   cuatro diálogos a pantalla completa quedaba en blanco sobre blanco (1:1) y solo
   reaparecía al pasar el ratón. En carbón funcionaba por casualidad.
   Aquí el color va a mano a propósito y no por descuido: el velo es oscuro en los tres
   temas, así que un token de superficie sería justo lo que rompe esta barra. */
.art-diag-full-bar .v-btn-ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.45)}
.art-diag-full-bar .v-btn-ghost:hover{background:rgba(255,255,255,.26);color:#fff}
.art-diag-full-bar .v-btn-ghost:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:none}
.art-diag-full .art-diag{border-radius:var(--rad);overflow:hidden;background:var(--surface)}
/* El documento a pantalla completa usa el MISMO fondo y la misma barra que el diagrama:
   es el mismo gesto y tiene que sentirse igual; solo cambia lo que va dentro del marco. */
.art-doc-full-marco{flex:1;min-height:0;border-radius:var(--rad);overflow:hidden;background:var(--surface-2)}
.art-doc-full-marco iframe{display:block;width:100%;height:100%;border:0}
.art-diag-full-bar a{color:#fff;font-weight:700;text-decoration:underline}

.art-diag-hueco{margin-bottom:.2rem}
.art-diag-vacio{display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:.2rem;padding:var(--s5) var(--s3);border:1px dashed var(--line);border-radius:var(--rad);
  background:var(--surface-2);color:var(--ink-soft)}
.art-diag-vacio .ic{width:26px;height:26px;opacity:.6;margin-bottom:.2rem}

/* ═══════════════════════════════════════════════════════════════════════════
   EDITOR
   ───────────────────────────────────────────────────────────────────────────
   La idea que ordena todo el rediseño: EL EDITOR SE PARECE AL ARTÍCULO.

   La primera versión pintaba cada bloque en una caja gris idéntica con su
   rótulo encima —un párrafo, un subtítulo y una tabla se veían igual—, así que
   para saber cómo iba a quedar el artículo había que imaginárselo. Aquí cada
   bloque se escribe con LA MISMA tipografía con la que se va a leer: el
   subtítulo se teclea grande y en Archivo, el párrafo con su medida y su
   interlineado de lectura. No es adorno; es lo que quita el paso de imaginar.

   El «chrome» del bloque —el rótulo del tipo y los botones de mover y quitar—
   aparece al pasar el ratón o al enfocar, y desaparece el resto del tiempo. Con
   el chrome siempre visible, el lienzo se lee como un formulario; sin él, se lee
   como lo que es: un artículo a medio escribir.
═══════════════════════════════════════════════════════════════════════════ */

/* Barra de trabajo: lo que hay que saber SIEMPRE (dónde estoy, si está guardado)
   y la única acción primaria. Se queda pegada arriba porque en un artículo largo
   se escribe lejos del principio, y bajar a buscar «Guardar» rompe la escritura. */
/* Se pega DEBAJO del topbar, no en top:0. Con top:0 se metía justo debajo de la barra
   de arriba (sticky, z-index 40) y desaparecía al hacer scroll: es decir, el botón
   «Guardar» se iba de la pantalla exactamente en el caso que este comentario dice
   querer evitar. La altura la publica el shell en --top-h porque cambia con la escala
   de texto. Y el fondo pasa a ser el del propio topbar: --content-bg pintaba una banda
   #F7F9FB sobre una página #EEF1F5 que no encajaba con nada. */
.art-barra{position:sticky;top:var(--top-h,3.75rem);z-index:20;display:flex;align-items:center;gap:var(--s3);
  flex-wrap:wrap;padding:var(--s2) 0;margin-bottom:var(--s4);
  background:var(--top-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.art-barra-izq{display:flex;align-items:center;gap:var(--s2);min-width:0}
.art-barra-der{display:flex;align-items:center;gap:var(--s2);margin-left:auto}
.art-estado{display:inline-flex;align-items:center;gap:.35rem;font-size:var(--fs-xs);
  font-weight:600;color:var(--ink-faint);white-space:nowrap}
.art-estado::before{content:'';width:7px;height:7px;border-radius:999px;background:currentColor;flex:none}
.art-estado.guardado{color:var(--ok)}
.art-estado.sucio{color:var(--warn)}

.art-editor{display:grid;grid-template-columns:minmax(0,1fr) 16.25rem;gap:var(--s5);align-items:start}
@media (max-width:1040px){ .art-editor{grid-template-columns:minmax(0,1fr)} }

/* El lienzo: mismo ancho de lectura que el artículo publicado, y centrado en su
   columna. Pegado a la izquierda dejaba un vacío raro a la derecha en pantallas
   anchas y el texto se leía descolgado del panel. */
.art-lienzo{max-width:40rem;margin-inline:auto}

/* Cabecera: el título del artículo se escribe con el tamaño del título. */
.art-campo-titulo{width:100%;font-family:var(--f-display);
  font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);font-weight:var(--fw-bold);line-height:1.15;
  letter-spacing:-.02em;color:var(--ink);background:transparent;border:0;padding:0;margin:0}
.art-campo-titulo::placeholder{color:var(--ink-faint);opacity:.55}
.art-campo-resumen{width:100%;font:inherit;font-size:1.05rem;line-height:1.6;color:var(--ink-soft);
  background:transparent;border:0;padding:0;margin:.6rem 0 0;resize:none;overflow:hidden}
.art-campo-resumen::placeholder{color:var(--ink-faint);opacity:.7}
.art-campo-titulo:focus,.art-campo-resumen:focus{outline:none}
.art-cabecera{padding-bottom:var(--s3);border-bottom:1px solid var(--line);margin-bottom:var(--s2)}
/* El foco se marca con una guía a la izquierda y no con un recuadro: un recuadro
   alrededor del título convierte el lienzo en un formulario otra vez. */
.art-cabecera:focus-within{box-shadow:-12px 0 0 -10px var(--brand)}

.art-bloques{display:flex;flex-direction:column}

.art-bloque{position:relative;padding:.5rem 0;border-radius:var(--rad-sm);transition:background .15s}
.art-bloque:focus-within{background:var(--surface-2)}
.art-bloque:focus-within,.art-bloque:hover{box-shadow:-12px 0 0 -10px var(--brand-soft)}
.art-bloque:focus-within{box-shadow:-12px 0 0 -10px var(--brand)}

/* Chrome del bloque: en el MARGEN IZQUIERDO, fuera del texto, y solo cuando hace falta.
   Primero se puso arriba a la derecha, dentro de la caja, y tapaba las últimas palabras
   de la primera línea justo al enfocar el bloque —o sea, exactamente cuando se está
   escribiendo ahí—. Reservarle sitio dentro habría estrechado la medida de lectura, y
   empujar el contenido al aparecer habría hecho saltar el texto bajo el cursor. En el
   margen no estorba a nada, que es donde lo ponen los editores por bloques.

   El rótulo del tipo se quitó a la vez: si el editor se parece al artículo —y de eso va
   este rediseño—, un subtítulo ya se ve que es un subtítulo y la etiqueta sobra. Los
   botones llevan su `aria-label`, así que para el lector de pantalla no se pierde nada. */
.art-bloque-hd{position:absolute;top:.35rem;left:-2.3rem;display:flex;flex-direction:column;gap:.2rem;
  opacity:0;transform:translateX(3px);transition:opacity .15s,transform .15s;pointer-events:none}
.art-bloque:hover .art-bloque-hd,.art-bloque:focus-within .art-bloque-hd{opacity:1;transform:none;pointer-events:auto}
.art-bloque-tipo{display:none}
.art-bloque-ac{display:flex;flex-direction:column;gap:.2rem}
.art-bloque-ac button{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;
  color:var(--ink-faint);transition:var(--tr)}
.art-bloque-ac button:hover:not(:disabled){border-color:var(--brand-soft);color:var(--brand-deep);background:var(--brand-tint)}
.art-bloque-ac button:disabled{opacity:.3;cursor:default}
.art-bloque-ac button:focus-visible{outline:2px solid var(--brand);outline-offset:1px;box-shadow:var(--ring)}
.art-bloque-ac .ic{width:13px;height:13px}
.art-bloque-ac .ic.es-arriba{transform:rotate(180deg)}

/* Los campos del lienzo no parecen campos: parecen el texto que van a ser. */
.art-esc{width:100%;font:inherit;background:transparent;border:0;padding:0;margin:0;resize:none;
  color:var(--ink);overflow:hidden}
.art-esc:focus{outline:none}
.art-esc::placeholder{color:var(--ink-faint);opacity:.6}
.art-esc.es-parrafo{font-size:1.02rem;line-height:1.75}
/* Los subtítulos respiran arriba como en el artículo: son la señal de que empieza
   otra parte, y sin ese aire el lienzo se lee como una lista de campos. */
.art-esc.es-titulo2{font-family:var(--f-display);font-size:1.35rem;font-weight:var(--fw-bold);line-height:1.25;letter-spacing:-.01em}
.art-esc.es-titulo3{font-family:var(--f-display);font-size:1.1rem;font-weight:700;line-height:1.3}
.art-bloque:has(.es-titulo2),.art-bloque:has(.es-titulo3){margin-top:1.2rem}
/* Un textarea no puede llevar viñetas, así que la lista se señala con una guía a la
   izquierda: sin ella, cinco renglones sueltos no se distinguen de cinco párrafos. */
.art-esc.es-lista{font-size:1.02rem;line-height:1.7;border-left:2px solid var(--line);
  padding-left:.7rem}
.art-bloque:focus-within .art-esc.es-lista{border-left-color:var(--brand-soft)}
.art-esc.es-mono{font-family:var(--f-mono);font-size:.82rem;line-height:1.6;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--rad-sm);padding:.5rem .6rem}

/* Los campos accesorios (enlace, pie, alt) sí son campos, y se ven como tales,
   pero en gris y pequeños: son ajustes, no el contenido. */
.art-sub{display:flex;flex-direction:column;gap:.35rem;margin-top:.5rem}
/* Y los que son OPCIONALES —el enlace de un párrafo, el nivel de un subtítulo, si la
   lista va numerada— se esconden hasta que el bloque tiene el foco. Con ellos siempre
   a la vista, cada párrafo arrastraba un campo vacío debajo y el lienzo volvía a
   parecer un formulario, que es justo lo que este rediseño vino a quitar. Siguen
   visibles si ya llevan algo escrito (`:has`), para que nada quede escondido; donde
   `:has` no exista, se ven al enfocar, que es cuando hacen falta. */
.art-sub-op{display:none}
.art-bloque:focus-within .art-sub-op{display:flex}
.art-sub-op:has(input[type=text]:not(:placeholder-shown)){display:flex}
.art-sub-op:has(input[type=checkbox]:checked){display:flex}
.art-sub input[type=text]{width:100%;font:inherit;font-size:var(--fs-xs);color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--rad-sm);padding:.35rem .55rem}
.art-sub input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.art-esc:focus-visible,.art-campo-titulo:focus-visible,.art-campo-resumen:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
.art-ayuda{font-size:var(--fs-xs);color:var(--ink-soft);margin:.3rem 0 0;line-height:1.5}
.art-ayuda b{color:var(--ink-soft);font-weight:700}

/* Insertar ENTRE bloques: la línea aparece al acercarse. Es donde la gente
   quiere añadir algo —justo aquí, no al final— y evita el viaje al panel. */
.art-entre{position:relative;height:14px;display:flex;align-items:center;justify-content:center}
.art-entre::before{content:'';position:absolute;left:0;right:0;height:1px;background:var(--brand-soft);
  opacity:0;transition:opacity .15s}
.art-entre:hover::before,.art-entre:focus-within::before{opacity:1}
.art-mas{width:22px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;transition:opacity .15s,transform .15s;font-size:15px;line-height:1;padding:0}
.art-entre:hover .art-mas,.art-entre:focus-within .art-mas{opacity:1}
.art-mas:hover{border-color:var(--brand);color:var(--brand-deep);transform:scale(1.1)}
.art-mas:focus-visible{opacity:1;outline:2px solid var(--brand);outline-offset:2px}

/* Panel lateral: contexto y herramientas, nunca la acción primaria.
   Las cajas eran blancas sobre un fondo casi blanco (`--surface` #FFF sobre
   `--content-bg` #F7F9FB) con un borde de 1 px que a esa distancia no se ve: en el
   iPad los rótulos en mayúsculas parecían flotar sueltos por la derecha, sin caja
   que los contuviera, y el panel se leía como cuatro trozos sin relación. Ahora la
   caja va en el tono de superficie secundaria, que es el mecanismo que el proyecto ya
   usa para «esto es un apartado», y el borde se refuerza. Un solo mecanismo de
   separación: fondo. Nada de fondo + borde fuerte + sombra a la vez. */
.art-panel{position:sticky;top:calc(var(--top-h,3.75rem) + var(--s5));display:flex;flex-direction:column;gap:var(--s3)}
.art-panel-caja{border:1px solid var(--line);border-radius:var(--rad);
  background:var(--surface-2);padding:var(--s3)}
.art-panel-t{font-size:var(--fs-xs);font-weight:var(--fw-bold);text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);margin:0 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}

/* Ficha de estado: cifras tabulares para que no bailen al escribir. */
.art-cifras{display:flex;flex-direction:column;gap:.4rem}
.art-cifra{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);
  font-size:var(--fs-xs);color:var(--ink-soft)}
.art-cifra b{font-size:var(--fs-sm);font-weight:var(--fw-bold);color:var(--ink);font-variant-numeric:tabular-nums}

.art-insertar{display:flex;flex-direction:column;gap:.2rem}
.art-insertar button{display:flex;align-items:center;gap:.5rem;padding:.45rem .5rem;font:inherit;
  font-size:var(--fs-sm);font-weight:600;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--rad-sm);cursor:pointer;text-align:left;width:100%;
  transition:var(--tr)}
.art-insertar button:hover{border-color:var(--brand-soft);background:var(--brand-tint);color:var(--brand-deep)}
.art-insertar button:focus-visible{outline:2px solid var(--brand);outline-offset:1px;box-shadow:var(--ring)}
.art-insertar .ic{width:15px;height:15px;flex:none;color:var(--ink-faint)}
.art-insertar button:hover .ic{color:var(--brand-deep)}
.art-insertar .art-atajo{margin-left:auto;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:4px;padding:0 .25rem}

/* Menú flotante de inserción (el que abre el «+» entre bloques).
   `fixed` y no `absolute`: se coloca con las coordenadas de `getBoundingClientRect`,
   que ya son relativas a la ventana. Con `absolute` había que sumarle el scroll, y
   dentro del iframe de Apps Script quien scrollea no siempre es el `body`, así que el
   menú aparecía despegado del «+» que lo abrió. */
.art-menu{position:fixed;z-index:30;min-width:13.125rem;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh-lg,0 20px 40px rgba(0,0,0,.18));
  padding:.35rem;display:flex;flex-direction:column;gap:.1rem}
.art-menu button{display:flex;align-items:center;gap:.5rem;padding:.45rem .5rem;font:inherit;
  font-size:var(--fs-sm);font-weight:600;color:var(--ink);background:transparent;border:0;
  border-radius:var(--rad-sm);cursor:pointer;text-align:left;width:100%}
.art-menu button:hover{background:var(--brand-tint);color:var(--brand-deep)}
.art-menu button:focus-visible{background:var(--brand-tint);color:var(--brand-deep);outline:2px solid var(--brand);outline-offset:-2px}
.art-menu .ic{width:15px;height:15px;flex:none;color:var(--ink-faint)}
.art-menu small{display:block;font-size:var(--fs-xs);font-weight:500;color:var(--ink-soft)}

/* Vista previa dentro del editor: el artículo tal cual, sin salir de la pantalla. */
.art-previa{border:1px dashed var(--brand-soft);border-radius:var(--rad);padding:var(--s4);
  background:var(--surface)}
.art-previa-nota{font-size:var(--fs-xs);font-weight:700;color:var(--brand-deep);
  text-transform:uppercase;letter-spacing:.06em;margin:0 0 var(--s3)}

/* Por debajo de 1200px el margen del lienzo ya no da para el chrome, así que vuelve
   al flujo, en fila y arriba a la derecha. Y sin hover que valga: en una pantalla
   táctil no existe «pasar el ratón», así que lo que solo aparece al pasar, no existe. */
@media (max-width:1200px){
  .art-bloque-hd{opacity:1;transform:none;pointer-events:auto;position:static;
    flex-direction:row;justify-content:flex-end;margin-bottom:.3rem}
  .art-bloque-ac{flex-direction:row}
  .art-mas{opacity:1}
  .art-sub-op{display:flex}
}
@media (max-width:1040px){
  .art-panel{position:static}
}

.art-vacio{text-align:center;padding:var(--s6) var(--s4);color:var(--ink-soft);
  max-width:34rem;margin-inline:auto;border:1px dashed var(--line);
  border-radius:var(--rad-lg);background:var(--surface)}
.art-vacio-ac{justify-content:center;margin-top:var(--s4)}
.art-vacio .ic{width:30px;height:30px;opacity:.5;margin:0 auto var(--s2);display:block}
.art-vacio-t{font-size:var(--fs-md);font-weight:700;color:var(--ink-soft);margin-bottom:.35rem}
.art-vacio-s{font-size:var(--fs-sm);line-height:1.55;max-width:26rem;margin-inline:auto;color:var(--ink-soft)}

.art-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:var(--fs-xs);font-weight:700;
  border-radius:999px;padding:.15rem .5rem;white-space:nowrap}
.art-badge.borrador{background:var(--warn-bg);color:var(--warn)}

<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
     ARTÍCULOS — lector y editor de la misma vista
     ───────────────────────────────────────────────────────────────────────
     LA DECISIÓN TÉCNICA, declarada antes de escribir (la fase la pedía):

     El editor es un FORMULARIO POR BLOQUES, no un `contenteditable`.

     Un contenteditable produce el HTML que se le antoje al navegador —y cada
     navegador el suyo—, así que guardarlo obliga a limpiar HTML ajeno, que es
     precisamente el trabajo que nadie gana. Con un campo por bloque, lo que se
     escribe es TEXTO y lo que se guarda es un objeto de forma conocida: no hay
     ningún punto del camino donde el contenido pueda convertirse en marcado.
     Se paga con un editor menos «de revista» —no se escribe en negrita a mitad
     de frase—, y a cambio el artículo se pinta igual dentro y fuera, hoy y
     cuando el modelo cambie de versión.

     Y el pintado NUNCA usa innerHTML con contenido del artículo: cada bloque se
     construye con createElement y textContent. Es la otra mitad de lo mismo.
  ═══════════════════════════════════════════════════════════════════════ */

  function icono(nombre){
    var svg = document.createElement('span');
    svg.setAttribute('data-icon', nombre);
    svg.className = 'ic';
    return svg;
  }
  /** Crea un elemento con texto. El texto SIEMPRE por textContent: es la regla. */
  function el(tag, clase, texto){
    var n = document.createElement(tag);
    if (clase) n.className = clase;
    if (texto != null) n.textContent = String(texto);
    return n;
  }

  /* ── URLs seguras, del lado del cliente ────────────────────────────────
     El servidor ya sanea al guardar (artUrlSegura_), pero el cliente pinta
     también lo que tiene en memoria mientras se edita, y una copia local vieja
     podría traer cualquier cosa. Es la misma regla escrita dos veces a
     propósito: solo https, y ninguna de las formas de disfrazar otra cosa. */
  function urlSegura(u){
    var s = String(u == null ? '' : u).trim();
    if (!/^https:\/\/[^\s"'<>]+$/i.test(s)) return '';
    return s.length > 2000 ? '' : s;
  }

  var DOC_VISOR = {
    documento:    { ruta: 'document',     nombre: 'Documento de Google',    icono: 'document' },
    presentacion: { ruta: 'presentation', nombre: 'Presentación de Google', icono: 'presentation' },
    hoja:         { ruta: 'spreadsheets', nombre: 'Hoja de cálculo',        icono: 'chart' },
    archivo:      { ruta: 'file',         nombre: 'Archivo de Drive',       icono: 'document' }
  };
  function urlVisor(clase, docId){
    var f = DOC_VISOR[clase] || DOC_VISOR.archivo;
    return 'https://docs.google.com/' + f.ruta + '/d/' + encodeURIComponent(docId) + '/preview';
  }
  function urlAbrir(clase, docId){
    var f = DOC_VISOR[clase] || DOC_VISOR.archivo;
    var base = f.ruta === 'file' ? 'https://drive.google.com/file/d/' : 'https://docs.google.com/' + f.ruta + '/d/';
    return base + encodeURIComponent(docId) + (f.ruta === 'file' ? '/view' : '/edit');
  }
  /** Extrae {clase, docId} de una URL pegada de Google. Gemela de artDocDeUrl_ del servidor. */
  function docDeUrl(url){
    var s = String(url || '').trim();
    if (!/^https:\/\/(docs|drive)\.google\.com\//i.test(s)) return null;
    var m = s.match(/\/(document|presentation|spreadsheets|file)\/d\/([a-zA-Z0-9_-]{10,})/);
    if (!m) return null;
    var clase = m[1] === 'document' ? 'documento'
              : m[1] === 'presentation' ? 'presentacion'
              : m[1] === 'spreadsheets' ? 'hoja' : 'archivo';
    return { clase: clase, docId: m[2] };
  }

  /* ── Parser de pegado tabular (TSV) ────────────────────────────────────
     Gemelo del de portal_contenido.html: mismas comillas, mismos saltos. No se
     comparte todavía porque aquel vive dentro del <script> de su pantalla y
     moverlo a un include obliga a tocar y volver a probar esa pantalla; queda
     anotado como deuda con nombre. Si se toca uno, se tocan los dos. */
  function parsearTSV(texto){
    var filas = [], celda = '', fila = [], enComillas = false;
    var t = String(texto || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (enComillas) {
        if (ch === '"') {
          if (t[i + 1] === '"') { celda += '"'; i++; }
          else enComillas = false;
        } else celda += ch;
      } else if (ch === '"') enComillas = true;
      else if (ch === '\t') { fila.push(celda); celda = ''; }
      else if (ch === '\n') { fila.push(celda); filas.push(fila); fila = []; celda = ''; }
      else celda += ch;
    }
    if (celda !== '' || fila.length) { fila.push(celda); filas.push(fila); }
    return filas.filter(function (f) { return f.some(function (c) { return String(c).trim() !== ''; }); });
  }

  /* ═══════════════════════════════════════════════════════════════════════
     PINTAR UN ARTÍCULO (lector)
     Cada bloque se construye a mano. Ni un innerHTML con contenido del artículo.
  ═══════════════════════════════════════════════════════════════════════ */

  /** Un párrafo: nodos de texto y <a> con href ya validado. */
  function pintarPartes(destino, partes){
    (partes || []).forEach(function (p){
      var txt = String(p.t == null ? '' : p.t);
      var url = urlSegura(p.url);
      if (!url) { destino.appendChild(document.createTextNode(txt)); return; }
      var a = el('a', null, txt);
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      destino.appendChild(a);
    });
  }

  function pintarBloque(b){
    if (b.tipo === 'titulo') return el(b.nivel === 3 ? 'h3' : 'h2', b.nivel === 3 ? 'art-h3' : 'art-h2', b.texto);

    if (b.tipo === 'texto') {
      var p = el('p', 'art-p');
      pintarPartes(p, b.partes);
      return p;
    }

    if (b.tipo === 'lista') {
      var lista = el(b.ordenada ? 'ol' : 'ul', b.ordenada ? 'art-ol' : 'art-ul');
      (b.items || []).forEach(function (partes){
        var li = document.createElement('li');
        pintarPartes(li, partes);
        lista.appendChild(li);
      });
      return lista;
    }

    if (b.tipo === 'imagen') {
      var url = urlSegura(b.url);
      if (!url) return null;
      var fig = el('figure', 'art-fig');
      var img = document.createElement('img');
      img.src = url;
      img.alt = String(b.alt || '');
      img.loading = 'lazy';
      fig.appendChild(img);
      if (b.pie) fig.appendChild(el('figcaption', null, b.pie));
      return fig;
    }

    if (b.tipo === 'tabla') {
      var caja = el('div', 'art-tabla-caja');
      var tabla = el('table', 'art-tabla');
      var filas = b.filas || [];
      var desde = 0;
      if (b.encabezado !== false && filas.length) {
        var thead = document.createElement('thead');
        var trh = document.createElement('tr');
        (filas[0] || []).forEach(function (c){ trh.appendChild(el('th', null, c)); });
        thead.appendChild(trh);
        tabla.appendChild(thead);
        desde = 1;
      }
      var tbody = document.createElement('tbody');
      for (var i = desde; i < filas.length; i++) {
        var tr = document.createElement('tr');
        (filas[i] || []).forEach(function (c){ tr.appendChild(el('td', null, c)); });
        tbody.appendChild(tr);
      }
      tabla.appendChild(tbody);
      caja.appendChild(tabla);
      /* La caja que se arrastra va dentro de un bloque, para que el aviso de «sigue a
         la derecha» pueda ser un hermano suyo y no viaje con el desplazamiento. */
      var bloqueT = el('div', 'art-tabla-bloque');
      bloqueT.appendChild(caja);
      bloqueT.appendChild(el('div', 'art-tabla-nota', 'La tabla sigue a la derecha: arrástrala para ver el resto.'));
      return bloqueT;
    }

    if (b.tipo === 'documento') {
      var ficha = DOC_VISOR[b.clase] || DOC_VISOR.archivo;
      var caja2 = el('div', 'art-doc-emb');

      var barra = el('div', 'art-doc-bar');
      barra.appendChild(icono(ficha.icono));
      barra.appendChild(el('span', 'art-doc-tt', b.titulo || ficha.nombre));
      /* PANTALLA COMPLETA, que es lo que pide T8.3 y lo que pide el sentido común: una
         presentación o una hoja de cálculo dentro de la columna de lectura de un artículo
         se ve a media escala, y el recurso de «abrir en Google» saca al lector del artículo
         y de su sitio. El diagrama y la imagen ya lo tenían; el documento incrustado —que
         es justo el bloque que más falta le hace— se había quedado sin él. */
      var ampliarDoc = el('button', 'art-diag-ampliar', 'Pantalla completa');
      ampliarDoc.type = 'button';
      ampliarDoc.addEventListener('click', function (){ abrirDocumentoGrande(b); });
      barra.appendChild(ampliarDoc);

      var abrir = el('a', null, 'Abrir en Google');
      abrir.href = urlAbrir(b.clase, b.docId);
      abrir.target = '_blank';
      abrir.rel = 'noopener noreferrer';
      abrir.style.color = 'var(--brand-deep)';
      abrir.style.fontWeight = '700';
      barra.appendChild(abrir);
      caja2.appendChild(barra);

      var fr = document.createElement('iframe');
      fr.src = urlVisor(b.clase, b.docId);
      fr.title = b.titulo || ficha.nombre;
      fr.setAttribute('referrerpolicy', 'no-referrer');
      fr.setAttribute('loading', 'lazy');
      caja2.appendChild(fr);

      /* El aviso va SIEMPRE, no solo si falla. Un documento de Drive al que no
         tienes permiso se queda en blanco dentro del marco y no avisa de nada:
         desde fuera no hay forma de distinguirlo de «está cargando». Decirlo
         antes evita el rato de mirar un rectángulo vacío pensando que es lento. */
      var nota = el('div', 'art-doc-nota');
      nota.appendChild(document.createTextNode(
        'Si el recuadro se queda en blanco es que tu cuenta no tiene permiso sobre este documento: ' +
        'los permisos los da Drive, no el Portal. Pídeselos a quien lo compartió, o '));
      var abrir2 = el('a', null, 'ábrelo en Google');
      abrir2.href = urlAbrir(b.clase, b.docId);
      abrir2.target = '_blank';
      abrir2.rel = 'noopener noreferrer';
      nota.appendChild(abrir2);
      nota.appendChild(document.createTextNode(' para ver el motivo exacto.'));
      caja2.appendChild(nota);
      return caja2;
    }

    if (b.tipo === 'diagrama') return cajaDiagrama(b, false);

    if (b.tipo === 'separador') return el('hr', 'art-sep');
    return null;   // tipo desconocido: no se pinta y no se rompe nada
  }

  /* ═══════════════════════════════════════════════════════════════════════
     DIAGRAMAS · draw.io (diagrams.net), incrustado
     ───────────────────────────────────────────────────────────────────────
     Se guarda el XML del diagrama y se dibuja dentro de un IFRAME de
     diagrams.net, nunca en nuestro DOM. Dos motivos, y el segundo es el que
     manda: un diagrama exportado a SVG trae `foreignObject`, estilos y a veces
     guiones, así que meterlo en la página sería justo lo que el resto de esta
     fase evita; dentro del iframe, por mucho que traiga, se queda ahí.

     El mismo componente sirve para leer y para editar: cambia el `chrome`. Así
     lo que se ve mientras se dibuja es exactamente lo que verá quien lea.

     La conversación con el iframe es la documentada por diagrams.net
     (`proto=json`): él avisa con `init` cuando está listo, nosotros mandamos el
     XML, y él devuelve `save` y `exit`. Se comprueba SIEMPRE el `origin`: un
     `message` puede mandarlo cualquier ventana, y este maneja el contenido de un
     artículo del equipo. */
  var DRAWIO = 'https://embed.diagrams.net';

  function urlDrawio(editable){
    // ui=min y spin=1 vienen del manual de diagrams.net; lang=es porque el equipo
    // trabaja en español y el editor tiene traducción completa.
    return DRAWIO + '/?embed=1&proto=json&spin=1&lang=es&ui=min&libraries=1'
      + (editable ? '&chrome=1&modified=unsavedChanges&saveAndExit=1&noExitBtn=0' : '&chrome=0&lightbox=1');
  }

  /**
   * Monta un diagrama. Devuelve {el, destruir}.
   * @param {object} b     bloque {xml, titulo, alto}
   * @param {boolean} edit si true, el iframe trae las herramientas de dibujo
   * @param {function=} alGuardar  recibe el XML nuevo (solo en modo edición)
   */
  function montarDiagrama(b, edit, alGuardar){
    var caja = el('div', 'art-diag');
    var fr = document.createElement('iframe');
    fr.className = 'art-diag-frame';
    fr.title = b.titulo || 'Diagrama';
    fr.setAttribute('referrerpolicy', 'no-referrer');
    /* alto:0 marca pantalla completa: no se fija un alto en línea porque un `style.height`
       en línea gana siempre sobre `.art-diag.es-full .art-diag-frame{height:100%}`, y el
       marco se quedaba a 420 px dentro del overlay en vez de llenarlo. */
    if (Number(b.alto)) fr.style.height = Number(b.alto) + 'px';

    /* Aviso de red bloqueada. diagrams.net es un dominio externo, igual que el CDN
       de GSAP, y en esta red corporativa a veces no pasa. Si a los seis segundos no
       ha dicho `init`, el marco vacío no explica nada: se dice qué pasó y se ofrece
       lo único que queda, que es el propio XML para abrirlo por fuera. */
    var listo = false;
    var reloj = setTimeout(function (){
      if (listo) return;
      caja.classList.add('sin-red');
      var nota = el('div', 'art-diag-nota',
        'No pudimos cargar el editor de diagramas (diagrams.net). Puede ser la red de la oficina. ' +
        'El diagrama sigue guardado: vuelve a intentarlo más tarde o ábrelo desde app.diagrams.net.');
      caja.appendChild(nota);
    }, 6000);

    function alMensaje(e){
      if (e.origin !== DRAWIO) return;                 // solo hablamos con él
      if (e.source !== fr.contentWindow) return;       // y solo con ESTE marco
      var msg = null;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (!msg || !msg.event) return;

      if (msg.event === 'init') {
        listo = true;
        clearTimeout(reloj);
        caja.classList.add('is-listo');
        fr.contentWindow.postMessage(JSON.stringify({
          action: 'load', autosave: 0, xml: b.xml || ''
        }), DRAWIO);
        return;
      }
      if (msg.event === 'save' && edit && typeof alGuardar === 'function') {
        alGuardar(String(msg.xml || ''));
        return;
      }
      if (msg.event === 'exit' && edit && typeof alGuardar === 'function') {
        alGuardar(null);   // salir sin guardar
      }
    }
    window.addEventListener('message', alMensaje);

    fr.src = urlDrawio(edit);
    caja.appendChild(fr);

    return {
      el: caja,
      destruir: function (){
        clearTimeout(reloj);
        window.removeEventListener('message', alMensaje);
        if (fr.parentNode) fr.parentNode.removeChild(fr);
      }
    };
  }

  /** El bloque de diagrama tal como se ve al LEER: barra, lienzo y pantalla completa. */
  function cajaDiagrama(b, edit){
    var caja = el('div', 'art-doc-emb art-diag-caja');

    var barra = el('div', 'art-doc-bar');
    barra.appendChild(icono('layers'));
    barra.appendChild(el('span', 'art-doc-tt', b.titulo || 'Diagrama'));
    var ampliar = el('button', 'art-diag-ampliar', 'Pantalla completa');
    ampliar.type = 'button';
    ampliar.addEventListener('click', function (){ abrirDiagramaGrande(b); });
    barra.appendChild(ampliar);
    caja.appendChild(barra);

    var montaje = montarDiagrama(b, edit === true, null);
    caja.appendChild(montaje.el);
    return caja;
  }

  /* Pantalla completa: un diagrama de flujo con quince cajas no se lee en 420 px de
     alto, y hacer zoom con la rueda dentro del artículo pelea con el scroll de la
     página. Aquí se abre grande, y al cerrar el foco vuelve a donde estaba. */
  function abrirDiagramaGrande(b){
    var overlay = el('div', 'art-diag-full');
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', b.titulo || 'Diagrama');
    var quienAbrio = document.activeElement;

    var barra = el('div', 'art-diag-full-bar');
    barra.appendChild(el('span', 'art-diag-full-tt', b.titulo || 'Diagrama'));
    var cerrar = el('button', 'v-btn v-btn-ghost', 'Cerrar');
    cerrar.type = 'button';
    barra.appendChild(cerrar);
    overlay.appendChild(barra);

    var montaje = montarDiagrama({ xml: b.xml, titulo: b.titulo, alto: 0 }, false, null);
    montaje.el.classList.add('es-full');
    overlay.appendChild(montaje.el);
    document.body.appendChild(overlay);

    function fuera(){
      montaje.destruir();
      document.removeEventListener('keydown', porEsc);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (quienAbrio && quienAbrio.focus) quienAbrio.focus();
    }
    function porEsc(e){ if (e.key === 'Escape') fuera(); }
    cerrar.addEventListener('click', fuera);
    overlay.addEventListener('click', function (e){ if (e.target === overlay) fuera(); });
    document.addEventListener('keydown', porEsc);
    cerrar.focus();

    // La entrada la pone AppMotion si está; si no, el overlay ya nace visible.
    if (window.AppMotion && AppMotion.modalIn) AppMotion.modalIn(overlay, montaje.el);
  }

  /* El documento a tamaño de pantalla. Mismo esqueleto que abrirDiagramaGrande —overlay,
     barra, Escape, clic fuera, foco devuelto a quien abrió— porque son el mismo gesto y
     dos diálogos que se cierran distinto se aprenden dos veces.

     El aviso de permisos viaja también aquí, y no por copiar: a pantalla completa el
     rectángulo en blanco es más grande, no más explicativo. */
  function abrirDocumentoGrande(b){
    var ficha = DOC_VISOR[b.clase] || DOC_VISOR.archivo;
    var titulo = b.titulo || ficha.nombre;

    var overlay = el('div', 'art-diag-full');
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', titulo);
    var quienAbrio = document.activeElement;

    var barra = el('div', 'art-diag-full-bar');
    barra.appendChild(el('span', 'art-diag-full-tt', titulo));
    barra.appendChild(el('span', 'art-ayuda', 'Si se queda en blanco, tu cuenta no tiene permiso en Drive.'));
    var enGoogle = el('a', null, 'Abrir en Google');
    enGoogle.href = urlAbrir(b.clase, b.docId);
    enGoogle.target = '_blank';
    enGoogle.rel = 'noopener noreferrer';
    barra.appendChild(enGoogle);
    var cerrar = el('button', 'v-btn v-btn-ghost', 'Cerrar');
    cerrar.type = 'button';
    barra.appendChild(cerrar);
    overlay.appendChild(barra);

    var marco = el('div', 'art-doc-full-marco');
    var fr = document.createElement('iframe');
    fr.src = urlVisor(b.clase, b.docId);
    fr.title = titulo;
    fr.setAttribute('referrerpolicy', 'no-referrer');
    marco.appendChild(fr);
    overlay.appendChild(marco);
    document.body.appendChild(overlay);

    function fuera(){
      document.removeEventListener('keydown', porEsc);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (quienAbrio && quienAbrio.focus) quienAbrio.focus();
    }
    function porEsc(e){ if (e.key === 'Escape') fuera(); }
    cerrar.addEventListener('click', fuera);
    /* Solo el fondo cierra, nunca el marco: dentro hay un iframe de Google con el que se
       interactúa (pasar diapositiva, desplazar la hoja), y un clic ahí no es «he terminado». */
    overlay.addEventListener('click', function (e){ if (e.target === overlay) fuera(); });
    document.addEventListener('keydown', porEsc);
    cerrar.focus();

    if (window.AppMotion && AppMotion.modalIn) AppMotion.modalIn(overlay, marco);
  }

  /* Los bloques que se AHOGAN dentro de una columna de lectura. Una tabla de siete
     columnas pegada de Sheets, una captura de pantalla o un diagrama de flujo no son
     texto: no les aplica la medida de línea, y comprimirlos a 40rem es lo que dejaba
     las columnas en tiras de dos centímetros con las palabras partidas. Se marcan aquí
     y el carril ancho se lo da la rejilla de .art-cuerpo. */
  var BLOQUES_ANCHOS = { tabla: 1, imagen: 1, documento: 1, diagrama: 1 };

  function pintarCuerpo(contenido){
    var cuerpo = el('div', 'art-cuerpo');
    ((contenido && contenido.bloques) || []).forEach(function (b){
      var n = pintarBloque(b);
      if (!n) return;
      if (BLOQUES_ANCHOS[b.tipo]) n.setAttribute('data-ancho', '1');
      cuerpo.appendChild(n);
    });
    if (!cuerpo.firstChild) {
      cuerpo.appendChild(el('p', 'art-p', 'Este artículo todavía no tiene contenido.'));
    }
    avisarTablasAnchas(cuerpo);
    return cuerpo;
  }

  /** El aviso de «la tabla sigue» solo se enciende si de verdad sobra tabla.
      Se mide en el frame siguiente porque antes de pintar no hay anchos que medir. */
  function avisarTablasAnchas(raiz){
    if (!raiz || !window.requestAnimationFrame) return;
    requestAnimationFrame(function (){
      var cajas = raiz.querySelectorAll('.art-tabla-bloque');
      Array.prototype.forEach.call(cajas, function (bloque){
        var caja = bloque.querySelector('.art-tabla-caja');
        if (!caja) return;
        bloque.classList.toggle('es-ancha', caja.scrollWidth > caja.clientWidth + 2);
      });
    });
  }

  window.ArticuloRender = { pintarBloque: pintarBloque, pintarCuerpo: pintarCuerpo, urlSegura: urlSegura,
                            avisarTablasAnchas: avisarTablasAnchas,
                            docDeUrl: docDeUrl, parsearTSV: parsearTSV,
                            montarDiagrama: montarDiagrama, abrirDiagramaGrande: abrirDiagramaGrande,
                            abrirDocumentoGrande: abrirDocumentoGrande,
                            el: el, icono: icono };
})();
</script>
<script>
/* La interfaz (lista, lector, editor y guardado) va en su propio bloque para que el
   render —que es la pieza con implicaciones de seguridad— se lea entero de una vez. */
(function () {
  'use strict';
  var R = window.ArticuloRender;
  var vista = document.getElementById('vista');

  var st = { modo: 'lista', id: '', articulo: null, lista: [], puedeEditar: false, sucio: false, bloques: [] };

  function correo(){ return (window.AppSession && AppSession.userEmail) || ''; }
  function param(n){ return (window.AppUrl && AppUrl.param) ? (AppUrl.param(n) || '') : ''; }
  function reflejar(p, apilar){
    if (window.AppUrl && AppUrl.reflejar) AppUrl.reflejar(p, apilar ? { apilar: true } : null);
  }
  function aviso(m, t){ if (window.AppMotion && AppMotion.toast) AppMotion.toast(m, t || 'info'); }
  function el(tag, clase, texto){
    var n = document.createElement(tag);
    if (clase) n.className = clase;
    if (texto != null) n.textContent = String(texto);
    return n;
  }
  function vaciar(n){ while (n.firstChild) n.removeChild(n.firstChild); }
  function icono(nombre, clase){
    var s = document.createElement('span');
    s.setAttribute('data-icon', nombre);
    s.className = 'ic' + (clase ? ' ' + clase : '');
    return s;
  }
  function iconos(){ if (window.Icons) Icons.render(vista); }

  /* El índice de artículos es una REJILLA y quiere ancho; la lectura es una COLUMNA y
     quiere medida. Un solo tope no sirve para las dos, así que cada modo pone el suyo
     (los valores viven en el CSS, en --art-tope). */
  function anchoDeModo(esIndice){
    var m = document.getElementById('main-content');
    if (m) m.classList.toggle('es-indice', !!esIndice);
  }

  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  /* El servidor manda 'yyyy-MM-dd' ya formateado con la zona horaria del script. NO se
     pasa por `new Date(iso)`: esa cadena se interpreta como UTC y en America/Mexico_City
     sale el día ANTERIOR. Se parte a mano, que además no depende de la configuración
     del navegador de quien lea. */
  function fechaCorta(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    return m ? (Number(m[3]) + ' ' + MESES[Number(m[2]) - 1] + ' ' + m[1]) : '';
  }
  /* La lista la ordena el servidor por `editado || creado`: la tarjeta tiene que enseñar
     ESA misma fecha, o el orden de la rejilla no hay quien lo explique. */
  function fechaTarjeta(a){
    return a.editado && a.editado !== a.creado
      ? 'Act. ' + fechaCorta(a.editado)
      : fechaCorta(a.creado);
  }
  /* artDeFila_ hace Math.max(1, palabras/200), así que `minutos` nunca es 0 y un
     borrador recién creado y vacío prometía «1 min de lectura». `bloques` viene en la
     misma respuesta y es lo que de verdad distingue. */
  function textoMinutos(a){
    return a.bloques ? (a.minutos + ' min de lectura') : 'Sin contenido';
  }

  /* ── Lista ─────────────────────────────────────────────────────────── */
  function cargarLista(){
    repintar(function (){
      /* El esqueleto se monta con la vista ya VACÍA: VentelFX.skeleton hace appendChild,
         así que al volver de un artículo aparecía colgando debajo del artículo entero,
         normalmente fuera de pantalla, y parecía que el botón no había hecho nada.
         Y 'tarjetas' en vez de 'lista': 'lista' dibuja filas con avatar redondo —un
         directorio de personas— y lo que aterriza es una rejilla de tarjetas, así que la
         página daba justo el salto de forma que un esqueleto existe para evitar. */
      var fx = window.VentelFX ? VentelFX.skeleton('#vista', 'tarjetas', { rows: 6 }) : null;
      vista.setAttribute('aria-busy', 'true');
      AppRun.call('artListar', [correo(), {}], { busy: false })
        .then(function (r){
          if (fx) fx.done();
          vista.removeAttribute('aria-busy');
          if (!r || r.status !== 'ok') { vaciar(vista); pintarError(r && r.error); return; }
          st.lista = r.articulos || [];
          st.puedeEditar = !!r.puedeEditar;
          vaciar(vista);
          pintarLista();
        }, function (){
          if (fx) fx.done();
          vista.removeAttribute('aria-busy');
          vaciar(vista);
          pintarError('No pudimos hablar con el servidor. Revisa tu conexión y vuelve a intentarlo.');
        });
    });
  }

  function pintarLista(){
    st.modo = 'lista';
    anchoDeModo(true);
    vaciar(vista);
    tituloDePagina('');

    /* Se quitó el <h1> «Artículos»: el topbar del marco ya pinta uno con ese mismo texto
       (AppShell.mount le pasa el título). Dos encabezados de nivel 1 idénticos no son
       una repetición de adorno —quien navega por encabezados se los encuentra dos veces
       seguidas y tiene que averiguar si son dos zonas distintas—, y además se comían el
       primer tercio de la pantalla para no decir nada nuevo. */
    var hd = el('div', 'art-hd');
    var izq = document.createElement('div');
    izq.appendChild(el('p', 'art-hd-sub',
      'Lo que hay que saber explicado con calma: guías, procedimientos y todo lo que no cabe en un anuncio.'));
    var n = st.lista.length;
    var borradores = st.lista.filter(function (a){ return a.estado !== 'publicado'; }).length;
    var cuenta = el('p', 'art-hd-cuenta',
      (n === 1 ? '1 artículo' : n + ' artículos') +
      (borradores && st.puedeEditar ? ' · ' + borradores + (borradores === 1 ? ' borrador' : ' borradores') : ''));
    cuenta.setAttribute('role', 'status');
    izq.appendChild(cuenta);
    hd.appendChild(izq);

    if (st.puedeEditar) {
      var nuevo = el('button', 'v-btn v-btn-primary', null);
      nuevo.type = 'button';
      nuevo.appendChild(icono('plus'));
      nuevo.appendChild(document.createTextNode('Escribir artículo'));
      nuevo.addEventListener('click', function (){ abrirEditor(null); });
      hd.appendChild(nuevo);
    }
    vista.appendChild(hd);

    if (!st.lista.length) {
      var vacio = el('div', 'art-vacio');
      vacio.appendChild(icono('document'));
      vacio.appendChild(el('div', 'art-vacio-t', 'Todavía no hay artículos'));
      vacio.appendChild(el('div', 'art-vacio-s', st.puedeEditar
        ? 'Escribe el primero: una guía, un procedimiento, la explicación de un caso que se repite.'
        : 'Cuando el equipo publique alguno, aparecerá aquí.'));
      /* La invitación y el botón, juntos. Antes el estado vacío decía «escribe el
         primero» y mandaba a buscar el botón a la esquina de arriba: es pedir el mismo
         gesto dos veces. */
      if (st.puedeEditar) {
        var cta = el('button', 'v-btn v-btn-primary', 'Escribir el primero');
        cta.type = 'button';
        cta.addEventListener('click', function (){ abrirEditor(null); });
        vacio.appendChild(cta);
      }
      vista.appendChild(vacio);
      iconos();
      entrada(hd, { y: 10, duration: .35 });
      reflejar({ art: '' });
      return;
    }

    /* <ul> y no <div>: quien recorre la pantalla con lector de pantalla oye «lista de 12
       elementos» antes de empezar, que es el dato con el que decide si sigue flechando.
       role="list" explícito porque Safari se la quita a las listas con list-style:none. */
    var grid = el('ul', 'art-lista');
    grid.setAttribute('role', 'list');
    grid.setAttribute('aria-label', 'Artículos');

    st.lista.forEach(function (a){
      var esBorrador = a.estado !== 'publicado';
      var card = el('button', 'art-card' + (esBorrador ? ' es-borrador' : ''));
      card.type = 'button';

      /* Primero ESTADO y FECHA —el filtro: ¿es para mí, sigue vigente?—, luego el
         TÍTULO —la decisión—, luego el RESUMEN y al final el coste. */
      var top = el('span', 'art-card-top');
      top.appendChild(el('span', null, fechaTarjeta(a)));
      if (esBorrador) {
        var chip = el('span', 'art-badge borrador', 'Borrador');
        chip.setAttribute('aria-hidden', 'true');   // ya va dicho en el nombre del botón
        top.appendChild(chip);
      }
      card.appendChild(top);

      card.appendChild(el('span', 'art-card-tt', a.titulo || '(sin título)'));
      /* El resumen se pinta SIEMPRE. Dejarlo fuera cuando no lo hay abría un hueco de
         dos renglones dentro de la caja que se lee como «esto no cargó», no como «este
         artículo no tiene resumen». */
      card.appendChild(el('span', 'art-card-rs' + (a.resumen ? '' : ' es-hueco'),
        a.resumen || (a.bloques ? 'Sin resumen todavía.' : 'Sin resumen y sin contenido todavía.')));

      var pie = el('span', 'art-card-pie');
      pie.appendChild(el('span', 'art-card-aut', a.autores || 'Sin autor'));
      pie.appendChild(el('span', 'art-card-min', textoMinutos(a)));
      card.appendChild(pie);

      /* El nombre accesible se calcula en vez de dejarlo a la concatenación de los
         trozos: primero el estado —lo primero que hay que saber de un borrador—, luego
         el título ENTERO (el recorte a dos renglones es visual, no informativo) y al
         final el coste. Si mañana se añade un dato visible a la tarjeta, hay que
         acordarse de meterlo también aquí. */
      card.setAttribute('aria-label',
        (esBorrador ? 'Borrador. ' : '') + (a.titulo || 'Sin título') + '. ' +
        textoMinutos(a) + (a.autores ? '. Por ' + a.autores : '') +
        (fechaTarjeta(a) ? '. ' + fechaTarjeta(a) : ''));

      card.addEventListener('click', function (){ abrirArticulo(a.id, true); });
      var li = document.createElement('li');
      li.appendChild(card);
      grid.appendChild(li);
    });
    vista.appendChild(grid);
    iconos();
    entradaDeLista(hd, grid.children);
    reflejar({ art: '' });
  }

  /**
   * Error del que se puede salir.
   * @param {string=} msg     lo que pasó, en cristiano
   * @param {object=} opts    {titulo, reintentar, volver}
   */
  function pintarError(msg, opts){
    opts = opts || {};
    vaciar(vista);
    var v = el('div', 'art-vacio');
    v.setAttribute('role', 'alert');
    v.appendChild(icono('warning'));
    v.appendChild(el('div', 'art-vacio-t', opts.titulo || 'No pudimos cargar los artículos'));
    v.appendChild(el('div', 'art-vacio-s', msg || 'Revisa tu conexión y vuelve a intentarlo.'));
    /* Un error sin botón obliga a recargar la pantalla entera; y si el que falló fue
       artObtener, además deja al lector sin puerta de vuelta al índice. */
    var ac = el('div', 'art-acciones art-vacio-ac');
    var re = el('button', 'v-btn v-btn-primary', 'Reintentar');
    re.type = 'button';
    re.addEventListener('click', opts.reintentar || cargarLista);
    ac.appendChild(re);
    if (opts.volver) {
      var vb = el('button', 'v-btn v-btn-ghost', 'Todos los artículos');
      vb.type = 'button';
      vb.addEventListener('click', function (){ st.id = ''; cargarLista(); });
      ac.appendChild(vb);
    }
    v.appendChild(ac);
    vista.appendChild(v);
    iconos();
  }

  /* ── Lector ────────────────────────────────────────────────────────── */
  function abrirArticulo(id, apilar){
    if (!id) return;
    repintar(function (){
      var fx = window.VentelFX ? VentelFX.skeleton('#vista', 'tarjetas', { rows: 3 }) : null;
      vista.setAttribute('aria-busy', 'true');
      AppRun.call('artObtener', [id, correo()], { busy: false })
        .then(function (r){
          if (fx) fx.done();
          vista.removeAttribute('aria-busy');
          if (!r || r.status !== 'ok') {
            vaciar(vista);
            pintarError(r && r.error, { volver: true, reintentar: function (){ abrirArticulo(id); } });
            return;
          }
          st.articulo = r.articulo;
          st.id = id;
          st.puedeEditar = !!r.puedeEditar;
          vaciar(vista);
          pintarLectura();
          reflejar({ art: id }, apilar);
        }, function (){
          if (fx) fx.done();
          vista.removeAttribute('aria-busy');
          vaciar(vista);
          pintarError(null, { volver: true, reintentar: function (){ abrirArticulo(id); } });
        });
    });
  }

  function pintarLectura(){
    st.modo = 'lee';
    anchoDeModo(false);
    var a = st.articulo;
    matarEscena();
    vaciar(vista);
    tituloDePagina(a.titulo);

    /* Progreso de lectura. En un artículo largo dentro del iframe de Apps Script no hay
       barra de desplazamiento de la ventana que sirva de referencia, así que sin esto no
       se sabe si queda un párrafo o quince.

       Vive COLGADA DEL TOPBAR, en su borde inferior, y no dentro del contenido. Pegada
       en top:0 quedaba justo debajo del topbar del marco (sticky, z-index 40, con fondo
       y desenfoque): la línea se dibujaba tapada, así que la función entera se ejecutaba
       en cada scroll y no la veía nadie. El nodo se pasa por REFERENCIA a montarEscena,
       no por selector, precisamente porque ya no vive dentro de #vista. */
    var progreso = el('div', 'art-progreso');
    var barraProg = el('i', null, null);
    progreso.appendChild(barraProg);
    (document.querySelector('.topbar') || vista).appendChild(progreso);

    /* La barra de acciones, en tres niveles. Antes eran cuatro botones fantasma
       idénticos —misma caja, mismo peso, mismo tamaño— para cuatro cosas de naturaleza
       distinta: había que leerse las cuatro etiquetas para elegir. Ahora: la vuelta es
       navegación y no lleva caja; las utilidades son ghost pequeñas; y la única acción
       que cambia algo —Editar— es la primaria, y solo existe para quien puede. */
    var acciones = el('div', 'art-acciones art-lee-barra');
    var volver = el('button', 'art-volver', '← Todos los artículos');
    volver.type = 'button';
    volver.addEventListener('click', function (){ st.id = ''; cargarLista(); });
    acciones.appendChild(volver);

    var der = el('div', 'art-lee-der');
    /* Si AppUrl.copyLink no está, el botón no se pinta. Antes se pintaba igual y al
       pulsarlo no pasaba nada y no se decía nada, que es peor que no tenerlo. */
    if (window.AppUrl && AppUrl.copyLink) {
      var copiar = el('button', 'v-btn v-btn-ghost v-btn-sm', null);
      copiar.type = 'button';
      copiar.appendChild(icono('link'));
      copiar.appendChild(document.createTextNode('Copiar enlace'));
      copiar.addEventListener('click', function (){
        AppUrl.copyLink('articulo', { art: a.id }).then(function (ok){
          aviso(ok ? 'Enlace copiado.' : 'No pudimos copiar el enlace.', ok ? 'ok' : 'warn');
        });
      });
      der.appendChild(copiar);
    }
    if (st.puedeEditar) {
      var lectores = el('button', 'v-btn v-btn-ghost v-btn-sm', null);
      lectores.type = 'button';
      lectores.appendChild(icono('eye'));
      lectores.appendChild(document.createTextNode('Quién lo ha leído'));
      lectores.addEventListener('click', function (){ verLectores(a.id); });
      der.appendChild(lectores);

      var editar = el('button', 'v-btn v-btn-primary v-btn-sm', null);
      editar.type = 'button';
      editar.appendChild(icono('pencil'));
      editar.appendChild(document.createTextNode('Editar'));
      editar.addEventListener('click', function (){ abrirEditor(a); });
      der.appendChild(editar);
    }
    acciones.appendChild(der);

    var doc = el('article', 'art-doc');
    var hd = el('div', 'art-doc-hd');
    if (a.estado !== 'publicado') hd.appendChild(el('span', 'art-badge borrador', 'Borrador · solo lo ves tú'));
    hd.appendChild(el('h1', null, a.titulo || '(sin título)'));
    if (a.resumen) hd.appendChild(el('p', 'art-doc-rs', a.resumen));

    /* Los «·» son decoración y van en su propio span: dentro del texto se los lee el
       lector de pantalla uno a uno. */
    var firma = el('div', 'art-firma');
    function firmaTrozo(texto, fuerte){
      if (!texto) return;
      if (firma.firstChild) firma.appendChild(el('span', 'art-sep-punto', '·'));
      firma.appendChild(el(fuerte ? 'b' : 'span', null, texto));
    }
    firmaTrozo(a.autores, true);
    firmaTrozo(fechaCorta(a.creado) || a.creado);
    firmaTrozo(textoMinutos(a));
    if (a.editadoPor && a.editado && a.editado !== a.creado) {
      firmaTrozo('última edición ' + (fechaCorta(a.editado) || a.editado) + ' por ' + a.editadoPor);
    }
    hd.appendChild(firma);
    doc.appendChild(hd);

    var cuerpo = R.pintarCuerpo(a.contenido);

    /* Índice del artículo. Solo si hay al menos dos subtítulos: con uno no es un índice,
       es un enlace suelto. Se arma leyendo el DOM ya pintado, así que no hay una segunda
       fuente de verdad que se pueda desincronizar del contenido.

       DÓNDE va lo decide el ancho REAL de la columna, no una media query: la de antes
       medía la ventana y se olvidaba de los 252 px de la barra lateral, así que en un
       portátil de 1366 px el índice desaparecía —y sin sustituto— justo donde más falta
