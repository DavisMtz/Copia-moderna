<script>
/**
 * =====================================================================================
 * NÚCLEO COMPARTIDO | Sistema de cotizaciones Ventel
 * =====================================================================================
 * Se incluye en cada pantalla con el scriptlet include('app_core') DESPUÉS de definir:
 *   window.__APP__ = <?!= APP_JSON ?>;
 *
 * Esa línea es idéntica en las diecinueve pantallas y la arma el servidor
 * (appEstadoInicialJson_ en Code.gs): trae la URL base y TODOS los parámetros de vista
 * de la petición, ya escapados. Cuando cada pantalla elegía a mano qué copiar, la
 * mitad se quedaba solo con baseUrl y sus enlaces profundos morían en silencio.
 *
 * Expone:
 *   AppUrl     -> modelo único de construcción de URLs (?page=...&param=...).
 *   AppSession -> lectura segura de la sesión guardada en localStorage.
 *   AppCache   -> almacén local con namespace, versión, TTL y respaldo en memoria.
 *   AppRun     -> google.script.run como promesa, con deduplicación de llamadas.
 *   requireSession() -> guardia: si no hay sesión, redirige a login.
 *   requireBlock()   -> guardia por bloque de permisos (ver Permisos.gs en el servidor).
 */
(function () {
  const cfg = window.__APP__ || {};

  const PAGE_HOME_NORMAL = 'dashboard';
  const PAGE_HOME_ADVANCED = 'inicio_avanzado';

  // ── Claves de almacenamiento ────────────────────────────────────────────────
  // TODO lo que escribimos lleva el prefijo 'ventel-'. Las webapps de Apps Script
  // se sirven desde un origen compartido (*.googleusercontent.com), así que una
  // clave genérica como 'userEmail' puede chocar con la de otro script. Las claves
  // viejas se migran una sola vez al cargar cualquier pantalla.
  const K_NAME = 'ventel-user-name';
  const K_EMAIL = 'ventel-user-email';
  const K_ADV = 'ventel-user-advanced';
  const K_FOLIO = 'ventel-selected-folio';
  // Rol y bloques del modelo de permisos (Permisos.gs). Se guardan para DIBUJAR el
  // menú sin pedirle al servidor la lista en cada pantalla. No son una credencial:
  // cualquiera puede editarlos desde la consola del navegador, y por eso el servidor
  // vuelve a resolverlos en cada llamada. Aquí solo deciden qué botones se pintan.
  const K_ROL = 'ventel-user-role';
  const K_BLOQUES = 'ventel-user-blocks';
  // Llave de sesión (Sesiones.gs): ESTA sí es una credencial. La entrega el servidor al
  // iniciar sesión y viaja en cada llamada (AppRun → secEjecutar); sin ella el servidor
  // no reconoce a nadie, diga el correo que diga el navegador.
  const K_LLAVE = 'ventel-llave';
  // Última vez que la persona TOCÓ la pantalla (ms). Se comparte entre pestañas a propósito:
  // una pestaña olvidada no debe cerrar la sesión de quien trabaja en otra.
  const K_ACTIVIDAD = 'ventel-sesion-actividad';
  const K_INACTIVIDAD = 'ventel-sesion-inactividad-min';
  const LEGACY_KEYS = {
    'userName': K_NAME,
    'userEmail': K_EMAIL,
    'isAdvanced': K_ADV,
    'selectedQuoteFolio': K_FOLIO
  };

  (function migrarClavesViejas() {
    try {
      Object.keys(LEGACY_KEYS).forEach(function (vieja) {
        const valor = localStorage.getItem(vieja);
        if (valor === null) return;
        if (localStorage.getItem(LEGACY_KEYS[vieja]) === null) localStorage.setItem(LEGACY_KEYS[vieja], valor);
        localStorage.removeItem(vieja);
      });
    } catch (e) {}
  })();

  function lsGet(clave) { try { return localStorage.getItem(clave) || ''; } catch (e) { return ''; } }

  const AppSession = {
    get userName() { return lsGet(K_NAME); },
    get userEmail() { return lsGet(K_EMAIL); },
    get isAdvanced() { return lsGet(K_ADV) === 'true'; },
    get firstName() { return (this.userName || 'Usuario').split(' ')[0]; },

    /** Rol del modelo de permisos: 'normal' | 'avanzado' | 'maestro'. */
    get rol() {
      const r = lsGet(K_ROL);
      if (r) return r;
      // Sesión abierta antes de que existieran los roles: se deduce del interruptor
      // viejo para que nadie tenga que volver a entrar tras el despliegue.
      return this.isAdvanced ? 'avanzado' : 'normal';
    },
    get isMaster() { return this.rol === 'maestro'; },

    /** Bloques concedidos. Vacío = sesión vieja; entonces se cae al rol. */
    get bloques() {
      try {
        const crudo = lsGet(K_BLOQUES);
        const lista = crudo ? JSON.parse(crudo) : [];
        return Array.isArray(lista) ? lista : [];
      } catch (e) { return []; }
    },

    /**
     * ¿Sabemos QUÉ bloques tiene esta persona?
     *
     * No es lo mismo "no tiene ninguno" que "todavía no se lo hemos preguntado al
     * servidor", y antes se confundían: una lista vacía se leía igual que una lista
     * ausente. La diferencia importa, porque de ella depende si una función apagada
     * por mantenimiento se esconde o se sigue enseñando.
     */
    get bloquesConocidos() { return lsGet(K_BLOQUES) !== ''; },

    /**
     * ¿Se le pinta este bloque a esta persona?
     *
     * Cuando la sesión no trae la lista —porque se abrió antes de este cambio— se
     * responde que SÍ: la alternativa sería esconderle media app a alguien que sí
     * tiene permiso, y el servidor va a rechazar igualmente lo que no le toque.
     * Ocultar de más es un fallo de usabilidad; ocultar de menos, ninguno: el
     * candado real está del otro lado.
     *
     * En cuanto la lista SÍ existe manda la lista, aunque venga vacía. Ese caso es
     * real: los módulos apagados por mantenimiento se restan en el servidor, así que
     * "sin bloques" puede significar "hoy no hay nada disponible" y hay que hacerle
     * caso.
     */
    can: function (bloqueId) {
      if (!bloqueId) return true;
      if (!this.bloquesConocidos) return true;
      return this.bloques.indexOf(bloqueId) !== -1;
    },

    /**
     * Igual que can(), pero sin el beneficio de la duda: si no sabemos los bloques,
     * responde NO.
     *
     * Se usa para las puertas de administración. Enseñarle a un asesor un acceso de
     * gestión que el servidor le va a rechazar no es solo un menú equivocado: es
     * anunciarle a todo el equipo dónde está la puerta y que existe. Ahí el error
     * barato es esconder de más, no de menos —justo al revés que en el resto del
     * menú—, y el enlace aparece medio segundo después, cuando el servidor confirma.
     */
    canStrict: function (bloqueId) {
      if (!bloqueId) return false;
      if (!this.bloquesConocidos) return false;
      return this.bloques.indexOf(bloqueId) !== -1;
    },

    /**
     * Vuelve a preguntarle al servidor el rol y los bloques de esta sesión.
     *
     * POR QUÉ HACE FALTA: el rol se guardaba SOLO al iniciar sesión. Eso significaba
     * que ascender a alguien no surtía efecto hasta que esa persona cerraba sesión y
     * volvía a entrar —y mientras tanto veía el menú de antes y creía que el cambio
     * no se había hecho—. Con esto, basta recargar la pantalla.
     *
     * Si el servidor responde que la cuenta ya no vale (dada de baja, borrada), se
     * cierra la sesión aquí mismo: quitarle el acceso a alguien tiene que notarse en
     * la siguiente pantalla que abra, no en la siguiente vez que se le ocurra entrar.
     *
     * Nunca rechaza: un fallo de red no debe tumbar una pantalla que ya está pintada.
     * @return {Promise<{cambio:boolean, permisos:object}|null>}
     */
    refrescar: function () {
      const self = this;
      if (!self.isLoggedIn()) return Promise.resolve(null);

      return AppRun.call('obtenerPermisosSesion', [self.userEmail], { key: 'permisos-sesion' })
        .then(function (r) {
          if (!r) return null;

          if (!r.success) {
            // activo:false es el servidor diciendo "esta cuenta ya no entra". Un error
            // cualquiera (red, cuota) llega con activo:true y no se toca la sesión.
            if (r.activo === false) {
              self.clear();
              AppUrl.go('login');
            }
            return null;
          }

          const antes = lsGet(K_ROL) + '|' + lsGet(K_BLOQUES);
          try {
            localStorage.setItem(K_ROL, r.rol || 'normal');
            localStorage.setItem(K_BLOQUES, JSON.stringify(r.bloques || []));
            localStorage.setItem(K_ADV, String(r.avanzado === true));
            if (r.nombre) localStorage.setItem(K_NAME, r.nombre);
          } catch (e) {}

          return { cambio: antes !== (lsGet(K_ROL) + '|' + lsGet(K_BLOQUES)), permisos: r };
        }, function () { return null; });
    },
    /** Último correo con el que se inició sesión; sobrevive al cierre de sesión
     *  para precargar el login (persistencia amable, no credencial). */
    get lastEmail() { return lsGet('ventel-last-email'); },
    /** Llave de sesión del servidor. Sin ella no hay sesión, aunque quede un correo guardado. */
    get llave() { return lsGet(K_LLAVE); },
    isLoggedIn: function () { return !!this.userEmail && !!this.llave; },
    /** Última interacción de la persona con la pantalla (ms); 0 si no hay registro. */
    ultimaActividad: function () { return Number(lsGet(K_ACTIVIDAD)) || 0; },
    /** Minutos sin actividad tras los que vence la sesión (los dice el servidor al entrar). */
    inactividadMs: function () { const n = Number(lsGet(K_INACTIVIDAD)); return (n > 0 ? n : 120) * 60000; },
    marcarActividad: function () { try { localStorage.setItem(K_ACTIVIDAD, String(Date.now())); } catch (e) {} },
    save: function (data) {
      try {
        localStorage.setItem(K_NAME, data.userName || '');
        localStorage.setItem(K_EMAIL, data.userEmail || '');
        if (data.llave) localStorage.setItem(K_LLAVE, data.llave);
        if (data.inactividadMin) localStorage.setItem(K_INACTIVIDAD, String(data.inactividadMin));
        localStorage.setItem(K_ACTIVIDAD, String(Date.now()));
        localStorage.setItem(K_ADV, String(data.isAdvanced === true));
        localStorage.setItem(K_ROL, data.rol || (data.isAdvanced ? 'avanzado' : 'normal'));
        localStorage.setItem(K_BLOQUES, JSON.stringify(Array.isArray(data.bloques) ? data.bloques : []));
        if (data.userEmail) localStorage.setItem('ventel-last-email', data.userEmail);
      } catch (e) { console.error('No se pudo guardar la sesión:', e); }
    },

    /** Folio elegido en una tabla para abrirlo en la vista de consulta. */
    get selectedFolio() { return lsGet(K_FOLIO); },
    set selectedFolio(folio) { try { localStorage.setItem(K_FOLIO, folio || ''); } catch (e) {} },

    /**
     * Cierra la sesión SIN arrasar el resto del almacenamiento: se conservan el
     * tema y ajustes de vista (ventel-theme/density/textscale/contrast), el
     * último correo y las preferencias del Portal. Se borra TODO lo que pueda
     * contener datos del usuario o de sus clientes: identidad, cachés de datos
     * (ventel-cache-*) y los borradores de vista previa —que traen nombre,
     * correo y teléfono del cliente— tanto en localStorage como en la sesión de
     * la pestaña. En un equipo compartido, el siguiente asesor no debe ver ni un
     * rastro del anterior.
     */
    clear: function () {
      const llave = lsGet(K_LLAVE);
      try {
        [K_NAME, K_EMAIL, K_ADV, K_ROL, K_BLOQUES, K_FOLIO, K_LLAVE, K_ACTIVIDAD, K_INACTIVIDAD]
          .forEach(function (k) { localStorage.removeItem(k); });
      } catch (e) {}
      // La llave también se anula en el servidor, sin esperar respuesta: si la red falla,
      // vence sola por inactividad. Directo y no por AppRun: no debe encender indicadores.
      if (llave) {
        try { google.script.run.withFailureHandler(function () {}).sesCerrar(llave); } catch (e) {}
      }
      try {
        Object.keys(localStorage)
          .filter(function (k) { return k.indexOf('pendingQuoteData') === 0; })
          .forEach(function (k) { localStorage.removeItem(k); });
      } catch (e) {}
      AppCache.clearAll();
      AppCache.session.clearAll();
      AppRun.clearInflight();
    }
  };

  /**
   * Nombre en cristiano de cada pantalla, para el enlace de respaldo.
   *
   * Se lee dentro de una frase ("Abre …", "Te llevamos a …"), así que cada entrada
   * viene con su artículo y en minúscula: es lo que hace que el aviso suene a alguien
   * hablando y no a una clave interna asomándose por un hueco de la plantilla. Cuando
   * se añade una pantalla al enrutador se añade aquí también; si falta, el aviso dice
   * "la siguiente pantalla" y sigue funcionando, solo que más impersonal.
   */
  const NOMBRES_PAGINA = {
    'cotizado_preview':    'la vista previa',
    'cotizacion':          'la cotización',
    'consulta_cotizacion': 'la consulta',
    'revision_cotizacion': 'la revisión de la cotización',
    'correoventel':        'el envío al cliente',
    'correo_cliente':      'los correos a clientes',
    'dashboard':           'tu inicio',
    'inicio_avanzado':     'gestión',
    'consola':             'la consola',
    'anuncios':            'el constructor de anuncios',
    'portal_contenido':    'el contenido del Portal',
    'operacion':           'el estado de operación',
    'estado':              'el tablero de estado',
    'atenciones':          'tus atenciones pendientes',
    'promociones':         'el monitor de promociones',
    'login':               'el inicio de sesión',
    'registro':            'la creación de cuenta',
    'recuperar':           'la recuperación de contraseña',
    'portal':              'el portal',
    'articulo':            'los artículos'
  };

  /**
   * ¿Sigue viva la "activación" del clic del asesor?
   *
   * Chrome solo deja que un iframe de otro origen —aquí la app vive en
   * *.googleusercontent.com dentro de script.google.com— navegue la ventana
   * superior durante unos 5 segundos después de un clic o una tecla. Los
   * navegadores sin esta API se tratan como si estuviera viva: se intenta igual.
   */
  function activacionViva() {
    try {
      if (navigator.userActivation && typeof navigator.userActivation.isActive === 'boolean') {
        return navigator.userActivation.isActive;
      }
    } catch (e) {}
    return true;
  }

  /**
   * ===========================================================================
   * AVISO DE RECUPERACIÓN DE NAVEGACIÓN
   * ===========================================================================
   * Lo que ve el asesor cuando el navegador NO cambió de pantalla por su cuenta.
   * No es un error del sistema: es un límite de Chrome (un iframe de otro origen
   * solo puede navegar la ventana superior mientras dura la activación del clic),
   * así que el aviso no se disculpa ni alarma — le da al asesor el único gesto
   * que sí funciona: un enlace, cuyo clic es una activación nueva.
   *
   * Reglas de diseño:
   *   · Se pinta con los MISMOS tokens del tema (--surface/--ink/--line/--brand),
   *     así que hereda los 3 temas (aurora/slate/carbon) sin código extra.
   *   · Es AUTÓNOMO: el Portal (Index/Promociones) incluye app_core pero no
   *     app_icons, app_motion ni app_theme. Por eso los SVG van en línea, cada
   *     token lleva respaldo y la animación degrada a CSS si no hay GSAP.
   *   · Nunca sale impreso: los documentos de cotización se imprimen desde estas
   *     mismas pantallas.
   */
  const NavAviso = (function () {
    const ID = 'ventel-nav-fallback';
    const ID_CSS = 'ventel-nav-fallback-estilos';

    let anclaje = null;    // contenedor fijo que centra (no se anima)
    let tarjeta = null;    // la superficie que sí se anima
    let escalaTimer = null;
    let alTeclado = null;
    let estado = null;     // { url, page, variante }
    let entrada = null;    // línea de tiempo de entrada (se mata al ocultar)
    let latido = null;     // bucle que empuja la flecha del botón principal
    let alVisibilidad = null;

    function reducido() {
      try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
      catch (e) { return false; }
    }
    function conGsap() { return typeof window.gsap !== 'undefined' && !reducido(); }

    // Mismo lenguaje que app_icons: lienzo 24×24, sin relleno, trazo 1.6, currentColor.
    function icono(d) {
      return '<svg class="vnf-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
    }
    const D_FLECHA  = '<path d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>';
    const D_ALERTA  = '<path d="M12 9v3.75m0 3.375h.007M10.34 3.94 1.98 18a1.75 1.75 0 0 0 1.51 2.62h17.02A1.75 1.75 0 0 0 22.02 18L13.66 3.94a1.75 1.75 0 0 0-3.02 0Z"/>';
    const D_RECARGA = '<path d="M16.02 9.35h5m-18.04 10.3v-5m0 0h5m-5 0 3.18 3.18a8.25 8.25 0 0 0 13.8-3.7M4.03 9.87a8.25 8.25 0 0 1 13.8-3.7l3.19 3.18m0-5v5"/>';
    const D_ENLACE  = '<path d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/>';
    const D_CORREO  = '<path d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5H4.5A2.25 2.25 0 0 0 2.25 6.75m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/>';
    const D_CERRAR  = '<path d="M6 18 18 6M6 6l12 12"/>';
    const D_CHECK   = '<path d="M4.5 12.75l6 6 9-13.5"/>';

    function estilos() {
      if (document.getElementById(ID_CSS)) return;
      const s = document.createElement('style');
      s.id = ID_CSS;
      s.textContent =
        '#' + ID + '{position:fixed;left:0;right:0;bottom:0;z-index:10050;display:flex;justify-content:center;' +
        'padding:0 1rem calc(1rem + env(safe-area-inset-bottom,0px));pointer-events:none;}' +

        /* El aviso también sale en el Portal (Index/Promociones), que no carga el
           preflight de app_tailwind. Sin esto los botones heredan content-box y el
           primario crece 20px más que el secundario: la fila queda despareja. */
        '#' + ID + ',#' + ID + ' *,#' + ID + ' *::before,#' + ID + ' *::after{box-sizing:border-box;}' +

        '#' + ID + ' .vnf-card{pointer-events:auto;width:min(37rem,100%);display:grid;' +
        'grid-template-columns:auto minmax(0,1fr) auto;' +
        'grid-template-areas:"chip texto cerrar" "acciones acciones acciones";' +
        'gap:1rem;padding:1.15rem;background:var(--surface,#fff);color:var(--ink,#1B2330);' +
        'border:1px solid var(--line,#E4E9F0);border-radius:16px;' +
        'box-shadow:var(--sh-lg,0 30px 60px -24px rgba(27,35,48,.26));' +
        "font-family:var(--f-ui,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif);}" +

        /* Chip: el color es semántico (marca = solo falta abrir; ámbar = algo falló),
           pero el icono y el texto dicen lo mismo sin depender del color. */
        '#' + ID + ' .vnf-chip{grid-area:chip;width:2.5rem;height:2.5rem;border-radius:12px;flex:none;' +
        'display:inline-flex;align-items:center;justify-content:center;}' +
        '#' + ID + ' .vnf-chip-marca{background:var(--brand-tint,#FDE7F4);color:var(--brand,#E10098);}' +
        '#' + ID + ' .vnf-chip-aviso{background:var(--warn-bg,#FDF1E0);color:var(--warn,#B45309);}' +
        '#' + ID + ' .vnf-ico{width:1.25rem;height:1.25rem;flex:none;}' +

        '#' + ID + ' .vnf-texto{grid-area:texto;min-width:0;}' +
        '#' + ID + ' .vnf-titulo{margin:0;font-size:.95rem;font-weight:600;line-height:1.35;' +
        'letter-spacing:-.01em;color:var(--ink,#1B2330);}' +
        '#' + ID + ' .vnf-desc{margin:.2rem 0 0;font-size:.85rem;line-height:1.5;max-width:52ch;' +
        'color:var(--ink-soft,#5C6B7E);}' +
        '#' + ID + ' .vnf-pista{margin:.5rem 0 0;font-size:.8rem;line-height:1.45;max-width:52ch;' +
        'color:var(--warn,#B45309);}' +
        '#' + ID + ' .vnf-pista[hidden]{display:none;}' +

        '#' + ID + ' .vnf-x{grid-area:cerrar;align-self:start;width:2rem;height:2rem;border-radius:8px;' +
        'display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;' +
        'background:transparent;border:0;color:var(--ink-faint,#94A1B2);padding:0;' +
        'transition:background .15s ease,color .15s ease;}' +
        '#' + ID + ' .vnf-x:hover{background:var(--surface-2,#F4F7FA);color:var(--ink,#1B2330);}' +

        '#' + ID + ' .vnf-acciones{grid-area:acciones;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;}' +

        /* Botones: misma gramática que .v-btn del tema, pero sin depender de él. */
        '#' + ID + ' .vnf-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;' +
        'min-height:2.5rem;padding:.55rem 1rem;border-radius:10px;border:1px solid transparent;' +
        'font-size:.85rem;font-weight:600;line-height:1;text-decoration:none;cursor:pointer;' +
        'font-family:inherit;transition:transform .15s cubic-bezier(.32,.72,0,1),box-shadow .15s ease,' +
        'background .15s ease,color .15s ease,border-color .15s ease;}' +
        '#' + ID + ' .vnf-btn:hover{transform:translateY(-1px);}' +
        '#' + ID + ' .vnf-btn:active{transform:translateY(0) scale(.98);}' +
        '#' + ID + ' .vnf-btn:focus-visible{outline:none;box-shadow:var(--ring,0 0 0 4px rgba(225,0,152,.16));}' +
        '#' + ID + ' .vnf-btn-primario{background:var(--brand,#E10098);color:#fff;' +
        'box-shadow:0 6px 14px -8px rgba(225,0,152,.55);}' +
        '#' + ID + ' .vnf-btn-primario:hover{box-shadow:0 10px 24px -10px rgba(225,0,152,.45);}' +
        '#' + ID + ' .vnf-btn-suave{background:var(--surface,#fff);color:var(--ink-soft,#5C6B7E);' +
        'border-color:var(--line,#E4E9F0);}' +
        '#' + ID + ' .vnf-btn-suave:hover{color:var(--ink,#1B2330);border-color:var(--brand-soft,#FBD0E9);}' +
        '#' + ID + ' .vnf-btn-suave[data-hecho="1"]{color:var(--ok,#0E7A4F);border-color:var(--ok,#0E7A4F);}' +
        '#' + ID + ' .vnf-btn-suave[data-hecho="0"]{color:var(--warn,#B45309);border-color:var(--warn,#B45309);}' +
        '#' + ID + ' .vnf-pista-url{word-break:break-all;user-select:all;}' +
        '#' + ID + ' .vnf-btn[hidden]{display:none;}' +

        /* Sin GSAP la entrada/salida la hace CSS: mismas propiedades (transform+opacity). */
        '#' + ID + ' .vnf-card{opacity:0;transform:translateY(18px);' +
        'transition:opacity .28s ease,transform .28s cubic-bezier(.2,.8,.2,1);}' +
        '#' + ID + '.vnf-visible .vnf-card{opacity:1;transform:none;}' +

        /* Cuando anima GSAP, la transición de CSS se APAGA. Las dos estaban tocando
           opacity y transform a la vez: GSAP escribe el estilo en línea en cada
           fotograma y la transición intentaba interpolar hacia ese valor recién
           escrito, así que cada fotograma arrancaba una transición nueva de 280 ms
           que nunca terminaba. Se veía como un arrastre blando —la tarjeta llegaba
           tarde a su propia animación— y obligaba al compositor a recalcular estilo
           60 veces por segundo para nada. Con una sola fuente de verdad, la entrada
           es transform+opacity puros y se compone en GPU. */
        '#' + ID + '.vnf-gsap .vnf-card{transition:none;}' +

        /* En px, como el resto del proyecto: verificado en navegador, una condición
           en rem/em no llega a evaluarse aquí y el layout angosto nunca entraba. */
        '@media (max-width: 480px){' +
        '#' + ID + ' .vnf-card{grid-template-columns:auto minmax(0,1fr);' +
        'grid-template-areas:"chip texto" "acciones acciones";gap:.85rem;}' +
        '#' + ID + ' .vnf-x{position:absolute;top:.55rem;right:.55rem;}' +
        '#' + ID + ' .vnf-card{position:relative;}' +
        '#' + ID + ' .vnf-acciones .vnf-btn{flex:1 1 auto;}}' +

        '@media (prefers-reduced-motion:reduce){' +
        '#' + ID + ' .vnf-card,#' + ID + ' .vnf-btn{transition-duration:.01ms;}' +
        '#' + ID + ' .vnf-btn:hover{transform:none;}}' +

        '@media print{#' + ID + '{display:none !important;}}';
      document.head.appendChild(s);
    }

    /**
     * Texto según a dónde íbamos y por qué no llegamos.
     *
     * Tres reglas, porque quien lee esto está a media tarea y con un cliente delante:
     *
     *   1. Nada de culpa. El asesor no hizo nada mal y el sistema tampoco se rompió;
     *      es un límite del navegador. El aviso lo dice sin jerga y sin disculparse.
     *   2. Primero la tranquilidad, luego el motivo. Antes de explicar nada se aclara
     *      que no se perdió trabajo: es la única pregunta que importa en ese momento.
     *   3. Una sola instrucción. "Toca el botón y llegas" — sin alternativas, sin
     *      "intenta de nuevo", sin pasos numerados. El botón está justo debajo.
     *
     * Se evitan a propósito «redirección», «navegador bloqueó», «activación» y
     * «sandbox»: describen bien el fallo para quien programa y no significan nada
     * para quien está cotizando.
     */
    function copia(page, variante) {
      const destino = NOMBRES_PAGINA[page] || 'la siguiente pantalla';
      if (variante === 'sin-url') {
        return {
          titulo: 'Vamos a recargar y seguimos',
          desc: 'La aplicación perdió de vista su propia dirección, y por eso no puede cambiar de ' +
                'pantalla. Toca el botón: se recarga y todo vuelve a la normalidad.',
          accion: 'Recargar y continuar'
        };
      }
      return {
        // Solo la vista previa llega aquí SIEMPRE con la cotización ya escrita en
        // Sheets. En el resto no se puede prometer nada sobre un guardado, así que el
        // título se queda en la parte que sí es cierta en todos los casos.
        titulo: page === 'cotizado_preview'
          ? 'Listo, tu cotización ya quedó guardada'
          : 'Ya casi: solo falta un toque',
        desc: 'Esta pantalla se quedó quieta en lugar de llevarte a ' + destino + '. No perdiste ' +
              'nada de lo que hiciste. Toca el botón de abajo y sigues justo donde ibas.',
        accion: 'Ir a ' + destino
      };
    }

    function construir() {
      estilos();
      anclaje = document.createElement('div');
      anclaje.id = ID;
      anclaje.className = 'no-print';
      anclaje.innerHTML =
        '<div class="vnf-card" role="alert" aria-labelledby="vnf-titulo" aria-describedby="vnf-desc">' +
          '<span class="vnf-chip vnf-chip-marca" data-chip></span>' +
          '<div class="vnf-texto">' +
            '<p class="vnf-titulo" id="vnf-titulo" data-titulo></p>' +
            '<p class="vnf-desc" id="vnf-desc" data-desc></p>' +
            '<p class="vnf-pista" data-pista hidden></p>' +
          '</div>' +
          '<button type="button" class="vnf-x" data-cerrar aria-label="Cerrar aviso">' + icono(D_CERRAR) + '</button>' +
          '<div class="vnf-acciones">' +
            '<a class="vnf-btn vnf-btn-primario" data-ir target="_top" rel="noopener"></a>' +
            '<button type="button" class="vnf-btn vnf-btn-suave" data-copiar>' + icono(D_ENLACE) + '<span>Copiar enlace</span></button>' +
            '<button type="button" class="vnf-btn vnf-btn-suave" data-soporte hidden>' + icono(D_CORREO) + '<span>Escribir a soporte</span></button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(anclaje);
      tarjeta = anclaje.querySelector('.vnf-card');

      anclaje.querySelector('[data-cerrar]').addEventListener('click', ocultar);
      anclaje.querySelector('[data-copiar]').addEventListener('click', copiar);
      anclaje.querySelector('[data-soporte]').addEventListener('click', function () {
        if (window.AppSupport && AppSupport.open) AppSupport.open();
      });

      // Si el enlace tampoco abre nada, en unos segundos escalamos la ayuda en vez
      // de dejar al asesor mirando el mismo aviso sin saber qué más hacer.
      anclaje.querySelector('[data-ir]').addEventListener('click', function () {
        if (escalaTimer) clearTimeout(escalaTimer);
        escalaTimer = setTimeout(escalar, 2600);
      });

      alTeclado = function (e) { if (e.key === 'Escape') ocultar(); };
      document.addEventListener('keydown', alTeclado);

      // El bucle de la flecha se duerme con la pestaña. Nadie lo está viendo y el
      // navegador ya ralentiza los rAF de fondo, pero un tween activo mantiene el
      // ticker de GSAP despierto y eso sí se nota en la batería de un portátil con
      // veinte pestañas abiertas.
      alVisibilidad = function () {
        if (!latido) return;
        if (document.visibilityState === 'hidden') latido.pause();
        else latido.resume();
      };
      document.addEventListener('visibilitychange', alVisibilidad);
    }

    function copiar() {
      const btn = anclaje.querySelector('[data-copiar]');
      const rotulo = btn.querySelector('span');
      // La respuesta la da el BOTÓN, no un toast: en el Portal no existe AppMotion y
      // un fallo silencioso deja al asesor pegando un portapapeles vacío.
      const listo = function (ok) {
        btn.dataset.hecho = ok ? '1' : '0';
        btn.querySelector('svg').outerHTML = icono(ok ? D_CHECK : D_ALERTA);
        rotulo.textContent = ok ? 'Enlace copiado' : 'Cópialo a mano';
        if (!ok) {
          // Última salida: se deja el enlace seleccionado para copiarlo con Ctrl+C.
          const pista = anclaje.querySelector('[data-pista]');
          pista.textContent = 'No pudimos usar el portapapeles. Copia este enlace: ' + (estado && estado.url ? estado.url : '');
          pista.classList.add('vnf-pista-url');
          pista.hidden = false;
          try {
            const rango = document.createRange();
            rango.selectNodeContents(pista);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(rango);
          } catch (e) {}
        }
        if (ok && window.AppMotion && AppMotion.pop) AppMotion.pop(btn);
        setTimeout(function () {
          if (!btn.isConnected) return;
          btn.removeAttribute('data-hecho');
          btn.querySelector('svg').outerHTML = icono(D_ENLACE);
          rotulo.textContent = 'Copiar enlace';
        }, ok ? 2600 : 6000);
      };
      const url = estado && estado.url;
      if (!url) return listo(false);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { listo(true); }, function () { listo(copiaRespaldo(url)); });
      } else {
        listo(copiaRespaldo(url));
      }
    }

    function copiaRespaldo(texto) {
      try {
        const ta = document.createElement('textarea');
        ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return !!ok;
      } catch (e) { return false; }
    }

    /** El enlace no bastó: se ofrece la salida manual y el contacto con soporte. */
    function escalar() {
      if (!anclaje) return;
      const pista = anclaje.querySelector('[data-pista]');
      // Si ya se está mostrando el enlace a mano (falló el portapapeles), ese texto
      // es más útil que este: no se pisa.
      if (!pista.classList.contains('vnf-pista-url')) {
        pista.textContent = '¿Sigue sin abrir? Copia el enlace y pégalo en una pestaña nueva del navegador.';
        pista.hidden = false;
      }
      if (window.AppSupport && AppSupport.open) anclaje.querySelector('[data-soporte]').hidden = false;
      if (conGsap()) gsap.fromTo(tarjeta, { x: -6 }, { x: 0, duration: .5, ease: 'elastic.out(1,.3)', clearProps: 'x' });
    }

    /**
     * Empujón en bucle de la flecha del botón principal.
     *
     * El aviso pide UNA cosa —"toca el botón"— y el ojo tiene que encontrarlo sin
     * leer. Es un movimiento de 3 px sobre un SVG de 20: se percibe como una
     * dirección, no como algo parpadeando. Anima `x` (transform) sobre un elemento
     * que ya está compuesto en su propia capa, así que el bucle no cuesta layout ni
     * pintado: el compositor solo desplaza la capa.
     *
     * Se detiene mientras la pestaña no está a la vista. Un `repeat: -1` en una
     * pestaña de fondo mantiene vivo el ticker de GSAP para siempre, y este aviso
     * puede quedarse abierto media jornada.
     */
    function empujarFlecha() {
      if (latido) { latido.kill(); latido = null; }
      if (!anclaje || !conGsap()) return;
      const flecha = anclaje.querySelector('[data-ir] .vnf-ico');
      if (!flecha) return;
      latido = gsap.to(flecha, {
        x: 3, duration: .78, ease: 'sine.inOut', force3D: true,
        repeat: -1, yoyo: true, repeatDelay: .55
      });
    }

    function mostrar(opts) {
      const url = opts.url || '';
      const page = opts.page || '';
      const variante = opts.variante || 'nav';
      estado = { url: url, page: page, variante: variante };

      // El loader tapa la pantalla: si el aviso aparece, la espera terminó. Hay que
      // bajar LOS DOS: AppUrl.go abre la escena de VentelFX cuando el motor está en
      // la pantalla, y sin esta línea el camión seguía viajando sobre «Abriendo
      // Promociones…» mientras el aviso, justo debajo, decía que la navegación no
      // salió — y no se apagaba hasta el tope de seguridad, veinte segundos después.
      try { if (window.VentelFX) VentelFX.hideOverlay(); } catch (e) {}
      try { if (window.VentelLoader) VentelLoader.hide(); } catch (e) {}

      const yaEstaba = !!anclaje;
      if (!yaEstaba) construir();

      const txt = copia(page, variante);
      const chip = anclaje.querySelector('[data-chip]');
      chip.className = 'vnf-chip ' + (variante === 'sin-url' ? 'vnf-chip-aviso' : 'vnf-chip-marca');
      chip.innerHTML = icono(variante === 'sin-url' ? D_ALERTA : D_FLECHA);
      anclaje.querySelector('[data-titulo]').textContent = txt.titulo;
      anclaje.querySelector('[data-desc]').textContent = txt.desc;

      const ir = anclaje.querySelector('[data-ir]');
      ir.innerHTML = icono(variante === 'sin-url' ? D_RECARGA : D_FLECHA) + '<span>' + txt.accion + '</span>';
      if (variante === 'sin-url') {
        ir.removeAttribute('href');
        ir.setAttribute('role', 'button');
        ir.setAttribute('tabindex', '0');
        ir.onclick = function () { try { window.top.location.reload(); } catch (e) { location.reload(); } };
      } else {
        ir.setAttribute('href', url);
        ir.removeAttribute('role');
        ir.removeAttribute('tabindex');
        ir.onclick = null;
      }
      anclaje.querySelector('[data-copiar]').hidden = (variante === 'sin-url');

      // El botón es la única instrucción del aviso, así que se señala solo. Se
      // recablea también cuando el aviso YA estaba abierto, porque arriba se acaba de
      // reescribir el innerHTML del botón: el bucle anterior seguiría animando un
      // nodo que ya no está en el documento, gastando fotogramas en la nada.
      empujarFlecha();

      if (yaEstaba) return;   // ya visible: solo se actualizó el contenido

      if (conGsap()) {
        // Apaga la transición de CSS: a partir de aquí manda GSAP y nadie más toca
        // opacity ni transform (ver la nota junto a la regla .vnf-gsap).
        anclaje.classList.add('vnf-gsap', 'vnf-visible');
        gsap.set(tarjeta, { clearProps: 'opacity,transform' });

        // Todo el movimiento es transform + opacity: ni una propiedad que provoque
        // reflow. El escalonado de los botones va con `amount` y no con un escalón
        // por elemento, por la misma razón que en app_motion: con dos botones o con
        // cuatro, la entrada termina siempre a la vez.
        entrada = gsap.timeline({ defaults: { ease: 'power3.out', force3D: true } });
        entrada
          .fromTo(tarjeta, { opacity: 0, yPercent: 12, scale: .97 },
                           { opacity: 1, yPercent: 0, scale: 1, duration: .5 })
          .from(chip, { scale: .5, duration: .45, ease: 'back.out(2.2)' }, '-=.34')
          .from(anclaje.querySelectorAll('.vnf-texto > *'),
                { opacity: 0, y: 6, duration: .32, stagger: { amount: .1 } }, '-=.36')
          .from(anclaje.querySelectorAll('.vnf-acciones .vnf-btn:not([hidden])'),
                { opacity: 0, y: 10, duration: .34, stagger: { amount: .12 } }, '-=.26')
          // Se limpia AL FINAL y de una sola vez. Hacerlo tween por tween devolvía
          // cada elemento a su estilo de hoja mientras los demás seguían animando,
          // que es justo cuando se notaba un salto de un fotograma.
          .set([tarjeta, chip, anclaje.querySelectorAll('.vnf-texto > *'),
                anclaje.querySelectorAll('.vnf-acciones .vnf-btn')],
               { clearProps: 'transform' });
      } else {
        // requestAnimationFrame para que la transición CSS tenga un estado inicial.
        requestAnimationFrame(function () { if (anclaje) anclaje.classList.add('vnf-visible'); });
      }

      // El foco se mueve al final de la entrada: antes cortaría el anuncio del lector.
      setTimeout(function () {
        try { anclaje.querySelector('[data-ir]').focus({ preventScroll: true }); } catch (e) {}
      }, conGsap() ? 460 : 300);
    }

    function ocultar() {
      if (!anclaje) return;
      const fuera = anclaje;
      const card = tarjeta;
      if (escalaTimer) { clearTimeout(escalaTimer); escalaTimer = null; }
      if (alTeclado) { document.removeEventListener('keydown', alTeclado); alTeclado = null; }
      if (alVisibilidad) { document.removeEventListener('visibilitychange', alVisibilidad); alVisibilidad = null; }
      // Las dos animaciones se matan ANTES de la salida. La de entrada, porque si el
      // aviso se cierra a media entrada seguiría escribiendo transform encima de la
      // salida y las dos pelearían por el mismo estilo. El bucle, porque `repeat:-1`
      // no termina solo: sin este kill, cada aviso cerrado deja un tween eterno
      // animando un nodo que ya no existe, y el ticker de GSAP nunca vuelve a dormir.
      if (entrada) { entrada.kill(); entrada = null; }
      if (latido) { latido.kill(); latido = null; }
      anclaje = null; tarjeta = null; estado = null;

      const quitar = function () { if (fuera.parentNode) fuera.parentNode.removeChild(fuera); };
      if (conGsap()) {
        gsap.to(card, { opacity: 0, yPercent: 8, scale: .98, duration: .24,
                        ease: 'power2.in', force3D: true, onComplete: quitar });
      } else {
        fuera.classList.remove('vnf-visible');
        setTimeout(quitar, 300);
      }
    }

    /**
     * Programa el aviso, pero lo CANCELA si la página realmente se está yendo.
     * Sin esto el temporizador dispara aunque la navegación sí haya ocurrido y el
     * asesor ve un aviso de fallo un instante antes de que cargue la pantalla buena.
     */
    function programar(ms, fn) {
      let t = setTimeout(function () { limpiar(); fn(); }, ms);
      function limpiar() {
        window.removeEventListener('pagehide', cancelar);
        window.removeEventListener('beforeunload', cancelar);
        document.removeEventListener('visibilitychange', alOcultarse);
      }
      function cancelar() { if (t) { clearTimeout(t); t = null; } limpiar(); }
      function alOcultarse() { if (document.visibilityState === 'hidden') cancelar(); }
      window.addEventListener('pagehide', cancelar);
      window.addEventListener('beforeunload', cancelar);
      document.addEventListener('visibilitychange', alOcultarse);
    }

    return { mostrar: mostrar, ocultar: ocultar, programar: programar, visible: function () { return !!anclaje; } };
  })();

  /**
   * ===========================================================================
   * PARÁMETROS DE VISTA (espejo de PARAMS_VISTA en Code.gs)
   * ===========================================================================
   * La lista está en los dos lados a propósito, y las dos tienen que decir lo mismo:
   * el servidor los INYECTA al renderizar y el cliente los LEE. Escribirlos aquí
   * también permite lo que antes no se podía: preguntar "¿con qué parámetros me
   * abrieron?" sin ir nombre por nombre, y volver a escribirlos en la barra de
   * direcciones cuando la pantalla cambia de estado.
   *
   * `ancla` viaja además como fragmento (#), que es su sitio natural: dice a qué
   * apartado bajar y no es asunto del servidor. Se manda por los dos canales porque
   * dentro del iframe de Apps Script el fragmento se pierde con facilidad.
   *
   * `item` es el elemento concreto que se eligió en otra pantalla —una herramienta del
   * Portal, una paquetería— para que el destino lo abra ya resaltado. Llevaba tiempo
   * viajando en enlaces construidos a mano (la paleta de comandos manda a
   * `portal?sec=…&q=…&item=…`) y funcionaba de casualidad: el Portal lee la URL real
   * con google.script.url, así que no le hacía falta esta lista. Pero AppUrl.params()
   * sí la usa, y no lo devolvía. Escrito aquí, las dos formas de leer coinciden.
   *
   * `estatus`, `dir` y `origen` son los tres filtros que T1.2 añadió al contrato: el
   * estatus de la tabla de supervisión y la dirección/origen del Monitor de promociones.
   * Son facetas, no identidades, así que van aparte de `q` —que es el texto libre del
   * buscador— y se escriben REEMPLAZANDO, nunca apilando.
   *
   * `pub` es la publicación del Portal que se abre en grande. Es una identidad, como
   * `folio` o `promo`, y por eso apila historial al abrirse: el modal de una publicación
   * es un sitio del que se vuelve con «atrás». Viaja en esta lista para que sobreviva al
   * login —quien recibe el enlace sin sesión aterriza en la publicación, no en el inicio—.
   *
   * Quien añada un nombre aquí lo añade también en Code.gs y en la lista PASAN del
   * Index: son tres listas espejo y el sistema no avisa cuando dejan de decir lo mismo.
   */
  const PARAMS_VISTA = ['folio', 'action', 'format', 'q', 'buscar', 'tpl', 'sec', 'ancla', 'inc', 'next', 'promo', 'item', 'rango', 'estatus', 'dir', 'origen', 'pub', 'art'];

  /** Parámetros de campaña que ensucian un enlace compartido y no significan nada aquí. */
  const PARAMS_BASURA = /^(utm_|fbclid$|gclid$|mc_eid$|_ga$)/i;

  /** Quien quiere enterarse de que se está navegando (ver AppUrl.alNavegar). */
  const oyentesNav = [];

  /* ── Estado VIVO de la URL ──────────────────────────────────────────────────
     Lo que la barra de direcciones dice AHORA, no lo que decía al renderizar.
     `actualizar()` lo apunta al escribir y atrás/adelante lo repone. Sin esto,
     AppUrl.param() contestaba el valor del render aunque la URL ya hubiera
     cambiado, y una pantalla que reescribía un parámetro arrastraba el valor
     viejo de los demás (estado.html reescribía `inc` así al cambiar de rango). */
  let urlViva = null;

  /** Pantalla declarada por el shell o por la propia página (ver declararPagina). */
  let paginaDeclarada = '';

  /* reflejar() junta los reemplazos que llegan en ráfaga (teclear en un filtro)
     y los escribe una sola vez. */
  let reflejoPendiente = null;
  let relojReflejo = null;

  /* Oyentes de atrás/adelante. google.script.history solo admite UN manejador
     —setChangeHandler pisa al anterior—, así que el módulo registra el suyo una
     única vez y reparte el aviso: si dos módulos escuchan, ya no gana el último. */
  const oyentesUrl = [];
  let manejadorUrlPuesto = false;

  function ponerManejadorUrl() {
    if (manejadorUrlPuesto) return true;
    try {
      if (!(window.google && google.script && google.script.history)) return false;
      google.script.history.setChangeHandler(function (e) {
        const loc = (e && e.location) || {};
        // La barra manda: lo que el navegador acaba de poner ES el estado vigente.
        urlViva = Object.assign({}, loc.parameter || {});
        oyentesUrl.forEach(function (cb) {
          try { cb(loc); } catch (err) { console.error(err); }
        });
      });
      manejadorUrlPuesto = true;
      return true;
    } catch (e) { return false; }
  }

  const AppUrl = {
    base: cfg.baseUrl || '',

    /** Todas las pantallas que el enrutador conoce (espejo de PAGES + PORTAL_PAGES). */
    PAGINAS: [
      'login', 'registro', 'recuperar',
      'dashboard', 'inicio_avanzado', 'cotizacion', 'cotizado_preview', 'consulta_cotizacion',
      'revision_cotizacion', 'correoventel', 'correo_cliente', 'anuncios', 'portal_contenido',
      'operacion', 'consola', 'atenciones',
      'portal', 'promociones', 'estado', 'articulo'
    ],

    /**
     * ¿Es una clave de pantalla que existe?
     *
     * Importa porque el enrutador del servidor manda al Portal CUALQUIER cosa que no
     * reconozca: una página mal escrita no da error, da la landing. Eso está bien para
     * quien llega con un enlace viejo y fatal para quien está programando, porque el
     * fallo se ve como "el botón lleva al Portal" y no como "esa pantalla no existe".
     */
    existe: function (page) { return this.PAGINAS.indexOf(String(page || '')) !== -1; },

    /**
     * Construye la URL completa de una página con sus parámetros.
     *
     * Nunca se concatena a mano: URLSearchParams codifica los espacios, los acentos y
     * los «&» que traen los nombres de cliente, y evita el clásico doble «?».
     * Los parámetros salen ORDENADOS para que el mismo destino produzca siempre la
     * misma cadena —dos enlaces al mismo folio se ven iguales al pegarlos en un chat—.
     *
     * @param {string} page
     * @param {object=} params  Los vacíos se descartan: '?folio=' no dice nada.
     * @param {string=} ancla   Apartado al que bajar (#). Se manda también como
     *   parámetro porque dentro del iframe del sandbox el fragmento no siempre llega.
     */
    build: function (page, params, ancla) {
      if (!this.base) return null;
      if (!this.existe(page)) {
        // No se devuelve null: el enlace sigue siendo utilizable y el servidor lo
        // resolverá como Portal. Lo que no puede pasar es que nadie se entere.
        console.warn('AppUrl: la pantalla "' + page + '" no está en el catálogo de páginas.');
      }
      const search = new URLSearchParams();
      search.set('page', page);
      const claves = Object.keys(params || {}).filter(function (k) {
        const v = params[k];
        return v !== '' && v !== null && v !== undefined && !PARAMS_BASURA.test(k);
      }).sort();
      claves.forEach(function (k) { search.set(k, params[k]); });
      if (ancla) search.set('ancla', String(ancla).replace(/^#/, ''));
      return this.base + '?' + search.toString() +
             (ancla ? '#' + encodeURIComponent(String(ancla).replace(/^#/, '')) : '');
    },

    /**
     * Navega (rompiendo el iframe de Apps Script con window.top).
     *
     * Cuando la navegación se decide DESPUÉS de una llamada larga al servidor
     * —guardar una cotización con sus productos y su webhook tarda varios
     * segundos— la activación del clic ya venció y el navegador ignora la
     * asignación EN SILENCIO: no hay excepción, la pantalla simplemente se queda
     * quieta. Por eso, si la activación ya no está viva, no se finge que
     * avanzamos: se ofrece un enlace normal, cuyo clic es una activación nueva y
     * esa sí navega. Devuelve false solo cuando falta la URL base, que es lo
     * único que las pantallas tratan como error.
     */
    /**
     * Avisa ANTES de cada navegación, con la pantalla de destino.
     *
     * Existe para que la precarga predictiva pueda aprender el grafo de la app sin
     * que nadie tenga que ir botón por botón: toda navegación —barra lateral,
     * conmutador de áreas, paleta de comandos, enlaces de cada pantalla— pasa por
     * `go`, así que este es el único sitio donde hace falta escuchar.
     *
     * Se avisa ANTES y no después a propósito: después no hay después. La línea
     * siguiente asigna `window.top.location` y esta página se está descargando; un
     * aviso posterior no siempre llega a ejecutarse, y lo que hay que anotar es
     * precisamente el trayecto que se acaba de decidir.
     *
     * Un oyente que falle no puede impedir la navegación: el trabajo de esta
     * función es llevar a la pantalla, y una anotación rota no es motivo para
     * dejar a nadie donde estaba.
     *
     * Mismo contrato que AppOperacion.alCambiar y AppPrefs.alCambiar: devuelve la
     * función para dejar de escuchar.
     */
    alNavegar: function (cb) {
      if (typeof cb !== 'function') return function () {};
      oyentesNav.push(cb);
      return function () {
        const i = oyentesNav.indexOf(cb);
        if (i > -1) oyentesNav.splice(i, 1);
      };
    },

    go: function (page, params, ancla) {
      oyentesNav.forEach(function (cb) {
        try { cb(page, params); } catch (e) { console.error(e); }
      });

      const url = this.build(page, params, ancla);
      if (!url) {
        // Antes esto era un alert() del navegador: bloquea el iframe, no explica
        // nada y al cerrarlo no deja ninguna salida. El aviso sí ofrece la acción
        // que resuelve (recargar) sin quitarle el control al asesor.
        NavAviso.mostrar({ url: '', page: page, variante: 'sin-url' });
        return false;
      }

      if (!activacionViva()) {
        this.mostrarEnlaceManual(url, page);
        return true;
      }

      // Continuidad visual: la transición entre vistas se cubre con la escena
      // del DESTINO, no con una genérica. En Apps Script cambiar de pantalla
      // recarga la webapp entera (2-5 s), así que ésta es la espera más
      // frecuente del portal: que la animación diga a dónde vas —etiquetas si
      // vas a Promociones, bolsa si vas a Atenciones— convierte esos segundos
      // en confirmación de que el clic se registró.
      /* Se pasa por VentelLoader.show(), que YA resuelve la escena del destino por
         su ficha, y no por VentelFX.overlay a pelo. Llamando al motor directamente
         se saltaban las dos cosas que hace el partial: cerrar la escena que hubiera
         abierta y retirar el isotipo de arranque. Por eso los sitios que encendían
         su propia escena y acto seguido navegaban —once entre el Portal y el Monitor:
         «Cotizaciones», «Enviar un Correo», Atenciones, el buscador general— dejaban
         DOS escenas a pantalla completa superpuestas medio segundo, y encima con
         títulos distintos, porque la primera no sabía a dónde iba. */
      try {
        if (window.VentelLoader) {
          VentelLoader.show({ pagina: page });
        } else if (window.VentelFX) {
          const ficha = VentelFX.para(page);
          VentelFX.overlay(ficha.tema, { title: ficha.titulo, sub: ficha.sub, maxMs: 20000 });
        }
      } catch (e) {}
      let fallo = null;
      try { window.top.location.href = url; } catch (e) { fallo = e; }

      // Si ni siquiera se pudo tocar window.top, no hay nada que esperar: el aviso
      // sale ya, en vez de dejar el loader girando tres segundos para nada.
      if (fallo) { this.mostrarEnlaceManual(url, page); return true; }

      // Red de seguridad para el caso límite: la activación estaba por vencer y el
      // navegador la descartó de todos modos. El temporizador se cancela solo si la
      // navegación sí ocurrió (la página empieza a descargarse), así que ya no se
      // asoma el aviso un instante antes de que cargue la pantalla correcta.
      const self = this;
      NavAviso.programar(3000, function () { self.mostrarEnlaceManual(url, page); });
      return true;
    },

    /**
     * Aviso de recuperación con el enlace directo a la pantalla destino.
     * La construcción vive en NavAviso (arriba): aquí solo queda la puerta de
     * entrada que ya usaban las pantallas.
     */
    mostrarEnlaceManual: function (url, page) {
      NavAviso.mostrar({ url: url, page: page, variante: 'nav' });
    },

    /** Cierra el aviso de navegación si está visible (útil al reintentar por otra vía). */
    ocultarEnlaceManual: function () { NavAviso.ocultar(); },

    /**
     * Copia al portapapeles un enlace directo a una vista (deep-link) para
     * compartirlo: p. ej. AppUrl.copyLink('consulta_cotizacion', { folio }).
     * Devuelve una promesa que resuelve true si se copió.
     */
    copyLink: function (page, params) {
      const url = this.build(page, params);
      if (!url) return Promise.resolve(false);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(url).then(function () { return true; }, function () { return false; });
      }
      try {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve(!!ok);
      } catch (e) { return Promise.resolve(false); }
    },

    /**
     * Página de inicio que corresponde a los permisos del usuario.
     * Se pregunta por los BLOQUES y no por el rol: a un supervisor al que se le retiró
     * la supervisión hay que dejarlo en el panel normal, no en una pantalla que el
     * servidor le va a rechazar entera. Y al revés: a quien solo se le concedió la
     * gestión del equipo, el panel avanzado SÍ le sirve —es donde vive su apartado—,
     * así que preguntar únicamente por 'supervision' lo mandaba al panel equivocado.
     */
    homePage: function () {
      const deCasa = ['supervision', 'sup_equipo'];
      return deCasa.some(function (b) { return AppSession.can(b); }) ? PAGE_HOME_ADVANCED : PAGE_HOME_NORMAL;
    },
    goHome: function (params) { return this.go(this.homePage(), params); },

    /**
     * Pantallas a las que el login puede devolver a alguien (?next=...).
     *
     * `next` NO es una URL: es la CLAVE de una pantalla, y solo vale si está en
     * esta lista. Aceptar una URL —por más que se validara el dominio— convertiría
     * el inicio de sesión en un redirector: bastaría repartir un enlace con
     * ?next=<sitio que copia el login> para que un asesor acabe tecleando su
     * contraseña en otra parte. Con una clave, el peor caso posible es abrir otra
     * pantalla del propio sistema. Las de autenticación quedan fuera para que no
     * se pueda encadenar login → login.
     */
    PAGINAS_TRAS_LOGIN: [
      'cotizacion', 'cotizado_preview', 'consulta_cotizacion', 'revision_cotizacion',
      'correoventel', 'correo_cliente', 'anuncios', 'portal_contenido', 'dashboard',
      'inicio_avanzado', 'consola', 'operacion', 'estado', 'atenciones', 'articulo'
    ],

    /**
     * Va a la pantalla que se pidió antes de que el login se interpusiera, o al
     * panel del rol si no había ninguna (o si la que venía no está permitida).
     */
    goNextOrHome: function () {
      const next = this.param('next');
      if (next && this.PAGINAS_TRAS_LOGIN.indexOf(next) !== -1) {
        /* Se reponen los parámetros de vista que viajaron junto al next (ver
           requireSession), SANEADOS: solo claves de PARAMS_VISTA —params() no
           devuelve otras—, valores acotados a texto corto, y jamás `next` de
           vuelta, que encadenaría login → login. La página ya la validó la lista
           blanca de arriba; con esto, el enlace compartido sobrevive al login
           entero: página + pestaña + filtro + elemento. */
        const repuestos = {};
        const params = this.params();
        Object.keys(params).forEach(function (k) {
          if (k === 'next') return;
          const v = String(params[k]).slice(0, 200);
          if (v) repuestos[k] = v;
        });
        return this.go(next, repuestos);
      }
      return this.goHome();
    },

    /**
     * Lee un parámetro VIGENTE: si la pantalla ya reescribió la URL (actualizar/
     * reflejar) o el usuario usó atrás/adelante, manda ese último estado —incluida
     * la ausencia: un parámetro que se quitó de la barra responde vacío aunque el
     * render lo hubiera traído—. Solo antes de la primera escritura se cae a las
     * fuentes del render: lo inyectado por el servidor y la URL del iframe.
     */
    param: function (name) {
      if (urlViva) return (name in urlViva) ? String(urlViva[name] || '') : '';
      if (cfg[name]) return String(cfg[name]);
      try { return new URLSearchParams(window.location.search).get(name) || ''; } catch (e) { return ''; }
    },

    /** Todos los parámetros de vista con los que se abrió esta pantalla. */
    params: function () {
      const self = this;
      const out = {};
      PARAMS_VISTA.forEach(function (n) {
        const v = self.param(n);
        if (v) out[n] = v;
      });
      return out;
    },

    /**
     * Reescribe la URL de la barra de direcciones SIN recargar.
     *
     * Es lo que convierte una pantalla con estado en algo que se puede compartir: abrir
     * una sección, filtrar una tabla o elegir una plantilla deja de ser algo que solo
     * existe en la cabeza del navegador y pasa a estar en el enlace. Quien lo pegue en
     * un chat abre exactamente lo mismo, y el botón "atrás" hace lo que promete.
     *
     * Dentro del iframe de Apps Script `history.replaceState` no sirve —cambiaría la
     * URL del iframe, que nadie ve—: hay que pasar por google.script.history, que habla
     * con la ventana de arriba. Donde no exista, no pasa nada: es una mejora, no un
     * requisito, y ninguna pantalla debe depender de que haya funcionado.
     *
     * @param {object} params  Los vacíos o nulos se QUITAN de la URL.
     * @param {string=} ancla
     * @param {boolean=} apilar true = entrada nueva en el historial (atrás vuelve aquí).
     *   Por omisión reemplaza: filtrar una tabla no merece una entrada por cada tecla.
     */
    actualizar: function (params, ancla, apilar) {
      try {
        if (!(window.google && google.script && google.script.history)) return false;
        const limpio = {};
        Object.keys(params || {}).forEach(function (k) {
          const v = params[k];
          if (v !== '' && v !== null && v !== undefined) limpio[k] = String(v);
        });
        const hash = ancla ? String(ancla).replace(/^#/, '') : null;
        const metodo = apilar ? google.script.history.push : google.script.history.replace;
        metodo.call(google.script.history, limpio, limpio, hash);
        // Lo recién escrito pasa a ser el estado vigente que param() contesta, y el
        // manejador queda puesto para que atrás/adelante también lo mantenga al día.
        urlViva = Object.assign({}, limpio);
        ponerManejadorUrl();
        return true;
      } catch (e) { return false; }
    },

    /**
     * La pantalla (o el shell) declara qué página está abierta. reflejar() lo
     * necesita porque google.script.history REEMPLAZA la query completa: escribir
     * sin `page` dejaría una URL que al recargar cae en el Portal.
     */
    declararPagina: function (clave) {
      if (this.existe(clave)) paginaDeclarada = String(clave);
    },

    /**
     * La puerta ÚNICA para reflejar el estado de la pantalla en la URL, con la
     * convención del plan de cierre: cambiar de pestaña/sección APILA historial
     * (atrás vuelve a la anterior); un filtro o búsqueda REEMPLAZA, con espera de
     * 300 ms para que teclear no escriba la barra letra por letra (como ya hacía
     * el buscador del Index con 350 ms).
     *
     * Recibe solo lo que CAMBIÓ: el resto de la URL vigente se conserva —es lo
     * que evita "cambié el periodo y se me cerró la incidencia abierta"—. Un
     * valor vacío o nulo QUITA ese parámetro de la barra.
     *
     *   AppUrl.reflejar({ sec: 'plantillas' }, { apilar: true });
     *   AppUrl.reflejar({ q: termino });               // espera y reemplaza
     *   AppUrl.reflejar({ inc: '' });                  // quita ?inc
     */
    reflejar: function (params, opts) {
      opts = opts || {};
      const self = this;

      // El estado sobre el que se aplica el cambio: la URL vigente, o —antes de la
      // primera escritura— lo que trajo el render, sin `next` (ya cumplió al entrar).
      let base;
      if (urlViva) {
        base = Object.assign({}, urlViva);
      } else {
        base = this.params();
        delete base.next;
        const pg = this.param('page') || paginaDeclarada;
        if (pg) base.page = pg;
      }
      if (!base.page) return false;   // sin página conocida no se escribe: ver declararPagina

      const fusion = Object.assign(base, reflejoPendiente || {}, params || {});
      reflejoPendiente = null;

      if (opts.apilar) {
        if (relojReflejo) { clearTimeout(relojReflejo); relojReflejo = null; }
        return this.actualizar(fusion, opts.ancla, true);
      }

      reflejoPendiente = fusion;
      if (relojReflejo) clearTimeout(relojReflejo);
      relojReflejo = setTimeout(function () {
        relojReflejo = null;
        const p = reflejoPendiente;
        reflejoPendiente = null;
        if (p) self.actualizar(p, opts.ancla, false);
      }, 300);
      return true;
    },

    /**
     * Avisa cuando el usuario usa atrás/adelante. El callback recibe
     * {parameter, parameters, hash} tal como los da Apps Script.
     *
     * Admite VARIOS oyentes: por debajo hay un solo setChangeHandler (es lo único
     * que Apps Script permite) que además mantiene al día el estado vivo de la URL,
     * de modo que registrarse aquí nunca le quita el aviso a otro módulo.
     */
    alCambiarUrl: function (cb) {
      if (typeof cb !== 'function') return false;
      oyentesUrl.push(cb);
      return ponerManejadorUrl();
    },

    /**
     * Baja al apartado que pide la URL (?ancla=… o #…), una vez que está pintado.
     *
     * Se reintenta un momento porque casi todas estas pantallas dibujan su contenido
     * después de una llamada al servidor: buscar el elemento al cargar encontraría el
     * esqueleto y no el apartado. Se rinde en silencio: un ancla que ya no existe no
     * es motivo para molestar a nadie.
     */
    irAncla: function (nombre, intentos) {
      const self = this;
      const id = String(nombre || this.param('ancla') || '').replace(/^#/, '');
      if (!id) return;
      const el = document.getElementById(id);
      if (!el) {
        if ((intentos || 0) < 20) setTimeout(function () { self.irAncla(id, (intentos || 0) + 1); }, 150);
        return;
      }
      const suave = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      try { el.scrollIntoView({ behavior: suave ? 'smooth' : 'auto', block: 'start' }); } catch (e) { el.scrollIntoView(); }
      // Un destello corto: sin él, en una pantalla larga no se sabe cuál de los seis
      // apartados era el que traía el enlace.
      if (window.gsap && suave) {
        gsap.fromTo(el, { boxShadow: '0 0 0 0 rgba(225,0,152,.45)' },
          { boxShadow: '0 0 0 6px rgba(225,0,152,0)', duration: 1.4, ease: 'power2.out', clearProps: 'boxShadow' });
      }
    },

    /**
     * Atributos listos para un <a> interno: href + target="_top" + rel.
     *
     * Existe porque un enlace sin target="_top" navega DENTRO del iframe del sandbox y
     * deja la app anidada dentro de sí misma —un fallo que no da error, solo una
     * pantalla rarísima—, y porque a un href fabricado a mano se le olvida codificar
     * el primer nombre con acento que le pasa por delante.
     */
    attrs: function (page, params, ancla) {
      const url = this.build(page, params, ancla);
      if (!url) return 'href="#"';
      return 'href="' + escapeHtml(url) + '" target="_top" rel="noopener"';
    }
  };

  /** Pantallas que exigieron sesión: solo esas se expulsan si otra pestaña cierra sesión. */
  let sesionExigida = false;
  // Clave de la pantalla que exigió sesión, para volver a ella tras iniciar sesión otra vez.
  let paginaExigida = '';
  // Última respuesta del servidor en ESTA pestaña (para el latido de sesionVigilar).
  let ultimoContacto = Date.now();

  /**
   * Redirige a login cuando no hay sesión. Devuelve true si se puede continuar.
   *
   * La pantalla puede decir cómo se llama —requireSession('cotizacion')— y
   * entonces el login la devuelve ahí al terminar en vez de dejarla en el panel.
   * Sin argumento se comporta igual que siempre.
   */
  function requireSession(paginaActual) {
    sesionExigida = true;
    if (paginaActual) paginaExigida = paginaActual;
    if (AppSession.isLoggedIn()) return true;
    if (!paginaActual) {
      AppUrl.go('login');
      return false;
    }
    /* El estado profundo viaja COMPLETO a través del login: junto al `next` van los
       parámetros de vista con los que se abrió esta pantalla (folio, sec, q…), para
       que quien recibió un enlace teclee su contraseña y aterrice en LO QUE LE
       COMPARTIERON, no en la pantalla pelona. `next` sigue siendo solo una clave de
       página; los parámetros los sanea goNextOrHome al reponerlos. */
    const arrastre = AppUrl.params();
    delete arrastre.next;
    arrastre.next = paginaActual;
    AppUrl.go('login', arrastre);
    return false;
  }

  /**
   * Guardia de pantalla por BLOQUE (ver Permisos.gs).
   *
   * Exige sesión y, además, que la sesión traiga el bloque. No es una medida de
   * seguridad —la lista vive en localStorage y se puede editar— sino de cortesía:
   * evita que alguien llegue por un enlace a una pantalla que va a rechazarle cada
   * llamada y se quede mirando errores sin entender por qué. El candado de verdad
   * está en el servidor, en secIdentidadConBloque_.
   *
   * Admite VARIOS bloques: basta tener uno. Hay pantallas que son la casa de varias
   * facultades distintas —el panel avanzado reúne métricas, cola de revisión y política—
   * y exigir el bloque principal dejaba fuera a quien tenía concedida solo una de las
   * otras: el permiso existía pero no había puerta por la que ejercerlo. Lo que se
   * enseña DENTRO lo decide luego cada apartado por su cuenta.
   *
   * @param {string|string[]} bloqueId 'cotizar' · ['supervision','revisar']…
   * @param {string=} paginaActual Para que el login sepa a dónde devolver.
   */
  function requireBlock(bloqueId, paginaActual) {
    if (!requireSession(paginaActual)) return false;
    const lista = Array.isArray(bloqueId) ? bloqueId : [bloqueId];
    if (lista.some(function (b) { return AppSession.can(b); })) return true;
    const nombre = NOMBRES_PAGINA[paginaActual] || 'esta pantalla';
    try {
      if (window.AppMotion) AppMotion.toast('Tu cuenta no tiene acceso a ' + nombre + '.', 'error');
    } catch (e) {}
    AppUrl.goHome();
    return false;
  }

  /**
   * Escapa texto antes de meterlo en innerHTML. Los datos de una cotización
   * (nombre del cliente, observaciones, folio) los teclea un asesor y los ven
   * TODOS los demás desde la búsqueda global: sin escapar, un "<" rompe la tabla
   * y un fragmento de HTML se ejecutaría en la sesión de quien mira.
   */
  function escapeHtml(texto) {
    return String(texto == null ? '' : texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /** Escapa un valor que va DENTRO de un atributo onclick="fn('...')". */
  function escapeJsString(texto) {
    return String(texto == null ? '' : texto)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '&quot;')
      .replace(/</g, '\\u003C')
      .replace(/\r?\n/g, ' ');
  }

  /** Formato de moneda MXN, compartido por todas las pantallas. */
  function formatMoney(amount) {
    const n = parseFloat(amount);
    return (isNaN(n) ? 0 : n).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
  }

  /**
   * ===========================================================================
   * ALMACÉN LOCAL (caché)
   * ===========================================================================
   * Sirve para pintar datos al instante mientras se revalida contra el servidor
   * ("stale-while-revalidate"). NUNCA sustituye la consulta al servidor: si se
   * vacía entero, la app funciona igual, solo más lenta. Esa es la regla que
   * decide qué puede vivir aquí y qué no.
   *
   * Cada entrada se guarda como { s: esquema, at: epoch_ms, ttl, data } bajo la
   * clave 'ventel-cache-<nombre>', y el almacén:
   *   1. usa namespace propio (nunca pisa ni lo pisan otras claves del origen),
   *   2. descarta lo escrito con otro ESQUEMA (subir CACHE_SCHEMA = purga total),
   *   3. respeta un TTL por entrada y un tope duro de antigüedad,
   *   4. cae a memoria si el navegador bloquea el almacenamiento (modo privado,
   *      cookies bloqueadas, iframe restringido) en vez de lanzar una excepción,
   *   5. ante cuota llena purga lo caducado, luego lo más viejo, y reintenta.
   */
  const CACHE_PREFIX = 'ventel-cache-';
  const CACHE_SCHEMA = 2;                        // ← súbelo si cambia la FORMA de lo guardado
  const CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;  // tope duro por omisión: 24 h

  function createStore(obtenerStorage) {
    const mem = {};        // respaldo cuando el navegador no deja escribir
    let probado;           // Storage utilizable, o false

    function store() {
      if (typeof probado !== 'undefined') return probado;
      try {
        const s = obtenerStorage();
        s.setItem(CACHE_PREFIX + '_probe', '1');
        s.removeItem(CACHE_PREFIX + '_probe');
        probado = s;
      } catch (e) { probado = false; }
      return probado;
    }

    /** Nombres (sin prefijo) de todas las entradas del namespace. */
    function names() {
      const out = {};
      const s = store();
      if (s) {
        try {
          for (let i = 0; i < s.length; i++) {
            const k = s.key(i);
            if (k && k.indexOf(CACHE_PREFIX) === 0) out[k.slice(CACHE_PREFIX.length)] = true;
          }
        } catch (e) {}
      }
      Object.keys(mem).forEach(function (n) { out[n] = true; });
      return Object.keys(out);
    }

    function leerEntrada(name) {
      const s = store();
      let raw = null;
      try { raw = s ? s.getItem(CACHE_PREFIX + name) : null; } catch (e) { raw = null; }
      if (raw === null && Object.prototype.hasOwnProperty.call(mem, name)) raw = mem[name];
      if (!raw) return null;
      let entry;
      try { entry = JSON.parse(raw); } catch (e) { return 'corrupta'; }
      if (!entry || typeof entry.at !== 'number' || entry.s !== CACHE_SCHEMA) return 'corrupta';
      return entry;
    }

    function borrar(name) {
      const s = store();
      try { if (s) s.removeItem(CACHE_PREFIX + name); } catch (e) {}
      delete mem[name];
    }

    /** Elimina lo caducado y lo escrito con un esquema anterior. */
    function purgarCaducadas() {
      names().forEach(function (name) {
        const entry = leerEntrada(name);
        if (entry === 'corrupta') { borrar(name); return; }
        if (!entry) return;
        const limite = entry.ttl || CACHE_MAX_AGE_MS;
        if (Date.now() - entry.at > limite) borrar(name);
      });
    }

    /** Descarta las N entradas más viejas (último recurso ante cuota llena). */
    function soltarMasViejas(n, conservar) {
      const conFecha = names()
        .filter(function (name) { return name !== conservar; })
        .map(function (name) {
          const entry = leerEntrada(name);
          return { name: name, at: (entry && entry !== 'corrupta') ? entry.at : 0 };
        })
        .sort(function (a, b) { return a.at - b.at; });
      conFecha.slice(0, n).forEach(function (e) { borrar(e.name); });
    }

    function escribir(name, json) {
      const s = store();
      if (!s) { mem[name] = json; return false; }
      try { s.setItem(CACHE_PREFIX + name, json); delete mem[name]; return true; } catch (e) {}
      purgarCaducadas();
      try { s.setItem(CACHE_PREFIX + name, json); delete mem[name]; return true; } catch (e) {}
      soltarMasViejas(Math.max(1, Math.ceil(names().length / 2)), name);
      try { s.setItem(CACHE_PREFIX + name, json); delete mem[name]; return true; } catch (e) {}
      // Ni así cabe: se conserva en memoria para esta pestaña y se sigue.
      mem[name] = json;
      console.warn('Almacenamiento lleno: "' + name + '" solo vive en memoria.');
      return false;
    }

    return {
      /**
       * Devuelve { data, ageMs, at } o null. maxAgeMs acota además del TTL con
       * que se escribió (nunca lo amplía).
       */
      get: function (name, maxAgeMs) {
        const entry = leerEntrada(name);
        if (entry === 'corrupta') { borrar(name); return null; }
        if (!entry) return null;
        const ageMs = Date.now() - entry.at;
        const limite = Math.min(maxAgeMs || Infinity, entry.ttl || CACHE_MAX_AGE_MS);
        if (ageMs > limite) { borrar(name); return null; }
        return { data: entry.data, ageMs: ageMs, at: entry.at };
      },

      /** set(nombre, dato, { ttl }) — ttl en ms; por omisión, el tope duro. */
      set: function (name, data, opts) {
        const ttl = (opts && opts.ttl) || 0;
        let json;
        try { json = JSON.stringify({ s: CACHE_SCHEMA, at: Date.now(), ttl: ttl, data: data }); }
        catch (e) { return false; }   // dato no serializable: no es fatal, se sigue sin caché
        return escribir(name, json);
      },

      remove: function (name) { borrar(name); },

      /**
       * Tira TODAS las entradas de una familia ('quotes-', 'pendientes-'…).
       *
       * Es la herramienta de la invalidación por escritura entre pantallas: quien
       * aprueba una cotización no sabe —ni tiene por qué— con qué correo se guardó
       * la lista que acaba de dejar obsoleta, solo que ninguna copia de esa familia
       * sirve ya. Sin esto, volver al panel después de decidir enseñaba el folio
       * todavía en la cola.
       */
      removeByPrefix: function (prefijo) {
        if (!prefijo) return 0;
        const afectadas = this.keys(prefijo);
        afectadas.forEach(borrar);
        return afectadas.length;
      },

      /** Nombres guardados que empiezan con un prefijo. */
      keys: function (prefijo) {
        return names().filter(function (n) { return !prefijo || n.indexOf(prefijo) === 0; });
      },

      /** Conserva solo las `max` entradas más recientes de una familia. */
      prune: function (prefijo, max, conservar) {
        const lista = this.keys(prefijo)
          .filter(function (n) { return n !== conservar; })
          .map(function (name) {
            const entry = leerEntrada(name);
            return { name: name, at: (entry && entry !== 'corrupta') ? entry.at : 0 };
          })
          .sort(function (a, b) { return b.at - a.at; });
        lista.slice(Math.max(0, max - 1)).forEach(function (e) { borrar(e.name); });
      },

      /** Vacía TODO el namespace (logout, cambio de cuenta). */
      clearAll: function () { names().forEach(borrar); },

      purgeExpired: purgarCaducadas,

      /** Texto amigable de antigüedad: "hace unos segundos", "hace 5 min", etc. */
      ageLabel: function (at) {
        const mins = Math.floor((Date.now() - at) / 60000);
        if (mins < 1) return 'hace unos segundos';
        if (mins === 1) return 'hace 1 minuto';
        if (mins < 60) return 'hace ' + mins + ' minutos';
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs === 1 ? 'hace 1 hora' : 'hace ' + hrs + ' horas';
        const dias = Math.floor(hrs / 24);
        return dias === 1 ? 'hace 1 día' : 'hace ' + dias + ' días';
      }
    };
  }

  const AppCache = createStore(function () { return window.localStorage; });
  /** Misma API, pero acotada a ESTA pestaña: para datos que no deben sobrevivir
   *  al cierre (info del remitente, catálogos de la sesión de trabajo). */
  AppCache.session = createStore(function () { return window.sessionStorage; });

  // La limpieza no debe competir con el primer pintado.
  setTimeout(function () { AppCache.purgeExpired(); AppCache.session.purgeExpired(); }, 1500);

  /**
   * ===========================================================================
   * INDICADOR DE CONSULTA (esquina superior derecha)
   * ===========================================================================
   * La contrapartida de pintar desde la caché: si la pantalla aparece llena al
   * instante, hay que decir en algún sitio que eso todavía se está comprobando
   * contra el servidor. Sin esa señal el usuario no distingue "esto ya está" de
   * "esto es de hace media hora", y acaba recargando la página —justo lo que
   * queríamos evitar.
   *
   * Es lo contrario del overlay de marca (VentelLoader): no tapa, no bloquea y
   * no impide seguir trabajando mientras se revalida. El overlay sigue siendo el
   * correcto para las esperas en las que NO hay nada que enseñar todavía o en
   * las que el usuario no debe tocar nada (envío de correo, generación de PDF).
   *
   * Tres detalles que evitan que el indicador moleste más de lo que informa:
   *
   *   1. RETRASO. No aparece hasta pasados ~200 ms. Una respuesta rápida o un
   *      acierto de caché no dispara ningún parpadeo.
   *   2. MÍNIMO EN PANTALLA. Una vez visible se queda ~500 ms aunque la
   *      respuesta llegue enseguida: un destello de 40 ms se percibe como un
   *      fallo de dibujado, no como información.
   *   3. CONTEO DE REFERENCIAS. Varias llamadas a la vez encienden un solo
   *      indicador, y se apaga cuando termina la última. Cada pantalla puede
   *      pedirlo sin saber qué están pidiendo las demás.
   *
   * ── FORMA: por qué es un disco y no un letrero ──────────────────────────────
   *
   * Antes ponía "Consultando…" con todas las letras, y ese fue el error: un
   * cartel de texto en la esquina se lee como un cartel de espera, así que la
   * pantalla parecía tardar aunque los datos llevaran ahí desde el primer
   * fotograma. El aviso contaba lo que ya no era cierto.
   *
   * Ahora es el isotipo de Liverpool girando —los ocho puntos naranja y morado,
   * los mismos del loader de marca— dentro de un disco de cristal de 34 px. Sin
   * texto. Basta para saber que algo se está comprobando y no compite con el
   * contenido, que es lo que la persona vino a leer.
   *
   * ── SISTEMA COMPARTIDO CON LA PASTILLA DE ESTADO ────────────────────────────
   *
   * Este disco y el indicador de estado de los sistemas (app_operacion.html) son
   * la misma pieza en dos esquinas, y tienen que verse como tal. Si se toca uno,
   * se toca el otro:
   *
   *     diámetro   34 px
   *     radio      999px
   *     filo       1px de la línea del tema
   *     cristal    76% de superficie + blur(14px) saturate(1.7)
   *     sombra     dos capas, la de abajo abierta y muy suave
   *     easing     cubic-bezier(.2,.8,.2,1)
   *
   * Se diferencian en lo único que importa: este es pasajero y lleva el color de
   * la MARCA; el otro es permanente y lleva el color del ESTADO.
   *
   * Sin texto visible el indicador seguiría siendo invisible para un lector de
   * pantalla, así que la etiqueta viaja en un span oculto: se ve quien mira y se
   * oye quien escucha.
   */
  const AppBusy = (function () {
    const RETRASO_MS = 200;
    const MINIMO_MS = 500;
    const ETIQUETA_POR_OMISION = 'Consultando';

    const PUNTOS = 8;                       // los ocho del isotipo de Liverpool
    const NARANJA = '#EE7D00', MORADO = '#AC4581';   // hex exacto de la marca

    const CSS =
      // El disco de "consultando". Vive arriba a la derecha y dura lo que dura una
      // llamada al servidor: por eso FLOTA (cristal, sombra difusa, sin anclaje). No
      // confundir con la pestaña de estado de app_operacion, que va anclada al canto
      // inferior izquierdo porque es permanente: fueron gemelas un tiempo y ya no lo son,
      // a propósito. Tocar una no obliga a tocar la otra.
      // box-sizing propio: el Portal no trae preflight de Tailwind ni reset alguno, así
