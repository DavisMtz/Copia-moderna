      // que sin esto el filo suma 2 px y el disco deja de medir 34.
      '.vb-pill{box-sizing:border-box;position:fixed;top:1rem;right:1rem;z-index:10001;' +
      'display:grid;place-items:center;width:34px;height:34px;border-radius:999px;' +
      'pointer-events:none;background:var(--surface,#fff);border:1px solid var(--line,#eadfe6);' +
      // Mismas dos capas que --op-sh-pastilla, más el mismo filo de luz: un contacto
      // corto que la despega del fondo y una difusa que le da altura.
      'box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 1px 2px rgba(16,24,40,.06),' +
      '0 10px 26px -14px rgba(16,24,40,.38);' +
      'opacity:0;transform:scale(.84);' +
      'transition:opacity .24s cubic-bezier(.2,.8,.2,1),transform .24s cubic-bezier(.2,.8,.2,1)}' +
      '.vb-pill.vb-on{opacity:1;transform:none}' +

      // Sobre fondo oscuro una sombra clara no existe: lo que despega el disco es una
      // sombra mucho más densa y un filo de luz de una décima parte de fuerza. Mismos
      // valores que la pastilla de estado en carbon.
      '[data-theme="carbon"] .vb-pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),' +
      '0 1px 2px rgba(0,0,0,.44),0 12px 30px -14px rgba(0,0,0,.72)}' +

      // Cristal solo donde el navegador sabe desenfocar: si color-mix no existe, la
      // regla entera se descarta y queda el fondo sólido de arriba.
      '@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){' +
      '.vb-pill{background:color-mix(in srgb,var(--surface,#fff) 76%,transparent);' +
      '-webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7)}}' +

      // El anillo: ocho puntos alternando naranja y morado, como el isotipo. Gira
      // despacio y la estela de opacidad le da el sentido de avance. Girar el grupo
      // entero (una sola capa compuesta) es más barato que animar los ocho puntos.
      '.vb-ring{position:relative;width:18px;height:18px;animation:vb-giro 3.2s linear infinite}' +
      '.vb-ring i{position:absolute;top:0;left:50%;width:3px;height:3px;margin-left:-1.5px;' +
      'border-radius:50%;opacity:.15;transform-origin:50% 9px;' +
      'animation:vb-estela 1.15s linear infinite}' +
      '.vb-ring i:nth-child(odd){background:' + NARANJA + '}' +
      '.vb-ring i:nth-child(even){background:' + MORADO + '}' +
      '@keyframes vb-giro{to{transform:rotate(360deg)}}' +
      '@keyframes vb-estela{0%,100%{opacity:.15}40%{opacity:1}}' +

      // La etiqueta ya no se pinta, pero se sigue anunciando.
      '.vb-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;' +
      'clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}' +

      // Sin movimiento el anillo se queda quieto y legible, no invisible.
      '@media (prefers-reduced-motion:reduce){.vb-pill{transition:none}' +
      '.vb-ring,.vb-ring i{animation:none}.vb-ring i{opacity:.62}}' +
      '@media print{.vb-pill{display:none}}';

    const activos = {};      // token -> etiqueta
    let cuenta = 0;
    let secuencia = 0;
    let pill = null, texto = null;
    let visible = false, visibleDesde = 0;
    let tMostrar = null, tOcultar = null;
    let overlayObservado = false;

    /** El overlay de marca ya está tapando la pantalla: un segundo aviso sobra. */
    /* ¿Hay ya una espera tapando la pantalla entera? Entonces este disco sobra: es
       el genérico, y encima va por delante de todo (z-index 10001), así que se
       pintaba ENCIMA de la escena temática durante toda la espera —al aprobar una
       revisión, al generar el documento— y se veían los dos a la vez. La única
       defensa hasta ahora era acordarse de escribir `busy:false` llamada por llamada,
       y eso es una regla que se olvida en cuanto alguien añade una pantalla.
       Se miran las DOS formas de tapar: el isotipo de LoaderPartial y las escenas a
       pantalla completa del motor (`.vfx-overlay`). */
    function overlayTapando() {
      try {
        const o = document.getElementById('ventelLoader');
        if (o && o.classList.contains('show') && !o.classList.contains('vl-hiding')) return true;
        return !!document.querySelector('.vfx-overlay');
      } catch (e) { return false; }
    }

    /** Cuando el overlay se retira, lo que siga en curso debe volverse visible. */
    function vigilarOverlay() {
      if (overlayObservado || typeof MutationObserver === 'undefined') return;
      overlayObservado = true;
      const o = document.getElementById('ventelLoader');
      if (o) new MutationObserver(function () { pintar(); }).observe(o, { attributes: true, attributeFilter: ['class'] });
      /* Y el cuerpo, porque las escenas a pantalla completa se AÑADEN y se QUITAN del
         body en vez de cambiar de clase: sin esto, el disco no reaparecería al cerrarse
         una escena mientras la llamada sigue en curso. Solo hijos DIRECTOS del body,
         que es donde viven los overlays: observar el árbol entero costaría un aviso por
         cada repintado de una tabla. */
      if (document.body) {
        new MutationObserver(function () { pintar(); }).observe(document.body, { childList: true });
      }
    }

    /** Los ocho puntos del isotipo, repartidos en el anillo y desfasados en la estela. */
    function anillo() {
      let html = '';
      for (let i = 0; i < PUNTOS; i++) {
        html += '<i style="transform:rotate(' + (i * (360 / PUNTOS)) + 'deg);' +
                'animation-delay:' + (-(PUNTOS - i) * (1.15 / PUNTOS)).toFixed(3) + 's"></i>';
      }
      return '<span class="vb-ring" aria-hidden="true">' + html + '</span>';
    }

    function crear() {
      if (pill || !document.body) return pill;
      try {
        const estilo = document.createElement('style');
        estilo.textContent = CSS;
        document.head.appendChild(estilo);

        pill = document.createElement('div');
        pill.className = 'vb-pill';
        pill.setAttribute('role', 'status');
        pill.setAttribute('aria-live', 'polite');
        pill.innerHTML = anillo() + '<span class="vb-sr"></span>';
        texto = pill.querySelector('.vb-sr');
        document.body.appendChild(pill);
        vigilarOverlay();
      } catch (e) { pill = null; }
      return pill;
    }

    /** Etiqueta a enseñar: la de la última petición que sigue en curso. */
    function etiquetaActual() {
      const claves = Object.keys(activos);
      return claves.length ? activos[claves[claves.length - 1]] : ETIQUETA_POR_OMISION;
    }

    /** Reserva (o libera) el hueco de la esquina para que los avisos no lo tapen. */
    function reservarHueco(alto) {
      try { document.documentElement.style.setProperty('--vb-alto', alto); } catch (e) {}
    }

    function mostrar() {
      if (overlayTapando()) { vigilarOverlay(); return; }
      if (!crear()) return;
      texto.textContent = etiquetaActual() + '…';
      if (visible) return;
      visible = true;
      visibleDesde = Date.now();
      // Un reflow entre insertar y animar, o la transición no llega a existir.
      void pill.offsetWidth;
      pill.classList.add('vb-on');
      reservarHueco('2.6rem');
    }

    function ocultar() {
      if (!pill || !visible) return;
      visible = false;
      pill.classList.remove('vb-on');
      // Se vacía la etiqueta oculta: si se quedara puesta, la próxima consulta con
      // el mismo texto no sería un cambio y el lector de pantalla no diría nada.
      if (texto) texto.textContent = '';
      reservarHueco('0px');
    }

    /** Único punto que decide si el indicador debe verse ahora mismo. */
    function pintar() {
      if (tMostrar) { clearTimeout(tMostrar); tMostrar = null; }
      if (tOcultar) { clearTimeout(tOcultar); tOcultar = null; }

      if (cuenta > 0) {
        /* Si algo pasó a tapar la pantalla DESPUÉS de que el disco ya estuviera
           puesto —se enciende una escena a media consulta—, se retira: si no, se
           quedaba flotando encima de ella, que es el mismo «dos loaders» visto en el
           otro orden. El observador lo devuelve cuando la escena se vaya. */
        if (overlayTapando()) { vigilarOverlay(); if (visible) ocultar(); return; }
        if (visible) { mostrar(); return; }
        tMostrar = setTimeout(function () { tMostrar = null; mostrar(); }, RETRASO_MS);
        return;
      }
      if (!visible) return;
      const restante = MINIMO_MS - (Date.now() - visibleDesde);
      if (restante > 0) tOcultar = setTimeout(function () { tOcultar = null; ocultar(); }, restante);
      else ocultar();
    }

    return {
      /**
       * Enciende el indicador. Devuelve el token que hay que pasarle a done().
       * @param {string=} etiqueta  Verbo de lo que ocurre: 'Consultando' (por
       *   omisión), 'Guardando', 'Buscando'… Se le añade "…" al pintarlo.
       */
      start: function (etiqueta) {
        const token = ++secuencia;
        activos[token] = etiqueta || ETIQUETA_POR_OMISION;
        cuenta++;
        pintar();
        return token;
      },

      /** Apaga la referencia. Tolera tokens falsos, repetidos o nulos. */
      done: function (token) {
        if (!token || !Object.prototype.hasOwnProperty.call(activos, token)) return;
        delete activos[token];
        cuenta = Math.max(0, cuenta - 1);
        pintar();
      },

      /** Envuelve una promesa: enciende al empezar y apaga pase lo que pase. */
      wrap: function (promesa, etiqueta) {
        const token = this.start(etiqueta);
        const fin = function () { AppBusy.done(token); };
        promesa.then(fin, fin);
        return promesa;
      },

      /** Enciende mientras dura una llamada de estilo callback. */
      until: function (etiqueta) {
        const token = this.start(etiqueta);
        return function () { AppBusy.done(token); };
      },

      get activo() { return cuenta > 0; }
    };
  })();

  /**
   * ===========================================================================
   * LLAMADAS AL SERVIDOR
   * ===========================================================================
   * google.script.run como promesa, con DEDUPLICACIÓN: si la misma llamada con
   * los mismos argumentos ya está en vuelo, se reutiliza esa promesa en vez de
   * disparar una segunda. En Apps Script cada llamada cuesta cientos de ms y
   * consume cuota, y una pantalla puede pedir lo mismo desde dos sitios al
   * pintar. La entrada se borra al resolver Y al fallar: nunca se cachea un error.
   *
   * Toda llamada enciende además el indicador de la esquina (AppBusy). Va aquí y
   * no en cada pantalla a propósito: si cada una tuviera que acordarse, la mitad
   * se quedaría sin avisar. Con `busy: false` se apaga —para sondeos de fondo que
   * el usuario no ha pedido— y con `busy: 'Guardando'` se cambia el verbo.
   */
  const AppRun = (function () {
    const enVuelo = {};

    /**
     * Indicador DENTRO de la sección que está esperando (VentelFX, app_loaders).
     * El disco de la esquina (AppBusy) dice «algo está pasando»; esto dice QUÉ y
     * DÓNDE, y sobre todo dibuja la forma de lo que va a llegar, que es lo que
     * evita el salto de maquetación cuando aterrizan los datos.
     *
     *   opts.fx = { target:'#tabla', kind:'tabla', rows:8 }   → esqueleto
     *   opts.fx = { target:'#panel', tema:'radar' }           → escena temática
     *
     * Devuelve un manejador inerte si el motor no está incluido en la pantalla:
     * ninguna llamada se rompe por no tener animación.
     */
    function abrirFx(fx) {
      if (!fx || !fx.target || !window.VentelFX) return null;
      try {
        return fx.kind
          ? VentelFX.skeleton(fx.target, fx.kind, fx)
          : VentelFX.section(fx.target, fx.tema || VentelFX.temaActual(), fx);
      } catch (e) { return null; }
    }

    /** Copia de opts sin `fx`, para que swr no lo monte dos veces al delegar en call. */
    function sinFx(opts) {
      const o = {};
      Object.keys(opts).forEach(function (k) { if (k !== 'fx') o[k] = opts[k]; });
      return o;
    }

    function call(fnName, args, opts) {
      args = args || [];
      opts = opts || {};
      const fx = abrirFx(opts.fx);
      const clave = opts.key || (fnName + ':' + JSON.stringify(args));
      // Una llamada fusionada con otra en vuelo no enciende un segundo indicador:
      // ya hay uno encendido por la primera y es la misma espera. El indicador de
      // sección sí se cierra al resolver la promesa compartida: quien se fusionó
      // suele estar mirando OTRA sección, y ésa también tiene que despejarse.
      if (enVuelo[clave]) {
        if (fx) enVuelo[clave].then(function () { fx.done(); }, function () { fx.done(); });
        return enVuelo[clave];
      }

      const token = opts.busy === false ? 0 : AppBusy.start(typeof opts.busy === 'string' ? opts.busy : '');

      const p = new Promise(function (resolve, reject) {
        if (!(window.google && google.script && google.script.run)) {
          reject(new Error('El entorno de Apps Script no está disponible.'));
          return;
        }
        // El runner se invoca sobre sí mismo (no con `this` nulo): así es como lo
        // espera la librería cliente de Apps Script.
        const runner = google.script.run
          .withSuccessHandler(function (r) { ultimoContacto = Date.now(); resolve(r); })
          .withFailureHandler(function (err) {
            // La llave venció o no vale: se avisa UNA vez aquí, en vez de que cada una de las
            // noventa llamadas de la app tenga que saber qué hacer. La promesa se rechaza igual,
            // para que quien llamó apague su indicador y no pinte datos.
            if (/^SESION_EXPIRADA/.test(String((err && err.message) || err || ''))) sesionVencida();
            reject(err);
          });
        // TODO pasa por secEjecutar (Sesiones.gs): lleva la llave y la última interacción de la
        // persona, que es lo que mide la inactividad. Si el servidor fuera uno viejo sin ese
        // canal, se llama directo como antes.
        if (typeof runner.secEjecutar === 'function') {
          runner.secEjecutar(AppSession.llave || '', fnName, args, AppSession.ultimaActividad());
          return;
        }
        if (typeof runner[fnName] !== 'function') {
          reject(new Error('El servidor no expone la función ' + fnName + '.'));
          return;
        }
        runner[fnName].apply(runner, args);
      });
      const limpiar = function () { delete enVuelo[clave]; AppBusy.done(token); if (fx) fx.done(); };
      p.then(limpiar, limpiar);
      enVuelo[clave] = p;
      return p;
    }

    /**
     * Patrón stale-while-revalidate completo: pinta lo cacheado (si lo hay) y
     * revalida siempre contra el servidor.
     *   AppRun.swr('quotes-'+email, 'getQuotesForUser', [email], {
     *     onData: (datos, deCache) => pintar(datos),
     *     ttl: 5*60000
     *   });
     *
     * onData se llama DOS veces cuando había caché: primero con deCache=true y
     * después con la respuesta del servidor. Eso obliga a que el pintado sea
     * idempotente —repintar la lista entera, no añadirle filas—; si una pantalla
     * no puede repintarse dos veces, no debe usar swr sino call().
     *
     * `opts.fuerza` salta la caché local (botón "Actualizar"): revalida igual,
     * pero sin enseñar antes lo guardado.
     */
    function swr(cacheName, fnName, args, opts) {
      opts = opts || {};
      const store = opts.session ? AppCache.session : AppCache;
      const cached = opts.fuerza ? null : store.get(cacheName, opts.maxAge);
      let pintado = false;
      if (cached && opts.onData) {
        try { opts.onData(cached.data, true, cached.at); pintado = true; } catch (e) { console.error(e); }
      }

      // El indicador de sección solo tiene sentido cuando NO hay nada pintado.
      // Con caché ya en pantalla, taparla con un esqueleto sería un paso atrás:
      // el usuario pasaría de ver sus datos a ver cajas grises.
      const optsCall = opts.fx ? sinFx(opts) : opts;

      const revalidar = function () {
        return call(fnName, args, optsCall).then(function (respuesta) {
          const guardar = opts.accept ? opts.accept(respuesta) : true;
          if (guardar) store.set(cacheName, respuesta, { ttl: opts.ttl });
          if (opts.onData) {
            try { opts.onData(respuesta, false, Date.now()); } catch (e) { console.error(e); }
          }
          return respuesta;
        }, function (error) {
          if (opts.onError) opts.onError(error, cached);
          else if (!cached) throw error;
          return null;
        });
      };

      // Sin caché no hay nada que enseñar: se pide ya, cada ms cuenta, y es aquí
      // —y solo aquí— donde el esqueleto/escena de `opts.fx` gana su sitio.
      if (!pintado) {
        const fx = abrirFx(opts.fx);
        if (!fx) return revalidar();
        return revalidar().then(
          function (r) { fx.done(); return r; },
          function (e) { fx.fail(e && e.message ? e.message : String(e)); throw e; }
        );
      }

      // Con caché ya pintada, la revalidación espera al siguiente fotograma. Montar
      // la llamada de google.script.run no es gratis (crea su iframe y serializa los
      // argumentos) y hacerlo en este mismo hilo retrasa el dibujado de lo que
      // acabamos de escribir en el DOM: el usuario vería la lista aparecer más tarde
      // de lo necesario, que es justo lo que la caché venía a arreglar.
      return new Promise(function (resolve, reject) {
        const arrancar = function () { revalidar().then(resolve, reject); };
        if (typeof requestAnimationFrame === 'function') requestAnimationFrame(function () { setTimeout(arrancar, 0); });
        else setTimeout(arrancar, 0);
      });
    }

    return {
      call: call,
      swr: swr,
      clearInflight: function () { Object.keys(enVuelo).forEach(function (k) { delete enVuelo[k]; }); }
    };
  })();

  /**
   * ===========================================================================
   * SINCRONIZACIÓN ENTRE PESTAÑAS
   * ===========================================================================
   * El evento 'storage' llega a las OTRAS pestañas del mismo origen. Sin esto,
   * cerrar sesión en una pestaña dejaba las demás mostrando —y pudiendo enviar—
   * cotizaciones con la identidad anterior.
   */
  window.addEventListener('storage', function (e) {
    if (!e || e.key !== K_EMAIL) return;
    const nuevo = e.newValue || '';
    if (!nuevo) {
      AppCache.clearAll();
      AppRun.clearInflight();
      if (sesionExigida) AppUrl.go('login');
    } else if (e.oldValue && nuevo !== e.oldValue) {
      // Cambió de cuenta en otra pestaña: esta vista muestra datos de quien ya no es.
      AppCache.clearAll();
      window.location.reload();
    }
  });

  /**
   * ===========================================================================
   * INACTIVIDAD DE LA SESIÓN (la llave de Sesiones.gs)
   * ===========================================================================
   * La sesión vence tras N minutos sin que la persona toque la pantalla (120 por
   * omisión; el número lo dice el servidor al entrar). Tres piezas:
   *
   *   · Se apunta la última interacción (ratón, teclado, toque, rueda) en
   *     localStorage, como mucho cada 20 s y compartida entre pestañas: una pestaña
   *     olvidada no cierra la sesión de quien trabaja en otra.
   *   · Cada 30 s se mira el reloj: a 5 min del vencimiento se avisa, y al vencer se
   *     cierra la sesión y se TAPA la pantalla con un aviso y el botón para volver a
   *     entrar. No se navega sola: Chrome ignora en silencio que el iframe mueva la
   *     ventana sin un clic reciente. Y tapar además esconde los datos de clientes
   *     en un equipo compartido.
   *   · Latido: si la persona trabaja sin hablar con el servidor (un formulario
   *     largo), cada 20 min se manda sesTocar para que el servidor sepa que sigue ahí.
   *
   * El servidor aplica la misma regla por su lado (cada llamada informa la última
   * interacción): aunque alguien quitara este vigilante, la llave vence igual.
   */
  const SES_AVISO_ANTES = 5 * 60000;
  const SES_LATIDO = 20 * 60000;
  let sesAvisada = false;
  let sesTapada = false;

  function sesionVencida() {
    if (sesTapada) return;
    const habia = !!AppSession.userEmail;
    AppSession.clear();
    if (!sesionExigida) {
      // Página pública (Portal, Promociones…): se sigue como visitante, solo se avisa.
      if (habia) { try { if (window.AppMotion) AppMotion.toast('Tu sesión se cerró por inactividad.', 'warn'); } catch (e) {} }
      return;
    }
    if (!document.body) { document.addEventListener('DOMContentLoaded', sesionVencida); return; }
    sesTapada = true;
    const capa = document.createElement('div');
    capa.setAttribute('role', 'alertdialog');
    capa.setAttribute('aria-modal', 'true');
    capa.setAttribute('aria-labelledby', 'ses-vencida-titulo');
    capa.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;' +
      'padding:1.5rem;background:rgba(15,23,42,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)';
    capa.innerHTML =
      '<div style="max-width:26rem;width:100%;background:#fff;color:#1B2330;border-radius:16px;padding:1.6rem 1.5rem;' +
        'box-shadow:0 30px 60px -20px rgba(0,0,0,.45);text-align:center;font-family:inherit">' +
        '<h2 id="ses-vencida-titulo" style="margin:0 0 .5rem;font-size:1.15rem;font-weight:700">Tu sesión se cerró</h2>' +
        '<p style="margin:0 0 1.25rem;line-height:1.5;color:#5C6B7E">Pasó demasiado tiempo sin actividad. ' +
          'Vuelve a iniciar sesión para seguir donde estabas.</p>' +
        '<button type="button" data-ses-entrar style="border:0;border-radius:10px;padding:.7rem 1.4rem;font:inherit;' +
          'font-weight:700;color:#fff;background:#E10098;cursor:pointer">Iniciar sesión</button>' +
      '</div>';
    document.body.appendChild(capa);
    const boton = capa.querySelector('[data-ses-entrar]');
    boton.addEventListener('click', function () {
      const params = AppUrl.params();
      delete params.next;
      if (paginaExigida) params.next = paginaExigida;
      AppUrl.go('login', params);
    });
    try { boton.focus(); } catch (e) {}
  }

  function sesionRegistrarActividad() {
    if (!AppSession.userEmail || sesTapada) return;
    const ahora = Date.now();
    if (ahora - AppSession.ultimaActividad() < 20000) return;
    AppSession.marcarActividad();
    sesAvisada = false;
    if (AppSession.isLoggedIn() && ahora - ultimoContacto > SES_LATIDO) {
      ultimoContacto = ahora;
      AppRun.call('sesTocar', [], { busy: false }).catch(function () {});
    }
  }

  function sesionVigilar() {
    if (!AppSession.isLoggedIn() || sesTapada) return;
    const actividad = AppSession.ultimaActividad();
    if (!actividad) { AppSession.marcarActividad(); return; }
    const resta = AppSession.inactividadMs() - (Date.now() - actividad);
    if (resta <= 0) { sesionVencida(); return; }
    if (resta <= SES_AVISO_ANTES && !sesAvisada) {
      sesAvisada = true;
      try {
        if (window.AppMotion) {
          AppMotion.toast('Tu sesión se cerrará en ' + Math.max(1, Math.ceil(resta / 60000)) +
            ' min por inactividad. Mueve el ratón o pulsa una tecla para seguir.', 'warn');
        }
      } catch (e) {}
    }
  }

  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (evento) {
    try { document.addEventListener(evento, sesionRegistrarActividad, { capture: true, passive: true }); } catch (e) {}
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sesionVigilar(); });
  setInterval(sesionVigilar, 30000);

  // Una sola vez tras el cambio: una sesión guardada SIN llave (de antes de Sesiones.gs) ya no
  // sirve de nada en el servidor. Se limpia y la pantalla pide entrar: todos los asesores
  // inician sesión de nuevo UNA vez tras el despliegue.
  if (AppSession.userEmail && !AppSession.llave) { try { AppSession.clear(); } catch (e) {} }
  sesionVigilar();

  /**
   * ===========================================================================
   * FUNCIONES DEL CONMUTADOR DE ÁREA
   * ===========================================================================
   * Qué áreas se enseñan en "Funciones" y cuáles no. Vive aquí —y no en cada
   * pantalla— porque el mismo conmutador está pintado en tres sitios distintos
   * (Portal, Monitor de promociones y el shell de Cotizaciones) y hasta ahora
   * cada uno decidía por su cuenta; bastaba tocar uno para que los otros dos se
   * quedaran enseñando puertas que ya no llevaban a ningún lado.
   *
   * DOS REGLAS, Y LA DIFERENCIA ENTRE ELLAS ES DELIBERADA:
   *
   *  · Un área de trabajo (Portal, Cotizaciones, Correos) se esconde cuando el
   *    servidor ya nos dijo que esta persona no tiene NINGUNO de sus bloques. Eso
   *    incluye el caso de mantenimiento: apagar un módulo lo resta de la lista de
   *    bloques, así que la opción desaparece del menú en vez de quedarse ahí para
   *    llevar a una pantalla que va a contestar "no disponible". Un menú que
   *    ofrece lo que no funciona hace perder más tiempo que uno más corto.
   *
   *  · El área de Gestión se esconde también mientras no sepamos nada. Es la
   *    puerta de administración y el Portal es una landing pública: enseñarla "por
   *    si acaso" es anunciar dónde tocar.
   *
   * Nada de esto es seguridad —el candado real está en el servidor, que vuelve a
   * exigir el permiso al abrir cada pantalla—; es no ofrecer lo que no se puede.
   */
  const AppFunciones = (function () {
    /* Áreas de trabajo. `bloques` = con tener UNO basta para que el área exista:
       a quien puede consultar pero ya no cotizar, Cotizaciones le sigue sirviendo. */
    const AREAS = [
      { id: 'portal',       page: 'portal',         bloques: ['portal'] },
      { id: 'cotizaciones', page: 'dashboard',      bloques: ['cotizar', 'consultar', 'enviar_cotizacion'] },
      { id: 'correos',      page: 'correo_cliente', bloques: ['correos_cliente'] },
      { id: 'atenciones',   page: 'atenciones',     bloques: ['atenciones'] },
      { id: 'promociones',  page: 'promociones',    bloques: ['promociones'] }
    ];

    /* Destinos del área de Gestión, en orden de preferencia al entrar: el área se
       abre por la primera pantalla que ESA persona sí puede abrir. */
    /* REGLA DEL PLAN DE CIERRE (T1.8): toda pantalla de gestión NUEVA entra al menú
       POR ESTE CATÁLOGO —una entrada con su bloque, su página y sus rótulos—, nunca
       con un enlace suelto en app_shell. Es lo que mantiene «Gestión solo gestión»:
       el apartado del menú, el conmutador de áreas y el buscador se arman de esta
       lista, así que lo que no está aquí no existe para el menú, y lo que está se
       filtra solo por bloques. Depurado el 14-08-2026 (F1): las nueve entradas son
       de gestión; «Enviar correo a clientes» quedó fuera como área propia (T1.7). */
    /* VARIOS BLOQUES PUEDEN LLEVAR A LA MISMA PANTALLA, y es a propósito. El panel
       avanzado es la casa de tres facultades —métricas, cola de revisión y política de
       revisión— que se conceden por separado. Antes aquí solo figuraba 'supervision',
       así que a quien se le daba únicamente 'revisar' no le aparecía nada: tenía el
       permiso y no tenía puerta por la que ejercerlo. Ahora entra por la razón por la
       que puede entrar, y el menú se lo dice con ese nombre —"Revisar cotizaciones" y
       no "Panel avanzado"—, porque es lo que va a encontrar dentro.
       Se depuran por página en gestion(), para que quien tenga las tres no vea la
       misma pantalla listada tres veces. */
    const GESTION = [
      { bloque: 'supervision',       page: 'inicio_avanzado', nombre: 'Panel avanzado',       corto: 'supervisión',        sub: 'Métricas y revisión' },
      { bloque: 'revisar',           page: 'inicio_avanzado', nombre: 'Revisar cotizaciones', corto: 'revisión',           sub: 'Cotizaciones por autorizar' },
      { bloque: 'politica_revision', page: 'inicio_avanzado', nombre: 'Política de revisión', corto: 'reglas de revisión', sub: 'Reglas de revisión' },
      { bloque: 'anuncios',          page: 'anuncios',        nombre: 'Anuncios del Portal',  corto: 'anuncios',           sub: 'Anuncios del Portal' },
      { bloque: 'portal_contenido',  page: 'portal_contenido', nombre: 'Contenido del Portal', corto: 'contenido del Portal', sub: 'Herramientas, plantillas y promos' },
      { bloque: 'articulos',         page: 'articulo',        nombre: 'Artículos',            corto: 'artículos',          sub: 'Guías largas del equipo' },
      { bloque: 'operacion',         page: 'operacion',       nombre: 'Estado de operación',  corto: 'estado de operación', sub: 'Fallas reportadas por el equipo' },
      /* LA CONSOLA ENTRA POR DOS LLAVES, y esa es toda la unificación vista desde el
         menú. 'adm_miembros' es la del maestro y 'sup_equipo' la de la supervisión;
         las dos abren la MISMA pantalla, que por dentro ya sabe qué pestañas enseñar
         a cada quien (ver CONSOLA_SECCIONES en Consola.gs).

         Antes 'sup_equipo' llevaba al panel avanzado, donde vivía una segunda
         pantalla de roles. Al mudarse esa gestión a la consola, la entrada del menú
         se muda con ella: si se hubiera dejado apuntando al panel, el supervisor
         seguiría yendo al sitio donde ya no está lo que busca.

         Ya no llevan `soloMaestro`. Ese campo decía "esta entrada es de maestros" y
         era otra copia de la regla de acceso viviendo en el cliente; ahora la lista
         de bloques es la única condición, que es como funcionan las demás entradas.
         (El filtro sigue existiendo en gestion() para quien lo necesite después.)
         El ORDEN entre estas dos importa, por la regla de "una pantalla, una entrada"
         de gestion(): gana la primera, que debe ser la de MAYOR alcance. Un maestro
         tiene las dos llaves, y a él la consola hay que anunciársela entera —"Consola:
         personas, permisos y ajustes"— y no como "los roles de tu equipo", que es solo
         una de sus siete pestañas. Al revés, el supervisor únicamente tiene la
         segunda, así que lee el rótulo que describe lo que él sí va a encontrar. */
      { bloque: 'adm_miembros',      page: 'consola',         nombre: 'Consola',              corto: 'consola',            sub: 'Personas, permisos y ajustes' },
      { bloque: 'sup_equipo',        page: 'consola',         nombre: 'Roles y accesos',      corto: 'roles',              sub: 'Altas, roles y accesos de tu equipo' },
      /* Tercera entrada a la misma pantalla, y va la ÚLTIMA por la misma regla de arriba: quien
         tenga también `adm_miembros` o `sup_equipo` ya la tiene anunciada con un rótulo de más
         alcance. Esta es para quien solo tiene `metricas` —el caso que el bloque contempla: se
         le concede a alguien para que consulte cifras sin darle la gestión de nadie—, y sin ella
         tenía el permiso y ninguna puerta en el menú. */
      { bloque: 'metricas',          page: 'consola',         nombre: 'Métricas y monitoreo', corto: 'métricas',           sub: 'Cotizaciones, correos, búsquedas y cambios' }
    ];

    function porId(id) {
      for (let i = 0; i < AREAS.length; i++) if (AREAS[i].id === id) return AREAS[i];
      return null;
    }

    /* ── MÓDULOS APAGADOS, TAMBIÉN SIN SESIÓN ──────────────────────────────────
       Con sesión esto ya funcionaba: el servidor resta los módulos apagados de la
       lista de bloques, así que hacerle caso a la lista bastaba.

       Sin sesión no había nada que restar y se enseñaba todo. Eso convertía el
       mantenimiento en una trampa en la pantalla donde más gente entra: se veía
       Promociones en el menú del Portal, se hacía clic, se tecleaba la contraseña
       y solo entonces aparecía el "no disponible". El menú prometía algo que la
       app ya sabía que no podía cumplir.

       Ahora el Portal pregunta —una llamada barata, cacheada cinco minutos, que no
       revela nada que no descubra igual quien intente abrir el módulo— y esconde lo
       que está apagado desde el primer fotograma en que lo sabe.

       Si la consulta falla, se enseña todo: un error de lectura no debe dejar la
       landing sin puertas. */
    const CACHE_MODULOS = 'modulos-publicos';
    const TTL_MODULOS = 5 * 60 * 1000;
    let apagadosMem = null;         // null = todavía no sabemos
    let nombresApagados = {};
    let sincronizando = false;
    const oyentesModulos = [];

    function apagados() {
      if (apagadosMem) return apagadosMem;
      const g = AppCache.get(CACHE_MODULOS, TTL_MODULOS);
      if (g && g.data && Array.isArray(g.data.apagados)) {
        apagadosMem = g.data.apagados;
        nombresApagados = g.data.nombres || {};
        return apagadosMem;
      }
      return [];
    }

    /** ¿Este bloque está apagado por mantenimiento? */
    function moduloApagado(bloqueId) {
      return apagados().indexOf(bloqueId) !== -1;
    }

    /** Nombre en cristiano de un módulo apagado, para poder decirlo. */
    function nombreModulo(bloqueId) {
      apagados();
      return nombresApagados[bloqueId] || bloqueId;
    }

    function avisarCambio() {
      oyentesModulos.forEach(function (cb) { try { cb(); } catch (e) {} });
    }

    /**
     * Pregunta al servidor qué está apagado y avisa a quien esté pintando un menú.
     *
     * CACHÉ PRIMERO, no stale-while-revalidate. Es deliberado y va contra el patrón
     * que usa el resto de la app, así que conviene decir por qué: swr revalida SIEMPRE,
     * y esto se llama al cargar cualquier pantalla. Serían dieciocho llamadas más al
     * día por persona para enterarse de algo que cambia una vez al mes y que, además,
     * el servidor vuelve a comprobar por su cuenta al abrir cada pantalla. Con la copia
     * fresca no se pregunta; caducada a los cinco minutos, sí.
     *
     * Nunca rechaza: el menú de antes es mejor que ningún menú.
     */
    function sincronizar() {
      if (sincronizando) return Promise.resolve(apagados());
      // Copia fresca en el almacén local: no hay nada que preguntar.
      const g = AppCache.get(CACHE_MODULOS, TTL_MODULOS);
      if (g && g.data && Array.isArray(g.data.apagados)) {
        apagadosMem = g.data.apagados;
        nombresApagados = g.data.nombres || {};
        return Promise.resolve(apagadosMem);
      }

      sincronizando = true;
      return AppRun.call('obtenerModulosPublicos', [], { key: 'modulos-publicos', busy: false })
        .then(function (r) {
          sincronizando = false;
          if (!r || !r.success) return apagados();
          AppCache.set(CACHE_MODULOS, r, { ttl: TTL_MODULOS });
          const antes = (apagadosMem || []).join('|');
          apagadosMem = Array.isArray(r.apagados) ? r.apagados : [];
          nombresApagados = r.nombres || {};
          if (antes !== apagadosMem.join('|')) avisarCambio();
          return apagadosMem;
        }, function () { sincronizando = false; return apagados(); });
    }

    /** Se llama cuando cambia la lista de apagados (para repintar el menú). */
    function alCambiarModulos(cb) {
      oyentesModulos.push(cb);
      return function () {
        const i = oyentesModulos.indexOf(cb);
        if (i !== -1) oyentesModulos.splice(i, 1);
      };
    }

    /**
     * ¿Se enseña esta área de trabajo?
     * @param {string} id  'portal' | 'cotizaciones' | 'correos' | 'promociones'
     */
    function visible(id) {
      const area = porId(id);
      if (!area) return true;

      // Con sesión manda la lista de bloques, que el servidor ya depuró de apagados.
      if (AppSession.isLoggedIn() && AppSession.bloquesConocidos) {
        const lista = AppSession.bloques;
        return area.bloques.some(function (b) { return lista.indexOf(b) !== -1; });
      }

      // Sin sesión (o sin saber los bloques todavía): se enseña salvo que TODO lo que
      // el área sabe hacer esté apagado. A Cotizaciones le basta con que quede en pie
      // una de sus tres facultades para seguir mereciendo su sitio en el menú.
      const off = apagados();
      if (!off.length) return true;
      return area.bloques.some(function (b) { return off.indexOf(b) === -1; });
    }

    /**
     * Destinos de gestión que ESTA persona puede abrir. Lista vacía = no se dibuja
     * el área.
     * @param {object=} permisos Respuesta fresca de obtenerPermisosSesion. Si se pasa,
     *   manda ella; si no, se usa lo guardado en la sesión (con criterio estricto).
     */
    function gestion(permisos) {
      let lista, maestro;
      if (permisos) {
        if (!permisos.success) return [];
        lista = permisos.bloques || [];
        maestro = !!permisos.maestro;
      } else {
        if (!AppSession.isLoggedIn() || !AppSession.bloquesConocidos) return [];
        lista = AppSession.bloques;
        maestro = AppSession.isMaster;
      }
      const concedidos = GESTION.filter(function (d) {
        if (d.soloMaestro && !maestro) return false;
        return lista.indexOf(d.bloque) !== -1;
      });

      // Una pantalla, una entrada. Gana la primera del catálogo, que es la de mayor
      // alcance: a un supervisor le sale "Panel avanzado" (lo ve todo) y no tres
      // entradas al mismo sitio; a quien solo puede revisar le sale "Revisar
      // cotizaciones", que es exactamente lo que ese permiso le deja hacer.
      const vistas = {};
      return concedidos.filter(function (d) {
        if (vistas[d.page]) return false;
        vistas[d.page] = true;
        return true;
      });
    }

    /** Enumera en castellano: "a", "a y b", "a, b y c". */
    function enumerar(items) {
      if (items.length <= 1) return items[0] || '';
      return items.slice(0, -1).join(', ') + ' y ' + items[items.length - 1];
    }

    /**
     * Subtítulo del área de Gestión: enumera lo que ESA persona encontrará dentro,
     * no lo que existe. A un supervisor sin consola no le sirve leer "ajustes".
     */
    function subtituloGestion(disponibles) {
      if (!disponibles || !disponibles.length) return '';
      if (disponibles.length === 1) return disponibles[0].sub;
      const texto = enumerar(disponibles.map(function (d) { return d.corto; }));
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    return {
      visible: visible,
      gestion: gestion,
      subtituloGestion: subtituloGestion,
      enumerar: enumerar,
      apagados: apagados,
      moduloApagado: moduloApagado,
      nombreModulo: nombreModulo,
      sincronizar: sincronizar,
      alCambiarModulos: alCambiarModulos
    };
  })();

  /**
   * La lista de módulos apagados se pide sola al cargar CUALQUIER pantalla.
   *
   * Va aquí y no en cada pantalla porque el error que arregla es el de olvidarse: hay
   * cinco sitios que pintan un conmutador de áreas y basta que uno no pregunte para
   * que siga ofreciendo la puerta que los otros cuatro ya escondieron. Es una llamada
   * cacheada, sin indicador y sin bloqueo: si falla, no se nota.
   */
  (function () {
    const arrancar = function () {
      // Solo hace falta cuando NO sabemos los bloques de esta persona —sin sesión, o
      // con una sesión que todavía no los trae—, que es justo el caso que este cambio
      // vino a arreglar. Con sesión ya resuelta, la lista de bloques del servidor
      // viene con los apagados restados y preguntar otra vez sería preguntar dos
      // veces lo mismo en cada pantalla.
      if (!AppSession.isLoggedIn() || !AppSession.bloquesConocidos) AppFunciones.sincronizar();

      // ?ancla=… (o #…) baja al apartado que pedía el enlace. Aquí y no en cada
      // pantalla: es el mismo gesto en las dieciocho, y la que se olvidara de hacerlo
      // dejaría muerto un enlace que en las demás funciona.
      if (AppUrl.param('ancla')) AppUrl.irAncla();
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);
    else arrancar();
  })();

  window.AppSession = AppSession;
  window.AppFunciones = AppFunciones;
  window.AppUrl = AppUrl;
  window.requireSession = requireSession;
  window.requireBlock = requireBlock;
  window.formatMoney = formatMoney;
  window.escapeHtml = escapeHtml;
  window.escapeJsString = escapeJsString;
  window.AppCache = AppCache;
  window.AppRun = AppRun;
  window.AppBusy = AppBusy;
})();
</script>
