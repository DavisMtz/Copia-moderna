<!--
  RECONOCIMIENTO · Reto de Innovación Liverpool 2026 (04/10/2026, en PRUEBAS).

  El Portal Ventel quedó en tercer lugar nacional del Reto de Innovación Liverpool 2026. El
  creador pidió que el Portal lo enseñe —con el logotipo del Reto, el «tercer lugar», el
  diploma y la insignia «Innovación» de su identificación—. De las cuatro propuestas eligió la
  credencial de la barra superior, «en todas las pantallas», y retiró el sello de la barra
  lateral (la B). Hoy hay:
    D · Credencial en la barra superior (.reco-cred) de TODAS las pantallas con barra: el Portal
        (Index.html), el Monitor (Promociones.html) y las once del marco (app_shell.html la pinta
        si este parcial está en la página). Sin fondo ni fila propia; la medalla se columpia una
        vez al día (ventel-reco-saludo).
    A · Vitrina en el inicio de sesión (inicioDeSesion.html, .reco-vitrina).
    C · Banda en la portada «Tu turno» (Index.html, .reco-banda).
  A y C no se votaron todavía: siguen hasta que el creador diga.

  Interruptor: quien publica anuncios lo apaga y lo enciende desde anuncios.html (recoEstado y
  recoCambiarVisible en Portal.gs). Viaja en __APP__.reco de cada pantalla que incluye este
  parcial (RECO_PANTALLAS en Portal.gs; una prueba vigila que la lista y los include coincidan).

  Pesos: este parcial va en catorce pantallas, así que solo lleva la medalla (~1 KB), los estilos,
  el visor y su comportamiento. El logotipo, la insignia y la miniatura del diploma (~64 KB) están
  en app_reconocimiento_sprite.html, que incluyen solo las pantallas que los pintan al cargar (A y
  C); a las demás les llegan con recoImagenes la primera vez que se abre el visor, junto con el
  diploma a tamaño de lectura y el mensaje del director (~120 KB, en reco_imagenes.html). Todo se
  guarda 30 días, como los logotipos de Formas de Pago. En la vista previa local llegan en
  window.RECO_IMAGENES.

  Ojo con dos cosas que no se ven en el código:
    · el diploma dice «uno de los finalistas»; «tercer lugar nacional» es el texto del creador;
    · al diploma se le enderezó la perspectiva y se le emparejó la luz, y a la captura del
      mensaje solo se le quitó la papelera (receta en carpeta de apoyo/scripts/mudanza).
-->

/* ── D · Credencial en la barra superior (todas las pantallas con barra) ──
   Sutil: sin fondo, sin borde y sin fila propia, con la tipografía de la barra.
   Se nota: es lo único bronce de la interfaz y se columpia UNA vez al día, al llegar.
   Va detrás del buscador en las tres barras: en el Portal, entre el buscador y el reloj; en el
   Monitor, entre «Buscar» y «Portal principal»; en el marco, primera del grupo de la sesión, donde
   app_comando le pone «Buscar» delante. El margen negativo de arriba y abajo es lo que la deja entrar
   sin crecer la barra: el marco y el Monitor miden ~32 px por dentro y la credencial, con el relleno

   barra, que tiene de sobra. */

@keyframes reco-columpio{0%{transform:rotate(0)}16%{transform:rotate(16deg)}34%{transform:rotate(-11deg)}52%{transform:rotate(7deg)}68%{transform:rotate(-4deg)}84%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}

(function () {
  'use strict';
  var CLAVE = 'reco-imagenes-v2', TTL = 30 * 864e5;
  var ALT = {
    diploma: 'Diploma «Reconocimiento» del Reto de Innovación Liverpool otorgado a David Martínez Arredondo: «Por ser uno de los finalistas en el reto “Innovación Liverpool 2026”, tu creatividad, visión y esfuerzo marcaron la diferencia». Firman Carlos Marín Rangel, Director General Liverpool, y Enrique Antonio Pando Marino, Director Corporativo Operaciones Liverpool.',
    mensaje: 'Identificación «Innovación» del 2 de octubre de 2026: «Estimado David: ¡Muchas felicidades por tu reconocimiento en el Reto de Innovación 2026! Tu talento, iniciativa y dedicación son parte importante de los resultados que nos permiten seguir creciendo y transformando nuestra operación. ¡Enhorabuena por este gran logro!», de Enrique Antonio Pando Marino, Director Corporativo Operaciones Liverpool.'
  };
  var datos = null, pendiente = null, visor = null, saludada = false;

  /* El interruptor (anuncios.html) viaja en __APP__.reco. La vitrina del inicio de sesión nace
     oculta y se enseña aquí, que ya va después de __APP__; el Portal y el Monitor lo resuelven
     antes de pintar su barra, y el marco pinta la suya después de este guion. */
  if (window.__APP__ && window.__APP__.reco === false) document.documentElement.setAttribute('data-reco', 'no');
  else document.querySelectorAll('.reco-vitrina[hidden]').forEach(function (v) { v.hidden = false; });

  /* anuncios.html lo aplica en su propia pantalla al cambiarlo, sin recargar. */
  function encender(visible) {
    if (visible) document.documentElement.removeAttribute('data-reco');
    else document.documentElement.setAttribute('data-reco', 'no');
  }

  /* La credencial en las once pantallas del marco: app_shell la pide al armar su barra, y así su
     marcado vive aquí una sola vez. El Portal y el Monitor la llevan escrita en su barra. */
  function credencial() {
    return '<button type="button" class="reco-cred" data-reco-abrir="diploma" title="Tercer lugar nacional · Reto de Innovación Liverpool 2026" aria-label="Tercer lugar nacional en el Reto de Innovación Liverpool 2026. Ver el diploma y la insignia">' +
      '<svg class="reco-cred-med" viewBox="0 0 28 34" aria-hidden="true"><use href="#recoMedalla"/></svg>' +
      '<span class="reco-cred-tx"><b><span class="rc-largo">Tercer lugar nacional</span><span class="rc-corto">3.er lugar</span></b><small>Reto de Innovación Liverpool 2026</small></span>' +
      '</button>';
  }

  /* La medalla se columpia la primera vez que se abre una pantalla cada día; después, quieta. El
     día es el de aquí y no el de Greenwich, que a las seis de la tarde ya sería mañana. Es adorno:
     sin ella, o con movimiento reducido, la credencial se ve igual. La llaman este guion cuando la
     página termina de leerse (Portal y Monitor) y app_shell cuando pinta su barra. */
  function saludar() {
    if (saludada) return;
    var creds = document.querySelectorAll('.reco-cred');
    if (!creds.length || document.documentElement.getAttribute('data-reco') === 'no') return;
    saludada = true;
    var f = new Date();
    var hoy = f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2) + '-' + ('0' + f.getDate()).slice(-2);
    try { if (localStorage.getItem('ventel-reco-saludo') === hoy) return; localStorage.setItem('ventel-reco-saludo', hoy); }
    catch (e) { return; }
    creds.forEach(function (b) { b.classList.add('saluda'); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', saludar);
  else saludar();

  /* El logotipo, la insignia y la miniatura del diploma solo vienen escritos en las pantallas que
     los pintan al cargar (el Portal y el inicio de sesión); a las demás les llegan junto con las
     imágenes, en d.sprite, y se añaden aquí una vez. */
  function hayDibujos() { return !!document.getElementById('recoLogo'); }
  function ponerDibujos(d) {
    if (!hayDibujos() && d && d.sprite) document.body.insertAdjacentHTML('beforeend', d.sprite);
    if (visor) visor.classList.toggle('sin-dibujos', !hayDibujos());
    return d;
  }

  function pedir() {
    if (datos) return Promise.resolve(datos);
    if (pendiente) return pendiente;
    var local = window.RECO_IMAGENES || null;
    if (!local && window.AppCache) { var g = AppCache.get(CLAVE); if (g && g.data) local = g.data; }
    if (local && local.diploma) { datos = ponerDibujos(local); return Promise.resolve(datos); }
    if (!(window.AppRun && AppRun.call)) return Promise.reject(new Error('sin servidor'));
    pendiente = AppRun.call('recoImagenes', [], { busy: false }).then(function (d) {
      pendiente = null;
      if (!d || !d.diploma || !d.mensaje) throw new Error('sin imágenes');
      datos = ponerDibujos(d);
      if (window.AppCache) AppCache.set(CLAVE, d, { ttl: TTL });
      return d;
    }, function (e) { pendiente = null; throw e; });
    return pendiente;
  }

  /* Se piden ya al apuntar a cualquier cosa que abra el visor, o al llegarle con el tabulador:
     entre apuntar y soltar el clic pasan ~300 ms que, la primera vez, son espera de menos. Una vez
     por página; si falla, el clic lo vuelve a intentar. */
  function anticipar(ev) {
    var t = ev.target;
    if (!t || !t.closest || !t.closest('[data-reco-abrir]')) return;
    document.removeEventListener('pointerover', anticipar);
    document.removeEventListener('focusin', anticipar);
    pedir().catch(function () {});
  }
  document.addEventListener('pointerover', anticipar);
  document.addEventListener('focusin', anticipar);

  function poner(lugar, src) {
    var caja = visor.querySelector('[data-reco-lugar="' + lugar + '"]');
    if (!caja || !src) return;
    var img = caja.querySelector('img');
    if (!img) {
      img = new Image();
      img.decoding = 'async';
      img.alt = ALT[lugar] || '';
      img.onload = function () { caja.classList.add('lista'); };
      caja.appendChild(img);
    }
    if (img.getAttribute('src') !== src) img.src = src;
  }

  function mostrar(vista) {
    if (vista !== 'insignia') vista = 'diploma';
    visor.querySelectorAll('[data-reco-tab]').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-reco-tab') === vista));
    });
    visor.querySelectorAll('[data-reco-panel]').forEach(function (p) {
      p.hidden = p.getAttribute('data-reco-panel') !== vista;
    });
  }

  function abrir(vista) {
    visor = visor || document.getElementById('recoVisor');
    if (!visor) return;
    mostrar(vista);
    visor.classList.remove('falla');
    visor.classList.toggle('sin-dibujos', !hayDibujos());
    if (typeof visor.showModal === 'function') { if (!visor.open) visor.showModal(); }
    else visor.setAttribute('open', '');
    pedir().then(function (d) { ponerDibujos(d); poner('diploma', d.diploma); poner('mensaje', d.mensaje); },
                 function () { visor.classList.add('falla'); });
  }

  function cerrar() {
    if (!visor) return;
    if (typeof visor.close === 'function' && visor.open) visor.close();
    else visor.removeAttribute('open');
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var a = t.closest('[data-reco-abrir]');
    if (a) { ev.preventDefault(); abrir(a.getAttribute('data-reco-abrir')); return; }
    if (!visor) return;
    if (t === visor || t.closest('[data-reco-cerrar]')) { cerrar(); return; }
    var tab = t.closest('[data-reco-tab]');
    if (tab) mostrar(tab.getAttribute('data-reco-tab'));
  });

  window.AppReco = { abrir: abrir, cerrar: cerrar, credencial: credencial, saludar: saludar, encender: encender };
})();
</script>
