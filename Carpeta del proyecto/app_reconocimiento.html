<!--
  RECONOCIMIENTO · Reto de Innovación Liverpool 2026 (04/10/2026, propuestas en PRUEBAS).

  El Portal Ventel quedó en tercer lugar nacional del Reto de Innovación Liverpool 2026. El
  creador pidió que el Portal lo enseñe —con el logotipo del Reto, el «tercer lugar», el
  diploma y la insignia «Innovación» de su identificación— y propuestas para ver dónde:
    A · Vitrina en el inicio de sesión (inicioDeSesion.html, .reco-vitrina).
    B · Sello bajo la marca de la barra lateral del Portal (Index.html, .reco-sello-lat).
    C · Banda en la portada «Tu turno» (Index.html, .reco-banda).
  Las tres comparten este parcial: el sprite (logotipo, insignia, medalla y la miniatura del
  diploma, UNA vez por página), el visor y su comportamiento. B y C viven solo en Index hasta
  que el creador elija: app_shell y Promociones no se tocan en esta ronda.

  Pesos: aquí van ~65 KB (el logotipo vectorial es la mitad). El diploma a tamaño de lectura y
  el mensaje del director (~120 KB) NO viajan en la página: los pide el visor al abrirse
  (recoImagenes en Portal.gs, datos en reco_imagenes.html) y se guardan 30 días, como los
  logotipos de Formas de Pago. En la vista previa local llegan en window.RECO_IMAGENES.

  Ojo con dos cosas que no se ven en el código:
    · el diploma dice «uno de los finalistas»; «tercer lugar nacional» es el texto del creador;
    · al diploma se le enderezó la perspectiva y se le emparejó la luz, y a la captura del
      mensaje solo se le quitó la papelera (receta en carpeta de apoyo/scripts/mudanza).
-->
<style>
.reco-sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ── Piezas comunes ── */
.reco-placa{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:12px;background:#fff;border:1px solid rgba(27,35,48,.08);box-shadow:0 1px 2px rgba(27,35,48,.06),0 10px 24px -16px rgba(27,35,48,.4)}
.reco-placa .reco-logo{display:block;height:34px;width:auto}
.reco-placa .reco-sep{width:1.5px;height:26px;border-radius:1px;background:#00256D}
.reco-placa .reco-anio{font:800 21px/1 'Archivo',var(--f-display,system-ui),sans-serif;color:#E10098;letter-spacing:-.01em}
.reco-medalla{display:inline-block;width:18px;height:22px;flex:none;vertical-align:-4px}
.reco-tit{display:flex;align-items:center;gap:8px;margin:0;font:700 1.02rem/1.25 var(--f-display,var(--f-ui,system-ui));color:var(--ink);letter-spacing:-.005em}
.reco-txt{margin:0;font-size:.875rem;line-height:1.55;color:var(--ink-soft);text-wrap:pretty}
.reco-ver{display:inline-flex;align-items:center;gap:7px;padding:0;border:0;background:none;cursor:pointer;font:600 .86rem/1.2 var(--f-body,var(--f-ui,system-ui));color:var(--brand-deep);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:color-mix(in srgb,var(--brand-deep) 35%,transparent)}
.reco-ver svg{width:15px;height:15px;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.reco-ver:hover{text-decoration-color:currentColor}
.reco-ver:hover svg{transform:translateX(3px)}
[data-theme="carbon"] .reco-ver{color:#FF7ACD}
.reco-ver:focus-visible,.reco-vitrina-doc:focus-visible,.reco-banda-doc:focus-visible,.reco-banda-ins:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}

/* ── A · Vitrina del inicio de sesión ── */
.reco-vitrina{display:grid;gap:22px;width:min(100%,27rem)}
.reco-vitrina-doc{position:relative;display:block;width:100%;margin:10px 0 0;padding:0;border:0;background:none;cursor:zoom-in}
.reco-vitrina-doc .reco-mini{display:block;width:100%;height:auto;border-radius:3px;background:#fff;box-shadow:0 1px 0 rgba(27,35,48,.05),0 26px 48px -22px rgba(27,35,48,.5);transform:rotate(-2deg);transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s cubic-bezier(.22,1,.36,1)}
.reco-vitrina-doc:hover .reco-mini{transform:rotate(0) translateY(-4px);box-shadow:0 1px 0 rgba(27,35,48,.05),0 34px 60px -24px rgba(27,35,48,.55)}
.reco-vitrina-doc .reco-sello{position:absolute;top:-22px;right:-16px;width:82px;height:82px;transform:rotate(9deg);filter:drop-shadow(0 8px 10px rgba(40,20,60,.28));transition:transform .5s cubic-bezier(.22,1,.36,1)}
.reco-vitrina-doc:hover .reco-sello{transform:rotate(0) scale(1.04)}
.reco-vitrina-tx{display:grid;gap:10px;justify-items:start}
.reco-vitrina-tx .reco-placa{margin-bottom:4px}
[data-theme="carbon"] .reco-vitrina-doc .reco-mini{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 26px 48px -22px rgba(0,0,0,.8)}
@media (max-width:40rem){
  .reco-vitrina-doc .reco-sello{top:-16px;right:-4px;width:64px;height:64px}
}
@media (min-width:64rem){
  .reco-vitrina{position:absolute;right:var(--s8,64px);top:50%;transform:translateY(-50%);width:min(30rem,39%);gap:26px}
}
@media (prefers-reduced-motion:no-preference){
  .reco-vitrina{animation:reco-entra .9s .5s cubic-bezier(.22,1,.36,1) both}
}
@keyframes reco-entra{from{opacity:0;translate:0 14px}}

/* ── B · Sello bajo la marca de la barra lateral (Index) ── */
.reco-sello-lat{display:flex;align-items:center;gap:10px;width:100%;margin:-.25rem 0 .8rem;padding:.5rem .65rem .5rem .5rem;border-radius:12px;border:1px solid var(--side-line);background:rgba(0,0,0,.16);color:var(--side-ink);text-align:left;cursor:pointer;transition:background-color .18s,border-color .18s}
.reco-sello-lat:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26)}
.reco-sello-lat:focus-visible{outline:2px solid #fff;outline-offset:2px}
.reco-sello-ins{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 6px -1px rgba(0,0,0,.35)}
.reco-sello-ins svg{display:block;width:100%;height:100%}
.reco-sello-tx{min-width:0;line-height:1.2}
.reco-sello-tx b{display:block;font:700 .78rem/1.2 var(--f-display);letter-spacing:.01em}
.reco-sello-tx small{display:block;margin-top:2px;font-size:.66rem;font-weight:600;color:var(--side-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reco-sello-chev{flex:none;margin-left:auto;width:14px;height:14px;color:var(--side-faint);transition:transform .25s}
.reco-sello-lat:hover .reco-sello-chev{transform:translateX(2px)}

/* ── C · Banda de la portada (Index) ── */
.reco-banda{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px 26px;margin:0 0 1.15rem;padding:16px 20px;border-radius:var(--rad-lg,14px);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-xs)}
.reco-banda-tx{display:grid;gap:4px;min-width:0}
.reco-banda-fin{display:flex;align-items:center;gap:22px}
.reco-banda-docs{display:flex;align-items:center;padding-right:4px}
.reco-banda-doc{display:block;width:108px;padding:0;border:0;background:none;cursor:zoom-in}
.reco-banda-doc svg{display:block;width:100%;height:auto;border-radius:2px;background:#fff;box-shadow:0 1px 0 rgba(27,35,48,.05),0 12px 22px -12px rgba(27,35,48,.5);transform:rotate(-3deg);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.reco-banda-doc:hover svg{transform:rotate(0) translateY(-2px)}
.reco-banda-ins{display:block;width:54px;height:54px;margin-left:-18px;margin-top:-26px;padding:0;border:0;border-radius:50%;background:none;cursor:zoom-in;filter:drop-shadow(0 5px 7px rgba(40,20,60,.28));transition:transform .4s cubic-bezier(.22,1,.36,1)}
.reco-banda-ins svg{display:block;width:100%;height:100%}
.reco-banda-ins:hover{transform:rotate(-8deg) scale(1.05)}
[data-theme="carbon"] .reco-banda{box-shadow:none}
@media (max-width:1100px){
  .reco-banda{grid-template-columns:auto minmax(0,1fr)}
  .reco-banda-fin{grid-column:1 / -1;justify-content:space-between}
}
@media (max-width:640px){
  .reco-banda{grid-template-columns:minmax(0,1fr);padding:16px}
}

/* ── Visor: el diploma y la insignia a tamaño de lectura ── */
.reco-visor{width:min(1080px,94vw);max-width:none;max-height:94vh;margin:auto;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:var(--sh-lg);overflow:hidden}
.reco-visor::backdrop{background:rgba(14,16,22,.62)}
.reco-visor[open]{display:flex;flex-direction:column}
.reco-visor-cab{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px 20px;padding:16px 18px 14px 20px;border-bottom:1px solid var(--line)}
.reco-visor-cab .reco-placa{box-shadow:none}
.reco-visor-tit{display:grid;gap:3px;min-width:0}
.reco-cerrar{width:40px;height:40px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:background-color .2s,color .2s}
.reco-cerrar:hover{background:var(--brand-tint);color:var(--brand-deep)}
.reco-cerrar:focus-visible,.reco-tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.reco-cerrar svg{width:18px;height:18px}
.reco-tabs{display:flex;gap:6px;padding:12px 20px 0}
.reco-tab{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-soft);cursor:pointer;font:600 .84rem/1 var(--f-body,var(--f-ui,system-ui))}
.reco-tab svg{width:20px;height:20px}
.reco-tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.reco-cuerpo{flex:1;min-height:0;overflow:auto;padding:16px 20px 20px}
.reco-panel{margin:0}
.reco-panel[hidden]{display:none}
.reco-hoja{position:relative;margin:0 auto;max-width:min(100%,calc((94vh - 230px) * 1.386));background:#fff;border-radius:4px;box-shadow:0 1px 0 rgba(27,35,48,.05),0 18px 40px -22px rgba(27,35,48,.5)}
.reco-hoja > svg,.reco-hoja > img{display:block;width:100%;height:auto;border-radius:4px}
.reco-hoja > img{position:absolute;inset:0;opacity:0;transition:opacity .35s ease}
.reco-hoja.lista > img{opacity:1}
.reco-panel-pie{margin:12px 0 0;font-size:.8rem;color:var(--ink-faint);text-align:center}
.reco-ins-caja{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);align-items:center;gap:20px 34px;max-width:900px;margin:0 auto}
.reco-ins-grande{display:grid;justify-items:center;gap:10px;text-align:center}
.reco-ins-grande svg{width:min(100%,128px);height:auto;filter:drop-shadow(0 10px 14px rgba(40,20,60,.25))}
.reco-ins-grande b{font:700 .95rem/1.25 var(--f-display,var(--f-ui,system-ui));color:var(--ink)}
.reco-ins-grande small{font-size:.78rem;color:var(--ink-faint)}
.reco-mensaje{position:relative;min-height:160px;border-radius:14px;border:1px solid var(--line);background:#fff;overflow:hidden}
.reco-mensaje > img{display:block;width:100%;height:auto}
.reco-mensaje:not(.lista)::after{content:"";position:absolute;inset:18px;border-radius:10px;background:linear-gradient(90deg,#F1F3F7 0%,#F8F9FB 50%,#F1F3F7 100%);background-size:200% 100%;animation:reco-brillo 1.4s linear infinite}
@keyframes reco-brillo{to{background-position:-200% 0}}
.reco-falla-msg{display:none;margin:10px 0 0;font-size:.8rem;color:var(--warn,#B45309);text-align:center}
.reco-visor.falla .reco-falla-msg{display:block}
.reco-visor.falla .reco-mensaje:not(.lista)::after{animation:none}
@media (max-width:720px){
  .reco-visor{width:100vw;max-height:100dvh;height:100dvh;border-radius:0}
  .reco-visor-cab{grid-template-columns:minmax(0,1fr) auto}
  .reco-visor-cab .reco-placa{grid-column:1 / -1;justify-self:start}
  .reco-ins-caja{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .reco-vitrina,.reco-mini,.reco-sello,.reco-banda-doc svg,.reco-banda-ins,.reco-hoja > img{transition:none;animation:none}
  .reco-mensaje:not(.lista)::after{animation:none}
}
</style>

    <button type="button" class="reco-tab" role="tab" id="recoTabDiploma" aria-controls="recoPanelDiploma" aria-selected="true" data-reco-tab="diploma">Diploma</button>
    <button type="button" class="reco-tab" role="tab" id="recoTabInsignia" aria-controls="recoPanelInsignia" aria-selected="false" data-reco-tab="insignia"><svg viewBox="0 0 87 87" aria-hidden="true"><use href="#recoInsignia"/></svg>Insignia «Innovación»</button>
  </div>
  <div class="reco-cuerpo">
    <figure class="reco-panel" id="recoPanelDiploma" role="tabpanel" aria-labelledby="recoTabDiploma" data-reco-panel="diploma">
      <div class="reco-hoja" data-reco-lugar="diploma"><svg viewBox="0 0 560 404" role="img" aria-label="Diploma «Reconocimiento» del Reto de Innovación Liverpool otorgado a David Martínez Arredondo"><use href="#recoDiplomaMini"/></svg></div>
      <figcaption class="reco-panel-pie">Diploma «Reconocimiento» del Reto de Innovación Liverpool 2026</figcaption>
      <p class="reco-falla-msg">No se pudo traer el diploma a tamaño completo; se ve la versión reducida.</p>
    </figure>
    <figure class="reco-panel" id="recoPanelInsignia" role="tabpanel" aria-labelledby="recoTabInsignia" data-reco-panel="insignia" hidden>
      <div class="reco-ins-caja">
        <div class="reco-ins-grande">
          <svg viewBox="0 0 87 87" role="img" aria-label="Insignia «Innovación»"><use href="#recoInsignia"/></svg>
          <b>Insignia «Innovación»</b>
          <small>2 de octubre de 2026</small>
        </div>
        <div class="reco-mensaje" data-reco-lugar="mensaje"></div>
      </div>
      <p class="reco-falla-msg">No se pudo traer el mensaje. Revisa tu conexión e inténtalo de nuevo.</p>
    </figure>
  </div>
</dialog>

<script>
/* AppReco: abre el visor del reconocimiento desde cualquier [data-reco-abrir="diploma|insignia"]
   (las tres propuestas lo usan) y le trae las imágenes grandes la primera vez. */
(function () {
  'use strict';
  var CLAVE = 'reco-imagenes-v1', TTL = 30 * 864e5;
  var ALT = {
    diploma: 'Diploma «Reconocimiento» del Reto de Innovación Liverpool otorgado a David Martínez Arredondo: «Por ser uno de los finalistas en el reto “Innovación Liverpool 2026”, tu creatividad, visión y esfuerzo marcaron la diferencia». Firman Carlos Marín Rangel, Director General Liverpool, y Enrique Antonio Pando Marino, Director Corporativo Operaciones Liverpool.',
    mensaje: 'Identificación «Innovación» del 2 de octubre de 2026: «Estimado David: ¡Muchas felicidades por tu reconocimiento en el Reto de Innovación 2026! Tu talento, iniciativa y dedicación son parte importante de los resultados que nos permiten seguir creciendo y transformando nuestra operación. ¡Enhorabuena por este gran logro!», de Enrique Antonio Pando Marino, Director Corporativo Operaciones Liverpool.'
  };
  var datos = null, pendiente = null, visor = null;

  function pedir() {
    if (datos) return Promise.resolve(datos);
    if (pendiente) return pendiente;
    var local = window.RECO_IMAGENES || null;
    if (!local && window.AppCache) { var g = AppCache.get(CLAVE); if (g && g.data) local = g.data; }
    if (local && local.diploma) { datos = local; return Promise.resolve(datos); }
    if (!(window.AppRun && AppRun.call)) return Promise.reject(new Error('sin servidor'));
    pendiente = AppRun.call('recoImagenes', [], { busy: false }).then(function (d) {
      pendiente = null;
      if (!d || !d.diploma || !d.mensaje) throw new Error('sin imágenes');
      datos = d;
      if (window.AppCache) AppCache.set(CLAVE, d, { ttl: TTL });
      return d;
    }, function (e) { pendiente = null; throw e; });
    return pendiente;
  }

  function poner(lugar, src) {
    var caja = visor.querySelector('[data-reco-lugar="' + lugar + '"]');
    if (!caja || !src) return;
    var img = caja.querySelector('img');
    if (!img) {
      img = new Image();
      img.decoding = 'async';
      img.alt = ALT[lugar] || '';
      img.onload = function () { caja.classList.add('lista'); };
      caja.appendChild(img);
    }
    if (img.getAttribute('src') !== src) img.src = src;
  }

  function mostrar(vista) {
    if (vista !== 'insignia') vista = 'diploma';
    visor.querySelectorAll('[data-reco-tab]').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-reco-tab') === vista));
    });
    visor.querySelectorAll('[data-reco-panel]').forEach(function (p) {
      p.hidden = p.getAttribute('data-reco-panel') !== vista;
    });
  }

  function abrir(vista) {
    visor = visor || document.getElementById('recoVisor');
    if (!visor) return;
    mostrar(vista);
    visor.classList.remove('falla');
    if (typeof visor.showModal === 'function') { if (!visor.open) visor.showModal(); }
    else visor.setAttribute('open', '');
    pedir().then(function (d) { poner('diploma', d.diploma); poner('mensaje', d.mensaje); },
                 function () { visor.classList.add('falla'); });
  }

  function cerrar() {
    if (!visor) return;
    if (typeof visor.close === 'function' && visor.open) visor.close();
    else visor.removeAttribute('open');
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var a = t.closest('[data-reco-abrir]');
    if (a) { ev.preventDefault(); abrir(a.getAttribute('data-reco-abrir')); return; }
    if (!visor) return;
    if (t === visor || t.closest('[data-reco-cerrar]')) { cerrar(); return; }
    var tab = t.closest('[data-reco-tab]');
    if (tab) mostrar(tab.getAttribute('data-reco-tab'));
  });

  window.AppReco = { abrir: abrir, cerrar: cerrar };
})();
</script>
