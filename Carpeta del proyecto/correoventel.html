    <!-- Preferencias de vista (tema · densidad · texto · contraste) ANTES del tema,
         para que la pantalla no parpadee del ajuste por omisión al de la persona. -->

    <style>
        .step-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 999px;
            background: var(--brand);
            color: #fff;
            font-weight: 700;
            font-size: .85rem;
            flex: none;
        }
        .step-chip.done { background: var(--ok); }

        /* ── Panel «Últimas cotizaciones» (columna derecha) ──────────────────
           La rejilla, el ancho y el pegado van en CSS PLANO y no en utilidades:
           `app_tailwind` es una hoja COMPILADA y no trae `max-w-6xl`, `sticky` ni
           las variantes `lg:` de rejilla, así que escribirlas aquí no pintaría
           nada y el fallo sería MUDO. El ancho tampoco puede ser una utilidad:
           esa hoja se carga DESPUÉS de este bloque y, a igual especificidad,
           ganaría la cascada. */
        .cv-main { max-width: 76rem; }
        .cv-grid { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 1.5rem; align-items: start; }
        .cv-col { min-width: 0; }
        .cv-aside { position: sticky; top: 1rem; padding: 1rem; }
        /* El corte es el MISMO en el que el shell convierte la barra lateral en
           cajón: por debajo, el panel deja de ser columna y baja al final. */
        @media (max-width: 1024px) {
            .cv-grid { grid-template-columns: minmax(0, 1fr); }
            .cv-aside { position: static; }
        }
        .cv-aside-head { margin-bottom: .5rem; }
        .cv-aside-title { font-size: .95rem; font-weight: 700; color: var(--ink); }
        .cv-aside-sub { font-size: .72rem; color: var(--ink-soft); min-height: 1em; }
        .cv-lista { max-height: 24rem; overflow-y: auto; }
        .cv-vacio { font-size: .8rem; color: var(--ink-soft); padding: .5rem .25rem; }
        /* Las filas NO llevan recuadro propio: un marco dentro del panel sería
           tarjeta dentro de tarjeta. Se separan con una línea. Y son <button>
           de verdad, que es lo que da teclado y foco sin escribir nada. */
        .cv-item {
            display: block; width: 100%; text-align: left;
            padding: .55rem .45rem; border: none; border-radius: 8px;
            border-bottom: 1px solid var(--line); background: transparent;
            font: inherit; color: inherit; cursor: pointer;
            transition: background .15s ease;
        }
        .cv-item:last-child { border-bottom: none; }
        .cv-item:hover { background: var(--surface-2); }
        .cv-item[aria-current="true"] { background: var(--surface-2); }
        .cv-item-folio { display: block; font-weight: 700; font-size: .8rem; color: var(--ink); }
        /* `--ink-soft` (#5C6B7E) y NUNCA `--ink-faint` (#94A1B2): ese segundo se
           queda en 2.5:1 y es justo el que el detector de diseño ya marca en otra
           pantalla. */
        .cv-item-cliente {
            display: block; font-size: .78rem; color: var(--ink-soft);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .cv-item-pie {
            display: flex; align-items: center; justify-content: space-between;
            gap: .4rem; margin-top: .2rem; font-size: .7rem; color: var(--ink-soft);
        }
        .cv-aside-pie { width: 100%; margin-top: .6rem; }
    </style>
<!-- Utilidades Tailwind compiladas: va al final del head, igual que la hoja que el CDN inyectaba. -->
<?!= include('app_tailwind'); ?>

<body class="h-full text-slate-800">

        <section class="mb-8 p-6 v-card" data-animate>
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span class="step-chip" id="step1-chip">1</span> Cargar Datos de Cotización</h2>

        </form>

          </div><!-- /.cv-col -->

          <!-- Atajo al caso real: casi siempre se envía algo recién hecho, y hasta

          <aside class="cv-aside v-card" aria-labelledby="recent-title">

         Ctrl+K. app_comando lo monta solo si este archivo esta presente. -->

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (!requireBlock('enviar_cotizacion', 'correoventel')) return;

        // Marco lateral compartido con el Portal (envuelve el <main> y aporta sesión/tema).
        AppShell.mount({ active: 'correoventel', title: 'Enviar correo' });

        // El loader de marca cubre el arranque; se retira en cuanto la pantalla está lista.
        if (window.VentelLoader) VentelLoader.hide();

        // --- Elementos del DOM ---
        const searchQuoteForm = document.getElementById('searchQuoteForm');
        const folioInput = document.getElementById('folioInput');
        const searchQuoteButton = document.getElementById('searchQuoteButton');
        const quoteDataStatus = document.getElementById('quote-data-status');
        const step1Chip = document.getElementById('step1-chip');

        const emailForm = document.getElementById('emailForm');
        const emailFields = document.getElementById('email-fields');
        const recipientInput = document.getElementById('recipient');
        const subjectInput = document.getElementById('subject');
        const bodyInput = document.getElementById('body');
        const sendButton = document.getElementById('sendButton');
        const viewQuoteButton = document.getElementById('viewQuoteButton');
        const alertContainer = document.getElementById('alert-container');
        const formatSelect = document.getElementById('formatSelect');
        const formatHint = document.getElementById('formatHint');

        let loadedQuoteData = null;

        // Tolerancia a despliegues parciales: si el app_core cargado aún no trae
        // AppCache, la pantalla funciona igual, solo sin caché local.
        /* Esta pantalla ya no toca `AppCache` a mano: sus dos copias locales —el
           catálogo de formatos y el remitente— las lleva `AppRun.swr`, que es quien
           lee, pinta, revalida y guarda. */

        // El folio puede venir de otra pantalla por la URL. Se copia una sola vez porque
        // solo sirve para la auto-búsqueda del arranque, antes de que nada escriba la barra.
        const urlFolio = AppUrl.param('folio');
        /* El formato NO se congela aquí. Desde que el selector refleja su elección, este
           valor cambia durante la sesión: con la copia del arranque, la segunda búsqueda
           preseleccionaría el formato con el que se entró mientras la barra sigue
           anunciando el que el asesor eligió después. Se lee vivo donde se usa. */

        /* Chip giratorio en línea. El giro NO se pone aquí: app_loaders ya trae
           `[data-chipspin]{animation:vfx-spin .9s linear infinite}` —con su variante
           para «menos movimiento»— y una animación CSS gana en la cascada a
           cualquier transform en línea, así que un tween de GSAP encima no se vería
           y solo dejaría un `repeat:-1` girando sobre un nodo ya desechado.
           Devuelve la función que lo retira, para que el llamador la invoque en
           TODAS sus salidas; si no repinta el texto, el chip se va igual. */
        const chipEnEspera = (el, texto) => {
            if (!el || !window.VentelFX) return () => {};
            el.innerHTML = '<span class="vfx vfx-chip">' + VentelFX.chip() + '<span>' + texto + '</span></span>';
            return () => { if (el.querySelector('[data-chipspin]')) el.textContent = ''; };
        };

        /**
         * Llena el selector con los formatos habilitados y preselecciona el indicado.
         */
        let quitarChipFormatos = () => {};
        /* La lista pintada AHORA. El oyente de `change` se cablea una sola vez y lee de
           aquí, no de la respuesta que le tocó en su render: con `swr` esto se pinta dos
           veces —copia local y servidor— y también una vez por cada folio que se busque,
           así que un oyente que se quedara con la primera respuesta describiría los
           formatos de un catálogo viejo cada vez que se cambiara el selector. */
        let formatosActuales = [];
        const describirFormato = () => {
            const match = formatosActuales.find(f => f.id === formatSelect.value);
            formatHint.textContent = match ? match.description : '';
        };
        formatSelect.addEventListener('change', () => {
            describirFormato();
            /* El formato decide el PDF que le llega al cliente y hasta ahora solo vivía
               en el <select>: un F5 lo devolvía al de la cotización y no había manera de
               mandarle a nadie «envíasela con este formato». Va sin apilar —es una
               preferencia de la vista, no un paso del historial— y solo desde `change`,
               que es cosa de la persona: renderFormats marca la opción con innerHTML y
               eso no dispara este oyente, así que pintar el selector no escribe la URL. */
            if (window.AppUrl && AppUrl.reflejar) AppUrl.reflejar({ format: formatSelect.value });
        });

        const renderFormats = (response, preferredId) => {
            quitarChipFormatos();
            if (!response || !response.success || !response.formats || response.formats.length === 0) {
                formatosActuales = [];
                formatSelect.innerHTML = '<option value="">Sin formatos disponibles</option>';
                formatHint.textContent = 'No hay ningún formato disponible. Pide a un usuario avanzado que habilite al menos uno.';
                return;
            }

            const chosen = response.formats.some(f => f.id === preferredId)
                ? preferredId
                : response.defaultId;

            formatosActuales = response.formats;
            formatSelect.innerHTML = response.formats
                .map(f => `<option value="${f.id}" ${f.id === chosen ? 'selected' : ''}>${f.name}</option>`)
                .join('');
            formatSelect.disabled = false; // ya hay algo que elegir
            describirFormato();
        };

        const loadEmailFormats = (preferredId) => {
            /* Los formatos casi no cambian: se pintan al instante desde la caché local
               y se revalidan en segundo plano contra el servidor. Es `AppRun.swr`, y la
               clave es la MISMA que usan la pantalla de cotización, la vista previa y el
               calentador de `app_precarga` —antes esta pantalla guardaba lo mismo bajo
               'formats', su propia clave, así que llegar aquí desde una cotización
               recién guardada volvía a pedir al servidor un catálogo que ya estaba en el
               navegador—.

               `AppRun` cubre además el caso que aquí estaba parcheado con un try/catch:
               si el servidor desplegado no expone la función, rechaza la promesa en vez
               de no llamar a ningún manejador, que dejaba el chip girando y el selector
               bloqueado —y con él, el envío imposible—. */
            let hayCopia = false;

            const alFallar = (error) => {
                if (hayCopia) return;   // ya hay opciones pintadas desde la caché
                quitarChipFormatos();
                console.error('getEnabledQuoteFormats:', error);
                formatSelect.innerHTML = '<option value="">No se pudieron cargar</option>';
                formatHint.textContent = 'No pudimos cargar los formatos. Revisa tu conexión y recarga la página.';
            };

            const p = AppRun.swr('formatos-cotizacion', 'getEnabledQuoteFormats', [], {
                ttl: 12 * 60 * 60 * 1000,
                maxAge: 12 * 60 * 60 * 1000,
                accept: (r) => !!(r && r.success),
                onData: (response, deCache) => {
                    if (deCache) { hayCopia = true; renderFormats(response, preferredId); return; }
                    // En la revalidación manda lo que ya esté elegido: el catálogo llega
                    // un segundo tarde y para entonces se puede haber tocado el selector.
                    renderFormats(response, formatSelect.value || preferredId);
                },
                onError: alFallar
            });

            /* Dentro de un <select> no cabe más que texto: el chip va en la pista de
               abajo y el selector se queda bloqueado hasta que haya opciones. Se decide
               después de llamar porque `swr` pinta lo guardado de forma síncrona, así
               que aquí ya se sabe si hubo copia. */
            if (!hayCopia) {
                formatSelect.disabled = true;
                quitarChipFormatos = chipEnEspera(formatHint, 'Cargando los formatos disponibles…');
            }
            return p;
        };

        // --- Remitente visible: el asesor sabe desde qué correo saldrá el envío. ---
        const senderInfoText = document.getElementById('senderInfoText');
        const loadSenderInfo = () => {
            const quitarChipRemitente = chipEnEspera(senderInfoText, 'Verificando remitente…');
            const paint = (info) => {
                quitarChipRemitente();
                if (!info || !senderInfoText) { if (senderInfoText) senderInfoText.textContent = ''; return; }
                senderInfoText.innerHTML = info.aliasAvailable
                    ? `El correo saldrá desde <strong>${info.alias}</strong> y las respuestas del cliente llegarán a tu correo.`
                    : `El correo saldrá desde la cuenta del sistema, porque <strong>${info.alias}</strong> todavía no está habilitado. Las respuestas del cliente llegarán a tu correo.`;
            };
            // Se pinta al instante con lo guardado (30 min) y se revalida detrás;
            // misma entrada de caché que usa la pantalla de correos a clientes.
            // paint() corre SIEMPRE, aunque el servidor no devuelva nada: es quien
            // retira el chip, y una respuesta vacía lo dejaría girando para siempre.
            AppRun.swr('sender-info', 'getMailSenderInfo', [], {
                ttl: 30 * 60 * 1000,
                accept: (info) => !!(info && info.success && info.aliasAvailable),
                onData: paint,
                onError: (e, cached) => { quitarChipRemitente(); if (!cached && senderInfoText) senderInfoText.textContent = ''; }
            });
        };
        // Si el servidor aún no trae getMailSenderInfo (despliegue viejo), esto no debe
        // detener el resto de la pantalla.
        try { loadSenderInfo(); } catch (e) { console.warn('Info de remitente no disponible:', e); }

        // --- Funciones de UI ---
        const setButtonLoadingState = (button, isLoading, text = 'Cargando...') => {
            if (!button) return;
            const textEl = button.querySelector('.button-text');
            const iconEl = button.querySelector('.button-icon');

            if (isLoading) {
                if (textEl && !button.dataset.originalText) button.dataset.originalText = textEl.textContent;
                if (iconEl && !button.dataset.originalIcon) button.dataset.originalIcon = iconEl.innerHTML;

                if (textEl) textEl.textContent = text;
                if (iconEl) iconEl.innerHTML = '<div class="v-spinner"></div>';
                button.disabled = true;
            } else {
                if (textEl && button.dataset.originalText) textEl.textContent = button.dataset.originalText;
                if (iconEl && button.dataset.originalIcon) iconEl.innerHTML = button.dataset.originalIcon;
                button.disabled = false;
            }
        };

        const showAlert = (message, type = 'success') => {
            AppMotion.toast(message, type === 'success' ? 'ok' : 'error');
        };

        const resetForm = () => {
            emailFields.disabled = true;
            sendButton.disabled = true;
            viewQuoteButton.disabled = true;
            emailForm.reset();
            folioInput.value = '';
            quoteDataStatus.classList.add('hidden');
            step1Chip.classList.remove('done');
            step1Chip.textContent = '1';
            loadedQuoteData = null;
            /* La pantalla vuelve a cero, así que la barra también. Con el folio puesto, un
               F5 tras enviar el correo dispararía la auto-búsqueda y recargaría la
               cotización que se acababa de despachar; y cuando se limpia porque el
               servidor no reconoció ese folio, la recarga volvería a pedir el mismo folio
               malo una y otra vez. `format` se va con él porque emailForm.reset() devuelve
               el selector a su opción por omisión: dejarlo sería anunciar en el enlace un
               formato que ya nadie tiene elegido. Sin apilar: esto es limpiar, no navegar. */
            if (window.AppUrl && AppUrl.reflejar) AppUrl.reflejar({ folio: '', format: '' });
        };

        // --- Lógica Principal ---
        // `fx` es la escena que abrió el llamador (la auto-búsqueda por ?folio=);
        // esta función se encarga de cerrarla en todas sus salidas.
        const handleSearchQuote = (e, fx) => {
            if (e && e.preventDefault) e.preventDefault();
            const folio = folioInput.value.trim();
            if (!folio) {
                if (fx) fx.done();
                showAlert("Por favor, ingresa un número de folio.", "error");
                AppMotion.shake(folioInput);
                return;
            }

            setButtonLoadingState(searchQuoteButton, true, 'Buscando...');
            // En vez de esconder la caja de estado, se deja con la forma del resumen
            // que va a llegar: así el paso 1 no se queda mudo mientras responde.
            quoteDataStatus.innerHTML = '';
            quoteDataStatus.classList.remove('hidden');
            const fxDatos = window.VentelFX
                ? VentelFX.skeleton(quoteDataStatus, 'formulario', { rows: 1 })
                : null;

            /* Cierra los dos indicadores y devuelve el paso 1 a su sitio. Cubre los dos
               modos de fallo, y con `AppRun` son el mismo: se caiga la red o resulte que
               el servidor desplegado no expone `getQuoteDetailsForEmail`, la promesa se
               rechaza y esto corre. Importa porque el overlay tiene tope de seguridad
               pero el esqueleto NO: sin manejador se quedaría brillando para siempre y
               el botón, clavado en «Buscando…». */
            const alFallar = (error) => {
                if (fx) fx.done();
                if (fxDatos) fxDatos.done();
                quoteDataStatus.classList.add('hidden'); // sin datos que enseñar, la caja vuelve a su sitio
                setButtonLoadingState(searchQuoteButton, false);
                showAlert("No pudimos buscar la cotización. Revisa tu conexión e inténtalo de nuevo.", "error");
                console.error("Error en getQuoteDetailsForEmail:", error);
            };

            AppRun.call('getQuoteDetailsForEmail', [folio, AppSession.userEmail], { busy: 'Buscando' })
                .then(response => {
                    if (fx) fx.done();
                    if (fxDatos) fxDatos.done();
                    setButtonLoadingState(searchQuoteButton, false);
                    response = response || {};
                    if (response.success) {
                        loadedQuoteData = response.data;
                        /* La cotización cargada pasa a la barra: es lo que convierte «ya
                           tengo los datos» en un enlace que otro asesor abre con el paso 1
                           resuelto en vez de teniendo que teclear el folio. Se refleja el
                           que contesta el SERVIDOR, no lo que se escribió en la caja
                           —espacios o minúsculas acabarían en el enlace compartido—, que
                           es el mismo con el que más abajo se arman «Ver Cotización» y el
                           envío. Sin apilar: no se ha cambiado de pantalla, se le está
                           poniendo nombre a la que ya se está viendo, y apilar dejaría un
                           «atrás» hacia esta misma pantalla en blanco. */
                        if (window.AppUrl && AppUrl.reflejar) AppUrl.reflejar({ folio: loadedQuoteData.folio });
                        quoteDataStatus.innerHTML = `
                            <span class="font-bold text-green-700">✓ Datos Cargados:</span>
                            Cotización <strong>${loadedQuoteData.folio}</strong> para <strong>${loadedQuoteData.clientName}</strong>.
                        `;
                        quoteDataStatus.classList.remove('hidden');
                        AppMotion.pop(quoteDataStatus);
                        step1Chip.classList.add('done');
                        step1Chip.textContent = '✓';

                        recipientInput.value = loadedQuoteData.clientEmail;
                        subjectInput.value = `Cotización de Servicios Ventel - Folio ${loadedQuoteData.folio}`;
                        bodyInput.value = `Estimado(a) ${loadedQuoteData.clientName},\n\nJunto con saludar, y como seguimiento a nuestra conversación, le hago llegar la cotización solicitada con folio ${loadedQuoteData.folio}.\n\nQuedo a sus órdenes para cualquier duda o aclaración.\n\nSaludos cordiales,`;

                        /* Lo que pide la URL manda sobre el formato guardado con la
                           cotización, y se pregunta VIVO: es lo que mantiene de acuerdo al
                           selector y al enlace cuando se buscan dos folios seguidos. */
                        loadEmailFormats(AppUrl.param('format') || loadedQuoteData.format);

                        emailFields.disabled = false;
                        viewQuoteButton.disabled = false;

                        // GATE DE REVISIÓN: una cotización sin aprobar no sale al cliente.
                        // El servidor la rechazaría de todos modos (Revision.gs); esto lo
                        // dice ANTES de que el asesor redacte el correo, y explica quién
                        // tiene que aprobarla en vez de dejar un botón gris sin motivo.
                        const rev = loadedQuoteData.revision || { aprobada: true };
                        sendButton.disabled = !rev.aprobada;
                        if (!rev.aprobada) {
                            const rechazada = rev.estado === 'Rechazada';
                            const quien = rev.nombre ? ' La revisó ' + rev.nombre + '.' : '';
                            const detalle = rechazada
                                ? 'Esta cotización fue RECHAZADA en la revisión.' + quien +
                                  ' Corrígela y guárdala de nuevo para que vuelva a la cola.'
                                : 'Esta cotización sigue EN REVISIÓN. Un usuario avanzado debe aprobarla antes de que se pueda enviar al cliente.';

                            // El aviso se queda FIJO bajo el buscador, no solo en un toast:
                            // el toast se va a los siete segundos y el botón deshabilitado
                            // quedaría sin explicación a la vista.
                            const esc = window.escapeHtml || (s => String(s == null ? '' : s));
                            quoteDataStatus.innerHTML +=
                                '<div style="margin-top:.6rem;padding:.7rem .9rem;border-radius:10px;' +
                                'border:1px solid var(--line,#e2e8f0);border-left:4px solid ' +
                                (rechazada ? 'var(--alert,#C81E3C)' : 'var(--warn,#B45309)') + ';' +
                                'background:' + (rechazada ? 'var(--alert-bg,#FDE8EC)' : 'var(--warn-bg,#FDF1E0)') + ';">' +
                                '<strong>Envío bloqueado.</strong> ' + esc(detalle) +
                                (rev.notas ? '<div style="margin-top:.4rem;white-space:pre-wrap"><em>Observaciones:</em> ' + esc(rev.notas) + '</div>' : '') +
                                '</div>';
                            showAlert(detalle, "error");
                            sendButton.title = 'Bloqueado hasta que la cotización esté aprobada.';
                        } else {
                            sendButton.title = '';
                        }

                        AppMotion.enter(emailForm);
                    } else {
                        showAlert(response.message, "error");
                        resetForm();
                    }
                }, alFallar);
        };

        const handleSendEmail = (e) => {
            e.preventDefault();
            if (!loadedQuoteData || !emailForm.checkValidity()) {
                showAlert("Por favor, completa todos los campos requeridos.", "error");
                return;
            }
            if (!formatSelect.value) {
                showAlert("Elige el formato del PDF antes de enviar.", "error");
                AppMotion.shake(formatSelect);
                return;
            }

            setButtonLoadingState(sendButton, true, 'Enviando...');
            const emailData = {
                to: recipientInput.value,
                subject: subjectInput.value,
                body: bodyInput.value, // El cuerpo del mensaje escrito por el usuario
                folio: loadedQuoteData.folio,
                format: formatSelect.value,
                // Requerido por el gate de sesión del servidor (métricas): quien envía
                // debe estar registrado/logueado. Ver Metricas.gs / metVerificarAsesor_.
                asesor: (window.AppSession && AppSession.userEmail) || ''
            };

            // El envío genera el PDF en el servidor y puede tardar: la escena del sobre
            // acompaña la espera con datos de la empresa en lugar de una pantalla muda.
            // El tema va explícito porque esta espera es un ENVÍO, no el arranque de la
            // pantalla (que es lo que VentelLoader mostraría por su cuenta).
            if (window.VentelLoader) {
                VentelLoader.show({
                    tema: 'sobre',
                    title: 'Enviando el correo al cliente…',
                    sub: `Estamos generando el PDF del folio ${emailData.folio} y emitiendo el correo a ${emailData.to}. Espera un momento, por favor; no cierres esta ventana.`,
                    facts: true,
                    maxMs: 90000
                });
            }

            /* El loader de marca tapa la pantalla entera durante el envío, así que el
               disco de la esquina no añadiría nada: `busy: false`. La deduplicación sí
               importa —dos envíos idénticos serían dos correos al mismo cliente—, y la
               clave que arma `AppRun` con la función y los argumentos hace que un
               segundo envío con OTRO destinatario o formato siga siendo una llamada
               aparte, que es justo la distinción que hay que respetar. */
            AppRun.call('sendQuoteByEmail', [emailData], { busy: false })
                .then(response => {
                    if (window.VentelLoader) VentelLoader.hide();
                    setButtonLoadingState(sendButton, false);
                    response = response || {};
                    if (response.success) {
                        const from = response.sentFrom ? ` desde ${response.sentFrom}` : '';
                        showAlert(`Correo del folio ${emailData.folio} enviado${from}.`, "success");
                        resetForm();
                        /* El estatus de esa cotización acaba de pasar a "Enviada". Sin
                           esto el panel seguiría enseñándola como pendiente hasta un F5
                           —y la copia que comparte con el inicio del asesor, también. */
                        try { PanelRecientes.refrescar(); } catch (e) {}
                    } else {
                        showAlert(response.message, "error");
                    }
                }, error => {
                    if (window.VentelLoader) VentelLoader.hide();
                    setButtonLoadingState(sendButton, false);
                    showAlert("No pudimos enviar el correo. Revisa tu conexión e inténtalo de nuevo.", "error");
                    console.error("Error en sendQuoteByEmail:", error);
                });
        };

        // --- Event Listeners ---
        searchQuoteForm.addEventListener('submit', handleSearchQuote);
        emailForm.addEventListener('submit', handleSendEmail);
        viewQuoteButton.addEventListener('click', () => {
            if (!loadedQuoteData) return;
            AppUrl.go('consulta_cotizacion', { folio: loadedQuoteData.folio });
        });

        /* ── Panel «Últimas cotizaciones» ───────────────────────────────────
           No hay función nueva en el servidor: es la MISMA lista que el asesor ve
           en su inicio. Dos contratos que no se ven desde aquí y que hay que
           respetar:

           · La clave 'quotes-<correo>' guarda EL ARREGLO de cotizaciones, no la
             respuesta entera. La leen también inicio.html, app_precarga y el
             buscador general; escribir aquí un {success, quotes} los dejaría
             pintando vacío hasta que caducara la copia de cada navegador. Por eso
             NO se usa `AppRun.swr`, que guarda la respuesta completa.
           · Los argumentos van EXACTAMENTE como los manda app_precarga
             ([correo, null, false]): AppRun deduplica por función + argumentos, y
             un '' en lugar de null serían dos viajes al servidor en el arranque. */
        const PanelRecientes = (function () {
            const TOPE = 8;
            const lista = document.getElementById('recent-list');
            const estado = document.getElementById('recent-status');
            const correoAsesor = (window.AppSession && AppSession.userEmail) || '';
            const CLAVE = 'quotes-' + correoAsesor;
            const esc = window.escapeHtml || (s => String(s == null ? '' : s));

            const dinero = (n) => {
                const v = Number(n) || 0;
                try { return v.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' }); }
                catch (e) { return '$' + v.toFixed(2); }
            };

            const pintar = (quotes) => {
                if (!lista) return;
                const filas = (quotes || []).slice(0, TOPE);
                if (filas.length === 0) {
                    lista.innerHTML = '<p class="cv-vacio">Todavía no tienes cotizaciones. En cuanto guardes una, aparecerá aquí.</p>';
                    return;
                }
                lista.innerHTML = filas.map(q => {
                    const folio = esc(q.folio);
                    // Un solo argumento: getQuotesForUser no devuelve revisionEstado.
                    const insignia = window.AppEstatus ? AppEstatus.badge(q.estatus) : esc(q.estatus);
                    return '<button type="button" class="cv-item" data-folio="' + folio + '">' +
                               '<span class="cv-item-folio">' + folio + '</span>' +
                               '<span class="cv-item-cliente">' + esc(q.cliente) + '</span>' +
                               '<span class="cv-item-pie"><span>' + esc(q.fecha) + ' · ' + dinero(q.total) + '</span>' + insignia + '</span>' +
                           '</button>';
                }).join('');
            };

            /* `forzar` solo es true tras un envío: ahí el estatus acaba de cambiar a
               "Enviada" y hay que saltarse la caché del servidor. En el arranque va
               false, que además es lo que iguala los argumentos con app_precarga. */
            const pedir = (forzar) => {
                if (!correoAsesor) return;
                AppRun.call('getQuotesForUser', [correoAsesor, null, forzar === true], { busy: false })
                    .then(r => {
                        r = r || {};
                        const quotes = r.success ? (r.quotes || []) : [];
                        if (r.success && window.AppCache) AppCache.set(CLAVE, quotes);  // el ARREGLO, por contrato
                        pintar(quotes);
                        if (estado) estado.textContent = '';
                    }, e => {
                        // El panel es un atajo: si falla, la pantalla sigue sirviendo
                        // con la búsqueda por folio de siempre.
                        console.warn('Panel de últimas cotizaciones:', e);
                        if (estado) estado.textContent = 'No pudimos actualizar la lista.';
                    });
            };

            if (lista) {
                lista.addEventListener('click', (ev) => {
                    const boton = ev.target.closest('.cv-item');
                    if (!boton) return;
                    const folio = boton.dataset.folio || '';
                    if (!folio) return;
                    lista.querySelectorAll('.cv-item').forEach(b => {
                        b.setAttribute('aria-current', b.dataset.folio === folio ? 'true' : 'false');
                    });
                    folioInput.value = folio;
                    /* Mismo camino que teclear el folio y pulsar "Cargar Datos": así el
                       panel hereda el gate de revisión, el relleno del correo, el
                       formato y el reflejo en la URL, sin duplicar nada de eso. */
                    handleSearchQuote(null, window.VentelFX ? VentelFX.overlay('escaner', {
                        title: 'Cargando la cotización…',
                        sub: 'Consultando ' + folio
                    }) : null);
                });
            }

            return {
                arrancar: function () {
                    if (!lista) return;
                    // Pintado instantáneo con lo que ya tenga el navegador (lo calienta
                    // el inicio del asesor), y revalidación detrás.
                    const copia = (window.AppCache && AppCache.get) ? AppCache.get(CLAVE) : null;
                    if (copia && Array.isArray(copia.data)) {
                        pintar(copia.data);
                        if (estado) estado.textContent = 'Guardado ' + AppCache.ageLabel(copia.at);
                    } else {
                        lista.innerHTML = '<p class="cv-vacio">Cargando tus cotizaciones…</p>';
                    }
                    pedir(false);
                },
                refrescar: function () { pedir(true); }
            };
        })();
        PanelRecientes.arrancar();

        const verTodasBtn = document.getElementById('recent-all');
        if (verTodasBtn) verTodasBtn.addEventListener('click', () => AppUrl.goHome());

        // --- Auto-búsqueda si se proporciona Folio por la URL ---
        if (urlFolio) {
            folioInput.value = urlFolio;
            // Llegar con ?folio= dejaba la pantalla VACÍA: el loader de marca ya se
            // retiró y la consulta todavía no responde. La escena de escáner cubre
            // justo ese hueco; handleSearchQuote la cierra en todas sus salidas.
            handleSearchQuote(null, window.VentelFX ? VentelFX.overlay('escaner', {
                title: 'Buscando el folio…',
                sub: `Consultando la cotización ${urlFolio}`
            }) : null);
        }
    });
    </script>
</body>
</html>
