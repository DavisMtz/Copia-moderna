<script>
/**
 * =====================================================================================
 * GUARDADO OPTIMISTA | Sistema de cotizaciones Ventel
 * =====================================================================================
 * Se incluye DESPUÉS de app_core (necesita AppRun y AppUrl) y, si la pantalla lo trae,
 * después de app_motion (usa AppMotion.toast cuando existe).
 *
 * EL PROBLEMA QUE RESUELVE
 * ------------------------
 * En Apps Script cada escritura es un viaje de ida y vuelta de entre medio segundo y
 * varios segundos: abrir la hoja, encontrar la fila, escribirla, devolver la lista
 * nueva. Hasta ahora la pantalla se quedaba quieta durante todo ese rato —botón
 * deshabilitado, campo bloqueado, giro en la esquina— porque no se atrevía a enseñar
 * un cambio que el servidor todavía no había confirmado.
 *
 * Esa prudencia se paga entera en la mano del asesor: escribir el nombre de un cliente
 * y esperar dos segundos por cada campo convierte un formulario de ocho campos en una
 * tarea de un minuto. Y el 99 % de las veces el guardado sale bien.
 *
 * LA REGLA
 * --------
 * El cambio se pinta YA y la subida sigue por detrás. Lo que NO se hace es fingir:
 *
 *   · Mientras algo esté subiendo, se ve. Hay una pastilla que dice cuántos cambios
 *     faltan; no es decorativa, es la promesa de que nadie va a perder trabajo sin
 *     enterarse.
 *   · Si el asesor intenta irse con cambios en vuelo, se le avisa y se le deja elegir:
 *     esperar (lo normal), salir de todos modos, o quedarse. Nunca se le va la pantalla
 *     debajo de los pies con la escritura a medias.
 *   · Cuando termina, se dice. Un aviso corto por cada cosa que se guardó, para que
 *     "ya está" no sea una suposición.
 *   · Si falla, se DESHACE lo que se había pintado y se dice por qué. Un cambio
 *     optimista que se queda en pantalla después de fallar es peor que no haberlo
 *     pintado nunca: el asesor se va convencido de que guardó.
 *
 * REINTENTOS: solo lo idempotente
 * -------------------------------
 * Un fallo de transporte NO significa que el servidor no ejecutara la escritura: la
 * respuesta pudo perderse de vuelta. Reintentar "pon este valor en esta celda" es
 * inofensivo —queda igual—; reintentar "da de alta a esta persona" crea dos filas y
 * manda dos correos de bienvenida. Por eso `reintentos` se declara en cada llamada y
 * quien crea algo pone 0. El valor por omisión (2) solo se usa para escrituras que
 * fijan un valor.
 *
 * USO
 * ---
 *   AppGuardado.guardar({
 *     clave:    'miembro:' + correo,        // cola: dos ediciones de lo mismo no se pisan
 *     etiqueta: 'Guardando el rol',
 *     hecho:    'Rol actualizado',
 *     fn: 'consolaGuardarMiembro', args: [correo, cambio],
 *     optimista: function () { pintarRol(nuevo); },     // corre YA
 *     revertir:  function () { pintarRol(anterior); },  // corre si el servidor dice que no
 *     valida:   function (r) { return r && r.success; },
 *     alLograr: function (r) { refrescarTabla(r.miembros); }
 *   });
 */
(function () {
  'use strict';

  /* ── Ajustes ───────────────────────────────────────────────────────────────── */
  var REINTENTOS_POR_OMISION = 2;
  var ESPERA_BASE_MS = 700;      // backoff: 700 · 2^n, con ruido para no sincronizar
  var MAX_PARALELO = 3;          // colas distintas que corren a la vez
  var ID_CSS = 'ventel-guardado-estilos';
  var ID_PILL = 'ventel-guardado-pill';
  var ID_DIALOGO = 'ventel-guardado-dialogo';

  /* ── Estado ────────────────────────────────────────────────────────────────── */
  var colas = Object.create(null);   // clave -> { tareas:[], corriendo:bool }
  var enVuelo = 0;                   // cuántas colas están despachando ahora mismo
  var pendientes = 0;                // tareas encoladas + en vuelo
  var fallidas = 0;                  // tareas que agotaron sus reintentos en esta sesión
  var secuencia = 0;
  var oyentes = [];                  // callbacks de cambio de estado
  var esperandoVacio = [];           // resolvers de esperar()

  function esc(s) {
    if (window.AppBuscar && AppBuscar.escapa) return AppBuscar.escapa(s);
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function reducido() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch (e) { return false; }
  }
  function conGsap() { return typeof window.gsap !== 'undefined' && !reducido(); }

  function avisa(mensaje, tipo) {
    try {
      if (window.AppMotion && AppMotion.toast) { AppMotion.toast(mensaje, tipo); return; }
    } catch (e) {}
    // Sin app_motion (el Portal no lo carga) el aviso no se pierde: va a la pastilla.
    pastillaMensaje(mensaje, tipo);
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     PASTILLA DE ESTADO
     ═══════════════════════════════════════════════════════════════════════════
     Abajo a la izquierda, lejos de la esquina donde viven los avisos y el indicador
     de "Consultando…" de app_core: son tres cosas distintas y llegan a coincidir.

     Dice un número, no un giro indefinido. "2 cambios subiendo" se entiende sin
     leer nada más, y cuando baja a cero el mensaje cambia a "Todo guardado" antes
     de irse: el cierre es lo que convierte la espera en confianza. */
  var pill = null, pillTexto = null, pillPunto = null, pillTimer = null;

  function estilos() {
    if (document.getElementById(ID_CSS)) return;
    var s = document.createElement('style');
    s.id = ID_CSS;
    s.textContent =
      '#' + ID_PILL + '{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));' +
      'z-index:10040;display:inline-flex;align-items:center;gap:.55rem;padding:.5rem .85rem;' +
      'border-radius:999px;background:var(--surface,#fff);color:var(--ink,#1B2330);' +
      'border:1px solid var(--line,#E4E9F0);pointer-events:none;' +
      "font-family:var(--f-ui,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif);" +
      'font-size:.8rem;font-weight:600;line-height:1;letter-spacing:-.01em;' +
      'box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 1px 2px rgba(16,24,40,.06),' +
      '0 10px 26px -14px rgba(16,24,40,.38);' +
      'opacity:0;transform:translateY(6px) scale(.96);' +
      'transition:opacity .24s cubic-bezier(.2,.8,.2,1),transform .24s cubic-bezier(.2,.8,.2,1)}' +
      '#' + ID_PILL + '.vg-on{opacity:1;transform:none}' +
      '[data-theme="carbon"] #' + ID_PILL + '{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),' +
      '0 1px 2px rgba(0,0,0,.44),0 12px 30px -14px rgba(0,0,0,.72)}' +

      /* El punto lleva el estado en el color Y en el movimiento: late mientras sube,
         se queda quieto al terminar. Quien no distingue los colores ve la diferencia
         igual, y el texto la dice entera. */
      '#' + ID_PILL + ' .vg-punto{width:.5rem;height:.5rem;border-radius:50%;flex:none;' +
      'background:var(--brand,#E10098);animation:vg-late 1.4s ease-in-out infinite}' +
      '#' + ID_PILL + '.vg-listo .vg-punto{background:var(--ok,#0E7A4F);animation:none}' +
      '#' + ID_PILL + '.vg-mal .vg-punto{background:var(--alert,#C81E3C);animation:none}' +
      '@keyframes vg-late{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}' +
      '@media (prefers-reduced-motion:reduce){#' + ID_PILL + '{transition:none}' +
      '#' + ID_PILL + ' .vg-punto{animation:none;opacity:.9}}' +
      '@media print{#' + ID_PILL + '{display:none}}' +

      /* ── Diálogo de salida ── */
      '#' + ID_DIALOGO + '{position:fixed;inset:0;z-index:10060;display:flex;align-items:center;' +
      'justify-content:center;padding:1rem;background:rgba(15,23,42,.45);opacity:0}' +
      '#' + ID_DIALOGO + ',#' + ID_DIALOGO + ' *,#' + ID_DIALOGO + ' *::before,#' + ID_DIALOGO + ' *::after' +
      '{box-sizing:border-box}' +
      '#' + ID_DIALOGO + ' .vg-card{width:min(28rem,100%);background:var(--surface,#fff);' +
      'color:var(--ink,#1B2330);border:1px solid var(--line,#E4E9F0);border-radius:16px;padding:1.35rem;' +
      'box-shadow:var(--sh-lg,0 30px 60px -24px rgba(27,35,48,.26));' +
      "font-family:var(--f-ui,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif)}" +
      '#' + ID_DIALOGO + ' .vg-t{margin:0;font-size:1rem;font-weight:700;letter-spacing:-.01em}' +
      '#' + ID_DIALOGO + ' .vg-d{margin:.45rem 0 0;font-size:.86rem;line-height:1.55;' +
      'color:var(--ink-soft,#5C6B7E)}' +
      '#' + ID_DIALOGO + ' .vg-lista{margin:.7rem 0 0;padding:0;list-style:none;font-size:.82rem;' +
      'color:var(--ink-soft,#5C6B7E);display:flex;flex-direction:column;gap:.25rem}' +
      '#' + ID_DIALOGO + ' .vg-lista li{display:flex;gap:.45rem;align-items:center}' +
      '#' + ID_DIALOGO + ' .vg-lista li::before{content:"";width:.35rem;height:.35rem;border-radius:50%;' +
      'background:var(--brand,#E10098);flex:none}' +
      '#' + ID_DIALOGO + ' .vg-acc{margin-top:1.1rem;display:flex;flex-wrap:wrap;gap:.5rem}' +
      '#' + ID_DIALOGO + ' .vg-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;' +
      'min-height:2.5rem;padding:.55rem 1rem;border-radius:10px;border:1px solid transparent;' +
      'font:inherit;font-size:.85rem;font-weight:600;line-height:1;cursor:pointer;' +
      'transition:transform .15s cubic-bezier(.32,.72,0,1),background .15s ease,color .15s ease,' +
      'border-color .15s ease}' +
      '#' + ID_DIALOGO + ' .vg-btn:hover{transform:translateY(-1px)}' +
      '#' + ID_DIALOGO + ' .vg-btn:active{transform:translateY(0) scale(.98)}' +
      '#' + ID_DIALOGO + ' .vg-btn:focus-visible{outline:none;box-shadow:var(--ring,0 0 0 4px rgba(225,0,152,.16))}' +
      '#' + ID_DIALOGO + ' .vg-btn[disabled]{opacity:.6;cursor:default;transform:none}' +
      '#' + ID_DIALOGO + ' .vg-p{background:var(--brand,#E10098);color:#fff}' +
      '#' + ID_DIALOGO + ' .vg-s{background:transparent;color:var(--ink,#1B2330);' +
      'border-color:var(--line,#E4E9F0)}' +
      '#' + ID_DIALOGO + ' .vg-s:hover{background:var(--surface-2,#F4F7FA)}' +
      '#' + ID_DIALOGO + ' .vg-riesgo{background:transparent;color:var(--alert,#C81E3C);' +
      'border-color:transparent}' +
      '#' + ID_DIALOGO + ' .vg-riesgo:hover{background:var(--alert-bg,#FDE8EC)}';
    (document.head || document.documentElement).appendChild(s);
  }

  function creaPastilla() {
    if (pill || !document.body) return pill;
    estilos();
    pill = document.createElement('div');
    pill.id = ID_PILL;
    pill.setAttribute('role', 'status');
    pill.setAttribute('aria-live', 'polite');
    pill.innerHTML = '<span class="vg-punto" aria-hidden="true"></span><span class="vg-tx"></span>';
    pillTexto = pill.querySelector('.vg-tx');
    pillPunto = pill.querySelector('.vg-punto');
    document.body.appendChild(pill);
    return pill;
  }

  function pastillaMuestra(texto, clase, ocultarEnMs) {
    if (!creaPastilla()) return;
    clearTimeout(pillTimer);
    pillTexto.textContent = texto;
    pill.classList.remove('vg-listo', 'vg-mal');
    if (clase) pill.classList.add(clase);
    void pill.offsetWidth;
    pill.classList.add('vg-on');
    if (ocultarEnMs) pillTimer = setTimeout(pastillaOculta, ocultarEnMs);
  }

  function pastillaOculta() {
    clearTimeout(pillTimer);
    if (pill) pill.classList.remove('vg-on');
  }

  function pastillaMensaje(texto, tipo) {
    pastillaMuestra(texto, tipo === 'error' ? 'vg-mal' : 'vg-listo', tipo === 'error' ? 6000 : 3200);
  }

  /** Único sitio que decide qué dice la pastilla ahora mismo. */
  function pinta() {
    if (pendientes > 0) {
      pastillaMuestra(pendientes === 1 ? 'Guardando un cambio…' : 'Guardando ' + pendientes + ' cambios…', '');
      return;
    }
    if (fallidas > 0) { pastillaMuestra('Hay cambios sin guardar', 'vg-mal', 8000); return; }
    // El cierre solo tiene sentido si hubo algo que cerrar: la pastilla nunca aparece
    // sola para decir que no pasa nada.
    if (pill && pill.classList.contains('vg-on')) pastillaMuestra('Todo guardado', 'vg-listo', 2200);
  }

  function cambio() {
    pinta();
    oyentes.forEach(function (cb) { try { cb(pendientes, fallidas); } catch (e) {} });
    if (pendientes === 0) {
      var lista = esperandoVacio; esperandoVacio = [];
      lista.forEach(function (r) { try { r(); } catch (e) {} });
    }
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     COLA
     ═══════════════════════════════════════════════════════════════════════════
     Una cola por `clave`. Dentro de una clave las tareas van en orden estricto: dos
     ediciones seguidas del mismo campo no pueden llegar al revés y dejar guardado el
     valor viejo, que es el bug clásico del guardado en segundo plano. Entre claves
     distintas sí hay paralelismo, acotado para no ahogar la cuota de Apps Script. */

  function cola(clave) {
    if (!colas[clave]) colas[clave] = { tareas: [], corriendo: false };
    return colas[clave];
  }

  function haySitio() { return enVuelo < MAX_PARALELO; }

  /** Arranca todas las colas que puedan avanzar. */
  function bombea() {
    Object.keys(colas).forEach(function (clave) {
      var c = colas[clave];
      if (!c) return;
      if (!c.corriendo && c.tareas.length && haySitio()) despacha(clave);
      if (!c.corriendo && !c.tareas.length) delete colas[clave];
    });
  }

  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function llamaServidor(t) {
    if (!(window.AppRun && AppRun.call)) {
      return Promise.reject(new Error('El sistema de llamadas no está disponible.'));
    }
    // `key` propia: la deduplicación de AppRun fusiona llamadas iguales en vuelo, y dos
    // guardados idénticos a propósito (marcar y desmarcar y volver a marcar) no deben
    // convertirse en uno solo. `busy:false`: esto pasa por detrás, no es una espera.
    return AppRun.call(t.fn, t.args, { key: 'guardado#' + t.id + '#' + t.intento, busy: false });
  }

  /** ¿La respuesta del servidor cuenta como "guardado"? */
  function aceptada(t, r) {
    if (typeof t.valida === 'function') return !!t.valida(r);
    if (r && typeof r === 'object' && r.success === false) return false;
    return true;
  }

  function mensajeDe(r, error) {
    if (r && typeof r === 'object' && (r.message || r.error)) return String(r.message || r.error);
    if (error && error.message) return String(error.message);
    return 'No se pudo guardar. Vuelve a intentarlo.';
  }

  function despacha(clave) {
    var c = colas[clave];
    if (!c || c.corriendo) return;
    var t = c.tareas[0];
    if (!t) { c.corriendo = false; return; }

    c.corriendo = true;
    enVuelo++;

    var siguiente = function () {
      c.corriendo = false;
      enVuelo = Math.max(0, enVuelo - 1);
      bombea();
    };

    var termina = function (ok, respuesta, error) {
      c.tareas.shift();
      pendientes = Math.max(0, pendientes - 1);

      if (ok) {
        if (!t.silencioso) avisa(t.hecho, 'ok');
        if (t.alLograr) { try { t.alLograr(respuesta); } catch (e) { console.error(e); } }
        if (t._resolver) t._resolver(respuesta);
      } else {
        fallidas++;
        // Deshacer antes de avisar: el asesor lee el aviso mirando la pantalla, y la
        // pantalla ya tiene que estar diciendo la verdad cuando lo lea.
        if (t.revertir) { try { t.revertir(error || respuesta); } catch (e) { console.error(e); } }
        avisa(mensajeDe(respuesta, error), 'error');
        if (t.alFallar) { try { t.alFallar(error || respuesta); } catch (e) { console.error(e); } }
        if (t._rechazar) t._rechazar(error || new Error(mensajeDe(respuesta, null)));
      }

      cambio();
      siguiente();
    };

    llamaServidor(t).then(function (r) {
      if (aceptada(t, r)) { termina(true, r, null); return; }
      // El servidor CONTESTÓ que no ("no tienes permiso", "ese correo no existe").
      // Repetirlo va a dar exactamente lo mismo: no se reintenta.
      termina(false, r, null);
    }, function (err) {
      // Fallo de transporte. Solo aquí tiene sentido volver a intentar, y solo si la
      // llamada es idempotente (lo declara quien la encola).
      if (t.intento < t.reintentos) {
        t.intento++;
        var demora = ESPERA_BASE_MS * Math.pow(2, t.intento - 1) * (0.75 + Math.random() * 0.5);
        // El sitio se suelta ANTES de la espera: si no, una cola que reintenta con
        // treinta segundos de backoff deja a las demás detenidas sin estar haciendo
        // nada. El ruido del backoff evita que varios reintentos caigan a la vez.
        siguiente();
        espera(demora).then(function () { despacha(clave); });
        return;
      }
      termina(false, null, err);
    });
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     API
     ═══════════════════════════════════════════════════════════════════════════ */

  /**
   * Encola un guardado y pinta el cambio de inmediato.
   *
   * @param {object} op
   * @param {string} op.fn         Función del servidor.
   * @param {Array=} op.args       Sus argumentos.
   * @param {string=} op.clave     Cola. Por omisión, una por función: lo correcto casi
   *   siempre es afinarla al objeto ('miembro:'+correo), para que editar a dos personas
   *   a la vez no se ponga en fila india.
   * @param {string=} op.etiqueta  Qué está pasando ('Guardando el rol').
   * @param {string=} op.hecho     Qué se anuncia al terminar ('Rol actualizado').
   * @param {function=} op.optimista  Pinta el cambio. Corre YA, sincrónico.
   * @param {function=} op.revertir   Deshace lo pintado si el guardado falla.
   * @param {function=} op.valida     (respuesta) => bool. Por omisión, `success !== false`.
   * @param {function=} op.alLograr   (respuesta)
   * @param {function=} op.alFallar   (error|respuesta)
   * @param {number=} op.reintentos   Solo para llamadas idempotentes. Crear algo → 0.
   * @param {boolean=} op.silencioso  No anuncia al terminar (cambios menudos y continuos).
   * @return {Promise} Resuelve con la respuesta del servidor; rechaza si no se guardó.
   */
  function guardar(op) {
    op = op || {};
    var t = {
      id: ++secuencia,
      fn: op.fn,
      args: op.args || [],
      clave: op.clave || ('fn:' + op.fn),
      etiqueta: op.etiqueta || 'Guardando',
      hecho: op.hecho || 'Cambios guardados',
      optimista: op.optimista,
      revertir: op.revertir,
      valida: op.valida,
      alLograr: op.alLograr,
      alFallar: op.alFallar,
      silencioso: op.silencioso === true,
      reintentos: (typeof op.reintentos === 'number') ? Math.max(0, op.reintentos) : REINTENTOS_POR_OMISION,
      intento: 0
    };

    if (!t.fn) return Promise.reject(new Error('Falta el nombre de la función del servidor.'));

    // Lo optimista corre antes de encolar: la pantalla cambia en el mismo fotograma en
    // que se soltó el botón, que es de lo que va todo esto.
    if (t.optimista) { try { t.optimista(); } catch (e) { console.error(e); } }

    var p = new Promise(function (res, rej) { t._resolver = res; t._rechazar = rej; });
    // Nadie está obligado a esperar esta promesa —ese es el punto—, así que se le pone
    // un manejador vacío: sin él, un guardado fallido sale por consola como un rechazo
    // sin capturar y parece un error del sistema.
    p.catch(function () {});

    cola(t.clave).tareas.push(t);
    pendientes++;
    cambio();
    bombea();
    return p;
  }

  /** Promesa que resuelve cuando no queda nada por subir. */
  function esperar() {
    if (pendientes === 0) return Promise.resolve();
    return new Promise(function (res) { esperandoVacio.push(res); });
  }

  /** Lo que está subiendo ahora mismo, en cristiano, sin repetidos. */
  function resumen() {
    var vistos = Object.create(null);
    var lista = [];
    Object.keys(colas).forEach(function (k) {
      (colas[k].tareas || []).forEach(function (t) {
        if (vistos[t.etiqueta]) return;
        vistos[t.etiqueta] = true;
        lista.push(t.etiqueta);
      });
    });
    return lista;
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     GUARDIA DE SALIDA
     ═══════════════════════════════════════════════════════════════════════════
     Tres puertas por las que se puede escapar una pantalla con cambios en vuelo, y
     las tres se tapan aquí para que ninguna pantalla tenga que acordarse:

       1. AppUrl.go(...)  — el 95 % de la navegación de la app.
       2. Un <a target="_top"> — el Portal navega así.
       3. Recargar o cerrar la pestaña — beforeunload, que es lo único que hay.

     Las dos primeras son nuestras y por eso admiten un diálogo de verdad, con la
     opción que casi siempre se quiere: esperar dos segundos y salir. La tercera la
     controla el navegador y solo deja un aviso genérico; se pone igual, porque un
     aviso feo es infinitamente mejor que perder el trabajo en silencio. */

  var dialogoAbierto = false;

  function cierraDialogo() {
    var d = document.getElementById(ID_DIALOGO);
    if (!d) { dialogoAbierto = false; return; }
    var quitar = function () { if (d.parentNode) d.parentNode.removeChild(d); dialogoAbierto = false; };
    if (conGsap()) gsap.to(d, { opacity: 0, duration: .16, ease: 'power1.in', onComplete: quitar });
    else quitar();
  }

  /**
   * Pregunta qué hacer con los cambios en vuelo.
   * @param {function} alSalir  Se llama cuando el asesor decide continuar.
   */
  function preguntaSalida(alSalir) {
    if (dialogoAbierto) return;
    estilos();
    dialogoAbierto = true;

    var lista = resumen();
    var d = document.createElement('div');
    d.id = ID_DIALOGO;
    d.setAttribute('role', 'alertdialog');
    d.setAttribute('aria-modal', 'true');
    d.setAttribute('aria-labelledby', 'vgTitulo');
    d.innerHTML =
      '<div class="vg-card">' +
        '<h2 class="vg-t" id="vgTitulo">Todavía se están guardando tus cambios</h2>' +
        '<p class="vg-d">' + (pendientes === 1 ? 'Falta un cambio por subir.'
                                               : 'Faltan ' + pendientes + ' cambios por subir.') +
          ' Si sales ahora, puede que no se guarden.</p>' +
        (lista.length ? '<ul class="vg-lista">' + lista.map(function (x) {
            return '<li>' + esc(x) + '</li>';
          }).join('') + '</ul>' : '') +
        '<div class="vg-acc">' +
          '<button type="button" class="vg-btn vg-p" data-vg="esperar">Esperar y continuar</button>' +
          '<button type="button" class="vg-btn vg-s" data-vg="quedarme">Quedarme aquí</button>' +
          '<button type="button" class="vg-btn vg-riesgo" data-vg="salir">Salir sin esperar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(d);

    var card = d.querySelector('.vg-card');
    if (conGsap()) {
      gsap.fromTo(d, { opacity: 0 }, { opacity: 1, duration: .18, ease: 'power1.out' });
      gsap.fromTo(card, { opacity: 0, y: 18, scale: .97 },
        { opacity: 1, y: 0, scale: 1, duration: .3, ease: 'power3.out', clearProps: 'transform' });
    } else { d.style.opacity = '1'; }

    var btnEsperar = d.querySelector('[data-vg="esperar"]');
    try { btnEsperar.focus({ preventScroll: true }); } catch (e) {}

    d.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-vg]') : null;
      if (!b) return;
      var accion = b.getAttribute('data-vg');

      if (accion === 'quedarme') { cierraDialogo(); return; }

      if (accion === 'salir') { cierraDialogo(); alSalir(); return; }

      // Esperar: el botón se queda puesto contando, para que la espera no parezca
      // que el sistema se colgó. Al vaciarse la cola, se sale solo.
      b.disabled = true;
      var otro = d.querySelector('[data-vg="quedarme"]');
      if (otro) otro.disabled = true;
      var refresca = function (n) { b.textContent = n ? 'Guardando… (' + n + ')' : 'Listo, saliendo…'; };
      refresca(pendientes);
      var quita = alCambiar(refresca);
      esperar().then(function () {
        quita();
        cierraDialogo();
        alSalir();
      });
    });

    d.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); cierraDialogo(); }
    });
  }

  /**
   * ¿Se puede navegar ya? Si hay cambios en vuelo, abre el diálogo y devuelve false;
   * la navegación la reanuda el propio diálogo.
   */
  function permiteSalir(alSalir) {
    if (pendientes === 0) return true;
    preguntaSalida(alSalir);
    return false;
  }

  function alCambiar(cb) {
    oyentes.push(cb);
    return function () {
      var i = oyentes.indexOf(cb);
      if (i !== -1) oyentes.splice(i, 1);
    };
  }

  /**
   * Envuelve AppUrl.go para que TODA la navegación de la app pase por la guardia.
   *
   * Se reenvían los argumentos con `arguments` y no uno por uno: AppUrl.go ya admite
   * un tercero (el ancla) y mañana puede admitir un cuarto. Una envoltura que enumera
   * los parámetros se convierte en el sitio donde se pierden en silencio —el enlace
   * seguiría llevando a la pantalla correcta, solo que sin bajar al apartado, y eso
   * no se ve como un fallo de esta función sino como un ancla que "a veces no va".
   */
  function protegeNavegacion() {
    if (!window.AppUrl || AppUrl.__guardado) return;
    var original = AppUrl.go.bind(AppUrl);
    AppUrl.go = function () {
      var args = arguments;
      var seguir = function () { return original.apply(null, args); };
      if (permiteSalir(seguir)) return seguir();
      return true;   // no es un fallo: la navegación está pendiente de una decisión
    };
    AppUrl.__guardado = true;
  }

  /** Enlaces que sacan de la pantalla (el Portal navega con <a target="_top">). */
  function protegeEnlaces() {
    document.addEventListener('click', function (e) {
      if (pendientes === 0) return;
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      // Solo los que se llevan ESTA pantalla. target="_blank" abre otra pestaña y deja
      // la subida donde está, así que no hay nada que avisar.
      if (a.target !== '_top' && a.target !== '_parent') return;
      if ((a.getAttribute('href') || '').charAt(0) === '#') return;
      e.preventDefault();
      var destino = a.href;
      var objetivo = a.target;
      preguntaSalida(function () {
        try {
          if (objetivo === '_top' && window.top) window.top.location.href = destino;
          else window.location.href = destino;
        } catch (err) { window.location.href = destino; }
      });
    }, true);
  }

  function protegeRecarga() {
    window.addEventListener('beforeunload', function (e) {
      if (pendientes === 0) return;
      e.preventDefault();
      e.returnValue = '';       // el texto lo pone el navegador; el nuestro se ignora
      return '';
    });
  }

  function arranca() {
    protegeNavegacion();
    protegeEnlaces();
    protegeRecarga();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();

  window.AppGuardado = {
    guardar: guardar,
    esperar: esperar,
    alCambiar: alCambiar,
    permiteSalir: permiteSalir,
    resumen: resumen,
    get pendientes() { return pendientes; },
    get fallidas() { return fallidas; },
    hayPendientes: function () { return pendientes > 0; },
    /** Olvida los fallos acumulados (la pantalla ya los resolvió o los reintentó). */
    limpiarFallidas: function () { fallidas = 0; cambio(); }
  };
})();
</script>
