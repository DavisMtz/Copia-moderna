name: Publicar en Apps Script

# Cada push a `main` que toque `Carpeta del proyecto/` empuja ese codigo al
# proyecto de Apps Script indicado en `.clasp.json`. Es el mismo `clasp push`
# que se haria a mano, ejecutado por GitHub en lugar de por ti.
#
# Da igual de donde venga el push: el hook del escritorio y un commit escrito
# en github.com desde el movil son lo mismo para este flujo. Ese es el punto:
# publicar deja de depender de estar frente a la PC.
#
# Requisito: el secreto CLASPRC_JSON del repositorio.
# Como generarlo: Documentacion/10_Sincronizacion_Apps_Script.md
#
# SIN ese secreto el flujo FALLA en rojo, y es intencionado. Hasta ahora se
# saltaba la publicacion y terminaba en verde, asi que siete merges seguidos
# lucieron su tick verde sin haber subido una sola linea a Google. Verde tiene
# que significar "esto ya esta en Apps Script"; si no puede publicar, lo dice.

on:
  push:
    branches: [main]
    paths:
      - 'Carpeta del proyecto/**'
      - '.github/workflows/apps-script-sync.yml'
  workflow_dispatch:

# Solo lectura del repo: este flujo no escribe commits, solo lee y sube a Google.
permissions:
  contents: read

# Dos pushes seguidos no deben empujar a la vez sobre el mismo proyecto. El
# segundo espera; no se cancela, porque cancelar a media subida deja el
# proyecto remoto con unos archivos nuevos y otros viejos.
concurrency:
  group: apps-script-sync
  cancel-in-progress: false

jobs:
  publicar:
    name: clasp push
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Version fija a proposito. clasp cambio el formato de credenciales y el
      # nombre de varios comandos entre la 2.x y la 3.x; si esto flotara en
      # `latest`, un dia el flujo se rompe solo sin que nadie haya tocado nada.
      - name: Instalar clasp
        run: npm install --global @google/clasp@3.3.0

      - name: Escribir las credenciales
        id: cred
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "${CLASPRC_JSON}" ]; then
            echo "hay=no" >> "${GITHUB_OUTPUT}"
            # ROJO, no verde. Antes esto era `exit 0` con un ::warning:: y el job
            # terminaba en success: `clasp push` salia SKIPPED y el check quedaba
            # en verde igual. Un tick verde que significa "no se publico nada" es
            # peor que no tener flujo, porque se lee como "ya esta en produccion"
            # y solo se descubre lo contrario cuando alguien nota que la pantalla
            # no cambio. Fallar aqui es ruidoso a proposito: mientras el secreto
            # no exista, cada merge recuerda que hay que publicar a mano.
            echo "::error::Sin CLASPRC_JSON: este merge NO se ha publicado en Apps Script."
            echo "El codigo esta en main pero NO ha llegado a Google. Dos salidas:"
            echo "  1. Publicar a mano, sin secretos:  ./scripts/publicar.sh"
            echo "  2. Dar de alta el secreto CLASPRC_JSON y que esto lo haga solo:"
            echo "     Documentacion/10_Sincronizacion_Apps_Script.md §2"
            exit 1
          fi
          echo "hay=si" >> "${GITHUB_OUTPUT}"
          umask 077
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          # Si el secreto se pego cortado, el error de clasp es incomprensible.
          # Este parse falla aqui, con un mensaje que si dice que pasa.
          node -e 'JSON.parse(require("fs").readFileSync(process.env.HOME + "/.clasprc.json", "utf8"))' \
            || { echo "::error::CLASPRC_JSON no es un JSON valido: revisa que se pegara el archivo completo."; exit 1; }

      - name: Comprobar la sesion de Google
        if: steps.cred.outputs.hay == 'si'
        run: clasp show-authorized-user

      - name: Subir el codigo
        if: steps.cred.outputs.hay == 'si'
        working-directory: 'Carpeta del proyecto'
        run: clasp push --force

      # Opcional. `clasp push` deja el codigo nuevo en el proyecto y en la URL
      # /dev al instante, pero la URL /exec de produccion sigue sirviendo la
      # version congelada del despliegue. Si defines el secreto
      # APPS_SCRIPT_DEPLOYMENT_ID, este paso crea una version nueva y apunta
      # ese despliegue a ella. Si no lo defines, el paso se salta y lo dice.
      - name: Actualizar el despliegue de produccion
        if: steps.cred.outputs.hay == 'si'
        working-directory: 'Carpeta del proyecto'
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "${DEPLOYMENT_ID}" ]; then
            echo "Sin APPS_SCRIPT_DEPLOYMENT_ID: la URL /dev ya tiene el codigo nuevo;"
            echo "la de produccion (/exec) sigue en su version anterior."
            exit 0
          fi
          clasp deploy --deploymentId "${DEPLOYMENT_ID}" --description "main ${GITHUB_SHA:0:7}"

      - name: Resumen
        if: always()
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          ESTADO: ${{ job.status }}
          HAY_CRED: ${{ steps.cred.outputs.hay }}
        run: |
          {
            echo "### Publicacion en Apps Script"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            if [ "${HAY_CRED}" != "si" ]; then
              echo "- Resultado: **NO se publico** (este repositorio no tiene el secreto \`CLASPRC_JSON\`)"
              echo ""
              echo "El codigo esta en \`main\` pero **no ha llegado a Apps Script**. Dos formas de publicarlo:"
              echo ""
              echo "1. **Desde tu equipo, sin secretos** — \`./scripts/publicar.sh\`."
              echo "   Para que ocurra solo en cada \`git pull\` de main: \`./scripts/instalar-hook.sh\`."
              echo "2. **Desde aqui** — da de alta \`CLASPRC_JSON\` siguiendo"
              echo "   \`Documentacion/10_Sincronizacion_Apps_Script.md\` §2."
              exit 0
            fi
            echo "- Resultado: **${ESTADO}**"
            if [ -n "${DEPLOYMENT_ID}" ]; then
              echo "- Despliegue de produccion: actualizado"
            else
              echo "- Despliegue de produccion: sin tocar (falta APPS_SCRIPT_DEPLOYMENT_ID)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # El runner es efimero, pero borrar el token igual es gratis y evita
      # que quede en cualquier artefacto o cache que se anada despues.
      - name: Borrar las credenciales
        if: always()
        run: rm -f "${HOME}/.clasprc.json"
