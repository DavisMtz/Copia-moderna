<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Cotizaciones Ventel</title>
    <?!= include('app_theme'); ?>
<!-- Utilidades Tailwind compiladas: va al final del head, igual que la hoja que el CDN inyectaba. -->
<?!= include('app_tailwind'); ?>
</head>
<body class="h-full">
    <div class="app-aurora"></div>

    <main id="main-content" class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Estado de operación: si algún sistema está caído se dice aquí, antes que nada.
             Lo rellena AppOperacion; si no hay incidencias, no ocupa espacio. -->
        <div id="operacion-avisos"></div>

        <!-- Cabecera -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight" data-animate>
                Sistema de Cotizaciones Ventel
            </h1>
            <p class="text-slate-600 mt-1" data-animate>
                Gestiona y da seguimiento a todas tus cotizaciones en un solo lugar.
            </p>
        </header>

        <!-- Acciones -->
        <section class="mb-8 p-6 v-card" data-animate>
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center gap-3 flex-wrap">
                    <button id="newQuoteButton" class="v-btn v-btn-primary">
                        <span class="button-icon"><span class="w-5 h-5 block" data-icon="plus"></span></span>
                        <span class="button-text">Nueva Cotización</span>
                    </button>
                    <button id="sendEmailButton" class="v-btn v-btn-dark">
                        <span class="button-icon"><span class="w-5 h-5 block" data-icon="mail"></span></span>
                        <span class="button-text">Enviar Correo</span>
                    </button>
                </div>
                <div class="flex-grow md:max-w-sm">
                    <form id="searchForm" class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                            <span class="w-5 h-5 block text-slate-400" data-icon="search"></span>
                        </div>
                        <input type="search" id="searchInput" name="search" placeholder="Busca por folio o cliente · Enter busca en todo el sistema" class="v-input" style="padding-left: 2.5rem;">
                    </form>
                </div>
            </div>
        </section>

        <!-- Resumen proactivo + estado de sincronización -->
        <section class="mb-4 flex flex-wrap items-center justify-between gap-3" data-animate>
            <div class="flex items-center gap-2 flex-wrap">
                <span class="v-badge v-badge-pink">Tus cotizaciones: <strong id="stat-total" class="ml-1">0</strong></span>
                <span class="v-badge v-badge-green">Enviadas: <strong id="stat-sent" class="ml-1">0</strong></span>
                <span class="v-badge v-badge-yellow">Por enviar: <strong id="stat-pending" class="ml-1">0</strong></span>
                <span class="v-badge v-badge-blue">Este mes: <strong id="stat-month" class="ml-1">0</strong></span>
            </div>
            <div class="flex items-center gap-2">
                <span id="sync-status" class="text-xs text-slate-500"></span>
                <button id="refreshButton" class="v-btn v-btn-ghost v-btn-sm" title="Buscar la información más reciente">
                    <span class="button-icon"><span class="w-4 h-4 block" data-icon="refresh"></span></span>
                    <span class="button-text">Actualizar</span>
                </button>
            </div>
        </section>

        <!-- Tabla de Cotizaciones -->
        <section data-animate>
            <div class="v-card overflow-hidden">
                <div class="v-table-wrap">
                    <table class="v-table">
                        <thead>
                            <tr>
                                <th>Folio</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estatus</th><th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="quotes-table-body"></tbody>
                    </table>
                </div>
                <div id="table-placeholder" class="text-center p-12 text-slate-500"></div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="text-center mt-12" data-animate>
            <p class="text-sm text-slate-500">¿Necesitas ayuda? <button type="button" data-support-link class="font-medium text-brand-pink hover:underline">Contacta al equipo de Ventel</button></p>
        </footer>
    </main>

    <script>
        window.__APP__ = { baseUrl: <?!= JSON.stringify(baseUrl) ?>, q: <?!= JSON.stringify(q) ?> };
    </script>
    <?!= include('app_core'); ?>
    <?!= include('app_icons'); ?>
    <?!= include('app_estatus'); ?>
    <?!= include('app_motion'); ?>
    <?!= include('app_support'); ?>
    <?!= include('app_shell'); ?>
    <?!= include('app_onboarding'); ?>
    <?!= include('LoaderPartial'); ?>
    <?!= include('app_operacion'); ?>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (!requireSession()) return;

        // Marco lateral compartido con el Portal (envuelve el <main> y aporta sesión/tema).
        AppShell.mount({ active: 'dashboard', title: 'Panel' });

        /* Recorrido guiado del Panel. Se registra después de montar la barra para que
           los pasos que apuntan al menú encuentren el menú ya pintado. */
        if (window.AppOnboarding) AppOnboarding.auto({
          pantalla: 'dashboard',
          version: 1,
          retraso: 700,
          pasos: [
            {
              titulo: 'Tu panel de cotizaciones',
              texto: 'Aquí vive todo lo que has cotizado: qué se envió, qué falta por enviar y en qué ' +
                     'estatus va cada folio.<br><br>Cinco paradas y te dejo trabajar.'
            },
            {
              sel: '#newQuoteButton',
              pos: 'abajo',
              titulo: 'Empezar una cotización',
              texto: 'Este es el botón del día a día. Abre la pantalla de cotización con tus datos ya puestos; ' +
                     'tú solo agregas cliente y productos.'
            },
            {
              sel: '#searchInput',
              pos: 'abajo',
              titulo: 'Encontrar un folio',
              texto: 'Escribe el <b>folio</b> (LVP-…) o el <b>nombre del cliente</b> y la tabla se filtra al momento.' +
                     '<br><br>Con <b>Enter</b> la búsqueda sale de tu lista y va a todo el sistema: útil cuando ' +
                     'el folio lo hizo otra persona del equipo.'
            },
            {
              sel: '#stat-total',
              pos: 'abajo',
              relleno: 12,
              titulo: 'Tus números de un vistazo',
              texto: 'Cuántas llevas, cuántas se enviaron y cuántas siguen <b>por enviar</b>. ' +
                     'Esa última es la que conviene mirar antes de terminar el día.'
            },
            {
              sel: '.v-table',
              pos: 'arriba',
              titulo: 'La tabla manda',
              texto: 'Cada fila tiene sus acciones al final: ver, enviar o duplicar. El <b>estatus</b> te dice ' +
                     'si una cotización está esperando algo de ti.<br><br>' +
                     'El botón <b>Ver el tutorial</b>, abajo en la barra lateral, repite este recorrido.'
            }
          ]
        });

        // El loader de marca cubre el arranque; se retira en cuanto la pantalla está lista.
        if (window.VentelLoader) VentelLoader.hide();

        const mainContent = document.getElementById('main-content');
        const userNameElement = document.getElementById('user-name');
        const tableBody = document.getElementById('quotes-table-body');
        const tablePlaceholder = document.getElementById('table-placeholder');
        const quoteTable = tableBody.closest('table');
        const newQuoteButton = document.getElementById('newQuoteButton');
        const sendEmailButton = document.getElementById('sendEmailButton');
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');

        const currentUserEmail = AppSession.userEmail;
        userNameElement.textContent = AppSession.firstName;

        const setUIInteractionState = (isLocked) => {
            const interactiveElements = [newQuoteButton, sendEmailButton, searchInput, ...document.querySelectorAll('.v-row-action')];
            interactiveElements.forEach(el => { if (el) el.disabled = isLocked; });
            mainContent.style.pointerEvents = isLocked ? 'none' : '';
        };

        const setButtonLoadingState = (button, isLoading) => {
            if (!button) return;
            const textEl = button.querySelector('.button-text');
            const iconEl = button.querySelector('.button-icon');
            if (isLoading) {
                if (textEl && !button.dataset.originalText) button.dataset.originalText = textEl.textContent;
                if (iconEl && !button.dataset.originalIcon) button.dataset.originalIcon = iconEl.innerHTML;
                if (textEl) textEl.textContent = 'Cargando...';
                if (iconEl) iconEl.innerHTML = '<div class="v-spinner"></div>';
            } else {
                if (textEl && button.dataset.originalText) textEl.textContent = button.dataset.originalText;
                if (iconEl && button.dataset.originalIcon) iconEl.innerHTML = button.dataset.originalIcon;
            }
        };

        const navigateToPage = (page, params = {}, buttonElement = null) => {
            setUIInteractionState(true);
            if (buttonElement) setButtonLoadingState(buttonElement, true);
            if (!AppUrl.go(page, params)) {
                setUIInteractionState(false);
                if (buttonElement) setButtonLoadingState(buttonElement, false);
            }
        };

        window.navigateToQuoteView = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');
            AppSession.selectedFolio = folio;   // respaldo si el parámetro no llega (ver app_core)
            navigateToPage('consulta_cotizacion', { folio: folio }, this);
        };

        window.navigateToQuoteEdit = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');
            navigateToPage('cotizacion', { folio: folio, action: 'edit' }, this);
        };

        window.navigateToResend = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');
            navigateToPage('correoventel', { folio: folio }, this);
        };

        // Copia un deep-link a la consulta de la cotización (para compartir por chat/correo).
        window.copyQuoteLink = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');
            AppUrl.copyLink('consulta_cotizacion', { folio: folio }).then(ok => {
                AppMotion.toast(ok ? `Enlace de ${folio} copiado. Pégalo donde lo necesites.` : 'No se pudo copiar el enlace.', ok ? 'ok' : 'error');
            });
        };

        window.openQuoteInSheets = function (folio) {
            if (!folio) return AppMotion.toast('No pudimos identificar esa cotización. Actualiza la lista e inténtalo de nuevo.', 'error');

            const button = this;
            // La pestaña se abre aquí, durante el clic. Si se abriera al llegar la respuesta
            // del servidor, el navegador la bloquearía por ser un popup sin interacción.
            const tab = window.open('', '_blank');
            setButtonLoadingState(button, true);
            button.disabled = true;

            google.script.run
                .withSuccessHandler(response => {
                    setButtonLoadingState(button, false);
                    button.disabled = false;
                    if (response && response.success) {
                        if (tab) {
                            tab.location.href = response.url;
                        } else {
                            AppMotion.toast('El navegador bloqueó la pestaña nueva. Permite las ventanas emergentes para este sitio e intenta de nuevo.', 'warn');
                        }
                    } else {
                        if (tab) tab.close();
                        AppMotion.toast((response && response.message) || 'No se pudo abrir el documento.', 'error');
                    }
                })
                .withFailureHandler(error => {
                    setButtonLoadingState(button, false);
                    button.disabled = false;
                    if (tab) tab.close();
                    console.error('openQuoteInSheets:', error);
                    AppMotion.toast('No pudimos abrir el documento. Inténtalo de nuevo en un momento.', 'error');
                })
                .openQuoteInSheets(folio);
        };

        // --- Datos locales: las cotizaciones propias se guardan en caché para pintar
        //     la tabla al instante y se revalidan SIEMPRE contra el servidor. ---
        // Tolerancia a despliegues parciales: si el app_core cargado aún no trae
        // AppCache, la pantalla funciona igual, solo sin caché local.
        const AppCache = window.AppCache || { get: () => null, set: () => {}, remove: () => {}, ageLabel: () => '' };
        const AppBusy = window.AppBusy || { start: () => 0, done: () => {}, until: () => () => {} };
        const QUOTES_CACHE_KEY = 'quotes-' + currentUserEmail;
        const syncStatus = document.getElementById('sync-status');
        const refreshButton = document.getElementById('refreshButton');
        let myQuotes = []; // Última lista propia conocida (para filtrar sin red y calcular el resumen).

        const setSyncStatus = (text) => { if (syncStatus) syncStatus.textContent = text; };

        const updateStats = (quotes) => {
            const isSent = (q) => String(q.estatus || '').toLowerCase().includes('enviada');
            // El folio LVP-AAMMDD-XXXX codifica la fecha: el prefijo del mes es exacto.
            const now = new Date();
            const monthPrefix = 'LVP-' + String(now.getFullYear()).slice(-2) + String(now.getMonth() + 1).padStart(2, '0');
            const thisMonth = quotes.filter(q => String(q.folio || '').startsWith(monthPrefix)).length;
            document.getElementById('stat-total').textContent = quotes.length;
            document.getElementById('stat-sent').textContent = quotes.filter(isSent).length;
            document.getElementById('stat-pending').textContent = quotes.filter(q => !isSent(q)).length;
            document.getElementById('stat-month').textContent = thisMonth;
        };

        const loadUserQuotes = (searchTerm = null, forzarRecarga = false) => {
            const isOwnList = !searchTerm;

            // 1. Primer pintado instantáneo desde la caché local (solo para la lista propia).
            const cached = isOwnList ? AppCache.get(QUOTES_CACHE_KEY) : null;
            if (cached && Array.isArray(cached.data)) {
                myQuotes = cached.data;
                displayQuotes(myQuotes);
                updateStats(myQuotes);
                setSyncStatus('Datos guardados ' + AppCache.ageLabel(cached.at) + ' · actualizando...');
            } else {
                const loadingMessage = searchTerm ? 'Buscando en todo el sistema...' : 'Cargando tus cotizaciones...';
                updateTablePlaceholder(`<div class="flex items-center justify-center gap-3 text-slate-500"><div class="v-spinner"></div> ${loadingMessage}</div>`);
                setSyncStatus('');
            }

            // 2. Revalidación contra el servidor (siempre).
            // El indicador de la esquina dice que esto sigue en marcha: con la tabla
            // ya pintada desde la caché, es la única señal de que lo que se está
            // leyendo todavía se está comprobando.
            const finBusy = AppBusy.until(searchTerm ? 'Buscando' : 'Consultando');
            google.script.run
                .withSuccessHandler(response => {
                    finBusy();
                    if (!response.success && response.message) AppMotion.toast(response.message, 'error');
                    const quotes = response.success ? (response.quotes || []) : [];
                    if (isOwnList) {
                        myQuotes = quotes;
                        AppCache.set(QUOTES_CACHE_KEY, quotes);
                        updateStats(quotes);
                        setSyncStatus('Actualizado ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
                        // Si el usuario ya está filtrando localmente, se respeta su filtro.
                        const term = searchInput.value.trim();
                        if (term) { filterLocal(term); return; }
                    } else {
                        setSyncStatus('Resultados de búsqueda global');
                    }
                    displayQuotes(quotes);
                })
                .withFailureHandler(error => {
                    finBusy();
                    console.error("Fallo en la llamada a getQuotesForUser:", error);
                    if (cached) {
                        setSyncStatus('Sin conexión · mostrando datos guardados ' + AppCache.ageLabel(cached.at));
                        AppMotion.toast('No pudimos conectarnos: te mostramos la última información guardada.', 'warn');
                    } else {
                        updateTablePlaceholder("No pudimos cargar tus cotizaciones. Revisa tu conexión e inténtalo de nuevo.");
                    }
                })
                // El tercer argumento salta la caché del servidor: "Actualizar" debe
                // significar releer la hoja, no repetir lo que ya estaba guardado.
                .getQuotesForUser(currentUserEmail, searchTerm, forzarRecarga === true);
        };

        // --- Búsqueda tolerante a errores (fuzzy) para el filtro instantáneo local ---
        // Mismo criterio que fuzzyScore_ en Code.gs: sin acentos, sin importar
        // mayúsculas y con tolerancia a pequeños errores de tipeo.
        const fzNorm = (s) => String(s == null ? '' : s)
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .toLowerCase().replace(/\s+/g, ' ').trim();
        const fzLev = (a, b) => {
            if (a === b) return 0;
            const al = a.length, bl = b.length;
            if (!al) return bl;
            if (!bl) return al;
            let prev = Array.from({ length: bl + 1 }, (_, j) => j);
            for (let i = 1; i <= al; i++) {
                const cur = [i], ca = a.charCodeAt(i - 1);
                for (let j = 1; j <= bl; j++) {
                    const cost = ca === b.charCodeAt(j - 1) ? 0 : 1;
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
                }
                prev = cur;
            }
            return prev[bl];
        };
        const fzTol = (len) => len <= 3 ? 0 : len <= 5 ? 1 : len <= 8 ? 2 : 3;
        const fzMatches = (text, term) => {
            const q = fzNorm(term);
            if (!q) return true;
            const t = fzNorm(text);
            if (!t) return false;
            if (t.indexOf(q) !== -1) return true;
            const tTokens = t.split(' ').filter(Boolean);
            return q.split(' ').filter(Boolean).every(qt => tTokens.some(tt => {
                if (tt.indexOf(qt) !== -1) return true;
                const tol = fzTol(qt.length);
                if (tol === 0) return false;
                if (fzLev(qt, tt) <= tol) return true;
                return tt.length > qt.length && fzLev(qt, tt.substring(0, qt.length)) <= tol;
            }));
        };

        // Filtro instantáneo (sin red) sobre las cotizaciones propias ya cargadas.
        const filterLocal = (term) => {
            const filtered = myQuotes.filter(q =>
                fzMatches([q.folio, q.cliente, q.estatus].join(' '), term)
            );
            displayQuotes(filtered, 'Sin coincidencias entre tus cotizaciones. Presiona Enter para buscar en todo el sistema.');
        };

        /*
         * El catálogo de estatus vive en app_estatus.html, compartido con el panel de
         * supervisión y con la pantalla de revisión. Antes este archivo tenía su propio mapa
         * y pintaba "Aprobada" y "Enviada por Correo" del mismo verde: el asesor no podía
         * distinguir lo que ya salió al cliente de lo que solo está autorizado. Ahora cada
         * estado trae color, icono y palabra propios, y son idénticos en todas las pestañas.
         */

        const statusKey = AppEstatus.clave;

        // Los datos de una cotización los teclea un asesor y los ve cualquier otro desde
        // la búsqueda global: todo lo que entra a innerHTML pasa por escapeHtml, y lo que
        // va dentro de un onclick por escapeJsString (ambos viven en app_core).
        const esc = window.escapeHtml || ((s) => String(s == null ? '' : s));
        const escapeFolio = window.escapeJsString || ((folio) => String(folio || '').replace(/'/g, "\\'"));

        const displayQuotes = (quotes, emptyMessage = null) => {
            tableBody.innerHTML = '';
            if (quotes.length === 0) {
                const message = emptyMessage || (searchInput.value.trim() ? "No se encontraron cotizaciones para tu búsqueda." : "Aún no tienes cotizaciones. ¡Crea una nueva!");
                updateTablePlaceholder(message);
                return;
            }
            updateTablePlaceholder("");

            quotes.forEach(quote => {
                const row = document.createElement('tr');
                row.style.opacity = '0';
                const est = AppEstatus.info(quote.estatus, quote.revisionEstado);
                const folioJs = escapeFolio(quote.folio);
                // Filo de color en la primera celda: lo que sigue esperando revisión se
                // localiza bajando por la columna del folio, sin llegar a la de estatus.
                if (est.pendiente) row.className = 'v-fila-pendiente';
                else if (est.clave === 'rechazada') row.className = 'v-fila-rechazada';

                row.innerHTML = `
                    <td class="font-medium text-slate-900">${esc(quote.folio || 'N/A')}</td>
                    <td>${esc(quote.cliente || 'N/A')}</td>
                    <td>${esc(quote.fecha || 'N/A')}</td>
                    <td class="font-medium">${formatMoney(quote.total)}</td>
                    <td>${AppEstatus.badge(quote.estatus, quote.revisionEstado)}</td>
                    <td>
                        <div class="flex items-center justify-center gap-1 flex-wrap">
                            <button onclick="navigateToQuoteView.call(this, '${folioJs}')" title="Ver la cotización" class="v-row-action v-act-pink">
                                ${Icons.svg('eye')}
                                Ver
                            </button>
                            <button onclick="navigateToQuoteEdit.call(this, '${folioJs}')" title="Editar y volver a cotizar" class="v-row-action v-act-blue">
                                ${Icons.svg('pencil')}
                                Editar
                            </button>
                            <button onclick="navigateToResend.call(this, '${folioJs}')" title="Enviar o reenviar por correo" class="v-row-action v-act-slate">
                                ${Icons.svg('send')}
                                Correo
                            </button>
                            <button onclick="copyQuoteLink('${folioJs}')" title="Copiar enlace directo a esta cotización" class="v-row-action v-act-slate">
                                ${Icons.svg('link')}
                                Enlace
                            </button>
                            ${quote.formato === 'ccl_liverpool' ? `
                            <button onclick="openQuoteInSheets.call(this, '${folioJs}')" title="Abrir el formato CCL en Google Sheets" class="v-row-action v-act-green">
                                ${Icons.svg('document')}
                                Sheets
                            </button>` : ''}
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            AppMotion.staggerRows(tableBody.querySelectorAll('tr'));
        };

        const updateTablePlaceholder = (message) => {
            tablePlaceholder.innerHTML = message;
            const showPlaceholder = message !== "";
            tablePlaceholder.classList.toggle('hidden', !showPlaceholder);
            quoteTable.classList.toggle('hidden', showPlaceholder);
        };

        newQuoteButton.addEventListener('click', () => navigateToPage('cotizacion', {}, newQuoteButton));
        sendEmailButton.addEventListener('click', () => navigateToPage('correoventel', {}, sendEmailButton));

        // Enter = búsqueda global. Cada búsqueda vive en el panel que corresponde al rol:
        // un usuario avanzado es llevado al panel de supervisión con su búsqueda aplicada
        // (ahí tiene filtros, fechas y CSV); el usuario normal busca aquí mismo.
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const term = searchInput.value.trim();
            if (!term) return;
            if (AppSession.can('supervision')) { AppUrl.go('inicio_avanzado', { q: term }); return; }
            loadUserQuotes(term);
        });

        // Teclear = filtro instantáneo local sobre tus cotizaciones (sin esperar al servidor).
        searchInput.addEventListener('input', () => {
            const term = searchInput.value.trim();
            if (term === '') {
                displayQuotes(myQuotes);
                updateStats(myQuotes);
            } else {
                filterLocal(term);
            }
        });

        refreshButton.addEventListener('click', () => {
            AppCache.remove(QUOTES_CACHE_KEY);
            searchInput.value = '';
            loadUserQuotes(null, true);   // sin caché local NI de servidor
        });

        // Deep-link de búsqueda: ?page=dashboard&q=término llega con la búsqueda aplicada
        // (enlaces compartibles a resultados concretos).
        const urlQuery = AppUrl.param('q');
        if (urlQuery) {
            searchInput.value = urlQuery;
            loadUserQuotes(urlQuery);
        } else {
            loadUserQuotes();
        }
    });
    </script>
</body>
</html>
